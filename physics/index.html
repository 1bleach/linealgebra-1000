<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大学物理考试真题 1000 题 · 刷题器</title>
<style>
:root {
  --bg: #0b1220;
  --bg2: #0f172a;
  --card: #16213a;
  --card2: #1c2a47;
  --line: #26365a;
  --text: #e6edf7;
  --muted: #93a4c3;
  --accent: #38bdf8;
  --accent2: #22d3ee;
  --ok: #34d399;
  --bad: #f87171;
  --warn: #fbbf24;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(1200px 600px at 80% -10%, #16305c 0%, var(--bg) 55%) fixed;
  color: var(--text);
  font: 15px/1.7 "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { display: flex; min-height: 100vh; }

/* ---------- 侧栏 ---------- */
.sidebar {
  width: 300px; flex: 0 0 300px; height: 100vh; position: sticky; top: 0;
  overflow-y: auto; padding: 18px 14px 28px;
  background: rgba(10, 17, 33, .86); border-right: 1px solid var(--line);
  backdrop-filter: blur(8px);
}
.brand { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
.logo {
  width: 42px; height: 42px; border-radius: 12px; flex: 0 0 42px;
  display: grid; place-items: center; font-size: 22px; font-weight: 700;
  background: linear-gradient(135deg, #0ea5e9, #6366f1); color: #fff;
  box-shadow: 0 6px 18px rgba(14, 165, 233, .35);
}
.brand h1 { margin: 0; font-size: 17px; letter-spacing: .5px; }
.brand p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

.progress-box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 16px; }
.progress-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.progress-row b { color: var(--accent); font-size: 15px; }
.bar { height: 7px; background: #0b1428; border-radius: 99px; margin: 8px 0 10px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .35s; }
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
.stat b { display: block; font-size: 16px; }
.stat span { font-size: 11px; color: var(--muted); }
.stat:nth-child(1) b { color: var(--accent); }
.stat:nth-child(2) b { color: var(--ok); }
.stat:nth-child(3) b { color: var(--bad); }
.stat:nth-child(4) b { color: var(--warn); }

.side-title { font-size: 12px; color: var(--muted); letter-spacing: 1px; margin: 14px 4px 8px; }
.chapters { display: flex; flex-direction: column; gap: 3px; }
.chap {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 9px;
  border: 1px solid transparent; background: none; text-align: left; color: var(--muted); font-size: 13.5px;
}
.chap:hover { background: var(--card); color: var(--text); }
.chap.active { background: linear-gradient(90deg, rgba(56,189,248,.16), transparent); border-color: rgba(56,189,248,.35); color: var(--text); }
.chap .no { font-size: 11px; color: var(--accent); width: 20px; flex: 0 0 20px; text-align: right; }
.chap .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chap .cnt { font-size: 11px; color: var(--muted); }

.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.mode {
  padding: 7px 6px; border-radius: 9px; border: 1px solid var(--line); background: var(--card);
  color: var(--muted); font-size: 13px;
}
.mode:hover { border-color: var(--accent); color: var(--text); }
.mode.active { background: rgba(56,189,248,.16); border-color: var(--accent); color: var(--accent); }

.filters { display: flex; flex-direction: column; gap: 6px; }
.filters select, .filters input {
  width: 100%; padding: 8px 10px; border-radius: 9px; background: var(--card);
  border: 1px solid var(--line); color: var(--text); outline: none;
}
.filters select:focus, .filters input:focus { border-color: var(--accent); }
.filters .chk {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 9px;
  background: var(--card); border: 1px solid var(--line); font-size: 13px; color: #9db0d0; cursor: pointer;
}
.filters .chk input { width: 15px; height: 15px; padding: 0; margin: 0; accent-color: var(--accent); cursor: pointer; }
.side-foot { margin-top: 16px; display: flex; gap: 8px; }
.ghost {
  flex: 1; padding: 8px; border-radius: 9px; background: none; border: 1px solid var(--line); color: var(--muted); font-size: 12.5px;
}
.ghost:hover { color: var(--text); border-color: var(--accent); }
.ghost.danger:hover { color: var(--bad); border-color: var(--bad); }

/* ---------- 主区 ---------- */
.main { flex: 1; min-width: 0; padding: 22px 30px 60px; max-width: 1080px; }
.topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.topbar .path { font-size: 13px; color: var(--muted); flex: 1; }
.topbar .path b { color: var(--text); }
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); display: grid; place-items: center;
}
.icon-btn:hover { border-color: var(--accent); }
.icon-btn.mobile-only { display: none; }

.card {
  background: linear-gradient(180deg, var(--card), rgba(22, 33, 58, .72));
  border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px;
  box-shadow: var(--shadow);
}
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.pill { font-size: 12px; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.pill.diff3 { color: #86efac; border-color: rgba(134,239,172,.35); }
.pill.diff4 { color: #fbbf24; border-color: rgba(251,191,36,.35); }
.pill.diff5 { color: #fb7185; border-color: rgba(251,113,133,.4); }
.pill.type { color: var(--accent); border-color: rgba(56,189,248,.35); }
.pill.tag { color: #c4b5fd; border-color: rgba(196,181,253,.25); }
.qno { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.stem { font-size: 17px; line-height: 1.85; margin: 4px 0 18px; white-space: pre-wrap; }

.options { display: grid; gap: 10px; }
.opt {
  display: flex; gap: 12px; align-items: flex-start; text-align: left;
  padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card2); transition: border-color .15s, background .15s;
}
.opt:hover { border-color: var(--accent); }
.opt .k {
  width: 26px; height: 26px; flex: 0 0 26px; border-radius: 8px; display: grid; place-items: center;
  background: #0d1a33; color: var(--accent); font-weight: 700; font-size: 13px;
}
.opt.right { border-color: var(--ok); background: rgba(52,211,153,.12); }
.opt.right .k { background: var(--ok); color: #06281c; }
.opt.wrong { border-color: var(--bad); background: rgba(248,113,113,.1); }
.opt.wrong .k { background: var(--bad); color: #2b0707; }
.opt.disabled { pointer-events: none; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.btn {
  padding: 10px 18px; border-radius: 11px; border: 1px solid var(--line); background: var(--card2); color: var(--text);
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: linear-gradient(135deg, #0284c7, #4f46e5); border-color: transparent; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.12); }
.btn.small { padding: 6px 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.spacer { flex: 1; }

.answer {
  margin-top: 18px; border-radius: 14px; border: 1px solid rgba(52,211,153,.35);
  background: rgba(52,211,153,.07); padding: 14px 16px; display: none;
}
.answer.show { display: block; }
.answer h4 { margin: 0 0 8px; font-size: 14px; color: var(--ok); }
.answer .ans-line { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.answer .explain { color: #d7e2f4; white-space: pre-wrap; }
.answer.bad { border-color: rgba(248,113,113,.4); background: rgba(248,113,113,.06); }
.answer.bad h4 { color: var(--bad); }

.self-check { display: flex; gap: 10px; margin-top: 10px; }
.footer-nav { display: flex; gap: 10px; margin-top: 16px; align-items: center; }
.footer-nav .btn { flex: 1; text-align: center; }

/* ---------- 统计面板 ---------- */
.panel { display: none; }
.panel.show { display: block; }
.panel h2 { margin: 0 0 14px; font-size: 20px; }
.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.sum-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.sum-card b { display: block; font-size: 26px; }
.sum-card span { font-size: 12px; color: var(--muted); }
.sum-card:nth-child(1) b { color: var(--accent); }
.sum-card:nth-child(2) b { color: var(--ok); }
.sum-card:nth-child(3) b { color: var(--bad); }
.sum-card:nth-child(4) b { color: var(--warn); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
td.num { font-variant-numeric: tabular-nums; }
.mini-bar { height: 6px; background: #0b1428; border-radius: 99px; overflow: hidden; min-width: 90px; }
.mini-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }

.empty { text-align: center; color: var(--muted); padding: 60px 0; }

@media (max-width: 900px) {
  .app { display: block; }
  .sidebar {
    position: fixed; z-index: 20; left: 0; top: 0; transform: translateX(-100%);
    transition: transform .25s; box-shadow: var(--shadow); width: 84vw; max-width: 330px;
  }
  body.nav-open .sidebar { transform: none; }
  body.nav-open::after {
    content: ""; position: fixed; inset: 0; z-index: 15; background: rgba(2, 6, 18, .6);
  }
  .main { padding: 16px 14px 60px; }
  .icon-btn.mobile-only { display: grid; }
  .summary { grid-template-columns: repeat(2, 1fr); }
  .stem { font-size: 16px; line-height: 1.75; }
  .card { padding: 16px; border-radius: 14px; }
  /* 手机触控尺寸 */
  .opt { padding: 14px 14px; font-size: 15px; }
  .opt .k { width: 26px; height: 26px; font-size: 13px; }
  .btn { padding: 13px 18px; font-size: 15px; }
  .btn.small { padding: 10px 14px; font-size: 13.5px; }
  .chap { padding: 10px 8px; }
  .mode { padding: 11px 8px; }
  .footer-nav { gap: 8px; }
  .footer-nav .btn { flex: 1; }
  .topbar { position: sticky; top: 0; z-index: 8; background: rgba(11, 16, 32, .94); padding: 6px 0 8px; }
  .answer .explain { font-size: 13.5px; line-height: 1.85; }
  .meta { gap: 6px; }
  .pill { font-size: 11px; }
}

@media (max-width: 420px) {
  .main { padding: 12px 10px 56px; }
  .card { padding: 13px; }
  .stem { font-size: 15.5px; }
  .opt { font-size: 14.5px; padding: 13px 12px; }
  .footer-nav .btn { padding: 12px 8px; font-size: 14px; }
}

html { -webkit-tap-highlight-color: transparent; }
body { -webkit-text-size-adjust: 100%; }


</style>
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">Φ</div>
      <div class="brand-text">
        <h1>大学物理 1000 题</h1>
        <p>真题风格 · 一题一答案 · 难度 3–5</p>
      </div>
    </div>

    <div class="progress-box">
      <div class="progress-row"><span>总进度</span><b id="progText">0 / 1000</b></div>
      <div class="bar"><i id="progBar"></i></div>
      <div class="stat-row">
        <div class="stat"><b id="statDone">0</b><span>已做</span></div>
        <div class="stat"><b id="statRight">0</b><span>做对</span></div>
        <div class="stat"><b id="statWrong">0</b><span>错题</span></div>
        <div class="stat"><b id="statStar">0</b><span>收藏</span></div>
      </div>
    </div>

    <div class="side-title">章节</div>
    <nav class="chapters" id="chapters"></nav>

    <div class="side-title">模式</div>
    <div class="modes" id="modes">
      <button class="mode active" data-mode="all">顺序刷题</button>
      <button class="mode" data-mode="random">随机抽题</button>
      <button class="mode" data-mode="wrong">只刷错题</button>
      <button class="mode" data-mode="star">只刷收藏</button>
      <button class="mode" data-mode="todo">只刷没做</button>
      <button class="mode" data-mode="exam">模拟考试</button>
    </div>

    <div class="side-title">筛选</div>
    <div class="filters">
      <select id="diffFilter">
        <option value="0">全部难度</option>
        <option value="5">难度 5 · 综合硬题</option>
        <option value="4">难度 4 · 两步计算</option>
        <option value="3">难度 3 · 基础题</option>
      </select>
      <select id="typeFilter">
        <option value="">全部题型</option>
        <option value="choice">选择题</option>
        <option value="calc">计算题</option>
      </select>
      <label class="chk"><input type="checkbox" id="diffFirst" checked> 难度优先（5 → 3）</label>
      <input type="search" id="searchBox" placeholder="搜索题干 / 解析 / 知识点…">
    </div>

    <div class="side-foot">
      <button id="statsBtn" class="ghost">学习统计</button>
      <button id="resetBtn" class="ghost danger">清空记录</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="icon-btn mobile-only" id="menuBtn" title="章节">☰</button>
      <div class="path" id="pathText">全部章节</div>
      <button class="icon-btn" id="backBtn" title="上一题">←</button>
      <button class="icon-btn" id="nextBtn" title="下一题">→</button>
    </div>

    <section id="quizView">
      <div class="card" id="card">
        <div class="empty">题库加载中…</div>
      </div>
    </section>

    <section id="statsView" class="panel">
      <h2>学习统计</h2>
      <div class="summary">
        <div class="sum-card"><b id="sumDone">0</b><span>已做</span></div>
        <div class="sum-card"><b id="sumRate">0%</b><span>正确率</span></div>
        <div class="sum-card"><b id="sumWrong">0</b><span>错题</span></div>
        <div class="sum-card"><b id="sumStar">0</b><span>收藏</span></div>
      </div>
      <div class="card" style="padding:14px 16px">
        <table>
          <thead><tr><th>章节</th><th style="width:90px">进度</th><th style="width:120px">完成度</th><th style="width:64px">已做</th><th style="width:64px">正确率</th></tr></thead>
          <tbody id="statsBody"></tbody>
        </table>
      </div>
    </section>
  </main>

<script>window.BANK=[{"chapter":1,"chapterName":"质点运动学","questions":[{"id":"c01q001","type":"choice","difficulty":3,"tags":["平均速度与平均速率","折返判断"],"stem":"质点沿 x 轴运动，其位置随时间的变化为 x = 2.00 + 3.00t − 1.20t²（SI 单位）。从 t = 0 到 t = 3.00 s，质点的平均速度和平均速率分别为","options":["−0.600 m/s，1.85 m/s","−0.600 m/s，1.23 m/s","1.85 m/s，−0.600 m/s","−0.600 m/s，0.600 m/s"],"answer":"A","explain":"v = dx/dt = 3.00 − 2.40t，令 v = 0 得折返时刻 t = 1.25 s。\nΔx = x(3.00) − x(0) = 0.200 − 2.00 = −1.80 m，平均速度 = −1.80/3.00 = −0.600 m/s。\n折返点 x(1.25) = 3.875 m，路程 = (3.875 − 2.00) + (3.875 − 0.200) = 5.55 m，平均速率 = 5.55/3.00 = 1.85 m/s。\n易错点：平均速率不是平均速度的大小，必须先判断折返、再把各段路程相加。"},{"id":"c01q002","type":"choice","difficulty":3,"tags":["竖直上抛","对称性"],"stem":"以 12.0 m/s 的初速度竖直上抛一小球，忽略空气阻力，g 取 9.80 m/s²。小球两次经过抛出点上方 5.00 m 处的时间间隔为","options":["1.07 s","2.45 s","0.692 s","1.38 s"],"answer":"D","explain":"由 v² = v₀² − 2gh 得该处速率 v = √(12.0² − 2×9.80×5.00) = √46.0 = 6.78 m/s。\n上升、下降两次经过同一点，速度等大反向，时间间隔 Δt = 2v/g = 2×6.78/9.80 = 1.38 s。\n易错点：0.692 s 只算了从该点升到最高点的时间；1.07 s 误把 (v₀ − v)/g 的两倍当间隔。"},{"id":"c01q003","type":"choice","difficulty":3,"tags":["相对速度","速度合成"],"stem":"雨滴相对地面竖直匀速下落，速率为 7.20 m/s。某人骑车匀速前进，感觉雨滴迎面斜落，与竖直方向的夹角为 30.0°。骑车人的速率为","options":["3.60 m/s","6.24 m/s","12.5 m/s","4.16 m/s"],"answer":"D","explain":"取地面为静止参考系，v雨地 = (0, −7.20)，v人地 = (u, 0)，则 v雨人 = (−u, −7.20)。\n相对速度与竖直方向夹角满足 tan30.0° = u/7.20，故 u = 7.20×0.5774 = 4.16 m/s。\n易错点：3.60 m/s 用 sin30.0°（把夹角当与水平方向）；6.24 m/s 用 cos30.0°；12.5 m/s 用 cot30.0°。"},{"id":"c01q004","type":"choice","difficulty":3,"tags":["a–t 图像","速度增量"],"stem":"质点沿 x 轴运动，t = 0 时速度为 3.00 m/s。其加速度随时间变化：0 至 4.00 s 内由 0 均匀增大到 6.00 m/s²，4.00 s 至 8.00 s 内由 6.00 m/s² 均匀减小到 0。t = 8.00 s 时质点的速度为","options":["51.0 m/s","27.0 m/s","24.0 m/s","15.0 m/s"],"answer":"B","explain":"a–t 图线与时间轴围成的面积等于速度增量，该图形是底 8.00 s、高 6.00 m/s² 的三角形。\nΔv = ½×8.00×6.00 = 24.0 m/s，故 v = 3.00 + 24.0 = 27.0 m/s。\n易错点：24.0 m/s 漏加初速度；15.0 m/s 只算了前 4.00 s 的面积；51.0 m/s 把峰值当平均加速度。"},{"id":"c01q005","type":"choice","difficulty":3,"tags":["速度与加速度的矢量性","夹角"],"stem":"质点在 Oxy 平面内的位矢为 r = (3.00t) i + (4.00 − 2.00t²) j（SI 单位）。t = 1.00 s 时，速度与加速度之间的夹角为","options":["36.9°","126.9°","90.0°","53.1°"],"answer":"A","explain":"v = dr/dt = 3.00 i − 4.00t j，a = dv/dt = −4.00 j。t = 1.00 s 时 v = (3.00, −4.00)，a = (0, −4.00)。\ncosθ = (v·a)/(|v||a|) = 16.0/(5.00×4.00) = 0.800，θ = 36.9°。\n易错点：53.1° 是余角（直接用分量比 3/4 取 arctan）；126.9° 是把公式中的点积符号取反。"},{"id":"c01q006","type":"choice","difficulty":3,"tags":["平抛运动","斜面几何约束"],"stem":"倾角为 37.0° 的斜面，从斜面顶端沿水平方向以 6.00 m/s 抛出一个小球，小球落在斜面上。飞行时间为（sin37.0° = 0.602，cos37.0° = 0.799，g = 9.80 m/s²）","options":["0.923 s","1.63 s","0.461 s","0.737 s"],"answer":"A","explain":"落点在斜面上，竖直位移与水平位移之比等于 tan37.0°：½gt²/(v₀t) = tan37.0°。\n解得 t = 2v₀tan37.0°/g = 2×6.00×0.7536/9.80 = 0.923 s。\n易错点：0.461 s 漏掉因子 2；1.63 s 把 tan37.0° 写进分母；0.737 s 用 sin37.0° 冒充 tan37.0°。"},{"id":"c01q007","type":"choice","difficulty":4,"tags":["斜抛运动","竖直墙面约束"],"stem":"在水平地面上以 18.0 m/s 的初速度、50.0° 的抛射角斜向上抛出一小球，忽略空气阻力，g = 9.80 m/s²。小球恰好落在正前方 20.0 m 处的竖直墙面上，击中点离地面的高度为（sin50.0° = 0.766，cos50.0° = 0.643）","options":["15.4 m","23.8 m","6.47 m","9.20 m"],"answer":"D","explain":"水平方向匀速：t = x/(v₀cos50.0°) = 20.0/(18.0×0.643) = 1.73 s。\n竖直方向 y = v₀sin50.0°·t − ½gt² = 13.8×1.73 − 4.90×2.99 = 23.8 − 14.6 = 9.20 m。\n易错点：23.8 m 漏掉重力项；15.4 m 把 ½gt² 写成 gt；6.47 m 把 sin 与 cos 用反。"},{"id":"c01q008","type":"choice","difficulty":4,"tags":["追及问题","联立运动方程"],"stem":"平直公路上，汽车 A 以 16.0 m/s 匀速行驶。汽车 B 在 A 后方 20.0 m 处，以 4.00 m/s 的速率同向行驶，并从此时开始以 1.60 m/s² 匀加速。两车同时开始计时，B 追上 A 所需时间为","options":["7.50 s","1.67 s","13.1 s","16.5 s"],"answer":"D","explain":"以 B 的出发点为原点：x_B = 4.00t + 0.800t²，x_A = 20.0 + 16.0t。\n令两者相等：0.800t² − 12.0t − 20.0 = 0，即 t² − 15.0t − 25.0 = 0。\n取正根 t = (15.0 + √325)/2 = 16.5 s，此时 v_B = 4.00 + 1.60×16.5 = 30.4 m/s。\n易错点：7.50 s 是两车速度相等的时刻（此时相距最远）；1.67 s 用 20.0/12.0 一步除完。"},{"id":"c01q009","type":"choice","difficulty":4,"tags":["a = a(v)","v dv/dx 换元","阻力模型"],"stem":"质点沿直线运动，加速度与速度满足 a = −kv²，k = 0.0400 m⁻¹，t = 0 时速率为 12.0 m/s。速率减为 6.00 m/s 的过程中质点走过的距离为","options":["8.66 m","34.7 m","17.3 m","25.0 m"],"answer":"C","explain":"用 a = v dv/dx 换元：v dv/dx = −kv²，约去一个 v 得 dv/dx = −kv，即 dx = −dv/(kv)。\n积分 x = (1/k)ln(v₀/v) = (1/0.0400)×ln2 = 25.0×0.6931 = 17.3 m。\n关键：v 被约掉后 a 与 v² 成正比，速度按指数衰减而位移按对数增长。\n易错点：8.66 m 把 ln2 除以 2；25.0 m 直接取 1/k；34.7 m 用 2ln2/k。"},{"id":"c01q010","type":"choice","difficulty":4,"tags":["曲率半径","平抛运动"],"stem":"小球以 12.0 m/s 的速率水平抛出，g = 9.80 m/s²。抛出后 1.20 s 时轨迹的曲率半径为","options":["80.6 m","40.3 m","14.7 m","28.8 m"],"answer":"B","explain":"t = 1.20 s 时 vₓ = 12.0 m/s，v_y = gt = 11.8 m/s，v = √(144 + 139) = 16.8 m/s。\n法向加速度 a_n = g cosα，其中 cosα = vₓ/v = 0.714，故 a_n = 7.00 m/s²。\n曲率半径 ρ = v²/a_n = 282/7.00 = 40.3 m（等价于 ρ = v³/(v₀g)）。\n易错点：28.8 m 用 ρ = v²/g（把 g 全部当法向）；14.7 m 用初速算 v₀²/g。"},{"id":"c01q011","type":"choice","difficulty":4,"tags":["绳拉船","速度关联"],"stem":"岸上高处有一滑轮，滑轮轴高出船用系绳点 6.00 m，绳子跨过滑轮被人以 1.20 m/s 的恒定速率收短。当绳与水平方向夹角为 30.0° 时，船速大小为","options":["2.40 m/s","1.04 m/s","1.39 m/s","1.20 m/s"],"answer":"C","explain":"绳长 l 与船到滑轮正下方的水平距离 x 满足 l² = x² + h²，微分得 2l(dl/dt) = 2x(dx/dt)。\nv船 = |dx/dt| = (l/x)|dl/dt| = u/cosθ，其中 cosθ = x/l。\n代入 θ = 30.0°：v = 1.20/0.866 = 1.39 m/s。\n易错点：1.04 m/s 把投影关系写反成 u cosθ；2.40 m/s 用 sinθ；1.20 m/s 误认为船速等于收绳速率。"},{"id":"c01q012","type":"choice","difficulty":4,"tags":["杆端滑动","速度关联"],"stem":"长 2.50 m 的细杆，A 端靠在竖直墙上，B 端放在水平地面上。当杆与墙的夹角为 30.0° 时，A 端沿墙以 1.20 m/s 的速率下滑，此时 B 端沿地面运动的速率为","options":["1.20 m/s","3.60 m/s","2.08 m/s","0.693 m/s"],"answer":"C","explain":"设杆与墙的夹角为 θ，则 x_B = L sinθ，y_A = L cosθ。\n由 dy_A/dt = −L sinθ·θ̇ = −1.20 得 θ̇ = 1.20/(2.50×0.500) = 0.960 rad/s。\nv_B = L cosθ·θ̇ = 2.50×0.866×0.960 = 2.08 m/s。\n易错点：0.693 m/s 用 v_B = v_A tanθ；3.60 m/s 用 v_A/sinθ。"},{"id":"c01q013","type":"choice","difficulty":4,"tags":["切向与法向加速度","矢量投影"],"stem":"质点在 Oxy 平面内运动，r = (4.00t) i + (2.00t − 0.500t²) j（SI 单位）。t = 3.00 s 时质点的切向加速度和法向加速度分别为","options":["0.243 m/s²，0.500 m/s²","0.243 m/s²，0.970 m/s²","1.00 m/s²，0","0，1.00 m/s²"],"answer":"B","explain":"v = (4.00, 2.00 − t)，t = 3.00 s 时 v = (4.00, −1.00)，|v| = √17 = 4.12 m/s；a = (0, −1.00)，|a| = 1.00 m/s²。\na_t = (v·a)/|v| = 1.00/4.12 = 0.243 m/s²。\na_n = |v × a|/|v| = |4.00×(−1.00)|/4.12 = 0.970 m/s²，且 a_t² + a_n² = |a|² 自洽。\n易错点：0 与 1.00 是把总加速度整体当作切向或法向；0.500 是漏掉投影直接取速度分量。"},{"id":"c01q014","type":"choice","difficulty":4,"tags":["v–t 图像","位移与路程"],"stem":"质点沿 x 轴运动，其速度随时间变化：0 至 3.00 s 内由 8.00 m/s 均匀减小到 −4.00 m/s，3.00 s 至 6.00 s 内保持 −4.00 m/s 不变。0 至 6.00 s 内质点的位移和路程分别为","options":["−6.00 m，22.0 m","6.00 m，22.0 m","−6.00 m，14.0 m","−6.00 m，6.00 m"],"answer":"A","explain":"加速度 a = (−4.00 − 8.00)/3.00 = −4.00 m/s²，速度过零时刻 t = 8.00/4.00 = 2.00 s。\n位移 = v–t 各段面积代数和：½×2.00×8.00 − ½×1.00×4.00 − 4.00×3.00 = 8.00 − 2.00 − 12.0 = −6.00 m。\n路程 = 面积绝对值之和：8.00 + 2.00 + 12.0 = 22.0 m。\n易错点：6.00 m 只算位移大小；14.0 m 漏掉 2.00 s 至 3.00 s 之间的 2.00 m。"},{"id":"c01q015","type":"choice","difficulty":4,"tags":["圆周运动","变角加速"],"stem":"质点沿半径 0.600 m 的圆周运动，其角位置随时间变化为 θ = 0.800t + 0.500t³（rad）。t = 1.50 s 时质点的切向加速度和总加速度大小分别为","options":["2.70 m/s²，10.8 m/s²","2.70 m/s²，13.2 m/s²","2.70 m/s²，10.5 m/s²","4.50 m/s²，10.8 m/s²"],"answer":"A","explain":"ω = dθ/dt = 0.800 + 1.50t²，α = dω/dt = 3.00t。t = 1.50 s 时 ω = 4.18 rad/s，α = 4.50 rad/s²。\na_t = αr = 2.70 m/s²；a_n = ω²r = 17.4×0.600 = 10.5 m/s²。\n总加速度 a = √(a_t² + a_n²) = √(7.29 + 109.4) = 10.8 m/s²。\n易错点：10.5 m/s² 只取法向分量；4.50 m/s² 是忘乘半径；13.2 m/s² 把两个分量直接相加。"},{"id":"c01q016","type":"choice","difficulty":4,"tags":["斜抛运动","射程与最大高度"],"stem":"以 24.0 m/s 的初速度、35.0° 的抛射角斜向上抛出一物体，落回与抛出点等高的水平面，忽略空气阻力，g = 9.80 m/s²。物体的水平射程和最大高度分别为（sin35.0° = 0.574，cos35.0° = 0.819）","options":["55.2 m，9.67 m","27.6 m，9.67 m","55.2 m，4.84 m","48.1 m，9.67 m"],"answer":"A","explain":"v₀ₓ = 24.0×0.819 = 19.7 m/s，v₀y = 24.0×0.574 = 13.8 m/s。\n射程 R = v₀²sin(2×35.0°)/g = 576×0.940/9.80 = 55.2 m；飞行时间 T = 2v₀y/g = 2.81 s，v₀ₓT 与之相符。\n最大高度 H = v₀y²/(2g) = 189.6/19.6 = 9.67 m。\n易错点：4.84 m 把 H 算成 v₀y²/(4g)；27.6 m 用 sin²35.0° 代替 sin70.0°；48.1 m 用 cos70.0°。"},{"id":"c01q017","type":"choice","difficulty":4,"tags":["平均速度矢量","瞬时速度"],"stem":"质点在 Oxy 平面内的位矢为 r = (2.40t²) i + (1.80t) j（SI 单位）。t = 0 至 t = 2.00 s 内的平均速度大小，与 t = 2.00 s 时的瞬时速度大小分别为","options":["9.77 m/s，5.13 m/s","5.13 m/s，11.4 m/s","4.80 m/s，9.77 m/s","5.13 m/s，9.77 m/s"],"answer":"D","explain":"r(0) = 0，r(2.00) = (9.60, 3.60)，Δr = (9.60, 3.60)，平均速度 = Δr/Δt = (4.80, 1.80)，大小 √(23.0 + 3.24) = 5.13 m/s。\nv = dr/dt = (4.80t) i + 1.80 j，t = 2.00 s 时 v = (9.60, 1.80)，大小 √(92.2 + 3.24) = 9.77 m/s。\n易错点：11.4 m/s 是把两个分量数值相加；4.80 m/s 只取水平分量。"},{"id":"c01q018","type":"choice","difficulty":4,"tags":["小船渡河","最短时间条件"],"stem":"河宽 120 m，水流速率为 2.40 m/s，船在静水中的速率为 1.80 m/s。若要求渡河时间最短，最短时间和此时船被水冲下的距离分别为","options":["66.7 s，160 m","40.0 s，96.0 m","66.7 s，0","50.0 s，120 m"],"answer":"A","explain":"渡河时间由垂直河岸的分速度决定，船头垂直河岸时该分速度最大，等于 1.80 m/s。\nt_min = d/v船 = 120/1.80 = 66.7 s。\n此时沿河岸方向随水漂流：x = u·t = 2.40×66.7 = 160 m。\n易错点：40.0 s 用合速度 √(2.40² + 1.80²) = 3.00 m/s 除河宽；注意船速小于水速，船不可能垂直到达正对岸，0 漂移是错的。"},{"id":"c01q019","type":"choice","difficulty":4,"tags":["圆周运动","角量与线量"],"stem":"半径 0.250 m 的圆盘从静止开始以 4.00 rad/s² 的恒定角加速度转动。t = 2.00 s 时盘边缘一点的加速度大小，以及这段时间内圆盘转过的角度分别为","options":["16.0 m/s²，8.00 rad","17.0 m/s²，8.00 rad","16.0 m/s²，16.0 rad","1.00 m/s²，8.00 rad"],"answer":"A","explain":"ω = αt = 8.00 rad/s，a_n = ω²r = 64.0×0.250 = 16.0 m/s²；a_t = αr = 1.00 m/s²。\na = √(16.0² + 1.00²) = 16.0 m/s²，切向分量只占约 0.4%，但不能直接写成 17.0 m/s²。\nθ = ½αt² = ½×4.00×4.00 = 8.00 rad。\n易错点：1.00 m/s² 只算切向；17.0 m/s² 把分量直接相加；16.0 rad 用 θ = ωt（漏掉因子 ½）。"},{"id":"c01q020","type":"choice","difficulty":4,"tags":["变加速运动","线性阻力","积分法"],"stem":"小球竖直向上运动，除重力外还受大小与速率成正比的空气阻力，加速度为 a = −g − kv，k = 0.200 s⁻¹，初速率 20.0 m/s，g = 9.80 m/s²。小球能上升的最大高度为","options":["24.0 m","20.4 m","14.5 m","16.1 m"],"answer":"D","explain":"分离变量 dv/(g + kv) = −dt，积分得上升到最高点的时间 T = (1/k)ln(1 + kv₀/g) = 5.00×ln1.408 = 1.71 s。\n速度 v = (v₀ + g/k)e^(−kt) − g/k，再积分得 y = (v₀ + g/k)(1 − e^(−kT))/k − (g/k)T。\n代入 e^(−kT) = g/(g + kv₀) = 0.710：y = 69.0×0.290/0.200 − 49.0×1.71 = 100 − 83.9 = 16.1 m。\n易错点：20.4 m 忽略阻力（v₀²/2g）；14.5 m 把阻力当成全程恒定的额外减速度。"},{"id":"c01q021","type":"choice","difficulty":4,"tags":["x–t 图像","平均速度与平均速率"],"stem":"质点沿 x 轴运动，其位置—时间图线由两段直线组成：0 至 2.00 s 内从 x = 0 匀变到 x = 8.00 m，2.00 s 至 5.00 s 内从 x = 8.00 m 匀变到 x = 2.00 m。0 至 5.00 s 内质点的平均速度和平均速率分别为","options":["0.400 m/s，0.400 m/s","0.400 m/s，2.80 m/s","1.60 m/s，2.80 m/s","2.80 m/s，0.400 m/s"],"answer":"B","explain":"平均速度 = Δx/Δt = (2.00 − 0)/5.00 = 0.400 m/s。x–t 图斜率即速度：前段 +4.00 m/s，后段 −2.00 m/s。\n路程 = 8.00 + 6.00 = 14.0 m，平均速率 = 14.0/5.00 = 2.80 m/s。\n易错点：0.400 m/s 把平均速度当作平均速率；1.60 m/s 只用第一段位移 8.00 m 除以 5.00 s。"},{"id":"c01q022","type":"choice","difficulty":5,"tags":["运动的独立性","恒定水平加速度"],"stem":"小球从 19.6 m 高处水平抛出，初速度 8.00 m/s 沿水平向东。由于恒定水平风，小球具有向东 3.00 m/s² 的恒定水平加速度，竖直方向加速度为 9.80 m/s² 向下。小球落地时的水平位移和速度大小分别为","options":["22.0 m，19.6 m/s","16.0 m，21.2 m/s","22.0 m，24.1 m/s","28.0 m，24.1 m/s"],"answer":"C","explain":"竖直方向与水平方向相互独立，落地时间由竖直方向决定：t = √(2h/g) = √(2×19.6/9.80) = 2.00 s。\n水平方向是初速 8.00 m/s、加速度 3.00 m/s² 的匀加速：x = 8.00×2.00 + ½×3.00×2.00² = 22.0 m。\n落地速度分量 vₓ = 8.00 + 3.00×2.00 = 14.0 m/s，v_y = 19.6 m/s，v = √(196 + 384) = 24.1 m/s。\n易错点：16.0 m 忽略风力；19.6 m/s 只取竖直分量；28.0 m 把水平位移算成 8.00t + 3.00t²（漏 ½）。"},{"id":"c01q023","type":"choice","difficulty":5,"tags":["斜抛运动","可达区域","极值"],"stem":"在水平地面上以初速度 v₀ 抛出一小球，要求击中正前方水平距离 30.0 m、高 15.0 m 的目标点，忽略空气阻力，g = 9.80 m/s²。所需的最小初速度和对应的抛射角为","options":["24.4 m/s，58.3°","21.8 m/s，58.3°","21.8 m/s，31.7°","18.1 m/s，45.0°"],"answer":"B","explain":"轨迹方程 y = x tanθ − gx²/(2v₀²cos²θ)，把 tanθ 当未知量，方程有实根的条件给出可达区域 v₀² ≥ g(y + √(x² + y²))。\nv₀min = √(9.80×(15.0 + 33.5)) = √476 = 21.8 m/s。\n对应 tanθ = (y + √(x² + y²))/x = 48.5/30.0 = 1.62，θ = 58.3°。\n易错点：31.7° 是与 58.3° 互余的另一根（也击中，但不是最小初速的抛射角）；45.0° 只在同高度平射时最优。"},{"id":"c01q024","type":"choice","difficulty":5,"tags":["追及问题","二次方程根的讨论"],"stem":"汽车 A 以 10.0 m/s 匀速行驶，经过某点时，后方 10.0 m 处的汽车 B 正以 20.0 m/s 同向行驶，同时开始以 1.20 m/s² 匀减速（B 在停止前一直运动）。两车相遇的时刻为","options":["只相遇一次，t = 15.6 s","1.07 s 和 15.6 s","15.6 s 和 20.8 s","1.07 s 和 16.7 s"],"answer":"B","explain":"以 A 经过点为原点：x_A = 10.0t，x_B = −10.0 + 20.0t − 0.600t²。\n令两者相等得 0.600t² − 10.0t + 10.0 = 0，即 t² − 16.7t + 16.7 = 0。\n判别式 278 − 66.7 = 211 > 0，两根 t = (16.7 ± 14.5)/2 = 1.07 s 与 15.6 s。\nt = 15.6 s 时 v_B = 20.0 − 1.20×15.6 = 1.3 m/s > 0，尚未停止，两次相遇均有效。\n易错点：只保留一根；16.7 s 是 B 停下的时刻，不是相遇时刻。"},{"id":"c01q025","type":"choice","difficulty":5,"tags":["杆端滑动","加速度关联"],"stem":"长 2.50 m 的细杆，A 端靠在竖直墙上，B 端放在水平地面上。A 端沿墙以 1.20 m/s 的恒定速率下滑，当杆与墙的夹角为 30.0° 时，B 端沿地面运动的加速度大小为","options":["2.30 m/s²","0（B 端做匀速运动）","4.61 m/s²","1.60 m/s²"],"answer":"C","explain":"x_B = L sinθ，y_A = L cosθ，由 ẏ_A = −L sinθ·θ̇ = −v_A 得 θ̇ = v_A/(L sinθ)。\nv_B = ẋ_B = L cosθ·θ̇ = v_A cotθ。\n对 t 求导：a_B = −v_A csc²θ·θ̇ = −v_A²/(L sin³θ) = −1.44/(2.50×0.125) = −4.61 m/s²。\n负号表示指向墙，大小为 4.61 m/s²。\n易错点：A 端匀速不代表 B 端匀速；2.30 m/s² 只对 cosθ 求导、漏掉 θ̇ 随 θ 变化的那一项。"},{"id":"c01q026","type":"choice","difficulty":5,"tags":["相对加速度","非惯性系"],"stem":"平板车以 2.00 m/s² 的加速度沿水平方向加速前进，车上的人相对车以 4.00 m/s 的初速度竖直上抛一小球。小球落回抛出点高度所需的时间，以及这段时间内小球相对车的水平偏移分别为（g = 9.80 m/s²）","options":["0.816 s，0.666 m","0.500 s，0.500 m","0.678 s，0.460 m","0.816 s，0"],"answer":"A","explain":"车沿水平方向加速，惯性力只有水平分量，竖直方向球仍只受重力，故往返时间 t = 2v₀/g = 2×4.00/9.80 = 0.816 s。\n水平方向球与车初速相同、球不受水平力，t 内车比球多前进 ½at² = ½×2.00×0.816² = 0.666 m，球相对车向后偏 0.666 m。\n易错点：0.678 s 把水平加速度误当作竖直方向的等效重力（应得 g′ = √(g² + a²) 且方向斜向后下，竖直分量仍为 g）；0 误认为球随车一起前进。"},{"id":"c01q027","type":"choice","difficulty":5,"tags":["斜面上的斜抛","最大射程","极值"],"stem":"倾角 30.0° 的长斜面，从斜面底端沿斜面上方抛出一小球，初速率 20.0 m/s，g = 9.80 m/s²。小球沿斜面方向的最大射程，以及对应的抛射角（相对水平面）为","options":["31.4 m，60.0°","40.8 m，45.0°","27.2 m，60.0°","13.6 m，60.0°"],"answer":"C","explain":"取沿斜面为 x′ 轴、垂直斜面为 y′ 轴，重力分量为 g sinα（沿斜面向下）与 g cosα（垂直斜面向下）。\n射程 R = (v₀²/(g cos²α))[sin(2θ − α) − sinα]，当 2θ − α = 90° 即 θ = 45° + α/2 = 60.0° 时取最大。\nR_max = v₀²/(g(1 + sinα)) = 400/(9.80×1.50) = 27.2 m。\n易错点：40.8 m 是平地上的最大射程；13.6 m 漏掉分母中的 sinα 项。"},{"id":"c01q028","type":"choice","difficulty":5,"tags":["a = a(v)","极限速度","积分法"],"stem":"质点从静止开始沿直线运动，加速度与速度满足 a = 4.00 − 0.500v（SI 单位）。质点能达到的极限速度，以及速度达到极限值 90% 所需的时间分别为","options":["4.00 m/s，4.61 s","8.00 m/s，4.61 s","8.00 m/s，6.93 s","8.00 m/s，2.30 s"],"answer":"B","explain":"极限速度对应 a = 0，即 v∞ = 4.00/0.500 = 8.00 m/s。\n分离变量 dv/(v∞ − v) = 0.500dt，积分得 v = v∞(1 − e^(−0.500t))。\n令 v = 0.900v∞：e^(−0.500t) = 0.100，t = ln10/0.500 = 4.61 s。\n易错点：2.30 s 漏掉因子 2（把 ln√10 当 ln10）；4.00 m/s 把加速度的常数项当极限速度。"},{"id":"c01q029","type":"choice","difficulty":5,"tags":["曲率半径","斜抛运动的极值"],"stem":"以 20.0 m/s 的初速度、60.0° 的抛射角斜向上抛出一物体，g = 9.80 m/s²，忽略空气阻力。轨迹上曲率半径最小的位置及该最小值为","options":["轨迹最高点，40.8 m","抛出点，81.6 m","轨迹最高点，10.2 m","落地点，20.4 m"],"answer":"C","explain":"ρ = v²/a_n，其中 a_n = g cosφ（φ 为速度与水平方向的夹角）。最高点处 φ = 0、a_n 最大而 v 最小，故 ρ 最小。\n最高点速率 v = v₀cos60.0° = 10.0 m/s，ρ_min = v²/g = 100/9.80 = 10.2 m。\n抛出点：a_n = g cos60.0° = 4.90 m/s²，ρ = 400/4.90 = 81.6 m，并不是最小值。\n易错点：40.8 m 用 v₀²/g；20.4 m 用 (v₀cos60.0°)²/(2g)。"},{"id":"c01q030","type":"choice","difficulty":5,"tags":["a = a(x)","积分法","极值判断"],"stem":"质点沿 x 轴运动，加速度与位置满足 a = 6.00 − 2.00x（SI 单位），t = 0 时质点位于 x = 0 处且速度为零。质点速率最大时的位置和最大速率为","options":["x = 6.00 m，4.24 m/s","x = 3.00 m，6.00 m/s","x = 3.00 m，3.00 m/s","x = 3.00 m，4.24 m/s"],"answer":"D","explain":"由 a = v dv/dx 得 v dv = (6.00 − 2.00x)dx，积分并用 x = 0、v = 0 定常数：v² = 12.0x − 2.00x²。\n速率最大处 a = 0（v² 取极大），即 x = 3.00 m；此处 v² = 36.0 − 18.0 = 18.0。\nv_max = √18.0 = 4.24 m/s。\n易错点：3.00 m/s 用 v² = 6x − x²（漏掉积分因子 2）；6.00 m/s 把 a 的初值当作速率上限。"},{"id":"c01q031","type":"choice","difficulty":5,"tags":["相对运动","抛体","最近距离"],"stem":"在水平地面上，A 球以 30.0 m/s 的初速度、60.0° 的抛射角斜向上抛出；同时 B 球从 A 正前方水平距离 40.0 m 处竖直上抛，初速度 15.0 m/s。两球在空中相距的最近距离为（g = 9.80 m/s²）","options":["0（两球相碰）","23.6 m","13.9 m","40.0 m"],"answer":"B","explain":"两球都只受重力，相对加速度为零，相对运动是匀速直线运动。\nv_A = (15.0, 26.0)，v_B = (0, 15.0)，v_BA = (−15.0, −11.0) m/s，|v_BA| = 18.6 m/s；r_BA0 = (40.0, 0)。\n最近距离 d = |r_BA0 × v_BA|/|v_BA| = |40.0×(−11.0)|/18.6 = 23.6 m。\n对应时刻 t = −(r_BA0·v_BA)/|v_BA|² = 600/346 = 1.74 s，此时两球均未落地。\n易错点：13.9 m 只算水平方向的接近量；40.0 m 是初始距离，不是最近距离。"},{"id":"c01q032","type":"choice","difficulty":5,"tags":["圆周运动","自然坐标 s–t","变速率"],"stem":"半径 2.00 m 的圆盘由静止开始转动，其边缘一点的速率按 v = 3.00t²（SI 单位）增长。t = 2.00 s 时该点的总加速度大小，以及从开始到此时圆盘转过的角度分别为","options":["12.0 m/s²，4.00 rad","73.0 m/s²，4.00 rad","84.0 m/s²，4.00 rad","73.0 m/s²，8.00 rad"],"answer":"B","explain":"v = 3.00t²，a_t = dv/dt = 6.00t = 12.0 m/s²（t = 2.00 s）。\na_n = v²/r = 12.0²/2.00 = 72.0 m/s²。\n总加速度 a = √(144 + 5184) = 73.0 m/s²。\n弧长 s = ∫v dt = t³ = 8.00 m，θ = s/r = 4.00 rad。\n易错点：12.0 m/s² 只算切向；84.0 m/s² 把分量相加；8.00 rad 用弧长数值冒充角度。"},{"id":"c01q033","type":"choice","difficulty":5,"tags":["相对运动","最近距离","极值"],"stem":"在平静湖面上，甲船以 12.0 km/h 向东匀速航行，乙船以 9.00 km/h 向北匀速航行。t = 0 时乙船位于甲船正南 3.00 km 处。此后两船相距的最近距离为","options":["3.00 km","0","1.80 km","2.40 km"],"answer":"D","explain":"以甲船为参考系，v_BA = v_B − v_A = (−12.0, 9.00) km/h，初始相对位置 r₀ = (0, −3.00) km。\n最近距离是 r₀ 到相对速度方向的垂直距离：d = |r₀ × v_BA|/|v_BA| = |0×9.00 − (−3.00)×(−12.0)|/15.0 = 36.0/15.0 = 2.40 km。\n该时刻 t = −(r₀·v_BA)/|v_BA|² = 27.0/225 = 0.120 h > 0，说明最近点确实在 t > 0 之后。\n易错点：3.00 km 是初始距离；1.80 km 漏算竖直方向分量。"},{"id":"c01q034","type":"choice","difficulty":5,"tags":["a–t 图像","分段积分"],"stem":"质点沿 x 轴运动，t = 0 时速度为 −1.00 m/s、位置 x = 0。其加速度随时间变化：0 至 2.00 s 内恒为 3.00 m/s²；2.00 s 至 5.00 s 内由 3.00 m/s² 均匀减小到 −3.00 m/s²。t = 5.00 s 时质点的速度，以及 0 至 5.00 s 内的位移分别为","options":["5.00 m/s，23.5 m","3.00 m/s，23.5 m","5.00 m/s，19.5 m","7.25 m/s，23.5 m"],"answer":"A","explain":"0 至 2.00 s：v = −1.00 + 3.00t，v(2.00) = 5.00 m/s，位移 = −1.00×2.00 + ½×3.00×4.00 = 4.00 m。\n2.00 至 5.00 s：设 τ = t − 2.00，a = 3.00 − 2.00τ，Δv = [3.00τ − τ²]₀³ = 9.00 − 9.00 = 0，故 v(5.00) = 5.00 m/s。\n第二段位移 = ∫(5.00 + 3.00τ − τ²)dτ = 15.0 + 13.5 − 9.00 = 19.5 m；总位移 23.5 m。\n易错点：7.25 m/s 是区间内最大速度（t = 3.50 s 时 a = 0），不是末速度；19.5 m 漏掉第一段。"},{"id":"c01q035","type":"choice","difficulty":5,"tags":["斜抛运动","斜面","速度方向条件"],"stem":"倾角 30.0° 的斜面，从斜面底端抛出一个小球，要求小球垂直击中斜面。抛射角（相对水平面）应为","options":["49.1°","30.0°","60.0°","70.9°"],"answer":"D","explain":"垂直击中斜面要求速度方向与水平面成 −60.0°（沿斜面法线），即 v_y/vₓ = −tan60.0°。\n落点在斜面上给出 y/x = tan30.0°。设 A = gt/(v₀cosθ)，两条件化为 tanθ − A/2 = tan30.0° 与 tanθ − A = −tan60.0°。\n两式相减得 A/2 = tan30.0° + tan60.0° = 0.577 + 1.732 = 2.309，A = 4.62，故 tanθ = 2.887，θ = 70.9°（结果与 v₀ 无关）。\n易错点：60.0° 把法线方向直接当抛射角；49.1° 是与 70.9° 互余的错解。"},{"id":"c01q036","type":"calc","difficulty":4,"tags":["匀变速直线运动","反应时间","分段判断"],"stem":"汽车以 25.0 m/s 的速率在平直公路上行驶，司机发现正前方 45.0 m 处有障碍物，经过 0.700 s 的反应时间后开始以 6.00 m/s² 的加速度匀减速刹车。求：(1) 从发现障碍物到停下的总距离；(2) 汽车是否会撞上障碍物；若会，求撞上时的速率。","answer":"总距离约 69.6 m，会撞上；撞上时速率为 17.2 m/s","explain":"反应时间内匀速行驶：s₁ = 25.0×0.700 = 17.5 m。\n刹车距离 s₂ = v₀²/(2a) = 625/12.0 = 52.1 m，总距离 s = 69.6 m > 45.0 m，必然撞上。\n撞上时汽车共行驶 45.0 m，其中刹车段为 45.0 − 17.5 = 27.5 m，由 v² = v₀² − 2as 得 v² = 625 − 2×6.00×27.5 = 295，v = 17.2 m/s。\n易错点：把 45.0 m 全当作刹车距离，会得 v² = 625 − 540 = 85，v = 9.2 m/s。"},{"id":"c01q037","type":"calc","difficulty":4,"tags":["斜抛运动","轨迹方程"],"stem":"以 20.0 m/s 的初速度、40.0° 的抛射角斜向上抛出小球，g = 9.80 m/s²，忽略空气阻力。求：(1) 最大高度；(2) 水平射程；(3) 轨迹在水平距离 15.0 m 处的高度。","answer":"H ≈ 8.43 m；R ≈ 40.2 m；y ≈ 7.89 m","explain":"v₀ₓ = 20.0cos40.0° = 15.3 m/s，v₀y = 20.0sin40.0° = 12.9 m/s。\n(1) H = v₀y²/(2g) = 165/19.6 = 8.43 m。\n(2) T = 2v₀y/g = 2.62 s，R = v₀ₓT = 15.3×2.62 = 40.2 m。\n(3) t = 15.0/15.3 = 0.979 s，y = 12.9×0.979 − 4.90×0.958 = 7.89 m。\n易错点：第 (3) 问不能把水平距离 15.0 m 当作时间代入，必须先由水平分速度求 t。"},{"id":"c01q038","type":"calc","difficulty":4,"tags":["圆周运动","角量与线量","切向与法向加速度"],"stem":"质点沿半径 0.500 m 的圆周运动，角位置随时间变化为 θ = 1.20t + 0.400t³（rad）。求 t = 2.00 s 时质点的切向加速度、法向加速度和总加速度，以及 0 至 2.00 s 内质点转过的角度。","answer":"a_t = 2.40 m/s²；a_n = 18.0 m/s²；a ≈ 18.2 m/s²；θ = 5.60 rad","explain":"ω = dθ/dt = 1.20 + 1.20t²，t = 2.00 s 时 ω = 6.00 rad/s；α = dω/dt = 2.40t = 4.80 rad/s²。\na_t = αr = 4.80×0.500 = 2.40 m/s²。\na_n = ω²r = 36.0×0.500 = 18.0 m/s²，总加速度 a = √(2.40² + 18.0²) = 18.2 m/s²。\nθ(2.00) = 1.20×2.00 + 0.400×8.00 = 5.60 rad。\n易错点：把 θ 当匀角加速用 θ = ½αt²；或用初角速度算 a_n。"},{"id":"c01q039","type":"calc","difficulty":4,"tags":["相对运动","升降机","非惯性系"],"stem":"升降机以 2.00 m/s² 的加速度竖直向上加速，t = 0 时其向上速度为 4.00 m/s。机内一人此时以相对升降机 5.00 m/s 的速率竖直向上抛出小球，g = 9.80 m/s²。求小球相对地面上升的最大高度（从抛出点算起），以及小球从抛出到落回此人手中所需的时间。","answer":"h ≈ 4.13 m；t ≈ 0.847 s","explain":"相对地面：v₀ = 4.00 + 5.00 = 9.00 m/s，小球只受重力，加速度为 −g。\nh = v₀²/(2g) = 81.0/19.6 = 4.13 m。\n在升降机参考系中，等效重力加速度 g′ = g + a = 11.8 m/s²，相对初速度为 5.00 m/s。\nt = 2×5.00/11.8 = 0.847 s。\n易错点：用 9.00 m/s 在机内算时间，得 2×9.00/11.8 = 1.53 s；用 5.00 m/s 算高度只会得 1.06 m。"},{"id":"c01q040","type":"calc","difficulty":5,"tags":["绳拉船","速度与加速度关联","变加速运动"],"stem":"岸上滑轮轴高出船用系绳点 h = 8.00 m，绳子跨过滑轮被以恒定速率 u = 0.800 m/s 收短。求当绳与水平方向夹角为 60.0° 时船的速度和加速度，并说明船做什么运动。","answer":"v = 1.60 m/s；a = 0.416 m/s²；船做加速度逐渐增大的变加速运动","explain":"设船到滑轮正下方的水平距离为 x、绳长为 l，cosθ = x/l，l² = x² + h²。\n收绳速率 u = −dl/dt，由 l² = x² + h² 得 x·dx/dt = l·dl/dt，故船速 v = |dx/dt| = (l/x)u = u/cosθ = 0.800/0.500 = 1.60 m/s。\n再对 v = u secθ 求导：a = u secθ tanθ·θ̇，而 x = h cotθ 且 |dx/dt| = h csc²θ·θ̇ = v，故 θ̇ = u cosθ sin²θ/h。\n代入得 a = u² sin³θ/(h cos³θ) = u² tan³θ/h = 0.640×5.196/8.00 = 0.416 m/s²。\n随船靠近，θ 增大、tanθ 增大，v 与 a 都单调增大，故船做加速度不断增大的变加速运动，不是匀加速。\n易错点：认为收绳速率恒定则船匀速，直接把 a 写成 du/dt = 0；也有人漏掉对 cosθ 求导这一项而只得 u²tanθ/h = 0.139 m/s²。"},{"id":"c01q041","type":"calc","difficulty":5,"tags":["a = a(x)","积分法","简谐振动判据"],"stem":"质点沿 x 轴运动，加速度 a = −ω²x（ω 为正常量）。t = 0 时质点位于 x = A 处，速度为零。求：(1) 证明速率与位置满足 v² = ω²(A² − x²)；(2) 质点经过 x = A/2 时的速率；(3) 运动的周期。","answer":"(1) 见推导；(2) v = (√3/2)ωA；(3) T = 2π/ω","explain":"(1) 用 a = v dv/dx：v dv = −ω²x dx，积分得 v²/2 = −ω²x²/2 + C。代入 x = A、v = 0 得 C = ω²A²/2，故 v² = ω²(A² − x²)。\n(2) 令 x = A/2：v² = ω²(A² − A²/4) = 3ω²A²/4，v = (√3/2)ωA。\n(3) 由 v = dx/dt = −ω√(A² − x²) 分离变量积分得 x = A cos ωt，故 T = 2π/ω。\nv² 与 x² 成线性关系是简谐振动的判据，不能套用匀变速公式 v² = v₀² + 2ax。"},{"id":"c01q042","type":"calc","difficulty":5,"tags":["斜抛运动","包络线","可达区域"],"stem":"在水平地面上以初速度 v₀、抛射角 θ 抛出小球，忽略空气阻力，g = 9.80 m/s²。求：(1) 轨迹方程；(2) 证明能被击中的区域边界为 y = v₀²/(2g) − gx²/(2v₀²)；(3) 当目标位于水平距离 40.0 m、高 10.0 m 处时，击中它所需的最小初速度。","answer":"(1) y = x tanθ − gx²/(2v₀²cos²θ)；(2) 见推导；(3) v₀min ≈ 22.4 m/s","explain":"(1) 由 x = v₀cosθ·t、y = v₀sinθ·t − ½gt² 消去 t 得 y = x tanθ − gx²/(2v₀²cos²θ)。\n(2) 用 1/cos²θ = 1 + tan²θ，令 p = tanθ，得 (gx²/2v₀²)p² − xp + (y + gx²/2v₀²) = 0；有实根要求判别式 x² − 4(gx²/2v₀²)(y + gx²/2v₀²) ≥ 0。\n化简即得 y ≤ v₀²/(2g) − gx²/(2v₀²)，等号给出包络线（安全抛物线）。\n(3) 由包络线解出 v₀² ≥ g(y + √(x² + y²)) = 9.80×(10.0 + 41.2) = 502，v₀ ≥ 22.4 m/s。\n易错点：认为 45.0° 总是最优；用 v₀² = g(y + x) 会漏掉斜边而低估初速。"},{"id":"c01q043","type":"calc","difficulty":5,"tags":["相对运动","风的合成","平均速率"],"stem":"飞机在无风时相对空气的速率为 250 km/h，航线为南北方向，两地相距 400 km。若风以 50.0 km/h 沿南北方向吹，求：(1) 顺风、逆风单程各需时间；(2) 往返全程的平均速率；(3) 若风改为垂直于航线、大小不变，往返全程的平均速率。","answer":"(1) 1.33 h 和 2.00 h；(2) 240 km/h；(3) 245 km/h","explain":"(1) 顺风地速 250 + 50.0 = 300 km/h，t₁ = 400/300 = 1.33 h；逆风地速 200 km/h，t₂ = 400/200 = 2.00 h。\n(2) 总路程 800 km、总时间 3.33 h，平均速率 = 800/3.33 = 240 km/h，小于无风时的 250 km/h。\n(3) 垂直风时地速 √(250² − 50.0²) = 245 km/h，往、返相同，全程平均速率即 245 km/h。\n说明：平均速率必须用总路程除以总时间；把 300 与 200 取算术平均得 250，纯属巧合，不能这么算。"},{"id":"c01q044","type":"calc","difficulty":5,"tags":["追及问题","参数讨论","二次方程"],"stem":"汽车 A 以恒定速率 v = 8.00 m/s 沿直线行驶，t = 0 时汽车 B 在 A 后方 d = 12.0 m 处，以 v₀ = 16.0 m/s 同向行驶并开始以恒定加速度 a 减速（只讨论 B 停止前的过程）。讨论 a 取何值时两车相遇两次、一次、不相遇，并给出临界值。","answer":"a \u003c 2.67 m/s² 时相遇两次；a = 2.67 m/s² 时相遇一次（相切）；a > 2.67 m/s² 时不相遇","explain":"取 A 在 t = 0 的位置为原点：x_A = 8.00t，x_B = −12.0 + 16.0t − ½at²。\n相遇条件为 ½at² − 8.00t + 12.0 = 0，即 at² − 16.0t + 24.0 = 0。\n判别式 Δ = 256 − 96.0a：Δ > 0 时两根之和 16/a > 0、之积 24/a > 0，均为正根，对应两次相遇；\nΔ = 0 得 a = 2.67 m/s²，两车只接触一次（此时 B 相对 A 的速度恰为零）；Δ \u003c 0 则始终追不上。\n验证：a = 2.00 m/s² 时 t = 2.00 s 与 6.00 s，均小于 B 的停止时刻 8.00 s，结论有效。"},{"id":"c01q045","type":"calc","difficulty":5,"tags":["斜面坐标系","运动的分解","抛体"],"stem":"倾角 30.0° 的斜面，从斜面上某点以 6.00 m/s 的速率沿垂直斜面方向抛出小球，g = 9.80 m/s²。求：(1) 小球落回斜面所需时间；(2) 落点沿斜面方向到抛出点的距离；(3) 落回斜面时小球的速率。","answer":"t ≈ 1.41 s；s ≈ 4.90 m；v ≈ 9.17 m/s","explain":"取沿斜面向下为 x′ 轴、垂直斜面向外为 y′ 轴，重力分量为 g sin30.0° = 4.90 m/s² 与 g cos30.0° = 8.49 m/s²。\n(1) 垂直斜面方向：v₀y′ = 6.00 m/s，a_y′ = −8.49 m/s²，回到斜面时 t = 2×6.00/8.49 = 1.41 s。\n(2) 沿斜面方向初速为零：s = ½×4.90×1.41² = 4.90 m。\n(3) 下落高度 h = s sin30.0° = 2.45 m，由 v² = v₀² + 2gh 得 v = √(36.0 + 48.0) = 9.17 m/s。\n易错点：把「垂直斜面抛出」当竖直上抛（得 t = 1.22 s）；沿斜面方向误当匀速而漏掉 g sinα。"},{"id":"c01q046","type":"calc","difficulty":5,"tags":["变加速运动","终极速度","积分法"],"stem":"小球从静止开始竖直下落，受空气阻力，加速度为 a = g − kv，k = 0.250 s⁻¹，g = 9.80 m/s²。求：(1) 终极速度；(2) t = 2.00 s 时的速率和已下落的距离；(3) 速率达到终极值 90% 所需时间。","answer":"(1) 39.2 m/s；(2) 15.4 m/s，16.7 m；(3) 9.21 s","explain":"(1) 令 a = 0 得 v∞ = g/k = 9.80/0.250 = 39.2 m/s。\n(2) 分离变量 dv/(v∞ − v) = k dt，积分得 v = v∞(1 − e^(−kt)) = 39.2(1 − e^(−0.500)) = 15.4 m/s。\ny = v∞t − (v∞/k)(1 − e^(−kt)) = 78.4 − 157×0.393 = 16.7 m。\n(3) 1 − e^(−0.250t) = 0.900，t = ln10/0.250 = 9.21 s。\n易错点：把 39.2 m/s 当作恒定加速度下的末速；用 y = ½at² 得 19.6 m（偏大）。"},{"id":"c01q047","type":"calc","difficulty":5,"tags":["圆周运动","切向加速度","速度积分"],"stem":"质点沿半径 2.00 m 的圆周运动，其切向加速度与速率满足 a_t = −0.500v²（SI 单位），t = 0 时速率为 8.00 m/s。求：(1) 速率随时间的变化关系；(2) 速率减为 4.00 m/s 所需时间及这段时间内转过的角度；(3) 质点能否停下来，转过的总角度是否有限。","answer":"(1) v = 8.00/(1 + 4.00t) m/s；(2) t = 0.250 s，θ = 0.693 rad；(3) 只能无限趋近于零，总角度无限大","explain":"(1) dv/dt = −0.500v²，分离变量 dv/v² = −0.500dt，积分得 1/v − 1/8.00 = 0.500t，即 v = 8.00/(1 + 4.00t)。\n(2) 令 v = 4.00：1 + 4.00t = 2.00，t = 0.250 s。\n弧长 s = ∫v dt = (1/0.500)ln(v₀/v) = 2.00ln2 = 1.386 m，θ = s/r = 0.693 rad。\n(3) v → 0 只在 t → ∞ 时发生，而 s = 2.00ln(v₀/v) 随 v → 0 发散，故转过总角度无限大，质点不会真正停下。\n易错点：把 a_t = −0.500v² 当恒定加速度用 v = v₀ + a_t t。"},{"id":"c01q048","type":"calc","difficulty":5,"tags":["速度的分解","径向速度","约束关系"],"stem":"汽车沿直线匀速行驶，速率为 20.0 m/s。路边一测速仪到该直线的垂直距离为 30.0 m，测速仪测得的「径向速度」是它到汽车的距离 r 的变化率。求当 r = 50.0 m 时径向速度的大小和垂直于视线方向的速度分量，并说明汽车经过测速仪正前方的瞬间径向速度是多少。","answer":"径向速度 16.0 m/s；垂直分量 12.0 m/s；经过正前方瞬间径向速度为 0","explain":"设汽车沿 x 轴运动，测速仪在 (0, 30.0)，则 r² = x² + 30.0²，且 x = vt。\n对 t 求导：2r(dr/dt) = 2x(dx/dt)，得 dr/dt = vx/r = v√(r² − d²)/r。\nr = 50.0 m 时 x = √(2500 − 900) = 40.0 m，dr/dt = 20.0×40.0/50.0 = 16.0 m/s。\n垂直分量 = √(v² − (dr/dt)²) = √(400 − 256) = 12.0 m/s；x = 0 时 dr/dt = 0。\n说明：径向速度只是速度的一个分量，恒不大于速率，测速仪读数不能直接当车速。"},{"id":"c01q049","type":"calc","difficulty":5,"tags":["抛体运动","相对运动","同时性"],"stem":"猴子抓住高 20.0 m 的树枝，猎人在水平距离 30.0 m 处用枪直接瞄准猴子射击，子弹初速度 25.0 m/s。猴子在枪响的同时松手自由下落，g = 9.80 m/s²，忽略空气阻力。求：(1) 子弹能否击中猴子；(2) 击中所需时间与击中处的高度；(3) 若猴子提前 0.200 s 松手，子弹到达猴子所在竖直线时比猴子高多少。","answer":"(1) 能击中；(2) t ≈ 1.44 s，h ≈ 9.81 m；(3) 约高 3.02 m，不能击中","explain":"瞄准方向 tanθ = 20.0/30.0，得 cosθ = 0.832，v₀ₓ = 25.0×0.832 = 20.8 m/s，v₀y = 13.9 m/s。\n(1)(2) 到达猴子所在竖直线需 t = 30.0/20.8 = 1.44 s。子弹高度 = 13.9×1.44 − 4.90×1.44² = 20.0 − 10.2 = 9.81 m；\n猴子高度 = 20.0 − 10.2 = 9.81 m，两者相等，故击中——这源于相对运动为匀速直线（相对加速度为零）。\n(3) 猴子提前 0.200 s 下落，t = 1.44 s 时其高度为 20.0 − 4.90×1.64² = 6.79 m，与子弹相差 9.81 − 6.79 = 3.02 m。\n易错点：认为只要瞄准就必中，忽略「必须同时开始下落」这一条件。"},{"id":"c01q050","type":"calc","difficulty":5,"tags":["运动学方程","曲率半径","速度与加速度垂直"],"stem":"质点在 Oxy 平面内运动，x = 2.00t，y = 4.00t − 1.00t²（SI 单位）。求：(1) 轨迹方程；(2) 速度与加速度相互垂直的时刻；(3) 轨迹上曲率半径的最小值。","answer":"(1) y = 2.00x − 0.250x²；(2) t = 2.00 s；(3) ρ_min = 2.00 m","explain":"(1) 由 x = 2.00t 得 t = x/2.00，代入得 y = 2.00x − 0.250x²，是开口向下的抛物线。\n(2) v = (2.00, 4.00 − 2.00t)，a = (0, −2.00)。垂直条件 v·a = 0，即 −2.00(4.00 − 2.00t) = 0，得 t = 2.00 s。\n(3) ρ = |v|³/|v × a|，其中 |v × a| = |2.00×(−2.00)| = 4.00 恒定，|v| = √(4.00 + (4.00 − 2.00t)²) 在 t = 2.00 s 取最小值 2.00 m/s。\n故 ρ_min = 2.00³/4.00 = 2.00 m。\n易错点：把曲率半径最小当成速率最大处；用 ρ = v²/a 而不先把加速度分解到法向。"}]},{"chapter":2,"chapterName":"牛顿运动定律","questions":[{"id":"c02q001","type":"choice","difficulty":3,"tags":["斜面上滑","摩擦力方向","能否自行下滑"],"stem":"物块以 5.00 m/s 的初速度沿倾角 30.0° 的粗糙斜面向上滑行，物块与斜面间动摩擦因数 0.250、静摩擦因数 0.300，g = 9.80 m/s²。物块沿斜面上滑的最大距离，以及此后能否自行滑回斜面底端分别是","options":["2.55 m，能滑回","4.50 m，能滑回","1.78 m，能滑回","1.78 m，不能滑回"],"answer":"C","explain":"上滑时重力沿斜面的分量与摩擦力都指向斜面下方：a = g(sin30.0° + μₖcos30.0°) = 9.80×(0.500 + 0.250×0.866) = 7.02 m/s²。由 v₀² = 2as 得 s = 25.0/(2×7.02) = 1.78 m。\n能否滑回取决于 tan30.0° = 0.577 与 μₛ = 0.300 的大小：tanθ > μₛ，重力分量足以克服最大静摩擦，故能自行滑回。\n易错点：2.55 m 漏掉摩擦项；4.50 m 把上滑时的摩擦力方向取反；只算距离不判断能否滑回。"},{"id":"c02q002","type":"choice","difficulty":3,"tags":["圆锥摆","张力分解","周期"],"stem":"长 1.20 m 的轻绳一端固定，另一端系质量 0.500 kg 的小球，小球在水平面内做匀速圆周运动，绳与竖直方向成 30.0°。取 g = 9.80 m/s²，绳中张力与小球运动的周期分别为","options":["4.90 N，2.05 s","5.66 N，2.05 s","4.24 N，2.05 s","5.66 N，2.20 s"],"answer":"B","explain":"竖直方向 Tcos30.0° = mg，故 T = 4.90/0.866 = 5.66 N。\n圆周半径 r = Lsin30.0° = 0.600 m，由 Tsin30.0° = mv²/r 得 v = √(gr tan30.0°) = 1.84 m/s，周期 T₀ = 2πr/v = 2.05 s（也等于 2π√(Lcosθ/g)）。\n易错点：把张力写成 mgcosθ 得 4.24 N；用 2π√(L/g) = 2.20 s 忽略摆角；用 mg = 4.90 N 当张力。"},{"id":"c02q003","type":"choice","difficulty":3,"tags":["连接体","牛顿第二定律","绳张力"],"stem":"质量分别为 3.00 kg 和 5.00 kg 的两物块用轻绳跨过光滑定滑轮连接，滑轮质量不计。由静止释放后，绳中张力以及 2.00 s 内 5.00 kg 物块下降的距离分别为（g = 9.80 m/s²）","options":["49.0 N，4.90 m","29.4 N，4.90 m","36.8 N，2.45 m","36.8 N，4.90 m"],"answer":"D","explain":"对整体 a = (m₂ − m₁)g/(m₁ + m₂) = 2.00×9.80/8.00 = 2.45 m/s²。\n对 m₁ 用牛顿第二定律：T − m₁g = m₁a，得 T = 3.00×(9.80 + 2.45) = 36.8 N。\n下降距离 s = ½at² = ½×2.45×4.00 = 4.90 m。\n易错点：49.0 N 是 m₂g（把张力当成重物的重力）；29.4 N 是 m₁g；2.45 m 把 s = ½at² 漏掉一个 t（t 只代一次）。"},{"id":"c02q004","type":"choice","difficulty":3,"tags":["反应时间","刹车距离","摩擦力"],"stem":"汽车以 20.0 m/s 行驶，驾驶员反应时间为 0.600 s，反应时间内汽车仍匀速；随后刹车，轮胎与路面间动摩擦因数 0.700。从发现情况到停下的总距离为（g = 9.80 m/s²）","options":["41.2 m","29.2 m","70.3 m","39.9 m"],"answer":"A","explain":"反应距离 s₁ = v₀t = 20.0×0.600 = 12.0 m。\n刹车减速度 a = μg = 6.86 m/s²，制动距离 s₂ = v₀²/(2a) = 400/13.72 = 29.2 m。\n总距离 = 12.0 + 29.2 = 41.2 m。\n易错点：29.2 m 漏掉反应距离；70.3 m 制动距离漏掉 ½；39.9 m 把反应时间也按匀减速处理。"},{"id":"c02q005","type":"choice","difficulty":3,"tags":["斜向推力","支持力变化","滑动摩擦"],"stem":"质量 6.00 kg 的物块放在水平地面上，用与水平方向成 30.0° 斜向下、大小 40.0 N 的力推它，物块与地面间动摩擦因数 0.250。物块的加速度为（g = 9.80 m/s²）","options":["3.38 m/s²","5.77 m/s²","2.49 m/s²","3.32 m/s²"],"answer":"C","explain":"竖直方向 N = mg + Fsin30.0° = 58.8 + 20.0 = 78.8 N，摩擦力 f = μN = 19.7 N。\n水平方向 Fcos30.0° − f = 34.6 − 19.7 = 14.9 N，故 a = 14.9/6.00 = 2.49 m/s²。\n易错点：3.32 m/s² 漏掉推力的法向分量（N 取 mg）；3.38 m/s² 用 F 代替 Fcos30.0°；5.77 m/s² 漏掉摩擦。"},{"id":"c02q006","type":"choice","difficulty":3,"tags":["水平弯道","静摩擦提供向心力","临界速率"],"stem":"汽车在半径 45.0 m 的水平弯道上转弯，轮胎与路面间最大静摩擦因数在干路面上为 0.600、在湿路面上为 0.250。两种路面上不打滑的最大速率分别为（g = 9.80 m/s²）","options":["10.5 m/s，16.3 m/s","16.3 m/s，10.5 m/s","16.3 m/s，6.75 m/s","23.0 m/s，14.8 m/s"],"answer":"B","explain":"静摩擦提供向心力：μmg = mv²/r，故 v = √(μgr)。\n干路 v = √(0.600×9.80×45.0) = √264.6 = 16.3 m/s；湿路 v = √110.3 = 10.5 m/s。\n易错点：6.75 m/s 把 v 当作与 μ 成正比（线性缩放）；23.0/14.8 m/s 多乘了系数 2；最后一组把两种路面颠倒。"},{"id":"c02q007","type":"choice","difficulty":4,"tags":["桌面滑轮连接体","动摩擦","张力"],"stem":"质量 2.00 kg 的物块放在水平桌面上，与桌面间动摩擦因数 0.200，用轻绳跨过桌边光滑定滑轮与 1.50 kg 的重物相连。释放后物块的加速度与绳中张力分别为（g = 9.80 m/s²）","options":["4.20 m/s²，14.7 N","3.08 m/s²，6.16 N","5.39 m/s²，10.1 N","3.08 m/s²，10.1 N"],"answer":"D","explain":"对整体：a = (m₂g − μm₁g)/(m₁ + m₂) = (14.7 − 3.92)/3.50 = 3.08 m/s²。\n对重物：T = m₂(g − a) = 1.50×6.72 = 10.1 N。\n易错点：4.20 m/s² 漏掉摩擦；14.7 N 把重物重力当张力；6.16 N 只给桌面物块提供加速度而漏掉摩擦；5.39 m/s² 分母漏掉重物质量。"},{"id":"c02q008","type":"choice","difficulty":4,"tags":["变力 F(t)","积分求速度","积分求位移"],"stem":"质量 2.00 kg 的质点静止在光滑水平面上，从 t = 0 起受水平力 F = bt 作用，b = 3.00 N/s。t = 4.00 s 时质点的速度和位移分别为","options":["12.0 m/s，16.0 m","6.00 m/s，12.0 m","12.0 m/s，48.0 m","24.0 m/s，48.0 m"],"answer":"A","explain":"a = F/m = 1.50t。\n积分一次：v = ∫a dt = 0.750t²，t = 4.00 s 时 v = 12.0 m/s。\n再积分：x = ∫v dt = 0.250t³ = 16.0 m。\n易错点：6.00/12.0 把加速度数值当速率、再用平均速率求位移；48.0 m 用 x = vt 当匀速；24.0 m/s 把 t = 4.00 s 时的力当成恒力（漏掉 ½ 与 ⅓ 的积分系数）。"},{"id":"c02q009","type":"choice","difficulty":4,"tags":["弹簧连接体","整体法","质量分配"],"stem":"质量 2.00 kg 和 3.00 kg 的两物块放在光滑水平面上，中间用劲度系数 300 N/m 的轻弹簧相连。用 12.0 N 的水平力拉 2.00 kg 物块，稳定后弹簧的伸长量为 x₁；若改为拉 3.00 kg 物块，稳定后伸长量为 x₂。x₁ 和 x₂ 分别为","options":["2.40 cm，2.40 cm","4.00 cm，4.00 cm","2.40 cm，1.60 cm","1.60 cm，2.40 cm"],"answer":"C","explain":"整体 a = F/(m₁ + m₂) = 12.0/5.00 = 2.40 m/s²。\n拉 m₁ 时弹簧力只推 m₂：kx₁ = m₂a = 7.20 N，x₁ = 7.20/300 m = 2.40 cm；拉 m₂ 时弹簧力只推 m₁：kx₂ = m₁a = 4.80 N，x₂ = 1.60 cm。\n易错点：4.00 cm 把外力当弹簧力；1.60/2.40 把两物块对调；2.40/2.40 认为伸长量与拉哪一端无关。"},{"id":"c02q010","type":"choice","difficulty":4,"tags":["竖直圆周运动","最低点张力","向心力"],"stem":"质量 0.300 kg 的小球系在长 1.50 m 的轻绳一端，在竖直平面内做圆周运动。经过最低点时速率为 7.00 m/s，此时绳中张力为 T₁；若最低点速率变为 14.0 m/s，张力为 T₂。T₁ 和 T₂ 分别为（g = 9.80 m/s²）","options":["12.7 N，25.5 N","12.7 N，42.1 N","9.80 N，39.2 N","15.7 N，45.1 N"],"answer":"B","explain":"最低点：T − mg = mv²/L，即 T = m(g + v²/L)。\nv = 7.00 m/s 时 T₁ = 0.300×(9.80 + 32.7) = 12.7 N；速率加倍时 v² 变 4 倍，T₂ = 0.300×(9.80 + 130.7) = 42.1 N。\n易错点：9.80/39.2 N 只算法向项；15.7/45.1 N 把符号写成 T + mg；25.5 N 误以为 T 与 v 成正比。"},{"id":"c02q011","type":"choice","difficulty":4,"tags":["电梯视重","超重与失重","弹簧秤读数"],"stem":"质量 5.00 kg 的物体挂在弹簧秤下，随电梯一起运动。电梯以 2.00 m/s² 匀加速上升时读数为 F₁，以 2.00 m/s² 匀减速上升时读数为 F₂。F₁ 和 F₂ 分别为（g = 9.80 m/s²）","options":["39.0 N，59.0 N","49.0 N，49.0 N","59.0 N，29.4 N","59.0 N，39.0 N"],"answer":"D","explain":"读数等于秤对物体的拉力。加速上升：F₁ − mg = ma，F₁ = 5.00×11.8 = 59.0 N。\n减速上升：加速度方向向下，mg − F₂ = ma，F₂ = 5.00×7.80 = 39.0 N。\n易错点：把减速上升也当成失重 a 叠加得 29.4 N；忽略加速度得 49.0 N；两组读数颠倒。"},{"id":"c02q012","type":"choice","difficulty":4,"tags":["并排物块","整体法","相互作用力"],"stem":"质量 2.00 kg 和 3.00 kg 的两物块并排放在水平面上，与地面间动摩擦因数均为 0.200。用 18.0 N 的水平力推 2.00 kg 物块，两物块一起运动，它们之间的作用力为（g = 9.80 m/s²）","options":["10.8 N","7.20 N","4.92 N","18.0 N"],"answer":"A","explain":"整体 a = (F − μ(m₁ + m₂)g)/(m₁ + m₂) = (18.0 − 9.80)/5.00 = 1.64 m/s²。\n对后一物块用牛顿第二定律：N − μm₂g = m₂a，N = 3.00×1.64 + 5.88 = 10.8 N。\n易错点：7.20 N 按质量比分推（把 18.0 N 乘 2/5）；4.92 N 漏掉它自己的摩擦项只留 m₂a；18.0 N 认为推力全部传给后一物块。"},{"id":"c02q013","type":"choice","difficulty":4,"tags":["倾斜弯道","最大与最小速率","静摩擦方向"],"stem":"汽车在倾角 25.0°、半径 80.0 m 的倾斜弯道上行驶，轮胎与路面间最大静摩擦因数 0.200。不侧滑的最大速率与最小速率分别为（g = 9.80 m/s²）","options":["22.9 m/s，14.4 m/s","13.8 m/s，24.0 m/s","24.0 m/s，13.8 m/s","24.0 m/s，0"],"answer":"C","explain":"高速时摩擦力沿斜面向下：v_max = √(rg(tanθ + μ)/(1 − μtanθ)) = √(784×0.666/0.907) = 24.0 m/s。\n低速时摩擦力沿斜面向上：v_min = √(rg(tanθ − μ)/(1 + μtanθ)) = √(784×0.266/1.093) = 13.8 m/s。\n易错点：0 误认为低速一定不滑；22.9/14.4 漏掉分母 1 ∓ μtanθ；最后一组两值颠倒。"},{"id":"c02q014","type":"choice","difficulty":4,"tags":["双绳悬挂","节点平衡","张力分解"],"stem":"质量 10.0 kg 的物体用两根轻绳悬挂，两绳与竖直方向的夹角分别为 30.0° 和 45.0°，且分居竖直线的两侧。两绳中的张力分别为（g = 9.80 m/s²）","options":["98.0 N，69.3 N","71.7 N，50.7 N","50.7 N，71.7 N","56.6 N，56.6 N"],"answer":"B","explain":"水平方向 T₁sin30.0° = T₂sin45.0°，得 T₁ = 1.414T₂。\n竖直方向 T₁cos30.0° + T₂cos45.0° = mg = 98.0 N，代入得 1.932T₂ = 98.0，T₂ = 50.7 N，T₁ = 71.7 N。\n易错点：50.7/71.7 两绳对调；56.6 N 假设两绳对称；98.0 N 把重力直接当张力。"},{"id":"c02q015","type":"choice","difficulty":4,"tags":["叠放物块","静摩擦临界","相对滑动"],"stem":"质量 2.00 kg 的物块叠放在质量 4.00 kg 的长木板上，木板放在光滑水平面上，物块与木板间动摩擦因数 0.250、最大静摩擦因数 0.300。用 20.0 N 的水平力拉木板，物块与木板的加速度分别为（g = 9.80 m/s²）","options":["2.94 m/s²，3.33 m/s²","3.33 m/s²，3.33 m/s²","2.45 m/s²，5.00 m/s²","2.45 m/s²，3.78 m/s²"],"answer":"D","explain":"若一起运动，a = 20.0/6.00 = 3.33 m/s²，所需静摩擦 2.00×3.33 = 6.67 N，大于最大静摩擦 μₛmg = 5.88 N，故发生相对滑动。\n滑动后物块受动摩擦，a₁ = μₖg = 2.45 m/s²；木板受拉力与反向摩擦，a₂ = (20.0 − 4.90)/4.00 = 3.78 m/s²。\n易错点：3.33/3.33 用整体法；2.94 用最大静摩擦算；5.00 漏掉摩擦对木板的阻碍。"},{"id":"c02q016","type":"choice","difficulty":4,"tags":["双斜面连接体","重力分量","滑轮约束"],"stem":"两物块质量分别为 4.00 kg 和 2.00 kg，放在倾角 30.0° 和 40.0° 的两个光滑斜面上，用轻绳跨过两斜面顶端的定滑轮相连。释放后系统的加速度与绳中张力分别为（g = 9.80 m/s²）","options":["1.17 m/s²，14.9 N","1.17 m/s²，19.6 N","3.27 m/s²，14.9 N","1.17 m/s²，21.9 N"],"answer":"A","explain":"m₁gsin30.0° = 19.6 N 大于 m₂gsin40.0° = 12.6 N，4.00 kg 物块沿斜面向下运动。\na = (19.6 − 12.6)/6.00 = 1.17 m/s²。\n对 4.00 kg 物块：m₁gsin30.0° − T = m₁a，T = 19.6 − 4.68 = 14.9 N。\n易错点：19.6 N 把重力分量当张力；3.27 m/s² 没分解重力；21.9 N 漏掉 m₂ 沿斜面的分量。"},{"id":"c02q017","type":"choice","difficulty":4,"tags":["圆锥摆变体","穿透小孔","向心力"],"stem":"质量 0.200 kg 的小球在光滑水平桌面上做匀速圆周运动，绳穿过桌面中心小孔，下端悬挂 0.500 kg 的重物，小球轨道半径 0.500 m。小球的速率与周期分别为（g = 9.80 m/s²）","options":["3.50 m/s，1.42 s","1.40 m/s，2.24 s","3.50 m/s，0.898 s","2.21 m/s，0.898 s"],"answer":"C","explain":"绳张力等于重物重力 T = m₂g = 4.90 N，同时提供向心力 m₁v²/r，故 v = √(Tr/m₁) = √(4.90×0.500/0.200) = 3.50 m/s。\n周期 T₀ = 2πr/v = 3.142/3.50 = 0.898 s。\n易错点：2.21 m/s 用 √(gr) 漏掉质量比；1.42 s 用 2π√(r/g)；1.40 m/s 把两物块质量比取反。"},{"id":"c02q018","type":"choice","difficulty":4,"tags":["变力 F(t)","速度极值","受力方向反转"],"stem":"质量 1.00 kg 的质点静止在光滑水平面上，从 t = 0 起受水平力 F = 6.00 − 2.00t（N）作用。质点速度最大时的时间和最大速度分别为","options":["6.00 s，0","3.00 s，9.00 m/s","0，0","3.00 s，18.0 m/s"],"answer":"B","explain":"a = 6.00 − 2.00t，积分得 v = 6.00t − t²。\n速度最大时 a = 0，即 t = 3.00 s，v_max = 18.0 − 9.00 = 9.00 m/s。\n易错点：18.0 m/s 漏掉 −t² 项；6.00 s 是 F 反向后速度减为零的时刻，不是最快；0 s 是加速度最大的时刻，速度仍为零。"},{"id":"c02q019","type":"choice","difficulty":4,"tags":["最省力拉动","摩擦角","极值"],"stem":"用与水平方向成 θ 角的拉力拖动质量 10.0 kg 的箱子在水平面上匀速前进，动摩擦因数 0.500。使拉力最小的 θ 及该最小拉力分别为（g = 9.80 m/s²）","options":["26.6°，49.0 N","45.0°，43.8 N","63.4°，54.8 N","26.6°，43.8 N"],"answer":"D","explain":"匀速时 Fcosθ = μ(mg − Fsinθ)，解得 F = μmg/(cosθ + μsinθ)。\n分母在 tanθ = μ 时最大，故 θ = arctan0.500 = 26.6°，F_min = 0.500×98.0/√(1 + 0.250) = 43.8 N。\n易错点：49.0 N 直接取 μmg（当 θ = 0）；45.0° 想当然取 45°；63.4° 把 tanθ = μ 写成 θ = arctan(1/μ)。"},{"id":"c02q020","type":"calc","difficulty":4,"tags":["桌面滑轮","动摩擦","运动学联立"],"stem":"质量 4.00 kg 的物块放在水平桌面上，与桌面间动摩擦因数 0.200、最大静摩擦因数 0.300，用轻绳跨过桌边光滑定滑轮与 2.50 kg 的重物相连，g = 9.80 m/s²。求：(1) 释放后物块的加速度；(2) 绳中张力；(3) 物块从静止移动 0.800 m 所需时间及此时的速率。","answer":"(1) 2.56 m/s²；(2) 18.1 N；(3) 0.790 s，2.03 m/s","explain":"先判断能否运动：m₂g = 24.5 N 大于 μₛm₁g = 11.8 N，系统能运动。\n对整体：a = (m₂g − μm₁g)/(m₁ + m₂) = (24.5 − 7.84)/6.50 = 2.56 m/s²。\n对重物：T = m₂(g − a) = 2.50×7.24 = 18.1 N。\n由 s = ½at² 得 t = √(2×0.800/2.56) = 0.790 s，v = at = 2.03 m/s。\n易错点：漏掉静摩擦判断；把 24.5 N 当张力；用 0.800 m 直接除以 a 求时间。"},{"id":"c02q021","type":"calc","difficulty":4,"tags":["变力 F(t)","两次积分","初始条件"],"stem":"质量 2.50 kg 的质点沿 x 轴运动，t = 0 时速度为 1.50 m/s、位置 x = 0，所受合力 F = bt，b = 4.00 N/s。求：(1) 速度随时间的关系 v(t)；(2) 位置随时间的关系 x(t)；(3) t = 2.00 s 时的速度和位移。","answer":"(1) v = 1.50 + 0.800t²（m/s）；(2) x = 1.50t + 0.267t³（m）；(3) 4.70 m/s，5.13 m","explain":"a = F/m = 1.60t。\n积分一次并代入初速度：v = 1.50 + 0.800t²；再积分并代入初位置：x = 1.50t + 0.267t³。\nt = 2.00 s 时 v = 1.50 + 3.20 = 4.70 m/s，x = 3.00 + 2.13 = 5.13 m。\n易错点：把 F 当恒力用 v = v₀ + at；漏掉初速度项；对 t³ 项的系数少乘 ⅓。"},{"id":"c02q022","type":"calc","difficulty":4,"tags":["弹簧连接体","撤力瞬间","弹簧形变不突变"],"stem":"质量 1.50 kg 和 2.50 kg 的两物块放在光滑水平面上，中间用劲度系数 200 N/m 的轻弹簧相连。用 20.0 N 的水平力拉 1.50 kg 物块，系统稳定后弹簧伸长 6.25 cm。求：(1) 系统加速度；(2) 撤去外力的瞬间两物块的加速度。","answer":"(1) 5.00 m/s²；(2) 1.50 kg 物块 −8.33 m/s²，2.50 kg 物块 +5.00 m/s²（以原拉力方向为正）","explain":"整体 a = 20.0/4.00 = 5.00 m/s²；弹簧力只作用于后一物块，F_s = 2.50×5.00 = 12.5 N，与 kx = 200×0.0625 = 12.5 N 一致。\n撤去外力的瞬间弹簧形变来不及改变，F_s 仍为 12.5 N：前一物块 a₁ = −12.5/1.50 = −8.33 m/s²，后一物块 a₂ = +12.5/2.50 = +5.00 m/s²。\n易错点：认为撤力瞬间弹簧力立刻消失；把 12.5 N 同时加在两物块上算整体加速度；忘记加速度的符号。"},{"id":"c02q023","type":"calc","difficulty":4,"tags":["圆锥摆","临界角速度","张力与角速度"],"stem":"长 0.800 m 的轻绳系质量 0.250 kg 的小球，在水平面内做圆锥摆运动，绳与竖直方向成 30.0°，g = 9.80 m/s²。求：(1) 绳中张力；(2) 小球速率与运动周期；(3) 若角速度增大为原来的 2 倍，绳与竖直方向的夹角变为多少。","answer":"(1) 2.83 N；(2) 1.50 m/s，1.67 s；(3) 77.5°","explain":"竖直方向 Tcos30.0° = mg，T = 2.45/0.866 = 2.83 N。\n半径 r = Lsin30.0° = 0.400 m，由 Tsin30.0° = mv²/r 得 v = 1.50 m/s，周期 2πr/v = 1.67 s。\n由 T = mω²L 与 Tcosθ = mg 得 cosθ = g/(ω²L)：原 ω = 3.76 rad/s 对应 cos30.0°；ω 加倍后 cosθ = 9.80/(56.6×0.800) = 0.217，θ = 77.5°。\n易错点：把张力写成 mgcosθ；ω 加倍后误认为夹角不变；用 2π√(L/g) 求周期。"},{"id":"c02q024","type":"calc","difficulty":4,"tags":["斜面上水平推力","静摩擦判断","支持力变化"],"stem":"质量 5.00 kg 的物块放在倾角 30.0° 的斜面上，用 60.0 N 的水平力沿斜面向内推它（力指向斜面），物块与斜面间最大静摩擦因数 0.400、动摩擦因数 0.300，g = 9.80 m/s²。求：(1) 物块是否运动；(2) 斜面对物块的支持力和摩擦力（大小与方向）。","answer":"(1) 保持静止；(2) 支持力 72.4 N，摩擦力 27.5 N，方向沿斜面向下","explain":"垂直斜面：N = mgcos30.0° + Fsin30.0° = 42.4 + 30.0 = 72.4 N，最大静摩擦 0.400×72.4 = 29.0 N。\n沿斜面：Fcos30.0° = 52.0 N 向上，mgsin30.0° = 24.5 N 向下，净驱动 27.5 N 小于 29.0 N，故保持静止，静摩擦取 27.5 N 沿斜面向下。\n易错点：漏掉推力的法向分量导致 N 偏小、误判滑动；摩擦力方向写反；直接用动摩擦算 21.7 N。"},{"id":"c02q025","type":"calc","difficulty":4,"tags":["线性阻力","分离变量","极限位移"],"stem":"质量 0.400 kg 的物块在光滑水平面上以 10.0 m/s 的初速度运动，受到与速度方向相反、大小 f = kv 的阻力，k = 0.200 kg/s。求：(1) 速度随时间的关系 v(t)；(2) 位移随时间的关系 x(t)；(3) t = 3.00 s 时的速度与位移，以及物块能走出的总距离。","answer":"(1) v = 10.0e^(−0.500t) m/s；(2) x = 20.0(1 − e^(−0.500t)) m；(3) 2.23 m/s，15.5 m；总距离 20.0 m","explain":"由 m dv/dt = −kv 得 v = v₀e^(−kt/m)，其中 k/m = 0.500 s⁻¹。\n积分得 x = (m/k)v₀(1 − e^(−kt/m)) = 20.0(1 − e^(−0.500t))。\nt = 3.00 s 时 v = 2.23 m/s，x = 15.5 m；t → ∞ 时 x → 20.0 m。\n易错点：把阻力当恒力用匀减速公式；把 20.0 m 当成 3.00 s 内的位移；认为物块在有限时间内走完 20.0 m。"},{"id":"c02q026","type":"choice","difficulty":5,"tags":["非惯性系","加速车厢","惯性力"],"stem":"车厢以 3.00 m/s² 的加速度沿水平直轨向右加速，车厢顶部用长 1.00 m 的轻绳悬挂质量 0.500 kg 的小球，小球相对车厢静止。绳与竖直方向的夹角及绳中张力分别为（g = 9.80 m/s²）","options":["17.0°，6.40 N","17.0°，5.12 N","17.0°，4.90 N","73.0°，5.12 N"],"answer":"B","explain":"在车厢参考系中，小球受重力 mg、张力 T 与水平向左的惯性力 ma，三力平衡：tanθ = a/g = 0.306，θ = 17.0°。\nT = m√(g² + a²) = 0.500×10.2 = 5.12 N。\n易错点：4.90 N 漏掉惯性力；73.0° 把 tanθ 写成 g/a；6.40 N 把 g 与 a 当标量相加。"},{"id":"c02q027","type":"choice","difficulty":5,"tags":["二次阻力","v(t) 求解","对数位移"],"stem":"质量 0.200 kg 的小球在光滑水平面上以 20.0 m/s 运动，受与速度反向的阻力 f = kv²，k = 0.0250 N·s²/m²。速率减为 10.0 m/s 所需时间及该过程走过的距离分别为","options":["0.400 s，8.00 m","5.55 s，5.55 m","0.400 s，3.00 m","0.400 s，5.55 m"],"answer":"D","explain":"a = −kv²/m = −0.125v²。分离变量积分：1/v − 1/v₀ = 0.125t，即 v = 20.0/(1 + 2.50t)。\nv = 10.0 m/s 时 t = 0.400 s。\n位移由 v dv/dx = a 积分得 x = (m/k)ln(v₀/v) = 8.00×0.693 = 5.55 m。\n易错点：8.00 m 把 ln(v₀/v) 当成 1；5.55 s 把 f = kv² 当 f = kv 用对数式求时间；3.00 m 用初速率代 f 做能量估算（½m(v₀² − v²) = kv₀²x）。"},{"id":"c02q028","type":"choice","difficulty":5,"tags":["圆锥摆","最大张力","临界条件"],"stem":"长 1.00 m 的轻绳系质量 m 的小球做圆锥摆运动，绳能承受的最大张力为 2.00mg。绳即将断裂时，绳与竖直方向的夹角及小球的角速度分别为（g = 9.80 m/s²）","options":["60.0°，4.43 rad/s","60.0°，3.13 rad/s","30.0°，4.43 rad/s","60.0°，4.76 rad/s"],"answer":"A","explain":"Tcosθ = mg，T = 2.00mg 时 cosθ = 0.500，θ = 60.0°。\n由 Tsinθ = mω²Lsinθ 得 T = mω²L，故 ω = √(T/(mL)) = √(2g/L) = √19.6 = 4.43 rad/s。\n易错点：3.13 rad/s 漏掉张力上限、直接用 √(g/L)；30.0° 把 cos 与 sin 弄反；4.76 rad/s 把半径误写成 Lsinθ 代进 ω = √(T/(m r))。"},{"id":"c02q029","type":"choice","difficulty":5,"tags":["竖直圆轨道","最高点压力","机械能守恒"],"stem":"小球沿半径 0.800 m 的竖直圆轨道内侧运动，到达最高点时对轨道的压力恰好等于其重力。小球在最低点的速率为（g = 9.80 m/s²，摩擦不计）","options":["5.60 m/s","3.96 m/s","6.86 m/s","6.26 m/s"],"answer":"C","explain":"最高点：N + mg = mv_t²/R，N = mg，故 v_t² = 2gR。\n由机械能守恒：v_b² = v_t² + 4gR = 6gR = 47.0，v_b = 6.86 m/s。\n易错点：6.26 m/s 只按「恰好不脱离」取 v_t² = gR；5.60 m/s 漏掉压力项；3.96 m/s 能量只算 2gR。"},{"id":"c02q030","type":"choice","difficulty":5,"tags":["空气阻力抛体","上升与下降不对称","能量耗散"],"stem":"将小球以初速度 v₀ 竖直上抛，空气阻力大小与速率成正比。小球上升时间 t₁、从最高点落回抛出点的下降时间 t₂，以及落回抛出点时的速率 v 与 v₀ 的关系是","options":["t₁ \u003c t₂，v = v₀","t₁ \u003c t₂，v \u003c v₀","t₁ = t₂，v = v₀","t₁ > t₂，v \u003c v₀"],"answer":"B","explain":"上升过程阻力向下，合力 mg + kv 大于 mg；下降过程阻力向上，合力 mg − kv 小于 mg，同一高度处下降时速率更小、加速度也更小，故下降用时更长，t₁ \u003c t₂。\n阻力全程做负功，机械能减少，落回速率 v \u003c v₀。\n易错点：忽略阻力方向随运动方向改变，认为上下对称；只判断速率变小却把时间判反。"},{"id":"c02q031","type":"choice","difficulty":5,"tags":["弹簧连接体","剪断瞬间","弹簧力不突变"],"stem":"质量 2.00 kg 的物块 A 用轻绳悬挂，其下用轻弹簧连接质量 3.00 kg 的物块 B，系统静止。剪断悬绳的瞬间，A、B 的加速度分别为（取向下为正，g = 9.80 m/s²）","options":["9.80 m/s²，9.80 m/s²","24.5 m/s²，9.80 m/s²","4.90 m/s²，0","24.5 m/s²，0"],"answer":"D","explain":"剪断前弹簧拉力等于 B 的重力 29.4 N。\n剪断瞬间弹簧形变来不及改变：A 受重力 19.6 N 与弹簧拉力 29.4 N，方向均向下，a_A = (19.6 + 29.4)/2.00 = 24.5 m/s²；B 受弹簧拉力与重力抵消，a_B = 0。\n易错点：认为弹簧力瞬间消失（9.80/9.80）；只给 A 加重力；把 B 也算成加速。"},{"id":"c02q032","type":"choice","difficulty":5,"tags":["绳轮约束","动滑轮","加速度约束"],"stem":"质量 2.00 kg 的物块放在光滑水平桌面上，绳一端固定于墙，水平绕过动滑轮（下挂 1.00 kg 重物）后再绕过桌边定滑轮与物块相连。由静止释放，物块的加速度与绳中张力分别为（g = 9.80 m/s²）","options":["2.18 m/s²，4.36 N","1.96 m/s²，3.92 N","1.09 m/s²，4.36 N","2.18 m/s²，9.80 N"],"answer":"A","explain":"重物下降 y 时动滑轮两侧绳各缩短 y，物块前进 2y，故 a₁ = 2a₂。\n对物块 T = m₁a₁ = 2m₁a₂；对重物 m₂g − 2T = m₂a₂。代入得 9.80 − 8.00a₂ = 1.00a₂，a₂ = 1.09 m/s²，a₁ = 2.18 m/s²，T = 4.36 N。\n易错点：漏掉约束 a₁ = 2a₂ 得 1.96/3.92；把重物加速度 1.09 当成物块的加速度；9.80 N 把张力当成重物重力 m₂g。"},{"id":"c02q033","type":"choice","difficulty":5,"tags":["水平传送带","共速判断","分段运动"],"stem":"物块无初速地放在以 2.00 m/s 匀速运动的水平传送带上，物块与带间动摩擦因数 0.500，传送带两端相距 3.00 m。物块从放上到抵达另一端所需时间为（g = 9.80 m/s²）","options":["1.50 s","1.30 s","1.70 s","1.11 s"],"answer":"C","explain":"加速阶段 a = μg = 4.90 m/s²，达到带速需 t₁ = 2.00/4.90 = 0.408 s，位移 s₁ = ½a t₁² = 0.408 m。\n余下 2.59 m 与带共速匀速运动，t₂ = 2.59/2.00 = 1.30 s，总时间 1.70 s。\n易错点：1.11 s 认为全程匀加速；1.50 s 忽略加速段；1.30 s 只算匀速段。"},{"id":"c02q034","type":"choice","difficulty":5,"tags":["双斜面连接体","静摩擦是否足够","滑动方向判断"],"stem":"质量 2.00 kg 和 3.00 kg 的两物块分别放在倾角 30.0° 和 45.0° 的斜面上，用轻绳跨过顶端定滑轮相连，两物块与斜面间最大静摩擦因数均为 0.150、动摩擦因数均为 0.120。由静止释放后系统的运动状态为（g = 9.80 m/s²）","options":["发生滑动，加速度 1.96 m/s²","发生滑动，加速度 1.29 m/s²","保持静止","发生滑动，加速度 2.20 m/s²"],"answer":"B","explain":"不计摩擦时 3.00 kg 一侧驱动 3.00×9.80×sin45.0° = 20.8 N，2.00 kg 一侧 2.00×9.80×sin30.0° = 9.80 N，净驱动 11.0 N。\n最大静摩擦合计 0.150×9.80×(2cos30.0° + 3cos45.0°) = 5.66 N，小于 11.0 N，故发生滑动。\na = (11.0 − 0.120×9.80×3.853)/5.00 = (11.0 − 4.53)/5.00 = 1.29 m/s²。\n易错点：2.20 m/s² 忽略摩擦；1.96 m/s² 没把重力沿斜面分解；判断静止是只比较了两侧重力分量而没算静摩擦上限。"},{"id":"c02q035","type":"choice","difficulty":5,"tags":["竖直圆周运动","最低点与最高点","机械能守恒"],"stem":"小球系在轻绳一端，在竖直平面内做圆周运动。经过最低点时绳中张力为 7.00mg，经过最高点时绳中张力为","options":["0","3mg","5mg","mg"],"answer":"D","explain":"最低点：T_b − mg = mv_b²/L，得 v_b² = 6gL。\n由机械能守恒：v_t² = v_b² − 4gL = 2gL。\n最高点：T_t + mg = mv_t²/L = 2mg，故 T_t = mg。\n易错点：0 是「恰好通过最高点」的条件；3mg 漏掉能量关系中的一项；5mg 直接用 7mg − 2mg。"},{"id":"c02q036","type":"choice","difficulty":5,"tags":["非惯性系","加速车厢内物块","相对加速度"],"stem":"质量 2.00 kg 的物块放在以 4.00 m/s² 水平向右加速的车厢地板上，物块与地板间最大静摩擦因数 0.300、动摩擦因数 0.250。物块相对车厢的加速度为（g = 9.80 m/s²）","options":["1.55 m/s²，方向向左","1.06 m/s²，方向向左","4.00 m/s²，方向向左","0"],"answer":"A","explain":"车厢参考系中惯性力 ma = 8.00 N 向左，最大静摩擦 5.88 N 不够，物块相对车厢向后滑。\n滑动后动摩擦 4.90 N 向右，合力 3.10 N 向左，a_rel = 3.10/2.00 = 1.55 m/s²。\n易错点：1.06 m/s² 用最大静摩擦；4.00 m/s² 忘记摩擦；0 误判静摩擦足够。"},{"id":"c02q037","type":"choice","difficulty":5,"tags":["拱形桥","视重","腾空临界"],"stem":"汽车以速率 v 通过半径 45.0 m 的拱形桥最高点。当车对桥面的压力等于车重的一半时，v 为 v₁；车刚好腾空时，v 为 v₂。v₁ 和 v₂ 分别为（g = 9.80 m/s²）","options":["14.8 m/s，29.7 m/s","10.5 m/s，21.0 m/s","14.8 m/s，21.0 m/s","21.0 m/s，14.8 m/s"],"answer":"C","explain":"最高点：mg − N = mv²/R。\nN = mg/2 时 v₁² = gR/2 = 220.5，v₁ = 14.8 m/s；N = 0 时 v₂ = √(gR) = 21.0 m/s。\n易错点：两组颠倒；29.7 m/s 用 √(2gR)；10.5 m/s 把 gR/2 再除以 2。"},{"id":"c02q038","type":"choice","difficulty":5,"tags":["转盘","静摩擦临界","绳张力"],"stem":"质量 0.200 kg 的物块放在水平转盘上，用长 0.400 m 的轻绳与转轴相连，物块与盘面间最大静摩擦因数 0.350。当转盘以 4.00 rad/s 匀速转动时，绳中张力及绳刚要绷紧时的角速度分别为（g = 9.80 m/s²）","options":["1.28 N，2.93 rad/s","0.594 N，2.93 rad/s","0.594 N，4.95 rad/s","0，2.93 rad/s"],"answer":"B","explain":"所需向心加速度 ω²r = 6.40 m/s²，最大静摩擦只提供 μg = 3.43 m/s²，其余由绳提供：T = m(ω²r − μg) = 0.200×2.97 = 0.594 N。\n绳刚要绷紧时摩擦恰好够用：ω₀ = √(μg/r) = √8.58 = 2.93 rad/s。\n易错点：0 认为摩擦够；4.95 rad/s 用 √(g/r)；1.28 N 用 T = mω²r。"},{"id":"c02q039","type":"choice","difficulty":5,"tags":["非惯性系","加速楔块","静摩擦临界"],"stem":"倾角 30.0° 的楔块以 4.00 m/s² 水平向右加速，斜面沿右下方倾斜，其上放一物块，物块相对楔块静止。物块与斜面间所需最小静摩擦因数为（g = 9.80 m/s²）","options":["0.169","0.577","1.29","0.137"],"answer":"D","explain":"楔块参考系中惯性力 ma 水平向左，沿斜面（向上）的分量为 ma cos30.0° = 3.46 N/kg，重力沿斜面向下的分量为 gsin30.0° = 4.90 N/kg，差值 1.44 N/kg，物块有下滑趋势。\n法向：N/m = gcos30.0° + asin30.0° = 10.49 N/kg。\nμ_min = 1.44/10.49 = 0.137。\n易错点：0.169 漏掉惯性力的法向分量；0.577 用 tan30.0°；1.29 把惯性力方向弄反。"},{"id":"c02q040","type":"choice","difficulty":5,"tags":["双绳圆锥摆","几何约束","下绳松弛临界"],"stem":"两根长均为 1.00 m 的轻绳，一端分别系在竖直转轴上的 A、B 两点，A 在 B 上方 1.50 m，另一端系在同一质量 0.500 kg 的小球上，小球随转轴以角速度 ω 在水平面内转动。下绳刚要松弛时，ω 及上绳张力分别为（g = 9.80 m/s²）","options":["3.61 rad/s，6.53 N","3.13 rad/s，6.53 N","3.61 rad/s，4.90 N","3.85 rad/s，6.53 N"],"answer":"A","explain":"两绳等长且 A、B 相距 1.50 m，由几何关系小球在 A 下方 0.750 m、半径 r = √(1.00² − 0.750²) = 0.661 m。\n下绳松弛时 T₂ = 0，上绳竖直分量 T₁cosθ = mg，cosθ = 0.750；水平分量提供向心力 T₁sinθ = mω²r。\n联立得 ω = √(g/0.750) = 3.61 rad/s，T₁ = 4.90/0.750 = 6.53 N。\n易错点：3.13 rad/s 用 √(g/L)；4.90 N 把张力当重力；3.85 rad/s 用半径代替高度。"},{"id":"c02q041","type":"choice","difficulty":5,"tags":["空气阻力","终极速度","量纲与比例"],"stem":"两个雨滴半径之比为 1:2，密度相同，下落时空气阻力 f = kv²，比例系数 k 与横截面积成正比。它们各自的终极速度之比 v₁:v₂ 为","options":["1:1","1:4","1:1.41","1:2"],"answer":"C","explain":"终极速度时 mg = kv²，v_t = √(mg/k)。\n质量与 r³ 成正比，k 与 r² 成正比，故 v_t 与 √r 成正比，v₁:v₂ = √(1/2) = 1:1.41。\n易错点：1:2 只比较半径；1:1 认为终极速度与尺寸无关；1:4 用 r² 比较。"},{"id":"c02q042","type":"calc","difficulty":5,"tags":["非惯性系","加速楔块","相对加速度"],"stem":"倾角 30.0° 的楔块以 2.00 m/s² 水平向右加速，斜面沿右下方倾斜，楔块上放一质量 1.00 kg 的物块，接触面光滑，g = 9.80 m/s²。求：(1) 物块相对楔块的加速度；(2) 楔块对物块的支持力；(3) 楔块加速度增大到多少时物块不再相对楔块下滑。","answer":"(1) 3.17 m/s²，方向沿斜面向下；(2) 9.49 N；(3) 5.66 m/s²（此时相对静止，再大则相对上滑）","explain":"取楔块参考系，惯性力 ma 水平向左，沿斜面向上的分量为 macos30.0° = 1.73 N，重力沿斜面向下的分量为 mgsin30.0° = 4.90 N。\na_rel = gsin30.0° − acos30.0° = 4.90 − 1.73 = 3.17 m/s²，方向沿斜面向下。\n法向：N = m(gcos30.0° + asin30.0°) = 8.49 + 1.00 = 9.49 N。\n令 a_rel = 0 得 a = gtan30.0° = 5.66 m/s²，再大物块相对楔块向上滑。\n易错点：忘记惯性力；惯性力方向取反；认为支持力仍等于 mgcos30.0°。"},{"id":"c02q043","type":"calc","difficulty":5,"tags":["电梯","视重","多阶段过程"],"stem":"质量 5.00 kg 的物体挂在弹簧秤下，随电梯从静止开始上升：前 2.00 s 以 2.00 m/s² 匀加速，接着 4.00 s 匀速，最后 2.00 s 匀减速到停止，g = 9.80 m/s²。求：(1) 三个阶段弹簧秤的读数；(2) 电梯上升的总高度；(3) 若上升途中钢缆断裂，电梯自由下落时弹簧秤的读数。","answer":"(1) 59.0 N、49.0 N、39.0 N；(2) 24.0 m；(3) 0","explain":"加速段末速 v = a₁t₁ = 4.00 m/s；减速段在 2.00 s 内由 4.00 m/s 减到 0，故 a₃ = 2.00 m/s²，方向向下。\n读数 F = m(g + a)：加速上升 F = 5.00×11.8 = 59.0 N；匀速 F = mg = 49.0 N；减速上升 a 向下，F = 5.00×7.80 = 39.0 N。\n高度 = ½a₁t₁² + vt₂ + ½a₃t₃² = 4.00 + 16.0 + 4.00 = 24.0 m。\n自由下落时物体与秤都只受重力，相对加速度为零，读数 0。\n易错点：减速上升误当超重；把匀速段读数算成 0；自由下落仍按 mg 读数。"},{"id":"c02q044","type":"calc","difficulty":5,"tags":["线性阻力","终极速度","变加速下落"],"stem":"质量 0.500 kg 的物体从静止开始竖直下落，受空气阻力 f = kv，k = 0.250 kg/s，g = 9.80 m/s²。求：(1) 终极速度；(2) 速度随时间的关系及 t = 4.00 s 时的速率；(3) t = 4.00 s 内下落的距离和达到终极速度 90% 所需时间。","answer":"(1) 19.6 m/s；(2) v = 19.6(1 − e^(−0.500t)) m/s，17.0 m/s；(3) 44.5 m，4.61 s","explain":"a = g − (k/m)v，令 a = 0 得 v∞ = mg/k = 19.6 m/s。\n分离变量积分得 v = v∞(1 − e^(−kt/m))，k/m = 0.500 s⁻¹，t = 4.00 s 时 v = 19.6×0.865 = 17.0 m/s。\n积分得 y = v∞t − (v∞m/k)(1 − e^(−kt/m)) = 78.4 − 33.9 = 44.5 m。\n90% 时 e^(−0.500t) = 0.100，t = ln10/0.500 = 4.61 s。\n易错点：用 y = ½gt² 得 78.4 m；把 19.6 m/s 当 4.00 s 内的平均速度；认为 4.00 s 已到终极速度。"},{"id":"c02q045","type":"calc","difficulty":5,"tags":["可动楔块","约束联立","反冲"],"stem":"质量 M = 3.00 kg、倾角 30.0° 的楔块放在光滑水平面上，质量 m = 1.00 kg 的物块从楔块斜面顶端由静止释放，所有接触面光滑，g = 9.80 m/s²。求：(1) 楔块的加速度；(2) 物块相对楔块的加速度；(3) 物块与楔块间的支持力及地面对楔块的支持力。","answer":"(1) 1.31 m/s²，方向与物块水平分运动相反；(2) 6.03 m/s²，沿斜面向下；(3) 7.83 N，36.2 N","explain":"设楔块向左加速 A、物块相对楔块沿斜面向下加速 a_rel，则物块水平加速度为 a_relcos30.0° − A，竖直向下为 a_relsin30.0°。\n对物块法向：N = m(gcos30.0° − Asin30.0°)；对楔块水平：Nsin30.0° = MA；对物块沿斜面：mgsin30.0° − Nsin30.0° = ma_rel。\n联立得 A = mgsin30.0°cos30.0°/(M + msin²30.0°) = 1.31 m/s²，a_rel = (M+m)gsin30.0°/(M + msin²30.0°) = 6.03 m/s²。\nN = 7.83 N，地面对楔块的支持力 = (M+m)g − ma_relsin30.0° = 36.2 N。\n易错点：把 a_rel 当成物块对地加速度；认为 N = mgcos30.0°；漏掉楔块反冲。"},{"id":"c02q046","type":"calc","difficulty":5,"tags":["有质量滑轮","转动惯量","连接体"],"stem":"质量 2.00 kg 和 3.00 kg 的两物块用轻绳跨过质量 1.00 kg、半径 0.100 m 的均匀圆盘滑轮相连，滑轮可绕水平中心轴无摩擦转动，转动惯量 I = ½MR²。由静止释放，g = 9.80 m/s²。求：(1) 两物块的加速度；(2) 两侧绳中张力。","answer":"(1) 1.78 m/s²；(2) 23.2 N（2.00 kg 侧），24.1 N（3.00 kg 侧）","explain":"设 3.00 kg 物块下降的加速度为 a，两侧张力为 T₁、T₂。\nm₂g − T₂ = m₂a，T₁ − m₁g = m₁a，滑轮 (T₂ − T₁)R = Iα = ½MR²·(a/R)。\n三式联立得 a = (m₂ − m₁)g/(m₁ + m₂ + M/2) = 9.80/5.50 = 1.78 m/s²。\nT₁ = 2.00×11.58 = 23.2 N，T₂ = 3.00×8.02 = 24.1 N，T₂ > T₁，差值提供角加速度。\n易错点：把滑轮当无质量得 a = 1.96 m/s² 且两侧张力相等；忘记 I 中的 ½；误写 T₂ − T₁ = Ma。"},{"id":"c02q047","type":"calc","difficulty":5,"tags":["斜面与悬挂连接体","静摩擦判断","张力"],"stem":"质量 3.00 kg 的物块 A 放在倾角 30.0° 的斜面上，用轻绳跨过斜面顶端定滑轮与竖直悬挂的 4.00 kg 物块 B 相连，A 与斜面间最大静摩擦因数 0.400、动摩擦因数 0.300，g = 9.80 m/s²。求：(1) 释放后系统是否运动，摩擦力大小与方向；(2) 若运动，求加速度和绳中张力。","answer":"(1) 运动，B 下降、A 沿斜面向上滑，摩擦力沿斜面向下；(2) a = 2.41 m/s²，T = 29.6 N","explain":"B 的重力 39.2 N，A 沿斜面向下的重力分量 14.7 N，净驱动 24.5 N；最大静摩擦 0.400×3.00×9.80×cos30.0° = 10.2 N，小于 24.5 N，故 B 下降、A 上滑，摩擦力沿斜面向下。\na = (24.5 − 0.300×3.00×9.80×cos30.0°)/7.00 = (24.5 − 7.64)/7.00 = 2.41 m/s²。\n对 B：T = m_B(g − a) = 4.00×7.39 = 29.6 N。\n易错点：漏掉静摩擦判断直接算；摩擦力方向取反；把 39.2 N 当张力。"},{"id":"c02q048","type":"calc","difficulty":5,"tags":["旋转圆环","自然坐标系","法向方程"],"stem":"半径 0.500 m 的光滑圆环绕其竖直直径以 6.00 rad/s 匀速转动，环上套一质量 0.200 kg 的小环（可视为质点），g = 9.80 m/s²。求：(1) 小环相对圆环静止时与最低点的夹角；(2) 圆环对小环的支持力；(3) 小环能偏离最低点的最小角速度。","answer":"(1) 57.0°；(2) 3.60 N；(3) 4.43 rad/s","explain":"小环在水平面内做半径 r = Rsinθ 的圆周运动。沿切向：mgsinθ = mω²Rsinθcosθ，得 cosθ = g/(ω²R) = 9.80/18.0 = 0.544，θ = 57.0°。\n沿法向（指向圆心）：N − mgcosθ = mω²Rsin²θ，代入得 N = mg/cosθ = 3.60 N，也等于 mω²R。\n要求 cosθ ≤ 1，即 ω ≥ √(g/R) = 4.43 rad/s，否则只有最低点一个平衡位置。\n易错点：忘记法向方程直接用 N = mg；把 θ 从最高点量起；认为任何 ω 下都能偏离最低点平衡。"},{"id":"c02q049","type":"calc","difficulty":5,"tags":["球面脱离","临界条件","机械能守恒"],"stem":"小球从半径 1.20 m 的光滑球面顶点由静止开始下滑，g = 9.80 m/s²。求：(1) 小球离开球面时与竖直方向的夹角；(2) 离开时的速率；(3) 离开点距球面顶点的高度。","answer":"(1) 48.2°；(2) 2.80 m/s；(3) 0.400 m","explain":"设离开时与竖直方向夹角为 θ、速率为 v：mgcosθ − N = mv²/R，离开时 N = 0，故 v² = gRcosθ。\n下滑过程机械能守恒：½mv² = mgR(1 − cosθ)，即 v² = 2gR(1 − cosθ)。\n联立得 cosθ = 2/3，θ = 48.2°，v = √(2gR/3) = 2.80 m/s，高度 h = R(1 − cosθ) = 0.400 m。\n易错点：用 N = 0 但漏掉 cosθ；把离开条件写成 v² = gR；能量方程漏掉 ½。"},{"id":"c02q050","type":"calc","difficulty":5,"tags":["倾斜传送带","共速判断","分段加速度"],"stem":"传送带与水平面成 30.0°，以 2.00 m/s 的速率沿斜面向下运行，两端相距 4.00 m。物块从顶端无初速轻放，与带间动摩擦因数 0.400，g = 9.80 m/s²。求：(1) 物块与带达到共速所需时间及此间位移；(2) 物块到达底端的总时间；(3) 到达底端时的速率。","answer":"(1) 0.241 s，0.241 m；(2) 1.51 s；(3) 3.91 m/s","explain":"开始时带比物块快，摩擦力沿斜面向下：a₁ = g(sin30.0° + μcos30.0°) = 8.29 m/s²，t₁ = 2.00/8.29 = 0.241 s，s₁ = ½a₁t₁² = 0.241 m。\n共速后重力分量 gsin30.0° = 4.90 m/s² 大于摩擦所能提供的 μgcos30.0° = 3.39 m/s²，物块继续加速，摩擦力转为沿斜面向上：a₂ = g(sin30.0° − μcos30.0°) = 1.51 m/s²。\n剩余 3.76 m：3.76 = 2.00t₂ + 0.753t₂²，解得 t₂ = 1.27 s，总时间 1.51 s，末速率 v = 2.00 + 1.51×1.27 = 3.91 m/s。\n易错点：认为共速后匀速（得 2.12 s）；一直用 a₁（约 0.982 s）；共速后摩擦方向不变。"}]},{"chapter":3,"chapterName":"动量与质心","questions":[{"id":"c03q001","type":"choice","difficulty":3,"tags":["变力冲量","积分法"],"stem":"质量 2.00 kg 的质点静止于光滑水平面上，从 t = 0 起受到沿 x 轴正方向的力 F = 6.00 + 4.00t（SI 单位）。在 0 至 2.00 s 内，该力的冲量大小和平均力分别为","options":["20.0 N·s，10.0 N","12.0 N·s，6.00 N","28.0 N·s，14.0 N","8.00 N·s，4.00 N"],"answer":"A","explain":"解析：冲量是力对时间的积分，J = ∫₀²(6.00 + 4.00t)dt = 6.00×2.00 + ½×4.00×2.00² = 12.0 + 8.00 = 20.0 N·s；平均力 F̄ = J/Δt = 20.0/2.00 = 10.0 N。易错：只积常数项得 12.0 N·s；把末时刻力 14.0 N 当平均力得 28.0 N·s；只积变力项得 8.00 N·s。"},{"id":"c03q002","type":"choice","difficulty":3,"tags":["冲量","平均冲力","动量定理"],"stem":"质量 0.200 kg 的小球以 10.0 m/s 的速率斜射向竖直墙面，入射速度与墙面法线成 30.0°。小球与墙面碰撞后沿法线对称方向反弹，速率仍为 10.0 m/s，接触时间为 0.0100 s。墙面对小球的平均作用力大小为","options":["200 N","173 N","400 N","346 N"],"answer":"D","explain":"解析：取法线向外为正，入射法向分量为 −v cos30.0°，反弹后为 +v cos30.0°，切向分量不变。Δp = 2mv cos30.0° = 2×0.200×10.0×0.866 = 3.46 N·s，F̄ = Δp/Δt = 3.46/0.0100 = 346 N。易错：漏掉 cos30.0° 得 400 N；只算法向一次得 200 N；用 mv cos30.0° 得 173 N。"},{"id":"c03q003","type":"choice","difficulty":3,"tags":["完全非弹性碰撞","动能损失"],"stem":"质量 2.00 kg 的小球以 3.00 m/s 的速率在光滑水平面上运动，与静止的 1.00 kg 小球发生完全非弹性碰撞后粘在一起。碰撞中损失的动能占初始动能的比例为","options":["66.7%","25.0%","33.3%","50.0%"],"answer":"C","explain":"解析：动量守恒 2.00×3.00 = (2.00+1.00)v，v = 2.00 m/s；E₀ = ½×2.00×3.00² = 9.00 J，E = ½×3.00×2.00² = 6.00 J，损失比例 = (9.00−6.00)/9.00 = 1/3 = 33.3%。一般地，靶静止时损失比例为 m₂/(m₁+m₂)。易错：把损失当成 50%；用速度比 2/3 当能量比；只算碰后动能占比 66.7% 却答成损失。"},{"id":"c03q004","type":"choice","difficulty":3,"tags":["质心速度","矢量合成"],"stem":"两个质点在同一光滑水平面上运动：m₁ = 2.00 kg，速度 v₁ = (3.00 i − 1.00 j) m/s；m₂ = 3.00 kg，速度 v₂ = (−1.00 i + 4.00 j) m/s。系统质心的速度大小为","options":["1.12 m/s","2.09 m/s","1.80 m/s","3.33 m/s"],"answer":"B","explain":"解析：v_c = (m₁v₁ + m₂v₂)/(m₁+m₂) = [(6.00−3.00)i + (−2.00+12.0)j]/5.00 = (0.600 i + 2.00 j) m/s，大小 √(0.600²+2.00²) = 2.09 m/s。易错：把两速度直接算术平均得 1.80 m/s；把总动量当速度得 3.33 m/s；交换两质量权重得 1.12 m/s。"},{"id":"c03q005","type":"choice","difficulty":4,"tags":["完全非弹性碰撞","弹簧势能","动量守恒"],"stem":"质量 10.0 g 的子弹以 400 m/s 的水平速度射入静止在光滑水平面上、质量 1.99 kg 的木块并留在其中。木块与劲度系数 200 N/m 的水平轻弹簧相连，求弹簧被压缩的最大长度。","options":["0.200 m","2.83 m","0.0141 m","0.141 m"],"answer":"A","explain":"解析：第一阶段完全非弹性碰撞，0.0100×400 = (1.99+0.0100)v，v = 2.00 m/s；第二阶段系统动能全部转化为弹簧势能，½×2.00×2.00² = ½×200x²，x = 0.200 m。易错：直接用子弹动能 800 J 压缩弹簧得 2.83 m；只算子弹质量对应的动能得 0.0141 m；把 ½kx² 写成 kx² 得 0.141 m。"},{"id":"c03q006","type":"choice","difficulty":4,"tags":["弹簧缓冲","约化质量","动量守恒"],"stem":"质量 2.00 kg 的小车 A 以 3.00 m/s 的速率在光滑水平直轨道上运动，与静止的质量 4.00 kg 的小车 B 正碰。B 的前端装有劲度系数 120 N/m 的轻弹簧，碰撞过程中弹簧始终在弹性限度内。弹簧的最大压缩量为","options":["0.387 m","0.224 m","0.548 m","0.316 m"],"answer":"D","explain":"解析：最大压缩时两车同速，v_c = 2.00×3.00/6.00 = 1.00 m/s；损失的动能全部转为弹簧势能，ΔE = ½μv_rel²，μ = 2.00×4.00/6.00 = 1.33 kg，ΔE = ½×1.33×3.00² = 6.00 J；½×120x² = 6.00，x = 0.316 m。易错：把全部初动能 9.00 J 当压缩能得 0.387 m；只取一半损失得 0.224 m；把约化质量取成 4.00 kg 得 0.548 m。"},{"id":"c03q007","type":"choice","difficulty":4,"tags":["恢复系数","斜碰","冲量"],"stem":"小球以 12.0 m/s 的速率斜射向光滑竖直墙面，入射速度与墙面成 45.0°。小球与墙面碰撞的恢复系数 e = 0.800，切向速度不变。碰后小球的速率为","options":["12.0 m/s","8.49 m/s","10.9 m/s","9.60 m/s"],"answer":"C","explain":"解析：法向分量 v_n = 12.0 cos45.0° = 8.49 m/s，碰后反向并乘 e：v_n′ = 6.79 m/s；切向分量 v_t = 12.0 sin45.0° = 8.49 m/s 不变。v′ = √(6.79²+8.49²) = 10.9 m/s。易错：把两个分量都乘 e 得 9.60 m/s；认为完全弹性得 12.0 m/s；只保留切向分量得 8.49 m/s。"},{"id":"c03q008","type":"choice","difficulty":4,"tags":["F–t 图像","冲量","动量定理"],"stem":"质量 0.500 kg 的质点静止在光滑水平面上，0 至 0.60 s 内受到的合力随时间变化：0 至 0.20 s 由 0 均匀增大到 10.0 N，0.20 s 至 0.50 s 保持 10.0 N，0.50 s 至 0.60 s 由 10.0 N 均匀减小到 0。t = 0.60 s 时质点的速度为","options":["7.00 m/s","9.00 m/s","6.00 m/s","12.0 m/s"],"answer":"B","explain":"解析：F–t 图线与时间轴围成的面积等于冲量：J = ½×0.20×10.0 + 0.30×10.0 + ½×0.10×10.0 = 1.00+3.00+0.50 = 4.50 N·s；v = J/m = 4.50/0.500 = 9.00 m/s。易错：漏掉两段三角形只算矩形得 6.00 m/s；把三段都按满高 10.0 N 算得 12.0 m/s；漏掉末段三角形得 7.00 m/s。"},{"id":"c03q009","type":"choice","difficulty":4,"tags":["爆炸","动量守恒","二维矢量"],"stem":"质量 3.00 kg 的物体在光滑水平面上以 6.00 m/s 的速率沿 x 轴正方向运动，突然炸裂成两块：质量 1.00 kg 的一块沿 y 轴正方向以 12.0 m/s 运动，另一块质量 2.00 kg。另一块的速度大小和方向为","options":["10.8 m/s，与 x 轴成 33.7° 向下","10.8 m/s，与 x 轴成 56.3° 向下","15.0 m/s，与 x 轴成 45.0° 向下","6.00 m/s，沿 x 轴负方向"],"answer":"A","explain":"解析：爆炸内力远大于外力，动量守恒。p₀ = (18.0 i) kg·m/s，p₁ = (12.0 j) kg·m/s，故 p₂ = (18.0 i − 12.0 j) kg·m/s，v₂ = (9.00 i − 6.00 j) m/s，大小 √(81.0+36.0) = 10.8 m/s，与 x 轴夹角 tanθ = 6.00/9.00，θ = 33.7° 向下。易错：把 12.0 m/s 直接相减得 6.00 m/s；用 18.0/2.00 得 9.00 m/s 却漏掉 y 分量；把夹角取成 56.3°（余角）。"},{"id":"c03q010","type":"choice","difficulty":4,"tags":["冲量","动量定理","曲线运动"],"stem":"质量 1200 kg 的汽车在水平路面上以 20.0 m/s 的速率向东匀速行驶，5.00 s 内转过 90° 后以同样速率向北行驶。汽车所受合外力的冲量大小和平均合力大小分别为","options":["2.40×10⁴ N·s，4.80×10³ N","0，0","4.80×10⁴ N·s，9.60×10³ N","3.39×10⁴ N·s，6.79×10³ N"],"answer":"D","explain":"解析：速率不变但速度方向改变，Δv = v_北 − v_东，大小 √2×20.0 = 28.3 m/s；I = m|Δv| = 1200×28.3 = 3.39×10⁴ N·s，F̄ = I/Δt = 3.39×10⁴/5.00 = 6.79×10³ N。易错：认为速率不变冲量为零；只取一个速度分量得 2.40×10⁴ N·s；把 |Δv| 当成 2v 得 4.80×10⁴ N·s。"},{"id":"c03q011","type":"choice","difficulty":4,"tags":["冲击摆","完全非弹性碰撞","机械能守恒"],"stem":"质量 0.0500 kg 的弹丸以 40.0 m/s 的水平速度射入悬挂着的质量 0.450 kg 的沙袋并留在其中。沙袋随后摆起的最大高度为（g = 9.80 m/s²）","options":["1.63 m","81.6 m","0.816 m","1.01 m"],"answer":"C","explain":"解析：第一阶段完全非弹性碰撞，0.0500×40.0 = 0.500v，v = 4.00 m/s；第二阶段机械能守恒，½v² = gh，h = 4.00²/(2×9.80) = 0.816 m。易错：漏掉弹丸质量得 v = 4.44 m/s、h = 1.01 m；用 h = v²/g 得 1.63 m；直接用弹丸速度 40.0 m/s 代入得 81.6 m。"},{"id":"c03q012","type":"choice","difficulty":4,"tags":["弹性斜碰","等质量碰撞","动量守恒"],"stem":"两个质量相同的小球在光滑水平面上发生弹性碰撞。球 A 以 4.20 m/s 的速率运动，与静止的球 B 相碰后，A 的速度方向与原方向成 30.0°。碰后 B 的速率为","options":["2.42 m/s","2.10 m/s","3.64 m/s","4.20 m/s"],"answer":"B","explain":"解析：等质量弹性斜碰中，碰后两球速度互相垂直。由动量守恒沿原方向：v₀ = v_A′cos30.0° + v_B′cos60.0°，垂直方向：v_A′sin30.0° = v_B′sin60.0°，联立得 v_B′ = v₀sin30.0° = 2.10 m/s。也可由速度三角形直接读出。易错：把 A 的速率 3.64 m/s 当成 B 的；认为速率不变得 4.20 m/s；用 v₀/√3 得 2.42 m/s。"},{"id":"c03q013","type":"choice","difficulty":4,"tags":["连续体落沙","动量守恒","变质量"],"stem":"质量 20.0 kg 的小车以 3.00 m/s 的速率在光滑水平直轨道上运动，沙子从上方竖直落向小车，落沙率为 2.00 kg/s，沙子落到车上后相对车静止。4.00 s 后小车的速率为","options":["2.14 m/s","3.00 m/s","1.50 m/s","4.20 m/s"],"answer":"A","explain":"解析：水平方向无外力，车与已落上的沙水平动量守恒：20.0×3.00 = (20.0+2.00×4.00)v，v = 60.0/28.0 = 2.14 m/s。沙子竖直方向的动量由地面支持力冲量抵消，不影响水平速度。易错：认为落沙不改变车速得 3.00 m/s；把 4.00 s 内落沙算成 20.0 kg 得 1.50 m/s；把质量比倒过来得 4.20 m/s。"},{"id":"c03q014","type":"choice","difficulty":4,"tags":["动量守恒","相对滑动","功能原理"],"stem":"质量 1.00 kg 的物块以 2.00 m/s 的水平速度滑上静止在光滑水平面上的质量 3.00 kg 的长木板，物块与木板间的动摩擦因数为 0.300。物块最终相对木板静止。物块相对木板滑行的距离为（g = 9.80 m/s²）","options":["0.680 m","0.255 m","0.128 m","0.510 m"],"answer":"D","explain":"解析：物块与木板系统水平动量守恒，1.00×2.00 = 4.00v，v = 0.500 m/s。损失动能 ΔE = ½×1.00×2.00² − ½×4.00×0.500² = 2.00−0.500 = 1.50 J，全部由相对滑动摩擦消耗：μmgd = 1.50，d = 1.50/(0.300×1.00×9.80) = 0.510 m。易错：用初动能 2.00 J 得 0.680 m；漏掉 ½ 得 0.255 m；把摩擦功写成 μ(M+m)gd 得 0.128 m。"},{"id":"c03q015","type":"choice","difficulty":4,"tags":["反冲","动量守恒","动能分配"],"stem":"质量 4.00 kg 的步枪水平发射质量 10.0 g 的子弹，子弹出口速率为 600 m/s。枪身后退的速率及子弹与枪身的动能之比分别为","options":["1.50 m/s，600∶1","1.50 m/s，1∶1","1.50 m/s，400∶1","0.600 m/s，400∶1"],"answer":"C","explain":"解析：水平方向动量守恒，0.0100×600 = 4.00V，V = 1.50 m/s；E_弹 = ½×0.0100×600² = 1.80×10³ J，E_枪 = ½×4.00×1.50² = 4.50 J，比值 = 400∶1 = M/m。易错：把 1.50 除以 10 得 0.600 m/s；用速率比 400 当能量比；认为动量等大则动能相等。"},{"id":"c03q016","type":"choice","difficulty":4,"tags":["恢复系数","反弹高度","能量损失"],"stem":"小球从 1.80 m 高处由静止自由下落，与水平地面碰撞的恢复系数 e = 0.800，空气阻力不计。小球第一次反弹的最大高度及碰撞中损失的机械能比例分别为","options":["1.15 m，64.0%","1.15 m，36.0%","1.44 m，20.0%","0.900 m，50.0%"],"answer":"B","explain":"解析：碰前速率 v = √(2gh)，碰后 v′ = ev，反弹高度 h′ = v′²/(2g) = e²h = 0.640×1.80 = 1.15 m；损失比例 = 1−e² = 36.0%。易错：把 e 直接乘高度得 1.44 m；认为损失 e = 20%；把保留比例 64.0% 当成损失。"},{"id":"c03q017","type":"choice","difficulty":4,"tags":["完全非弹性碰撞","多体碰撞","动量守恒"],"stem":"质量 12.0 g 的子弹以 350 m/s 的水平速度射入静止在光滑水平面上的质量 1.00 kg 的木块并留在其中，随后木块又与前方静止的质量 2.00 kg 的木块发生完全非弹性碰撞。三者的共同速度为","options":["1.39 m/s","4.15 m/s","2.10 m/s","3.50 m/s"],"answer":"A","explain":"解析：全过程水平方向动量守恒，不必分两段：0.0120×350 = (0.0120+1.00+2.00)v，v = 4.20/3.012 = 1.39 m/s。若分两段，第一段 v₁ = 4.20/1.012 = 4.15 m/s，第二段 1.012×4.15 = 3.012v，结果相同。易错：只算第一段得 4.15 m/s；漏掉子弹质量得 2.10 m/s；把总质量算成 1.20 kg 得 3.50 m/s。"},{"id":"c03q018","type":"choice","difficulty":4,"tags":["传送带落煤","动量流","功率"],"stem":"水平传送带以 1.20 m/s 的速率匀速运行，煤粉从上方竖直落到带上，落煤率为 25.0 kg/s，煤粉落到带上后随带一起运动。为维持传送带匀速运行，驱动电机需提供的水平作用力及功率分别为","options":["30.0 N，18.0 W","15.0 N，18.0 W","25.0 N，30.0 W","30.0 N，36.0 W"],"answer":"D","explain":"解析：单位时间落到带上的煤获得水平动量 qv，故所需力 F = v dm/dt = 1.20×25.0 = 30.0 N，功率 P = Fv = 30.0×1.20 = 36.0 W。煤的动能增加率只有 ½qv² = 18.0 W，另一半在煤与带相对滑动中耗散。易错：把动能增加率当驱动功率得 18.0 W；漏掉 v 得 15.0 N；把落煤率当力得 25.0 N。"},{"id":"c03q019","type":"choice","difficulty":5,"tags":["火箭方程","变质量","对数关系"],"stem":"某火箭在远离星体的太空中由静止开始飞行，初始总质量 1200 kg，燃料烧掉 400 kg 后关机，喷气相对火箭的速率为 1.50 km/s。火箭关机时的速率为","options":["500 m/s","1.65×10³ m/s","608 m/s","750 m/s"],"answer":"C","explain":"解析：齐奥尔科夫斯基公式 Δv = u ln(m₀/m) = 1.50×10³×ln(1200/800) = 1.50×10³×0.405 = 608 m/s。易错：用 Δm/m_f 线性计算得 750 m/s；用 Δm/m₀ 得 500 m/s；把剩余质量取成烧掉的 400 kg 得 1.65×10³ m/s。"},{"id":"c03q020","type":"choice","difficulty":5,"tags":["水流冲击","动量流","恢复系数"],"stem":"密度 1.00×10³ kg/m³ 的水流以 20.0 m/s 的速率垂直冲击一块固定平板，水束横截面积为 5.00 cm²。水冲击平板后以原速率的 0.600 倍沿原路反弹，其余水沿板面散开。水对平板的作用力大小为","options":["400 N","320 N","200 N","120 N"],"answer":"B","explain":"解析：质量流量 q = ρAv = 1.00×10³×5.00×10⁻⁴×20.0 = 10.0 kg/s；法向动量变化率 F = qv(1+e) = 10.0×20.0×1.60 = 320 N。若完全吸收 e = 0 则为 200 N；若完全反弹 e = 1 则为 400 N。易错：漏掉反弹项得 200 N；只算反弹部分 qve 得 120 N；把 e 当成 1 得 400 N。"},{"id":"c03q021","type":"choice","difficulty":5,"tags":["二维碰撞","动量守恒","矢量分解"],"stem":"质量 2.00 kg 的球 A 以 5.00 m/s 的速率沿 x 轴正方向运动，与静止的质量 3.00 kg 的球 B 发生斜碰。碰后 A 的速率为 3.00 m/s，方向与 x 轴正方向成 60.0° 向上。碰后 B 的速率为","options":["2.91 m/s","3.46 m/s","2.33 m/s","1.73 m/s"],"answer":"A","explain":"解析：碰后 A 的动量 p_A = 2.00×3.00(cos60.0° i + sin60.0° j) = (3.00 i + 5.20 j) kg·m/s；初动量 p₀ = 10.0 i，故 p_B = (7.00 i − 5.20 j)，v_B = p_B/3.00 = (2.33 i − 1.73 j) m/s，大小 2.91 m/s。易错：只做标量相减得 3.46 m/s；只取 x 分量得 2.33 m/s；只取 y 分量得 1.73 m/s。"},{"id":"c03q022","type":"choice","difficulty":5,"tags":["爆炸","动量守恒","动能变化","质心"],"stem":"质量 M = 4.00 kg 的炮弹以 v₀ = 20.0 m/s 沿水平方向飞行，在最高点炸成质量分别为 1.00 kg 和 3.00 kg 的两块，其中 1.00 kg 的那块炸后速度变为 40.0 m/s 仍沿原水平方向。爆炸过程中释放的化学能为","options":["A  267 J","B  533 J","C  800 J","D  1067 J"],"answer":"A","explain":"水平方向动量守恒：4.00×20.0 = 1.00×40.0 + 3.00×v₂，得 v₂ = (80.0 − 40.0)/3.00 = 13.3 m/s。爆炸前总动能 ½×4.00×20.0² = 800 J；爆炸后 ½×1.00×40.0² + ½×3.00×13.3² = 800 + 266 = 1066 J。释放能量 = 1066 − 800 = 266 J ≈ 267 J。错选 C 是把炸后动能当释放能量；错选 D 是忘了减去初动能。"},{"id":"c03q023","type":"choice","difficulty":5,"tags":["链条落桌","动量流","冲力"],"stem":"质量线密度 2.00 kg/m 的柔软链条竖直悬挂，下端恰好接触桌面，由静止释放。当已有 1.00 m 长的链条落到桌面上时，桌面受到的压力为（g = 9.80 m/s²）","options":["39.2 N","78.4 N","58.8 N","19.6 N"]
