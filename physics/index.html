,"answer":"C","explain":"解析：已落地部分重力 λxg = 2.00×1.00×9.80 = 19.6 N；落下的链条速度 v = √(2gx) = 4.43 m/s，质量到达率 λv，动量被桌面完全吸收，附加力 λv² = 2λgx = 39.2 N；总力 F = 3λgx = 58.8 N。易错：只算重力得 19.6 N；只算动量流得 39.2 N；把系数写成 4 得 78.4 N。"},{"id":"c03q024","type":"choice","difficulty":5,"tags":["车沙系统","变质量","动量守恒判断"],"stem":"总质量 100 kg 的小车（含沙）以 2.00 m/s 的速率在光滑水平直轨道上运动，车底小孔漏沙，漏沙率为 2.00 kg/s，漏出的沙竖直下落。10.0 s 后小车的速率以及车与漏出沙组成系统的水平动量是否守恒分别为","options":["1.60 m/s，不守恒","2.00 m/s，守恒","2.50 m/s，守恒","2.00 m/s，不守恒"],"answer":"B","explain":"解析：漏出的沙仍具有与小车相同的水平速度 2.00 m/s，水平方向无外力，车与全部漏出沙的系统水平动量守恒，故车速不变。若只盯剩余车体，其质量减小、动量也减小，看似「不守恒」，其实是把漏出的沙漏出了系统。易错：用动量守恒但漏掉漏出沙得 2.50 m/s；把剩余车体动量按原总质量 100 kg 算得 1.60 m/s；把系统误判为不守恒。"},{"id":"c03q025","type":"choice","difficulty":5,"tags":["连续体落沙","动量流","牛顿定律"],"stem":"沙子以 4.00 kg/s 的速率竖直落到以 1.50 m/s 的速率在光滑水平轨道上运动的小车上，沙子落到车上后相对车静止。为维持小车匀速运动，需对小车施加的水平力大小为","options":["6.00 N","3.00 N","4.00 N","9.00 N"],"answer":"A","explain":"解析：单位时间落上的沙从水平速度 0 变为 1.50 m/s，所需水平动量变化率为 F = v dm/dt = 1.50×4.00 = 6.00 N，此力由小车提供，故维持匀速需外施 6.00 N。易错：用 ½qv² 当力得 3.00 N；把落沙率直接当力得 4.00 N；把 v² 乘质量率得 9.00 N。"},{"id":"c03q026","type":"choice","difficulty":5,"tags":["冲击摆","穿出","动量守恒"],"stem":"质量 10.0 g 的子弹以速率 v₀ 水平射入悬挂的质量 0.990 kg 的沙袋，穿出时速率为 120 m/s。子弹穿透沙袋的时间极短，重力的冲量可忽略。沙袋随后摆起的最大高度为 0.200 m。v₀ 为（g = 9.80 m/s²）","options":["198 m/s","120 m/s","430 m/s","316 m/s"],"answer":"D","explain":"解析：沙袋碰后速率 u = √(2gh) = √(2×9.80×0.200) = 1.98 m/s；穿透过程动量守恒，0.0100v₀ = 0.0100×120 + 0.990×1.98 = 1.20+1.96 = 3.16 kg·m/s，v₀ = 316 m/s。易错：漏掉子弹出口动量得 198 m/s；只算子弹出口速率得 120 m/s；把摆起高度按 0.500 m 算得 430 m/s。"},{"id":"c03q027","type":"choice","difficulty":5,"tags":["雨滴吸积","变质量","极限加速度"],"stem":"雨滴在云中下落时不断吸积静止的水汽，单位时间吸积的质量与雨滴速率成正比，即 dm/dt = kv（k 为常数）。雨滴质量足够大后，其加速度趋近于","options":["g","g/3","2g/3","0"],"answer":"B","explain":"解析：对雨滴（含将被吸积的水汽）用动量定理，吸积质量初速为零：m dv/dt = mg − v dm/dt = mg − kv²。设 dm/dx = λ，则 k = λ，方程 m v dv/dx = mg − λv²；积分得 v² = (2g/(3λ))(m − m₀³/m²)。m 很大时 v² ≈ 2gm/(3λ)，故 λv² ≈ 2mg/3，m dv/dt = mg/3，a → g/3。易错：认为吸积不影响力得 g；把阻力项当成 2mg/3 但符号取反；认为最终匀速得 0。"},{"id":"c03q028","type":"choice","difficulty":5,"tags":["提链子","变质量","动量流"],"stem":"质量线密度 3.00 kg/m 的均匀链条盘绕在桌面上，一端以 1.00 m/s 的恒定速率竖直向上提起。当提起的链条长 2.00 m 时，提力大小为（g = 9.80 m/s²）","options":["117.6 N","61.8 N","58.8 N","3.00 N"],"answer":"B","explain":"解析：提力需支撑已提起部分的重力 λxg = 3.00×2.00×9.80 = 58.8 N，同时给新离桌的链节提供速度 v，动量变化率 λv² = 3.00×1.00² = 3.00 N，故 F = 61.8 N。易错：只算重力得 58.8 N；只算动量流得 3.00 N；把重力项写成 2λxg 得 117.6 N。"},{"id":"c03q029","type":"choice","difficulty":5,"tags":["人船模型","质心运动定理"],"stem":"质量 60.0 kg 的人站在质量 40.0 kg、长 2.00 m 的静止小船一端，船在静水中可自由移动。人从船的一端走到另一端，相对船走过 2.00 m。船相对水面移动的距离为","options":["1.20 m","0.800 m","2.00 m","0.400 m"],"answer":"A","explain":"解析：人与船系统水平方向无外力，质心不动。设船后退 x，人相对水面前进 2.00−x：60.0(2.00−x) = 40.0x，x = 120/100 = 1.20 m。易错：用 M/(M+m) 得 0.800 m；认为船不动得 2.00 m；用质量差 (m−M)/(m+M) 得 0.400 m。"},{"id":"c03q030","type":"choice","difficulty":5,"tags":["爆炸","抛体运动","质心运动定理"],"stem":"炮弹在轨迹最高点炸成质量相等的两块，炸前炮弹的水平速度为 v，最高点离地高度为 h。爆炸后其中一块自由下落（水平速度为零），另一块仍沿原水平方向飞行。另一块的落地点到发射点的水平距离为原射程 R 的","options":["2.0R","1.0R","2.5R","1.5R"],"answer":"D","explain":"解析：最高点爆炸，水平动量守恒：mv = (m/2)×0 + (m/2)v′，v′ = 2v。从最高点落到地面的时间 t = √(2h/g)，原炮弹从最高点落地的时间也是 t，原射程 R = 2vt（上升段与下降段水平位移各 R/2）。另一块从最高点到落地水平位移 2v×t = R，加上爆炸点距发射点的 R/2，共 1.5R。易错：只算爆炸后位移得 R；把 v′ 当成 v 得 R；把两块都算入得 2R。"},{"id":"c03q031","type":"choice","difficulty":5,"tags":["反冲","动量守恒","动能分配"],"stem":"质量 1500 kg 的火炮水平放置在光滑地面上，以 30.0° 的仰角发射质量 30.0 kg 的炮弹，炮弹出口速率为 400 m/s。火炮后退的速率及火炮动能占系统总动能的比例分别为","options":["6.93 m/s，3.00%","4.00 m/s，1.50%","6.93 m/s，1.50%","8.00 m/s，2.00%"],"answer":"C","explain":"解析：水平方向动量守恒，30.0×400 cos30.0° = 1500V，V = 6.93 m/s；E_弹 = ½×30.0×400² = 2.40×10⁶ J，E_炮 = ½×1500×6.93² = 3.60×10⁴ J，火炮动能占比 = 3.60×10⁴/(2.40×10⁶+3.60×10⁴) = 1.48% ≈ 1.50%。竖直动量由地面冲量平衡。易错：用 400 而不分解得 8.00 m/s；把 30.0° 当成 60.0° 得 4.00 m/s；把火炮动能占比算成 3.00%。"},{"id":"c03q032","type":"choice","difficulty":5,"tags":["二维完全非弹性碰撞","动能损失"],"stem":"质量 1.00 kg 的黏土球以 4.00 m/s 的速率沿 x 轴正方向运动，与质量 2.00 kg、以 3.00 m/s 的速率沿 y 轴正方向运动的黏土球相碰后粘在一起。碰后共同速度的大小及碰撞中损失的动能比例分别为","options":["2.40 m/s，75.0%","2.40 m/s，49.0%","5.00 m/s，49.0%","2.40 m/s，25.0%"],"answer":"B","explain":"解析：p = (4.00 i + 6.00 j) kg·m/s，总质量 3.00 kg，v = (1.33 i + 2.00 j) m/s，大小 2.40 m/s；E₀ = ½×1.00×4.00² + ½×2.00×3.00² = 8.00+9.00 = 17.0 J，E = ½×3.00×2.40² = 8.67 J，损失比例 = (17.0−8.67)/17.0 = 49.0%。易错：把两速度矢量相加不除质量得 5.00 m/s；用一维公式得 25%；把保留比例 51% 当损失或算成 75%。"},{"id":"c03q033","type":"choice","difficulty":5,"tags":["子弹打木块","弹簧","多过程"],"stem":"质量 10.0 g 的子弹以 300 m/s 的水平速度射入静止在光滑水平面上、质量 0.990 kg 的木块并留在其中。该木块与劲度系数 300 N/m 的轻弹簧相连，弹簧另一端连着静止的质量 2.00 kg 的木块。弹簧的最大压缩量为","options":["0.141 m","0.173 m","0.100 m","0.245 m"],"answer":"A","explain":"解析：第一阶段子弹嵌入，0.0100×300 = 1.00v₁，v₁ = 3.00 m/s；第二阶段两木块通过弹簧相互作用，最大压缩时同速，v_c = 1.00×3.00/3.00 = 1.00 m/s，损失动能 ½×1.00×3.00² − ½×3.00×1.00² = 4.50−1.50 = 3.00 J，全部转为弹簧势能，½×300x² = 3.00，x = 0.141 m。易错：把 4.50 J 全转给弹簧得 0.173 m；只取 1.50 J 得 0.100 m；把约化质量取错得 0.245 m。"},{"id":"c03q034","type":"choice","difficulty":5,"tags":["一维弹性碰撞","质心速度","符号判断"],"stem":"质量 2.00 kg 的小球以 4.00 m/s 的速率沿 x 轴正方向运动，与质量 3.00 kg、以 2.00 m/s 的速率沿 x 轴负方向运动的小球发生一维完全弹性碰撞。碰后两球速度及系统质心速度分别为","options":["v₁ = −3.20 m/s，v₂ = 2.80 m/s，v_c = 2.00 m/s","v₁ = 0.800 m/s，v₂ = 3.20 m/s，v_c = 0.400 m/s","v₁ = −2.00 m/s，v₂ = 2.00 m/s，v_c = 0","v₁ = −3.20 m/s，v₂ = 2.80 m/s，v_c = 0.400 m/s"],"answer":"D","explain":"解析：取 +x 为正，v₁₀ = 4.00，v₂₀ = −2.00。弹性碰撞公式 v₁′ = [(m₁−m₂)v₁₀ + 2m₂v₂₀]/(m₁+m₂) = [(−1.00)(4.00)+6.00×(−2.00)]/5.00 = −3.20 m/s；v₂′ = [2m₁v₁₀+(m₂−m₁)v₂₀]/5.00 = [16.0+1.00×(−2.00)]/5.00 = 2.80 m/s。质心速度 v_c = (2.00×4.00+3.00×(−2.00))/5.00 = 0.400 m/s。易错：漏掉 v₂₀ 的负号；把质心速度算成 2.00 m/s；用完全非弹性公式得 0.800 m/s。"},{"id":"c03q035","type":"choice","difficulty":5,"tags":["弯管冲击","动量流","矢量合成"],"stem":"密度 1.00×10³ kg/m³ 的水在横截面积 10.0 cm² 的管道中以 4.00 m/s 的速率流动，经过一个 90° 弯头后速率不变、方向改变 90°。水对弯头的作用力大小为","options":["32.0 N","11.3 N","22.6 N","16.0 N"],"answer":"C","explain":"解析：质量流量 q = ρAv = 1.00×10³×1.00×10⁻³×4.00 = 4.00 kg/s；水动量变化率大小 qv√2 = 4.00×4.00×1.414 = 22.6 N，故弯头对水的作用力为 22.6 N，水对弯头反作用力大小相同。易错：只算一个方向得 16.0 N；把两方向分量相加得 32.0 N；漏掉 √2 得 11.3 N。"},{"id":"c03q036","type":"calc","difficulty":3,"tags":["完全非弹性碰撞","动量守恒","动能损失"],"stem":"质量 3.00 kg 的小车 A 以 4.00 m/s 的速率沿 x 轴正方向运动，与质量 5.00 kg、以 2.00 m/s 的速率沿 x 轴负方向运动的小车 B 发生完全非弹性碰撞。求：(1) 碰后共同速度的大小和方向；(2) 碰撞中损失的动能占初始动能的比例。","answer":"(1) 0.250 m/s，沿 x 轴正方向；(2) 99.3%","explain":"解析：取 +x 为正，p = 3.00×4.00 + 5.00×(−2.00) = 2.00 kg·m/s，v = p/(3.00+5.00) = 0.250 m/s，为正表示沿 +x。E₀ = ½×3.00×4.00² + ½×5.00×2.00² = 24.0+10.0 = 34.0 J，E = ½×8.00×0.250² = 0.250 J，损失比例 = 33.75/34.0 = 99.3%。关键：两车动量方向相反，必须先定正方向再求代数和；损失比例接近 100% 是因为碰后速度很小。"},{"id":"c03q037","type":"calc","difficulty":3,"tags":["冲量","平均冲力","反弹"],"stem":"质量 0.200 kg 的小球从 1.25 m 高处由静止自由下落，与水平地面碰撞后反弹的最大高度为 0.450 m，小球与地面的接触时间为 0.0200 s。取竖直向上为正，g = 9.80 m/s²。求：(1) 地面对小球的冲量；(2) 地面对小球的平均作用力。","answer":"(1) 1.62 N·s，方向竖直向上；(2) 81.2 N，方向竖直向上","explain":"解析：碰前速率 v₁ = √(2×9.80×1.25) = 4.95 m/s，方向向下，即 −4.95 m/s；碰后速率 v₂ = √(2×9.80×0.450) = 2.97 m/s，方向向上，即 +2.97 m/s。动量变化 Δp = m(v₂−v₁) = 0.200×(2.97+4.95) = 1.58 N·s。碰撞过程中重力还产生向下冲量 mgΔt = 0.200×9.80×0.0200 = 0.0392 N·s，故地面对球的冲量 J = Δp + mgΔt = 1.58+0.039 = 1.62 N·s，方向向上；平均力 F̄ = J/Δt = 1.62/0.0200 = 81.2 N。关键：地面冲量不等于动量变化，还要加上重力的短时冲量。"},{"id":"c03q038","type":"calc","difficulty":4,"tags":["冲击摆","两段过程","能量损失"],"stem":"质量 0.0200 kg 的子弹以 300 m/s 的水平速度射入悬挂着的质量 0.980 kg 的沙袋并留在其中，沙袋随后摆起。求：(1) 沙袋摆起的最大高度；(2) 碰撞中损失的动能占子弹初动能的比例。g = 9.80 m/s²。","answer":"(1) 1.84 m；(2) 98.0%","explain":"解析：第一阶段动量守恒，0.0200×300 = 1.000v，v = 6.00 m/s；第二阶段机械能守恒，h = v²/(2g) = 36.0/19.6 = 1.84 m。初动能 E₀ = ½×0.0200×300² = 900 J，碰后动能 E = ½×1.000×6.00² = 18.0 J，损失比例 = 882/900 = 98.0%，等于 M/(M+m)。关键：碰撞阶段机械能不守恒，摆起阶段动量不守恒，两段必须分开处理。"},{"id":"c03q039","type":"calc","difficulty":4,"tags":["恢复系数","一维碰撞","动能损失"],"stem":"质量 2.00 kg 的小车 A 以 3.00 m/s 的速率沿 x 轴正方向运动，与静止的质量 4.00 kg 的小车 B 发生一维碰撞，恢复系数 e = 0.600。求：(1) 碰后两车的速度；(2) 碰撞中损失的动能比例。","answer":"(1) v_A = −0.200 m/s，v_B = 1.60 m/s；(2) 42.7%","explain":"解析：动量守恒 2.00×3.00 = 2.00v_A + 4.00v_B；恢复系数定义 v_B−v_A = e(v_A0−v_B0) = 0.600×3.00 = 1.80 m/s。联立得 v_A = −0.200 m/s，v_B = 1.60 m/s。E₀ = 9.00 J，E = ½×2.00×0.0400 + ½×4.00×2.56 = 5.16 J，损失 3.84 J，占 42.7%。也可用 ΔE = ½μ(1−e²)v_rel²，μ = 1.33 kg，ΔE = 3.84 J。"},{"id":"c03q040","type":"calc","difficulty":4,"tags":["质心","变密度杆","积分法"],"stem":"一根长 L = 0.900 m、质量 M = 0.600 kg 的细杆，其线密度沿杆按 λ = λ₀(1 + x/L) 变化，x 从杆的密度较小的一端量起。求：(1) 用 L 表示质心到密度较小一端的距离；(2) 代入 L = 0.900 m 求数值；(3) 说明质心为什么偏向较密一端。","answer":"(1) x_c = 5L/9；(2) 0.500 m；(3) 密度沿 x 增大，质量分布偏向 x 增大的一侧，质心必在几何中心该侧","explain":"解析：M = ∫₀ᴸλ₀(1+x/L)dx = λ₀(L+L/2) = 3λ₀L/2；x_c = (1/M)∫₀ᴸxλ₀(1+x/L)dx = (1/M)λ₀(L²/2+L²/3) = (5λ₀L²/6)/(3λ₀L/2) = 5L/9。代入 L = 0.900 m 得 x_c = 0.500 m，比几何中心 0.450 m 偏向较密端 0.050 m。关键：变密度杆不能直接用 L/2，必须先积分求总质量再加权。"},{"id":"c03q041","type":"calc","difficulty":4,"tags":["弹簧释放","动量守恒","能量分配"],"stem":"质量 1.00 kg 和 2.00 kg 的两个木块放在光滑水平面上，中间用劲度系数 150 N/m 的轻弹簧相连，弹簧被压缩 0.200 m 后用细线锁定。剪断细线，两木块由静止开始运动。求：(1) 弹簧恢复原长时两木块的速度；(2) 两木块动能之比，并说明哪一块动能更大。","answer":"(1) 1.00 kg 木块 2.00 m/s，2.00 kg 木块 1.00 m/s，方向相反；(2) 2∶1，1.00 kg 木块动能更大","explain":"解析：弹簧势能 E = ½kx² = ½×150×0.200² = 3.00 J。动量守恒 m₁v₁ = m₂v₂，即 v₁ = 2v₂；能量守恒 ½m₁v₁² + ½m₂v₂² = 3.00，代入得 3v₂² = 3.00，v₂ = 1.00 m/s，v₁ = 2.00 m/s。动能 E₁ = 2.00 J，E₂ = 1.00 J，比值 2∶1。关键：动量等大时动能与质量成反比，轻块获得更多动能。"},{"id":"c03q042","type":"calc","difficulty":4,"tags":["二维碰撞","完全非弹性","动能损失"],"stem":"质量 1500 kg 的汽车 A 以 20.0 m/s 的速率向东行驶，与质量 2000 kg、以 15.0 m/s 的速率向北行驶的汽车 B 在水平路口相撞后粘在一起。求：(1) 碰后共同速度的大小和方向；(2) 碰撞中损失的动能。","answer":"(1) 12.1 m/s，方向为东偏北 45.0°；(2) 2.68×10⁵ J","explain":"解析：p_A = 1500×20.0 = 3.00×10⁴ kg·m/s 向东，p_B = 2000×15.0 = 3.00×10⁴ kg·m/s 向北，总动量大小 3.00×10⁴√2 = 4.24×10⁴ kg·m/s，方向东偏北 45.0°；v = p/(3500) = 12.1 m/s。E₀ = ½×1500×20.0² + ½×2000×15.0² = 3.00×10⁵+2.25×10⁵ = 5.25×10⁵ J，E = ½×3500×12.1² = 2.57×10⁵ J，损失 2.68×10⁵ J。关键：二维动量必须按矢量合成，不能把速率直接相加。"},{"id":"c03q043","type":"calc","difficulty":5,"tags":["火箭方程","竖直发射","积分法"],"stem":"火箭竖直发射，初始总质量 m₀ = 1500 kg，喷气相对火箭的速率 u = 1.80 km/s，燃料以恒定速率 10.0 kg/s 燃烧，30.0 s 后燃料恰好烧完。忽略空气阻力，g = 9.80 m/s²。求：(1) 点火后 30.0 s 时火箭的速率；(2) 这 30.0 s 内火箭上升的高度；(3) 说明为什么实际速率小于 u ln(m₀/m)。","answer":"(1) v = u ln(m₀/m) − gt = 108 m/s；(2) y = (u/α)[Δm − m ln(m₀/m)] − ½gt² = 1.39×10³ m；(3) 重力冲量使速率减少 gt = 294 m/s","explain":"解析：m = 1500−10.0×30.0 = 1200 kg。由 dv/dt = uα/m − g，积分 v = u ln(m₀/m) − gt = 1800 ln(1.25) − 9.80×30.0 = 401.7−294.0 = 108 m/s。高度 y = ∫₀³⁰[u ln(m₀/m(t))−gt]dt；第一项 = (u/α)[Δm − m ln(m₀/m)] = 180×[300−1200×0.2231] = 5.80×10³ m，第二项 = ½gt² = 4.41×10³ m，故 y = 1.39×10³ m。重力使速率少 294 m/s。"},{"id":"c03q044","type":"calc","difficulty":5,"tags":["雨滴吸积","变质量","微积分"],"stem":"雨滴从云中由静止下落，下落过程中吸积静止的水汽，吸积质量与下落距离成正比：m = m₀ + λx，λ 为常数。求：(1) 证明 v² = (2g/(3λ))(m − m₀³/m²)；(2) 求 m ≫ m₀ 时雨滴的加速度；(3) 说明此时速率与质量的关系。","answer":"(1) 证明见解析；(2) a → g/3；(3) v ∝ √m","explain":"解析：吸积的水汽初速为零，由变质量动量定理 m dv/dt = mg − v dm/dt。因 dm/dt = λv，且 dv/dt = v dv/dx，得 m v dv/dx = mg − λv²。令 u = v²，则 (m/2)du/dx + λu = mg；注意 dm/dx = λ，可写成 d(m²u)/dx = 2gm²。积分得 m²u = (2g/(3λ))(m³−m₀³)，即 v² = (2g/(3λ))(m−m₀³/m²)。m ≫ m₀ 时 v² ≈ 2gm/(3λ)，故 λv² ≈ 2mg/3，m dv/dt = mg/3，a → g/3；v ∝ √m。关键：吸积质量带走的动量项不能漏，否则会误得 a = g。"},{"id":"c03q045","type":"calc","difficulty":5,"tags":["传送带落煤","功率","能量耗散"],"stem":"水平传送带以 v = 1.50 m/s 的速率匀速运行，煤粉从料斗竖直落到带上，落煤率 q = 20.0 kg/s，煤粉与带同速后随带运动。求：(1) 维持带速所需的水平驱动力；(2) 驱动电机输出的机械功率；(3) 煤粉动能增加率；(4) 说明功率与动能增加率之差去了哪里。","answer":"(1) 30.0 N；(2) 45.0 W；(3) 22.5 W；(4) 22.5 W 在煤粉与带相对滑动中转化为热","explain":"解析：单位时间落到带上的煤质量 q，从水平速度 0 加速到 v，动量变化率 F = qv = 20.0×1.50 = 30.0 N，这就是维持带速所需的水平力。驱动功率 P = Fv = 30.0×1.50 = 45.0 W。煤粉动能增加率 dE_k/dt = ½qv² = ½×20.0×1.50² = 22.5 W。差值 22.5 W 等于煤粉与带之间的摩擦生热率：煤粉在加速过程中相对带滑移，摩擦力做的一部分功转化为热。关键：连续落料问题中驱动功率是动能增加率的两倍，不能把 ½qv² 当功率。"},{"id":"c03q046","type":"calc","difficulty":5,"tags":["斜板冲击","动量流","恢复系数"],"stem":"密度 1.00×10³ kg/m³ 的水流以 25.0 m/s 的速率冲击一块与水流方向成 30.0° 的固定斜板，水束横截面积 4.00 cm²。水冲击后沿板面向两侧均匀流散，两侧的切向动量相互抵消；沿板面法向的反弹系数为 e = 0.500。求水对斜板的法向作用力、切向作用力和总作用力大小。","answer":"法向 188 N，切向 217 N，总作用力 287 N","explain":"解析：质量流量 q = ρAv = 1.00×10³×4.00×10⁻⁴×25.0 = 10.0 kg/s。法向分速 v_n = v sin30.0° = 12.5 m/s，法向动量变化率 F_n = qv_n(1+e) = 10.0×12.5×1.50 = 188 N。切向分速 v_t = v cos30.0° = 21.7 m/s；水沿板面向两侧对称流散，带走的切向合动量为零，故板对水的切向力 F_t = qv_t = 217 N。总力 F = √(188²+217²) = 287 N。关键：斜板要把速度分解到法向和切向，反弹系数只作用于法向分量；切向力来自入射切向合动量的抵消。"},{"id":"c03q047","type":"calc","difficulty":5,"tags":["子弹打穿木块","动量守恒","摩擦生热"],"stem":"质量 12.0 g 的子弹以 450 m/s 的水平速度射穿静止在粗糙水平面上的质量 1.50 kg 的木块。木块与地面间的动摩擦因数 μ = 0.250，子弹穿透木块的时间极短，此间地面的摩擦冲量可忽略。子弹穿出后木块滑行 0.400 m 停下，g = 9.80 m/s²。求：(1) 子弹穿出后木块的速率；(2) 子弹穿出时的速率；(3) 子弹与木块碰撞中产生的热量。","answer":"(1) 1.40 m/s；(2) 275 m/s；(3) 7.60×10² J","explain":"解析：木块滑行阶段 ½Mu² = μMgd，u = √(2×0.250×9.80×0.400) = 1.40 m/s。穿透阶段动量守恒：0.0120×450 = 0.0120v + 1.50×1.40，v = (5.40−2.10)/0.0120 = 275 m/s。碰撞前动能 E₀ = ½×0.0120×450² = 1.215×10³ J；碰后子弹动能 ½×0.0120×275² = 454 J，木块动能 ½×1.50×1.40² = 1.47 J；碰撞中产生热量 Q = 1215−454−1.47 = 7.60×10² J。木块随后滑行时摩擦力再把 1.47 J 转为热，不属于子弹-木块碰撞热。"},{"id":"c03q048","type":"calc","difficulty":5,"tags":["人船模型","质心运动定理","相对位移"],"stem":"质量 m = 60.0 kg 的人站在质量 M = 120 kg、长 L = 3.00 m 的静止小船一端，船在静水中可自由移动，水的阻力不计。求：(1) 人从船的一端走到另一端时，船相对水面移动的距离（用 m、M、L 表示并代入数值）；(2) 人相对水面移动的距离；(3) 若人再沿原路走回原处，船最终相对水面回到何处。","answer":"(1) x = mL/(M+m) = 1.00 m，方向与人相反；(2) 2.00 m；(3) 回到原处","explain":"解析：系统水平方向无外力，质心位置不变。设人前进方向为正，人相对船走 L，船后退 x，则人相对水面走 L−x：m(L−x) = Mx，得 x = mL/(M+m) = 60.0×3.00/180 = 1.00 m，人相对水面走 2.00 m。人走回时，每一步的位移关系仍由质心不动决定，系统回到初始位形，船回到原处。关键：不能用人的速度乘时间直接算船位移，必须用质心不动；来回走的总位移为零，不是因为「船没动过」，而是去程与回程的船位移相互抵消。"},{"id":"c03q049","type":"calc","difficulty":5,"tags":["二维斜碰","恢复系数","动能损失"],"stem":"光滑水平面上，质量 m₁ = 2.00 kg 的球 A 以 6.00 m/s 的速率沿 x 轴正方向运动，与静止的质量 m₂ = 3.00 kg 的球 B 发生斜碰。碰撞时两球球心连线与 x 轴成 30.0°，恢复系数 e = 0.500。求：(1) 碰后两球的速度大小和方向；(2) 碰撞中损失的动能。","answer":"(1) A 3.05 m/s，方向与 x 轴成 110°（偏向左上方）；B 3.12 m/s，沿球心连线方向（与 x 轴成 30.0°）；(2) 12.1 J（33.8%）","explain":"解析：取球心连线为法向 n，垂直方向为切向 t。v_An = 6.00 cos30.0° = 5.20 m/s，v_At = 6.00 sin30.0° = 3.00 m/s。法向按一维碰撞：v_A′n = (m₁−em₂)/(m₁+m₂)v_An = (2.00−1.50)/5.00×5.20 = 0.520 m/s，v_B′n = (1+e)m₁/(m₁+m₂)v_An = 1.50×2.00/5.00×5.20 = 3.12 m/s；切向 v_A′t = 3.00 m/s，v_B′t = 0。故 v_A′ = √(0.520²+3.00²) = 3.05 m/s，v_B′ = 3.12 m/s；A 相对 x 轴的方向为 30.0°+80.2° = 110°。能量损失 ΔE = ½μ(1−e²)v_An²，μ = 1.20 kg，ΔE = ½×1.20×0.750×5.20² = 12.1 J，占初动能 36.0 J 的 33.8%。关键：斜碰只让法向分量按 e 衰减，切向分量不变。"},{"id":"c03q050","type":"calc","difficulty":5,"tags":["恢复系数","动能损失","参数讨论"],"stem":"两个质量分别为 m₁、m₂ 的物体在光滑水平面上发生一维碰撞，碰前相对速度为 u，恢复系数为 e（0 ≤ e ≤ 1）。求：(1) 碰撞中损失的动能 ΔE 的表达式；(2) 若碰前 m₂ 静止，证明损失动能占初动能的比例为 (1−e²)m₂/(m₁+m₂)；(3) 讨论 e = 0、e = 1 及 m₁ = m₂ 时该比例的取值和物理意义。","answer":"(1) ΔE = ½μ(1−e²)u²，μ = m₁m₂/(m₁+m₂)；(2) 比例为 (1−e²)m₂/(m₁+m₂)；(3) e=0 时比例 m₂/(m₁+m₂) 在 0≤e≤1 内最大，e=1 时为 0；m₁=m₂ 时比例为 (1−e²)/2，e=0 时为 50%","explain":"解析：碰前相对速度 u = v₁−v₂，碰后相对速度 v₂′−v₁′ = eu。质心系中总动能 E_cm = ½μu²，碰后 E_cm′ = ½μ(eu)² = e²E_cm，故 ΔE = ½μ(1−e²)u²。若 m₂ 静止，E₀ = ½m₁v₁²，u = v₁，则 ΔE/E₀ = [½μ(1−e²)v₁²]/[½m₁v₁²] = (1−e²)m₂/(m₁+m₂)。e = 0 时比例 = m₂/(m₁+m₂)，靶越重损失比例越大，极限为 1；e = 1 时比例 = 0，弹性碰撞不损失动能；m₁ = m₂ 时比例 = (1−e²)/2，e = 0 时为 1/2，e = 1 时为 0。关键：损失比例只由 e 和质量比决定，与初速度大小无关；这是因为质心系动能与 u² 成正比，而比例中 u² 约掉了。"}]},{"chapter":4,"chapterName":"功与能","questions":[{"id":"c04q001","type":"choice","difficulty":3,"tags":["变力做功","动能定理"],"stem":"质量 2.00 kg 的质点沿 x 轴运动，t = 0 时速度为 1.00 m/s，方向沿 +x。此后它受到沿 +x 方向的合力 F = 6.00x²（F 以 N 计，x 以 m 计）。质点从 x = 0 运动到 x = 2.00 m 时速度大小为","options":["4.12 m/s","4.00 m/s","7.00 m/s","5.00 m/s"],"answer":"A","explain":"变力做功必须积分：W = ∫₀² 6.00x² dx = 2.00x³|₀² = 16.0 J。\n由动能定理 W = ½mv² − ½mv₀²：½×2.00×v² = ½×2.00×1.00² + 16.0 = 17.0 J，v = √17.0 = 4.12 m/s。\n易错点：7.00 m/s 用末端力 F(2.00) = 24.0 N 乘位移 2.00 m（得 48 J）；5.00 m/s 用平均力 12.0 N 乘位移；4.00 m/s 漏掉初动能。"},{"id":"c04q002","type":"choice","difficulty":3,"tags":["功的计算","摩擦力","动能定理"],"stem":"质量 5.00 kg 的物体静置于水平桌面，受与水平方向成 37.0° 角斜向上的拉力 F = 25.0 N，沿直线移动 4.00 m。物体与桌面间的动摩擦因数 μ = 0.200，g = 9.80 m/s²，sin37.0° = 0.602，cos37.0° = 0.799。物体末速度大小为","options":["5.65 m/s","4.59 m/s","4.03 m/s","3.63 m/s"],"answer":"B","explain":"拉力做功 W_F = Fcos37.0°·s = 25.0×0.799×4.00 = 79.9 J。\n竖直方向平衡：N = mg − Fsin37.0° = 49.0 − 15.1 = 33.9 N，摩擦力 f = μN = 6.78 N，W_f = −27.1 J。\n动能定理：½×5.00×v² = 79.9 − 27.1 = 52.8 J，v = 4.59 m/s。\n易错点：5.65 m/s 忽略摩擦；4.03 m/s 误取 N = mg；3.63 m/s 把 cos37.0° 与 sin37.0° 用反。"},{"id":"c04q003","type":"choice","difficulty":3,"tags":["斜面","摩擦生热","动能定理"],"stem":"质量 2.00 kg 的物块从倾角 30.0° 的斜面顶端由静止下滑，斜面长 3.00 m，物块与斜面间的动摩擦因数 μ = 0.250，g = 9.80 m/s²。物块到达底端时的速度大小及下滑过程中摩擦产生的热量分别为","options":["4.08 m/s，29.4 J","5.42 m/s，12.7 J","4.08 m/s，14.7 J","4.08 m/s，12.7 J"],"answer":"D","explain":"下滑高度 h = 3.00sin30.0° = 1.50 m，重力做功 W_G = mgh = 29.4 J。\n正压力 N = mgcos30.0° = 16.97 N，摩擦力 f = μN = 4.24 N，摩擦生热 Q = f·s = 4.24×3.00 = 12.7 J。\n动能定理：½×2.00×v² = 29.4 − 12.7 = 16.7 J，v = 4.08 m/s。\n易错点：29.4 J 把重力做功当作热量；14.7 J 漏乘 cos30.0°；5.42 m/s 完全忽略摩擦。"},{"id":"c04q004","type":"choice","difficulty":3,"tags":["功","功率","牛顿第二定律"],"stem":"用钢索将质量 500 kg 的货物从静止开始以 0.500 m/s² 的加速度竖直提升 10.0 m，g = 9.80 m/s²，不计空气阻力。钢索拉力所做的功和这段时间内的平均功率分别为","options":["4.90×10⁴ J，7.75 kW","5.15×10⁴ J，5.15 kW","5.15×10⁴ J，8.15 kW","5.15×10⁴ J，10.0 kW"],"answer":"C","explain":"由牛顿第二定律 T − mg = ma 得 T = m(g + a) = 500×10.3 = 5.15×10³ N。\nW = Th = 5.15×10³×10.0 = 5.15×10⁴ J。\n由 h = ½at² 得 t = √(2h/a) = √40.0 = 6.32 s，平均功率 P = W/t = 5.15×10⁴/6.32 = 8.15×10³ W。\n易错点：4.90×10⁴ J 漏掉 ma；5.15 kW 用 W/h 冒充平均功率；10.0 kW 把末时刻的瞬时功率当平均功率。"},{"id":"c04q005","type":"choice","difficulty":4,"tags":["弹簧势能","机械能守恒","临界"],"stem":"质量 0.200 kg 的小球从静止自由下落，落到竖直放置的轻弹簧上端时弹簧处于原长，此时小球距弹簧上端已有 0.300 m 的下落高度。弹簧劲度系数 k = 800 N/m，g = 9.80 m/s²，不计空气阻力。小球压缩弹簧的最大压缩量为","options":["0.0383 m","0.0409 m","0.0436 m","0.0284 m"],"answer":"B","explain":"设最大压缩量为 x，则小球下落的总高度为 0.300 + x，重力势能全部转化为弹性势能：mg(0.300 + x) = ½kx²。\n代入：0.200×9.80×(0.300 + x) = ½×800x²，整理得 400x² − 1.96x − 0.588 = 0。\n解得 x = (1.96 + √(3.84 + 940.8))/800 = 0.0409 m（另一根为负，舍去）。\n易错点：0.0383 m 漏掉压缩过程本身的重力势能变化；0.0436 m 把 x 重复计入；0.0284 m 弹性势能漏写 ½。"},{"id":"c04q006","type":"choice","difficulty":4,"tags":["功率","阻力","匀速运动"],"stem":"质量 1.20×10³ kg 的汽车在水平公路上行驶，所受阻力恒为车重的 0.0500 倍，g = 9.80 m/s²。汽车以 15.0 m/s 匀速行驶时的功率为 P₁，以 20.0 m/s 匀速行驶时的功率为 P₂，则 P₂ − P₁ 为","options":["2.94 kW","8.82 kW","11.8 kW","1.47 kW"],"answer":"A","explain":"匀速时牵引力等于阻力：f = 0.0500mg = 0.0500×1.20×10³×9.80 = 588 N。\nP = fv，故 P₁ = 588×15.0 = 8.82 kW，P₂ = 588×20.0 = 11.8 kW。\n差值 P₂ − P₁ = f(v₂ − v₁) = 588×5.00 = 2.94 kW。\n易错点：8.82 kW 与 11.8 kW 分别是两个功率本身；1.47 kW 取了两者之差的一半。"},{"id":"c04q007","type":"choice","difficulty":4,"tags":["弹簧","摩擦力","能量守恒"],"stem":"质量 1.00 kg 的物块以 3.00 m/s 的速率沿水平面滑向一轻弹簧，弹簧另一端固定，劲度系数 k = 400 N/m。物块与水平面间的动摩擦因数 μ = 0.250，g = 9.80 m/s²。物块压缩弹簧的最大压缩量为","options":["0.150 m","0.156 m","0.144 m","0.138 m"],"answer":"C","explain":"压缩过程中动能转化为弹性势能并克服摩擦做功：½mv₀² = ½kx² + μmgx。\n代入：½×1.00×9.00 = ½×400x² + 0.250×1.00×9.80x，即 200x² + 2.45x − 4.50 = 0。\nx = (−2.45 + √(6.00 + 3600))/400 = 0.144 m。\n易错点：0.150 m 忽略摩擦；0.156 m 把摩擦做功写成正号；0.138 m 把摩擦力重复计算一次。"},{"id":"c04q008","type":"choice","difficulty":4,"tags":["恒定功率启动","牵引力","牛顿第二定律"],"stem":"质量 1.50×10³ kg 的汽车在平直公路上以恒定功率 4.80×10⁴ W 启动，所受阻力恒为 800 N。汽车能达到的最大速度，以及速度达到 12.0 m/s 时的加速度分别为","options":["60.0 m/s，2.67 m/s²","60.0 m/s，2.13 m/s²","40.0 m/s，2.13 m/s²","60.0 m/s，0.800 m/s²"],"answer":"B","explain":"最大速度时牵引力等于阻力：F = P/v_max = f，故 v_max = P/f = 4.80×10⁴/800 = 60.0 m/s。\nv = 12.0 m/s 时 F = P/v = 4.00×10³ N，由 F − f = ma 得 a = (4000 − 800)/1500 = 2.13 m/s²。\n易错点：2.67 m/s² 忽略阻力；40.0 m/s 把阻力误当 1.20×10³ N；0.800 m/s² 直接用 f/m。"},{"id":"c04q009","type":"choice","difficulty":4,"tags":["功率","配重","机械效率"],"stem":"电梯轿厢质量 800 kg，配重质量 500 kg，二者用跨过定滑轮的钢索相连。轿厢以 1.50 m/s 的速率匀速上升，电动机与钢索间的机械效率为 0.800，g = 9.80 m/s²。电动机的输入功率为","options":["5.51 kW","4.41 kW","14.7 kW","23.9 kW"],"answer":"A","explain":"匀速时系统受力平衡，电机需提供的等效力 F = (m₁ − m₂)g = 300×9.80 = 2.94×10³ N。\n机械功率 P_mech = Fv = 2.94×10³×1.50 = 4.41×10³ W。\n输入功率 P_in = P_mech/η = 4.41×10³/0.800 = 5.51×10³ W。\n易错点：4.41 kW 漏除效率；14.7 kW 忘记配重；23.9 kW 把两质量相加。"},{"id":"c04q010","type":"choice","difficulty":4,"tags":["链条","连续体","机械能守恒"],"stem":"长 1.20 m、质量 1.50 kg 的均匀柔软链条放在光滑水平桌面上，一端伸出桌边 0.300 m，由静止释放。链条尾端刚离开桌边时，链条的速度大小为","options":["3.32 m/s","3.43 m/s","4.20 m/s","2.42 m/s"],"answer":"A","explain":"取桌面为重力势能零点。初始只有伸出部分有重力势能：U₁ = −(m/L)x₀·g·(x₀/2) = −(1.50×0.300²×9.80)/(2×1.20) = −0.551 J。\n末态整条链条竖直悬挂，质心在 −L/2 处：U₂ = −mgL/2 = −1.50×9.80×0.600 = −8.82 J。\n机械能守恒：½mv² = U₁ − U₂ = 8.27 J，v = √(2×8.27/1.50) = 3.32 m/s。\n易错点：2.42 m/s 只让伸出部分自由下落；3.43 m/s 用 v = √(gL)；4.20 m/s 用 v = √(2g(L − x₀))。"},{"id":"c04q011","type":"choice","difficulty":4,"tags":["空气阻力","变力做功","动能定理"],"stem":"质量 0.500 kg 的物块在光滑水平面上以 12.0 m/s 的初速度滑行，所受空气阻力大小为 f = kv²，k = 0.100 kg/m。物块速率减为 6.00 m/s 的过程中滑行的距离为","options":["6.93 m","1.73 m","3.47 m","5.00 m"],"answer":"C","explain":"由牛顿第二定律 −kv² = m dv/dt，用 v dv/dx 换元得 −kv² = mv·dv/dx，约去 v：dv/dx = −(k/m)v。\n分离变量 dx = −(m/k)(dv/v)，积分得 x = (m/k)ln(v₀/v) = (0.500/0.100)×ln2 = 5.00×0.693 = 3.47 m。\n结论：速度按指数衰减，位移只按对数增长，理论上要无限远才停下来。\n易错点：6.93 m 把 ln2 当 2ln2；1.73 m 多除一个 2；5.00 m 直接取 m/k。"},{"id":"c04q012","type":"choice","difficulty":4,"tags":["变力做功","保守力","路径积分"],"stem":"质点在 Oxy 平面内受到力 F = (2.00y) i + (2.00x) j（SI 单位）。质点从原点沿直线运动到点 (1.00 m, 2.00 m)，该力做的功以及该力是否为保守力分别为","options":["2.00 J，与路径无关","4.00 J，与路径有关","6.00 J，与路径有关","4.00 J，与路径无关"],"answer":"D","explain":"W = ∫(Fₓdx + F_ydy) = ∫(2.00y dx + 2.00x dy) = 2.00∫d(xy) = 2.00xy 在 (0,0) 到 (1.00,2.00) 之间取值 = 4.00 J。\n保守性判据：∂F_y/∂x = 2.00，∂Fₓ/∂y = 2.00，二者相等，故为保守力，功只与始末位置有关。\n可验证：先沿 x 轴（y = 0）做功 0，再沿竖直线做功 ∫₀² 2.00×1.00 dy = 4.00 J，合计相同。\n易错点：2.00 J 漏掉因子 2；6.00 J 把力的大小当常量沿路径长度积分。"},{"id":"c04q013","type":"choice","difficulty":4,"tags":["引力势能","圆轨道","机械能"],"stem":"质量 500 kg 的卫星在半径 7.00×10⁶ m 的圆轨道上绕地球运行，现要把它转移到半径 8.00×10⁶ m 的圆轨道（只比较两个圆轨道的总机械能，忽略变轨过程细节）。已知 GM = 3.986×10¹⁴ m³/s²，发动机至少需做的功为","options":["3.56×10⁹ J","1.78×10⁹ J","−1.78×10⁹ J","7.12×10⁹ J"],"answer":"B","explain":"圆轨道上 E = K + U = ½mv² − GMm/r，而 v² = GM/r，故 E = −GMm/(2r)。\nΔE = −(GMm/2)(1/r₂ − 1/r₁) = (3.986×10¹⁴×500/2)×(1/7.00×10⁶ − 1/8.00×10⁶)。\n= 9.965×10¹⁶×1.786×10⁻⁸ = 1.78×10⁹ J，为正，表示发动机做正功。\n易错点：3.56×10⁹ J 只算了 ΔU；−1.78×10⁹ J 是动能变化；7.12×10⁹ J 漏掉 ½ 又取错符号。"},{"id":"c04q014","type":"choice","difficulty":4,"tags":["弹簧","动量守恒","能量守恒"],"stem":"光滑水平面上，质量 2.00 kg 的物块 A 以 4.00 m/s 的速率向右运动，与静止的质量 3.00 kg 的物块 B 相碰，B 的左端连有劲度系数 k = 800 N/m 的轻弹簧（弹簧随 B 一起运动）。弹簧被压缩到最短时，弹簧的压缩量为","options":["0.155 m","0.200 m","0.316 m","0.126 m"],"answer":"A","explain":"弹簧最短时 A、B 速度相同，设为 v。系统水平方向动量守恒：m_Av₀ = (m_A + m_B)v，v = 8.00/5.00 = 1.60 m/s。\n能量守恒：½m_Av₀² = ½(m_A + m_B)v² + ½kx²，即 16.0 = 6.40 + 400x²。\n解得 x = √(9.60/400) = 0.155 m。\n易错点：0.200 m 只用 A 的动能；0.316 m 用总质量配全部初动能；0.126 m 把碰后总动能当弹性势能。"},{"id":"c04q015","type":"choice","difficulty":4,"tags":["势能曲线","平衡点","稳定性"],"stem":"某质点在 x 轴上运动，其势能函数为 U(x) = x³ − 3.00x（U 以 J 计，x 以 m 计）。关于平衡点及 x = 2.00 m 处质点受到的力，下列说法正确的是","options":["x = ±1.00 m 为平衡点，x = −1.00 m 处稳定，F(2.00 m) = +9.00 N","只有 x = 0 一个平衡点且稳定，F(2.00 m) = −9.00 N","x = ±1.00 m 为平衡点，x = 1.00 m 处稳定，F(2.00 m) = −9.00 N","x = ±1.00 m 为平衡点且都稳定，F(2.00 m) = −3.00 N"],"answer":"C","explain":"平衡点由 dU/dx = 3.00x² − 3.00 = 0 得 x = ±1.00 m。\nd²U/dx² = 6.00x：x = 1.00 m 处为 +6.00 > 0（势能极小，稳定）；x = −1.00 m 处为 −6.00 \u003c 0（不稳定）。\n力 F = −dU/dx，在 x = 2.00 m 处 F = −(3.00×4.00 − 3.00) = −9.00 N，指向 −x。\n易错点：把 d²U/dx² 的符号判反；忘记 F = −dU/dx 中的负号。"},{"id":"c04q016","type":"choice","difficulty":4,"tags":["功率","连续体","动量定理"],"stem":"水平传送带以 1.50 m/s 的速率匀速运行，沙粒以 20.0 kg/s 的速率竖直落到传送带上，并随传送带一起水平运动（沙粒初速度的水平分量为零）。带动传送带的电动机因此额外增加的功率为","options":["22.5 W","45.0 W","30.0 W","90.0 W"],"answer":"B","explain":"单位时间内落到带上的沙粒获得的水平动量为 (dm/dt)v = 20.0×1.50 = 30.0 N，带需提供的水平力 F = 30.0 N。\n故额外功率 P = Fv = 30.0×1.50 = 45.0 W。\n这 45.0 W 中只有 ½(dm/dt)v² = 22.5 W 变为沙粒动能，其余在相对滑动中变为热。\n易错点：22.5 W 只算动能增加率；30.0 W 把力的大小当功率；90.0 W 重复乘 v。"},{"id":"c04q017","type":"choice","difficulty":4,"tags":["摩擦力做功","路径","功的定义"],"stem":"质量 4.00 kg 的物块在水平面上沿半径 3.00 m 的圆周缓慢滑行半圈，物块与水平面间的动摩擦因数 μ = 0.250，g = 9.80 m/s²。摩擦力对物块做的功为","options":["0","−19.6 J","−58.8 J","−92.4 J"],"answer":"D","explain":"滑动摩擦力大小恒定 f = μmg = 0.250×4.00×9.80 = 9.80 N，方向始终与运动方向相反。\n半圈路程 s = πR = π×3.00 = 9.42 m，故 W_f = −f·s = −9.80×9.42 = −92.4 J。\n摩擦力是耗散力，做功由路程决定，与位移无关。\n易错点：0 误以为位移为零故功为零；−58.8 J 用直径 6.00 m 当路程；−19.6 J 用半径当路程。"},{"id":"c04q018","type":"choice","difficulty":4,"tags":["弹簧振子","能量守恒","振幅"],"stem":"水平光滑面上，质量 0.500 kg 的物块连在劲度系数 k = 200 N/m 的弹簧上做简谐振动，振幅 A = 0.100 m。物块经过平衡位置时的速度大小，以及位移为 0.050 m 时的速度大小分别为","options":["2.00 m/s，1.00 m/s","2.00 m/s，1.73 m/s","1.73 m/s，2.00 m/s","2.00 m/s，1.41 m/s"],"answer":"B","explain":"由 ½kA² = ½mv_max² 得 v_max = A√(k/m) = 0.100×√(200/0.500) = 0.100×20.0 = 2.00 m/s。\n位移 x = 0.050 m 时由 ½mv² + ½kx² = ½kA² 得 v = v_max√(1 − (x/A)²) = 2.00×√(1 − 0.250) = 1.73 m/s。\n易错点：1.00 m/s 误用线性关系；1.41 m/s 取 x = A/√2 的结果；1.73 m/s 与 2.00 m/s 次序颠倒。"},{"id":"c04q019","type":"choice","difficulty":4,"tags":["斜面","功能原理","往返运动"],"stem":"质量 1.00 kg 的物块以 10.0 m/s 的初速度沿倾角 30.0° 的斜面上滑，物块与斜面间的动摩擦因数 μ = 0.200，g = 9.80 m/s²。物块沿斜面上滑的最大距离，以及返回出发点时的速度大小分别为","options":["7.58 m，6.97 m/s","7.58 m，8.62 m/s","6.50 m，6.97 m/s","6.50 m，8.62 m/s"],"answer":"A","explain":"上滑：ma = mg sin30.0° + μmg cos30.0°，a₁ = 9.80×(0.500 + 0.200×0.866) = 6.60 m/s²。\ns = v₀²/(2a₁) = 100/13.2 = 7.58 m。\n下滑：a₂ = g(sin30.0° − μcos30.0°) = 9.80×0.327 = 3.20 m/s²，v = √(2a₂s) = √(2×3.20×7.58) = 6.97 m/s。\n易错点：8.62 m/s 下滑时忘记摩擦；6.50 m 用平均加速度算距离，往返两段加速度并不相同。"},{"id":"c04q020","type":"choice","difficulty":4,"tags":["逃逸速度","引力势能","第二宇宙速度"],"stem":"火星质量 6.42×10²³ kg，半径 3.39×10⁶ m，引力常量 G = 6.674×10⁻¹¹ N·m²/kg²。从火星表面发射探测器，使其恰好能脱离火星引力所需的最小发射速度为","options":["3.56 km/s","5.03 km/s","7.11 km/s","2.51 km/s"],"answer":"B","explain":"逃逸条件为总机械能恰为零：½mv² − GMm/R = 0，故 v = √(2GM/R)。\n代入：v = √(2×6.674×10⁻¹¹×6.42×10²³/3.39×10⁶) = √(2.528×10⁷) = 5.03×10³ m/s。\n易错点：3.56 km/s 是第一宇宙速度 √(GM/R)；7.11 km/s 把 2 倍根号外提；2.51 km/s 用直径当半径且漏掉 2。"},{"id":"c04q021","type":"choice","difficulty":5,"tags":["机械能守恒","临界条件","球面"],"stem":"质量 m 的小球从半径为 R = 0.500 m 的光滑半球面顶点由静止开始下滑，半球固定不动，g = 9.80 m/s²。小球脱离球面时距水平地面的高度为","options":["0.333 m","0.500 m","0.667 m","0.833 m"],"answer":"D","explain":"设脱离时半径与竖直方向夹角为 θ，速度为 v。径向：mg cosθ − N = mv²/R，脱离时 N = 0，故 v² = gR cosθ。\n能量守恒：mgR(1 − cosθ) = ½mv²，联立得 cosθ = 2/3。\n脱离点距球心高度 R cosθ = 2R/3 = 0.333 m，距地面 R + 2R/3 = 1.667R = 0.833 m。\n易错点：0.333 m 只算到球心的高度；0.667 m 用 R + R/3 却把球心当基准；0.500 m 误以为在球心高度脱离。"},{"id":"c04q022","type":"choice","difficulty":5,"tags":["圆周运动","临界条件","能量守恒"],"stem":"质量 0.200 kg 的小球在竖直放置的光滑圆环内侧运动，圆环半径 R = 0.400 m。小球从环的最低点以 v₀ = 4.20 m/s 出发，g = 9.80 m/s²。关于小球能否通过最高点，以及（若不能）脱离圆环时距最低点的高度，正确的是","options":["能通过最高点","不能通过，脱离点高 0.800 m","不能通过，脱离点高 0.733 m","不能通过，脱离点高 0.400 m"],"answer":"C","explain":"过最高点的临界条件是小球与环恰好无压力：v_top² = gR，由能量守恒 v₀² = 5gR = 19.6 m²/s²，即需 v₀ ≥ 4.43 m/s。\n本题 v₀² = 17.6 \u003c 19.6，不能通过最高点。\n设脱离时半径与竖直向上方向夹角为 θ：径向 mg cosθ = mv²/R；能量 v₀² = v² + 2gR(1 + cosθ)，联立得 cosθ = (v₀²/(gR) − 2)/3 = 0.833。\n脱离点距最低点 h = R(1 + cosθ) = 0.400×1.833 = 0.733 m，此时 v = √(gR cosθ) = 1.81 m/s。\n易错点：0.800 m 把 2R 当高度；0.400 m 误以为在环心高度脱离。"},{"id":"c04q023","type":"choice","difficulty":5,"tags":["势能曲线","微振动","平衡点"],"stem":"质量 2.00 kg 的质点在 x 轴上运动，势能函数为 U(x) = 4.00/x² − 8.00/x（U 以 J 计，x 以 m 计，x > 0）。质点在稳定平衡点附近做微小振动，其周期为","options":["1.57 s","2.22 s","3.14 s","6.28 s"],"answer":"C","explain":"平衡点：dU/dx = −8.00/x³ + 8.00/x² = 0，得 x₀ = 1.00 m。\nd²U/dx² = 24.0/x⁴ − 16.0/x³，在 x₀ = 1.00 m 处等于 8.00 N/m > 0，为稳定平衡。\n小振动等效劲度系数 k_eff = d²U/dx² = 8.00 N/m，ω = √(k_eff/m) = √(8.00/2.00) = 2.00 rad/s，T = 2π/ω = 3.14 s。\n易错点：1.57 s 把 ω 当成 2π；6.28 s 用 ω = 1.00；2.22 s 把二阶导数误算为 4.00。"},{"id":"c04q024","type":"choice","difficulty":5,"tags":["碰撞","质心系","动能损失"],"stem":"光滑水平面上，质量 3.00 kg 的滑块以 4.00 m/s 向右运动，与以 2.00 m/s 向左运动的 5.00 kg 滑块发生完全非弹性碰撞。碰撞中损失的动能为","options":["67.5 J","33.8 J","18.8 J","25.0 J"],"answer":"B","explain":"取向右为正，总动量 p = 3.00×4.00 − 5.00×2.00 = 2.00 kg·m/s，碰后共同速度 v = 0.250 m/s。\n初动能 K_i = ½×3.00×16.0 + ½×5.00×4.00 = 34.0 J；末动能 K_f = ½×8.00×0.250² = 0.250 J。\n损失 ΔK = 33.75 J ≈ 33.8 J，也等于 ½μv_rel² = ½×(15/8)×6.00² = 33.8 J。\n易错点：67.5 J 漏掉 ½；18.8 J 用相对速度 4.00 m/s 算；25.0 J 只用较重的滑块配 4.00 m/s。"},{"id":"c04q025","type":"choice","difficulty":5,"tags":["卫星变轨","逃逸速度","圆轨道"],"stem":"卫星在半径 7.00×10⁶ m 的圆轨道上绕地球运行，地球 GM = 3.986×10¹⁴ m³/s²。若在轨道上沿运动方向短时点火，使卫星恰好能脱离地球引力（进入抛物线轨道），所需的速度增量为","options":["3.13 km/s","7.55 km/s","10.7 km/s","1.57 km/s"],"answer":"A","explain":"圆轨道速度 v_c = √(GM/r) = √(3.986×10¹⁴/7.00×10⁶) = 7.55×10³ m/s。\n逃逸速度（同一点）v_e = √(2GM/r) = √2·v_c = 1.414×7.55 = 10.7 km/s。\nΔv = v_e − v_c = 0.414×7.55 = 3.13 km/s。\n易错点：7.55 km/s 是原轨道速度；10.7 km/s 是逃逸速度本身；1.57 km/s 把增量又除以了 2。"},{"id":"c04q026","type":"choice","difficulty":5,"tags":["弹簧","动量守恒","弹性分离"],"stem":"光滑水平面上，质量 1.00 kg 的物块 A 以 3.00 m/s 向右运动，与静止的、左端连有轻弹簧的 2.00 kg 物块 B 相碰。弹簧与 B 相连并可自由移动，形变完全恢复后 A、B 分离。分离时 A、B 的速度分别为（向右为正）","options":["0 和 1.00 m/s","1.00 m/s 和 2.00 m/s","−1.00 m/s 和 1.00 m/s","−1.00 m/s 和 2.00 m/s"],"answer":"D","explain":"弹簧形变完全恢复，A、B 的碰撞可视为完全弹性碰撞。动量守恒：1.00×3.00 = v_A + 2.00v_B。\n弹性碰撞速度公式：v_A = (m_A − m_B)/(m_A + m_B)·v₀ = (−1/3)×3.00 = −1.00 m/s，v_B = 2m_A/(m_A + m_B)·v₀ = (2/3)×3.00 = 2.00 m/s。\n验证：动量 −1.00 + 4.00 = 3.00；动能 0.500 + 4.00 = 4.50 = ½×1.00×9.00。\n易错点：0 和 1.00 m/s 是完全非弹性结果；1.00 m/s 把 A 的反弹方向判错。"},{"id":"c04q027","type":"choice","difficulty":5,"tags":["恒定功率启动","微分方程","速度"],"stem":"质量 1.50×10³ kg 的汽车以恒定功率 4.80×10⁴ W 从静止启动，阻力恒为 800 N。汽车速度达到最大速度的 90.0% 所需时间为","options":["4.32 s","3.75 s","5.20 s","2.30 s"],"answer":"A","explain":"由 P/v − f = m dv/dt 得 dv/dt = (f/m)(v_max/v − 1)，其中 v_max = P/f = 60.0 m/s。\n分离变量积分得 v = v_max(1 − e^(−ft/m))，时间常数 τ = m/f = 1500/800 = 1.875 s。\n令 v/v_max = 0.900：t = −τ ln(1 − 0.900) = 1.875×2.303 = 4.32 s。\n易错点：3.75 s 把 ln10 取成 2；2.30 s 只算 ln10 忘乘 τ；5.20 s 把 0.900 当作指数里的量直接反解。"},{"id":"c04q028","type":"choice","difficulty":5,"tags":["变力做功","路径积分","曲线运动"],"stem":"质点在 Oxy 平面内沿半径 R 的圆弧运动，圆弧对应的圆心角为 180°（从 (0, −R) 经 (R, 0) 到 (0, R)）。作用在质点上的力始终沿圆弧切线方向，大小随极角 θ 变化为 F = F₀cosθ（θ 从 −90° 变到 +90°）。F₀ = 10.0 N，R = 0.500 m，该力做的功为","options":["0","5.00 J","7.85 J","10.0 J"],"answer":"D","explain":"沿圆弧取微元 ds = R dθ，力与位移同向，故 dW = F ds = F₀cosθ·R dθ。\nW = ∫F₀R cosθ dθ（θ 从 −π/2 到 π/2）= F₀R[sinθ] = 2F₀R。\n代入：W = 2×10.0×0.500 = 10.0 J。\n易错点：0 误以为前后对称功相消（力始终沿切向，两半段都做正功）；5.00 J 漏掉因子 2；7.85 J 把 ∫cosθdθ 误算为 π/2。"},{"id":"c04q029","type":"choice","difficulty":5,"tags":["保守力","路径积分","功"],"stem":"质点在 Oxy 平面内受到力 F = (2.00y) i（SI 单位）。质点从原点运动到点 (1.00 m, 1.00 m)：若沿抛物线 y = x² 运动，该力做功 W₁；若先沿 x 轴从 (0, 0) 到 (1.00 m, 0)，再沿竖直线到 (1.00 m, 1.00 m)，做功 W₂。W₁ − W₂ 为","options":["0","0.333 J","0.667 J","1.00 J"],"answer":"C","explain":"沿抛物线：y = x²，W₁ = ∫2.00y dx = ∫₀¹ 2.00x² dx = 0.667 J。\n沿折线：沿 x 轴时 y = 0，F = 0；沿竖直线时 dx = 0，F 与位移垂直。故 W₂ = 0。\nW₁ − W₂ = 0.667 J ≠ 0，说明该力做功与路径有关，不是保守力（∂F_y/∂x − ∂Fₓ/∂y = −2.00 ≠ 0）。\n易错点：0 误判为保守力；0.333 J 积分时漏乘 2.00；1.00 J 把 W₁ 算成 2.00y·Δx 再取半。"},{"id":"c04q030","type":"choice","difficulty":5,"tags":["空气阻力","终极速度","牛顿第二定律"],"stem":"质量 80.0 kg 的跳伞者从高空下落，所受空气阻力大小为 f = kv²，k = 0.250 kg/m，g = 9.80 m/s²。他的终极速度，以及速度为终极速度一半时的加速度大小分别为","options":["56.0 m/s，9.80 m/s²","39.6 m/s，7.35 m/s²","56.0 m/s，4.90 m/s²","56.0 m/s，7.35 m/s²"],"answer":"D","explain":"终极速度时 a = 0：mg = kv_t²，v_t = √(mg/k) = √(80.0×9.80/0.250) = √3136 = 56.0 m/s。\nv = v_t/2 时 f = k(v_t/2)² = mg/4，合力 = mg − mg/4 = 3mg/4，a = 3g/4 = 7.35 m/s²。\n易错点：9.80 m/s² 忽略阻力；39.6 m/s 把 k 当作 0.500；4.90 m/s² 误用 f = mg/2。"},{"id":"c04q031","type":"choice","difficulty":5,"tags":["弹性碰撞","能量传递","动量守恒"],"stem":"光滑水平面上，质量 2.00 kg 的滑块以 6.00 m/s 的速率与静止的 4.00 kg 滑块发生一维完全弹性碰撞。碰后 4.00 kg 滑块获得的动能占碰前总动能的百分比为","options":["50.0%","44.4%","88.9%","66.7%"],"answer":"C","explain":"弹性碰撞速度公式：v₂′ = 2m₁v₀/(m₁ + m₂) = 2×2.00×6.00/6.00 = 4.00 m/s。\n碰后动能 ½×4.00×4.00² = 32.0 J；碰前总动能 ½×2.00×6.00² = 36.0 J。\n百分比 32.0/36.0 = 88.9%。（另有 v₁′ = −2.00 m/s，动量 8.00 与初值一致。）\n易错点：50.0% 按质量比；66.7% 按质量比的 2 倍；44.4% 把剩余动能当传递能量。"},{"id":"c04q032","type":"choice","difficulty":5,"tags":["传送带","摩擦生热","相对位移"],"stem":"水平传送带以 3.00 m/s 的速率匀速运行，将质量 2.00 kg 的物块无初速地轻放在传送带上。物块与传送带间的动摩擦因数 μ = 0.300，g = 9.80 m/s²。物块与传送带达到共同速度的过程中，因相对滑动产生的热量为","options":["18.0 J","4.50 J","13.5 J","9.00 J"],"answer":"D","explain":"物块加速：a = μg = 2.94 m/s²，达到 3.00 m/s 需 t = 1.02 s。\n物块位移 s₁ = ½at² = 1.53 m；传送带位移 s₂ = vt = 3.06 m；相对位移 Δs = 1.53 m。\nQ = fΔs = μmgΔs = 5.88×1.53 = 9.00 J（恰等于物块获得的动能）。\n易错点：18.0 J 用传送带位移算；4.50 J 只用物块位移的一半；13.5 J 把相对位移算成 2.30 m。"},{"id":"c04q033","type":"choice","difficulty":5,"tags":["变力做功","动能定理","积分"],"stem":"质量 0.500 kg 的质点从静止开始沿 x 轴正方向运动，受到的力 F = 8.00/x²（F 以 N 计，x 以 m 计，方向沿 +x）。质点从 x = 0.500 m 运动到 x = 2.00 m 的过程中，该力做的功及质点到达 x = 2.00 m 时的速度分别为","options":["12.0 J，6.93 m/s","48.0 J，13.9 m/s","12.0 J，4.90 m/s","8.00 J，5.66 m/s"],"answer":"A","explain":"W = ∫8.00x⁻² dx（从 0.500 到 2.00）= −8.00/x = −4.00 + 16.0 = 12.0 J。\n由动能定理 ½mv² = W（初速为零）：½×0.500×v² = 12.0，v = √48.0 = 6.93 m/s。\n易错点：48.0 J 用起点处 F(0.500) = 32.0 N 乘全程 1.50 m；4.90 m/s 漏掉动能中的 ½；8.00 J 只积分到 x = 1.00 m。"},{"id":"c04q034","type":"choice","difficulty":5,"tags":["功率","效率","能量"],"stem":"一台水泵每秒把 20.0 kg 的水提升 10.0 m，并使水以 5.00 m/s 的速率喷出。水泵的效率为 0.700，g = 9.80 m/s²。带动水泵的电动机的输入功率至少为","options":["2.21 kW","3.16 kW","1.55 kW","4.52 kW"],"answer":"B","explain":"每秒对水做的有用功包括提升势能与动能：P_out = (dm/dt)(gh + ½v²) = 20.0×(9.80×10.0 + 0.500×25.0)。\n= 20.0×(98.0 + 12.5) = 20.0×110.5 = 2.21×10³ W。\n输入功率 P_in = P_out/η = 2.21×10³/0.700 = 3.16×10³ W。\n易错点：2.21 kW 漏除效率；1.55 kW 把效率乘了进去；4.52 kW 把效率除了两次。"},{"id":"c04q035","type":"choice","difficulty":5,"tags":["椭圆轨道","角动量守恒","能量守恒"],"stem":"卫星沿椭圆轨道绕地球运行，近地点到地心距离 7.00×10⁶ m，近地点速度 9.00×10³ m/s，GM = 3.986×10¹⁴ m³/s²。远地点到地心的距离约为","options":["1.40×10⁷ m","1.72×10⁷ m","2.10×10⁷ m","3.50×10⁷ m"],"answer":"B","explain":"角动量守恒：v_p r_p = v_a r_a。能量守恒：½v_p² − GM/r_p = ½v_a² − GM/r_a。\n代入 v_a = v_p r_p/r_a，得关于 r_a 的二次方程，解出 r_a = 1.72×10⁷ m（另一根正是 r_p）。\n数值验证：v_a = 9.00×10³×7.00/17.2 = 3.66×10³ m/s，比动能加比势能在两点均为 −1.64×10⁷ J/kg。\n易错点：1.40×10⁷ m 直接用 2r_p；2.10×10⁷ m 漏掉 ½；3.50×10⁷ m 用能量守恒时漏掉势能项。"},{"id":"c04q036","type":"calc","difficulty":3,"tags":["变力做功","动能定理","平均功率"],"stem":"质量 2.00 kg 的质点沿 x 轴运动，t = 0 时位于 x = 0、速度为 1.00 m/s（沿 +x）。质点受到沿 +x 方向的力 F = 4.00x²（SI 单位）。求：(1) 质点从 x = 0 到 x = 2.00 m 过程中该力做的功；(2) 到达 x = 2.00 m 时的速度；(3) 若这段运动用时 3.00 s，该力的平均功率。","answer":"(1) 10.7 J；(2) 3.42 m/s；(3) 3.56 W","explain":"(1) 力随位置变化，须积分：W = ∫₀² 4.00x² dx = (4.00/3)x³|₀² = 10.67 J。\n(2) 由动能定理：½×2.00×v² − ½×2.00×1.00² = 10.67，得 v² = 1.00 + 10.67 = 11.67，v = 3.42 m/s。\n(3) 平均功率 P = W/t = 10.67/3.00 = 3.56 W。\n说明：若误用 F(2.00)×2.00 = 32.0 J，会得到偏大的速度 5.74 m/s。"},{"id":"c04q037","type":"calc","difficulty":3,"tags":["斜面","弹簧","功能原理"],"stem":"质量 2.00 kg 的物块从倾角 30.0° 的斜面顶端由静止下滑，斜面长 2.40 m，物块与斜面间的动摩擦因数 μ = 0.200。斜面底端与一段光滑水平面相接，水平面末端固定一劲度系数 k = 500 N/m 的轻弹簧。g = 9.80 m/s²。求：(1) 物块到达斜面底端时的速度；(2) 弹簧的最大压缩量；(3) 物块被弹回后到达斜面顶端时的速度（判断能否冲上顶端）。","answer":"(1) 3.92 m/s；(2) 0.248 m；(3) 2.69 m/s，能冲过顶端","explain":"(1) 重力做功 mgh = 2.00×9.80×1.20 = 23.5 J；摩擦生热 μmg cos30.0°·s = 0.200×19.6×0.866×2.40 = 8.15 J。\n½mv² = 23.5 − 8.15 = 15.4 J，v = 3.92 m/s。\n(2) 水平面光滑，动能全部转为弹性势能：½×500x² = 15.4，x = 0.248 m。\n(3) 弹回后再次克服斜面摩擦 8.15 J，到顶端剩 15.4 − 8.15 = 7.23 J，v = √(2×7.23/2.00) = 2.69 m/s > 0，故能冲过顶端。"},{"id":"c04q038","type":"calc","difficulty":4,"tags":["变力做功","摩擦力","极值"],"stem":"质量 4.00 kg 的物块静置于水平面上，从 x = 0 起受到沿 +x 方向的力 F = 50.0 − 5.00x（F 以 N 计，x 以 m 计）。物块与水平面间的动摩擦因数 μ = 0.200，g = 9.80 m/s²。求：(1) 物块速度最大时的位置；(2) 最大速度；(3) 物块到达 x = 12.0 m 时的速度。","answer":"(1) 8.43 m；(2) 9.43 m/s；(3) 8.54 m/s","explain":"摩擦力 f = μmg = 0.200×4.00×9.80 = 7.84 N。\n(1) 合力为零时速度最大：F = f，50.0 − 5.00x = 7.84，x = 8.43 m。\n(2) 由动能定理 W_net = ∫(50.0 − 5.00x − 7.84)dx（0 到 8.43 m）= 421.6 − 177.7 − 66.1 = 1.78×10² J，v_max = √(2×177.7/4.00) = 9.43 m/s。\n(3) 到 x = 12.0 m：W_net = 600 − 360 − 94.1 = 146 J，v = √(2×146/4.00) = 8.54 m/s。\n说明：8.43 m 之后 F \u003c f，物块减速但仍在前进，故末速小于最大速度。"},{"id":"c04q039","type":"calc","difficulty":4,"tags":["变力做功","指数衰减力","平均力"],"stem":"质量 5.00 kg 的物块静置于光滑水平面上，从 x = 0 起受到沿 +x 方向的力 F = 40.0e^(−0.500x)（SI 单位）。求：(1) 物块从 x = 0 到 x = 4.00 m 过程中该力做的功；(2) 到达 x = 4.00 m 时的速度；(3) 这段位移内该力的平均值。","answer":"(1) 69.2 J；(2) 5.26 m/s；(3) 17.3 N","explain":"(1) W = ∫₀⁴ 40.0e^(−0.500x)dx = (40.0/0.500)(1 − e^(−2.00)) = 80.0×0.8647 = 69.2 J。\n(2) 动能定理：½×5.00×v² = 69.2，v = 5.26 m/s。\n(3) 平均力 F̄ = W/Δx = 69.2/4.00 = 17.3 N，远小于初始的 40.0 N。\n说明：该力的功随位移趋于极限值 80.0 J，本题取到 4.00 m 已完成 86.5%。"},{"id":"c04q040","type":"calc","difficulty":4,"tags":["弹簧","动量守恒","能量守恒"],"stem":"光滑水平面上，质量 2.00 kg 的物块 A 以 4.00 m/s 向右运动，与静止的质量 3.00 kg 的物块 B 相碰，B 左端连有劲度系数 k = 800 N/m 的轻弹簧（弹簧可随 B 一起运动）。求：(1) 弹簧压缩量最大时两物块的共同速度；(2) 最大压缩量；(3) 弹簧恢复原长后 A、B 的速度。","answer":"(1) 1.60 m/s；(2) 0.155 m；(3) A 为 −0.800 m/s（反向），B 为 3.20 m/s","explain":"(1) 压缩最大时两者速度相同，动量守恒：2.00×4.00 = (2.00 + 3.00)v，v = 1.60 m/s。\n(2) 能量守恒：½×2.00×4.00² = ½×5.00×1.60² + ½×800x²，即 16.0 = 6.40 + 400x²，x = 0.155 m。\n(3) 弹簧恢复原长后弹性势能为零，等效完全弹性碰撞：v_A = (2.00 − 3.00)/5.00×4.00 = −0.800 m/s，v_B = 2×2.00/5.00×4.00 = 3.20 m/s。\n验证：动量 −1.60 + 9.60 = 8.00，动能 0.640 + 15.36 = 16.0。"},{"id":"c04q041","type":"calc","difficulty":5,"tags":["势能曲线","逃逸条件","微振动"],"stem":"质量 2.00 kg 的质点在 x 轴上运动，势能函数为 U(x) = 4.00/x² − 8.00/x（U 以 J 计，x 以 m 计，x > 0）。求：(1) 平衡点位置及稳定性；(2) 在该点附近做微小振动的周期；(3) 质点从平衡点出发逃逸所需的最小速度；(4) 若质点总能量 E = −2.00 J，求运动范围的两个转折点位置、运动的振幅（取两转折点间距的一半）和最大动能。","answer":"(1) x = 1.00 m，d²U/dx² > 0，稳定平衡；(2) T = 2π√(m/k_eff) = 3.14 s；(3) v = √(−2U_min/m) = 2.00 m/s；(4) 转折点 x = 0.586 m 与 3.41 m，振幅 1.41 m，最大动能 2.00 J","explain":"(1) dU/dx = −8.00/x³ + 8.00/x² = 0 得 x = 1.00 m；d²U/dx² = 24.0/x⁴ − 16.0/x³ 在 x = 1.00 m 处为 +8.00 N/m > 0，故为稳定平衡，U_min = −4.00 J。\n(2) k_eff = 8.00 N/m，ω = √(8.00/2.00) = 2.00 rad/s，T = 2π/ω = 3.14 s。\n(3) 逃逸要求 E ≥ 0，故 ½mv² = 0 − (−4.00) = 4.00 J，v = 2.00 m/s。\n(4) 由 4.00/x² − 8.00/x = −2.00 得 x² − 4.00x + 2.00 = 0，x = 0.586 m 与 3.41 m，振幅 = (3.41 − 0.586)/2 = 1.41 m；最大动能 = E − U_min = 2.00 J。"},{"id":"c04q042","type":"calc","difficulty":5,"tags":["链条","连续体","功能原理"],"stem":"长 1.00 m、质量 2.00 kg 的均匀柔软链条放在水平桌面上，一端伸出桌边 0.400 m。链条与桌面间的动摩擦因数 μ = 0.200，桌边处光滑，g = 9.80 m/s²。求：(1) 判断链条能否由静止开始滑动；(2) 链条尾端刚离开桌边时的速度；(3) 整个过程中摩擦力做的功。","answer":"(1) 能滑动（mgx₀/L > μmg(L − x₀)/L）；(2) v = √(2[(U₁ − U₂) + W_f]/m) = 2.74 m/s；(3) W_f = −μmg(L − x₀)²/(2L) = −0.706 J","explain":"(1) 悬垂部分重力 (m/L)x₀g = 2.00×0.400×9.80 = 7.84 N；桌面上部分最大摩擦力 μ(m/L)(L − x₀)g = 0.200×2.00×0.600×9.80 = 2.35 N，7.84 > 2.35，能滑动。\n(2) 能量法：初态 U₁ = −(m/L)x₀·g·x₀/2 = −1.57 J；末态 U₂ = −mgL/2 = −9.80 J。\n摩擦力随悬垂长度增大而减小，W_f = −∫μ(m/L)(L − x)g dx = −μmg(L − x₀)²/(2L) = −0.706 J。\n½mv² = (U₁ − U₂) + W_f = 8.23 − 0.706 = 7.53 J，v = 2.74 m/s。\n(3) W_f = −0.706 J，负号表示摩擦力做负功，其大小等于摩擦生热。"},{"id":"c04q043","type":"calc","difficulty":5,"tags":["弹簧","摩擦力","几何级数"],"stem":"质量 2.00 kg 的物块连在劲度系数 k = 200 N/m 的水平轻弹簧上，置于粗糙水平面，动摩擦因数 μ = 0.200，g = 9.80 m/s²。将物块从平衡位置拉到 x = 0.250 m 处由静止释放。求：(1) 每经过半个周期振幅的减少量；(2) 物块最终停止的位置；(3) 从释放到停止物块走过的总路程和损失的机械能。","answer":"(1) 0.0392 m；(2) 平衡位置 +x 侧 0.0148 m 处；(3) 总路程 1.59 m，损失 6.23 J","explain":"(1) 摩擦力 f = μmg = 3.92 N。半个周期内势能减少 2fA：½kA² − ½kA′² = f(A + A′)，得 A′ = A − 2f/k，即每次减少 2f/k = 0.0392 m。\n(2) 振幅依次为 0.250、0.211、0.172、0.132、0.093、0.054、0.0148 m（平衡位置两侧交替）。当剩余振幅 0.0148 m 时 k|x| = 2.96 N \u003c f = 3.92 N，物块不能再启动，停在 +x 侧 0.0148 m 处。\n(3) 总路程 = (0.250 + 0.211) + … + (0.054 + 0.0148) = 1.59 m，损失 = f·s = 3.92×1.59 = 6.23 J。\n验证：初机械能 ½×200×0.250² = 6.25 J，末势能 ½×200×0.0148² = 0.022 J，差 6.23 J。"},{"id":"c04q044","type":"calc","difficulty":5,"tags":["质心系","完全非弹性碰撞","动能定理"],"stem":"光滑水平面上，质量 4.00 kg 的滑块以 5.00 m/s 向右运动，与以 1.00 m/s 同向运动的 6.00 kg 滑块发生完全非弹性碰撞。求：(1) 系统质心速度；(2) 碰前系统在质心系中的总动能；(3) 碰撞损失的动能及其占碰前总动能的比例；(4) 用符号证明完全非弹性碰撞的动能损失等于碰前质心系动能。","answer":"(1) 2.60 m/s；(2) 19.2 J；(3) 损失 19.2 J，占 36.2%；(4) ΔK = ½μv_rel² = K_cm","explain":"(1) v_c = (4.00×5.00 + 6.00×1.00)/10.0 = 2.60 m/s。\n(2) K_cm = ½m₁(v₁ − v_c)² + ½m₂(v₂ − v_c)² = ½×4.00×2.40² + ½×6.00×1.60² = 11.52 + 7.68 = 19.2 J。\n(3) 碰后两滑块同速 v_c，在质心系中静止，故损失恰为 K_cm = 19.2 J；碰前总动能 ½×4.00×25.0 + ½×6.00×1.00 = 53.0 J，比例 19.2/53.0 = 36.2%。\n(4) 设相对速度 v_rel = v₁ − v₂，约化质量 μ = m₁m₂/(m₁ + m₂)，可证 K_cm = ½μv_rel²；完全非弹性碰撞后质心系动能全失，故 ΔK = ½μv_rel²。此处 ½×2.40×4.00² = 19.2 J，与(2)一致。"},{"id":"c04q045","type":"calc","difficulty":5,"tags":["恒定功率启动","微分方程","v-t 关系"],"stem":"质量 1.50×10³ kg 的汽车在平直公路上以恒定功率 6.00×10⁴ W 从静止启动（设启动初期即已能输出该功率），所受阻力恒为 1.00×10³ N。求：(1) 汽车的最大速度；(2) 速度 v 与时间 t 的关系式（写成 t 关于 v 的表达式）；(3) 速度达到最大速度 80.0% 所需的时间；(4) 这段时间内行驶的路程。","answer":"(1) 60.0 m/s；(2) t = (m/f)[−v − v_max·ln(1 − v/v_max)]，即 v(t) 为隐式解，不是指数形式；(3) 7.28×10¹ s；(4) 2.64×10³ m","explain":"(1) 加速度为零时牵引力等于阻力：P/v_max = f，v_max = P/f = 6.00×10⁴/1.00×10³ = 60.0 m/s。(2) 由 P/v − f = m dv/dt 得 dt = m v dv/(P − fv) = (m/f)·v dv/(v_max − v)。分离变量积分：t = (m/f)[−v_max ln(1 − v/v_max) − v]，时间常数 m/f = 1.50 s。注意 P/v − f 不是 f(v_max − v)/v 之外的形式，不能积成指数解——恒功率启动的 v 只是隐式函数，t → ∞ 时才趋于 v_max。(3) v = 48.0 m/s 时 v/v_max = 0.800，ln(1 − 0.800) = ln0.2 = −1.609，t = 1.50×[−48.0 − 60.0×(−1.609)] = 1.50×48.6 = 72.8 s。(4) 用动能定理更省事：牵引力做功 Pt 一部分变动能、一部分被阻力耗掉，Pt = ½mv² + f s，s = (Pt − ½mv²)/f = (6.00×10⁴×72.8 − 0.5×1.50×10³×48.0²)/1.00×10³ = (4.37×10⁶ − 1.73×10⁶)/1.00×10³ = 2.64×10³ m。易错点：把恒定功率当成恒定牵引力，套恒力启动的指数解；或只算 Pt/… 忘记扣摩擦功。"},{"id":"c04q046","type":"calc","difficulty":5,"tags":["卫星变轨","霍曼转移","第二宇宙速度"],"stem":"卫星在半径 r₁ = 7.00×10⁶ m 的圆轨道上绕地球运行，欲转移到半径 r₂ = 1.40×10⁷ m 的圆轨道。GM = 3.986×10¹⁴ m³/s²。求：(1) 转移轨道（椭圆，近地点 r₁、远地点 r₂）在近地点和远地点的速度；(2) 两次点火的速度增量及总速度增量；(3) 由圆轨道速度出发推导第二宇宙速度的符号表达式，并算出地球表面的数值（R = 6.37×10⁶ m）。","answer":"(1) 8.71 km/s 和 4.36 km/s；(2) 1.17 km/s、0.980 km/s，合计 2.15 km/s；(3) v₂ = √(2GM/R) = √2·v_c ≈ 11.2 km/s","explain":"(1) 圆轨道 v_c1 = √(GM/r₁) = 7.55 km/s。转移轨道近地点 v_p = v_c1√(2r₂/(r₁ + r₂)) = 7.55×√(28/21) = 8.71 km/s；由角动量守恒 v_a = v_p r₁/r₂ = 4.36 km/s。\n(2) 第一次点火 Δv₁ = 8.71 − 7.55 = 1.17 km/s；远地点圆轨道速度 v_c2 = √(GM/r₂) = 5.34 km/s，Δv₂ = 5.34 − 4.36 = 0.980 km/s；总 Δv = 2.15 km/s。\n(3) 逃逸条件 ½mv² − GMm/R = 0，得 v₂ = √(2GM/R)；而第一宇宙速度 v_c = √(GM/R)，故 v₂ = √2·v_c。\n代入：v_c = √(3.986×10¹⁴/6.37×10⁶) = 7.91 km/s，v₂ = 1.414×7.91 = 11.2 km/s。"},{"id":"c04q047","type":"calc","difficulty":5,"tags":["圆周运动","临界条件","分段讨论"],"stem":"质量 0.200 kg 的小球在竖直放置的光滑圆环内侧运动，圆环半径 R = 0.400 m，g = 9.80 m/s²。求：(1) 小球能通过最高点时，在最低点所需的最小速度；(2) 若小球在最低点的速度为 4.20 m/s，判断它能否通过最高点；(3) 若不能，求脱离圆环处距最低点的高度和该处速度；并说明 v₀² 落在什么范围时小球会在水平面以上脱离。","answer":"(1) 4.43 m/s；(2) 不能通过；(3) 脱离点高 0.733 m，速度 1.81 m/s；2gR \u003c v₀² \u003c 5gR 时在水平面以上脱离","explain":"(1) 最高点临界：mg = mv_top²/R，v_top = √(gR) = 1.98 m/s；能量 ½mv₀² = ½mv_top² + mg·2R，得 v₀ = √(5gR) = √19.6 = 4.43 m/s。\n(2) v₀² = 17.6 \u003c 5gR = 19.6，不能通过最高点。\n(3) 设脱离时半径与竖直向上方向夹角 θ，N = 0：mg cosθ = mv²/R；能量 v₀² = v² + 2gR(1 + cosθ)。联立得 cosθ = (v₀²/(gR) − 2)/3 = 0.833。\nh = R(1 + cosθ) = 0.733 m，v = √(gR cosθ) = √3.27 = 1.81 m/s。\n说明：v₀² 在 2gR 与 5gR 之间时在水平面以上某处脱离；v₀² \u003c 2gR 时在水平面以下就折返。"},{"id":"c04q048","type":"calc","difficulty":5,"tags":["空气阻力","变力做功","能量"],"stem":"质量 0.500 kg 的小球以 20.0 m/s 的初速度竖直上抛，所受空气阻力大小为 f = kv²，k = 0.0200 kg/m，g = 9.80 m/s²。求：(1) 小球上升的最大高度；(2) 小球落回抛出点时的速度；(3) 与无空气阻力情形相比，最大高度和落地速度各减小多少。","answer":"(1) y_max = (m/2k)ln(1 + kv₀²/(mg)) = 12.1 m；(2) 12.3 m/s；(3) 高度减小 8.3 m，落地速度减小 7.7 m/s","explain":"(1) 上升过程 mv dv/dy = −mg − kv²，积分得 y_max = (m/2k)ln(1 + kv₀²/(mg)) = 12.5×ln(1 + 0.0200×400/4.90) = 12.5×0.968 = 12.1 m。\n(2) 下落过程 mv dv/dy = mg − kv²，积分得 v_f² = (mg/k)(1 − e^(−2ky_max/m)) = 245×(1 − e^(−0.968)) = 152，v_f = 12.3 m/s。\n(3) 无阻力时 h = v₀²/(2g) = 20.4 m，落地速度 20.0 m/s，故高度减小 8.3 m，速度减小 7.7 m/s。\n说明：上升时阻力与重力同向、下降时反向，故下降末速小于初速，机械能不断被耗散。"},{"id":"c04q049","type":"calc","difficulty":5,"tags":["保守力","路径积分","旋度"],"stem":"两力场分别定义为：(a) F = 2.00xy i + x² j；(b) F = 2.00y i（SI 单位）。求：(1) 判断两个力场是否为保守力；(2) 对力场 (a)，求质点从 (0, 0) 沿直线到 (2.00 m, 3.00 m) 的功，并说明沿另一条路径（先沿 x 轴到 (2.00 m, 0)，再沿竖直线到终点）的功是否相同；(3) 对力场 (b)，求沿抛物线 y = x² 从 (0, 0) 到 (1.00 m, 1.00 m) 的功，与沿折线（先沿 x 轴再沿竖直线）的功之差。","answer":"(1) (a) 是保守力，(b) 不是；(2) 12.0 J，两条路径相同；(3) 差 0.667 J","explain":"(1) 判据 ∂F_y/∂x = ∂Fₓ/∂y：(a) 2.00x = 2.00x，保守；(b) 0 ≠ 2.00，非保守。\n(2) (a) 的势能为 −x²y，W = ∫d(x²y) = x²y 在 (0,0) 到 (2.00,3.00) 之间取值 = 12.0 J，与路径无关；沿折线：水平段 y = 0 时 Fₓ = 0，竖直段 dx = 0，只剩 ∫F_y dy = ∫₀³ 4.00dy = 12.0 J，相同。\n(3) (b) 沿 y = x²：W₁ = ∫₀¹ 2.00x²dx = 0.667 J；沿折线：水平段 y = 0 功为零，竖直段 dx = 0 功也为零，W₂ = 0，差 0.667 J。\n说明：非保守力的功与路径有关，差值正是环路积分的体现。"},{"id":"c04q050","type":"calc","difficulty":5,"tags":["功率","配重","机械效率"],"stem":"电梯轿厢质量 m₁ = 1.00×10³ kg，配重质量 m₂ = 7.00×10² kg，用跨过定滑轮的钢索相连。轿厢从静止开始以 a = 0.500 m/s² 向上加速 2.00 s，此后匀速上升。机械效率 η = 0.850，g = 9.80 m/s²。求：(1) 加速阶段电动机需提供的等效力；(2) 这 2.00 s 内电动机做的机械功和平均输入功率；(3) 匀速阶段（速率同上）的输入功率；(4) 若去掉配重，匀速阶段输入功率变为多少。","answer":"(1) F = (m₁ − m₂)g + (m₁ + m₂)a = 3.79×10³ N；(2) 3.79×10³ J，2.23 kW；(3) 3.46 kW；(4) 11.5 kW","explain":"(1) 对轿厢与配重整体：F = (m₁ − m₂)g + (m₁ + m₂)a = 300×9.80 + 1700×0.500 = 3.79×10³ N。\n(2) 2.00 s 内位移 s = ½at² = 1.00 m，钢索对系统做功 W = Fs = 3.79×10³ J；平均机械功率 1.90 kW，输入功率 1.90/0.850 = 2.23 kW。\n(3) 匀速时 a = 0，F = (m₁ − m₂)g = 2.94×10³ N，v = at = 1.00 m/s，P_in = Fv/η = 3.46 kW。\n(4) 去掉配重后 F = m₁g = 9.80×10³ N，P_in = 9.80×10³×1.00/0.850 = 11.5 kW，约为原来的 3.3 倍。\n说明：配重的作用是平衡轿厢自重，使电机只需克服两者之差。"}]},{"chapter":5,"chapterName":"刚体定轴转动","questions":[{"id":"c05q001","type":"calc","difficulty":5,"tags":["变力矩制动","积分法","角动量定理"],"stem":"一个转动惯量 I = 0.50 kg·m² 的飞轮以 ω₀ = 20.0 rad/s 转动。从 t = 0 起它只受轴承阻力矩作用，阻力矩大小与角速度成正比 M = kω，k = 0.40 N·m·s，方向与转动方向相反。求角速度降到 5.0 rad/s 时（1）所经历的时间；（2）飞轮转过的角度。","answer":"t = 1.73 s，θ = 18.8 rad","explain":"取转动方向为正，转动定律 I dω/dt = −kω，分离变量 dω/ω = −(k/I)dt，积分得 ω = ω₀e^(−kt/I)，时间常数 I/k = 1.25 s。\n由 5.0 = 20.0e^(−t/1.25) 得 t = (I/k)ln(ω₀/ω) = 1.25×1.3863 = 1.73 s。\n求角度改以 θ 为自变量：Iω dω/dθ = −kω，约去 ω 得 dθ = −(I/k)dω，故 θ = (I/k)(ω₀ − ω) = 1.25×15.0 = 18.8 rad。\n注意：ω 按指数规律趋于零但永不严格为零，减到零要无限长时间，而转过的总角度 Iω₀/k = 25.0 rad 是有限的。"},{"id":"c05q002","type":"choice","difficulty":5,"tags":["变力矩","一阶微分方程","终态角速度"],"stem":"一个转动惯量 I = 0.50 kg·m² 的飞轮原来静止，从 t = 0 起受到电动机的驱动力矩 M = 6.0 − 0.30ω（SI 单位）作用，ω 为当时的角速度。飞轮角速度达到 10.0 rad/s 所需的时间为","options":["0.833 s","1.16 s","1.67 s","0.416 s"],"answer":"B","explain":"转动定律 I dω/dt = M₀ − kω，分离变量积分得 ω = ω_max(1 − e^(−t/τ))，其中 ω_max = M₀/k = 20.0 rad/s，τ = I/k = 1.67 s。\n代入 ω = 10.0 rad/s：e^(−t/τ) = 1 − 10.0/20 = 0.500，t = τ ln2 = 1.67×0.693 = 1.16 s。\n易错：0.833 s 是把力矩当成恒定的 6.0 N·m；1.67 s 是拿 ω = 10.0 rad/s 时的力矩 3.0 N·m 当恒力矩；0.416 s 是把时间常数错取成 k/I。"},{"id":"c05q003","type":"choice","difficulty":5,"tags":["变力矩制动","角位移积分","指数衰减"],"stem":"一个转动惯量 I = 0.10 kg·m² 的砂轮以 ω₀ = 30.0 rad/s 转动，撤去动力后只受与角速度成正比的阻力矩 M = kω，k = 0.050 N·m·s。角速度由 30.0 rad/s 减到 15.0 rad/s 的过程中，砂轮转过的角度为","options":["60.0 rad","45.0 rad","30.0 rad","15.0 rad"],"answer":"C","explain":"转动定律 I dω/dt = −kω；改以 θ 为自变量：Iω dω/dθ = −kω，约去 ω 得 dθ = −(I/k)dω。\n积分 θ = (I/k)(ω₀ − ω) = (0.10/0.050)×15.0 = 2.0×15.0 = 30.0 rad。\n验证：转角只与初末角速度之差成正比，与衰减快慢无关；减到零的总转角为 Iω₀/k = 60.0 rad。\n易错：60.0 rad 是减到零的总转角；45.0 rad 是把系数 I/k 记成 3.0（多乘 1.5 倍）；15.0 rad 是积分时多除了因子 2。"},{"id":"c05q004","type":"calc","difficulty":5,"tags":["角动量守恒","刚体碰撞","机械能守恒"],"stem":"一根质量 M = 1.20 kg、长 L = 0.80 m 的均匀细杆，上端用光滑水平轴悬挂，自然下垂。一颗质量 m = 10.0 g 的子弹以 v₀ = 150 m/s 的水平速度击中杆的下端并嵌入其中。求（1）碰后瞬间杆的角速度；（2）杆能摆起的最大角度（与竖直方向的夹角）。取 g = 9.8 m/s²。","answer":"ω = 4.57 rad/s，最大摆角 θ = 64.8°","explain":"碰撞瞬间轴有冲力，但该冲力对轴无力矩，故对轴的角动量守恒：m v₀ L = (ML²/3 + mL²)ω。\nI = 1.20×0.80²/3 + 0.010×0.80² = 0.256 + 0.0064 = 0.2624 kg·m²，初角动量 0.010×150×0.80 = 1.20 kg·m²/s，故 ω = 1.20/0.2624 = 4.57 rad/s。\n碰后机械能守恒：½Iω² = 0.5×0.2624×4.573² = 2.744 J，等于 g(1 − cosθ)(ML/2 + mL) = 9.8×0.488×(1 − cosθ) = 4.782(1 − cosθ)。\n得 1 − cosθ = 0.574，cosθ = 0.426，θ = 64.8°。\n易错：用动量守恒得速度 v = mv₀/(M+m) 再去换算，完全错——碰撞中轴提供了外力，动量并不守恒。"},{"id":"c05q005","type":"calc","difficulty":5,"tags":["刚体弹性碰撞","角动量守恒","能量守恒"],"stem":"一根质量 M = 0.60 kg、长 L = 0.90 m 的均匀细杆，上端用光滑水平轴悬挂，静止下垂。一个质量 m = 0.10 kg 的小球以 v₀ = 6.00 m/s 的水平速度与杆的下端作完全弹性碰撞（碰后球仍沿原直线运动）。求碰后小球的速度和杆的角速度。","answer":"小球 v = -2.00 m/s（反向弹回），杆 ω = 4.44 rad/s","explain":"设碰后球速 v（沿 v₀ 方向为正）、杆角速度 ω。对轴的角动量守恒：m v₀ L = m v L + Iω，其中 I = ML²/3 = 0.1620 kg·m²。\n令 μ = I/L² = M/3 = 0.200 kg，则角动量式与能量式 ½mv₀² = ½mv² + ½Iω² 一起化成 m v₀ = m v + μu、½mv₀² = ½mv² + ½μu²（u = Lω）。\n这就是 m 与 μ 的一维弹性碰撞：v = (m − μ)/(m + μ)·v₀ = (0.10 − 0.20)/(0.30)×6.00 = -2.00 m/s，u = 2m/(m + μ)·v₀ = 4.00 m/s。\n故 ω = u/L = 4.44 rad/s。小球被弹回，说明杆下端的等效质量 μ 大于球的质量。\n易错：漏掉杆的转动惯量、只用 I = ML²/3 之外的近似都会让 u 偏离；把碰后球速方向判反是常见的符号错误。"},{"id":"c05q006","type":"choice","difficulty":5,"tags":["临界条件","角动量守恒","机械能守恒"],"stem":"一根质量 M = 1.00 kg、长 L = 0.90 m 的均匀细杆上端悬挂，自然下垂。一颗质量 m = 12.0 g 的子弹以水平速度 v 击中杆的下端并嵌入。要使杆（含子弹）恰好能摆到水平位置，v 至少为","options":["104 m/s","147 m/s","208 m/s","294 m/s"],"answer":"B","explain":"碰后对轴的转动惯量 I = ML²/3 + mL² = 1.00×0.81/3 + 0.012×0.81 = 0.270 + 0.00972 = 0.2797 kg·m²。\n恰好到水平位置时各质元升高：杆质心升 L/2 = 0.450 m，子弹升 L = 0.900 m，需机械能 9.8×(1.00×0.450 + 0.012×0.900) = 4.516 J。\n由 ½Iω² = 4.516 J 得 ω = √(2×4.516/0.2797) = 5.68 rad/s，再由 m v L = Iω 得 v = 0.2797×5.682/(0.012×0.90) = 147 m/s。\n易错：104 m/s 是把升高只算成一半（取 1 − cosθ = 0.5）；208 m/s 是把 √2 乘反；294 m/s 误认为 v 与所需能量成正比。"},{"id":"c05q007","type":"calc","difficulty":5,"tags":["滑动摩擦","纯滚动条件","冲量矩","机械能损失"],"stem":"一个质量 m = 2.00 kg、半径 R = 0.100 m 的均匀圆盘，初始时质心以 v₀ = 6.00 m/s 沿水平面平动、自身不转动（ω₀ = 0）。盘与水平面间的动摩擦因数 μ = 0.350，静摩擦足够大。求（1）圆盘过渡到纯滚动后质心的速率；（2）从开始到纯滚动这段时间内损失的机械能；（3）这段滑动持续的时间。取 g = 9.8 m/s²。","answer":"v = 4.00 m/s，损失 12.0 J，t = 0.583 s","explain":"滑动期间摩擦力 f = μmg = 6.860 N 向后。平动：ma = −f，a = −3.430 m/s²；转动：fR = Iα，I = ½mR² = 0.0100 kg·m²，α = fR/I = 68.600 rad/s²。\n纯滚动条件 v = ωR：6.00 − 3.43t = 6.86t，得 t = 0.583 s，v = 6.00 − 3.43×0.583 = 4.00 m/s。\n更快的做法：摩擦力对地面接触点无矩，故对接触点的角动量守恒，m v₀R = (mR² + I)ω = 1.5mR²ω，直接得 v = v₀/1.5 = 4.00 m/s。\n初动能 36.0 J，末动能 ½mv² + ½Iω² = 16.0 + 8.0 = 24.0 J，损失 12.0 J（摩擦生热，等于 f 乘相对滑动路程）。"},{"id":"c05q008","type":"choice","difficulty":5,"tags":["滑动摩擦","纯滚动","机械能损失"],"stem":"一个质量 m = 1.20 kg 的均匀实心球，初始时质心以 v₀ = 5.00 m/s 平动、自身不转动，放在动摩擦因数 μ = 0.250 的水平面上，随后过渡为纯滚动。这一过程中损失的机械能为","options":["5.00 J","10.7 J","2.14 J","4.29 J"],"answer":"D","explain":"对地面接触点的角动量守恒：m v₀R = (mR² + I)ω，实心球 I = (2/5)mR²，故 v = v₀/(1 + 2/5) = 5.00/1.4 = 3.57 m/s。\n初动能 ½mv₀² = 15.0 J；末动能 ½mv² + ½·(2/5)mR²·(v/R)² = 0.7mv² = 10.71 J。\n损失 15.0 − 10.71 = 4.29 J。\n易错：5.00 J 是按圆盘（I = ½mR²）算的结果；10.7 J 是末动能；2.14 J 是漏了因子 2。"},{"id":"c05q009","type":"choice","difficulty":4,"tags":["纯滚动","角动量定理","自转与平动耦合"],"stem":"一个质量 m、半径 R = 0.200 m 的均匀薄圆环平放在粗糙水平面上，初始时质心静止、绕自身轴以 ω₀ = 12.0 rad/s 转动。摩擦使圆环最终变为纯滚动。最终质心的速率为","options":["1.20 m/s","2.40 m/s","0.800 m/s","0"],"answer":"A","explain":"对地面接触点的角动量守恒（摩擦力过接触点，对它无矩）：I_cω₀ = (mR² + I_c)ω，圆环 I_c = mR²，故 ω = ω₀/2 = 6.00 rad/s。\n纯滚动后 v = ωR = 6.00×0.200 = 1.20 m/s，也可直接写成 v = ω₀R/2。\n能量检查：初动能 ½I_cω₀²，末动能 ½mv² + ½I_cω² = ½mR²ω₀²，损失一半，由摩擦生热。\n易错：2.40 m/s 直接用 v = ω₀R（漏了转动惯量分担角动量）；0.800 m/s 套了圆盘的 v = ω₀R/3；0 是误认为摩擦力只消耗转动、不产生平动。"},{"id":"c05q010","type":"choice","difficulty":4,"tags":["纯滚动","机械能守恒","转动惯量"],"stem":"一个均匀实心球以 v₀ = 7.00 m/s 的质心速率沿倾角 30.0° 的粗糙斜面向上作纯滚动。它沿斜面上升的最大高度（竖直高度）为（g = 9.8 m/s²）","options":["2.50 m","3.50 m","3.75 m","5.00 m"],"answer":"B","explain":"纯滚动的总动能 = ½mv² + ½·(2/5)mR²·(v/R)² = (7/10)mv²，上升过程中静摩擦不做功，机械能守恒。\n(7/10)mv₀² = mgh → h = 0.7v₀²/g = 0.7×49.0/9.8 = 3.50 m（沿斜面路程为 h/sin30° = 7.00 m）。\n易错：2.50 m 忽略转动动能（只算 ½mv²）；3.75 m 按圆盘 I = ½mR² 得 0.75v²/g；5.00 m 按圆环 I = mR² 得 v²/g。"},{"id":"c05q011","type":"choice","difficulty":5,"tags":["台阶临界","角动量守恒","刚体碰撞"],"stem":"一个质量 m、半径 R = 0.200 m 的均匀圆盘在水平面上作纯滚动，前方有一级高 h = 0.120 m 的台阶。圆盘与台阶边缘碰撞时绕边缘转动而不弹起。要使它恰好能翻上台阶，碰撞前质心的速率至少为（g = 9.8 m/s²）","options":["1.53 m/s","3.76 m/s","2.09 m/s","2.95 m/s"],"answer":"C","explain":"碰撞瞬间对台阶边缘的角动量守恒：m v(R − h) + I_cω = I_eω′，I_c = ½mR²，ω = v/R，I_e = ½mR² + mR² = 1.5mR²。\n得 ω′ = v(1.5R − h)/(1.5R²) = v(0.300 − 0.120)/(1.5×0.0400) = 3.00v。\n恰好翻上台阶需 ½I_eω′² ≥ mgh：½×1.5m×0.0400×(3.00v)² = m×9.8×0.120，即 0.270v² = 1.176，v² = 4.36，v = 2.09 m/s。\n易错：1.53 m/s 是只把平动动能换成 mgh；3.76 m/s 漏掉碰前平动的角动量项 m v(R − h)（那会得 ω′ = v/(3R)）；2.95 m/s 是把能量方程里的 ½ 丢掉。"},{"id":"c05q012","type":"calc","difficulty":5,"tags":["台阶碰撞","角动量守恒","机械能损失"],"stem":"一个质量 m = 0.50 kg、半径 R = 0.150 m 的均匀实心球在水平面上以 v₀ = 3.00 m/s 作纯滚动，前方有一级高 h = 0.050 m 的台阶。球与边缘碰撞后绕边缘转动。求（1）碰后瞬间绕边缘转动的角速度；（2）碰撞中损失的机械能；（3）球能否翻上台阶。取 g = 9.8 m/s²。","answer":"ω′ = 15.2 rad/s，损失 1.32 J，能翻上台阶","explain":"碰前对边缘的角动量：L = m v₀(R − h) + I_cω₀ = 0.50×3.00×0.100 + 0.4×0.50×0.0225×(3.00/0.150) = 0.1500 + 0.0900 = 0.2400 kg·m²/s。\n碰后 I_e = I_c + mR² = 0.4mR² + mR² = 1.4mR² = 0.01575 kg·m²，故 ω′ = 0.2400/0.01575 = 15.2 rad/s。\n碰前动能 0.7mv₀² = 3.150 J，碰后 ½I_eω′² = 1.829 J，损失 1.32 J。\n碰后剩下的能量 1.829 J 大于翻上台阶所需的 mgh = 0.245 J，所以能翻上去。\n关键：碰撞中边缘给球一个过边缘的冲力，机械能不守恒，但对边缘的角动量守恒。"},{"id":"c05q013","type":"choice","difficulty":4,"tags":["角动量守恒","完全非弹性转动碰撞","动能损失"],"stem":"圆盘 A 绕竖直固定轴以 ω₀ = 12.0 rad/s 转动，对轴的转动惯量 I_A = 0.300 kg·m²。把原来静止的圆盘 B（I_B = 0.200 kg·m²）沿同一轴轻轻放下，两盘接触后一起转动。碰撞中损失的动能为","options":["8.64 J","21.6 J","12.96 J","4.32 J"],"answer":"A","explain":"对轴无外力矩，角动量守恒：I_Aω₀ = (I_A + I_B)ω，ω = 3.60/0.500 = 7.20 rad/s。\n初动能 ½×0.300×144 = 21.6 J，末动能 ½×0.500×51.84 = 12.96 J。\n损失 8.64 J，其一般式为 ½·(I_A I_B/(I_A + I_B))·ω₀²，是典型的完全非弹性转动碰撞。\n易错：21.6 J 是初动能；12.96 J 是末动能；4.32 J 是把损失算成一半。"},{"id":"c05q014","type":"calc","difficulty":5,"tags":["转动碰撞","角动量守恒","损失比例"],"stem":"圆盘 A 的质量 4.00 kg、半径 0.200 m，绕其中心轴以 ω₀ = 15.0 rad/s 转动；圆盘 B 的质量 2.00 kg、半径 0.100 m，原来静止。把 B 沿同一轴放下，两盘对心接触后一起转动。求（1）共同角速度；（2）碰撞损失的动能；（3）损失占初动能的比例，并写出用 I_A、I_B 表示的一般式。","answer":"ω = 13.3 rad/s，ΔE = 1.00 J，ΔE/E₀ = I_B/(I_A + I_B) = 11.1%","explain":"I_A = ½×4.00×0.200² = 0.0800 kg·m²，I_B = ½×2.00×0.100² = 0.0100 kg·m²。\n角动量守恒：0.0800×15.0 = 0.0900ω，ω = 13.3 rad/s。\nΔE = ½I_Aω₀² − ½(I_A + I_B)ω² = 9.000 − 8.000 = 1.00 J。\n一般式 ΔE = ½I_Aω₀²·I_B/(I_A + I_B)，故 ΔE/E₀ = I_B/(I_A + I_B) = 0.0100/0.0900 = 11.1%。\n注意：损失比例只由两盘转动惯量之比决定，与初角速度无关。"},{"id":"c05q015","type":"calc","difficulty":5,"tags":["滚动与滑动判别","动摩擦","分段讨论"],"stem":"一个质量 m = 0.80 kg、半径 R = 0.100 m 的薄壁圆筒（可视为圆环，I = mR²），从倾角 θ = 35.0° 的斜面上由静止释放。圆筒与斜面间的静摩擦因数 μ_s = 0.250，动摩擦因数 μ_k = 0.200。先判断圆筒是纯滚动还是边滑边滚，再求质心加速度和角加速度。取 g = 9.8 m/s²，sin35.0° = 0.574，cos35.0° = 0.819。","answer":"边滑边滚：a = 4.02 m/s²，α = 16.1 rad/s²","explain":"先假设纯滚动。由 ma = mg sinθ − f 与 fR = Iα = mR²·(a/R) 得 f = ma，联立得 a = ½g sinθ，所需静摩擦 f = ½mg sinθ = 2.25 N。\n最大静摩擦 f_max = μ_s mg cosθ = 0.250×0.80×9.8×0.819 = 1.61 N \u003c 2.25 N，假设不成立，圆筒边滑边滚，摩擦力取动摩擦 f = μ_k mg cosθ = 1.28 N。\n平动：a = g(sinθ − μ_k cosθ) = 9.8×(0.574 − 0.164) = 4.02 m/s²；转动：α = fR/I = μ_k g cosθ/R = 16.1 rad/s²。\n校核：αR = 1.61 m/s² \u003c a = 4.02 m/s²，确实在滑动（接触点相对斜面向上滑）。"},{"id":"c05q016","type":"choice","difficulty":4,"tags":["纯滚动","静摩擦方向","转动定律"],"stem":"一个质量 m = 2.00 kg 的均匀实心圆柱，从倾角 25.0° 的斜面上由静止开始作纯滚动下滑。斜面对圆柱的静摩擦力大小和方向为（g = 9.8 m/s²，sin25.0° = 0.423）","options":["8.28 N，沿斜面向上","1.38 N，沿斜面向下","2.76 N，沿斜面向下","2.76 N，沿斜面向上"],"answer":"D","explain":"纯滚动的圆柱 I = ½mR²，由 ma = mg sinθ − f 与 fR = Iα = ½mR²·(a/R) 得 f = ½ma，联立得 a = (2/3)g sinθ，f = (1/3)mg sinθ。\n代入 f = (1/3)×2.00×9.8×0.423 = 2.76 N。\n方向：质心加速度沿斜面向下，转动需要使 ω 增大（顺时针），只有沿斜面向上的摩擦力矩能做到，故 f 沿斜面向上。\n易错：8.28 N 是 mg sinθ（漏了 1/3）；1.38 N 是把 f 取成 ½ma 后方向判反；2.76 N 向下是符号错误。"},{"id":"c05q017","type":"choice","difficulty":5,"tags":["纯滚动","摩擦力方向","转动定律"],"stem":"一个质量 m = 1.50 kg 的均匀实心圆柱放在粗糙水平面上，一根轻绳绕在圆柱外侧，绳端在圆柱最高点处以水平力 F = 3.00 N 向右拉，圆柱作纯滚动。圆柱质心加速度和地面对它的静摩擦力为","options":["a = 2.67 m/s²，f = 1.00 N，与 F 同向","a = 2.00 m/s²，f = 0","a = 2.67 m/s²，f = 1.00 N，与 F 反向","a = 4.00 m/s²，f = 1.00 N，与 F 同向"],"answer":"A","explain":"设 f 向右。平动：F + f = ma；对质心的转动：FR − fR = Iα = ½mR²·(a/R) → F − f = ½ma。\n两式相加：2F = 1.5ma，a = 4F/(3m) = 12.0/4.5 = 2.67 m/s²；回代得 f = ma − F = 4.00 − 3.00 = 1.00 N，为正值，方向与 F 相同。\n物理意义：拉力作用点在最上方，它产生的力矩使圆柱顺转、接触点有向后滑的趋势，地面摩擦力向前帮着平动。\n易错：2.00 m/s² 且 f = 0 是把拉力当成作用于质心；f 反向是方向判错；4.00 m/s² 是漏掉摩擦力对平动的贡献。"},{"id":"c05q018","type":"calc","difficulty":5,"tags":["复摆","极值","平行轴定理"],"stem":"一根质量 m、长 L = 1.00 m 的均匀细杆，在距杆中心 d 处用光滑水平轴悬挂，在竖直平面内作微小摆动。求使摆动周期最小的 d 值和该最小周期（先给出符号结果，再代数值）。取 g = 9.8 m/s²。","answer":"d = L/√12 = 0.289 m，T_min = 2π√(L/(√3g)) = 1.53 s","explain":"复摆周期 T = 2π√(I/(mgd))，I = mL²/12 + md² = m(L²/12 + d²)。\nT² = 4π²(L²/12 + d²)/(gd)，令 u = L²/(12d) + d，由 du/dd = −L²/(12d²) + 1 = 0 得 d = L/√12 = 0.289 m（恰好等于杆的回转半径）。\n此时 u = 2d，T_min = 2π√(2d/g) = 2π√(L/(√3g)) = 2π√(0.577/9.8) = 1.53 s。\n说明：d = L/√12 处是周期极小值而非极大值；把轴放在质心（d → 0）周期趋于无穷。"},{"id":"c05q019","type":"choice","difficulty":4,"tags":["扭摆","转动惯量","周期"],"stem":"一个转动惯量 I₀ = 0.020 kg·m² 的圆盘用金属丝悬挂组成扭摆，测得振动周期 T₀ = 4.97 s。再把一个转动惯量 I′ = 0.010 kg·m² 的圆环同轴固定在该圆盘上，新的振动周期为","options":["4.97 s","7.45 s","6.08 s","3.51 s"],"answer":"C","explain":"扭摆周期 T = 2π√(I/κ)，与振幅无关。由 T₀ 定出 κ = 4π²I₀/T₀²，加上圆环后 I = 0.030 kg·m²。\nT/T₀ = √(I/I₀) = √1.5 = 1.2247，故 T = 4.97×1.2247 = 6.08 s。\n易错：4.97 s 是没加圆环；7.45 s 是把 T 当成与 I 成正比（线性外推）；3.51 s 是把附加的 0.010 kg·m² 当成总转动惯量。"},{"id":"c05q020","type":"choice","difficulty":5,"tags":["扭摆","转动惯量测量","周期比"],"stem":"用扭摆测圆环的转动惯量：先让转动惯量 I₀ = 0.0100 kg·m² 的空盘摆动，周期 T₀ = 1.00 s；把待测圆环同轴固定后，周期变为 T = 1.50 s。圆环的转动惯量为","options":["0.0225 kg·m²","0.00500 kg·m²","0.00625 kg·m²","0.0125 kg·m²"],"answer":"D","explain":"T = 2π√(I/κ) → I = κT²/(4π²)，同一根金属丝 κ 相同，故 I/I₀ = (T/T₀)²。\n总转动惯量 I₀ + I_环 = 0.0100×2.25 = 0.0225 kg·m²，所以 I_环 = 0.0225 − 0.0100 = 0.0125 kg·m²。\n易错：0.0225 kg·m² 是总转动惯量；0.00500 kg·m² 是按 T 线性（而非 T²）换算；0.00625 kg·m² 多除了一次因子 2。"},{"id":"c05q021","type":"choice","difficulty":4,"tags":["角动量守恒","转动动能","功与能"],"stem":"一个人站在可绕竖直光滑轴自由转动的转台上，双臂平举，系统对轴的转动惯量 I₁ = 6.00 kg·m²，角速度 ω₁ = 1.50 rad/s。人把双臂收到胸前，系统转动惯量变为 I₂ = 4.00 kg·m²。这一过程中系统转动动能的变化为","options":["增加 3.38 J","减少 3.38 J","增加 6.75 J","不变"],"answer":"A","explain":"无外力矩，角动量守恒：I₁ω₁ = I₂ω₂ → ω₂ = 9.00/4.00 = 2.25 rad/s。\n初动能 ½×6.00×1.50² = 6.75 J，末动能 ½×4.00×2.25² = 10.13 J。\n动能增加 3.38 J，来自人收臂时肌肉做的正功（内力矩做功，角动量守恒但动能可以变）。\n易错：3.38 J 当成减少（误以为守恒就是动能守恒）；6.75 J 是初动能；动能不变是常见误解。"},{"id":"c05q022","type":"calc","difficulty":5,"tags":["角动量守恒","转动动能","内力做功"],"stem":"一个人站在可绕竖直轴自由转动的转台上，转台对轴的转动惯量 I₀ = 3.00 kg·m²，人的转动惯量忽略，双手各持一个质量 2.00 kg 的哑铃，两哑铃距轴均为 0.600 m，系统以 ω₁ = 1.20 rad/s 转动。人把两臂收到胸前，哑铃距轴变为 0.200 m。求（1）收臂后的角速度；（2）转动动能的增量；（3）这部分能量从哪里来。","answer":"ω₂ = 1.69 rad/s，ΔE = +1.29 J，来自人收臂时内力做的功","explain":"哑铃按质点处理：I₁ = 3.00 + 2×2.00×0.600² = 4.44 kg·m²，I₂ = 3.00 + 2×2.00×0.200² = 3.16 kg·m²。\n角动量守恒：4.44×1.20 = 5.33 kg·m²/s，ω₂ = 5.33/3.16 = 1.69 rad/s。\nΔE = ½I₂ω₂² − ½I₁ω₁² = 4.492 − 3.197 = +1.29 J，一般式 W = ½L²(1/I₂ − 1/I₁)。\n能量来自人把哑铃往轴心拉时克服惯性离心趋势所做的正功；角动量守恒并不意味着动能守恒。"},{"id":"c05q023","type":"calc","difficulty":5,"tags":["变约束","脱离条件","机械能守恒"],"stem":"一根质量 m、长 L = 1.00 m 的均匀细杆，上端 A 靠在光滑竖直墙上，下端 B 放在光滑水平地面上，初始时杆竖直静止。受微扰后 A 端沿墙下滑、B 端沿地面右移，杆始终在竖直平面内。求 A 端脱离墙面时杆与地面的夹角，以及此时 B 端的速率。取 g = 9.8 m/s²。","answer":"θ = 41.8°（sinθ = 2/3），v_B = 2.09 m/s","explain":"设杆与地面夹角 θ。质心坐标 (Lcosθ/2, Lsinθ/2)，动能 = 质心平动 + 绕质心转动 = ½m(L/2)²θ̇² + ½(mL²/12)θ̇² = (1/6)mL²θ̇²。\n机械能守恒：(1/6)mL²θ̇² = mg(L/2)(1 − sinθ)（从 θ = 90° 处释放），得 θ̇² = 3g(1 − sinθ)/L，求导得 θ̈ = −3g cosθ/(2L)。\n墙面支持力 N = mẍ_cm，而 ẍ_cm = (L/2)(−sinθ·θ̈ − cosθ·θ̇²) = (3g/2)cosθ[(3/2)sinθ − 1]。\nN = 0 给出 sinθ = 2/3，θ = 41.8°；此时 θ̇ = √(3×9.8×(1/3)) = 3.130 rad/s，v_B = L sinθ·θ̇ = 0.667×3.130 = 2.09 m/s。\n关键：脱离条件是墙面支持力降为零；写出 N 的表达式后找它的零点，属于求临界值而非套公式。"},{"id":"c05q024","type":"choice","difficulty":4,"tags":["定轴转动","向心加速度","轴反力极值"],"stem":"一根质量 m = 0.80 kg、长 L 的均匀细杆，一端装在光滑水平轴上，从水平位置由静止释放，在竖直平面内摆动。杆转到竖直位置时，轴对杆的作用力大小为（g = 9.8 m/s²）","options":["11.8 N","7.84 N","27.4 N","19.6 N"],"answer":"D","explain":"机械能守恒：mg(L/2) = ½(mL²/3)ω² → ω² = 3g/L，质心向心加速度 (L/2)ω² = 1.5g。\n在竖直位置径向方程 N − mg = m(L/2)ω² = 1.5mg，故 N = 2.5mg = 2.5×0.80×9.8 = 19.6 N，方向向上。\n此处切向加速度为零，轴反力只有径向分量，且全过程中 sinθ 最大，所以这也是轴反力最大的位置。\n易错：11.8 N 只算向心项 1.5mg；7.84 N 是 mg；27.4 N 是错写成 3.5mg。"},{"id":"c05q025","type":"choice","difficulty":5,"tags":["冲量矩","打击中心","角动量定理"],"stem":"一根质量 m、长 L = 0.900 m 的均匀细杆，上端用光滑水平轴悬挂，自然下垂。在距轴 x 处对杆施加一个垂直于杆的水平冲量。若要求轴在冲击瞬间不受冲力，x 应为","options":["0.600 m","0.520 m","0.450 m","0.900 m"],"answer":"A","explain":"设冲量为 J，碰后质心速度 v = J/m，角速度 ω = Jx/I，I = mL²/3。\n轴不受冲力要求杆上与轴重合的点速度为零：v − ω(L/2) = 0，即 J/m = (Jx/I)(L/2)。\n解得 x = 2I/(mL) = 2L/3 = 0.600 m，这个位置叫打击中心。\n易错：0.520 m 是回转半径 L/√3；0.450 m 是质心位置 L/2；0.900 m 是杆端。\n物理意义：击打此处时轴的约束冲力为零，棒球棒、斧柄都按这个原则设计。"},{"id":"c05q026","type":"choice","difficulty":4,"tags":["纯滚动","转动惯量比较","运动学"],"stem":"一个薄圆环、一个实心圆盘、一个实心球，半径相同、质量相同，从同一斜面的同一高度由静止同时开始纯滚动下滑（斜面足够长）。关于它们到达底端的先后和所用时间之比，正确的是","options":["环最先到，t球:t盘:t环 = 1.00:0.97:0.84","球最先到，t球:t盘:t环 = 1.00:1.04:1.20","三者同时到达，t 之比为 1:1:1","球最先到，t球:t盘:t环 = 1.00:1.04:1.41"],"answer":"B","explain":"纯滚动 a = g sinθ/(1 + I/(mR²))：环 I/(mR²) = 1、盘 1/2、球 2/5，故 a环:a盘:a球 = 1/2 : 2/3 : 5/7 = 0.500 : 0.667 : 0.714。\n同一段位移 s，t = √(2s/a) ∝ 1/√a，故 t环:t盘:t球 = √2 : √1.5 : √1.4 = 1.414 : 1.225 : 1.183。\n归一化到球得 1.195 : 1.035 : 1.000，即转动惯量越小（质量越靠近质心）下滑越快，球最先到。\n易错：末项写成 1.41 是把环的 √2 原样搬来当比值；三者同时到达是忽略了转动惯量的差别。"},{"id":"c05q027","type":"calc","difficulty":4,"tags":["纯滚动","斜面","运动学与能量"],"stem":"一个薄圆环和一个实心球，质量与半径相同，从同一斜面（倾角 30.0°）上同一高度 h = 0.500 m（竖直高度）处由静止同时纯滚动下滑。求各自到达斜面底端时的质心速率和所用时间，并比较先后。取 g = 9.8 m/s²。","answer":"v环 = 2.21 m/s、t环 = 0.904 s；v球 = 2.65 m/s、t球 = 0.756 s，球先到","explain":"能量：mgh = ½mv² + ½Iω²，纯滚动 ω = v/R，得 v = √(2gh/(1 + I/(mR²)))。\n环 I = mR²：v = √(gh) = √4.90 = 2.21 m/s；球 I = (2/5)mR²：v = √(10gh/7) = √7.00 = 2.65 m/s。\n沿斜面路程 s = h/sin30° = 1.00 m，加速度 a = g sinθ/(1 + I/(mR²))：a环 = 2.45 m/s²，a球 = 3.50 m/s²。\n由 s = ½at² 得 t环 = √(2s/a环) = 0.904 s，t球 = √(2s/a球) = 0.756 s，球比环早 0.148 s 到底。"},{"id":"c05q028","type":"choice","difficulty":5,"tags":["转动惯量","挖孔","平行轴定理"],"stem":"一个质量 M = 2.40 kg、半径 R = 0.200 m 的均匀圆盘，从中挖去一个半径 R/2 的圆孔，孔心距盘心 R/2。剩余部分对过盘心且垂直于盘面的轴的转动惯量为","options":["0.0450 kg·m²","0.0360 kg·m²","0.0480 kg·m²","0.0390 kg·m²"],"answer":"D","explain":"整盘 I = ½MR² = 0.0480 kg·m²；挖去部分质量 M/4 = 0.60 kg。\n挖去部分对自身圆心轴 I′ = ½(M/4)(R/2)² = MR²/32 = 0.00300 kg·m²，再由平行轴定理加 (M/4)(R/2)² = MR²/16 = 0.00600 kg·m²。\n共挖去 0.00900 kg·m²，剩余 I = 0.0480 − 0.00900 = 0.0390 kg·m²，即 13MR²/32。\n易错：0.0450 漏了平行轴项；0.0360 直接用剩余质量套整盘公式；0.0480 是没有挖孔。"},{"id":"c05q029","type":"choice","difficulty":4,"tags":["转动惯量","平行轴定理","复合体"],"stem":"一根质量 0.500 kg、长 0.600 m 的均匀细杆，两端各固定一个质点，质量分别为 0.200 kg 和 0.300 kg。系统绕通过杆上距 0.200 kg 一端 0.150 m、且垂直于杆的轴转动，其转动惯量为","options":["0.0924 kg·m²","0.0262 kg·m²","0.0600 kg·m²","0.169 kg·m²"],"answer":"A","explain":"先求对过质心轴的转动惯量：杆 mL²/12 = 0.0150；两端质点各距质心 0.300 m：0.200×0.0900 + 0.300×0.0900 = 0.4500，合计 I_C = 0.0600 kg·m²。\n质心位置（以 0.200 kg 那端为原点）：x_C = (0.500×0.300 + 0.200×0 + 0.300×0.600)/1.00 = 0.330 m。\n轴在 x = 0.150 m，故 d = 0.180 m，由平行轴定理 I = 0.0600 + 1.00×0.180² = 0.0924 kg·m²。\n易错：0.0262 只算杆；0.0600 忘了平行轴项；0.169 把 d 取成 0.330 m。"},{"id":"c05q030","type":"choice","difficulty":5,"tags":["转动惯量","薄板","正交轴定理"],"stem":"一块质量 1.20 kg 的均匀矩形薄板，两边长分别为 0.600 m 和 0.400 m。它绕通过板中心、沿一条对角线方向的轴转动，转动惯量为","options":["0.0260 kg·m²","0.0222 kg·m²","0.0160 kg·m²","0.0360 kg·m²"],"answer":"B","explain":"取边长 a = 0.600 m 沿 x、b = 0.400 m 沿 y，则 I_x = mb²/12 = 0.0160，I_y = ma²/12 = 0.0360 kg·m²。\n薄板的正交轴定理 I_z = I_x + I_y = 0.0520；绕板面内与 x 成 φ 的轴：I = I_x cos²φ + I_y sin²φ。\n对角线方向 cos²φ = a²/(a² + b²) = 0.360/0.520 = 0.692，sin²φ = 0.308。\nI = 0.0160×0.692 + 0.0360×0.308 = 0.0222 kg·m²。\n易错：0.0260 是拿 I_z 的一半当答案；0.0160、0.0360 是取了边轴。"},{"id":"c05q031","type":"choice","difficulty":4,"tags":["转动惯量","正交轴定理","平行轴定理"],"stem":"一个质量 1.50 kg、半径 0.200 m 的均匀薄圆盘，绕一条与盘面共面、且与盘边缘相切的轴转动。它对该轴的转动惯量为","options":["0.0900 kg·m²","0.0150 kg·m²","0.0750 kg·m²","0.0600 kg·m²"],"answer":"C","explain":"先求绕直径的转动惯量：盘面内两条互相垂直的直径等价，由正交轴定理 I_z = 2I_d，而 I_z = ½mR²，故 I_d = ¼mR² = 0.0150 kg·m²。\n切线轴与直径轴平行、相距 R，用平行轴定理：I = ¼mR² + mR² = 1.25mR² = 1.25×1.50×0.0400 = 0.0750 kg·m²。\n易错：0.0900 把转动惯量取成 ½mR² 再加 mR²；0.0150 只用直径轴；0.0600 只用 mR²。"},{"id":"c05q032","type":"choice","difficulty":4,"tags":["转动惯量","正交轴定理","圆环"],"stem":"一个质量 0.500 kg、半径 0.300 m 的均匀细圆环，绕一条沿直径的轴转动。它对该轴的转动惯量为","options":["0.0450 kg·m²","0.0112 kg·m²","0.0900 kg·m²","0.0225 kg·m²"],"answer":"D","explain":"圆环绕中心垂直轴的转动惯量 I_z = mR² = 0.0450 kg·m²。\n两条互相垂直的直径轴等价且都在环平面内，由正交轴定理 I_z = I_x + I_y = 2I_d，故 I_d = ½mR² = 0.0225 kg·m²。\n注意与圆盘的区别：圆盘 I_d = ¼mR²，圆环的质量全在边缘，绕直径的值是圆盘的 2 倍。\n易错：0.0450 是中心垂直轴；0.0112 套了圆盘的 ¼mR²；0.0900 是 2mR²。"},{"id":"c05q033","type":"choice","difficulty":4,"tags":["转动惯量","平行轴定理","球壳"],"stem":"一个质量 1.20 kg、半径 0.150 m 的均匀薄球壳，绕一条与球面相切的直线轴转动。它对该轴的转动惯量为","options":["0.0450 kg·m²","0.0180 kg·m²","0.0270 kg·m²","0.0378 kg·m²"],"answer":"A","explain":"薄球壳绕直径的转动惯量 I_C = (2/3)mR² = 0.0180 kg·m²。\n切线轴与直径轴平行、相距 R，由平行轴定理 I = (2/3)mR² + mR² = (5/3)mR² = 1.667×1.20×0.0225 = 0.0450 kg·m²。\n易错：0.0180 只用直径轴；0.0270 是 mR²（把球壳当质点距轴 R）；0.0378 是按实心球 (2/5 + 1)mR² 算。"},{"id":"c05q034","type":"calc","difficulty":4,"tags":["转动定律","定滑轮","连接体"],"stem":"一条轻绳跨过质量 M = 2.00 kg、半径 R = 0.100 m 的均匀圆盘形定滑轮，绳与轮之间不滑动，两端分别悬挂质量 m₁ = 1.50 kg 和 m₂ = 0.500 kg 的物块，由静止释放。求物块的加速度和绳两端的张力。取 g = 9.8 m/s²。","answer":"a = 3.27 m/s²，T₁ = 9.80 N，T₂ = 6.53 N","explain":"滑轮有转动惯量，两侧张力不等。m₁g − T₁ = m₁a，T₂ − m₂g = m₂a，T₁R − T₂R = Iα = ½MR²·(a/R)，即 T₁ − T₂ = ½Ma。\n三式联立：a = (m₁ − m₂)g/(m₁ + m₂ + M/2) = 1.00×9.8/(1.50 + 0.50 + 1.00) = 3.27 m/s²。\nT₁ = m₁(g − a) = 1.50×6.53 = 9.80 N，T₂ = m₂(g + a) = 0.500×13.07 = 6.53 N，差值 3.27 N = ½Ma。\n易错：把两侧张力当作相等（无质量滑轮）会得 a = (m₁ − m₂)g/(m₁ + m₂) = 4.90 m/s²，与本题不符。"},{"id":"c05q035","type":"choice","difficulty":4,"tags":["定滑轮","转动定律","张力差"],"stem":"一条轻绳跨过质量 M = 1.60 kg、半径 R = 0.080 m 的均匀圆盘形定滑轮，绳与轮间不滑动，两端分别悬挂质量 2.00 kg 和 0.800 kg 的物块。滑轮两侧绳的张力之差为（g = 9.8 m/s²）","options":["11.8 N","5.23 N","2.61 N","1.31 N"],"answer":"C","explain":"a = (m₁ − m₂)g/(m₁ + m₂ + M/2) = 1.20×9.8/(2.00 + 0.800 + 0.800) = 11.76/3.60 = 3.27 m/s²。\n转动方程 (T₁ − T₂)R = ½MR²·(a/R)，故 T₁ − T₂ = ½Ma = 0.5×1.60×3.267 = 2.61 N。\n易错：11.8 N 是 (m₁ − m₂)g（把滑轮当无质量）；5.23 N 是漏了 ½；1.31 N 是多除了因子 2。"},{"id":"c05q036","type":"choice","difficulty":3,"tags":["转动动能","制动","圈数换算"],"stem":"一个转动惯量 I = 0.600 kg·m² 的飞轮以 ω₀ = 25.0 rad/s 转动，轴承对它施加大小恒为 4.00 N·m 的阻力矩。从开始制动到停止，飞轮转过的圈数为","options":["46.9 圈","3.73 圈","14.9 圈","7.46 圈"],"answer":"D","explain":"由动能定理：½Iω₀² = Mθ，θ = Iω₀²/(2M) = 0.600×625/(2×4.00) = 46.9 rad。\n换算成圈数：n = θ/(2π) = 46.9/6.283 = 7.46 圈。\n易错：46.9 圈 是没把弧度换成圈；3.73 圈 是漏了因子 2；14.9 圈 是把 θ 算大了 2 倍。"},{"id":"c05q037","type":"calc","difficulty":5,"tags":["溜溜球","转动定律","平动与转动联立"],"stem":"一个均匀圆盘形溜溜球，质量 m = 0.150 kg，外半径 R = 0.0500 m，绕绳的轴半径 r = 0.0100 m，转动惯量按 I = ½mR² 计算。绳的上端固定，溜溜球由静止下落且绳不打滑。求它的质心加速度和绳的张力。取 g = 9.8 m/s²。","answer":"a = 0.726 m/s²，T = 1.36 N","explain":"平动 mg − T = ma；转动 Tr = Iα；绳不打滑给出 a = αr，故 T = Ia/r²。\n消去 T：mg = ma + Ia/r² → a = g/(1 + I/(mr²))，而 I/(mr²) = ½R²/r² = ½×(0.0500/0.0100)² = 12.5。\n故 a = 9.8/13.5 = 0.726 m/s²，T = m(g − a) = 0.150×9.07 = 1.36 N。\n关键：R 与 r 之比进入分母，比值越大下落越慢；若误把 r 当成 R（视为纯滚动圆盘）会得 a = ½g/(1.5) 量级的结果，明显偏大。"},{"id":"c05q038","type":"choice","difficulty":3,"tags":["纯滚动","瞬时心","速度合成"],"stem":"一个半径 R = 0.300 m 的车轮在水平地面上作纯滚动，轮心前进速率为 1.80 m/s。此时车轮最前端（轮心正前方、与轮心等高的轮缘点）的速度大小为","options":["1.80 m/s","2.55 m/s","3.60 m/s","1.27 m/s"],"answer":"B","explain":"纯滚动的瞬时心在接触点，ω = v/R = 1.80/0.300 = 6.00 rad/s。\n最前端点到瞬心的距离为 √2R，故 v = ω√2R = √2v_cm = 2.55 m/s；方向由转动线速度（竖直向上）与平动速度（水平向前）合成，与水平成 45°。\n易错：1.80 m/s 是轮心速度；3.60 m/s 是最高点速度；1.27 m/s 误用了 v/√2。"},{"id":"c05q039","type":"choice","difficulty":3,"tags":["纯滚动","静摩擦方向","转动定律"],"stem":"一个质量 3.00 kg 的均匀圆盘静止在粗糙水平面上，在盘心沿水平方向施加 F = 9.00 N 的恒力，圆盘作纯滚动。地面对圆盘的静摩擦力为","options":["3.00 N，与 F 同向","0","3.00 N，与 F 反向","4.50 N，与 F 反向"],"answer":"C","explain":"设 f 与 F 同向。平动 F + f = ma；转动 −fR = Iα = ½mR²·(a/R)，即 f = −½ma。\n联立得 F = 1.5ma，a = 2F/(3m) = 6.00 m/s²，f = −½×3.00×2.00 = −3.00 N，负号表示与 F 反向。\n物理意义：F 作用在质心不产生力矩，要使圆盘转起来只能靠摩擦力矩，故摩擦力必须向后。\n易错：同向是符号判错；0 是误以为纯滚动不需要摩擦；4.50 N 是把 f 取成 F/2。"},{"id":"c05q040","type":"choice","difficulty":3,"tags":["力矩平衡","刚体平衡","角度判断"],"stem":"一根重 G = 20.0 N、长 0.800 m 的均匀细杆水平放置，一端通过光滑铰链固定，另一端用一根轻绳拉住，绳与杆成 30.0° 角斜向上。绳的张力为","options":["10.0 N","11.5 N","40.0 N","20.0 N"],"answer":"D","explain":"对铰链取矩：重力矩 G(L/2) 使杆向下转，绳的力矩 T sin30.0°·L 使杆向上转。\n平衡：T×0.500×0.800 = 20.0×0.400，T = 8.00/0.400 = 20.0 N。\n易错：10.0 N 漏了 sin30.0°（把绳当竖直）；11.5 N 误用 cos30.0°；40.0 N 把力臂取成 L/2 又只用了 sin 的一半。"},{"id":"c05q041","type":"choice","difficulty":3,"tags":["力矩平衡","刚体平衡","极值判断"],"stem":"一根重 G = 200 N 的均匀细杆，下端通过光滑铰链固定，杆与水平方向成 30.0° 角。要在杆的上端施加一个水平方向的力使杆保持平衡，该力的大小为","options":["173 N","100 N","86.6 N","200 N"],"answer":"A","explain":"对铰链取矩：重力的力臂为 (L/2)cos30.0°，水平力的力臂为 L sin30.0°。\n平衡：F·L sin30.0° = G·(L/2)cos30.0° → F = G cos30.0°/(2 sin30.0°) = 200×0.866/(2×0.500) = 173 N。\n易错：100 N 是 G/2（忽略角度）；86.6 N 是多除了一次 2；200 N 是认为 F = G。\n判断要点：杆越接近竖直，维持平衡所需的水平力越小；杆水平时水平力的力臂为零，无法平衡。"},{"id":"c05q042","type":"choice","difficulty":3,"tags":["转动定律","摩擦力矩","定轴转动"],"stem":"一个质量 6.00 kg、半径 0.250 m 的均匀圆盘绕通过盘心且垂直盘面的固定轴转动。在盘边缘沿切线方向施加 15.0 N 的力，同时轴承有大小恒为 1.20 N·m 的摩擦力矩。圆盘的角加速度为","options":["20.0 rad/s²","13.6 rad/s²","26.4 rad/s²","6.80 rad/s²"],"answer":"B","explain":"I = ½mR² = 0.5×6.00×0.0625 = 0.1875 kg·m²；动力矩 M = FR = 15.0×0.250 = 3.75 N·m。\n净力矩 3.75 − 1.20 = 2.55 N·m，α = 2.55/0.1875 = 13.6 rad/s²。\n易错：20.0 rad/s² 忽略摩擦力矩；26.4 rad/s² 把摩擦力矩方向判反（相加）；6.80 rad/s² 把 I 取成 mR²。"},{"id":"c05q043","type":"choice","difficulty":4,"tags":["机械能守恒","复合刚体","转动惯量"],"stem":"一根质量 1.00 kg、长 0.700 m 的均匀细杆，一端装在光滑水平轴上，另一端固定一个质量 0.500 kg 的小球（可视为质点）。杆从水平位置由静止释放，转到竖直位置时杆的角速度为（g = 9.8 m/s²）","options":["9.17 rad/s","4.10 rad/s","5.80 rad/s","5.02 rad/s"],"answer":"C","explain":"I = mL²/3 + m球L² = 1.00×0.490/3 + 0.500×0.490 = 0.1633 + 0.2450 = 0.4083 kg·m²。\n重力做功：杆质心降 L/2，球降 L，W = 9.8×(1.00×0.350 + 0.500×0.700) = 3.43 + 3.43 = 6.86 J。\n½Iω² = 6.86 → ω = √(2×6.86/0.4083) = 5.80 rad/s。\n易错：9.17 rad/s 漏了球的转动惯量；4.10 rad/s 漏了球的重力势能；5.02 rad/s 把球放在杆的中点。"},{"id":"c05q044","type":"choice","difficulty":4,"tags":["转动动能","功率","飞轮储能"],"stem":"一个转动惯量 I = 12.0 kg·m² 的飞轮，从静止开始在 20.0 s 内均匀加速到 300 r/min。这段时间内电机对飞轮的平均功率为","options":["592 W","148 W","5920 W","296 W"],"answer":"D","explain":"ω = 2πn/60 = 2π×300/60 = 31.416 rad/s。\n末动能 ½Iω² = 0.5×12.0×986.96 = 5922 J，平均功率 P = 5922/20.0 = 296 W。\n易错：592 W 漏了 ½；148 W 多除了 2；5920 W 是把总能量当成功率。"},{"id":"c05q045","type":"calc","difficulty":5,"tags":["竖直圆轨道","临界条件","刚体平面运动"],"stem":"一个半径 R = 0.350 m 的均匀实心球，从静止开始沿粗糙轨道纯滚动，进入半径为 R 的竖直圆形轨道内侧。要使球始终不脱离轨道，它开始下滑的高度（相对轨道最低点）至少为多少？先给出符号结果，再代数值。取 g = 9.8 m/s²。","answer":"h_min = 2.7R = 0.945 m","explain":"在轨道最高点，径向方程 mg + N = mv²/R，不脱离要求 N ≥ 0，即 v² ≥ gR。\n能量：mgh = mg(2R) + ½mv² + ½Iω² = 2mgR + 0.7mv²（实心球 I = (2/5)mR²，纯滚动）。\n取临界 v² = gR 得 h_min = 2R + 0.7R = 2.7R = 2.7×0.350 = 0.945 m。\n对比：质点只需 h = 2.5R；球携带转动动能，因此要求更高的释放高度。\n注意：最高点处静摩擦沿切向，不影响径向的临界条件；但轨道必须足够粗糙以保证纯滚动。"},{"id":"c05q046","type":"choice","difficulty":4,"tags":["纯滚动条件","静摩擦","临界"],"stem":"一个均匀实心圆柱放在倾角 35.0° 的斜面上，要使它由静止开始作纯滚动下滑，圆柱与斜面间的静摩擦因数至少为（tan35.0° = 0.700）","options":["0.700","0.233","0.350","0.467"],"answer":"B","explain":"纯滚动要求 f = (1/3)mg sinθ（由 ma = mg sinθ − f 与 fR = ½mR²·a/R 联立），而 f ≤ μ_s mg cosθ。\n故 μ_s ≥ (1/3)tanθ = 0.333×0.700 = 0.233。\n易错：0.700 直接用 tanθ（相当于把圆柱当滑块）；0.350 用了 ½tanθ（系数记混）；0.467 用了 (2/3)tanθ。"},{"id":"c05q047","type":"choice","difficulty":5,"tags":["纯滚动","简谐振动","等效质量"],"stem":"一个质量 0.600 kg 的均匀圆盘在水平面上作纯滚动，盘心通过一根水平弹簧与固定墙相连，弹簧劲度系数 k = 40.0 N/m。圆盘在平衡位置附近作微小振动，其周期为","options":["0.770 s","0.942 s","0.666 s","0.333 s"],"answer":"C","explain":"纯滚动时 v = ωR，总动能 ½mv² + ½(½mR²)(v/R)² = ¾mv²，等效质量 3m/2。\n弹簧势能 ½kx²，故 ω_n = √(k/(3m/2)) = √(4k/(3m)) = √(160.0/1.80) = 9.43 rad/s。\nT = 2π/ω_n = 0.666 s，符号式为 T = 2π√(3m/(4k))。\n易错：0.770 s 忽略转动动能（只取质量 m）；0.942 s 把等效质量写成 3m/2 时系数取错；0.333 s 是漏了 2π 与 √ 的组合因子。"},{"id":"c05q048","type":"choice","difficulty":5,"tags":["角动量守恒","相对转动","转台"],"stem":"一个人站在可绕竖直轴自由转动的圆盘形转台上。人对竖直轴的转动惯量 I₁ = 2.00 kg·m²，转台 I₂ = 3.00 kg·m²，初始时系统静止。人沿转台边缘相对转台走完整整一圈后，转台（相对地面）转过的角度为","options":["144°，与人行走方向相同","216°，与人行走方向相反","360°，与人行走方向相反","144°，与人行走方向相反"],"answer":"D","explain":"无外力矩，系统对轴的角动量恒为零：I₂θ̇₂ + I₁(θ̇₂ + φ̇) = 0，其中 φ 是人相对转台的转角。\n得 θ̇₂ = −I₁φ̇/(I₁ + I₂)，对一整圈 φ = 2π 积分：θ₂ = −2.00×2π/5.00 = −2.513 rad = −144°。\n负号表示转台转向与人行走方向相反；人相对地面则转过 360° − 144° = 216°。\n易错：216° 是把人相对地面的转角误当成转台转角；同向是符号错误；360° 是忽略了转台自己也会转。"},{"id":"c05q049","type":"calc","difficulty":5,"tags":["面摩擦","微元法","变力矩制动"],"stem":"一个质量 m、半径 R = 0.150 m 的均匀圆盘平放在粗糙水平桌面上，绕通过盘心的竖直轴以 ω₀ = 20.0 rad/s 转动。盘与桌面间的动摩擦因数 μ = 0.200，压力均匀分布。求圆盘从开始到停止所经历的时间和转过的角度（要求先写出面摩擦力矩的表达式）。取 g = 9.8 m/s²。","answer":"t = 1.15 s，θ = 11.5 rad（约 1.83 圈），面摩擦力矩 M = (2/3)μmgR","explain":"取半径 r、宽 dr 的圆环，其正压力 dN = mg·2πr dr/(πR²)，摩擦力矩 dM = μdN·r = 2μmg r²dr/R²。\n积分得 M = (2μmg/R²)∫₀ᴿr²dr = (2/3)μmgR，比例系数 2/3 来自面积元的权重。\n转动定律：α = M/I = (2/3)μmgR/(½mR²) = 4μg/(3R) = 4×0.200×9.8/(3×0.150) = 17.4 rad/s²。\n故 t = ω₀/α = 3Rω₀/(4μg) = 1.15 s，θ = ω₀t/2 = 11.5 rad（约 1.83 圈）。\n关键：面摩擦力矩与 ω 无关，属于恒定力矩；若误用点摩擦 M = μmgR，时间会偏大 1.5 倍。"},{"id":"c05q050","type":"choice","difficulty":4,"tags":["转动动能","能量转化","飞轮储能"],"stem":"一个转动惯量 I = 5.00 kg·m² 的飞轮以 ω = 60.0 rad/s 转动，通过摩擦制动把这部分动能全部用来把一个质量 20.0 kg 的重物匀速提升。重物能被提升的最大高度为（g = 9.8 m/s²）","options":["91.8 m","45.9 m","23.0 m","0.765 m"],"answer":"B","explain":"飞轮动能 ½Iω² = 0.5×5.00×3600 = 9000 J。\n全部转化为重力势能：mgh = 9000 → h = 9000/(20.0×9.8) = 45.9 m。\n易错：91.8 m 漏了 ½；23.0 m 多除了一次 2；0.765 m 用 ½Iω（少一个 ω）算能量。"}]},{"chapter":6,"chapterName":"简谐振动","questions":[{"type":"choice","difficulty":3,"tags":["相位与时间","多解分支判断"],"stem":"一质点作简谐振动，运动方程为 x = 4.80cos(6.00t − π/3)（SI 单位）。从 t = 0 开始计时，质点第一次到达 x = −2.40 cm 且向 x 轴负方向运动的时刻为","options":["0.873 s","0.349 s","0.524 s","1.05 s"],"answer":"C","explain":"解析：由 x = A cos φ 得 cosφ = −1/2，相位有两支 φ = 2π/3 与 φ = 4π/3。向 x 轴负方向运动要求 sinφ > 0，故取 φ = 2π/3。\n由 6.00t − π/3 = 2π/3 得 t = π/6.00 = 0.524 s。\n易错点：0.873 s 取了 φ = 4π/3，那时速度为正；1.05 s 是直接把周期当答案；0.349 s 把 φ = π/3（对应 x = +A/2）当成了解。","id":"c06q001"},{"type":"choice","difficulty":3,"tags":["相位法","运动学时间"],"stem":"一质点作简谐振动，周期 T = 0.720 s，振幅 A = 6.00 cm。质点从 x = +A/2 处向平衡位置运动，第一次到达 x = 0 所需的时间为","options":["0.180 s","0.0300 s","0.0600 s","0.120 s"],"answer":"C","explain":"解析：从 x = +A/2 向平衡位置运动时相位为 φ = π/3，到达平衡位置时相位为 φ = π/2，相位变化 Δφ = π/6。\nΔt = (Δφ/2π)T = T/12 = 0.720/12 = 0.0600 s。\n易错点：0.120 s 把 Δφ 当成 π/3（T/6）；0.180 s 用 T/4；0.0300 s 用 T/24。振动不是匀速运动，必须用相位差换算时间。","id":"c06q002"},{"type":"choice","difficulty":3,"tags":["弹簧振子","速度-位移关系"],"stem":"一水平弹簧振子的劲度系数 k = 150 N/m，振子质量 m = 0.600 kg，振幅 A = 4.00 cm。当振子经过 x = 2.00 cm 处时，它的速度大小为","options":["0.548 m/s","0.274 m/s","0.316 m/s","0.632 m/s"],"answer":"A","explain":"解析：角频率 ω = √(k/m) = √(150/0.600) = 15.8 rad/s。\n由 v = ω√(A² − x²) 得 v = 15.8×√(0.0400² − 0.0200²) = 15.8×0.03464 = 0.548 m/s。\n易错点：0.632 m/s 用 v_max = ωA（把该点当平衡位置）；0.274 m/s 漏掉开方后取半；0.316 m/s 直接用 ωx，把位移当振幅。","id":"c06q003"},{"type":"choice","difficulty":3,"tags":["弹簧串联","等效劲度系数"],"stem":"两个轻弹簧的劲度系数分别为 k₁ = 240 N/m 和 k₂ = 360 N/m，将它们串联后竖直悬挂质量 m = 0.500 kg 的物体。系统作简谐振动的周期为","options":["0.370 s","0.234 s","0.287 s","0.181 s"],"answer":"A","explain":"解析：串联满足 1/k = 1/k₁ + 1/k₂，故 k = 240×360/(240 + 360) = 144 N/m。\nT = 2π√(m/k) = 2π√(0.500/144) = 0.370 s。\n易错点：0.181 s 把弹簧当并联（k = 600 N/m）；0.287 s 和 0.234 s 分别只用了 k₁、k₂ 中的一个。串联时等效劲度系数比任一个都小。","id":"c06q004"},{"type":"calc","difficulty":3,"tags":["简谐振动方程","运动学量","相位"],"stem":"一质点作简谐振动，运动方程为 x = 0.0600cos(10.0t + π/6)（SI 单位）。求：(1) 振幅、周期和初相；(2) t = 0.200 s 时的位移、速度和加速度；(3) 从 t = 0 起第一次通过平衡位置的时刻。","answer":"(1) A = 0.0600 m，T = 0.628 s，φ₀ = π/6；(2) x = −0.0489 m，v = −0.348 m/s，a = 4.89 m/s²；(3) t = 0.105 s","explain":"解析：(1) 与 x = A cos(ωt + φ₀) 对比得 A = 0.0600 m，ω = 10.0 rad/s，T = 2π/ω = 0.628 s，φ₀ = π/6。\n(2) 相位 ωt + φ₀ = 2.00 + 0.524 = 2.52 rad；x = 0.0600cos2.52 = −0.0489 m；v = −Aω sin2.52 = −0.348 m/s；a = −ω²x = 4.89 m/s²。\n(3) 第一次通过平衡位置时相位为 π/2：10.0t + π/6 = π/2，解得 t = 0.105 s。\n易错点：求 v、a 时必须先算该时刻的相位，不能把 t = 0 的相位直接代入；a 与 x 反号正是简谐振动的判据。","id":"c06q005"},{"type":"calc","difficulty":3,"tags":["振动能量","能量分配","速度-位移关系"],"stem":"一弹簧振子的质量 m = 0.350 kg，劲度系数 k = 126 N/m，振幅 A = 0.0800 m。求：(1) 系统的总机械能；(2) 最大速率；(3) 动能与势能相等时的位移大小；(4) 位移 x = 0.0400 m 时的速率。","answer":"(1) 0.403 J；(2) 1.52 m/s；(3) 0.0566 m；(4) 1.31 m/s","explain":"解析：(1) ω = √(k/m) = √(126/0.350) = 19.0 rad/s，E = ½kA² = ½×126×0.0800² = 0.403 J。\n(2) v_max = ωA = 19.0×0.0800 = 1.52 m/s。\n(3) 动能等于势能时 ½kx² = ½E，即 x = A/√2 = 0.0566 m。\n(4) v = ω√(A² − x²) = 19.0×√(0.0800² − 0.0400²) = 1.31 m/s。\n易错点：第 (3) 问不是 x = A/2；第 (4) 问不能把 x 直接当振幅代入 v_max。","id":"c06q006"},{"type":"choice","difficulty":4,"tags":["同方向合成","旋转矢量"],"stem":"两个同方向、同频率的简谐振动分别为 x₁ = 3.00cos(20.0t) cm 和 x₂ = 4.00cos(20.0t + π/3) cm。它们的合振动振幅为","options":["5.00 cm","7.00 cm","1.00 cm","6.08 cm"],"answer":"D","explain":"解析：同方向同频率合成用旋转矢量：A = √(A₁² + A₂² + 2A₁A₂cosΔφ)，其中 Δφ = π/3。\nA = √(3.00² + 4.00² + 2×3.00×4.00×0.500) = √37.0 = 6.08 cm。\n易错点：5.00 cm 按两矢量垂直（Δφ = π/2）算；7.00 cm 直接把振幅相加；1.00 cm 直接把振幅相减。相位差不能忽略。","id":"c06q007"},{"type":"choice","difficulty":4,"tags":["拍频","振幅调制"],"stem":"两列同方向、振幅相同而频率相差很小的简谐振动叠加：x₁ = 0.0200cos(2π×512t) m，x₂ = 0.0200cos(2π×516t) m。合振动相邻两次振幅极大之间的时间间隔和最大合振幅分别为","options":["0.125 s，0.0400 m","4.00 s，0.0400 m","0.250 s，0.0400 m","0.250 s，0.0200 m"],"answer":"C","explain":"解析：拍频等于两频率之差 f_拍 = 516 − 512 = 4.00 Hz，相邻两次振幅极大间隔为 1/f_拍 = 0.250 s。\n两振动同相时合振幅最大，为 2A = 0.0400 m。\n易错点：0.125 s 把拍频对应的间隔取半；0.0200 m 只取了一个分振动的振幅；4.00 s 把拍频的数值直接当成时间。","id":"c06q008"},{"type":"choice","difficulty":4,"tags":["阻尼振动","品质因数","对数减缩"],"stem":"某欠阻尼振动的运动方程为 x = A₀e^(−βt)cos(ωt + φ)，其中 β = 0.800 s⁻¹，振动周期 T = 0.500 s。该振动的品质因数 Q 与相邻两个同向最大位移之比分别约为","options":["7.85，1.49","7.85，1.22","15.7，1.49","3.93，1.49"],"answer":"A","explain":"解析：ω = 2π/T = 2π/0.500 = 12.6 rad/s，Q = ω/(2β) = 12.6/1.60 = 7.85。\n相邻两个同向最大位移相隔一个周期，比值为 e^(βT) = e^(0.800×0.500) = e^0.400 = 1.49。\n易错点：1.22 用 e^(βT/2)，把相邻最大位移的时间间隔取成半个周期；3.93 把 Q 的分母写成 4β；15.7 漏掉因子 2。","id":"c06q009"},{"type":"choice","difficulty":4,"tags":["受迫振动","共振角频率","阻尼影响"],"stem":"一受迫振动系统的固有角频率 ω₀ = 20.0 rad/s，阻尼系数 β = 4.00 s⁻¹。其稳定受迫振动的振幅达到最大时，驱动力的角频率为","options":["20.0 rad/s","19.2 rad/s","16.0 rad/s","18.3 rad/s"],"answer":"B","explain":"解析：受迫振动振幅 A(ω) = (F₀/m)/√((ω₀² − ω²)² + 4β²ω²)，对 ω 求极值得 ω_r = √(ω₀² − 2β²)。\nω_r = √(20.0² − 2×4.00²) = √(400 − 32.0) = 19.2 rad/s。\n易错点：20.0 rad/s 忽略阻尼，把共振频率当成固有频率；18.3 rad/s 用了 4β²；16.0 rad/s 直接用 ω₀ − β。有阻尼时共振频率总低于固有频率。","id":"c06q010"},{"type":"choice","difficulty":4,"tags":["同方向合成","初相","旋转矢量"],"stem":"两个同方向、同频率的简谐振动分别为 x₁ = 0.0300cos(8.00t) m 和 x₂ = 0.0400cos(8.00t + π/2) m。它们的合振动可写成","options":["x = 0.0700cos(8.00t + 0.927) m","x = 0.0500cos(8.00t − 0.927) m","x = 0.0100cos(8.00t + 0.927) m","x = 0.0500cos(8.00t + 0.927) m"],"answer":"D","explain":"解析：x = 0.0300cos8.00t − 0.0400sin8.00t，合振幅 A = √(0.0300² + 0.0400²) = 0.0500 m。\n由 A cosφ = 0.0300、−A sinφ = −0.0400 得 cosφ = 0.600、sinφ = 0.800，故 φ = 0.927 rad（53.1°）。\n合振动为 x = 0.0500cos(8.00t + 0.927) m。\n易错点：把初相符号取反会得 0.0500cos(8.00t − 0.927)；直接把振幅相加会得 0.0700；直接把振幅相减会得 0.0100。第二项的 π/2 相位差使它变成正弦项。","id":"c06q011"},{"type":"choice","difficulty":4,"tags":["垂直方向合成","李萨如图形","相位差"],"stem":"一质点同时参与两个相互垂直、频率相同的简谐振动：x = A cos ωt，y = B cos(ωt + π/2)，其中 A ≠ B。该质点的运动轨迹是","options":["直线 y = (B/A)x","圆，半径为 A","椭圆，长短轴分别沿 x、y 轴，质点沿逆时针方向运动","椭圆，长短轴分别沿 x、y 轴，质点沿顺时针方向运动"],"answer":"D","explain":"解析：y = B cos(ωt + π/2) = −B sinωt，消去 t 得 x²/A² + y²/B² = 1，是长短轴沿坐标轴的正椭圆。\nt = 0 时质点在 (A, 0)，速度分量为 vₓ = 0、v_y = −Bω \u003c 0，故沿顺时针方向运动。\n易错点：把 y 的初相符号看反会得到逆时针方向；判成直线需要两振动同相或反相；判成圆则忽略了 A ≠ B 这一条件，只有 A = B 时轨迹才是圆。","id":"c06q012"},{"type":"choice","difficulty":4,"tags":["竖直弹簧振子","平衡位置移动","周期变化"],"stem":"一轻弹簧劲度系数 k = 200 N/m，下端挂质量 m₁ = 0.500 kg 的物体并静止。再把 m₂ = 0.300 kg 的物体轻放在 m₁ 上（两者一起运动、不分开）。新平衡位置比原平衡位置低多少？系统的新周期为","options":["0.0147 m，0.314 s","0.0147 m，0.397 s","0.0147 m，0.500 s","0.0392 m，0.397 s"],"answer":"B","explain":"解析：新增质量使平衡位置下移 Δl = m₂g/k = 0.300×9.8/200 = 0.0147 m。\n振动周期只由总质量和劲度系数决定：T = 2π√((m₁ + m₂)/k) = 2π√(0.800/200) = 0.397 s。\n易错点：0.314 s 仍用 m₁ 算周期；0.0392 m 把 (m₁ + m₂)g/k 当成平衡位置移动量，忘了原来已有 m₁ 的伸长；0.500 s 是随手凑的数。","id":"c06q013"},{"type":"choice","difficulty":4,"tags":["复摆","平行轴定理","转动惯量"],"stem":"一根质量均匀的细杆长 L = 1.20 m，悬点在杆上距一端 0.300 m 处，杆在竖直平面内绕光滑水平轴作小角度摆动。取 g = 9.8 m/s²，其振动周期为","options":["1.27 s","1.90 s","1.68 s","1.19 s"],"answer":"C","explain":"解析：悬点到杆中心的距离 d = 0.600 − 0.300 = 0.300 m。由平行轴定理 I/m = L²/12 + d² = 1.20²/12 + 0.300² = 0.120 + 0.090 = 0.210 m²。\nT = 2π√(I/(mgd)) = 2π√(0.210/(9.8×0.300)) = 2π√0.0714 = 1.68 s。\n易错点：1.27 s 只用 I = mL²/12，漏掉平行轴项；1.19 s 把 d 取成 0.600 m；1.90 s 把它当摆长为 0.900 m 的单摆。","id":"c06q014"},{"type":"choice","difficulty":4,"tags":["浮力振子","等效劲度系数","回复力"],"stem":"一横截面积 S = 2.50×10⁻³ m²、质量 m = 0.600 kg 的圆柱体竖直浮在水面上，水的密度 ρ = 1.00×10³ kg/m³。将它向下按 1.50 cm 后释放，它作简谐振动。其周期和最大回复力分别为","options":["0.983 s，0.0882 N","0.983 s，0.245 N","0.695 s，0.368 N","0.983 s，0.368 N"],"answer":"D","explain":"解析：偏离平衡位置 x 时，多排开水的体积为 Sx，附加浮力 ρgSx 指回平衡位置，故等效劲度系数 k = ρgS = 1.00×10³×9.8×2.50×10⁻³ = 24.5 N/m。\nT = 2π√(m/k) = 2π√(0.600/24.5) = 0.983 s；最大回复力 F = kA = 24.5×0.0150 = 0.368 N。\n易错点：0.245 N 把 k 当成了力；0.695 s 用错质量或漏掉 2π；0.0882 N 用 mgA 代替 kA。","id":"c06q015"},{"type":"choice","difficulty":4,"tags":["双体振子","约化质量","周期"],"stem":"两个质量分别为 m₁ = 0.300 kg 和 m₂ = 0.200 kg 的物体用劲度系数 k = 48.0 N/m 的轻弹簧连接，放在光滑水平面上，沿弹簧方向作微小振动。系统的振动周期为","options":["0.405 s","0.314 s","0.497 s","0.641 s"],"answer":"B","explain":"解析：两体问题在质心系中化为单体振动，用约化质量 μ = m₁m₂/(m₁ + m₂) = 0.300×0.200/0.500 = 0.120 kg。\nT = 2π√(μ/k) = 2π√(0.120/48.0) = 0.314 s。\n易错点：0.405 s 只用 m₂；0.497 s 只用 m₁；0.641 s 用总质量 m₁ + m₂。两体振动中弹簧的伸长由相对位移决定，必须用约化质量。","id":"c06q016"},{"type":"choice","difficulty":4,"tags":["弹簧分割","弹簧并联","等效劲度系数"],"stem":"一弹簧振子由劲度系数为 k 的轻弹簧和质量 m 的振子组成，振动周期为 T₀。把该弹簧剪成两段等长的弹簧
