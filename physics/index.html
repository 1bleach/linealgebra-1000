容段温度降到 121 K，W = 0，Q₂ = ΔU = nC_VΔT = 1×(5/2)×8.31×(121 − 241) = −2.50×10³ J。总 Q = 1.39×10³ − 2.50×10³ = −1.11×10³ J（放热）。错选 B 只算了等温段；错选 C 只算等容段并漏了符号。"},{"id":"c09q017","type":"choice","difficulty":4,"tags":["节流过程","焦耳—汤姆孙效应","实际气体"],"stem":"关于节流过程（焦耳—汤姆孙效应），下列说法正确的是","options":["理想气体节流后温度降低；实际气体节流后一定降温","理想气体和实际气体节流后温度都不变","实际气体节流后一定升温，与温度无关","理想气体节流后温度不变；实际气体在转变温度以下节流后温度降低"],"answer":"D","explain":"节流过程绝热且不对外做功，但焓保持不变（h₁ = h₂）。\n理想气体的焓只是温度的函数，故节流后温度不变。\n实际气体的焓还随压强变化，焦耳—汤姆孙系数 μ = (∂T/∂p)_h 可正可负；在转变温度以下 μ > 0，节流降压后温度降低，以上则升温。\n易错点：把「绝热」误当成「温度不变」；认为实际气体必然降温。"},{"id":"c09q018","type":"choice","difficulty":4,"tags":["绝热线","等温线","斜率比较"],"stem":"在同一点 (p，V) 处，理想气体的绝热线与等温线斜率之比的绝对值为（γ = 1.40）","options":["0.714","1.40","1.00","1.67"],"answer":"B","explain":"等温线 p = nRT/V，斜率 (∂p/∂V)_T = −p/V。\n绝热线 pV^γ = C，微分得 (∂p/∂V)_S = −γp/V。\n两者绝对值之比为 γ = 1.40，故绝热线更陡。\n易错点：0.714 是倒数；1.00 混淆两条曲线；1.67 误用单原子气体的 γ。"},{"id":"c09q019","type":"choice","difficulty":4,"tags":["摩尔热容","自由度","温度变化"],"stem":"1.00 mol 单原子理想气体和 1.00 mol 双原子理想气体在等容条件下吸收相同的热量，它们的温度升高量之比 ΔT_单/ΔT_双 为","options":["1.67","0.600","1.40","2.00"],"answer":"A","explain":"等容吸热 Q = nC_VΔT，故 ΔT = Q/(nC_V)，与 C_V 成反比。\nΔT_单/ΔT_双 = C_V(双)/C_V(单) = (5R/2)/(3R/2) = 5/3 = 1.67。\n易错点：0.600 是倒数；1.40 是 C_p/C_V；2.00 误按自由度 5 与 3 的差。"},{"id":"c09q020","type":"choice","difficulty":4,"tags":["p-V 图面积","净功","循环方向"],"stem":"1.00 mol 理想气体经三角形循环 A→B→C→A：A(1.00×10⁵ Pa，1.00 L)、B(1.00×10⁵ Pa，4.00 L)、C(2.00×10⁵ Pa，1.00 L)，A→B 等压、B→C 为直线、C→A 等容。气体在一个循环中对外做的净功为","options":["+150 J","−150 J","+450 J","−450 J"],"answer":"B","explain":"A→B：W₁ = pΔV = 1.00×10⁵×3.00×10⁻³ = 300 J。\nB→C：直线下面积 W₂ = −½(1.00+2.00)×10⁵×3.00×10⁻³ = −450 J。\nC→A：等容，W₃ = 0。\n净功 W = 300−450 = −150 J，即外界对气体做功 150 J；该循环在 p-V 图上沿逆时针方向。\n易错点：+150 J 方向判反；+450 J 只算 B→C 的大小；−450 J 漏掉 A→B。"},{"id":"c09q021","type":"choice","difficulty":4,"tags":["内能状态函数","热力学第一定律","等容对比"],"stem":"2.00 mol 双原子理想气体温度由 300 K 升到 400 K，此过程中气体对外做功 600 J。气体吸收的热量为（已知该过程内能变化只由温度决定）","options":["4.76 kJ","4.16 kJ","3.56 kJ","5.36 kJ"],"answer":"A","explain":"理想气体内能是状态函数，ΔU = nC_VΔT = 2.00×20.8×100 = 4.16×10³ J。\n由热力学第一定律 Q = ΔU+W = 4.16×10³+600 = 4.76×10³ J。\n若改为等容加热，W = 0，则 Q = 4.16 kJ。\n易错点：4.16 kJ 漏掉功；3.56 kJ 把功当成负值；5.36 kJ 用 C_p 算内能。"},{"id":"c09q022","type":"choice","difficulty":5,"tags":["绝热不可逆","恒外压","热力学第一定律"],"stem":"1.00 mol 单原子理想气体初态 300 K、2.00×10⁵ Pa，在绝热条件下对抗恒定外压 1.00×10⁵ Pa 膨胀到力学平衡。终态温度和气体对外做的功分别为","options":["255 K，748 J","240 K，935 J","219 K，1.01×10³ J","240 K，748 J"],"answer":"D","explain":"绝热不可逆：Q = 0，ΔU = −p_ext(V₂−V₁)。\nnC_V(T₂−T₁) = −p_ext(nRT₂/p_ext−nRT₁/p₁)，即 C_V(T₂−T₁) = −RT₂+RT₁(p_ext/p₁)。\n代入 C_V = 1.5R、p_ext/p₁ = 0.5：1.5(T₂−300) = −T₂+150，解得 T₂ = 240 K。\nW = nC_V(T₁−T₂) = 12.5×60 = 748 J。易错点：255 K 用 pV^γ 可逆公式；935 J 用 C_p；219 K 把外压取成 2.00×10⁵ Pa。"},{"id":"c09q023","type":"choice","difficulty":5,"tags":["斯特林循环","循环效率","等温与等容"],"stem":"1.00 mol 单原子理想气体经历如下循环：A(300 K，2.00 L) 等容升温到 400 K 的 D；D 在 400 K 等温膨胀到 4.00 L 的 C；C 等容降温到 300 K 的 B；B 在 300 K 等温压缩回 A。该循环的效率约为","options":["25.0%","20.0%","16.2%","12.5%"],"answer":"C","explain":"吸热段：A→D 等容 Q₁ = C_V×100 = 1.25×10³ J；D→C 等温 Q₂ = RT₂ln2 = 8.31×400×0.693 = 2.30×10³ J；Q_吸 = 3.55×10³ J。\n放热段：C→B 等容放热 1.25 kJ；B→A 等温压缩放热 1.73 kJ。\n净功 W = 2.30×10³−1.73×10³ = 576 J，η = 576/3551 = 16.2%。\n同温限卡诺效率为 1−300/400 = 25.0%，本循环无回热，故低于卡诺。"},{"id":"c09q024","type":"choice","difficulty":5,"tags":["直线过程","最高温度","极值判断"],"stem":"1.00 mol 单原子理想气体沿 p-V 图中的直线由 A(4.00×10⁵ Pa，1.00 L) 变到 B(1.00×10⁵ Pa，4.00 L)。该直线上气体能达到的最高温度，以及从 A 到该最高温度点吸收的热量分别为","options":["75.2 K，488 J","96.3 K，825 J","75.2 K，338 J","75.2 K，825 J"],"answer":"D","explain":"直线方程 p = 5.00×10⁵−1.00×10⁸V（SI 单位）。\nT = pV/R，令 d(pV)/dV = 5.00×10⁵−2.00×10⁸V = 0，得 V = 2.50×10⁻³ m³，p = 2.50×10⁵ Pa，T_max = 625/8.31 = 75.2 K。\nA 到该点：W = ½(4.00+2.50)×10⁵×1.50×10⁻³ = 488 J；ΔU = 1.5×(625−400) = 338 J；Q = 825 J。\n易错点：96.3 K 取 B 点温度；488 J、338 J 分别只算功和内能。"},{"id":"c09q025","type":"choice","difficulty":5,"tags":["奥托循环","绝热过程","循环效率"],"stem":"1.00 mol 双原子理想气体按奥托循环工作：绝热压缩比 V₁/V₂ = 4.00，压缩前温度 300 K，等容吸热后最高温度 900 K。该循环的效率约为","options":["42.6%","57.4%","36.0%","50.0%"],"answer":"A","explain":"绝热压缩：T₂ = T₁×4^0.400 = 300×1.741 = 522 K。\n绝热膨胀终点：T₄ = T₃/4^0.400 = 900/1.741 = 517 K。\nQ_吸 = C_V(900−522) = 7.85×10³ J，Q_放 = C_V(517−300) = 4.51×10³ J。\nη = 1−Q_放/Q_吸 = 1−4.51/7.85 = 42.6%，也等于 1−4^(−0.400)。\n易错点：57.4% 是 4^(−0.4)；36.0% 用单原子指数；50.0% 是温度比。"},{"id":"c09q026","type":"choice","difficulty":5,"tags":["声速","热容比","自由度"],"stem":"某理想气体在 300 K 时的声速为 330 m/s，摩尔质量为 28.0 g/mol，R = 8.31 J/(mol·K)。由 v = √(γRT/M) 可得该气体的 γ 和定容摩尔热容 C_V 分别为","options":["1.40，20.8 J/(mol·K)","1.22，45.6 J/(mol·K)","1.67，12.5 J/(mol·K)","1.22，37.3 J/(mol·K)"],"answer":"D","explain":"由 v² = γRT/M 得 γ = Mv²/(RT) = 0.0280×330²/(8.31×300) = 1.22。\nC_V = R/(γ−1) = 8.31/0.223 = 37.3 J/(mol·K)，C_p = C_V+R = 45.6 J/(mol·K)。\nγ 接近 1.22，说明气体分子除平动外还有振动或转动自由度被激发。\n易错点：1.40/20.8 是双原子刚性分子的默认值；45.6 是 C_p；12.5 是单原子气体。"},{"id":"c09q027","type":"choice","difficulty":5,"tags":["弹簧活塞","功的积分","热力学第一定律"],"stem":"横截面积 2.00×10⁻³ m² 的竖直气缸内，1.00×10⁻³ m³ 单原子理想气体与劲度系数 1.00×10⁴ N/m 的弹簧相连，外界大气压 1.00×10⁵ Pa。缓慢加热使活塞上升 0.0500 m，气体吸收的热量为","options":["428 J","23 J","450 J","473 J"],"answer":"C","explain":"气体压强 p = p₀+kx/A，从 1.00×10⁵ Pa 增到 1.00×10⁵+1.00×10⁴×0.0500/2.00×10⁻³ = 3.50×10⁵ Pa。\nW = ∫p dV = p₀ΔV+½kx² = 1.00×10⁵×1.00×10⁻⁴+½×1.00×10⁴×0.0500² = 10.0+12.5 = 22.5 J。\n初态 n = p₀V₁/(RT₁) = 0.0401 mol；终态 V₂ = 1.10×10⁻³ m³，T₂ = p₂V₂/(nR) = 1155 K。\nΔU = nC_VΔT = 0.0401×12.5×855 = 428 J，Q = ΔU+W = 450 J。\n易错点：428 J 漏掉功；23 J 只算功；473 J 把弹簧势能重复计算。"},{"id":"c09q028","type":"choice","difficulty":5,"tags":["三过程循环","绝热压缩","循环效率"],"stem":"0.120 mol 单原子理想气体经循环 A→B→C→A：A 态 300 K、1.00 L；A→B 等压膨胀到 3.00 L；B→C 等容降温；C→A 绝热压缩回到 A。该循环的效率约为","options":["48.1%","24.4%","16.0%","33.3%"],"answer":"B","explain":"p_A = nRT_A/V_A = 0.120×8.31×300/1.00×10⁻³ = 2.99×10⁵ Pa。\nA→B 等压：T_B = 900 K，Q_吸 = nC_pΔT = 0.120×20.8×600 = 1.50×10³ J，W_AB = pΔV = 598 J。\nB→C 等容降温到 T_C = T_A(V_A/V_B)^(2/3) = 300×(1/3)^0.667 = 144 K，Q_BC = −1.13×10³ J。\nC→A 绝热：W_CA = nC_V(T_C−T_A) = −233 J。净功 = 598−233 = 365 J，η = 365/1496 = 24.4%。\n易错点：16.0% 漏掉绝热段功；33.3% 用 1−1/3；48.1% 把放热段也算进吸热。"},{"id":"c09q029","type":"choice","difficulty":5,"tags":["卡诺循环","绝热膨胀","循环净功"],"stem":"1.00 mol 单原子理想气体完成卡诺循环，高温热源 600 K、低温热源 300 K，等温膨胀由 2.00 L 到 4.00 L。绝热膨胀结束时的体积 V₃ 和循环净功分别为","options":["8.00 L，1.73 kJ","11.3 L，1.73 kJ","11.3 L，3.46 kJ","5.66 L，1.73 kJ"],"answer":"B","explain":"等温膨胀吸热 Q₁ = W₁ = RT₁ln(V₂/V₁) = 8.31×600×0.693 = 3.46×10³ J。\n卡诺效率 η = 1−T₂/T₁ = 0.500，净功 W = 1.73×10³ J。\n绝热膨胀满足 T V^(γ−1) = 常量：V₃ = V₂(T₁/T₂)^(1/(γ−1)) = 4.00×2^1.5 = 11.3 L。\n易错点：8.00 L 漏掉绝热膨胀；3.46 kJ 把吸热当净功；5.66 L 是 V₄。"},{"id":"c09q030","type":"choice","difficulty":5,"tags":["自由膨胀","绝热压缩","多段过程"],"stem":"1.00 mol 双原子理想气体初态 300 K、10.0 L，先绝热自由膨胀到 20.0 L，再绝热可逆压缩回 10.0 L。最终温度和全过程外界对气体做的总功分别为","options":["396 K，1.99 kJ","300 K，0","396 K，1.73 kJ","522 K，4.61 kJ"],"answer":"A","explain":"自由膨胀：Q = 0、W = 0，故 T 不变，仍为 300 K，体积 20.0 L。\n绝热可逆压缩回 10.0 L：T₂ = 300×2^0.400 = 396 K。\n压缩过程外界做功 W_on = nC_VΔT = 20.8×95.9 = 1.99×10³ J；自由膨胀不做功。\n全过程 Q = 0（两段都绝热）。易错点：300 K/0 漏掉压缩；1.73 kJ 用等温功；522 K 把指数写成 0.5。"},{"id":"c09q031","type":"choice","difficulty":5,"tags":["路径比较","功的积分","内能状态函数"],"stem":"1.00 mol 单原子理想气体从 A(4.00×10⁵ Pa，1.00 L) 到 B(1.00×10⁵ Pa，4.00 L)，可沿直线 A→B 或沿等温线 A→B 进行。两过程吸热之差 Q_直线−Q_等温 为","options":["−195 J","0","750 J","195 J"],"answer":"D","explain":"A、B 两态 pV 均为 400 J，温度相同，故两过程 ΔU 相同，Q 之差等于 W 之差。\n直线：W_直 = ½(4.00+1.00)×10⁵×3.00×10⁻³ = 750 J。\n等温：W_等温 = nRT ln(V₂/V₁) = 400×ln4 = 555 J。\nQ_直−Q_等温 = 750−555 = 195 J。易错点：−195 J 符号反；0 误认为内能相同则热量相同；750 J 只算直线功。"},{"id":"c09q032","type":"choice","difficulty":5,"tags":["绝热放气","绝热膨胀","实际过程"],"stem":"绝热刚性容器内装双原子理想气体，初温 300 K、压强 5.00 atm。打开阀门缓慢放气，当容器内压强降为 1.00 atm 时关闭阀门。容器内剩余气体的温度约为","options":["300 K","237 K","189 K","158 K"],"answer":"C","explain":"放气过程中，留在容器内的气体推动逸出气体做功，经历近似绝热可逆膨胀。\n由 T p^((1−γ)/γ) = 常量，得 T₂ = T₁(p₂/p₁)^((γ−1)/γ) = 300×(1/5)^0.286。\n0.2^0.286 = 0.631，故 T₂ = 189 K。\n易错点：300 K 误认为绝热容器内温度不变；237 K 用等温膨胀；158 K 把指数取成 0.4。"},{"id":"c09q033","type":"choice","difficulty":5,"tags":["混合过程循环","等压","等温"],"stem":"1.00 mol 单原子理想气体经循环 A→C→B→A：A(300 K，1.00 L) 等压升温到 C(600 K，2.00 L)；C 等容降温到 B(300 K，2.00 L)；B 等温压缩回 A。该循环的效率约为","options":["12.3%","18.4%","9.00%","25.0%"],"answer":"A","explain":"A→C 等压：p = RT_A/V_A = 2.49×10⁶ Pa，Q_吸 = C_pΔT = 20.8×300 = 6.23×10³ J，W₁ = pΔV = 2.49×10³ J。\nC→B 等容：Q = C_V(300−600) = −3.74×10³ J，W = 0。\nB→A 等温压缩：W₃ = −RT ln2 = −1.73×10³ J，Q₃ = −1.73×10³ J。\n净功 = 2.49×10³−1.73×10³ = 765 J，η = 765/6233 = 12.3%。\n易错点：18.4% 漏掉等温压缩功；9.00% 把等压段功当成净功；25.0% 是卡诺效率。"},{"id":"c09q034","type":"choice","difficulty":5,"tags":["气体识别","摩尔质量","等压吸热"],"stem":"某理想气体在 1.00×10⁵ Pa、300 K 时的密度为 1.30 kg/m³。由此可判断该气体最可能是双原子气体，其定容摩尔热容 C_V 及等压升温 100 K 时每千克气体吸收的热量分别为","options":["12.5 J/(mol·K)，53.8 kJ/kg","20.8 J/(mol·K)，89.8 kJ/kg","20.8 J/(mol·K)，64.2 kJ/kg","29.1 J/(mol·K)，89.8 kJ/kg"],"answer":"B","explain":"由 pM = ρRT 得 M = ρRT/p = 1.30×8.31×300/1.00×10⁵ = 3.24×10⁻² kg/mol，接近 O₂。\n双原子刚性分子 C_V = 5R/2 = 20.8 J/(mol·K)，C_p = 7R/2 = 29.1 J/(mol·K)。\n每千克吸热 q = (C_p/M)ΔT = (29.1/0.0324)×100 = 8.98×10⁴ J/kg = 89.8 kJ/kg。\n易错点：12.5 是单原子；64.2 用 C_V 算；29.1 把 C_p 当成 C_V。"},{"id":"c09q035","type":"choice","difficulty":5,"tags":["矩形循环","循环效率","等容与等压"],"stem":"1.00 mol 双原子理想气体经矩形循环 A→B→C→D→A：A(1.20×10⁵ Pa，2.00 L)、B(3.20×10⁵ Pa，2.00 L)、C(3.20×10⁵ Pa，5.00 L)、D(1.20×10⁵ Pa，5.00 L)。该循环的效率约为","options":["17.2%","10.4%","13.8%","25.0%"],"answer":"C","explain":"净功等于矩形面积：W = (3.20−1.20)×10⁵×(5.00−2.00)×10⁻³ = 600 J。\n吸热段：A→B 等容 Q₁ = (5/2)(p_B−p_A)V_A = 2.5×2.00×10⁵×2.00×10⁻³ = 1.00×10³ J。\nB→C 等压 Q₂ = (7/2)p_BΔV = 3.5×3.20×10⁵×3.00×10⁻³ = 3.36×10³ J。\nQ_吸 = 4.36×10³ J，η = 600/4360 = 13.8%。\n易错点：17.2% 把放热段也算入吸热；10.4% 用 C_V 算等压段；25.0% 用卡诺公式。"},{"id":"c09q036","type":"calc","difficulty":4,"tags":["绝热压缩","泊松方程","外界做功"],"stem":"0.406 mol 双原子理想气体（γ = 1.40）在 300 K、1.00×10⁵ Pa 下被绝热可逆压缩到原体积的 1/5。求：(1) 终态温度；(2) 终态压强；(3) 外界对气体做的功。","answer":"(1) 571 K；(2) 9.52×10⁵ Pa；(3) 2.29 kJ","explain":"绝热过程 T V^(γ−1) = 常量，γ−1 = 0.400：T₂ = 300×5^0.400 = 571 K。\n由 pV^γ = 常量：p₂ = p₁(V₁/V₂)^γ = 1.00×10⁵×5^1.40 = 9.52×10⁵ Pa。\n外界做功 W_on = nC_V(T₂−T₁) = 0.406×20.8×271 = 2.29×10³ J。\n也可用 W_on = (p₂V₂−p₁V₁)/(γ−1) 验证，结果一致。\n易错点：把绝热指数写成 γ−1；用等温式 p₂ = 5p₁ 得 5.00×10⁵ Pa。"},{"id":"c09q037","type":"calc","difficulty":4,"tags":["混合气体","内能守恒","平衡压强"],"stem":"绝热刚性容器体积 2.00 L，中间用隔板分成体积相等的两半，一侧装 0.0200 mol 氦气（300 K），另一侧装 0.0300 mol 氮气（400 K）。抽去隔板后两气体混合达到平衡。求：(1) 平衡温度；(2) 平衡压强。","answer":"(1) 371 K；(2) 7.72×10⁴ Pa","explain":"绝热刚性容器不与外界交换热和功，混合前后总内能守恒：n₁C_V1(T−T₁)+n₂C_V2(T−T₂) = 0。\n氦为单原子气体 C_V1 = 12.5 J/(mol·K)，氮为双原子气体 C_V2 = 20.8 J/(mol·K)。\n0.0200×12.5(T−300)+0.0300×20.8(T−400) = 0，解得 T = 371 K。\n总物质的量 0.0500 mol，p = nRT/V = 0.0500×8.31×371/2.00×10⁻³ = 7.72×10⁴ Pa。\n易错点：按物质的量直接平均得 360 K；用 C_p 计算得 365 K。"},{"id":"c09q038","type":"calc","difficulty":4,"tags":["等温与绝热","过程比较","做功"],"stem":"1.00 mol 双原子理想气体从 300 K、10.0 L 出发，分别经 (a) 等温可逆膨胀、(b) 绝热可逆膨胀到 20.0 L。求两过程的做功与终温，并比较哪个过程做功多、哪个终温高。","answer":"(a) W = 1.73×10³ J，T = 300 K；(b) W = 1.51×10³ J，T = 227 K；等温做功多 219 J，终温高 73 K","explain":"(a) 等温：ΔU = 0，W_a = nRT ln(V₂/V₁) = 1.00×8.31×300×ln2 = 1.73×10³ J，T_a = 300 K。\n(b) 绝热：T_b = T₁(V₁/V₂)^(γ−1) = 300×2^(−0.400) = 227 K。\nW_b = nC_V(T₁−T_b) = 20.8×(300−227) = 1.51×10³ J。\n比较：W_a−W_b = 219 J > 0，等温过程做功多；T_a−T_b = 73 K，等温终温高。\n原因：绝热膨胀温度下降，压强随体积下降更快，后续段做功能力减弱。"},{"id":"c09q039","type":"calc","difficulty":4,"tags":["温度依赖热容","积分法","平均热容"],"stem":"1.00 mol 某理想气体的定容摩尔热容随温度变化：C_V = 20.0+0.0100T（SI 单位）。在等容条件下由 300 K 加热到 400 K。求：(1) 吸收的热量；(2) 该温度区间的平均定容摩尔热容；(3) 若误用 300 K 时的 C_V 计算，结果偏差多少。","answer":"(1) 2.35 kJ；(2) 23.5 J/(mol·K)；(3) 少算 50.0 J，约 2.1%","explain":"(1) Q = ∫nC_V dT = ∫(20.0+0.0100T)dT（300 K→400 K）= 20.0×100+½×0.0100×(400²−300²) = 2000+350 = 2.35×10³ J。\n(2) 平均热容 C̄_V = Q/(nΔT) = 2350/100 = 23.5 J/(mol·K)，正好等于 300 K 与 400 K 两端热容的算术平均。\n(3) C_V(300) = 23.0 J/(mol·K)，误用得 Q' = 23.0×100 = 2.30×10³ J，少算 50.0 J，相对偏差 50/2350 = 2.1%。\n说明：热容随温度线性变化时，积分值等于两端值的平均乘以温差。"},{"id":"c09q040","type":"calc","difficulty":5,"tags":["多方过程","摩尔热容","功的积分"],"stem":"1.00 mol 双原子理想气体经历多方过程 pV^1.20 = C，温度由 300 K 升到 344.6 K（体积减半）。求：(1) 多方摩尔热容 C_n；(2) 气体对外做的功；(3) 内能变化；(4) 气体吸放热。","answer":"(1) −20.8 J/(mol·K)；(2) −1.85 kJ（外界对气体做功 1.85 kJ）；(3) +927 J；(4) 放热 927 J","explain":"(1) C_n = C_V+R/(1−n) = 20.8+8.31/(1−1.20) = 20.8−41.6 = −20.8 J/(mol·K)。\n(2) W = ∫p dV = (p₂V₂−p₁V₁)/(1−n) = nR(T₂−T₁)/(1−n) = 8.31×44.6/(−0.20) = −1.85×10³ J。\n(3) ΔU = nC_VΔT = 20.8×44.6 = 927 J。\n(4) Q = ΔU+W = 927−1853 = −926 J，即放热 927 J。\n物理图像：C_n \u003c 0，温度升高时反而放热；外界压缩功大于内能增量。\n易错点：把 W 的符号写反；用 C_p 算 ΔU。"},{"id":"c09q041","type":"calc","difficulty":5,"tags":["三状态循环","各段热量","循环效率"],"stem":"1.00 mol 单原子理想气体经循环 A→B→C→A：A(2.20×10⁵ Pa，1.20 L)、B(2.20×10⁵ Pa，3.40 L)、C(1.10×10⁵ Pa，3.40 L)。A→B 等压，B→C 等容，C→A 为直线。求各段的 Q、W 及循环效率。","answer":"A→B：Q = 1.21 kJ，W = 484 J；B→C：Q = −561 J，W = 0；C→A：Q = −528 J，W = −363 J；η = 10.0%","explain":"A→B 等压：W_AB = pΔV = 2.20×10⁵×2.20×10⁻³ = 484 J；ΔU_AB = (3/2)(p_BV_B−p_AV_A) = 1.5×(748−264) = 726 J；Q_AB = 1.21×10³ J。\nB→C 等容：W_BC = 0；ΔU_BC = 1.5×(374−748) = −561 J；Q_BC = −561 J。\nC→A 直线：W_CA = −½(2.20+1.10)×10⁵×2.20×10⁻³ = −363 J；ΔU_CA = 1.5×(264−374) = −165 J；Q_CA = −528 J。\n净功 W = 484−363 = 121 J，吸热 Q_吸 = 1210 J，η = 121/1210 = 10.0%。\n校验：Q_总 = 1210−561−528 = 121 J = W_净。"},{"id":"c09q042","type":"calc","difficulty":5,"tags":["摩擦活塞","不可逆过程","热力学第一定律"],"stem":"竖直气缸内装 0.0481 mol 双原子理想气体，初态 300 K、1.00 L、1.20×10⁵ Pa。活塞质量 20.0 kg、面积 1.00×10⁻² m²，与缸壁间摩擦力 40.0 N，大气压 1.00×10⁵ Pa，取 g = 9.80 m/s²。缓慢加热使活塞上升 0.200 m。求：(1) 活塞移动时缸内气体压强；(2) 终态温度；(3) 气体吸收的热量。","answer":"(1) 1.24×10⁵ Pa；(2) 928 K；(3) 874 J","explain":"(1) 活塞缓慢上升时受力平衡：pA = p₀A+mg+f，故 p = 1.00×10⁵+196/0.0100+40.0/0.0100 = 1.236×10⁵ Pa。\n(2) 终态体积 V₂ = 1.00×10⁻³+0.0100×0.200 = 3.00×10⁻³ m³；T₂ = pV₂/(nR) = 1.236×10⁵×3.00×10⁻³/(0.0481×8.31) = 928 K。\n(3) ΔU = nC_VΔT = 0.0481×20.8×628 = 627 J；W = pΔV = 1.236×10⁵×2.00×10⁻³ = 247 J；Q = ΔU+W = 874 J。\n说明：摩擦使过程不可逆，但缓慢移动时压强仍由力平衡确定；摩擦功 40.0×0.200 = 8.00 J 包含在 W 中。"},{"id":"c09q043","type":"calc","difficulty":5,"tags":["焓","定压热容","符号推导"],"stem":"从焓的定义 H = U+pV 出发：(1) 证明理想气体的定压摩尔热容与定容摩尔热容满足 C_p−C_V = R；(2) 若某气体的定容摩尔热容为 C_V = a+bT（a、b 为常数），写出 1 mol 该气体在等压过程中温度由 T₁ 升到 T₂ 时吸收的热量 Q 的表达式，并求平均定压摩尔热容。","answer":"(1) C_p−C_V = R；(2) Q = (a+R)(T₂−T₁)+½b(T₂²−T₁²)，平均 C_p = a+R+½b(T₁+T₂)","explain":"(1) 等压过程 dQ = dU+p dV；对 1 mol 理想气体 pV = RT，故 p dV = R dT（p 不变）。\n于是 dQ = (C_V+R)dT，按定义 C_p = dQ/dT = C_V+R，即 C_p−C_V = R。\n也可由 H = U+pV 得 dH = dU+p dV+V dp，等压时 dH = dQ，故 C_p = (∂H/∂T)_p。\n(2) C_p = C_V+R = a+R+bT，Q = ∫C_p dT = (a+R)(T₂−T₁)+½b(T₂²−T₁²)。\n平均定压热容 C̄_p = Q/(T₂−T₁) = a+R+½b(T₁+T₂)。\n易错点：把 C_p−C_V 写成 nR；积分时漏掉 ½。"},{"id":"c09q044","type":"calc","difficulty":5,"tags":["绝热过程","泊松方程","符号推导"],"stem":"1.00 mol 单原子理想气体从 400 K、10.0 L 绝热可逆压缩到 2.00 L。求：(1) 由 pV^γ = C 导出 T₂ 与 V₂ 的关系；(2) 终态温度与压强；(3) 外界对气体做的功。","answer":"(1) T₂ = T₁(V₁/V₂)^(γ−1)；(2) 1.17×10³ K，4.86×10⁶ Pa；(3) 9.60 kJ","explain":"(1) 由 pV^γ = C 和 pV = nRT 消去 p，得 T V^(γ−1) = 常量，故 T₂ = T₁(V₁/V₂)^(γ−1)。\n(2) 单原子 γ = 5/3，γ−1 = 2/3：T₂ = 400×5^(2/3) = 400×2.924 = 1.17×10³ K。\np₁ = nRT₁/V₁ = 8.31×400/0.0100 = 3.32×10⁵ Pa，p₂ = p₁×5^(5/3) = 4.86×10⁶ Pa。\n(3) W_on = nC_V(T₂−T₁) = 12.5×770 = 9.60×10³ J。\n也可用 W_on = (p₂V₂−p₁V₁)/(γ−1) 校验。易错点：指数用 1/3 得 684 K；用 γ 而不是 γ−1。"},{"id":"c09q045","type":"calc","difficulty":5,"tags":["多方过程","摩尔热容","符号讨论"],"stem":"对 1 mol 理想气体经历的 pV^n = C（n ≠ 1）多方过程：(1) 证明摩尔热容 C_n = C_V+R/(1−n)；(2) 写出过程功 W 的表达式；(3) 讨论 n = 0、n = 1、n = γ 三种情形分别对应什么过程，C_n 各为多少。","answer":"(1) C_n = C_V+R/(1−n)；(2) W = R(T₁−T₂)/(n−1)；(3) n=0 等压 C_n=C_p；n=1 等温 C_n 发散；n=γ 绝热 C_n=0","explain":"(1) 对 pV^n = C 两边微分：V^n dp+n pV^(n−1)dV = 0，得 dp/p = −n dV/V。\n由 pV = RT 得 dp/p+dV/V = dT/T，联立得 dV/V = −dT/[T(1−n)]，即 p dV = R dT/(1−n)。\n故 C_n = dQ/dT = C_V+p dV/dT = C_V+R/(1−n)。\n(2) W = ∫p dV = (p₁V₁−p₂V₂)/(n−1) = R(T₁−T₂)/(n−1)（n ≠ 1）。\n(3) n=0：p = 常量，等压，C_n = C_V+R = C_p；n=1：pV = 常量，等温，C_n → ∞（有限吸热对应 ΔT = 0）；n=γ：C_n = C_V+R/(1−γ) = C_V−C_V = 0，即绝热过程 Q = 0。"},{"id":"c09q046","type":"calc","difficulty":5,"tags":["弹簧活塞","功的积分","热力学第一定律"],"stem":"气缸内 1 mol 单原子理想气体，活塞与弹簧相连，气体压强随体积变化满足 p = p₀+kV，其中 p₀ = 1.00×10⁵ Pa，k = 2.00×10⁷ Pa/m³。气体从 V₁ = 1.00×10⁻³ m³ 缓慢膨胀到 V₂ = 2.00×10⁻³ m³。求：(1) 气体做的功（用积分）；(2) 内能变化；(3) 吸收的热量。","answer":"(1) 130 J；(2) 240 J；(3) 370 J","explain":"(1) W = ∫(p₀+kV)dV = p₀(V₂−V₁)+½k(V₂²−V₁²) = 1.00×10⁵×1.00×10⁻³+½×2.00×10⁷×(4.00−1.00)×10⁻⁶ = 100+30 = 130 J。\n(2) p₁ = p₀+kV₁ = 1.20×10⁵ Pa，p₂ = 1.40×10⁵ Pa；T₁ = p₁V₁/R = 14.4 K，T₂ = p₂V₂/R = 33.7 K。\nΔU = nC_VΔT = 12.5×19.3 = 240 J。\n(3) Q = ΔU+W = 240+130 = 370 J。\n说明：p-V 图上该过程是直线，功也等于梯形面积 ½(1.20+1.40)×10⁵×1.00×10⁻³ = 130 J。"},{"id":"c09q047","type":"calc","difficulty":5,"tags":["挡板气缸","分段过程","功与热"],"stem":"1 mol 单原子理想气体装在带固定挡板的气缸内，初始体积 10.0 L、温度 300 K，活塞被挡板挡住，只能等容加热；当压强达到 4.00×10⁵ Pa 时活塞开始自由移动，此后保持该压强。继续加热到 600 K。求：(1) 活塞开始移动时的温度；(2) 全过程气体做的功；(3) 全过程吸收的热量。","answer":"(1) 481 K；(2) 986 J；(3) 4.73 kJ","explain":"(1) 等容升温到 p = 4.00×10⁵ Pa：T_停 = pV/(nR) = 4.00×10⁵×0.0100/8.31 = 481 K。\n(2) 第一阶段等容，W₁ = 0；第二阶段等压到 600 K，V₂ = nRT₂/p = 8.31×600/4.00×10⁵ = 1.25×10⁻² m³。\nW = pΔV = 4.00×10⁵×(1.25−1.00)×10⁻² = 986 J。\n(3) ΔU = nC_V(600−300) = 12.5×300 = 3.74×10³ J；Q = ΔU+W = 3.74×10³+986 = 4.73×10³ J。\n易错点：把全过程当等压得 W = 2.49 kJ；漏掉挡板阶段的等容升温。"},{"id":"c09q048","type":"calc","difficulty":5,"tags":["自由膨胀","绝热压缩","多段过程"],"stem":"1 mol 双原子理想气体初态 300 K、10.0 L，先绝热自由膨胀到 20.0 L，再绝热可逆压缩回 10.0 L。求：(1) 自由膨胀后的温度；(2) 最终温度；(3) 全过程外界对气体做的总功与气体吸收的总热量。","answer":"(1) 300 K；(2) 396 K；(3) 1.99 kJ，Q = 0","explain":"(1) 绝热自由膨胀：Q = 0，向真空膨胀 W = 0，ΔU = 0，故 T 不变，仍为 300 K。\n(2) 再绝热可逆压缩回 10.0 L：T₂ = T₁(V₁/V₂)^(γ−1) = 300×2^0.400 = 396 K。\n(3) 自由膨胀不做功；压缩阶段外界做功 W_on = nC_V(T₂−T₁) = 20.8×95.9 = 1.99×10³ J。\n全过程两段都绝热，Q = 0；净效果是外界做功使气体内能增加、温度升高。\n易错点：认为自由膨胀后温度降低；把两段都当成可逆绝热直接回到 300 K。"},{"id":"c09q049","type":"calc","difficulty":5,"tags":["矩形循环","各段功热","循环效率"],"stem":"1 mol 单原子理想气体经矩形循环 A→B→C→D→A：A(1.20×10⁵ Pa，2.00 L)、B(3.60×10⁵ Pa，2.00 L)、C(3.60×10⁵ Pa，5.00 L)、D(1.20×10⁵ Pa，5.00 L)。求各段的 Q、W 及循环效率。","answer":"A→B：Q = 720 J，W = 0；B→C：Q = 2.70 kJ，W = 1.08 kJ；C→D：Q = −1.80 kJ，W = 0；D→A：Q = −900 J，W = −360 J；η = 21.1%","explain":"A→B 等容：W = 0，Q_AB = (3/2)(p_B−p_A)V_A = 1.5×2.40×10⁵×2.00×10⁻³ = 720 J。\nB→C 等压：W_BC = p_BΔV = 3.60×10⁵×3.00×10⁻³ = 1.08×10³ J；ΔU_BC = 1.5×1.08×10³ = 1.62×10³ J；Q_BC = 2.70×10³ J。\nC→D 等容：W = 0，Q_CD = 1.5×(1.20−3.60)×10⁵×5.00×10⁻³ = −1.80×10³ J。\nD→A 等压：W_DA = 1.20×10⁵×(−3.00×10⁻³) = −360 J；ΔU_DA = 1.5×(−360) = −540 J；Q_DA = −900 J。\n净功 W = 1.08×10³−360 = 720 J，吸热 Q_吸 = 720+2700 = 3.42×10³ J，η = 720/3420 = 21.1%。"},{"id":"c09q050","type":"calc","difficulty":5,"tags":["温度依赖热容","等压过程","平均热容"],"stem":"某 1 mol 理想气体的定压摩尔热容随温度变化：C_p = 28.0+0.0200T（SI 单位）。在等压条件下由 300 K 加热到 500 K。求：(1) 吸收的热量（写出积分表达式并计算）；(2) 气体对外做的功；(3) 内能变化；(4) 平均定压摩尔热容。","answer":"(1) Q = ∫C_p dT = 7.20 kJ；(2) 1.66 kJ；(3) 5.54 kJ；(4) 36.0 J/(mol·K)","explain":"(1) Q = ∫(28.0+0.0200T)dT = 28.0×200+½×0.0200×(500²−300²) = 5600+1600 = 7.20×10³ J。\n(2) 等压过程 W = pΔV = nRΔT = 8.31×200 = 1.66×10³ J。\n(3) ΔU = Q−W = 7.20×10³−1.66×10³ = 5.54×10³ J。\n(4) 平均定压热容 C̄_p = Q/(nΔT) = 7200/200 = 36.0 J/(mol·K)，等于 C_p(300)=34.0 与 C_p(500)=38.0 的平均。\n易错点：积分漏掉 ½；把 W 写成 nRΔT 以外的形式；用端点热容直接乘温差。"}]},{"chapter":10,"chapterName":"热力学第二定律与熵","questions":[{"id":"c10q001","type":"choice","difficulty":3,"tags":["等温可逆膨胀","熵变","理想气体"],"stem":"1.00 mol 理想气体在 300 K 下等温可逆膨胀，体积由 10.0 L 增大到 25.0 L，R = 8.31 J/(mol·K)。气体在这一过程中的熵变为","options":["7.61 J/K","−7.61 J/K","2.28×10³ J/K","0"],"answer":"A","explain":"等温可逆过程 ΔU = 0，吸热 Q = W = nRT ln(V₂/V₁) = 1.00×8.31×300×ln2.50 = 2.28×10³ J。\n熵变 ΔS = Q_rev/T = 2.28×10³/300 = 7.61 J/K，也可直接写作 ΔS = nR ln(V₂/V₁) = 8.31×0.916 = 7.61 J/K。\n易错点：C 是吸收的热量（忘了除以温度），B 把体积比取反，D 误认为等温过程熵不变。"},{"id":"c10q002","type":"choice","difficulty":3,"tags":["自由膨胀","熵是态函数","可逆路径"],"stem":"2.00 mol 理想气体在绝热容器中向真空自由膨胀，体积由 V 增大到 2V，初温为 300 K。该过程的熵变为","options":["11.5 J/K","0","−11.5 J/K","5.76 J/K"],"answer":"A","explain":"自由膨胀时 Q = 0、W = 0，故 ΔU = 0，理想气体温度不变。\n初末态之间可设计一条等温可逆膨胀路径替代：ΔS = nR ln(V₂/V₁) = 2.00×8.31×ln2 = 11.5 J/K。\n过程虽不可逆，但熵是态函数，只由初末态决定。易错点：B 把「绝热」误当「可逆绝热」；D 只取 1 mol；C 符号错。"},{"id":"c10q003","type":"choice","difficulty":3,"tags":["相变熵变","熔化热","恒温过程"],"stem":"0.500 kg 的冰在 0 °C、1 atm 下完全融化成 0 °C 的水，冰的熔化热为 3.34×10⁵ J/kg。此过程的熵变为","options":["6.11×10² J/K","1.67×10⁵ J/K","3.06×10² J/K","1.22×10³ J/K"],"answer":"A","explain":"熔化吸热 Q = mL = 0.500×3.34×10⁵ = 1.67×10⁵ J。\n相变在恒温 T = 273 K 下进行，ΔS = Q/T = 1.67×10⁵/273 = 6.11×10² J/K。\nB 是热量（未除以温度），C 把质量又除以 2，D 用了 1.00 kg。易错点：相变熵变必须用相变温度，不能用环境温度。"},{"id":"c10q004","type":"choice","difficulty":3,"tags":["等容过程","熵变积分","摩尔热容"],"stem":"1.00 mol 单原子理想气体在刚性容器中等容加热，温度由 300 K 升到 400 K，C_V = 1.5R。气体的熵变为","options":["3.59 J/K","5.98 J/K","12.5 J/K","0"],"answer":"A","explain":"等容过程 dQ = nC_V dT，故 ΔS = ∫nC_V dT/T = nC_V ln(T₂/T₁) = 1.00×1.5×8.31×ln(400/300) = 12.5×0.2877 = 3.59 J/K。\nB 误用 C_p = 2.5R；C 只算了系数 nC_V 而漏乘 ln(4/3)；D 误认为等容无熵变。\n易错点：熵变要用 ln(T₂/T₁)，不能写成 ΔT/T。"},{"id":"c10q005","type":"choice","difficulty":3,"tags":["卡诺热机","循环净熵变","热机放热"],"stem":"一卡诺热机在 400 K 与 300 K 两热源之间工作，每循环从高温热源吸热 800 J。关于每循环向低温热源放出的热量 Q₂ 和循环的净熵变，正确的是","options":["Q₂ = 600 J，循环净熵变为 0","Q₂ = 600 J，循环净熵变为 +0.250 J/K","Q₂ = 800 J，循环净熵变为 0","Q₂ = 400 J，循环净熵变为 −0.667 J/K"],"answer":"A","explain":"可逆卡诺循环的净熵变为零，故 Q₁/T₁ = Q₂/T₂，即 800/400 = Q₂/300，得 Q₂ = 600 J；再由能量守恒 W = Q₁ − Q₂ = 200 J（效率 0.250）。\n循环回到初态，工作物质净熵变为 0；高温热源熵变 −2.00 J/K、低温热源熵变 +2.00 J/K，总和也为零。\n易错点：B 把效率 0.250 直接当成熵变；C 忘记热机必须放热；D 把输出功当成 Q₂。"},{"id":"c10q006","type":"choice","difficulty":3,"tags":["热泵","制热系数","最小功"],"stem":"理想热泵在 270 K 的室外与 300 K 的室内之间工作，每周期向室内输送 3.00×10³ J 的热量。其制热系数和压缩机所需的最小功分别为","options":["10.0，300 J","9.00，333 J","10.0，270 J","1.10，2.73 kJ"],"answer":"A","explain":"可逆热泵的制热系数 COP_h = T_h/(T_h − T_c) = 300/(300 − 270) = 10.0。\n最小功 W = Q_h/COP_h = 3.00×10³/10.0 = 300 J，此时从室外吸热 Q_c = Q_h − W = 2.70×10³ J。\nB 误用制冷系数 COP_R = T_c/ΔT = 9.00；C 用 Q_c 除以 COP_h；D 把 COP 取倒数。\n易错点：热泵与制冷机是同一循环，COP_h = COP_R + 1，不是相等。"},{"id":"c10q007","type":"choice","difficulty":4,"tags":["变温过程熵变","积分法","水的比热容"],"stem":"0.500 kg 的水在常压下由 20.0 °C 加热到 80.0 °C，水的比热容 c = 4.18×10³ J/(kg·K)。水的熵变为","options":["389 J/K","355 J/K","428 J/K","−389 J/K"],"answer":"A","explain":"沿可逆加热路径，dQ = mc dT，故 ΔS = ∫mc dT/T = mc ln(T₂/T₁) = 0.500×4.18×10³×ln(353/293) = 2.09×10³×0.1864 = 389 J/K。\nB 用 Q/T₂ = 1.25×10⁵/353 = 355 J/K，把变温过程当恒温；C 用 Q/T₁ = 1.25×10⁵/293 = 428 J/K；D 符号错。\n易错点：温度必须用热力学温度，且要取对数而不是算术平均。"},{"id":"c10q008","type":"choice","difficulty":4,"tags":["两物体接触","不可逆熵变","平衡温度"],"stem":"两个质量均为 1.00 kg、比热容均为 4.18×10³ J/(kg·K) 的物体，初始温度分别为 400 K 和 200 K，被孤立地放在一起达到热平衡。总熵变为","options":["492 J/K","0","−492 J/K","246 J/K"],"answer":"A","explain":"等热容时平衡温度 T_f = (400 + 200)/2 = 300 K。\n热物体 ΔS₁ = mc ln(300/400) = 4.18×10³×(−0.2877) = −1.20×10³ J/K；冷物体 ΔS₂ = mc ln(300/200) = 4.18×10³×0.4055 = +1.69×10³ J/K。\n总熵变 ΔS = 492 J/K > 0，符合熵增原理。\nB 误认为热量守恒所以熵不变；D 把总熵变除以 2；C 符号错。易错点：两物体温度都在变，不能把总熵变写成 Q(1/T₂ − 1/T₁)。"},{"id":"c10q009","type":"choice","difficulty":4,"tags":["混合熵","不同气体","分压"],"stem":"2.00 mol 气体 A 与 2.00 mol 气体 B（两者不同）分别装在两个体积均为 V、温度均为 T、压强均为 p 的容器中，抽去隔板后等温混合，总体积为 2V。混合过程的熵变为","options":["23.0 J/K","11.5 J/K","46.1 J/K","0"],"answer":"A","explain":"混合后每种气体的分压由 p 降为 p/2，用分压计算：ΔS = −n_A R ln(p_A/p) − n_B R ln(p_B/p) = (2.00 + 2.00)R ln2 = 4×8.31×0.693 = 23.0 J/K。\n也可等价地看作每种气体从 V 膨胀到 2V，ΔS = n_A R ln(2V/V) + n_B R ln(2V/V)。\nB 只算了一种气体；C 把 ln 前的系数算成 8R；D 误按同种气体处理（同种气体等温等压混合熵变为零）。\n易错点：只有不同气体才有混合熵，且每种气体都膨胀到总体积。"},{"id":"c10q010","type":"choice","difficulty":4,"tags":["T-S 图","卡诺循环","面积等于功"],"stem":"一卡诺循环在 T-S 图上是一个矩形，两条等温线分别为 600 K 和 300 K，两段绝热过程对应的熵差为 2.00 J/K。该循环每周期对外做的净功和从高温热源吸收的热量分别为","options":["600 J，1200 J","600 J，600 J","300 J，1200 J","1200 J，600 J"],"answer":"A","explain":"T-S 图中循环所围面积等于净功：W = (T₁ − T₂)ΔS = (600 − 300)×2.00 = 600 J。\n等温吸热段 Q₁ = T₁ΔS = 600×2.00 = 1200 J；等温放热 Q₂ = T₂ΔS = 600 J，二者之差正是 600 J。\nB 漏掉放热项；C 把温差算成 150 K；D 把面积公式误写成 T₁ΔS。\n易错点：T-S 图上「围成面积 = 净功」，而某段等温线下的面积才是该段的吸放热。"},{"id":"c10q011","type":"choice","difficulty":4,"tags":["等压过程","热力学第一定律","熵变"],"stem":"1.00 mol 单原子理想气体在 1.00×10⁵ Pa 下等压加热，温度由 300 K 升到 400 K，C_p = 2.5R。该过程的吸热 Q、对外做功 W、内能增量 ΔU 和熵变 ΔS 分别为","options":["Q = 2.08 kJ，W = 831 J，ΔU = 1.25 kJ，ΔS = 5.98 J/K","Q = 1.25 kJ，W = 831 J，ΔU = 2.08 kJ，ΔS = 3.59 J/K","Q = 2.08 kJ，W = 1.25 kJ，ΔU = 831 J，ΔS = 5.98 J/K","Q = 2.08 kJ，W = 831 J，ΔU = 1.25 kJ，ΔS = 11.9 J/K"],"answer":"A","explain":"等压过程 Q = nC_pΔT = 1.00×2.5×8.31×100 = 2.08×10³ J；W = nRΔT = 8.31×100 = 831 J；ΔU = nC_VΔT = 1.25×10³ J，满足 Q = ΔU + W。\nΔS = nC_p ln(T₂/T₁) = 1.00×2.5×8.31×ln(4/3) = 5.98 J/K。\nB 把 Q 与 ΔU 对调；C 把 W 与 ΔU 对调；D 把物质的量误当成 2 mol，算成 2×5.98 = 11.9 J/K。\n易错点：等压过程吸热不等于内能增量，有一部分用于对外做功。"},{"id":"c10q012","type":"choice","difficulty":4,"tags":["亥姆霍兹自由能","等温膨胀","最大功"],"stem":"1.00 mol 理想气体在 300 K 下等温可逆膨胀，体积由 V 增大到 2V。该过程的亥姆霍兹自由能变化 ΔF 为","options":["−1.73×10³ J","+1.73×10³ J","0","−8.64×10² J"],"answer":"A","explain":"等温下理想气体 ΔU = 0，ΔS = nR ln2 = 5.76 J/K。\n由 F = U − TS 得 ΔF = ΔU − TΔS = 0 − 300×5.76 = −1.73×10³ J。\nΔF 为负表示等温可逆过程中系统最多可对外做 1.73 kJ 的功，即 ΔF = −W_max。\nB 符号错；C 误认为等温 ΔF = 0（那是 ΔG）；D 把温度误取为 150 K，得到 −150×5.76 = −8.64×10² J。易错点：ΔF 与 ΔG 在理想气体等温过程中数值相同，但判据条件不同。"},{"id":"c10q013","type":"choice","difficulty":4,"tags":["吉布斯自由能","等温压缩","判据"],"stem":"2.00 mol 理想气体在 350 K 下等温可逆压缩，压强由 1.00×10⁵ Pa 增大到 5.00×10⁵ Pa。该过程的吉布斯自由能变化 ΔG 为","options":["+9.36×10³ J","−9.36×10³ J","+1.87×10⁴ J","0"],"answer":"A","explain":"理想气体等温过程 ΔH = 0，ΔS = nR ln(p₁/p₂) = 2.00×8.31×ln(1/5) = −26.8 J/K。\nΔG = ΔH − TΔS = 0 − 350×(−26.8) = +9.36×10³ J。\nΔG > 0 表示等温等压且无其他功时压缩不能自发，必须由外界做功。\nB 符号错；C 把物质的量重复乘了一次；D 误认为等温 ΔG = 0。易错点：ΔG = nRT ln(p₂/p₁)，压缩为正。"},{"id":"c10q014","type":"choice","difficulty":4,"tags":["有限温差传热","熵产","不可逆过程"],"stem":"2.00×10³ J 的热量由 500 K 的恒温热源直接传导给 300 K 的恒温热源。该过程的总熵变为","options":["2.67 J/K","1.33 J/K","0","−2.67 J/K"],"answer":"A","explain":"高温热源放热：ΔS₁ = −Q/T₁ = −2000/500 = −4.00 J/K；低温热源吸热：ΔS₂ = +Q/T₂ = +2000/300 = +6.67 J/K。\n总熵变 ΔS = +2.67 J/K > 0，说明有限温差传热是不可逆过程。\nB 把总熵变除以 2；C 误认为热量守恒熵就守恒；D 符号错。\n易错点：两个热源温度不同，不能把 Q/T 中的 T 取成同一个值。"},{"id":"c10q015","type":"choice","difficulty":4,"tags":["一般过程熵变","态函数","两项叠加"],"stem":"2.00 mol 单原子理想气体由状态 (300 K，20.0 L) 变到 (400 K，40.0 L)，C_V = 1.5R。该过程的熵变为","options":["18.7 J/K","7.17 J/K","11.5 J/K","23.0 J/K"],"answer":"A","explain":"熵是态函数，可设计「先等容升温、再等温膨胀」的可逆路径：ΔS = nC_V ln(T₂/T₁) + nR ln(V₂/V₁) = 2.00×1.5×8.31×ln(4/3) + 2.00×8.31×ln2 = 7.17 + 11.5 = 18.7 J/K。\nB 漏掉体积项；C 漏掉温度项；D 把体积项算成 2nR ln2 = 23.0 J/K。\n易错点：温度和体积都变时两项都要算，不能只套一个公式。"},{"id":"c10q016","type":"choice","difficulty":4,"tags":["实际制冷机","熵产","放热计算"],"stem":"一台制冷机在 270 K 的冷藏室与 300 K 的环境之间工作，每周期从冷藏室吸热 1.20×10³ J，消耗的功为 300 J。该制冷机每周期使外界（冷藏室与环境）增加的熵为","options":["0.556 J/K","−0.556 J/K","0","−0.444 J/K"],"answer":"A","explain":"向环境放热 Q_h = Q_c + W = 1200 + 300 = 1500 J。\n冷藏室熵变 ΔS_c = −1200/270 = −4.44 J/K；环境熵变 ΔS_h = +1500/300 = +5.00 J/K。\n总熵变（熵产）ΔS = +0.556 J/K > 0，说明该制冷机不可逆。\nB 符号错；C 只有可逆循环才为零；D 用 Q_c 代替 Q_h 算环境吸热，得到 1200/300 − 1200/270 = −0.444 J/K。易错点：环境吸收的是 Q_c + W，不是 Q_c。"},{"id":"c10q017","type":"choice","difficulty":4,"tags":["玻尔兹曼熵","微观状态数","统计解释"],"stem":"某系统的可分辨微观状态数由 W 增大到 2W，玻尔兹曼常数为 1.38×10⁻²³ J/K。该系统熵的增量为","options":["9.57×10⁻²⁴ J/K","1.38×10⁻²³ J/K","1.91×10⁻²³ J/K","0"],"answer":"A","explain":"玻尔兹曼熵公式 S = k lnW。\nΔS = k ln(2W) − k lnW = k ln2 = 1.38×10⁻²³×0.693 = 9.57×10⁻²⁴ J/K。\nB 把 ln2 当成 1；C 用了 2k（误认为 W 加倍熵就加倍）；D 误认为微观状态数变化不影响熵。\n易错点：熵与 lnW 成正比，不是与 W 成正比。"},{"id":"c10q018","type":"choice","difficulty":4,"tags":["相变","吉布斯自由能","平衡判据"],"stem":"1.00 mol 冰在 0 °C、1 atm 下熔化成水，熔化热为 6.01×10³ J/mol，熔化熵变为 22.0 J/K。该过程的吉布斯自由能变化 ΔG 为","options":["约为 0","+6.01×10³ J","−6.01×10³ J","+22.0 J"],"answer":"A","explain":"ΔG = ΔH − TΔS = 6.01×10³ − 273×22.0 = 6010 − 6006 = 4 J，约为 0。\n0 °C、1 atm 正是冰水平衡共存的条件，两相化学势相等，故 ΔG = 0，相变可逆。\nB 只取了 ΔH；C 符号错；D 把 ΔS 当 ΔG。\n易错点：平衡相变 ΔG = 0 是判据，不是「ΔG 很小所以自发」。"},{"id":"c10q019","type":"choice","difficulty":4,"tags":["等压与等容","熵变比较","迈耶关系"],"stem":"2.00 mol 单原子理想气体温度由 300 K 升到 400 K。若分别经等压过程和等容过程完成，两过程熵变之差 ΔS_p − ΔS_V 为","options":["4.78 J/K","11.9 J/K","7.17 J/K","0"],"answer":"A","explain":"ΔS_p = nC_p ln(T₂/T₁)，ΔS_V = nC_V ln(T₂/T₁)，故差值 = n(C_p − C_V)ln(T₂/T₁) = nR ln(4/3) = 2.00×8.31×0.2877 = 4.78 J/K。\nB 是等压过程的总熵变 11.9 J/K；C 是等容过程的总熵变 7.17 J/K；D 误认为熵变只由温度决定、与路径无关。\n易错点：两过程末态不同（压强、体积不同），熵变不能相减为零。"},{"id":"c10q020","type":"choice","difficulty":4,"tags":["T-S 图面积","循环净功","顺时针方向"],"stem":"某循环在 T-S 图上是一条三角形：顶点为 (S = 1.0 J/K，T = 400 K)、(S = 3.0 J/K，T = 400 K)、(S = 1.0 J/K，T = 200 K)，循环沿顺时针方向进行。该循环每周期对外做的净功为","options":["200 J","400 J","600 J","300 J"],"answer":"A","explain":"T-S 图上顺时针循环所围面积等于净功。\n三角形底为 ΔS = 2.0 J/K，高为 ΔT = 200 K，面积 = ½×2.0×200 = 200 J。\nB 漏掉 ½（按矩形算，400 J）；C 把底边当成 3.0 J/K 且漏掉 ½（3.0×200 = 600 J）；D 用 300 K 作高度（300 J）。\n易错点：面积是 ½×底×高；顺时针为热机（W > 0），逆时针为制冷机。"},{"id":"c10q021","type":"choice","difficulty":5,"tags":["克劳修斯不等式","循环可能性","卡诺效率"],"stem":"某热机每循环从 600 K 热源吸热 1.00×10³ J，向 300 K 热源放热 4.00×10² J，对外做功 6.00×10² J。关于该循环，下列说法正确的是","options":["违反克劳修斯不等式，不可能实现","满足克劳修斯不等式，但不可逆","是可逆卡诺循环","满足能量守恒，因此一定可实现"],"answer":"A","explain":"克劳修斯不等式 ∮dQ/T ≤ 0（吸热取正）。\nΣQ/T = 1000/600 − 400/300 = 1.667 − 1.333 = +0.333 J/K > 0，违反不等式，故该循环不可能实现。\n若为可逆卡诺循环，应有 Q₂ = Q₁T₂/T₁ = 500 J，而不是 400 J；其效率 0.600 也已超过卡诺效率 0.500。\nB 把符号判反；C 忽略效率上限；D 只查了能量守恒。易错点：能量守恒只是必要条件，不是充分条件。"},{"id":"c10q022","type":"choice","difficulty":5,"tags":["卡诺热机串联","中间温度","效率相等与功相等"],"stem":"两个卡诺热机串联工作：第一个在 600 K 与中间温度 T 之间工作，第二个在 T 与 300 K 之间工作。若要求两机效率相等，中间温度应为 T₁；若要求两机每循环输出功相等，中间温度应为 T₂。T₁ 和 T₂ 分别为","options":["424 K，450 K","450 K，424 K","424 K，424 K","450 K，450 K"],"answer":"A","explain":"效率相等：1 − T/600 = 1 − 300/T，得 T² = 600×300，T₁ = √(1.80×10⁵) = 424 K。\n输出功相等：设第一台吸热 Q，W₁ = Q(1 − T/600)；中间放热 QT/600 全部给第二台，W₂ = Q(T/600)(1 − 300/T) = Q(T − 300)/600。令 W₁ = W₂ 得 T₂ = 450 K。\nB 把两种条件对调；C、D 未区分条件。\n易错点：效率相等对应几何平均温度，输出功相等对应算术平均温度。"},{"id":"c10q023","type":"choice","difficulty":5,"tags":["四过程熵变比较","等压膨胀","自由膨胀"],"stem":"1.00 mol 单原子理想气体从同一初态 (300 K，V₀) 出发，分别经下列四种过程使体积增大到 2V₀：(甲) 等温可逆膨胀；(乙) 可逆绝热膨胀；(丙) 向真空自由膨胀；(丁) 等压膨胀。四种过程熵变最大的是","options":["丁","甲","乙","丙"],"answer":"A","explain":"甲：ΔS = R ln2 = 5.76 J/K；乙：可逆绝热 ΔS = 0；丙：自由膨胀温度不变，ΔS = R ln2 = 5.76 J/K；丁：等压时 T₂ = 2T₁ = 600 K，ΔS = C_p ln2 = 2.5×8.31×0.693 = 14.4 J/K。\n故丁最大。B 把甲当最大（忽略等压升温）；C 把绝热当熵增最大；D 把自由膨胀当熵增最大。\n易错点：四种过程末态不同，必须分别算到各自末态，不能只比体积变化。"},{"id":"c10q024","type":"choice","difficulty":5,"tags":["可用能","损失功","熵产"],"stem":"1.00×10³ J 的热量从 600 K 的恒温热源取出，环境温度为 300 K。若某热机利用这部分热量对外做功 350 J，则它相对可逆机的损失功为","options":["150 J","350 J","500 J","0"],"answer":"A","explain":"可逆机最大功 W_max = Q(1 − T₀/T) = 1000×(1 − 300/600) = 500 J。\n损失功 = W_max − W = 500 − 350 = 150 J。\n也可由熵产算：实际放热 Q₂ = 650 J，ΔS_univ = 650/300 − 1000/600 = 0.500 J/K，损失功 = T₀ΔS_univ = 300×0.500 = 150 J。\nB 把实际功当损失；C 是最大功；D 误认为能量守恒就没有损失。易错点：损失功 = T₀×熵产。"},{"id":"c10q025","type":"choice","difficulty":5,"tags":["麦克斯韦关系","热力学基本方程","等温熵变"],"stem":"对 1.00 mol 理想气体，由热力学基本方程 dU = TdS − pdV 和理想气体状态方程可导出 (∂S/∂V)_T = nR/V。由此可知，理想气体在等温过程中体积由 V₁ 变到 V₂ 时，熵变表达式为","options":["ΔS = nR ln(V₂/V₁)","ΔS = nC_V ln(V₂/V₁)","ΔS = nR ln(T₂/T₁)","ΔS = p(V₂ − V₁)/T"],"answer":"A","explain":"等温时 dT = 0，dU = nC_V dT = 0，故 TdS = pdV，dS = (p/T)dV = (nR/V)dV。\n积分得 ΔS = nR ln(V₂/V₁)，与等温可逆膨胀的 Q/T 结果一致。\nB 把偏导数中的 R 换成 C_V；C 是升温过程的形式；D 只在压强恒定时成立，而等温膨胀压强在变。\n易错点：p/T = nR/V 只对理想气体成立。"},{"id":"c10q026","type":"choice","difficulty":5,"tags":["熵增原理","过程方向","热流向高温"],"stem":"1.00 kg 的水（c = 4.18×10³ J/(kg·K)）从 300 K 冷却到 290 K，放出的热量全部被 310 K 的恒温环境吸收。该过程的总熵变为","options":["−6.87 J/K，不可能发生","+7.60 J/K，可能发生","−142 J/K，不可能发生","+6.87 J/K，可能发生"],"answer":"A","explain":"水的熵变 ΔS_水 = mc ln(290/300) = 4.18×10³×(−0.03390) = −142 J/K。\n水放热 Q = mcΔT = 4.18×10³×10 = 4.18×10⁴ J，环境吸热：ΔS_环 = +Q/T_环 = +4.18×10⁴/310 = +135 J/K。\n总熵变 ΔS = −142 + 135 = −6.87 J/K \u003c 0，违反熵增原理，故热量不可能自发流向更热的 310 K 环境。\nC 漏掉环境熵变；B、D 符号错。易错点：判断方向必须算「系统 + 环境」的总熵变，不能只看水。"},{"id":"c10q027","type":"choice","difficulty":5,"tags":["混合熵","不等量混合","分压"],"stem":"3.00 mol 气体 A 与 1.00 mol 气体 B（两者不同）在相同温度 T、相同压强 p 下混合。混合过程的熵变为","options":["18.7 J/K","23.0 J/K","11.5 J/K","9.35 J/K"],"answer":"A","explain":"混合后 A、B 的摩尔分数分别为 x_A = 0.750、x_B = 0.250，分压分别为 0.750p、0.250p。\nΔS = −R(n_A ln x_A + n_B ln x_B) = −8.31×(3.00×ln0.750 + 1.00×ln0.250) = −8.31×(−2.249) = 18.7 J/K。\nB 按等量 4 mol 混合算成 4R ln2 = 23.0 J/K；C 只算 1.00 mol 组分；D 把结果除以 2。\n易错点：不等量混合必须用摩尔分数；同种气体混合熵为零（吉布斯佯谬），不能套用此式。"},{"id":"c10q028","type":"choice","difficulty":5,"tags":["不可逆绝热压缩","熵增","温度计算"],"stem":"1.00 mol 单原子理想气体（C_V = 1.5R）从 300 K、体积 V 出发，经绝热不可逆压缩到体积 V/2，外界做功 2.50×10³ J。气体的熵变为","options":["+0.62 J/K","0","−5.76 J/K","+5.76 J/K"],"answer":"A","explain":"绝热 Q = 0，ΔU = W = 2.50×10³ J，ΔT = W/(nC_V) = 2500/12.5 = 200 K，故 T₂ = 500 K。\nΔS = nC_V ln(T₂/T₁) + nR ln(V₂/V₁) = 12.5×ln(500/300) + 8.31×ln(1/2) = 6.38 − 5.76 = +0.62 J/K。\nB 误把「绝热」当「可逆绝热」；C 只算体积项；D 只算体积项且把 −5.76 写成 +5.76 J/K。\n易错点：不可逆绝热过程熵增加，只有可逆绝热才熵不变。"},{"id":"c10q029","type":"choice","difficulty":5,"tags":["可用能","环境温度","卡诺极限"],"stem":"1.00×10³ J 的热量储存在 500 K 的恒温热源中，环境温度为 300 K。这部分热量中最多可转化为功的部分（可用能）为","options":["400 J","600 J","1.00×10³ J","200 J"],"answer":"A","explain":"最大功由可逆卡诺机给出：W_max = Q(1 − T₀/T) = 1000×(1 − 300/500) = 400 J。\n其余 600 J 必须排给环境，属于不可用能。\nB 是必须排出的部分；C 违反开尔文表述（单一热源不可能把热全部变成功）；D 把温度比取反后得到 200 J。\n易错点：可用能与环境温度有关，同一热量在不同环境温度下可用能不同。"},{"id":"c10q030","type":"choice","difficulty":5,"tags":["热机驱动制冷机","卡诺循环组合","能量分配"],"stem":"一卡诺热机在 600 K 与 300 K 之间工作，每周期从高温热源吸热 1.00×10³ J；它输出的功全部用来驱动一台在 300 K 与 270 K 之间工作的卡诺制冷机。制冷机每周期从 270 K 冷库吸收的热量为","options":["4.50×10³ J","5.00×10² J","9.00×10² J","5.00×10³ J"],"answer":"A","explain":"热机效率 η = 1 − 300/600 = 0.500，输出功 W = 500 J。\n制冷机 COP = T_c/(T_h − T_c) = 270/30 = 9.00，从冷库吸热 Q_c = COP×W = 9.00×500 = 4.50×10³ J，向 300 K 热源放热 Q_h = 5.00×10³ J。\nB 是热机输出的功；C 把 COP 当成 1.80；D 是制冷机的放热量。\n易错点：热机效率与制冷系数不能混用，两者分母不同。"},{"id":"c10q031","type":"choice","difficulty":5,"tags":["热泵熵产","实际循环","最小功"],"stem":"一台热泵从 270 K 的室外向 300 K 的室内输送 1.50×10³ J 的热量，实际消耗的功为 200 J。该热泵每周期产生的熵为","options":["1.85×10⁻¹ J/K","0","6.67×10⁻¹ J/K","−1.85×10⁻¹ J/K"],"answer":"A","explain":"从室外吸热 Q_c = Q_h − W = 1500 − 200 = 1300 J。\n室内熵变 +1500/300 = +5.00 J/K，室外熵变 −1300/270 = −4.815 J/K，总熵产 = +0.185 J/K > 0。\n理想情况下 W_min = Q_h(1 − 270/300) = 150 J，此时熵产为零；实际多耗的 50 J 功对应熵产 50/270 = 0.185 J/K。\nB 误认为热量守恒即无熵产；C 用功耗除以环境温度；D 符号错。易错点：熵产 = ΣQ/T，不是功耗除以温度。"},{"id":"c10q032","type":"choice","difficulty":5,"tags":["玻尔兹曼熵","微观状态数","自由膨胀"],"stem":"1.00 mol 理想气体等温自由膨胀，体积由 V 增大到 2V。已知 R = 8.31 J/(mol·K)，k = 1.38×10⁻²³ J/K，则该过程微观状态数之比的自然对数 ln(W₂/W₁) 约为","options":["4.17×10²³","5.76","6.02×10²³","2.08×10²³"],"answer":"A","explain":"自由膨胀温度不变，ΔS = R ln2 = 8.31×0.693 = 5.76 J/K。\n由 ΔS = k ln(W₂/W₁) 得 ln(W₂/W₁) = ΔS/k = 5.76/1.38×10⁻²³ = 4.17×10²³。\nB 是 ΔS 本身；C 是阿伏伽德罗常数（漏乘 ln2）；D 少乘了一半。\n易错点：宏观熵变对应的是微观状态数比值的对数，不是状态数本身。"},{"id":"c10q033","type":"choice","difficulty":5,"tags":["T-S 图","非等温吸热","循环效率"],"stem":"某循环在 T-S 图上由两条绝热线和一条斜的吸热线、一条等温放热线组成：吸热时温度由 400 K 线性升到 700 K，熵由 1.0 J/K 增到 4.0 J/K；放热在 300 K 下等温进行，熵由 4.0 J/K 减回 1.0 J/K。该循环的热效率为","options":["45.5%","40.0%","54.5%","30.0%"],"answer":"A","explain":"吸热沿斜线，Q₁ = ∫T dS = 梯形面积 = ½(400 + 700)×3.0 = 1650 J。\n放热 Q₂ = T₂ΔS = 300×3.0 = 900 J，净功 W = 1650 − 900 = 750 J。\nη = W/Q₁ = 750/1650 = 0.455。\nB 用温差比；C 是 1 − η；D 用 300/1000 算错基准。易错点：非等温吸热时 Q = ∫T dS 是面积，不是 TΔS。"},{"id":"c10q034","type":"choice","difficulty":5,"tags":["有限热容","最大功","积分法"],"stem":"一有限热容物体 C = 1.00×10³ J/K，初始温度 400 K，环境温度 300 K。利用它降温到 300 K 过程中放出的热量，最多可对外做功","options":["1.37×10⁴ J","1.00×10⁵ J","8.63×10⁴ J","2.88×10⁴ J"],"answer":"A","explain":"物体放热 Q = C(T₁ − T₀) = 1000×100 = 1.00×10⁵ J。\n物体熵变 ΔS = C ln(T₀/T₁) = 1000×ln(0.75) = −287.7 J/K；可逆时环境熵变 +287.7 J/K，环境吸热 Q₀ = T₀×287.7 = 8.63×10⁴ J。\n最大功 W = Q − Q₀ = 1.00×10⁵ − 8.63×10⁴ = 1.37×10⁴ J。\nB 是总热量；C 是必须排给环境的热量；D 是 |ΔS|×100。易错点：热源温度在变，不能直接用卡诺效率乘总热量。"},{"id":"c10q035","type":"choice","difficulty":5,"tags":["相变","吉布斯自由能","温度判据"],"stem":"冰在 −5 °C 时熔化热为 6.01×10³ J/mol，熔化熵变为 22.0 J/K。1.00 mol 冰在 −5 °C、1 atm 下熔化为水时，ΔG 约为","options":["+1.14×10² J，不能自发","0，处于平衡","−1.14×10² J，能自发","+6.01×10³ J，不能自发"],"answer":"A","explain":"T = 268 K，ΔG = ΔH − TΔS = 6010 − 268×22.0 = 6010 − 5896 = +114 J > 0。\n故 −5 °C 下冰不能自发熔化，必须加热到 0 °C（此时 ΔG = 0）或由外界做功。\nB 把 0 °C 的平衡条件搬到 −5 °C；C 符号错；D 只取了 ΔH。\n易错点：ΔG 的正负随温度改变，熔点处才为零。"},{"id":"c10q036","type":"calc","difficulty":4,"tags":["变温熵变","热源熵变","总熵变"],"stem":"0.800 kg 的水（c = 4.18×10³ J/(kg·K)）由 10.0 °C 加热到 90.0 °C。求：(1) 水的熵变；(2) 若热量由 100 °C 的恒温热源提供，热源的熵变；(3) 全过程总熵变。","answer":"(1) 832 J/K；(2) −7.17×10² J/K；(3) +115 J/K","explain":"(1) ΔS_水 = mc ln(T₂/T₁) = 0.800×4.18×10³×ln(363/283) = 3.34×10³×0.2485 = 832 J/K。\n(2) Q = mcΔT = 0.800×4.18×10³×80.0 = 2.68×10⁵ J；热源放热，ΔS_源 = −Q/T_源 = −2.68×10⁵/373 = −7.17×10² J/K。\n(3) ΔS_总 = 832 − 717 = +115 J/K > 0，有限温差传热不可逆。\n易错点：(2) 必须用热源温度 373 K，不能用水温。"},{"id":"c10q037","type":"calc","difficulty":4,"tags":["混合熵","吉布斯自由能","分压"],"stem":"3.00 mol 气体 A 与 3.00 mol 气体 B（不同种）在相同温度 T、相同压强 p 下分别占有体积 V，抽去隔板后等温等压混合，总体积为 2V。求：(1) 混合熵变（写出符号表达式并给出数值）；(2) 若 T = 300 K，混合过程的吉布斯自由能变化 ΔG。","answer":"(1) ΔS = (n_A + n_B)R ln2 = 6R ln2 = 34.6 J/K；(2) ΔG = −TΔS = −1.04×10⁴ J","explain":"(1) 混合后 p_A = p_B = p/2，用分压：ΔS = −n_A R ln(p_A/p) − n_B R ln(p_B/p) = (3.00 + 3.00)R ln2 = 34.6 J/K；等价于每种气体从 V 膨胀到 2V。\n(2) 理想气体等温等压混合 ΔH = 0，故 ΔG = −TΔS = −300×34.6 = −1.04×10⁴ J \u003c 0，混合自发。\n易错点：混合热为零，ΔG 不是 ΔH；同种气体混合 ΔS = 0。"},{"id":"c10q038","type":"calc","difficulty":4,"tags":["不可逆热机","熵产","损失功"],"stem":"一热机每循环从 600 K 热源吸热 2.00×10³ J，向 300 K 环境放热 1.30×10³ J，输出功 7.00×10² J。求：(1) 热效率；(2) 同温限下卡诺效率；(3) 每循环的熵产与损失功（环境温度 300 K）。","answer":"(1) 35.0%；(2) 50.0%；(3) 1.00 J/K，300 J","explain":"(1) η = W/Q₁ = 700/2000 = 0.350。\n(2) η_C = 1 − 300/600 = 0.500。\n(3) ΔS_univ = Q₂/T₂ − Q₁/T₁ = 1300/300 − 2000/600 = 4.333 − 3.333 = 1.00 J/K；损失功 = T₀ΔS_univ = 300×1.00 = 300 J，也等于 W_max − W = 1000 − 700。\n易错点：损失功不是 Q₁ − W；熵产要把放热和吸热分别除以各自温度。"},{"id":"c10q039","type":"calc","difficulty":4,"tags":["卡诺制冷机","制冷系数","最小功"],"stem":"一台卡诺制冷机在 255 K 的冷库与 295 K 的环境之间工作，每周期从冷库吸热 2.00×10³ J。求：(1) 制冷系数；(2) 每周期所需的最小功；(3) 向环境放出的热量。","answer":"(1) 6.38；(2) 3.14×10² J；(3) 2.31×10³ J","explain":"(1) COP = T_c/(T_h − T_c) = 255/40.0 = 6.38。\n(2) W = Q_c/COP = 2000/6.38 = 3.14×10² J。\n(3) Q_h = Q_c + W = 2.31×10³ J。\n也可由可逆循环熵变为零验证：Q_h/T_h = Q_c/T_c，得 Q_h = 2000×295/255 = 2314 J。\n易错点：COP 的分母是温差，不是高温；Q_h 必须加上功。"},{"id":"c10q040","type":"calc","difficulty":4,"tags":["亥姆霍兹自由能","吉布斯自由能","等温压缩"],"stem":"2.00 mol 理想气体在 350 K 下等温可逆压缩，压强由 1.00×10⁵ Pa 增至 5.00×10⁵ Pa。求：(1) 熵变；(2) 亥姆霍兹自由能变化 ΔF；(3) 吉布斯自由能变化 ΔG，并说明压缩为何需要外界做功。","answer":"(1) −26.8 J/K；(2) +9.36×10³ J；(3) +9.36×10³ J","explain":"(1) ΔS = nR ln(p₁/p₂) = 2.00×8.31×ln(1/5) = −26.8 J/K。\n(2) 等温理想气体 ΔU = 0，ΔF = ΔU − TΔS = −350×(−26.8) = +9.36×10³ J。\n(3) ΔH = 0，ΔG = ΔH − TΔS = +9.36×10³ J > 0。等温等压可逆压缩时外界至少要做 9.36 kJ 的功（−W_其他 = ΔG），故不能自发。\n易错点：ΔF 与 ΔG 在理想气体等温过程中相等，但判据条件不同（等温等容与等温等压）。"},{"id":"c10q041","type":"calc","difficulty":5,"tags":["冰升温","相变熵变","分段积分"],"stem":"0.500 kg 的冰从 −10.0 °C 加热成 20.0 °C 的水。冰的比热容 2.10×10³ J/(kg·K)，水的比热容 4.18×10³ J/(kg·K)，冰的熔化热 3.34×10⁵ J/kg。求全过程水的熵变，并写成三段积分之和的符号表达式。","answer":"ΔS = m c_冰 ln(273/263) + mL/T_m + m c_水 ln(293/273) = 7.98×10² J/K","explain":"ΔS = 0.500×2.10×10³×ln(273/263) + 0.500×3.34×10⁵/273 + 0.500×4.18×10³×ln(293/273)\n= 0.500×2.10×10³×0.03732 + 612 + 0.500×4.18×10³×0.07071\n= 39.2 + 612 + 148 = 7.98×10² J/K。\n三段分别是冰升温、0 °C 相变、水升温；相变段必须用相变温度 273 K。\n易错点：把冰升温段也除以 273 K；漏掉相变潜热段。"},{"id":"c10q042","type":"calc","difficulty":5,"tags":["两物体混合","平衡温度","总熵变"],"stem":"2.00 kg 的水（c = 4.18×10³ J/(kg·K)）温度为 350 K，与 1.00 kg、280 K 的同种水在绝热容器中混合。求：(1) 平衡温度（写出符号表达式）；(2) 总熵变。","answer":"(1) T_f = (m₁T₁ + m₂T₂)/(m₁ + m₂) = 327 K；(2) ΔS = m₁c ln(T_f/T₁) + m₂c ln(T_f/T₂) = +67.6 J/K","explain":"(1) 绝热混合，m₁c(T₁ − T_f) = m₂c(T_f − T₂)，得 T_f = (2.00×350 + 1.00×280)/3.00 = 326.7 K。\n(2) ΔS = 2.00×4.18×10³×ln(326.7/350) + 1.00×4.18×10³×ln(326.7/280)\n= −577 + 644 = +67.6 J/K > 0。\n易错点：用 Q/T 在平均温度下算；漏掉质量比。"},{"id":"c10q043","type":"calc","difficulty":5,"tags":["自由膨胀","等容升温","态函数"],"stem":"1.00 mol 理想气体（C_V = 1.5R）初始 300 K、10.0 L，先向真空自由膨胀到 30.0 L，再在等容下加热到 400 K。求：(1) 全过程熵变（写出符号表达式）；(2) 若改为从同一初态经等温可逆膨胀到 30.0 L 再等容加热，熵变是否相同，说明理由。","answer":"(1) ΔS = R ln3 + C_V ln(4/3) = 12.7 J/K；(2) 相同，熵是态函数","explain":"(1) 自由膨胀温度不变，ΔS₁ = R ln(30.0/10.0) = R ln3 = 9.13 J/K；等容升温 ΔS₂ = C_V ln(400/300) = 1.5×8.31×0.2877 = 3.59 J/K；总计 12.7 J/K。\n(2) 两条路径初末态相同，熵是态函数，故 ΔS 相同；但自由膨胀 Q = 0，等温可逆膨胀 Q = W ≠ 0，过程热量不同。\n易错点：自由膨胀不能用 Q/T 算（Q = 0 但 ΔS ≠ 0），必须设计可逆路径。"},{"id":"c10q044","type":"calc","difficulty":5,"tags":["卡诺热机串联","中间温度","总效率"],"stem":"两个卡诺热机串联：第一台从 700 K 热源吸热 Q₁，向中间温度 T 的热源放热；第二台从中间热源吸热，向 350 K 热源放热。已知两机每周期输出功相等。求：(1) 中间温度 T（符号表达式）；(2) 总效率；(3) 若 Q₁ = 2.00 kJ，第一台向中间热源放出的热量。","answer":"(1) T = (T₁ + T₃)/2 = 525 K；(2) η = 1 − T₃/T₁ = 50.0%；(3) Q_中 = Q₁T/T₁ = 1.50 kJ","explain":"(1) W₁ = Q₁(1 − T/T₁)，W₂ = Q₁(T/T₁)(1 − T₃/T)。令 W₁ = W₂，得 1 − T/T₁ = T/T₁ − T₃/T₁，故 T = (T₁ + T₃)/2 = 525 K。\n(2) η = 1 − T₃/T₁ = 1 − 350/700 = 0.500；两机均无熵产，总效率与中间温度无关。\n(3) Q_中 = Q₁T/T₁ = 2000×525/700 = 1.50 kJ，每台做功 500 J。\n易错点：误用几何平均 √(T₁T₃)（那是两机效率相等的条件）；总效率不是两机效率相加。"},{"id":"c10q045","type":"calc","difficulty":5,"tags":["热力学基本方程","物态方程","熵变积分"],"stem":"1.00 mol 某实际气体的状态方程为 p(V − b) = RT（b 为常数，R = 8.31 J/(mol·K)），其内能只是温度的函数。求：(1) 用热力学基本方程证明等温过程中熵变 ΔS = R ln((V₂ − b)/(V₁ − b))；(2) 取 b = 0.500 L/mol，V₁ = 2.00 L，V₂ = 8.00 L，计算 ΔS。","answer":"(1) ΔS = R ln((V₂ − b)/(V₁ − b))；(2) ΔS = R ln5 = 13.4 J/K","explain":"(1) 由 dU = TdS − pdV，等温时 dU = 0（内能只是 T 的函数），故 TdS = pdV，dS = (p/T)dV。\n由状态方程 p/T = R/(V − b)，积分得 ΔS = R ln((V₂ − b)/(V₁ − b))。\n(2) ΔS = 8.31×ln((8.00 − 0.500)/(2.00 − 0.500)) = 8.31×ln(7.50/1.50) = 8.31×1.609 = 13.4 J/K。\n易错点：把 p/T 写成 R/V、直接忽略 b，会得到 11.5 J/K；b 只在体积项中出现，不能加在温度项上。"},{"id":"c10q046","type":"calc","difficulty":5,"tags":["有限物体冷却","制冷机","最小功"],"stem":"用一台制冷机把 2.00 kg 的水（c = 4.18×10³ J/(kg·K)）从 300 K 冷却到 275 K，制冷机向 300 K 的环境放热。求：(1) 水放出的热量；(2) 水与环境的熵变；(3) 至少需要消耗的功（写出符号表达式并代入数值）。","answer":"(1) Q_c = mc(T₁ − T₂) = 2.09×10⁵ J；(2) ΔS_水 = mc ln(T₂/T₁) = −727 J/K，环境 +727 J/K；(3) W_min = mc[T_h ln(T₁/T₂) − (T₁ − T₂)] = 9.22×10³ J","explain":"(1) Q_c = 2.00×4.18×10³×25.0 = 2.09×10⁵ J。\n(2) ΔS_水 = mc ln(275/300) = 8.36×10³×(−0.08701) = −727 J/K；可逆极限下环境熵变为 +727 J/K。\n(3) 环境吸热 Q_h = T_h|ΔS_水| = 300×727 = 2.18×10⁵ J，故 W_min = Q_h − Q_c = 2.18×10⁵ − 2.09×10⁵ = 9.22×10³ J。\n符号式：W_min = mc[T_h ln(T₁/T₂) − (T₁ − T₂)]。\n易错点：直接用卡诺 COP 乘 Q_c；水温在变，COP 不是常数。"},{"id":"c10q047","type":"calc","difficulty":5,"tags":["过冷水结冰","三段熵变","环境熵变"],"stem":"1.00 kg 的过冷水在 −10.0 °C 凝固成 −10.0 °C 的冰，环境温度保持 −10.0 °C。冰的比热容 2.10×10³ J/(kg·K)，水的比热容 4.18×10³ J/(kg·K)，0 °C 时冰的熔化热 3.34×10⁵ J/kg。求：(1) 水的熵变（分三段）；(2) 环境的熵变；(3) 总熵变并判断过程是否自发。","answer":"(1) ΔS_水 = mc_水 ln(273/263) − mL/273 + mc_冰 ln(263/273) = −1.15×10³ J/K；(2) +1.19×10³ J/K；(3) ΔS_总 = +45.3 J/K > 0，自发","explain":"(1) 把过冷水的 −10 °C 到 −10 °C 冰拆成三段可逆路径取积分：水从 263 K 升温到 273 K：mc_水 ln(273/263) = 4.18×10³×0.03734 = +156 J/K；在 273 K 凝固：−mL/273 = −3.34×10⁵/273 = −1223 J/K；冰从 273 K 降温到 263 K：mc_冰 ln(263/273) = 2.10×10³×(−0.03731) = −78.4 J/K。合计 ΔS_水 = 156 − 1223 − 78.4 = −1.15×10³ J/K。(2) 关键在放热量的算法：过冷水温低于冰点，凝固前必须先「吸收」热量升到 0 °C，所以对外实际放热 Q = mL + mc_冰×10 − mc_水×10 = 3.34×10⁵ + 2.10×10⁴ − 4.18×10⁴ = 3.13×10⁵ J，而不是三段绝对值相加的 3.97×10⁵ J。环境在 263 K 吸热，ΔS_环 = Q/263 = 3.13×10⁵/263 = +1.19×10³ J/K。(3) ΔS_总 = 1.19×10³ − 1.15×10³ = +45.3 J/K > 0，说明过冷水凝固在熔点以下仍是自发过程（有结晶核时）。易错点：把过冷水升温段也当成放热（会得到 +363 J/K）；相变热用 273 K 算水却用 263 K 算环境；漏掉冰的降温段。"},{"id":"c10q048","type":"calc","difficulty":5,"tags":["斯特林循环","回热器","循环效率"],"stem":"1.00 mol 理想气体（C_V = 1.5R）经历如下循环：① 在 400 K 下等温膨胀，体积由 V₁ 增到 2V₁；② 等容冷却到 300 K；③ 在 300 K 下等温压缩回 V₁；④ 等容加热回到 400 K。求：(1) 每周期净功；(2) 无回热器时的热效率；(3) 有理想回热器时的热效率，并与同温限卡诺效率比较。","answer":"(1) W = R(T₁ − T₂)ln2 = 576 J；(2) 16.2%；(3) 25.0%，等于卡诺效率","explain":"(1) W = RT₁ln2 − RT₂ln2 = R ln2(400 − 300) = 8.31×0.693×100 = 576 J。\n(2) 无回热器时吸热包括等温膨胀 2304 J 和等容升温 1247 J，Q_吸 = 3551 J，η = 576/3551 = 0.162。\n(3) 理想回热器用等容冷却放出的 1247 J 加热等容升温段，外部吸热只剩 2304 J，η = 576/2304 = 0.250 = 1 − 300/400，与卡诺效率相同。\n易错点：把等容段的热量重复计入吸热；认为斯特林效率一定低于卡诺。"},{"id":"c10q049","type":"calc","difficulty":5,"tags":["克劳修斯不等式","三热源循环","最大功"],"stem":"某循环每周期从 500 K 热源吸热 6.00×10² J，从 400 K 热源吸热 3.00×10² J，向 300 K 热源放热 Q₀，对外做功 W。求：(1) 由能量守恒写出 Q₀ 与 W 的关系；(2) 用克劳修斯不等式求 W 的最大值；(3) 若某方案声称 W = 4.00×10² J，判断是否可能。","answer":"(1) Q₀ = 900 J − W；(2) W_max = 315 J；(3) 不可能","explain":"(1) 900 = Q₀ + W，故 Q₀ = 900 − W。\n(2) 可逆极限 ΣQ/T = 0：600/500 + 300/400 − Q₀/300 = 0，得 Q₀ = 300×(1.20 + 0.75) = 585 J；W_max = 900 − 585 = 315 J。\n(3) W = 400 J 时 Q₀ = 500 J，ΣQ/T = 1.20 + 0.75 − 500/300 = +0.283 J/K > 0，违反克劳修斯不等式，不可能。\n易错点：只检查能量守恒；把放热项的符号写反。"},{"id":"c10q050","type":"calc","difficulty":5,"tags":["汽化","相变熵变","吉布斯自由能"],"stem":"1.00 mol 水在 373 K、1 atm 下汽化为水蒸气，汽化热为 4.07×10⁴ J/mol。求：(1) 汽化熵变；(2) 373 K 时的 ΔG；(3) 393 K 时的 ΔG（假设 ΔH、ΔS 近似不变），并判断 393 K、1 atm 下水能否自发汽化。","answer":"(1) ΔS = ΔH/T = 109 J/K；(2) ΔG = 0；(3) ΔG = −2.18×10³ J，能自发","explain":"(1) ΔS = ΔH/T = 4.07×10⁴/373 = 109 J/K。\n(2) ΔG = ΔH − TΔS = 4.07×10⁴ − 373×109 = 0，373 K、1 atm 是水与水蒸气的平衡温度。\n(3) ΔG(393 K) = 4.07×10⁴ − 393×109 = 4.07×10⁴ − 4.28×10⁴ = −2.18×10³ J \u003c 0，故 393 K、1 atm 下水会自发汽化（沸腾）。\n易错点：把 373 K 的 ΔG = 0 当成所有温度都平衡；用摄氏度代入 T。"}]},{"chapter":11,"chapterName":"静电场（真空）","questions":[{"id":"c11q001","type":"choice","difficulty":3,"tags":["库仑定律","平衡位置"],"stem":"两个点电荷 q₁ = +4.00 μC 固定在 x = 0，q₂ = +1.00 μC 固定在 x = 0.300 m。将第三个点电荷 +q 放在它们连线上，使 +q 所受合力为零，其位置应在","options":["x = 0.240 m 处","x = 0.200 m 处","x = 0.100 m 处","x = 0.0600 m 处"],"answer":"B","explain":"合力为零的点只能在两电荷之间：外侧两电荷的场同向，不可能抵消。\n设该点距 q₁ 为 x，则 k(4.00 μC)q/x² = k(1.00 μC)q/(0.300 − x)²，约去 kq 后开方得 2/x = 1/(0.300 − x)。\n解得 x = 0.200 m。易错：0.240 m 是把 4:1 直接按距离分配、忘了开方；0.0600 m 是把比例反了过来。"},{"id":"c11q002","type":"choice","difficulty":3,"tags":["电偶极子","力矩与势能"],"stem":"电偶极矩 p = 3.00×10⁻⁹ C·m 与均匀外电场 E = 4.00×10⁵ N/C 的夹角为 60.0°。该偶极子所受力矩的大小和电势能分别为","options":["6.00×10⁻⁴ N·m，−1.04×10⁻³ J","1.04×10⁻³ N·m，+6.00×10⁻⁴ J","1.04×10⁻³ N·m，−6.00×10⁻⁴ J","1.20×10⁻³ N·m，0"],"answer":"C","explain":"力矩 τ = pE sinθ = 3.00×10⁻⁹×4.00×10⁵×sin60.0° = 1.04×10⁻³ N·m。\n电势能 U = −pE cosθ = −3.00×10⁻⁹×4.00×10⁵×0.500 = −6.00×10⁻⁴ J。\n易错：把 sin 与 cos 对调会得到 6.00×10⁻⁴ N·m 和 −1.04×10⁻³ J；U 的负号漏掉则变成 +6.00×10⁻⁴ J。"},{"id":"c11q003","type":"choice","difficulty":4,"tags":["圆环轴线上场强","叠加积分"],"stem":"半径 R = 0.120 m 的细圆环均匀带电 Q = +5.00×10⁻⁹ C。环轴线上距环心 x = 0.0900 m 处的电场强度大小为","options":["1.20×10³ N/C","1.80×10² N/C","3.13×10³ N/C","5.56×10³ N/C"],"answer":"A","explain":"取环上电荷元 dq，其场沿轴分量 dE_x = k dq x/(R² + x²)^(3/2)，垂直轴分量由对称性抵消。\nE = kQx/(R² + x²)^(3/2) = 9.0×10⁹×5.00×10⁻⁹×0.0900/(0.0225)^(3/2) = 4.05/3.375×10⁻³ = 1.20×10³ N/C。\n易错：漏掉 3/2 次方得 1.80×10² N/C；直接用 kQ/R² 得 3.13×10³ N/C；把分母误写成 x³ 得 5.56×10³ N/C。"},{"id":"c11q004","type":"choice","difficulty":4,"tags":["无限大带电平板","场强叠加"],"stem":"真空中两块无限大平行薄板垂直于 x 轴放置：x = 0 处电荷面密度 σ₁ = +2.00×10⁻⁸ C/m²，x = 0.100 m 处 σ₂ = −4.00×10⁻⁸ C/m²。两板之间及左板左侧的电场强度分别为","options":["3.39×10³ N/C 沿 +x，1.13×10³ N/C 沿 −x","6.78×10³ N/C 沿 +x，1.13×10³ N/C 沿 +x","3.39×10³ N/C 沿 −x，1.13×10³ N/C 沿 +x","3.39×10³ N/C 沿 +x，1.13×10³ N/C 沿 +x"],"answer":"D","explain":"单块无限大带电薄板产生 E = σ/(2ε₀) 的匀强场，方向背离正电荷、指向负电荷。\n两板之间：正板场向右，负板场也向右，E = (2.00 + 4.00)×10⁻⁸/(2×8.85×10⁻¹²) = 3.39×10³ N/C，沿 +x。\n左板左侧：正板场向左 1.13×10³ N/C，负板场向右 2.26×10³ N/C，合场 1.13×10³ N/C，沿 +x。\n易错：漏掉 2ε₀ 中的 2 得 6.78×10³ N/C；只看一块板会把左侧合场算成 565 N/C 或方向判反。"},{"id":"c11q005","type":"choice","difficulty":4,"tags":["高斯定理","球壳内场"],"stem":"半径 R = 0.200 m 的薄球壳均匀带电 Q壳 = +8.00×10⁻⁹ C，球心处固定点电荷 Q = −2.00×10⁻⁹ C。距球心 r = 0.100 m 和 r = 0.300 m 处的电场强度分别为","options":["1.80×10³ N/C 沿径向向外；6.00×10² N/C 沿径向向外","1.80×10³ N/C 指向球心；6.00×10² N/C 沿径向向外","0；6.00×10² N/C 沿径向向外","1.80×10³ N/C 指向球心；1.00×10³ N/C 沿径向向外"],"answer":"B","explain":"r \u003c R 时高斯面只包围球心点电荷，球壳本身在壳内不产生场：E = k(2.00×10⁻⁹)/0.100² = 1.80×10³ N/C，方向指向球心（场源为负电荷）。\nr > R 时高斯面包围总电荷 +6.00×10⁻⁹ C：E = 9.0×10⁹×6.00×10⁻⁹/0.300² = 6.00×10² N/C，沿径向向外。\n易错：以为球壳在壳内也有场；或把 r > R 时总电荷仍取 −2.00×10⁻⁹ C。"},{"id":"c11q006","type":"choice","difficulty":5,"tags":["非均匀带电球体","高斯定理","体电荷积分"],"stem":"半径 R = 0.200 m 的球体内体电荷密度 ρ = ρ₀(1 − r/R)，其中 ρ₀ = 3.00×10⁻⁶ C/m³，r 为到球心的距离。r = R/2 处的电场强度大小为","options":["7.06×10³ N/C","1.13×10⁴ N/C","2.26×10⁴ N/C","5.65×10³ N/C"],"answer":"A","explain":"先求半径 r 内的电荷：Q内 = ∫₀ʳ 4πr′²ρ₀(1 − r′/R)dr′ = 4πρ₀(r³/3 − r⁴/(4R))。\n由高斯定理 E = kQ内/r² = (ρ₀/ε₀)(r/3 − r²/(4R))。\n取 r = R/2：E = (ρ₀R/ε₀)(1/6 − 1/16) = 5ρ₀R/(48ε₀) = 5×3.00×10⁻⁶×0.200/(48×8.85×10⁻¹²) = 7.06×10³ N/C。\n易错：直接套均匀球公式 ρr/(3ε₀) 得 1.13×10⁴ N/C；用总电荷当 Q内 得 2.26×10⁴ N/C；把表面场当该点场得 5.65×10³ N/C。"},{"id":"c11q007","type":"choice","difficulty":4,"tags":["高斯定理","同轴圆柱面"],"stem":"两根同轴无限长薄圆柱面，半径分别为 a = 0.0500 m、b = 0.150 m，单位长度电荷分别为 λ₁ = +3.00×10⁻⁹ C/m、λ₂ = −5.00×10⁻⁹ C/m。r = 0.100 m 与 r = 0.250 m 处的电场强度分别为","options":["540 N/C 向外；144 N/C 向外","540 N/C 向外；360 N/C 向内","540 N/C 向外；144 N/C 向内","0；144 N/C 向内"],"answer":"C","explain":"取同轴圆柱形高斯面，E 只有径向分量：E·2πrL = λ内L/ε₀，即 E = λ内/(2πε₀r) = 2kλ内/r。\nr = 0.100 m 在兩柱面之间，只包围内柱：E = 2×9.0×10⁹×3.00×10⁻⁹/0.100 = 540 N/C，向外。\nr = 0.250 m 在两柱面之外，包围总电荷 λ内 = −2.00×10⁻⁹ C/m：E = 2×9.0×10⁹×2.00×10⁻⁹/0.250 = 144 N/C，方向向内。\n易错：外层场只算外柱 λ₂ 得 360 N/C；以为柱面外场为零。"},{"id":"c11q008","type":"choice","difficulty":5,"tags":["有限长带电直线","电势积分"],"stem":"长 L = 1.20 m 的均匀带电直线，线电荷密度 λ = +2.00×10⁻⁹ C/m。在直线的中垂线上、距直线 d = 0.400 m 处的电势（取无穷远为零）为","options":["21.5 V","86.0 V","32.7 V","43.0 V"],"answer":"D","explain":"取直线上距中点 x 处的电荷元 λdx，它到该点的距离为 √(x² + d²)，故\nU = ∫₋L/2^(L/2) kλdx/√(x² + d²) = 2kλ ln[(L/2 + √(L²/4 + d²))/d]。\n代入 L/2 = 0.600 m、√(0.360 + 0.160) = 0.721 m：比值 = 1.321/0.400 = 3.30，ln3.30 = 1.19。\nU = 2×9.0×10⁹×2.00×10⁻⁹×1.19 = 43.0 V。\n易错：漏掉因子 2 得 21.5 V；把 2kλ 再乘 2 得 86.0 V；按一端为原点积分得 32.7 V。"},{"id":"c11q009","type":"choice","difficulty":3,"tags":["圆环轴线电势","电势差"],"stem":"半径 R = 0.150 m 的细圆环均匀带电 Q = +6.00×10⁻⁹ C。环心与轴线上 x = 0.200 m 处的电势差 U心 − Ux 为","options":["−144 V","+144 V","+360 V","+216 V"],"answer":"B","explain":"圆环轴线上任一点到各电荷元距离相等，U = kQ/√(R² + x²)。\n环心：U心 = kQ/R = 9.0×10⁹×6.00×10⁻⁹/0.150 = 360 V。\nx = 0.200 m：距离 √(0.0225 + 0.0400) = 0.250 m，Ux = 54.0/0.250 = 216 V。\n故 U心 − Ux = 360 − 216 = +144 V。易错：把差值写成 Ux − U心 得 −144 V；只算其中一个电势会误选 360 V 或 216 V。"},{"id":"c11q010","type":"choice","difficulty":5,"tags":["圆盘轴线电势","积分法"],"stem":"半径 R = 0.100 m 的薄圆盘均匀带电，面电荷密度 σ = +4.00×10⁻⁸ C/m²。圆盘轴线上距盘心 x = 0.100 m 处的电势为","options":["93.6 V","187 V","320 V","226 V"],"answer":"A","explain":"把圆盘分成半径 r、宽 dr 的圆环，环上电荷 dq = σ2πrdr，它到轴线上该点的距离为 √(r² + x²)。\nU = ∫₀ᴿ kσ2πrdr/√(r² + x²) = σ/(2ε₀)(√(R² + x²) − x)。\nσ/(2ε₀) = 4.00×10⁻⁸/(2×8.85×10⁻¹²) = 2.26×10³ V/m，括号内 = 0.1414 − 0.100 = 0.0414 m。\nU = 2.26×10³×0.0414 = 93.6 V。\n易错：漏掉 2ε₀ 中的 2 得 187 V；只算 √(R² + x²) 项得 320 V；只算 x 项得 226 V。"},{"id":"c11q011","type":"choice","difficulty":3,"tags":["电势梯度","电场分量"],"stem":"空间电势分布为 U = 2.00x²y − 3.00y²（SI 单位）。点 (1.00 m, 2.00 m) 处的电场强度为","options":["(8.00 i − 10.0 j) V/m","(−4.00 i + 10.0 j) V/m","(−8.00 i + 10.0 j) V/m","(−8.00 i + 2.00 j) V/m"],"answer":"C","explain":"由 E = −∇U 得分量 Eₓ = −∂U/∂x = −4xy，E_y = −∂U/∂y = −(2x² − 6y)。\n代入 x = 1.00 m、y = 2.00 m：Eₓ = −8.00 V/m，E_y = −(2.00 − 12.0) = +10.0 V/m。\n故 E = (−8.00 i + 10.0 j) V/m。\n易错：忘记负号得 (8.00 i − 10.0 j)；对 x 求导漏掉因子 2 得 −4.00；对 y 求导时漏掉 −6y 项得 +2.00。"},{"id":"c11q012","type":"choice","difficulty":5,"tags":["环路定理","非保守场"],"stem":"某区域电场 E = (3.00y i + 5.00x j) V/m（SI 单位）。沿单位正方形回路 (0,0) → (1.00 m,0) → (1.00 m,1.00 m) → (0,1.00 m) → (0,0) 的环流 ∮E·dl 为","options":["0，该场为保守场","2.00 V，该场为非保守场","8.00 V，该场为非保守场","−2.00 V，该场为非保守场"],"answer":"B","explain":"分段积分：下边 y = 0，Eₓ = 0，贡献 0；右边 x = 1，E_y = 5.00 V/m，沿 +y 积 1 m，贡献 +5.00 V；\n上边 y = 1，Eₓ = 3.00 V/m，沿 −x 积 1 m，贡献 −3.00 V；左边 x = 0，E_y = 0，贡献 0。\n环流 = 5.00 − 3.00 = 2.00 V ≠ 0，故为非保守场。\n也可用旋度：∇×E 的 z 分量 = ∂E_y/∂x − ∂Eₓ/∂y = 5.00 − 3.00 = 2.00 V/m² ≠ 0。\n易错：只看 Eₓ 或 E_y 其中一个会得 0；把四段都取正得 8.00 V。"},{"id":"c11q013","type":"choice","difficulty":4,"tags":["带电粒子运动","抛体类比"],"stem":"均匀电场 E = 2.00×10⁴ N/C 沿 +y 方向。质量 m = 2.00×10⁻³ kg、电荷 q = +1.00×10⁻⁶ C 的粒子从原点以 v₀ = 10.0 m/s、与 +x 方向成 30.0° 射出，忽略重力。粒子回到 y = 0 时的水平射程和轨迹最高点高度分别为","options":["17.3 m，1.25 m","8.66 m，2.50 m","5.00 m，1.25 m","8.66 m，1.25 m"],"answer":"D","explain":"加速度沿 +y：a = qE/m = 1.00×10⁻⁶×2.00×10⁴/2.00×10⁻³ = 10.0 m/s²。\n初速分量 vₓ = 10.0cos30.0° = 8.66 m/s，v_y = 10.0sin30.0° = 5.00 m/s。\n回到 y = 0 的时间 t = 2v_y/a = 1.00 s，水平射程 x = vₓt = 8.66 m。\n最高点高度 h = v_y²/(2a) = 1.25 m。\n易错：把 v₀ 全当水平分量得 5.00 m；忘记时间因子 2 得 17.3 m；高度漏掉 1/2 得 2.50 m。"},{"id":"c11q014","type":"choice","difficulty":5,"tags":["点电荷系统","电势能"],"stem":"三个点电荷位于边长 a = 0.200 m 的等边三角形顶点：q₁ = +2.00 μC，q₂ = −3.00 μC，q₃ = +4.00 μC。该系统总电势能为","options":["−0.450 J","+0.450 J","−0.225 J","−0.675 J"],"answer":"A","explain":"三电荷系统共有三对相互作用：U = k(q₁q₂ + q₂q₃ + q₃q₁)/a。\n乘积之和 = (2.00)(−3.00) + (−3.00)(4.00) + (4.00)(2.00) = −6.00 − 12.0 + 8.00 = −10.0 (μC)²。\nk/a = 9.0×10⁹/0.200 = 4.50×10¹⁰ N·m/C²，U = 4.50×10¹⁰×(−10.0×10⁻¹²) = −0.450 J。\n易错：只算两对得 −0.225 J；符号取反得 +0.450 J；把 q₃q₁ 写成负号会得 −0.675 J。"},{"id":"c11q015","type":"choice","difficulty":5,"tags":["电场能量","能量密度积分"],"stem":"点电荷 Q = +3.00×10⁻⁹ C 位于真空。在 r₁ = 0.100 m 到 r₂ = 0.200 m 的球壳空间内，电场总能量为","options":["4.05×10⁻⁷ J","1.01×10⁻⁷ J","2.03×10⁻⁷ J","2.03×10⁻⁶ J"],"answer":"C","explain":"场强 E = kQ/r²，能量密度 u = ½ε₀E²，体积元 dV = 4πr²dr。\nU = ∫½ε₀(kQ/r²)²4πr²dr = kQ²/2 ∫dr/r² = kQ²/2 (1/r₁ − 1/r₂)。\nkQ²/2 = 9.0×10⁹×(3.00×10⁻⁹)²/2 = 4.05×10⁻⁸ J·m；括号内 = 10.0 − 5.00 = 5.00 m⁻¹。\nU = 4.05×10⁻⁸×5.00 = 2.03×10⁻⁷ J。\n易错：漏掉 ½ 得 4.05×10⁻⁷ J；只积到 r₁ 或只取一端得 1.01×10⁻⁷ J；把 4π 漏掉会差一个量级。"},{"id":"c11q016","type":"choice","difficulty":5,"tags":["同心球壳","电势差"],"stem":"两个同心薄球壳，半径分别为 a = 0.0500 m、b = 0.150 m，内壳带电 +2.00×10⁻⁹ C，外壳带电 −2.00×10⁻⁹ C。r = 0.100 m 处场强及两壳间电势差 U_a − U_b 分别为","options":["1.80×10³ N/C 沿径向向外；120 V","1.80×10³ N/C 沿径向向外；240 V","0；240 V","1.80×10³ N/C 沿径向向内；480 V"],"answer":"B","explain":"r = 0.100 m 在两壳之间，高斯面只包围内壳 +2.00×10⁻⁹ C：E = kQ/r² = 9.0×10⁹×2.00×10⁻⁹/0.100² = 1.80×10³ N/C，向外。\n两壳间 U_a − U_b = ∫ₐᵇ E dr = kQ(1/a − 1/b) = 18.0×(20.0 − 6.67) = 240 V。\nr > b 时总电荷为零，壳外场为零，但这不影响两壳间积分。\n易错：用外壳半径 b 代替 r 得 120 V；以为两壳间场为零得 0；把内壳电荷符号取反得向内、−480 V。"},{"id":"c11q017","type":"choice","difficulty":4,"tags":["均匀带电球体","球内电势"],"stem":"半径 R = 0.150 m 的均匀带电球体，总电荷 Q = +3.00×10⁻⁹ C。球心与球面处的电势差 U心 − U面为","options":["180 V","270 V","45.0 V","90.0 V"],"answer":"D","explain":"球外电势 U = kQ/r，球面处 U面 = kQ/R = 9.0×10⁹×3.00×10⁻⁹/0.150 = 180 V。\n球内场 E = kQr/R³，从球心积到球面：U心 − U面 = ∫₀ᴿ kQr/R³ dr = kQ/(2R) = 90.0 V。\n也可用球内电势公式 U(r) = kQ(3R² − r²)/(2R³)，令 r = 0 得 U心 = 3kQ/(2R) = 270 V。\n易错：把 U心 直接当成 3kQ/(2R) 却忘减 U面 得 270 V；把差值写成 kQ/R 得 180 V；漏掉因子 1/2 得 45.0 V。"},{"id":"c11q018","type":"choice","difficulty":5,"tags":["球形空腔","场强叠加"],"stem":"半径 R = 0.200 m 的均匀带电球体，体电荷密度 ρ = +5.00×10⁻⁶ C/m³。在球内挖去一个半径 R/2 的球形空腔，空腔中心在 x = R/2 处。空腔内电场为","options":["1.88×10⁴ N/C，沿 +x","0","3.77×10⁴ N/C，沿 +x","9.42×10³ N/C，沿 +x"],"answer":"A","explain":"把挖空球看成“完整均匀球 + 一个半径 R/2、体密度 −ρ 的小球”的叠加。\n完整球内 E₁ = ρr/(3ε₀)；空腔球内 E₂ = −ρ(r − a)/(3ε₀)，其中 a 是从球心指向空腔中心的矢量。\n两者相加得空腔内 E = ρa/(3ε₀)，与位置无关，是匀强场。\n大小 = 5.00×10⁻⁶×0.100/(3×8.85×10⁻¹²) = 1.88×10⁴ N/C，方向沿 a，即 +x。\n易错：以为空腔内无场得 0；漏掉叠加中的负号得 3.77×10⁴ N/C；把小球的半径当 a 得 9.42×10³ N/C。"},{"id":"c11q019","type":"choice","difficulty":4,"tags":["电势叠加","零电势点"],"stem":"两个点电荷 q₁ = +4.00×10⁻⁹ C 位于 x = 0，q₂ = −1.00×10⁻⁹ C 位于 x = 0.300 m。在 x > 0.300 m 的区域内，电势为零的点到原点的距离为","options":["0.240 m","0.375 m","0.400 m","0.600 m"],"answer":"C","explain":"x > 0.300 m 时该点到 q₁ 的距离为 x，到 q₂ 的距离为 x − 0.300，电势 U = k[4.00×10⁻⁹/x − 1.00×10⁻⁹/(x − 0.300)]。\n令 U = 0：4/x = 1/(x − 0.300)，即 4(x − 0.300) = x，3x = 1.20，x = 0.400 m。\n易错：0.240 m 是两电荷之间的零电势点（解 4/(0.300 − x) = 1/x）；0.375 m 和 0.600 m 来自把距离比写反或漏掉 0.300 的平移。"},{"id":"c11q020","type":"choice","difficulty":4,"tags":["带电粒子偏转","平行板电场"],"stem":"电子以 v₀ = 2.00×10⁷ m/s 沿水平方向进入长 L = 0.0500 m 的平行板区域，板间电场 E = 1.00×10⁴ N/C 竖直向上，忽略重力。电子离开电场时竖直方向的偏转量和速度偏转角分别为（e = 1.60×10⁻¹⁹ C，m_e = 9.11×10⁻³¹ kg）","options":["5.50 mm，6.30°","5.50 mm，12.4°","11.0 mm，12.4°","2.75 mm，12.4°"],"answer":"B","explain":"电子在板间做类平抛运动：水平方向匀速，t = L/v₀ = 0.0500/2.00×10⁷ = 2.50×10⁻⁹ s。\n竖直加速度 a = eE/m_e = 1.60×10⁻¹⁹×1.00×10⁴/9.11×10⁻³¹ = 1.76×10¹⁵ m/s²。\n偏转量 y = ½at² = ½×1.76×10¹⁵×(2.50×10⁻⁹)² = 5.50×10⁻³ m。\n出射竖直速度 v_y = at = 4.40×10⁶ m/s，tanθ = v_y/v₀ = 0.220，θ = 12.4°。\n易错：漏掉 ½ 得 11.0 mm；把 θ 当成 tanθ/2 得 6.30°；只用一半板长得 2.75 mm。"},{"id":"c11q021","type":"choice","difficulty":4,"tags":["高斯定理","立方体通量"],"stem":"点电荷 q = +2.40×10⁻⁹ C 放在一个立方体的一个顶点上。通过与该顶点相对的三个面中任意一个面的电通量为","options":["33.9 N·m²/C","2.82 N·m²/C","0","11.3 N·m²/C"],"answer":"D","explain":"把 8 个同样的立方体拼成一个大立方体，电荷位于大立方体中心，总通量为 q/ε₀。\n每个小立方体分得 q/(8ε₀)；电荷所在顶点处的三个面与场线平行，通量为零，剩下三个相对面均分这 q/(8ε₀)，每个面为 q/(24ε₀)。\nq/(24ε₀) = 2.40×10⁻⁹/(24×8.85×10⁻¹²) = 11.3 N·m²/C。\n易错：33.9 N·m²/C 是 q/(8ε₀)，即把一个小立方体的总通量当成了单个面的通量；2.82 N·m²/C 是再把 11.3 除以 4；以为三个面平分总通量会误得 0。"},{"id":"c11q022","type":"choice","difficulty":4,"tags":["球壳电势","电势叠加"],"stem":"半径 R = 0.200 m 的薄球壳均匀带电 Q壳 = +6.00×10⁻⁹ C，球心处固定点电荷 q = −2.00×10⁻⁹ C。r = 0.100 m 与 r = 0.300 m 处的电势分别为","options":["90.0 V，120 V","90.0 V，40.0 V","30.0 V，120 V","90.0 V，−120 V"],"answer":"A","explain":"r \u003c R 时球壳内电势等于壳面电势 kQ壳/R，点电荷电势为 kq/r：\nU = 9.0×10⁹×6.00×10⁻⁹/0.200 + 9.0×10⁹×(−2.00×10⁻⁹)/0.100 = 270 − 180 = 90.0 V。\nr > R 时球壳可等效为球心点电荷，总电荷为 +4.00×10⁻⁹ C：\nU = 9.0×10⁹×4.00×10⁻⁹/0.300 = 120 V。\n易错：r > R 时只算球壳得 180 V 或只算点电荷得 −60 V；r \u003c R 时把球壳电势按 kQ/r 算会得 270 V。"},{"id":"c11q023","type":"choice","difficulty":3,"tags":["电场力做功","电势能"],"stem":"点电荷 Q = +2.00×10⁻⁹ C 固定于原点。将点电荷 q = +1.00×10⁻⁹ C 从 r = 0.100 m 沿任意路径移到 r = 0.300 m，外力所做的功为","options":["+1.20×10⁻⁷ J","−2.40×10⁻⁷ J","−1.20×10⁻⁷ J","0"],"answer":"C","explain":"静电场力做功与路径无关，外力做功等于电势能的增量：W外 = q(U₂ − U₁)。\nU₁ = kQ/0.100 = 180 V，U₂ = kQ/0.300 = 60.0 V，U₂ − U₁ = −120 V。\nW外 = 1.00×10⁻⁹×(−120) = −1.20×10⁻⁷ J；电场力做正功 +1.20×10⁻⁷ J。\n易错：把外力做功与电场力做功弄反得 +1.20×10⁻⁷ J；把电势差乘 2 得 −2.40×10⁻⁷ J；以为沿不同路径做功不同而选 0。"},{"id":"c11q024","type":"choice","difficulty":4,"tags":["电势叠加","正方形"],"stem":"边长 a = 0.200 m 的正方形四个顶点分别放置 +2.00×10⁻⁹ C、+2.00×10⁻⁹ C、+2.00×10⁻⁹ C、−2.00×10⁻⁹ C 的点电荷。正方形中心处的电势为","options":["127 V","255 V","0","509 V"],"answer":"B","explain":"中心到每个顶点的距离都是 a/√2 = 0.200/1.414 = 0.1414 m。\n电势是标量，直接代数相加：Σq = 3×2.00×10⁻⁹ − 2.00×10⁻⁹ = +4.00×10⁻⁹ C。\nU = kΣq/r = 9.0×10⁹×4.00×10⁻⁹/0.1414 = 255 V。\n易错：把负电荷的贡献也取正得 509 V；只算一个电荷得 127 V；以为两正两负抵消得 0。"},{"id":"c11q025","type":"choice","difficulty":5,"tags":["带电圆弧","场强积分"],"stem":"半径 R = 0.100 m 的细绝缘半圆环均匀带电，线电荷密度 λ = +3.00×10⁻⁹ C/m。半圆环圆心处的电场强度大小为","options":["270 N/C","1.08×10³ N/C","5.40×10³ N/C","540 N/C"],"answer":"D","explain":"取圆心为原点、半圆环关于 y 轴对称。电荷元 dq = λR dθ 在圆心产生 dE = kdq/R²，其 x 分量成对抵消，只剩沿对称轴的分量 dE_y = (kλ/R)sinθ dθ。\nE = ∫₀^π (kλ/R)sinθ dθ = 2kλ/R = 2×9.0×10⁹×3.00×10⁻⁹/0.100 = 540 N/C。\n易错：漏掉因子 2 得 270 N/C；把 R 放到平方里得 5.40×10³ N/C；把线电荷总长当 2πR 得 1.08×10³ N/C。"},{"id":"c11q026","type":"choice","difficulty":4,"tags":["点电荷场强","矢量叠加"],"stem":"点电荷 q₁ = +4.00×10⁻⁹ C 位于 (0,0)，q₂ = −4.00×10⁻⁹ C 位于 (0.300 m,0)。点 (0.150 m,0.200 m) 处的电场强度为","options":["691 N/C，沿 +x","691 N/C，沿 +y","1.15×10³ N/C，沿 +x","576 N/C，沿 +x"],"answer":"A","explain":"该点到两电荷的距离均为 √(0.150² + 0.200²) = 0.250 m，每个电荷产生的场强大小都是 k×4.00×10⁻⁹/0.250² = 576 N/C。\nq₁ 的场沿 (0.150,0.200) 方向，分量为 (346,461) N/C；q₂ 为负电荷，场指向 q₂，沿 (0.150,−0.200) 方向，分量为 (346,−461) N/C。\n竖直分量抵消，水平分量相加：E = 691 N/C，沿 +x。\n易错：只算一个电荷得 576 N/C；把两场大小直接相加得 1.15×10³；误以为合场沿 +y。"},{"id":"c11q027","type":"choice","difficulty":4,"tags":["高斯定理","半球面通量"],"stem":"点电荷 q = +8.00×10⁻⁹ C 位于半球面的球心，半球面半径 R = 0.100 m。通过半球曲面部分的电通量为","options":["226 N·m²/C","904 N·m²/C","452 N·m²/C","0"],"answer":"C","explain":"以球心为心的完整球面总通量为 q/ε₀ = 8.00×10⁻⁹/8.85×10⁻¹² = 904 N·m²/C。\n半球曲面和底面圆盘对球心对称，各分得总通量的一半，故曲面通量为 452 N·m²/C。\n易错：忘记除以 2 得 904；再除以 2 得 226；以为曲面与场线平行得 0。"},{"id":"c11q028","type":"choice","difficulty":3,"tags":["匀强电场","路径无关"],"stem":"均匀电场 E = 500 V/m 沿 +x 方向。A 点坐标为 (0,0)，B 点坐标为 (0.300 m,0.400 m)。将 q = +2.00×10⁻⁶ C 从 A 移到 B，电场力做功及 U_A − U_B 分别为","options":["5.00×10⁻⁴ J，250 V","3.00×10⁻⁴ J，150 V","−3.00×10⁻⁴ J，150 V","0，0"],"answer":"B","explain":"匀强电场做功只与沿场方向的位移有关：W = qE·Δr = qEΔx = 2.00×10⁻⁶×500×0.300 = 3.00×10⁻⁴ J。\n电势差 U_A − U_B = EΔx = 500×0.300 = 150 V；沿 y 的位移与场垂直，不贡献电势差。\n易错：用路径总长 0.500 m 得 5.00×10⁻⁴ J 和 250 V；把电场力做功与外力做功符号弄反得 −3.00×10⁻⁴ J。"},{"id":"c11q029","type":"choice","difficulty":4,"tags":["高斯定理","实心圆柱"],"stem":"无限长均匀带电实心圆柱，体电荷密度为 ρ，半径为 R。r = R/2 处与 r = 2R 处电场强度大小之比为","options":["2:1","1:2","4:1","1:1"],"answer":"D","explain":"柱内取半径 r 的高斯柱面：E·2πrL = ρπr²L/ε₀，得 E内 = ρr/(2ε₀)。\nr = R/2 处 E₁ = ρR/(4ε₀)。\n柱外高斯面包围全部电荷 ρπR²L：E外 = ρR²/(2ε₀r)，r = 2R 处 E₂ = ρR/(4ε₀)。\n故 E₁:E₂ = 1:1。易错：柱外误用平方反比得 2:1 或 4:1；柱内误把 E 当常量得 1:2。"},{"id":"c11q030","type":"choice","difficulty":5,"tags":["平行线电荷","场强叠加"],"stem":"两根平行无限长直线电荷，相距 2a = 0.200 m，线电荷密度分别为 +λ 和 −λ，λ = 3.00×10⁻⁹ C/m。在它们连线的中垂线上、距连线中点 y = 0.100 m 处的电场强度为","options":["540 N/C，沿从 +λ 指向 −λ 的方向","382 N/C，沿从 +λ 指向 −λ 的方向","764 N/C，沿从 +λ 指向 −λ 的方向","0"],"answer":"A","explain":"该点到两根线电荷的距离均为 r = √(a² + y²) = √(0.100² + 0.100²) = 0.1414 m。\n每根线电荷产生的场强大小 E₁ = 2kλ/r = 2×9.0×10⁹×3.00×10⁻⁹/0.1414 = 382 N/C。\n+λ 的场背离它，−λ 的场指向它；两者垂直于连线方向的分量相消，平行于连线方向的分量相加。\nE = 2E₁cos45.0° = 2×382×0.707 = 540 N/C，方向从 +λ 指向 −λ。\n易错：只算一根得 382 N/C；把两场直接相加得 764 N/C；以为中垂线上场为零。"},{"id":"c11q031","type":"choice","difficulty":4,"tags":["库仑力","合力"],"stem":"三个点电荷沿 x 轴放置：q₁ = +2.00 μC 在 x = 0，q₂ = −3.00 μC 在 x = 0.200 m，q₃ = +4.00 μC 在 x = 0.500 m。q₂ 所受合力为","options":["2.55 N 沿 −x","1.35 N 沿 −x","0.150 N 沿 −x","0.150 N 沿 +x"],"answer":"C","explain":"q₁ 与 q₂ 异号，q₁ 对 q₂ 的力沿 −x：F₁ = k×2.00×10⁻⁶×3.00×10⁻⁶/0.200² = 1.35 N。\nq₃ 与 q₂ 异号，q₃ 在 q₂ 右侧，对 q₂ 的力沿 +x：F₃ = k×3.00×10⁻⁶×4.00×10⁻⁶/0.300² = 1.20 N。\n合力 = 1.35 − 1.20 = 0.150 N，沿 −x。\n易错：把两力相加得 2.55 N；只算 q₁ 的力得 1.35 N；方向判反得 +x。"},{"id":"c11q032","type":"choice","difficulty":5,"tags":["电偶极子场","轴线与中垂线"],"stem":"电偶极子位于原点，电偶极矩 p = 4.00×10⁻⁹ C·m 沿 +x 方向。在点 (0.300 m, 0.400 m) 处的电场强度大小约为","options":["288 N/C","415 N/C","720 N/C","576 N/C"],"answer":"B","explain":"该点到偶极子中心的距离 r = √(0.300² + 0.400²) = 0.500 m，p 与 r 的夹角余弦 cosθ = 0.300/0.500 = 0.600。\n偶极子场分解为径向和横向：E_r = 2kp cosθ/r³，E_θ = kp sinθ/r³。\nkp/r³ = 9.0×10⁹×4.00×10⁻⁹/0.125 = 288 N/C；E_r = 2×288×0.600 = 346 N/C，E_θ = 288×0.800 = 230 N/C。\n两分量垂直，E = √(346² + 230²) = 415 N/C。\n轴线上 θ = 0 时 E = 2kp/r³，中垂线上 θ = 90° 时 E = kp/r³，本题是两者之间的一般情形。\n易错：只取 kp/r³ 得 288 N/C；把轴线上公式 2kp/r³ 直接搬来（同 r）得 576 N/C；漏掉角度因子得 720 N/C。"},{"id":"c11q033","type":"choice","difficulty":5,"tags":["半球面电荷","场强积分"],"stem":"半径 R = 0.100 m 的均匀带电半球面，面电荷密度 σ = +2.00×10⁻⁸ C/m²。球心处的电场强度大小为","options":["1.13×10³ N/C","283 N/C","0","565 N/C"],"answer":"D","explain":"取球心为原点、半球面对称轴为 z 轴。面元 dA = R²sinθdθdφ，电荷 dq = σdA，在球心产生 dE = kdq/R²，其垂直轴分量相消，只剩沿轴分量 dE cosθ。\nE = ∫ kσ sinθcosθ dθdφ = kσ×2π×½ = kσπ = σ/(4ε₀)。\n代入得 E = 2.00×10⁻⁸/(4×8.85×10⁻¹²) = 565 N/C。\n易错：漏掉 cosθ 得 σ/(2ε₀)=1.13×10³；只积一个象限得 283；以为对称抵消得 0。"},{"id":"c11q034","type":"choice","difficulty":5,"tags":["有限长直线","轴线上场强"],"stem":"长 L = 1.20 m 的均匀带电直线，线电荷密度 λ = +2.00×10⁻⁹ C/m。在直线延长线上、距近端 d = 0.300 m 处的电场强度大小为","options":["48.0 N/C","60.0 N/C","30.0 N/C","15.0 N/C"],"answer":"A","explain":"以近端为原点、沿直线向外为 x 轴，电荷元 λdx 到考察点的距离为 d + x，且各电荷元场强同向。\nE = ∫₀ᴸ kλdx/(d + x)² = kλ[1/d − 1/(d + L)]。\nkλ = 9.0×10⁹×2.00×10⁻⁹ = 18.0 V·m，括号内 = 1/0.300 − 1/1.50 = 3.333 − 0.667 = 2.667 m⁻¹。\nE = 18.0×2.667 = 48.0 N/C，方向沿直线背离带电直线。\n易错：把 d + L 写成 1.20 得 60.0；只取 1/d 得 60.0；把 ln 型电势公式误用于场强得 30.0 或 15.0。"},{"id":"c11q035","type":"choice","difficulty":5,"tags":["平行板电容器","电场能量","定电荷过程"],"stem":"真空中平行板电容器，板面积 S = 0.0200 m²，板间距 d = 1.00 mm，两板间电压 U = 500 V。充电后断开电源，再把板间距缓慢增大到 2.00 mm。原来的电场能量密度、总能量以及增大间距后总能量变为原来的倍数分别为","options":["2.21 J/m³，4.42×10⁻⁵ J，2 倍","1.11 J/m³，2.21×10⁻⁵ J，1/2 倍","1.11 J/m³，2.21×10⁻⁵ J，2 倍","1.11 J/m³，4.42×10⁻⁵ J，4 倍"],"answer":"C","explain":"原来 E = U/d = 500/1.00×10⁻³ = 5.00×10⁵ V/m，能量密度 u = ½ε₀E² = ½×8.85×10⁻¹²×2.50×10¹¹ = 1.11 J/m³。\n体积 V = Sd = 0.0200×1.00×10⁻³ = 2.00×10⁻⁵ m³，总能量 W = uV = 2.21×10⁻⁵ J。\n断开电源后电荷 Q 不变；间距加倍使电容 C 减半，由 W = Q²/(2C) 知总能量加倍，为 4.42×10⁻⁵ J。\n此时 E = Q/(ε₀S) 不变，u 也不变，但体积加倍，故总能量加倍。\n易错：误按电压不变处理会得能量减半；把 u 也当成加倍得 2.21 J/m³；把 W 与 C 成正比会得 4 倍。"},{"id":"c11q036","type":"calc","difficulty":4,"tags":["均匀带电球体","高斯定理","分段场强"],"stem":"半径 R = 0.200 m 的均匀带电球体，总电荷 Q = +4.00×10⁻⁹ C，置于真空。求：(1) r \u003c R 与 r > R 的电场强度表达式；(2) r = 0.100 m 和 r = 0.300 m 处的场强；(3) 球心电势（取无穷远为零）。","answer":"(1) r \u003c R：E = kQr/R³，沿径向向外；r > R：E = kQ/r²，沿径向向外。(2) 450 N/C，400 N/C，均沿径向向外。(3) 270 V。","explain":"取半径为 r 的同心球面为高斯面，由对称性 E 沿径向且大小处处相等。\nr \u003c R 时 Q内 = Q(r³/R³)，故 E·4πr² = Qr³/(ε₀R³)，得 E = kQr/R³，随 r 线性增大。\nr > R 时 Q内 = Q，得 E = kQ/r²。\nr = 0.100 m：E = 9.0×10⁹×4.00×10⁻⁹×0.100/0.200³ = 450 N/C；r = 0.300 m：E = 36.0/0.0900 = 400 N/C。\n球心电势 U₀ = ∫₀ᴿ(kQr/R³)dr + ∫ᴿ^∞(kQ/r²)dr = kQ/(2R) + kQ/R = 3kQ/(2R) = 270 V。"},{"id":"c11q037","type":"calc","difficulty":5,"tags":["非均匀带电球体","高斯定理","极值"],"stem":"半径 R 的球体内体电荷密度 ρ = ρ₀(1 − r/R)（r 为到球心距离，ρ₀ > 0）。求：(1) 总电荷 Q；(2) r \u003c R 与 r > R 的电场强度 E(r)；(3) 球内场强最大值的位置和大小。","answer":"(1) Q = πρ₀R³/3；(2) r \u003c R：E = ρ₀r(4R − 3r)/(12ε₀R)，r > R：E = ρ₀R³/(12ε₀r²)；(3) r = 2R/3 处，E_max = ρ₀R/(9ε₀)。","explain":"先积分求半径 r 内的电荷：Q内 = ∫₀ʳ 4πr′²ρ₀(1 − r′/R)dr′ = 4πρ₀(r³/3 − r⁴/(4R))。\n令 r = R 得总电荷 Q = 4πρ₀R³(1/3 − 1/4) = πρ₀R³/3。\n由高斯定理 E = kQ内/r² = (ρ₀/ε₀)(r/3 − r²/(4R)) = ρ₀r(4R − 3r)/(12ε₀R)。\nr > R 时 E = kQ/r² = ρ₀R³/(12ε₀r²)。\n球内 E ∝ r(4R − 3r)，令 d/dr[r(4R − 3r)] = 4R − 6r = 0，得 r = 2R/3；代入 E_max = ρ₀R/(9ε₀)。\n注意 r = 0 处 E = 0，r = R 处 E = ρ₀R/(12ε₀)，均小于该极值。"},{"id":"c11q038","type":"calc","difficulty":5,"tags":["球壳与点电荷","电势连续性","分段表达式"],"stem":"半径 R = 0.200 m 的薄球壳均匀带电 Q = +6.00×10⁻⁹ C，球心处固定点电荷 q = −2.00×10⁻⁹ C。取无穷远为零，求：(1) r \u003c R 与 r > R 的 E(r) 和 U(r)；(2) r = 0.100 m 和 r = 0.300 m 处的电势；(3) 验证 r = R 处电势连续。","answer":"(1) r \u003c R：E = kq/r²，指向球心；U = kq/r + kQ/R。r > R：E = k(Q + q)/r²，沿径向向外；U = k(Q + q)/r。(2) 90.0 V，120 V。(3) 两侧极限均为 k(Q + q)/R = 180 V，连续。","explain":"球壳在壳内不产生场，壳内场只由球心点电荷给出：E = kq/r²，方向指向球心（q \u003c 0）。\n壳内电势为两部分叠加：点电荷 kq/r 加球壳的常数电势 kQ/R。\nr > R 时球壳可等效为球心点电荷，总电荷 Q + q = +4.00×10⁻⁹ C，E = k(Q + q)/r²，U = k(Q + q)/r。\nr = 0.100 m：U = 9.0×10⁹×(−2.00×10⁻⁹)/0.100 + 9.0×10⁹×6.00×10⁻⁹/0.200 = −180 + 270 = 90.0 V。\nr = 0.300 m：U = 9.0×10⁹×4.00×10⁻⁹/0.300 = 120 V。\nr → R⁻：U = kq/R + kQ/R = k(Q + q)/R = 180 V；r → R⁺：U = k(Q + q)/R = 180 V，故连续。"},{"id":"c11q039","type":"calc","difficulty":4,"tags":["无限长圆柱","高斯定理","电势差"],"stem":"无限长均匀带电实心圆柱，半径 R = 0.0500 m，体电荷密度 ρ = +2.00×10⁻⁶ C/m³。求：(1) r \u003c R 与 r > R 的 E(r)；(2) 圆柱表面场强；(3) 轴线与表面之间的电势差 U轴 − U表。","answer":"(1) r \u003c R：E = ρr/(2ε₀)，沿径向向外；r > R：E = ρR²/(2ε₀r)，沿径向向外。(2) 5.65×10³ N/C。(3) 141 V。","explain":"取半径 r、长 L 的同轴圆柱形高斯面，上下底面通量为零，侧面通量为 E·2πrL。\nr \u003c R 时包围电荷 ρπr²L：E·2πrL = ρπr²L/ε₀，得 E = ρr/(2ε₀)。\nr > R 时包围电荷 ρπR²L：E = ρR²/(2ε₀r)。\n表面处 r = R：E = ρR/(2ε₀) = 2.00×10⁻⁶×0.0500/(2×8.85×10⁻¹²) = 5.65×10³ N/C。\nU轴 − U表 = ∫₀ᴿ E dr = ∫₀ᴿ ρr/(2ε₀)dr = ρR²/(4ε₀) = 2.00×10⁻⁶×0.00250/(3.54×10⁻¹¹) = 141 V。"},{"id":"c11q040","type":"calc","difficulty":5,"tags":["同轴圆柱","电势差","电场能量"],"stem":"同轴无限长薄圆柱面，内半径 a = 0.0200 m，外半径 b = 0.0800 m，内柱单位长度电荷 λ = +5.00×10⁻⁹ C/m，外柱单位长度电荷 −λ。求：(1) a \u003c r \u003c b 的 E(r)；(2) 两柱间电势差；(3) 单位长度储存的电场能量。","answer":"(1) E = 2kλ/r = 90.0/r V/m，沿径向向外；(2) 125 V；(3) 3.12×10⁻⁷ J/m。","explain":"两柱面之间取半径 r 的高斯柱面，只包围内柱电荷 λL：E·2πrL = λL/ε₀，故 E = λ/(2πε₀r) = 2kλ/r。\n2kλ = 2×9.0×10⁹×5.00×10⁻⁹ = 90.0 V，所以 E = 90.0/r V/m。\n两柱间电势差 ΔU = ∫ₐᵇ (2kλ/r)dr = 2kλ ln(b/a) = 90.0×ln4.00 = 125 V。\n单位长度能量可用电容器公式 W/L = ½λΔU = ½×5.00×10⁻⁹×125 = 3.12×10⁻⁷ J/m。\n也可由 ∫½ε₀E²2πrdr 积分得到同一结果。"},{"id":"c11q041","type":"calc","difficulty":5,"tags":["有限长直线","电势积分","场强积分"],"stem":"长 L = 1.20 m 的均匀带电直线，线电荷密度 λ = +2.00×10⁻⁹ C/m。求中垂线上距直线 d = 0.400 m 处的：(1) 电势；(2) 电场强度的大小和方向。","answer":"(1) 43.0 V；(2) 74.9 N/C，方向垂直于直线向外。","explain":"以中点为原点、直线为 x 轴，电荷元 λdx 到考察点的距离为 √(x² + d²)。\n电势 U = ∫₋L/2^(L/2) kλdx/√(x² + d²) = 2kλ ln[(L/2 + √(L²/4 + d²))/d]。\n代入得 U = 2×18.0×ln[(0.600 + 0.721)/0.400] = 36.0×ln3.30 = 43.0 V。\n场强只有垂直于直线的分量：dE⊥ = kλdx d/(x² + d²)^(3/2)，积分得 E = kλL/[d√(d² + L²/4)]。\nE = 18.0×1.20/(0.400×0.721) = 74.9 N/C，方向垂直于直线向外（λ > 0）。\n平行于直线的分量由上下对称性抵消。"},{"id":"c11q042","type":"calc","difficulty":4,"tags":["圆环轴线","电势与场强","功能关系"],"stem":"半径 R = 0.150 m 的细圆环均匀带电 Q = +6.00×10⁻⁹ C。求：(1) 轴线上 x = 0.200 m 处的电势和场强；(2) 电子从该点由静止释放，到达环心时的速率（e = 1.60×10⁻¹⁹ C，m_e = 9.11×10⁻³¹ kg）。","answer":"(1) 216 V，6.91×10² N/C，沿轴向向外；(2) 7.11×10⁶ m/s。","explain":"轴线上点到环上各电荷元距离相同，U = kQ/√(R² + x²) = 9.0×10⁹×6.00×10⁻⁹/0.250 = 216 V。\n场强只有轴向分量：E = kQx/(R² + x²)^(3/2) = 54.0×0.200/(0.0625)^(3/2) = 10.8/0.015625 = 691 N/C，沿轴向向外。\n电子从 x = 0.200 m 到环心，电势由 216 V 升到 360 V，电场力做正功，电势能减少 e(360 − 216) = 144 eV。\n144 eV = 144×1.60×10⁻¹⁹ = 2.30×10⁻¹⁷ J，由 ½m_ev² = 2.30×10⁻¹⁷ J 得 v = √(2×2.30×10⁻¹⁷/9.11×10⁻³¹) = 7.11×10⁶ m/s。"},{"id":"c11q043","type":"calc","difficulty":5,"tags":["圆盘轴线","电势积分","电势梯度"],"stem":"半径 R = 0.100 m 的薄圆盘均匀带电，面电荷密度 σ = +4.00×10⁻⁸ C/m²。求轴线上距盘心 x 处的：(1) 电势 U(x) 的积分表达式，并算出 x = 0.100 m 的值；(2) 由电势梯度求该点的电场强度。","answer":"(1) U(x) = σ/(2ε₀)(√(R² + x²) − x)，U(0.100) = 93.6 V；(2) E = 6.62×10² N/C，沿轴向向外。","explain":"把圆盘分成半径 r、宽 dr 的圆环，环上电荷 dq = σ2πrdr，到轴线上点的距离为 √(r² + x²)。\nU(x) = ∫₀ᴿ kσ2πrdr/√(r² + x²) = σ/(2ε₀)(√(R² + x²) − x)。\n代入 σ/(2ε₀) = 2.26×10³ V/m，√(0.0100 + 0.0100) = 0.1414 m，得 U = 2.26×10³×(0.1414 − 0.100) = 93.6 V。\n由 Eₓ = −dU/dx = σ/(2ε₀)(1 − x/√(R² + x²)) = 2.26×10³×(1 − 0.707) = 6.62×10² N/C。\nσ > 0 时盘右侧场强沿 +x，即沿轴向向外。"},{"id":"c11q044","type":"calc","difficulty":5,"tags":["均匀带电球体","分段电势","连续性"],"stem":"半径 R = 0.150 m 的均匀带电球体，总电荷 Q = +3.00×10⁻⁹ C。求：(1) 球内外电势 U(r) 的分段表达式（无穷远为零）；(2) 用 r = R 处连续定常数；(3) U(0)、U(R/2)、U(R)、U(2R)。","answer":"(1) r ≥ R：U = kQ/r；r ≤ R：U = kQ(3R² − r²)/(2R³)。(2) 两式在 r = R 都等于 kQ/R = 180 V。(3) 270 V，248 V，180 V，90.0 V。","explain":"球外场 E = kQ/r²，从无穷远积到 r 得 U外 = kQ/r。\n球内场 E = kQr/R³，从 r 积到 R 再加球面电势：U内 = ∫ᵣᴿ kQr′/R³ dr′ + kQ/R = kQ(R² − r²)/(2R³) + kQ/R = kQ(3R² − r²)/(2R³)。\n在 r = R 处，U内 = kQ(2R²)/(2R³) = kQ/R，U外 = kQ/R，两式连续，常数由此确定。\nU(0) = 3kQ/(2R) = 270 V；U(R/2) = kQ(3R² − R²/4)/(2R³) = 27.0×9.167 = 248 V；U(R) = 180 V；U(2R) = 90.0 V。"},{"id":"c11q045","type":"calc","difficulty":4,"tags":["电势梯度","电场力"],"stem":"电势分布为 U = 3.00x²y − 2.00y³（SI 单位）。求：(1) 点 (1.00 m, 2.00 m) 处的电场强度矢量；(2) 该点场强大小及与 +x 轴的夹角；(3) 将 q = −2.00×10⁻⁶ C 放在该点所受的电场力。","answer":"(1) E = (−12.0 i + 21.0 j) V/m；(2) 24.2 V/m，与 +x 轴夹角约 120°；(3) F = (2.40×10⁻⁵ i − 4.20×10⁻⁵ j) N。","explain":"由 E = −∇U：Eₓ = −∂U/∂x = −6.00xy，E_y = −∂U/∂y = −(3.00x² − 6.00y²)。\n代入 x = 1.00 m、y = 2.00 m：Eₓ = −12.0 V/m，E_y = −(3.00 − 24.0) = +21.0 V/m。\n大小 E = √(12.0² + 21.0²) = 24.2 V/m；方向在第二象限，tanθ = 21.0/(−12.0)，θ = 120°。\n电场力 F = qE = −2.00×10⁻⁶×(−12.0 i + 21.0 j) = (2.40×10⁻⁵ i − 4.20×10⁻⁵ j) N。"},{"id":"c11q046","type":"calc","difficulty":5,"tags":["电偶极子","力矩","转动功"],"stem":"电偶极矩 p = 4.00×10⁻⁹ C·m 沿 +x 方向，置于 E = 5.00×10⁵ N/C 沿 +y 方向的均匀外电场中。求：(1) 力矩矢量；(2) 电势能；(3) 将此偶极子转到 p 与 E 同向，外力需做的功。","answer":"(1) 2.00×10⁻³ N·m，沿 +z；(2) 0；(3) −2.00×10⁻³ J。","explain":"力矩 τ = p × E。p 沿 +x、E 沿 +y，叉乘方向为 +z，大小 τ = pE sin90° = 4.00×10⁻⁹×5.00×10⁵ = 2.00×10⁻³ N·m。\n电势能 U = −p·E = −pE cos90° = 0。\n转到 p 与 E 同向时 θ = 0，U末 = −pE = −2.00×10⁻³ J；外力做功 W外 = U末 − U初 = −2.00×10⁻³ J。\n负号表示电场力做正功，偶极子自发转向场方向；若问电场力做功则为 +2.00×10⁻³ J。"},{"id":"c11q047","type":"calc","difficulty":5,"tags":["三电荷系统","电势能","做功"],"stem":"三个点电荷 q₁ = +2.00 μC、q₂ = −3.00 μC、q₃ = +4.00 μC 位于边长 a = 0.200 m 的等边三角形顶点。求：(1) 系统总电势能；(2) 保持 q₁、q₂ 不动，把 q₃ 从无穷远移到该顶点外力做的功；(3) 再把 q₃ 从该顶点移到无穷远外力做的功。","answer":"(1) −0.450 J；(2) −0.180 J；(3) +0.180 J。","explain":"三对相互作用能之和：U = k(q₁q₂ + q₂q₃ + q₃q₁)/a。\n乘积和 = (2.00)(−3.00) + (−3.00)(4.00) + (4.00)(2.00) = −10.0 (μC)²，k/a = 4.50×10¹⁰ N·m/C²，故 U = −0.450 J。\nq₁、q₂ 单独存在时 U₁₂ = k(2.00)(−3.00)×10⁻¹²/0.200 = −0.270 J。\n把 q₃ 从无穷远移入：W外 = U总 − U₁₂ = −0.450 − (−0.270) = −0.180 J。\n反向移出时外力做功 +0.180 J；对应电场力做功分别为 +0.180 J 和 −0.180 J。"},{"id":"c11q048","type":"calc","difficulty":5,"tags":["带电粒子","匀强电场","抛体运动"],"stem":"均匀电场 E = 1.00×10⁴ N/C 沿 +y 方向。质量 m = 1.00×10⁻³ kg、电荷 q = +2.00×10⁻⁶ C 的粒子从原点以 v₀ = 20.0 m/s、与 +x 轴成 60.0° 射出，忽略重力。求：(1) 加速度；(2) 回到 y = 0 的时间与水平射程；(3) 轨迹最高点高度及该点速率。","answer":"(1) 20.0 m/s²，沿 +y；(2) 1.73 s，17.3 m；(3) 7.50 m，10.0 m/s。","explain":"加速度 a = qE/m = 2.00×10⁻⁶×1.00×10⁴/1.00×10⁻³ = 20.0 m/s²，沿 +y。\n初速分量 vₓ = 20.0cos60.0° = 10.0 m/s，v_y = 20.0sin60.0° = 17.3 m/s。\n竖直方向做匀变速运动，回到 y = 0 的时间 t = 2v_y/a = 2×17.3/20.0 = 1.73 s。\n水平射程 x = vₓt = 10.0×1.73 = 17.3 m。\n最高点高度 h = v_y²/(2a) = 17.3²/(2×20.0) = 7.50 m；最高点竖直速度为零，速率等于 vₓ = 10.0 m/s。"},{"id":"c11q049","type":"calc","difficulty":5,"tags":["球形电容器","电场能量","能量积分"],"stem":"两个同心薄球壳，内半径 a = 0.0500 m、外半径 b = 0.150 m，内壳带电 +Q、外壳带电 −Q，Q = 2.00×10⁻⁹ C。求：(1) a \u003c r \u003c b 的 E(r)；(2) 两壳间电势差；(3) 电场总能量，并证明它等于 Q²(b − a)/(8πε₀ab)。","answer":"(1) E = kQ/r² = 18.0/r² V/m，沿径向向外；(2) 240 V；(3) 2.40×10⁻⁷ J。","explain":"两壳之间取半径 r 的同心球面高斯面，只包围内壳 +Q：E·4πr² = Q/ε₀，故 E = Q/(4πε₀r²) = kQ/r²。\nkQ = 9.0×10⁹×2.00×10⁻⁹ = 18.0 V·m，所以 E = 18.0/r² V/m。\n两壳间电势差 ΔU = ∫ₐᵇ (kQ/r²)dr = kQ(1/a − 1/b) = 18.0×(20.0 − 6.67) = 240 V。\n能量 W = ½QΔU = ½×2.00×10⁻⁹×240 = 2.40×10⁻⁷ J。\n又 kQΔU = Q²(b − a)/(4πε₀ab)，乘 ½ 即得 W = Q²(b − a)/(8πε₀ab)，与数值一致。"},{"id":"c11q050","type":"calc","difficulty":5,"tags":["环路定理","保守场","电势函数"],"stem":"某区域电场 E = (3.00y i + 3.00x j) V/m（SI 单位）。(1) 用环路定理判断该场是否保守；(2) 取原点电势为零，求电势 U(x,y)；(3) 求 A(0,0) 与 B(1.00 m,2.00 m) 的电势差 U_A − U_B，并求把 q = +2.00×10⁻⁶ C 从 A 移到 B 电场力做的功。","answer":"(1) 保守（∇×E = 0）；(2) U = −3.00xy V；(3) U_A − U_B = 6.00 V，W = 1.20×10⁻⁵ J。","explain":"先算旋度：∇×E 的 z 分量为 ∂E_y/∂x − ∂Eₓ/∂y = 3.00 − 3.00 = 0，且其余分量也为零，故环路积分为零，该场保守，可引入电势。\n由 E = −∇U：∂U/∂x = −3.00y，对 x 积分得 U = −3.00xy + f(y)；再对 y 求导并与 −E_y = −3.00x 比较，得 f′(y) = 0。\n取 U(0,0) = 0，则 f = 0，U = −3.00xy V。\nU_A = 0，U_B = −3.00×1.00×2.00 = −6.00 V，故 U_A − U_B = 6.00 V。\n电场力做功 W = q(U_A − U_B) = 2.00×10⁻⁶×6.00 = 1.20×10⁻⁵ J。"}]},{"chapter":12,"chapterName":"导体与电介质","questions":[{"id":"c12q001","type":"choice","difficulty":3,"tags":["平行板电容","介质插入","恒压条件"],"stem":"平行板电容器的极板面积为 0.0200 m²，板间距为 1.00 mm，极板间为空气，接在 300 V 直流电源上并保持连接。现将 εr = 4.00 的介质板充满极板之间，极板上自由电荷的增量约为（ε₀ = 8.85×10⁻¹² F/m）","options":["1.59×10⁻⁷ C","5.31×10⁻⁸ C","2.12×10⁻⁷ C","1.33×10⁻⁷ C"],"answer":"A","explain":"C₀ = ε₀S/d = 8.85×10⁻¹²×0.0200/1.00×10⁻³ = 1.77×10⁻¹⁰ F，Q₀ = C₀U = 5.31×10⁻⁸ C。\n插入介质后 C = εrC₀ = 7.08×10⁻¹⁰ F，Q = CU = 2.12×10⁻⁷ C。\nΔQ = (εr − 1)C₀U = 3×1.77×10⁻¹⁰×300 = 1.59×10⁻⁷ C。\n易错点：电源保持连接，电压不变、电荷随电容增大；若先断开电源，则电荷不变、电压降为原来的 1/εr。"},{"id":"c12q002","type":"choice","difficulty":3,"tags":["导体球连接","电荷分配","等势条件"],"stem":"两个半径分别为 6.00 cm 和 3.00 cm 的孤立导体球相距很远，用一根细长导线连接。连接前半径 6.00 cm 的球带电 2.00×10⁻⁸ C，半径 3.00 cm 的球不带电。连接后半径 3.00 cm 的球所带电荷为","options":["1.00×10⁻⁸ C","6.67×10⁻⁹ C","1.33×10⁻⁸ C","4.00×10⁻⁹ C"],"answer":"B","explain":"连接后两球等势：kq₁/R₁ = kq₂/R₂，故 q₁:q₂ = R₁:R₂。\n电荷守恒 q₁ + q₂ = Q，得 q₂ = QR₂/(R₁+R₂) = 2.00×10⁻⁸×3.00/9.00 = 6.67×10⁻⁹ C。\n此时 σ₂/σ₁ = R₁/R₂ = 2，小球表面电荷密度与场强均为大球的 2 倍。\n易错点：按面积比 R² 分配会得 4.00×10⁻⁹ C；等量平分会得 1.00×10⁻⁸ C。"},{"id":"c12q003","type":"choice","difficulty":3,"tags":["平行板","并排填充","恒电荷"],"stem":"极板面积为 S 的空气平行板电容器充电到 U₀ = 800 V 后与电源断开。将一块面积 S/2、厚度等于板间距、εr = 2.50 的介质板插入极板间的一半面积处（与极板紧密接触，另一半仍为空气）。此时极板间的电压为","options":["560 V","320 V","457 V","640 V"],"answer":"C","explain":"并排填充相当于两个电容器并联：C = ε₀(S/2)/d + εrε₀(S/2)/d = C₀(1+εr)/2 = 1.75C₀。\n断开电源，电荷不变，U = Q/C = U₀/1.75 = 800/1.75 = 457 V。\n判断关键：介质只占一半面积时是并排（电容相加），不是叠放（电压按厚度分配）。\n易错点：按叠放算得 C = 2εrC₀/(1+εr) = 1.43C₀，电压 560 V；误用 C = εrC₀ 得 320 V。"},{"id":"c12q004","type":"choice","difficulty":3,"tags":["球形电容器","介质","电容公式"],"stem":"球形电容器由半径 2.00 cm 的内球和内半径为 5.00 cm 的同心导体球壳组成，两球之间充满 εr = 3.00 的均匀介质。该电容器的电容约为（ε₀ = 8.85×10⁻¹² F/m）","options":["3.70 pF","27.8 pF","5.56 pF","11.1 pF"],"answer":"D","explain":"球形电容器 C = 4πε₀εr R₁R₂/(R₂ − R₁)。\n4πε₀ = 1.11×10⁻¹⁰ F/m，代入 R₁R₂/(R₂−R₁) = (0.0200×0.0500)/0.0300 = 3.33×10⁻² m。\nC = 1.11×10⁻¹⁰×3.00×3.33×10⁻² = 1.11×10⁻¹¹ F = 11.1 pF。\n易错点：漏掉 εr 得 3.70 pF；把分子写成 R₂² 得 27.8 pF。"},{"id":"c12q005","type":"choice","difficulty":3,"tags":["电容器混联","分压"],"stem":"C₁ = 2.00 μF 与 C₂ = 3.00 μF 并联后，再与 C₃ = 4.00 μF 串联，接在 220 V 直流电源上。C₁ 两端的电压为","options":["97.8 V","122 V","220 V","48.9 V"],"answer":"A","explain":"并联部分 C₁₂ = 5.00 μF，总电容 C = C₁₂C₃/(C₁₂+C₃) = 5.00×4.00/9.00 = 2.22 μF。\n总电荷 Q = CU = 2.22×10⁻⁶×220 = 4.89×10⁻⁴ C，并联部分电压 U₁₂ = Q/C₁₂ = 97.8 V。\nC₁ 与 C₂ 并联，电压同为 97.8 V；C₃ 上电压为 122 V。\n易错点：把 220 V 按电容反比直接分给 C₁ 得 122 V；串联时电容越大分压越小。"},{"id":"c12q006","type":"calc","difficulty":3,"tags":["恒电荷","介质插入","电场能量"],"stem":"平行板电容器极板面积 0.0500 m²，板间距 2.00 mm，极板间为空气。充电到 1.00 kV 后断开电源，再将 εr = 5.00、厚度等于板间距的介质板充满极板之间（ε₀ = 8.85×10⁻¹² F/m）。求：(1) 插入介质后极板间的电压；(2) 电容器储能的变化量；(3) 插入过程中静电力做的功，并说明外力做正功还是负功。","options":[],"answer":"(1) 200 V；(2) 减少 8.85×10⁻⁵ J；(3) 静电力做功 8.85×10⁻⁵ J，外力做负功（需拉住介质板）","explain":"C₀ = ε₀S/d = 8.85×10⁻¹²×0.0500/2.00×10⁻³ = 2.21×10⁻¹⁰ F，Q = C₀U₀ = 2.21×10⁻⁷ C。\n断开电源 Q 不变；插入后 C = εrC₀ = 1.11×10⁻⁹ F，U = Q/C = U₀/εr = 200 V。\n初态能量 W₀ = ½C₀U₀² = 1.11×10⁻⁴ J，末态 W = ½QU = 2.21×10⁻⁵ J，ΔW = −8.85×10⁻⁵ J。\n恒电荷下静电力做功等于电场能量的减少量：W电 = 8.85×10⁻⁵ J，介质被吸入；外力须反向拉住，做负功 −8.85×10⁻⁵ J。\n易错点：把 ΔW 的绝对值直接当成外力做的正功；恒电荷时没有电源参与，能量只由电场提供。"},{"id":"c12q007","type":"choice","difficulty":4,"tags":["空腔导体","静电平衡","电势"],"stem":"一个不带电的厚导体球壳，内半径为 5.00 cm，外半径为 8.00 cm。在腔内距球心 3.00 cm 处放一个点电荷 q = +4.00×10⁻⁸ C。取无穷远为零电势，则距球心 0.120 m 处的场强大小和球壳的电势分别为（k = 8.99×10⁹ N·m²/C²）","options":["25.0 kV/m，3.00 kV","25.0 kV/m，4.50 kV","56.2 kV/m，4.50 kV","25.0 kV/m，0"],"answer":"B","explain":"静电平衡后内表面感应 −q，外表面感应 +q（导体原不带电）。\n球壳外电场只由外表面总电荷 +q 决定，等效于球心处的点电荷：E = kq/r² = 8.99×10⁹×4.00×10⁻⁸/0.120² = 2.50×10⁴ V/m。\n球壳是等势体，电势等于外表面处电势：V = kq/R₂ = 8.99×10⁹×4.00×10⁻⁸/0.0800 = 4.50×10³ V。\n腔内电荷偏离球心只改变内表面电荷分布，不改变外表面电荷总量与壳外场。\n易错点：用 r = 0.120 m 算电势得 3.00 kV；用外表面半径算场强得 56.2 kV/m。"},{"id":"c12q008","type":"choice","difficulty":4,"tags":["平行板","叠放介质","等效电容"],"stem":"平行板电容器极板面积为 S、间距为 d，极板间为空气，电容为 C₀。将一块厚度为 d/2、相对介电常数 εr = 4.00 的介质板插入极板间并紧贴一个极板。此时电容变为","options":["0.800C₀","1.33C₀","1.60C₀","2.00C₀"],"answer":"C","explain":"叠放填充相当于介质部分与空气部分两个电容器串联，两部分的 D 相同。\n等效间距 d′ = (d − t) + t/εr = d/2 + (d/2)/4.00 = 0.625d，故 C = ε₀S/d′ = C₀/0.625 = 1.60C₀。\n也可写成 C = εrε₀S/[εr(d−t)+t]。\n易错点：把两部分电容直接相加得 2.00C₀；只按介质厚度折半得 1.33C₀；串联时忘了空气层仍占 d/2 得 0.800C₀。"},{"id":"c12q009","type":"choice","difficulty":4,"tags":["圆柱形电容器","单位长度电容"],"stem":"同轴圆柱形电容器的内导体半径为 1.00 mm，外导体内半径为 4.00 mm，其间充满 εr = 2.25 的介质。其单位长度电容约为（ε₀ = 8.85×10⁻¹² F/m）","options":["40.1 pF/m","31.3 pF/m","181 pF/m","90.3 pF/m"],"answer":"D","explain":"设单位长度电荷为 λ，两导体间 E = λ/(2πε₀εr r)，电压 U = ∫E dr = λ ln(b/a)/(2πε₀εr)。\n故 C/l = λ/U = 2πε₀εr/ln(b/a) = 2π×8.85×10⁻¹²×2.25/ln4。\nln4 = 1.386，C/l = 1.25×10⁻¹⁰/1.386 = 9.03×10⁻¹¹ F/m = 90.3 pF/m。\n易错点：漏掉 εr 得 40.1 pF/m；把 ln(b/a) 写成 b/a 得 31.3 pF/m；用 4π 代替 2π 得 181 pF/m。"},{"id":"c12q010","type":"calc","difficulty":4,"tags":["介质高斯定理","球对称","极化强度"],"stem":"点电荷 Q = +2.00×10⁻⁸ C 位于一个半径 R = 0.100 m、εr = 4.00 的均匀介质球的球心，球外为空气。求：(1) 距球心 r = 0.0500 m 处的电位移 D、场强 E 和极化强度 P；(2) 介质球表面（r = R）处的束缚电荷面密度 σ′ 和介质表面的总束缚电荷。","options":[],"answer":"(1) D = 6.37×10⁻⁷ C/m²，E = 1.80×10⁴ V/m，P = 4.78×10⁻⁷ C/m²；(2) σ′ = +1.19×10⁻⁷ C/m²，总束缚电荷 1.50×10⁻⁸ C","explain":"球对称，取半径 r 的高斯面：∮D·dS = Q_free，得 D = Q/(4πr²)，与介质无关。\nr = 0.0500 m：D = 2.00×10⁻⁸/(4π×0.0500²) = 6.37×10⁻⁷ C/m²。\nE = D/(ε₀εr) = 6.37×10⁻⁷/(8.85×10⁻¹²×4.00) = 1.80×10⁴ V/m；P = D − ε₀E = D(1 − 1/εr) = 4.78×10⁻⁷ C/m²。\nr = R 处 D = 1.59×10⁻⁷ C/m²，P = 1.19×10⁻⁷ C/m²；外法线沿径向，σ′ = P·n = +1.19×10⁻⁷ C/m²。\n总束缚电荷 = 4πR²σ′ = 1.50×10⁻⁸ C，恰等于 Q(1 − 1/εr)。"},{"id":"c12q011","type":"choice","difficulty":4,"tags":["同心球壳","接地","电势"],"stem":"内球半径 5.00 cm、外球壳内半径 10.0 cm 的球形电容器，两球之间充满 εr = 2.00 的介质。内球带电荷 +1.00×10⁻⁸ C，外球壳接地。内球的电势为（k = 8.99×10⁹ N·m²/C²）","options":["450 V","899 V","225 V","0"],"answer":"A","explain":"两球间 E = Q/(4πε₀εr r²)，内球电势 U = ∫(R₁→R₂) E dr = Q/(4πε₀εr)(1/R₁ − 1/R₂)。\n1/0.0500 − 1/0.100 = 10.0 m⁻¹，U = 8.99×10⁹×1.00×10⁻⁸×(1/2.00)×10.0 = 450 V。\n判断：外球壳接地使壳外无场、壳电势为零，电压只由两球之间的场决定。\n易错点：漏掉 εr 得 899 V；把 εr 重复计入得 225 V。"},{"id":"c12q012","type":"choice","difficulty":4,"tags":["电荷共享","能量损失"],"stem":"C₁ = 4.00 μF 的电容器充电到 100 V 后与电源断开，再与一个不带电的 C₂ = 6.00 μF 电容器并联。稳定后两电容器的共同电压和系统损失的电能分别为","options":["40.0 V，20.0 mJ","40.0 V，12.0 mJ","60.0 V，8.00 mJ","40.0 V，8.00 mJ"],"answer":"B","explain":"并联后电荷守恒：Q = C₁U₀ = 4.00×10⁻⁶×100 = 4.00×10⁻⁴ C。\n共同电压 U = Q/(C₁+C₂) = 4.00×10⁻⁴/1.00×10⁻⁵ = 40.0 V。\n初能 W₀ = ½C₁U₀² = 2.00×10⁻² J，末能 W = ½(C₁+C₂)U² = 8.00×10⁻³ J，损失 1.20×10⁻² J。\n损失的能量在导线电阻上转化为焦耳热（或电磁辐射），与电阻大小无关。"},{"id":"c12q013","type":"choice","difficulty":4,"tags":["介质击穿","最大工作电压"],"stem":"平行板电容器板间距为 0.500 mm。极板间为空气时空气的击穿场强为 3.00×10⁶ V/m；换用 εr = 2.50、击穿场强为 2.00×10⁷ V/m 的介质充满后，最大工作电压约提高到原来的","options":["2.50 倍","5.00 倍","6.67 倍","8.33 倍"],"answer":"C","explain":"最大工作电压由击穿场强与厚度决定：U_max = E_b d，与 εr 无关。\n空气：U_max = 3.00×10⁶×0.500×10⁻³ = 1.50×10³ V。\n介质：U_max = 2.00×10⁷×0.500×10⁻³ = 1.00×10⁴ V。\n比值 = 1.00×10⁴/1.50×10³ = 6.67。\n易错点：用 εr = 2.50 去乘，误以为介电常数直接提高耐压。"},{"id":"c12q014","type":"choice","difficulty":4,"tags":["导体球","电场能量"],"stem":"半径 R = 10.0 cm 的孤立导体球带电 Q = 5.00×10⁻⁸ C。该带电球电场中储存的总能量为（k = 8.99×10⁹ N·m²/C²）","options":["2.25×10⁻⁴ J","5.62
