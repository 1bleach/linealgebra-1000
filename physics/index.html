，再将这两段并联起来悬挂同一质量 m，新系统的周期 T 与 T₀ 之比为","options":["2","1/2","1/4","1/√2"],"answer":"B","explain":"解析：弹簧剪成两等段后，每段劲度系数变为 2k（长度减半、劲度系数加倍）。\n两段并联后等效劲度系数为 2k + 2k = 4k，故 T = 2π√(m/4k) = T₀/2。\n易错点：把「并联使 k 变大」误判成周期变大会得 2；把劲度系数变为 4 倍直接当成周期变为 1/4 会得 1/4；只考虑其中一段会得 1/√2。T ∝ 1/√k，不是 1/k。","id":"c06q017"},{"type":"choice","difficulty":4,"tags":["扭摆","转动惯量","扭转常数"],"stem":"一质量均匀的圆盘绕通过盘心的竖直金属丝作扭转振动，圆盘对该轴的转动惯量 I = 0.0120 kg·m²，金属丝的扭转常数 κ = 0.0840 N·m/rad。其扭转振动周期为","options":["2.37 s","16.6 s","1.19 s","0.199 s"],"answer":"A","explain":"解析：扭转振动中恢复力矩 τ = −κθ，与 Iθ¨ = −κθ 对比得 ω = √(κ/I)。\nT = 2π√(I/κ) = 2π√(0.0120/0.0840) = 2π×0.378 = 2.37 s。\n易错点：1.19 s 把 I/κ 错写成一半；16.6 s 把 κ/I 取倒数后忘记开方；0.199 s 把 I 与 κ 相乘再开方。扭摆周期与重力无关。","id":"c06q018"},{"type":"calc","difficulty":4,"tags":["初始条件","振幅与初相","运动方程"],"stem":"一质点作简谐振动，角频率 ω = 8.00 rad/s。t = 0 时位移 x₀ = 0.0400 m，速度 v₀ = −0.250 m/s。求：(1) 振幅和初相；(2) 运动方程；(3) 从 t = 0 起第一次通过平衡位置的时刻。","answer":"(1) A = 0.0508 m，φ = 0.663 rad；(2) x = 0.0508cos(8.00t + 0.663) m；(3) t = 0.113 s","explain":"解析：(1) 由 A = √(x₀² + (v₀/ω)²) 得 A = √(0.0400² + (0.250/8.00)²) = √(1.600×10⁻³ + 9.766×10⁻⁴) = 0.0508 m。\n由 cosφ = x₀/A = 0.788、sinφ = −v₀/(ωA) = 0.616，且 x₀ > 0、v₀ \u003c 0，φ 在第一象限，φ = 0.663 rad。\n(2) x = 0.0508cos(8.00t + 0.663) m。\n(3) 第一次通过平衡位置时相位为 π/2：8.00t + 0.663 = 1.571，解得 t = 0.113 s。\n易错点：初相必须同时用 x₀ 和 v₀ 的符号定象限，只由 cosφ 会丢解。","id":"c06q019"},{"type":"calc","difficulty":4,"tags":["单摆","重力加速度","周期公式应用"],"stem":"取 g = 9.80 m/s²。(1) 要使单摆作小角度摆动的周期恰为 2.00 s，摆长应为多少？(2) 若把同样的单摆移到火星（g = 3.71 m/s²），仍要周期 2.00 s，摆长应为多少？(3) 一只按 g = 9.80 m/s² 校准的摆钟被移到 g = 9.78 m/s² 处，一天（86400 s）内它慢多少秒？","answer":"(1) 0.993 m；(2) 0.376 m；(3) 约慢 88.2 s","explain":"解析：(1) 由 T = 2π√(L/g) 得 L = gT²/(4π²) = 9.80×2.00²/(4π²) = 0.993 m。\n(2) 在火星上 L′ = 3.71×4.00/(4π²) = 0.376 m。\n(3) 摆长不变时 T ∝ 1/√g，g 变小周期变长，钟走慢。一天内指示时间变为 86400×√(9.78/9.80) = 86312 s，故慢 86400 − 86312 = 88.2 s。\n易错点：第 (3) 问的比例是 √(g′/g) 而不是 g′/g；也不能把「慢」算成周期变化量的绝对值。","id":"c06q020"},{"type":"calc","difficulty":4,"tags":["弹簧串并联","等效劲度系数","串联弹簧受力"],"stem":"三个轻弹簧按如下方式连接：k₁ = 120 N/m 与 k₂ = 180 N/m 并联后，再与 k₃ = 300 N/m 串联；系统竖直悬挂质量 m = 0.600 kg 的物体。求：(1) 系统的等效劲度系数；(2) 振动周期；(3) 当振幅为 3.00 cm 时，k₃ 中承受的最大力。","answer":"(1) 150 N/m；(2) 0.397 s；(3) 4.50 N","explain":"解析：(1) k₁ 与 k₂ 并联：k₁₂ = 120 + 180 = 300 N/m；再与 k₃ 串联：k_eq = 300×300/(300 + 300) = 150 N/m。\n(2) T = 2π√(m/k_eq) = 2π√(0.600/150) = 0.397 s。\n(3) 串联弹簧中各处张力相同，k₃ 承受的力等于系统总回复力，最大值为 F = k_eq A = 150×0.0300 = 4.50 N。\n易错点：串联不能把劲度系数直接相加；k₃ 中的力也不是 k₃A（那是把全部位移都算到 k₃ 上）。","id":"c06q021"},{"type":"calc","difficulty":4,"tags":["浮力振子","等效劲度系数","密度影响"],"stem":"一圆柱体横截面积 S = 4.00×10⁻³ m²、质量 m = 1.20 kg，竖直浮在密度 ρ = 1.00×10³ kg/m³ 的水中。把它向下按 2.00 cm 后释放（取 g = 9.80 m/s²）。求：(1) 证明回复力与位移成正比，并求等效劲度系数和周期；(2) 最大速率；(3) 若换成密度为 2.00×10³ kg/m³ 的液体，周期变为原来的多少倍？","answer":"(1) k = ρgS = 39.2 N/m，T = 1.10 s；(2) 0.114 m/s；(3) 0.707 倍","explain":"解析：(1) 设从平衡位置向下位移 x，多排开液体体积 Sx，附加浮力 ρgSx 向上，故 F = −ρgSx，k = ρgS = 1.00×10³×9.8×4.00×10⁻³ = 39.2 N/m。\nT = 2π√(m/k) = 2π√(1.20/39.2) = 1.10 s。\n(2) ω = √(k/m) = 5.72 rad/s，v_max = ωA = 5.72×0.0200 = 0.114 m/s。\n(3) 密度加倍使 k 加倍，T ∝ 1/√k，故 T′/T = 1/√2 = 0.707。\n易错点：回复力来自排水体积变化，不是整个浮力；圆柱体质量不变时，液体密度只通过 k 影响周期。","id":"c06q022"},{"type":"calc","difficulty":4,"tags":["拍频","振幅调制","合成表达式"],"stem":"两个同方向、同频率的简谐振动叠加：x₁ = 0.0300cos(2π×440t) m，x₂ = 0.0300cos(2π×436t) m。求：(1) 将合振动写成「包络×载波」的形式，指出拍频、最大合振幅和相邻两次振幅极大之间的时间间隔；(2) t = 0.0625 s 时合振动的振幅；(3) 2.00 s 内合振幅出现极大的次数。","answer":"(1) x = 0.0600cos(4.00πt)cos(876πt) m，拍频 4.00 Hz，最大振幅 0.0600 m，间隔 0.250 s；(2) 0.0424 m；(3) 8 次","explain":"解析：(1) 用和差化积：x = 2A cos(2πΔf t/2)cos(2πf_平均t) = 0.0600cos(4.00πt)cos(876πt) m，其中 Δf = 4.00 Hz、f_平均 = 438 Hz。\n拍频为 4.00 Hz，相邻极大间隔 1/Δf = 0.250 s，最大合振幅 2A = 0.0600 m。\n(2) t = 0.0625 s 时包络因子 cos(4.00π×0.0625) = cos(π/4) = 0.707，振幅为 0.0600×0.707 = 0.0424 m。\n(3) 包络极大出现在 t = n×0.250 s，2.00 s 内 n = 0,1,…,7，共 8 次。\n易错点：拍频是两频率之差，不是平均值；包络的周期是 1/Δf，不是 2/Δf。","id":"c06q023"},{"type":"calc","difficulty":4,"tags":["阻尼振动","对数减缩","品质因数"],"stem":"某欠阻尼振动的运动方程为 x = 0.0800e^(−0.250t)cos(12.0t)（SI 单位）。求：(1) 振动周期；(2) 对数减缩 δ 和相邻两个同向最大位移之比；(3) 品质因数 Q；(4) 经过 10 个周期后振幅变为初值的多少倍。","answer":"(1) 0.524 s；(2) δ = 0.131，比值 1.14；(3) Q = 24.0；(4) 0.270 倍","explain":"解析：(1) T = 2π/ω = 2π/12.0 = 0.524 s。\n(2) 对数减缩 δ = βT = 0.250×0.524 = 0.131；相邻同向最大位移之比为 e^δ = 1.14。\n(3) Q = ω/(2β) = 12.0/(2×0.250) = 24.0。\n(4) 10 个周期后振幅比为 e^(−β×10T) = e^(−0.250×5.24) = e^(−1.31) = 0.270。\n易错点：相邻最大位移的比值是 e^δ 而不是 e^(2δ)；Q 的分母是 2β，且用阻尼振动角频率 ω 近似。","id":"c06q024"},{"type":"calc","difficulty":4,"tags":["LC 振荡","电磁振荡","能量守恒"],"stem":"在理想 LC 振荡电路中，L = 0.0250 H，C = 4.00 μF。t = 0 时电容器上极板带电 Q₀ = 5.00 μC，电流为零。求：(1) 振荡角频率、频率和周期；(2) 电荷与电流随时间变化的表达式；(3) 最大电流；(4) 电路的总能量。","answer":"(1) ω = 3.16×10³ rad/s，f = 503 Hz，T = 1.99×10⁻³ s；(2) q = 5.00×10⁻⁶cos(3.16×10³t) C，i = −1.58×10⁻²sin(3.16×10³t) A；(3) 1.58×10⁻² A；(4) 3.13×10⁻⁶ J","explain":"解析：(1) ω = 1/√(LC) = 1/√(0.0250×4.00×10⁻⁶) = 3.16×10³ rad/s；f = ω/(2π) = 503 Hz；T = 1/f = 1.99×10⁻³ s。\n(2) 电荷作简谐振动 q = Q₀cosωt = 5.00×10⁻⁶cos(3.16×10³t) C；i = dq/dt = −Q₀ω sinωt = −1.58×10⁻²sin(3.16×10³t) A。\n(3) I_max = Q₀ω = 5.00×10⁻⁶×3.16×10³ = 1.58×10⁻² A。\n(4) E = Q₀²/(2C) = (5.00×10⁻⁶)²/(2×4.00×10⁻⁶) = 3.13×10⁻⁶ J，也等于 ½LI_max²。\n易错点：电流是电荷的导数，相位比电荷超前 π/2；总能量可用电场能或磁场能任一个最大值算。","id":"c06q025"},{"type":"choice","difficulty":5,"tags":["弹簧有效质量","周期修正","等效质量"],"stem":"一弹簧振子中振子质量为 m，弹簧自身质量为 M = m/3。若把弹簧质量按等效质量 M/3 计入（即 m_eff = m + M/3），则考虑弹簧质量后的周期 T 与把弹簧视为轻弹簧时的周期 T₀ 之比 T/T₀ 为","options":["1.22","1.00","1.05","1.15"],"answer":"C","explain":"解析：m_eff = m + M/3 = m + m/9 = 10m/9，故 T/T₀ = √(m_eff/m) = √(10/9) = 1.05。\n物理意义：弹簧各点速度从固定端到振子端线性增大，动能相当于把 M/3 集中在振子处，弹簧质量总使周期变长。\n易错点：1.00 完全忽略弹簧质量；1.15 把整个 M 都加到振子上（√(4/3)）；1.22 用 M/2 作等效质量。","id":"c06q026"},{"type":"choice","difficulty":5,"tags":["能量与相位","动能势能相等","时间占比"],"stem":"一质点作简谐振动，振幅 A = 8.00 cm，周期 T = 0.500 s，t = 0 时位于 x = +A 处并由静止释放。从 t = 0 起，第一次出现动能等于势能的时刻，以及一个周期内动能大于势能的时间占周期的比例分别为","options":["0.0625 s，1/2","0.125 s，1/2","0.250 s，1/2","0.0625 s，1/4"],"answer":"A","explain":"解析：动能等于势能时 ½kx² = ½E，即 |x| = A/√2。从 x = A 释放，运动方程为 x = Acosωt，第一次满足 cosωt = 1/√2 时 ωt = π/4。\n故 t = T/8 = 0.500/8 = 0.0625 s。\n在一个周期内，|x| \u003c A/√2 的区间对应四个 T/8，合计 T/2，即动能大于势能的时间占 1/2。\n易错点：0.125 s 把相位取成 π/2（那是到平衡位置）；1/4 只算了一个四分之一周期里的一段；平衡位置附近速度大，动能占优的时间正好一半。","id":"c06q027"},{"type":"choice","difficulty":5,"tags":["对数减缩","品质因数","每周期能量损失"],"stem":"某欠阻尼振子的对数减缩 δ = 0.0500。它的品质因数 Q 及每个周期损失的能量占原有能量的百分比分别约为","options":["126，9.52%","62.8，9.52%","62.8，4.88%","31.4，9.52%"],"answer":"B","explain":"解析：对数减缩与品质因数的关系为 Q = π/δ = π/0.0500 = 62.8。\n每经过一个周期振幅变为 e^(−δ) 倍，能量与振幅平方成正比，变为 e^(−2δ) 倍，故损失比例为 1 − e^(−0.100) = 0.0952，即 9.52%。\n易错点：4.88% 用的是振幅损失 1 − e^(−δ)，忘了能量是振幅的平方；31.4 把 Q 写成 π/(2δ)；126 把 Q 写成 2π/δ。","id":"c06q028"},{"type":"choice","difficulty":5,"tags":["共振曲线","半功率带宽","品质因数"],"stem":"某受迫振动系统的共振曲线（振幅–频率曲线）的共振频率 f₀ = 250 Hz，半功率带宽 Δf = 5.00 Hz。该系统的品质因数 Q 和阻尼系数 β 分别约为","options":["50.0，15.7 s⁻¹","100，15.7 s⁻¹","25.0，15.7 s⁻¹","50.0，31.4 s⁻¹"],"answer":"A","explain":"解析：半功率点对应振幅降为峰值的 1/√2，其频率间隔满足 Δω = 2β，故 β = πΔf = π×5.00 = 15.7 s⁻¹。\n品质因数 Q = ω₀/Δω = f₀/Δf = 250/5.00 = 50.0。\n易错点：31.4 s⁻¹ 把 Δω 当成 4β；25.0 把 Q 写成 f₀/(2Δf)；100 把 Q 写成 2f₀/Δf。带宽越窄，Q 越高，共振越尖锐。","id":"c06q029"},{"type":"choice","difficulty":5,"tags":["受迫振动","振幅公式","相位差"],"stem":"一受迫振动系统质量 m = 1.00 kg，劲度系数 k = 100 N/m，阻尼系数 β = 1.00 s⁻¹，驱动力幅值 F₀ = 10.0 N，驱动角频率 ω = 8.00 rad/s。稳定后振幅 A 及位移落后驱动力的相位差 φ 分别为","options":["0.254 m，66.0°","0.500 m，90.0°","0.100 m，0°","0.254 m，24.0°"],"answer":"D","explain":"解析：ω₀ = √(k/m) = 10.0 rad/s。稳定振幅 A = (F₀/m)/√((ω₀² − ω²)² + 4β²ω²)。\n分母 = √((100 − 64.0)² + 4×1.00²×64.0) = √(1296 + 256) = 39.4，故 A = 10.0/39.4 = 0.254 m。\n相位差 tanφ = 2βω/(ω₀² − ω²) = 16.0/36.0 = 0.444，φ = 24.0°。\n易错点：0.100 m 是 ω → 0 的静态位移 F₀/k；0.500 m 是 ω = ω₀ 的共振振幅；66.0° 是余角，相位公式的分子分母不能倒置。","id":"c06q030"},{"type":"choice","difficulty":5,"tags":["竖直弹簧振子","平衡位置突变","振幅重算"],"stem":"劲度系数 k = 200 N/m 的竖直轻弹簧下端挂有 m₁ = 0.500 kg 和 m₂ = 0.300 kg 两个物体，系统以振幅 A = 0.0400 m 振动。当系统经过平衡位置时，把 m₂ 突然取走（m₁ 继续振动）。此后 m₁ 的振幅为","options":["0.0547 m","0.0316 m","0.0400 m","0.0349 m"],"answer":"D","explain":"解析：取走前 ω = √(k/(m₁ + m₂)) = √(200/0.800) = 15.8 rad/s，经过平衡位置时速率 v = ωA = 15.8×0.0400 = 0.632 m/s。\n取走后平衡位置上移 Δ = m₂g/k = 0.300×9.8/200 = 0.0147 m，此时 m₁ 位于新平衡位置下方 0.0147 m 处，速度仍为 0.632 m/s。\n新角频率 ω′ = √(200/0.500) = 20.0 rad/s，新振幅 A′ = √(Δ² + (v/ω′)²) = √(0.0147² + 0.0316²) = 0.0349 m。\n易错点：0.0400 m 认为振幅不变；0.0316 m 只用了速度项、漏掉平衡位置移动；0.0547 m 把两项直接相加。","id":"c06q031"},{"type":"choice","difficulty":5,"tags":["天平托盘振动","脱离条件","临界振幅"],"stem":"一水平托盘沿竖直方向作简谐振动，频率 f = 3.00 Hz。托盘上放一小物块，为使物块始终不离开托盘，托盘的振幅不能超过（取 g = 9.8 m/s²）","options":["3.45 cm","5.52 cm","2.76 cm","1.38 cm"],"answer":"C","explain":"解析：物块随托盘振动，托盘对物块的支持力 N = m(g − a)，a 为托盘加速度（向上为正）。不脱离的条件是 N ≥ 0，即最大向上加速度不超过 g。\n托盘在最高点加速度向下、大小为 Aω²，要求 Aω² ≤ g。ω = 2πf = 18.85 rad/s，故 A ≤ g/ω² = 9.8/355 = 0.0276 m = 2.76 cm。\n易错点：3.45 cm 用 g/(2πf) 而漏掉平方；1.38 cm 把振幅限制取成一半；5.52 cm 是上限的两倍。","id":"c06q032"},{"type":"choice","difficulty":5,"tags":["复摆","圆环转动惯量","平行轴定理"],"stem":"一质量均匀的细圆环半径为 R = 0.150 m，在环上一点用光滑水平轴悬挂，圆环在自身平面内作小角度摆动。取 g = 9.8 m/s²，其振动周期为","options":["1.35 s","1.10 s","1.90 s","2.70 s"],"answer":"A","explain":"解析：圆环绕中心轴的转动惯量为 2mR²，由平行轴定理，绕环上一点的转动惯量为 I = 2mR² + mR² = 3mR²，质心到轴距离 d = R。\nT = 2π√(I/(mgd)) = 2π√(3mR²/(mgR)) = 2π√(3R/g) = 2π√(0.450/9.8) = 1.35 s。\n易错点：1.10 s 只用 I = 2mR²，漏掉平行轴项 mR²；1.90 s 当成长 0.900 m 的单摆；2.70 s 把周期多乘了 2。","id":"c06q033"},{"type":"choice","difficulty":5,"tags":["刚体与弹簧","等效劲度系数","转动定律"],"stem":"一质量均匀的细杆质量 m = 0.800 kg、长 L = 0.600 m，一端用光滑水平轴固定，另一端与劲度系数 k = 60.0 N/m 的水平轻弹簧相连。杆在竖直平面内作小角度振动。其周期为","options":["0.296 s","0.419 s","0.209 s","0.593 s"],"answer":"B","explain":"解析：设杆偏离平衡位置 θ，弹簧端点位移 Lθ，恢复力矩 τ = −k(Lθ)L = −kL²θ。\n杆绕端点转动惯量 I = mL²/3，由 Iθ¨ = τ 得 ω = √(kL²/I) = √(3k/m) = √(180/0.800) = 15.0 rad/s。\nT = 2π/ω = 0.419 s，结果与杆长 L 无关。\n易错点：0.209 s 用 I = mL²/12；0.593 s 把弹簧力当成 kθ 而漏掉力臂 L；0.296 s 把等效劲度系数取成 kL。","id":"c06q034"},{"type":"choice","difficulty":5,"tags":["双线摆","扭转振动","转动惯量"],"stem":"一圆盘用两根长 l = 1.20 m 的细线对称悬挂，两悬点相距 2d = 0.300 m，圆盘绕竖直中心轴作扭转振动。已知圆盘对该轴的转动惯量 I = 0.0150 kg·m²，圆盘质量 m = 1.50 kg，取 g = 9.8 m/s²，其扭转振动周期为","options":["1.47 s","1.04 s","0.733 s","2.93 s"],"answer":"A","explain":"解析：双线摆扭转时，每根线偏离竖直方向约 dθ/l，张力约 mg/2，其水平分量对中心轴产生恢复力矩，总力矩系数为 κ = mgd²/l。\nT = 2π√(I/κ) = 2π√(Il/(mgd²))。代入 d = 0.150 m：mgd² = 1.50×9.8×0.0225 = 0.331，Il = 0.0180，比值 0.0544，开方 0.233，T = 1.47 s。\n易错点：0.733 s 把 2d = 0.300 m 直接当 d，力矩系数大了 4 倍；2.93 s 把周期多乘了 2；1.04 s 把 I 与 κ 的比值取错。","id":"c06q035"},{"type":"choice","difficulty":5,"tags":["单摆","非惯性系","等效重力"],"stem":"一辆汽车以 a = 2.00 m/s² 的水平加速度行驶，车内悬挂一摆长 L = 0.800 m 的单摆，在车中作小角度摆动。取 g = 9.8 m/s²，其周期及平衡位置与竖直方向的夹角分别为","options":["1.78 s，11.5°","2.21 s，11.5°","1.80 s，0°","1.64 s，11.5°"],"answer":"A","explain":"解析：在汽车非惯性系中，摆球受重力 mg 与水平惯性力 ma，等效重力加速度 g_eff = √(g² + a²) = √(9.8² + 2.00²) = 10.0 m/s²。\nT = 2π√(L/g_eff) = 2π√(0.800/10.0) = 1.78 s。\n平衡位置沿等效重力方向，与竖直方向夹角 tanθ = a/g = 2.00/9.8，θ = 11.5°。\n易错点：1.80 s 忽略加速度；1.64 s 用 g + a；2.21 s 用 g − a。等效重力是两力的矢量和，不是代数和。","id":"c06q036"},{"type":"choice","difficulty":5,"tags":["LC 振荡","电容电感变化","频率比"],"stem":"一理想 LC 振荡电路的频率为 f。若把电容器两极板间距增大为原来的 2 倍（电容变为原来的一半），同时把电感线圈的电感增大为原来的 4 倍，则新频率 f′ 与 f 之比为","options":["1.41","2.00","0.707","0.500"],"answer":"C","explain":"解析：LC 振荡频率 f = 1/(2π√(LC))。板间距加倍使 C′ = C/2，电感变为 L′ = 4L，故 L′C′ = 4L×C/2 = 2LC。\nf′ = 1/(2π√(2LC)) = f/√2 = 0.707f。\n易错点：1.41 只考虑了电容减半；2.00 把乘积变化当成 4 倍；0.500 把频率与 √(LC) 当成线性反比。频率与 √(LC) 成反比。","id":"c06q037"},{"type":"choice","difficulty":5,"tags":["双体振子","能量分配","约化质量"],"stem":"两个质量分别为 m₁ = 0.300 kg 和 m₂ = 0.600 kg 的物体用劲度系数 k = 180 N/m 的轻弹簧连接，放在光滑水平面上，系统总机械能为 0.0500 J。m₁ 的振幅为","options":["3.14 cm","0.786 cm","1.57 cm","2.36 cm"],"answer":"C","explain":"解析：约化质量 μ = m₁m₂/(m₁ + m₂) = 0.200 kg，相对振动角频率 ω = √(k/μ) = 30.0 rad/s。\n总能量 E = ½kA_rel²，故相对振幅 A_rel = √(2E/k) = √(0.100/180) = 0.0236 m。\n质心不动时 m₁x₁ + m₂x₂ = 0，x_rel = x₁ − x₂，故 m₁ 的振幅 A₁ = (μ/m₁)A_rel = (0.200/0.300)×0.0236 = 0.0157 m。\n易错点：2.36 cm 是相对振幅；0.786 cm 是 m₂ 的振幅；3.14 cm 把能量公式漏掉 ½。","id":"c06q038"},{"type":"choice","difficulty":5,"tags":["阻尼振动","临界阻尼","阻尼振动角频率"],"stem":"一弹簧振子的质量 m = 0.250 kg，劲度系数 k = 64.0 N/m。使系统恰好处于临界阻尼状态所需的阻尼系数 c，以及当 c = 6.00 kg/s 时系统的阻尼振动角频率分别为","options":["16.0 kg/s，10.6 rad/s","4.00 kg/s，10.6 rad/s","8.00 kg/s，16.0 rad/s","8.00 kg/s，10.6 rad/s"],"answer":"D","explain":"解析：临界阻尼条件为 β = ω₀，即 c/(2m) = √(k/m)，故 c_c = 2√(mk) = 2√(0.250×64.0) = 8.00 kg/s。\n当 c = 6.00 kg/s 时，β = c/(2m) = 12.0 s⁻¹，ω₀ = √(64.0/0.250) = 16.0 rad/s，阻尼振动角频率 ω_d = √(ω₀² − β²) = √(256 − 144) = 10.6 rad/s。\n易错点：16.0 rad/s 直接用 ω₀；4.00 kg/s 漏掉因子 2；16.0 kg/s 把 c_c 算成 2mω₀ 的两倍。c \u003c c_c 才是欠阻尼。","id":"c06q039"},{"type":"choice","difficulty":5,"tags":["平均速度","相位法","区间选取"],"stem":"一质点作简谐振动，振幅 A = 5.00 cm，周期 T = 0.400 s。质点从 x = −A/2 处向 x 轴正方向运动，第一次到达 x = +A/2 的过程中，平均速度的大小为","options":["0","0.750 m/s","1.50 m/s","0.500 m/s"],"answer":"B","explain":"解析：从 x = −A/2 向正方向运动时相位为 4π/3，到达 x = +A/2 且向正方向运动时相位为 5π/3，相位变化 π/3。\n所用时间 Δt = (π/3)/(2π)×T = T/6 = 0.0667 s；位移大小 Δx = A = 0.0500 m。\n平均速度大小 = Δx/Δt = 0.0500/0.0667 = 0.750 m/s。\n易错点：0.500 m/s 是 4A/T，对应从平衡位置到端点；1.50 m/s 把时间取成 T/12；0 是整周期平均速度。平均速度看位移，不看路程。","id":"c06q040"},{"type":"choice","difficulty":5,"tags":["相位法","时间比例","变速运动"],"stem":"一质点作简谐振动，振幅为 A。它从平衡位置运动到 x = A/2 所需时间与从 x = A/2 运动到 x = A 所需时间之比为","options":["1∶3","1∶2","2∶1","1∶1"],"answer":"C","explain":"解析：取 x = A sinωt。从 x = 0 到 x = A/2，相位由 0 增到 π/3，Δφ₁ = π/3，t₁ = (π/3)/(2π)×T = T/6。\n从 x = A/2 到 x = A，相位由 π/3 增到 π/2，Δφ₂ = π/6，t₂ = T/12。\n故 t₁∶t₂ = (T/6)∶(T/12) = 2∶1。\n易错点：直觉上「靠近端点速度慢、应更费时」，会误选 1∶2；但这两段位移虽同为 A/2，相位跨度却分别是 π/3 和 π/6，平衡位置附近速度大，反而先走完。1∶1 忽略了速度随位置变化；1∶3 把相位跨度取错。","id":"c06q041"},{"type":"choice","difficulty":5,"tags":["斜向弹簧","等效劲度系数","小角度近似"],"stem":"质量 m = 0.800 kg 的物体由两根相同的弹簧对称悬挂，每根弹簧的劲度系数 k = 200 N/m，平衡时两弹簧与竖直方向的夹角均为 30.0°。物体沿竖直方向作微小振动，其周期为","options":["0.281 s","0.324 s","0.398 s","0.229 s"],"answer":"B","explain":"解析：设物体竖直位移 x，每根弹簧长度改变 x cos30.0°，弹力改变 kx cos30.0°，其竖直分量为 kx cos²30.0°。\n两根弹簧的竖直回复力合计 F = 2k cos²30.0° x，故等效劲度系数 k_eq = 2×200×0.750 = 300 N/m。\nT = 2π√(m/k_eq) = 2π√(0.800/300) = 0.324 s。\n易错点：0.281 s 用 2k = 400 N/m，漏掉 cos² 因子；0.398 s 只用一根弹簧的 k；0.229 s 用 2k/cos²30.0°。斜向弹簧只有沿竖直方向的分力起作用。","id":"c06q042"},{"type":"choice","difficulty":5,"tags":["平均动能","能量积分","相位区间"],"stem":"一质点作简谐振动，总机械能为 E。在从平衡位置 x = 0 运动到 x = A/2 的这段时间内，质点的平均动能与 E 之比为","options":["0.250","0.500","0.087","0.913"],"answer":"D","explain":"解析：取 x = A sinωt，则 v = Aωcosωt，动能 K = ½mv² = E cos²ωt。\n从 x = 0 到 x = A/2 对应相位 0 到 π/6，时间间隔 Δt = T/12。平均动能 K̄ = (1/Δt)∫₀^(Δt) E cos²ωt dt。\n换元 u = ωt，得 K̄/E = (6/π)∫₀^(π/6) cos²u du = (6/π)[u/2 + sin2u/4]₀^(π/6) = (6/π)(π/12 + √3/8) = 0.913。\n物理意义：该区间靠近平衡位置，速度大，平均动能高于全周期的 E/2。\n易错点：0.500 是全周期平均动能；0.087 是同一区间的平均势能占比（两者之和为 1）；0.250 无物理来源，多由误取振幅比得到。","id":"c06q043"},{"type":"choice","difficulty":5,"tags":["受迫振动","相位分支","高频极限"],"stem":"一受迫振动系统的固有角频率为 ω₀，阻尼系数 β = 0.100ω₀，驱动力角频率 ω = 2.00ω₀。稳定后位移落后驱动力的相位差约为","options":["90.0°","172°","188°","8.00°"],"answer":"B","explain":"解析：相位差满足 tanφ = 2βω/(ω₀² − ω²)。代入 β = 0.100ω₀、ω = 2.00ω₀：tanφ = 0.400ω₀²/(ω₀² − 4.00ω₀²) = −0.133。\n由于 ω > ω₀，分母为负，φ 在第二象限，φ = π − 0.133 = 3.01 rad = 172°。\n物理意义：驱动频率远高于固有频率时，位移几乎与驱动力反相。\n易错点：8.00° 取了 arctan 的主值而丢掉第二象限；90.0° 是共振时的相位差；188° 超出了 0 到 180° 的范围。","id":"c06q044"},{"type":"calc","difficulty":5,"tags":["复摆","符号推导","最小周期"],"stem":"一刚体绕水平光滑定轴在竖直平面内作小角度摆动，质心到轴的距离为 d，刚体对该轴的转动惯量为 I，质量为 m。(1) 证明其周期 T = 2π√(I/mgd)；(2) 一根质量均匀的细杆长 L = 1.00 m，一端悬挂，求其周期；(3) 对同一细杆，求使周期最小的悬点到杆中心的距离 d 及最小周期。取 g = 9.8 m/s²。","answer":"(1) 证明见解析；(2) T = 1.64 s；(3) d = 0.289 m，T_min = 1.53 s","explain":"解析：(1) 偏离平衡位置 θ 时，重力对轴产生恢复力矩 τ = −mgd sinθ ≈ −mgdθ（小角度）。由转动定律 Iθ¨ = τ 得 θ¨ + (mgd/I)θ = 0，故 ω = √(mgd/I)，T = 2π√(I/mgd)。\n(2) 均匀细杆绕一端：I = mL²/3，d = L/2，T = 2π√(2L/3g) = 2π√(2×1.00/(3×9.8)) = 1.64 s。\n(3) 由平行轴定理 I = mL²/12 + md²，T² = (4π²/g)(L²/(12d) + d)。对 d 求导并令其为零：−L²/(12d²) + 1 = 0，得 d = L/√12 = 0.289 m。\n代回得 T_min = 2π√(2d/g) = 2π√(0.577/9.8) = 1.53 s。\n易错点：d 必须从质心量起；最小周期不是 d → 0 或 d → L/2，而是复摆与单摆周期曲线的交点附近。","id":"c06q045"},{"type":"calc","difficulty":5,"tags":["双线摆","符号推导","扭转振动"],"stem":"一圆盘用两根长均为 l 的细线对称悬挂，两悬点相距 2d，圆盘绕竖直中心轴作小角度扭转振动。设圆盘对该轴的转动惯量为 I，质量为 m。(1) 证明周期 T = 2π√(Il/(mgd²))；(2) 若 l = 1.50 m，d = 0.200 m，I = 0.0200 kg·m²，m = 2.00 kg，求周期。取 g = 9.8 m/s²。","answer":"(1) 证明见解析；(2) T = 1.23 s","explain":"解析：(1) 扭转角 θ 时，每根悬点水平移动约 dθ，线与竖直方向夹角约 dθ/l。每根线张力约为 mg/2，其水平分量约 (mg/2)(dθ/l)，对中心轴的力臂为 d。\n总恢复力矩 τ = −2×(mg/2)(dθ/l)×d = −(mgd²/l)θ，故等效扭转系数 κ = mgd²/l。\n由 Iθ¨ = −κθ 得 T = 2π√(I/κ) = 2π√(Il/(mgd²))。\n(2) Il = 0.0200×1.50 = 0.0300；mgd² = 2.00×9.8×0.200² = 0.784；比值 0.0383，开方 0.1956，T = 2π×0.1956 = 1.23 s。\n易错点：两悬点相距是 2d，公式中的 d 是半间距；张力由两根线分担，但力臂求和后正好给出 mgd²/l。","id":"c06q046"},{"type":"calc","difficulty":5,"tags":["受迫振动","共振曲线","相位差"],"stem":"一受迫振动系统质量 m = 0.500 kg，劲度系数 k = 50.0 N/m，阻尼系数 β = 2.00 s⁻¹，驱动力 F = F₀cos ωt，F₀ = 2.00 N。(1) 写出稳定振幅 A(ω) 的表达式，求出共振角频率 ω_r 和共振时的振幅；(2) 求 ω = 8.00 rad/s 时位移落后驱动力的相位差。","answer":"(1) A(ω) = (F₀/m)/√((ω₀² − ω²)² + 4β²ω²)，ω_r = 9.59 rad/s，A_r = 0.102 m；(2) φ = 41.6°","explain":"解析：运动方程为 m x¨ + 2mβ x˙ + kx = F₀cosωt，记 ω₀ = √(k/m) = 10.0 rad/s。\n(1) 稳态解振幅 A(ω) = (F₀/m)/√((ω₀² − ω²)² + 4β²ω²)。对 ω² 求极值得 ω_r = √(ω₀² − 2β²) = √(100 − 8.00) = 9.59 rad/s。\n共振振幅 A_r = F₀/(2mβ√(ω₀² − β²)) = 2.00/(2×0.500×2.00×√96.0) = 0.102 m。\n(2) tanφ = 2βω/(ω₀² − ω²) = 2×2.00×8.00/(100 − 64.0) = 0.889，φ = 41.6°，位移落后驱动力。\n易错点：共振振幅略大于 ω = ω₀ 时的 0.100 m；ω_r 不是 ω₀，也不是 ω₀ − β。","id":"c06q047"},{"type":"calc","difficulty":5,"tags":["刚体与弹簧","符号推导","等效劲度系数"],"stem":"一质量均匀的细杆质量 m、长 L，一端用光滑水平轴固定，另一端与劲度系数为 k 的水平轻弹簧相连，杆在竖直平面内作小角度振动。(1) 求等效劲度系数（力矩系数）和周期 T 的表达式；(2) 若 m = 0.800 kg，k = 60.0 N/m，L = 0.600 m，初始角位移 θ₀ = 0.0500 rad 由静止释放，求周期和杆端最大速率。","answer":"(1) κ_θ = kL²，ω = √(3k/m)，T = 2π√(m/3k)；(2) T = 0.419 s，v_max = 0.450 m/s","explain":"解析：(1) 杆偏转 θ 时，弹簧端点位移 Lθ，弹力 kLθ，对轴的恢复力矩 τ = −kLθ×L = −kL²θ，故力矩系数 κ_θ = kL²。\n杆绕端点转动惯量 I = mL²/3，由 Iθ¨ = τ 得 ω² = kL²/(mL²/3) = 3k/m，T = 2π√(m/3k)。注意 T 与 L 无关。\n(2) ω = √(3×60.0/0.800) = 15.0 rad/s，T = 2π/15.0 = 0.419 s；杆端最大速率 v_max = Lθ₀ω = 0.600×0.0500×15.0 = 0.450 m/s。\n易错点：弹簧的恢复力矩要乘力臂 L，不能把 k 直接当力矩系数；转动惯量必须用绕轴的 mL²/3，不是 mL²/12。","id":"c06q048"},{"type":"calc","difficulty":5,"tags":["垂直方向合成","李萨如图形","轨迹方程"],"stem":"一质点同时参与两个相互垂直的简谐振动：x = A cos ωt，y = B cos(2ωt + π/2)，A、B 均大于零。(1) 消去 t，求轨迹方程；(2) 说明轨迹形状；(3) 求 |y| 的最大值及对应的 x。","answer":"(1) y² = 4B²(x²/A²)(1 − x²/A²)；(2) 8 字形闭合曲线；(3) |y|_max = B，在 x = ±A/√2 处","explain":"解析：(1) y = B cos(2ωt + π/2) = −B sin2ωt = −2B sinωt cosωt。由 x = A cosωt 得 cosωt = x/A，sin²ωt = 1 − x²/A²。\n两边平方得 y² = 4B²(x²/A²)(1 − x²/A²)，即轨迹方程。\n(2) 该曲线在 x = ±A 处 y = 0，在 x = 0 处 y = 0，中间有两个峰，呈 8 字形（两个闭合环）。\n(3) 令 u = x²/A²，则 y² = 4B²u(1 − u)，在 u = 1/2 时取最大值 B²，故 |y|_max = B，对应 x = ±A/√2。\n易错点：相位差 π/2 使 y 变成 sin2ωt，不是 cos2ωt；轨迹不是抛物线，因为 x 与 y 的频率比为 1∶2。","id":"c06q049"},{"type":"calc","difficulty":5,"tags":["弹簧有效质量","符号推导","动能积分"],"stem":"一劲度系数为 k 的均匀弹簧，自身质量为 M，一端固定，另一端连接质量为 m 的振子，在光滑水平面上振动。设弹簧各点速度沿长度线性分布。(1) 证明系统的等效质量为 m + M/3，周期 T = 2π√((m + M/3)/k)；(2) 若 m = 0.500 kg，M = 0.300 kg，k = 120 N/m，求 T，并与忽略弹簧质量的结果比较，求相对偏差。","answer":"(1) 证明见解析，T = 2π√((m + M/3)/k)；(2) T = 0.444 s，比忽略弹簧质量时大 9.54%","explain":"解析：(1) 设振子速率为 v，距固定端 s 处的弹簧元速率为 v s/L。弹簧动能为 ∫₀^L ½(M/L)(v s/L)² ds = ½(M/3)v²。\n系统总动能 = ½mv² + ½(M/3)v² = ½(m + M/3)v²，故等效质量 m_eff = m + M/3。\n由 ω = √(k/m_eff) 得 T = 2π√((m + M/3)/k)。\n(2) m_eff = 0.500 + 0.100 = 0.600 kg，T = 2π√(0.600/120) = 0.444 s。\n忽略弹簧质量时 T₀ = 2π√(0.500/120) = 0.406 s，相对偏差 (T − T₀)/T₀ = √(0.600/0.500) − 1 = 9.54%。\n易错点：等效质量不是 M/2；弹簧动能积分要用速度线性分布，不能把整根弹簧当成以 v 运动。","id":"c06q050"}]},{"chapter":7,"chapterName":"机械波","questions":[{"id":"c07q001","type":"choice","difficulty":4,"tags":["波函数","初相","传播方向"],"stem":"一平面简谐波沿 x 轴正方向传播，波速 u = 20.0 m/s，频率 ν = 5.00 Hz，振幅 A = 0.0200 m。t = 0 时 x = 0 处的质点位于平衡位置且向 y 轴正方向运动。该波的波方程为","options":["y = 0.0200 cos(10πt − 0.500πx) m","y = 0.0200 cos(10πt − 0.500πx − π/2) m","y = 0.0200 cos(10πt − 0.500πx + π/2) m","y = 0.0200 cos(10πt + 0.500πx − π/2) m"],"answer":"B","explain":"ω = 2πν = 10π rad/s，k = ω/u = 0.500π rad/m。设 y = A cos(ωt − kx + φ₀)，由 y(0,0) = 0 得 cos φ₀ = 0；速度 v_y = −Aω sin φ₀ > 0，故 sin φ₀ \u003c 0，取 φ₀ = −π/2。\n故 y = 0.0200 cos(10πt − 0.500πx − π/2) m。\n易错点：φ₀ = +π/2 对应 t = 0 时向下运动；kx 前取正号则传播方向反了。"},{"id":"c07q002","type":"choice","difficulty":3,"tags":["波方程","波长与波速","传播方向"],"stem":"一平面简谐波的波方程为 y = 0.0400 cos(6πt + 0.300πx)（SI 单位）。该波的波长、波速和传播方向分别为","options":["3.33 m，20.0 m/s，沿 x 轴负方向","6.67 m，0.200 m/s，沿 x 轴负方向","6.67 m，20.0 m/s，沿 x 轴负方向","6.67 m，20.0 m/s，沿 x 轴正方向"],"answer":"C","explain":"与 y = A cos(ωt + kx) 对比：ω = 6π rad/s，k = 0.300π rad/m。λ = 2π/k = 6.67 m，u = ω/k = 20.0 m/s。\nωt 与 kx 同号，相位面向 −x 推进，故沿 x 轴负方向传播。\n易错点：λ = π/k 会得 3.33 m；把 k/ω = 0.200 当波速。"},{"id":"c07q003","type":"choice","difficulty":4,"tags":["波方程","质点振动方程"],"stem":"一平面简谐波 y = 0.0500 cos(4πt − 0.250πx + π/3)（SI 单位）。x = 3.00 m 处质点的振动方程为","options":["y = 0.0500 cos(4πt − 5π/12) m","y = 0.0500 cos(4πt + π/3) m","y = 0.0500 cos(4πt + 13π/12) m","y = 0.0500 cos(4πt − 13π/12) m"],"answer":"A","explain":"代入 x = 3.00 m：kx = 0.250π×3.00 = 0.750π = 3π/4，相位 = 4πt − 3π/4 + π/3 = 4πt − 5π/12。\n故 y = 0.0500 cos(4πt − 5π/12) m。\n易错点：忘记代入 x 得 +π/3；kx 符号取反得 +13π/12；初相符号取反得 −13π/12。"},{"id":"c07q004","type":"choice","difficulty":5,"tags":["波形平移","相位","质点速度"],"stem":"一平面简谐波沿 x 轴正方向传播，波速 u = 10.0 m/s。t = 0 时的波形为 y = 0.100 cos(0.500πx)（x 的单位为 m）。t = 0.500 s 时，x = 1.00 m 处质点的位移和运动方向为","options":["0，向 y 轴正方向运动","−0.100 m，速度为零","0.100 m，向 y 轴负方向运动","0.100 m，速度为零"],"answer":"D","explain":"由波形读出 k = 0.500π rad/m，ω = ku = 5π rad/s，沿 +x 传播，故 y = 0.100 cos(5πt − 0.500πx)。\nt = 0.500 s、x = 1.00 m 时相位 = 2.5π − 0.5π = 2π，质点位于波峰，位移 0.100 m，速度为零。\n易错点：只把波形平移 5.00 m 后误判 x = 1.00 m 在平衡位置；把波峰处速度当成最大。"},{"id":"c07q005","type":"choice","difficulty":4,"tags":["波形曲线","初相","振动方程"],"stem":"一平面简谐波沿 x 轴正方向传播，波速 u = 25.0 m/s。t = 0 时的波形为 y = 0.0500 sin(0.400πx)（x 的单位为 m）。x = 0 处质点的振动方程为","options":["y = −0.0500 cos(10πt) m","y = −0.0500 sin(10πt) m","y = 0.0500 sin(10πt) m","y = 0.0500 cos(10πt) m"],"answer":"B","explain":"k = 0.400π rad/m，ω = ku = 10π rad/s。t = 0 时 y = A sin(kx) = A cos(kx − π/2)，对 +x 波设 y = A cos(ωt − kx + φ₀)，比较得 φ₀ = π/2。\nx = 0 处 y = 0.0500 cos(10πt + π/2) = −0.0500 sin(10πt)。也可由 t = 0 时 x = 0 处波形斜率为正、波向 +x 传播，判断该点向下运动。\n易错点：漏判传播方向得 +0.0500 sin(10πt)，初相与速度方向正好相反。"},{"id":"c07q006","type":"choice","difficulty":4,"tags":["相位差","波的传播"],"stem":"一平面简谐波 y = 0.0300 cos(8πt − (2π/3.00)x)（SI 单位）。x = 0 与 x = 2.00 m 两质点振动的相位差，以及哪个质点先到达波峰，分别为","options":["4π/3，x = 2.00 m 处质点先到波峰","2π/3，x = 2.00 m 处质点先到波峰","4π/3，x = 0 处质点先到波峰","2π/3，x = 0 处质点先到波峰"],"answer":"C","explain":"k = 2π/3.00 rad/m，Δφ = kΔx = (2π/3.00)×2.00 = 4π/3。\n波沿 +x 传播，x = 0 处相位超前 4π/3，先达到波峰。\n易错点：把 Δx/λ 直接当相位（漏乘 2π）得 2π/3；传播方向判反会把「先到」判给 x = 2.00 m。"},{"id":"c07q007","type":"choice","difficulty":5,"tags":["平均能流","能量密度","频率与振幅"],"stem":"一列简谐横波沿弦线传播，弦线线密度 μ = 2.00×10⁻² kg/m，波速 u = 50.0 m/s，频率 ν = 100 Hz，振幅 A = 1.00×10⁻² m。该波的平均能流（功率）为；若波速不变而把频率加倍、振幅减半，平均能流变为","options":["19.7 W；19.7 W","19.7 W；4.93 W","9.87 W；9.87 W","39.5 W；19.7 W"],"answer":"A","explain":"ω = 2πν = 200π rad/s，P = ½μω²A²u = ½×2.00×10⁻²×(200π)²×(1.00×10⁻²)²×50.0 = 19.7 W。\n频率加倍使 ω² 变为 4 倍，振幅减半使 A² 变为 1/4，两者相抵，功率仍为 19.7 W。\n易错点：漏掉 ½ 得 39.5 W；只让 A² 变化而忘记 ω² 得 4.93 W。"},{"id":"c07q008","type":"choice","difficulty":4,"tags":["声强","声压振幅"],"stem":"空气中一平面简谐声波，声压振幅 p₀ = 2.00 Pa，空气密度 ρ = 1.20 kg/m³，声速 u = 340 m/s。该声波的声强为","options":["9.80×10⁻³ W/m²","2.45×10⁻³ W/m²","1.67×10⁻² W/m²","4.90×10⁻³ W/m²"],"answer":"D","explain":"声强 I = p₀²/(2ρu) = 2.00²/(2×1.20×340) = 4.90×10⁻³ W/m²。\n易错点：漏掉 ½ 得 9.80×10⁻³ W/m²；把 ½ 用了两次得 2.45×10⁻³ W/m²；把分母写成 ρu/2 得 1.67×10⁻² W/m²。"},{"id":"c07q009","type":"choice","difficulty":5,"tags":["波的能量","能量密度积分"],"stem":"一列简谐横波在弦上传播，弦线线密度 μ = 1.00×10⁻² kg/m，振幅 A = 5.00×10⁻³ m，频率 ν = 200 Hz，波速 u = 100 m/s。在一个波长长度的弦段内，波的总能量为","options":["2.96×10⁻¹ J","9.87×10⁻² J","1.97×10⁻¹ J","4.93×10⁻² J"],"answer":"B","explain":"λ = u/ν = 0.500 m，ω = 2πν = 400π rad/s。能量密度 w = μω²A² sin²(ωt − kx)，对 x 在 0 到 λ 上积分，∫sin²dx = λ/2，故 E = ½μω²A²λ = ½×1.00×10⁻²×(400π)²×(5.00×10⁻³)²×0.500 = 9.87×10⁻² J。\n结果与 t 无关：一个波长内动能与势能此消彼长，总量恒定。\n易错点：把平均能量密度乘 1 m 得 0.197 J；漏掉 ½ 得 0.197 J；把 A 当峰峰值再折半得 0.0493 J。"},{"id":"c07q010","type":"choice","difficulty":4,"tags":["弦上横波波速","线密度"],"stem":"两根用同种钢丝制成的弦线，直径分别为 0.500 mm 和 1.00 mm，都被张紧到 40.0 N。钢丝密度 7.80×10³ kg/m³。两弦线上横波波速分别为","options":["80.8 m/s 和 162 m/s","324 m/s 和 162 m/s","162 m/s 和 80.8 m/s","162 m/s 和 40.4 m/s"],"answer":"C","explain":"μ = ρπd²/4。d₁ = 0.500 mm 时 μ₁ = 1.53×10⁻³ kg/m，v₁ = √(T/μ₁) = √(40.0/1.53×10⁻³) = 162 m/s；d₂ = 1.00 mm 时 μ₂ = 4μ₁，v₂ = v₁/2 = 80.8 m/s。\n易错点：把 μ 当成与直径成正比会得 40.4 m/s；直径比 2 直接当波速比会得 324 m/s。"},{"id":"c07q011","type":"choice","difficulty":4,"tags":["固体中纵波波速","杨氏模量"],"stem":"钢的杨氏模量 E = 2.00×10¹¹ Pa，密度 ρ = 7.80×10³ kg/m³。钢棒中纵波（声波）的波速为","options":["5.06×10³ m/s","3.58×10³ m/s","7.16×10³ m/s","2.56×10⁷ m/s"],"answer":"A","explain":"固体中纵波波速 v = √(E/ρ) = √(2.00×10¹¹/7.80×10³) = √(2.56×10⁷) = 5.06×10³ m/s。\n易错点：把 E 除以 2ρ 得 3.58×10³ m/s；把 2E/ρ 开方得 7.16×10³ m/s；忘记开方得 2.56×10⁷ m/s。"},{"id":"c07q012","type":"choice","difficulty":3,"tags":["声速与温度","波长"],"stem":"空气中声速与热力学温度的关系为 v = 331√(T/273) m/s。气温 27.0 °C 时，频率为 500 Hz 的声波波长约为","options":["0.662 m","0.728 m","0.347 m","0.694 m"],"answer":"D","explain":"T = 27.0 + 273 = 300 K，v = 331√(300/273) = 347 m/s，λ = v/ν = 347/500 = 0.694 m。\n易错点：用 0 °C 的 331 m/s 得 0.662 m；误认为声速随摄氏温度线性增大得 0.728 m；把 λ 写成 v/(2ν) 得 0.347 m。"},{"id":"c07q013","type":"choice","difficulty":5,"tags":["两端固定","简正频率","基频"],"stem":"一根两端固定的弦线，相邻两次共振频率为 200 Hz 和 300 Hz。已知弦上横波波速为 400 m/s，则弦线的长度和基频分别为","options":["1.00 m，200 Hz","2.00 m，100 Hz","2.00 m，200 Hz","4.00 m，50.0 Hz"],"answer":"B","explain":"两端固定弦的简正频率 fₙ = nv/(2L)，相邻谐频之差等于基频，故 f₁ = 300 − 200 = 100 Hz。\n由 f₁ = v/(2L) 得 L = v/(2f₁) = 400/(2×100) = 2.00 m。\n易错点：把 200 Hz 当基频得 L = 1.00 m；把相邻频率差的一半当基频得 50.0 Hz、L = 4.00 m。"},{"id":"c07q014","type":"choice","difficulty":4,"tags":["一端固定一端自由","简正频率"],"stem":"一根长 1.00 m 的弦线，一端固定、另一端自由，弦上横波波速为 340 m/s。其三阶简正频率（第三共振频率）和对应的波长分别为","options":["425 Hz，1.33 m","850 Hz，0.400 m","425 Hz，0.800 m","255 Hz，1.33 m"],"answer":"C","explain":"一端固定一端自由：fₙ = (2n−1)v/(4L)，n = 3 时 f₃ = 5×340/(4×1.00) = 425 Hz。\n对应波长 λ₃ = 4L/5 = 0.800 m。\n易错点：取 n = 2 得 255 Hz；把 λ 写成 4L/3 得 1.33 m；把自由端也当固定端得 850 Hz。"},{"id":"c07q015","type":"choice","difficulty":4,"tags":["两端自由","波节约束"],"stem":"一根长 0.600 m 的弦线两端自由，弦上横波波速为 180 m/s。若在弦线中点轻触使其形成波节，则弦线可产生的最低频率为","options":["300 Hz","150 Hz","450 Hz","600 Hz"],"answer":"A","explain":"两端自由时 fₙ = nv/(2L) = 150n Hz。中点轻触强制 x = L/2 为波节，要求 sin(nπ/2) = 0，n 必须为偶数，最低取 n = 2。\n故最低频率为 2×150 = 300 Hz。\n易错点：忽略中点约束取 n = 1 得 150 Hz；把中点当波腹会得 450 Hz。"},{"id":"c07q016","type":"choice","difficulty":4,"tags":["驻波","振幅分布","波节间距"],"stem":"一驻波方程为 y = 0.0200 sin(0.500πx) cos(200πt)（SI 单位）。x = 1.00 m 处质点的振幅与相邻两波节间的距离分别为","options":["0.0200 m，4.00 m","0.0100 m，2.00 m","0，2.00 m","0.0200 m，2.00 m"],"answer":"D","explain":"k = 0.500π rad/m，λ = 2π/k = 4.00 m，相邻波节间距 λ/2 = 2.00 m。\nx = 1.00 m 处振幅 = 0.0200|sin(0.500π×1.00)| = 0.0200 m，是波腹。\n易错点：把波节间距当 λ 得 4.00 m；把驻波振幅取一半得 0.0100 m；误认为 x = 1.00 m 是波节得振幅 0。"},{"id":"c07q017","type":"choice","difficulty":4,"tags":["驻波","波腹间距","叠加"],"stem":"两列相干波 y₁ = 0.0300 cos(4πt − 2πx) 与 y₂ = 0.0300 cos(4πt + 2πx)（SI 单位）叠加。合成波的相邻波腹间距和波腹处最大振幅分别为","options":["0.250 m，0.0600 m","0.500 m，0.0600 m","0.500 m，0.0300 m","1.00 m，0.0600 m"],"answer":"B","explain":"y = y₁ + y₂ = 0.0600 cos(2πx) cos(4πt)。波腹处 |cos(2πx)| = 1，相邻波腹间距为半个波长。\n由 k = 2π rad/m 得 λ = 1.00 m，故间距 0.500 m；最大振幅为两波振幅之和 0.0600 m。\n易错点：把间距当 λ 得 1.00 m；忘记叠加仍取 0.0300 m；把间距当 λ/4 得 0.250 m。"},{"id":"c07q018","type":"choice","difficulty":5,"tags":["固定端反射","半波损失","反射波"],"stem":"一列简谐波沿弦线向 x 轴正方向传播，在 x = 0 处遇到固定端被反射。入射波为 yᵢ = 0.0200 cos(40πt − 5πx)（SI 单位）。反射波的方程为","options":["yᵣ = −0.0200 cos(40πt − 5πx) m","yᵣ = 0.0400 cos(40πt + 5πx) m","yᵣ = −0.0200 cos(40πt + 5πx) m","yᵣ = 0.0200 cos(40πt + 5πx) m"],"answer":"C","explain":"固定端反射有半波损失，反射波与入射波在 x = 0 处相位差 π，且传播方向反向：yᵣ = 0.0200 cos(40πt + 5πx + π) = −0.0200 cos(40πt + 5πx)。\n验证：x = 0 处 yᵢ + yᵣ = 0.0200 cos(40πt) − 0.0200 cos(40πt) = 0，符合固定端为波节。\n易错点：无半波损失得 +0.0200 cos(40πt + 5πx)；方向写反得 −0.0200 cos(40πt − 5πx)；把反射波振幅错写成 2A 得 0.0400 m。"},{"id":"c07q019","type":"choice","difficulty":5,"tags":["自由端反射","反射波","波腹"],"stem":"一列简谐波在弦线上沿 x 轴正方向传播，在 x = 0 处遇到自由端（可自由滑动）被反射。入射波为 yᵢ = 0.0150 cos(20πt − 4πx)（SI 单位）。反射波方程及反射点处的合振幅为","options":["yᵣ = 0.0150 cos(20πt + 4πx) m，0.0300 m","yᵣ = −0.0150 cos(20πt + 4πx) m，0","yᵣ = 0.0150 cos(20πt − 4πx) m，0.0300 m","yᵣ = −0.0150 cos(20πt − 4πx) m，0"],"answer":"A","explain":"自由端反射无半波损失，反射波与入射波在 x = 0 处同相，且反向传播：yᵣ = 0.0150 cos(20πt + 4πx)。\nx = 0 处两波同相叠加，合振幅 2×0.0150 = 0.0300 m，是波腹。\n易错点：套用固定端的半波损失得 −0.0150 cos(20πt + 4πx)；反射波方向不变得 0.0150 cos(20πt − 4πx)。"},{"id":"c07q020","type":"choice","difficulty":5,"tags":["相干叠加","初相差","合振幅"],"stem":"两相干波源 S₁、S₂ 相距 1.00 m，频率均为 850 Hz，S₂ 的初相落后 S₁ 为 π，波速 340 m/s。在两源连线的延长线上、S₂ 外侧距 S₁ 2.00 m 的 P 点，两波引起的合振幅与单一波源振幅 A 的关系为","options":["0","√2 A","A","2A"],"answer":"D","explain":"λ = u/ν = 340/850 = 0.400 m。r₁ = 2.00 m，r₂ = 1.00 m，波程差 r₂ − r₁ = −1.00 m = −2.5λ，波程相位差为 −5π。\n总相位差 Δφ = −5π + (−π) = −6π，为 2π 的整数倍，两波同相，合振幅 2A。\n易错点：漏掉初相差 π 会判成反相得 0；只看波程差 2.5λ 的小数部分 0.5 也判反相。"},{"id":"c07q021","type":"choice","difficulty":5,"tags":["干涉极大","条纹间距","远场近似"],"stem":"两相干波源相距 d = 0.400 m，同相振动，波长 λ = 0.0800 m。在距两源连线中点垂直距离 L = 12.0 m 的远处，与连线平行的直线上相邻两个极大点之间的距离约为","options":["0.200 m","2.40 m","1.20 m","4.80 m"],"answer":"B","explain":"远处波程差 Δr ≈ d sin θ，极大条件 d sin θ = mλ，相邻极大对应 Δ(sin θ) = λ/d。\n在 y = L tan θ ≈ L sin θ 的屏上，间距 Δy = LΔ(sin θ) = λL/d = 0.0800×12.0/0.400 = 2.40 m。\n易错点：漏乘 L 得 λ/d = 0.200 m；把公式写成 λL/(2d) 得 1.20 m；多乘 2 得 4.80 m。"},{"id":"c07q022","type":"choice","difficulty":5,"tags":["干涉极小","波程差"],"stem":"两相干声源相距 1.20 m，同相振动，声速 340 m/s。在两源连线的延长线上、距较近声源 4.00 m 的点 P 处，要出现声强极小，声源的最低频率为","options":["425 Hz","567 Hz","142 Hz","283 Hz"],"answer":"C","explain":"延长线上波程差恒为 Δr = 1.20 m。极小条件 Δr = (n + ½)λ，最低频率对应最长波长，取 n = 0：λ = 2Δr = 2.40 m。\nf = u/λ = 340/2.40 = 142 Hz。\n易错点：误用极大条件 Δr = λ 得 283 Hz；取 n = 1 得 425 Hz；把 Δr 当成半波长直接算得 567 Hz。"},{"id":"c07q023","type":"choice","difficulty":5,"tags":["干涉强度","相位差"],"stem":"两相干波源在 P 点引起的强度分别为 4I₀ 和 I₀，两波在 P 点的相位差为 π/3。P 点的合强度为","options":["7I₀","5I₀","3I₀","9I₀"],"answer":"A","explain":"I = I₁ + I₂ + 2√(I₁I₂) cos Δφ = 4I₀ + I₀ + 2√(4I₀·I₀)×cos(π/3) = 5I₀ + 4I₀×0.500 = 7I₀。\n易错点：只把强度直接相加得 5I₀；把干涉项符号取反得 3I₀；把振幅直接相加后平方得 9I₀。"},{"id":"c07q024","type":"choice","difficulty":4,"tags":["多普勒效应","声源运动"],"stem":"一列火车以 30.0 m/s 的速度驶向静止的观察者，鸣笛频率为 500 Hz，空气中声速 340 m/s。观察者听到的频率为","options":["544 Hz","459 Hz","500 Hz","548 Hz"],"answer":"D","explain":"声源靠近静止观察者：ν′ = νu/(u − v_s) = 500×340/(340 − 30.0) = 548 Hz。\n易错点：把声源速度加到分母得 459 Hz（声源远离）；误用观察者靠近的公式得 544 Hz；认为频率不变得 500 Hz。"},{"id":"c07q025","type":"choice","difficulty":3,"tags":["多普勒效应","观察者运动"],"stem":"一观察者以 20.0 m/s 的速度跑向静止的声源，声源频率为 800 Hz，声速 340 m/s。观察者听到的频率为","options":["850 Hz","847 Hz","753 Hz","800 Hz"],"answer":"B","explain":"观察者靠近静止声源：ν′ = ν(u + v_o)/u = 800×(340 + 20.0)/340 = 847 Hz。\n易错点：符号取反得 753 Hz（远离）；把观察者速度放到分母得 850 Hz（误用声源运动公式）；认为频率不变得 800 Hz。"},{"id":"c07q026","type":"choice","difficulty":4,"tags":["多普勒效应","两者都运动"],"stem":"声源以 20.0 m/s 的速度向右运动，观察者在声源右方以 10.0 m/s 的速度也向右运动，声源频率 600 Hz，声速 340 m/s。观察者听到的频率为","options":["600 Hz","637 Hz","619 Hz","582 Hz"],"answer":"C","explain":"声源追观察者，两者同向：ν′ = ν(u − v_o)/(u − v_s) = 600×(340 − 10.0)/(340 − 20.0) = 619 Hz。\n易错点：把两个速度位置写反得 582 Hz；把同向追及当成相向得 637 Hz；忽略运动得 600 Hz。"},{"id":"c07q027","type":"choice","difficulty":5,"tags":["多普勒效应","反射","拍频"],"stem":"汽车以 20.0 m/s 的速度驶向一面竖直墙壁，鸣笛频率 400 Hz，声速 340 m/s。司机听到由墙壁反射回来的声音与直接听到的笛声之间的拍频为","options":["50.0 Hz","25.0 Hz","23.5 Hz","100 Hz"],"answer":"A","explain":"墙接收到的频率 ν₁ = νu/(u − v) = 400×340/(340 − 20.0) = 425 Hz。墙把该频率反射，司机迎着反射波运动，ν₂ = ν₁(u + v)/u = 425×(340 + 20.0)/340 = 450 Hz。\n拍频 = 450 − 400 = 50.0 Hz。\n易错点：只算墙接收频率与源频之差得 25.0 Hz（漏掉司机迎波）；只考虑司机迎波得 23.5 Hz（漏掉声源运动）；把反射当成频率再翻倍得 100 Hz。"},{"id":"c07q028","type":"choice","difficulty":3,"tags":["多普勒效应","频率降低"],"stem":"一观察者以 34.0 m/s 的速度远离静止的声源，声源频率 1000 Hz，声速 340 m/s。观察者听到的频率比声源频率降低了约","options":["111 Hz","90.9 Hz","34.0 Hz","100 Hz"],"answer":"D","explain":"观察者远离静止声源：ν′ = ν(u − v_o)/u = 1000×(340 − 34.0)/340 = 900 Hz，降低了 100 Hz。\n易错点：把声源远离的公式拿来用得 909 Hz、降低 90.9 Hz；把分母写成 u − v 得 111 Hz；直接把速度 34.0 m/s 当频差。"},{"id":"c07q029","type":"choice","difficulty":4,"tags":["声强级","声强叠加"],"stem":"两个独立的声源在某点产生的声强级均为 60.0 dB。若再叠加一个在该点声强级为 70.0 dB 的声源，三者在同一点同时发声时的总声强级为","options":["80.8 dB","70.8 dB","73.0 dB","130 dB"],"answer":"B","explain":"60.0 dB 对应 I = 1.00×10⁻⁶ W/m²，两个共 2.00×10⁻⁶ W/m²；70.0 dB 对应 1.00×10⁻⁵ W/m²。总 I = 1.20×10⁻⁵ W/m²。\n总声强级 = 10lg(1.20×10⁻⁵/1.00×10⁻¹²) = 70.8 dB。\n易错点：把两个 60 dB 先合成 63 dB 再加 10 dB 得 73.0 dB；把声强级直接相加得 130 dB；把总声强级再叠加一次 10 dB 得 80.8 dB。"},{"id":"c07q030","type":"choice","difficulty":5,"tags":["声强级","距离衰减","声强叠加"],"stem":"两台相同的机器各自在距其 5.00 m 处产生 75.0 dB 的声强级，两机互不相干。某点距第一台 5.00 m、距第二台 10.0 m。求该点的总声强级；若两台机器都移到距该点 10.0 m 处，总声强级又为多少","options":["78.0 dB；72.0 dB","75.0 dB；69.0 dB","76.0 dB；72.0 dB","76.8 dB；72.0 dB"],"answer":"C","explain":"距离加倍声强级降低 10lg4 = 6.02 dB，第二台在该点单独产生 75.0 − 6.02 = 69.0 dB（I₂ = 7.94×10⁻⁶ W/m²）；第一台为 75.0 dB（I₁ = 3.16×10⁻⁵ W/m²）。\n两机不相干，声强相加：I = 3.96×10⁻⁵ W/m²，总声强级 = 10lg(3.96×10⁻⁵/10⁻¹²) = 76.0 dB。\n都移到 10.0 m 时各为 69.0 dB，总 I = 1.59×10⁻⁵ W/m²，总声强级 72.0 dB。\n易错点：把 75 dB 与 69 dB 直接相加；认为距离加倍只降 3 dB 得 76.8 dB。"},{"id":"c07q031","type":"choice","difficulty":3,"tags":["声强级","对数标度"],"stem":"某声波的声强为 1.00×10⁻⁵ W/m²，声强级的基准声强为 1.00×10⁻¹² W/m²。该声波的声强级为","options":["70.0 dB","50.0 dB","100 dB","120 dB"],"answer":"A","explain":"L = 10lg(I/I₀) = 10lg(1.00×10⁻⁵/1.00×10⁻¹²) = 10lg(10⁷) = 70.0 dB。\n易错点：把比值当 10⁵ 得 50.0 dB；把基准取成 10⁻¹⁰ 得 100 dB；把 10lg 写成 20lg 得 140 dB（120 来自对数与 10 的混淆）。"},{"id":"c07q032","type":"choice","difficulty":3,"tags":["拍","拍频"],"stem":"将频率为 440 Hz 和 444 Hz 的两支音叉同时敲响，听到的拍频和两次响度极大之间的时间间隔分别为","options":["4 Hz，0.500 s","2 Hz，0.250 s","8 Hz，0.125 s","4 Hz，0.250 s"],"answer":"D","explain":"拍频等于两频率之差：Δν = 444 − 440 = 4 Hz。响度极大每秒出现 4 次，相邻极大间隔 Δt = 1/Δν = 0.250 s。\n易错点：把间隔当成一个振动周期得 0.500 s；把频差除以 2 得 2 Hz；把两频率相加得 8 Hz。"},{"id":"c07q033","type":"choice","difficulty":4,"tags":["拍","加蜡判断"],"stem":"一支频率未知的音叉与 512 Hz 的标准音叉同时振动，每秒听到 4 次拍。在未知音叉上滴少量蜡后，拍频变为每秒 2 次。未知音叉的频率为","options":["520 Hz","516 Hz","508 Hz","514 Hz"],"answer":"B","explain":"原来 |f − 512| = 4，故 f = 516 Hz 或 508 Hz。滴蜡使音叉频率降低。\n若 f = 516 Hz，降低后接近 512 Hz，拍频减小到 2 Hz，符合；若 f = 508 Hz，降低后远离 512 Hz，拍频应增大，不符合。\n故 f = 516 Hz。\n易错点：只看初始拍频选 508 Hz；把「拍频减半」误当成频率减半。"},{"id":"c07q034","type":"choice","difficulty":5,"tags":["群速度","相速度","色散关系"],"stem":"某介质的色散关系为 ω = ak + bk³，其中 a = 3.00×10² m²/s，b = 2.00×10⁻² m⁴/s。当波数 k = 10.0 rad/m 时，相速度与群速度分别为","options":["302 m/s，304 m/s","300 m/s，300 m/s","302 m/s，306 m/s","306 m/s，302 m/s"],"answer":"C","explain":"相速度 v_p = ω/k = a + bk² = 300 + 0.0200×100 = 302 m/s。\n群速度 v_g = dω/dk = a + 3bk² = 300 + 3×2.00 = 306 m/s。\n易错点：把 v_g 写成 a + 2bk² 得 304 m/s；把两者位置对调得 306、302；忽略色散项得 300、300。"},{"id":"c07q035","type":"choice","difficulty":4,"tags":["波跨界面","频率不变","波长变化"],"stem":"一列机械波从介质 1 垂直入射到介质 2 的平界面，介质 2 中的波速是介质 1 中的 1.50 倍。若波在介质 1 中的频率为 200 Hz、波长为 1.20 m，则波在介质 2 中的频率和波长分别为","options":["200 Hz，1.80 m","300 Hz，1.80 m","200 Hz，0.800 m","133 Hz，1.80 m"],"answer":"A","explain":"波跨界面时频率由波源决定，保持不变：ν₂ = 200 Hz。\n波速变为 1.50 倍，λ = u/ν，故 λ₂ = 1.50×1.20 = 1.80 m。\n易错点：认为频率也随波速变 1.50 倍得 300 Hz；把波长比取反得 0.800 m；用 λ = ν/u 得 133 Hz。"},{"id":"c07q036","type":"calc","difficulty":5,"tags":["波函数","初相","传播方向"],"stem":"一平面简谐波沿 x 轴负方向传播，波速 u = 8.00 m/s，波长 λ = 1.60 m，振幅 A = 0.0500 m。t = 0 时，x = 0 处的质点位移为 y = 0.0250 m，且向 y 轴负方向运动。求：(1) 波方程；(2) x = 0.400 m 处质点在 t = 0.100 s 时的位移和速度。","answer":"(1) y = 0.0500 cos(10πt + 1.25πx + π/3) m；(2) y = 4.33×10⁻² m，v = 0.785 m/s，沿 y 轴正方向","explain":"k = 2π/λ = 1.25π rad/m，ω = ku = 10π rad/s。沿 −x 传播，设 y = A cos(ωt + kx + φ₀)。\nt = 0、x = 0：0.0250 = 0.0500 cos φ₀，得 cos φ₀ = 0.500；v_y = −Aω sin φ₀ \u003c 0，故 sin φ₀ > 0，取 φ₀ = π/3。\n(2) 相位 Φ = 10π×0.100 + 1.25π×0.400 + π/3 = π + 0.5π + π/3 = 11π/6。\ny = 0.0500 cos(11π/6) = 4.33×10⁻² m；v = −Aω sin(11π/6) = −0.0500×10π×(−0.500) = 0.785 m/s，方向沿 +y。"},{"id":"c07q037","type":"calc","difficulty":5,"tags":["波形曲线","波函数","振动方程"],"stem":"一平面简谐波沿 x 轴正方向传播，波速 u = 10.0 m/s。t = 0 时的波形为 y = 0.0400 cos(2.50πx)（x 的单位为 m）。求：(1) 波方程；(2) x = 0.200 m 处质点的振动方程；(3) 该质点从 t = 0 起第一次回到平衡位置的时间。","answer":"(1) y = 0.0400 cos(25πt − 2.50πx) m；(2) y = 0.0400 sin(25πt) m；(3) 4.00×10⁻² s","explain":"由 t = 0 波形读出 k = 2.50π rad/m，λ = 0.800 m，ω = ku = 25π rad/s。\n沿 +x 传播，设 y = A cos(ωt − kx + φ₀)；令 t = 0 与波形比较：cos(−kx + φ₀) = cos(kx)，得 φ₀ = 0。\n(2) 代入 x = 0.200 m：kx = 0.500π，y = 0.0400 cos(25πt − 0.500π) = 0.0400 sin(25πt) m。\n(3) t = 0 时该点在平衡位置并向 +y 运动，下一次回到平衡位置为半个周期：t = T/2 = π/ω = 0.0400 s。"},{"id":"c07q038","type":"calc","difficulty":5,"tags":["平均能量密度","能流","能量积分"],"stem":"空气中一平面简谐声波，频率 500 Hz，声速 340 m/s，声强 2.00×10⁻³ W/m²，波束截面积 5.00×10⁻² m²。求：(1) 平均能量密度；(2) 平均能流（功率）；(3) 取一个波长长、截面积为该面积的柱体，用积分求柱体内总能量，并说明它是否随时间变化。","answer":"(1) 5.88×10⁻⁶ J/m³；(2) 1.00×10⁻⁴ W；(3) 2.00×10⁻⁷ J，不随时间变化","explain":"平均能量密度 w̄ = I/u = 2.00×10⁻³/340 = 5.88×10⁻⁶ J/m³。\n平均能流 P = IS = 2.00×10⁻³×5.00×10⁻² = 1.00×10⁻⁴ W。\nλ = u/ν = 0.680 m。瞬时能量密度 w = w₀ sin²(ωt − kx)，∫₀^λ sin²(kx)dx = λ/2，故 E = w₀S(λ/2) = w̄Sλ，与 t 无关。\nE = 5.88×10⁻⁶×5.00×10⁻²×0.680 = 2.00×10⁻⁷ J。"},{"id":"c07q039","type":"calc","difficulty":5,"tags":["两端固定","简正频率","驻波振幅"],"stem":"一根长 L = 1.00 m、线密度 μ = 2.50×10⁻³ kg/m 的弦线两端固定，张力 T = 100 N。求：(1) 弦上横波波速；(2) 前三个简正频率；(3) 第三简正频率时相邻波节的间距，以及 x = L/6 处质点的振幅（设该简正模波腹处振幅为 0.0200 m）。","answer":"(1) 200 m/s；(2) 100 Hz、200 Hz、300 Hz；(3) 0.333 m，0.0200 m","explain":"v = √(T/μ) = √(100/2.50×10⁻³) = 200 m/s。\n两端固定：fₙ = nv/(2L) = 100n Hz，故前三个为 100、200、300 Hz。\n第三简正模 λ₃ = 2L/3 = 0.667 m，相邻波节间距 λ₃/2 = L/3 = 0.333 m。\n振幅分布 A(x) = A₀|sin(3πx/L)|，x = L/6 时 sin(π/2) = 1，振幅为 0.0200 m（波腹）。"},{"id":"c07q040","type":"calc","difficulty":5,"tags":["简正频率","边界条件"],"stem":"一根长 1.20 m 的弦线，弦上横波波速 240 m/s。分别求下列三种边界条件下最低的三个简正频率：(1) 两端固定；(2) 一端固定一端自由；(3) 两端自由。并说明 (1) 与 (3) 的频率分布为何相同。","answer":"(1) 100 Hz、200 Hz、300 Hz；(2) 50.0 Hz、150 Hz、250 Hz；(3) 100 Hz、200 Hz、300 Hz；两种情形都要求半波长的整数倍，频率分布相同","explain":"两端固定：fₙ = nv/(2L) = 100n Hz，得 100、200、300 Hz。\n一端固定一端自由：fₙ = (2n−1)v/(4L) = 50(2n−1) Hz，得 50.0、150、250 Hz。\n两端自由：fₙ = nv/(2L) = 100n Hz，得 100、200、300 Hz。\n固定端是波节、自由端是波腹；两端同为自由时两端的波腹条件与两端固定时的波节条件都给出 L = nλ/2，故频率分布相同。"},{"id":"c07q041","type":"calc","difficulty":5,"tags":["半波损失","固定端反射","自由端反射"],"stem":"一列简谐波 yᵢ = 0.0200 cos(30πt − 6πx)（SI 单位）沿 x 轴正方向传播。分别就下列两种反射端写出反射波方程、反射点处的合振幅，并指出反射点处是波节还是波腹：(1) x = 0 处为固定端；(2) x = 0 处为自由端。","answer":"(1) yᵣ = −0.0200 cos(30πt + 6πx) m，合振幅 0，波节；(2) yᵣ = 0.0200 cos(30πt + 6πx) m，合振幅 0.0400 m，波腹","explain":"反射波沿 −x 传播，写成 yᵣ = Aᵣ cos(30πt + 6πx + φ)。\n(1) 固定端：x = 0 处合位移恒为零，需 Aᵣ = 0.0200、φ = π，即 yᵣ = −0.0200 cos(30πt + 6πx)，有半波损失，反射点为波节。\n(2) 自由端：x = 0 处合位移最大（无半波损失），φ = 0，yᵣ = 0.0200 cos(30πt + 6πx)，合振幅 2A = 0.0400 m，反射点为波腹。"},{"id":"c07q042","type":"calc","difficulty":5,"tags":["干涉极大","初相差","相位条件"],"stem":"两相干波源 S₁、S₂ 相距 d = 4.00 m，同相振动，波长 λ = 0.400 m。在两源连线上（两源之间）求：(1) 相邻两个极大点之间的距离；(2) 各极大点到 S₁ 的距离；(3) 若 S₂ 的初相落后 π/2，第一个极大点（离 S₁ 最近）到 S₁ 的距离。","answer":"(1) 0.200 m；(2) x = 0.200 m、0.400 m、…、3.80 m（共 19 个）；(3) 0.150 m","explain":"设 P 距 S₁ 为 x，则 r₂ − r₁ = 4.00 − 2x，相位差 Δφ = 2π(4.00 − 2x)/0.400 = 20π − 10πx。\n极大条件 Δφ = 2mπ，得 x = 2.00 − 0.200m；由 0 \u003c x \u003c 4.00 得 m = 0、±1、…、±9，即 x = 2.00 ± 0.200n m，相邻极大间距 0.200 m = λ/2。\nS₂ 初相落后 π/2 时，Δφ = 20π − 10πx − π/2 = 2mπ，得 x = 1.95 − 0.200m；取 x > 0 的最小值，m = 9 时 x = 0.150 m。"},{"id":"c07q043","type":"calc","difficulty":5,"tags":["多普勒效应","反射","拍频"],"stem":"汽车以 15.0 m/s 的速度驶向一面竖直墙壁，喇叭频率 500 Hz，声速 340 m/s。求：(1) 墙壁接收到的频率；(2) 司机听到的反射声频率；(3) 司机听到的拍频。","answer":"(1) 523 Hz；(2) 546 Hz；(3) 46.2 Hz","explain":"声源靠近静止墙：ν₁ = νu/(u − v) = 500×340/(340 − 15.0) = 523 Hz。\n墙把 ν₁ 反射回来，司机迎着反射波运动：ν₂ = ν₁(u + v)/u = 523×(340 + 15.0)/340 = 546 Hz。\n拍频 = ν₂ − ν = 546 − 500 = 46.2 Hz。\n注意：司机听到的直接笛声频率仍为 500 Hz（声源与观察者同速）。"},{"id":"c07q044","type":"calc","difficulty":4,"tags":["多普勒效应","同向运动"],"stem":"声源以 30.0 m/s 的速度沿 x 轴正方向运动，观察者在声源前方以 20.0 m/s 同向运动，声源频率 600 Hz，声速 340 m/s。求观察者听到的频率；若观察者静止而声源以同样速度远离，频率又为多少。","answer":"619 Hz；551 Hz","explain":"声源追观察者：ν′ = ν(u − v_o)/(u − v_s) = 600×(340 − 20.0)/(340 − 30.0) = 619 Hz。\n观察者静止、声源远离：ν″ = νu/(u + v_s) = 600×340/(340 + 30.0) = 551 Hz。\n易错点：把两个速度的位置写反会得 582 Hz；同向追及误当相向会得 637 Hz。"},{"id":"c07q045","type":"calc","difficulty":4,"tags":["声强级","距离衰减","声强叠加"],"stem":"某点有两个独立声源，单独发声时声强级分别为 70.0 dB 和 65.0 dB。求：(1) 两者同时发声时的总声强级；(2) 若该点到声源的距离由 2.00 m 增大到 8.00 m（视为点声源），总声强级变为多少。","answer":"(1) 71.2 dB；(2) 59.2 dB","explain":"70.0 dB 对应 I₁ = 1.00×10⁻⁵ W/m²，65.0 dB 对应 I₂ = 3.16×10⁻⁶ W/m²。\n两声源不相干，声强相加：I = 1.32×10⁻⁵ W/m²，L = 10lg(1.32×10⁻⁵/10⁻¹²) = 71.2 dB。\n距离由 2.00 m 增至 8.00 m 为 4 倍，声强降为 1/16，声强级降低 10lg16 = 12.0 dB，故为 71.2 − 12.0 = 59.2 dB。"},{"id":"c07q046","type":"calc","difficulty":5,"tags":["拍","加蜡","频率判断"],"stem":"音叉 A 的频率为 512 Hz，音叉 B 频率未知。同时敲响时每秒听到 4 次拍。在 B 上滴少量蜡后，拍频变为每秒 2 次。求：(1) B 原来的频率；(2) 若滴蜡使 B 的频率降低 1.00%，此时拍频为多少；(3) 说明为什么不能取 B = 508 Hz。","answer":"(1) 516 Hz；(2) 1.16 Hz；(3) 若 B = 508 Hz，滴蜡后频率更低，拍频应大于 4 Hz，与实测 2 Hz 矛盾","explain":"拍频 4 Hz 说明 |ν_B − 512| = 4，故 ν_B = 516 Hz 或 508 Hz。\n滴蜡使音叉频率降低。若 ν_B = 516 Hz，降低后向 512 Hz 靠近，拍频减小，符合；故 ν_B = 516 Hz。\n降低 1.00% 后 ν_B′ = 516×0.990 = 510.84 Hz，拍频 |512 − 510.84| = 1.16 Hz。\n若取 508 Hz，滴蜡后 ν_B′ \u003c 508 Hz，|ν_B′ − 512| > 4 Hz，拍频应增大，与题设矛盾。"},{"id":"c07q047","type":"calc","difficulty":5,"tags":["群速度","相速度","色散关系"],"stem":"某介质的色散关系为 ω = ak + bk³，a = 3.00×10² m²/s，b = 2.00×10⁻² m⁴/s。求：(1) 相速度 v_p 与群速度 v_g 的表达式；(2) 使 v_g = 1.20v_p 的波数 k；(3) 该波数下的 v_p 和 v_g。","answer":"(1) v_p = a + bk²，v_g = a + 3bk²；(2) 40.8 rad/m；(3) v_p = 333 m/s，v_g = 400 m/s","explain":"v_p = ω/k = a + bk²；v_g = dω/dk = a + 3bk²。\n令 a + 3bk² = 1.20(a + bk²)：a + 3bk² = 1.20a + 1.20bk²，即 1.80bk² = 0.200a。\nk² = 0.200a/(1.80b) = 60.0/0.0360 = 1.67×10³，k = 40.8 rad/m。\nv_p = 300 + 0.0200×1.67×10³ = 333 m/s，v_g = 300 + 3×0.0200×1.67×10³ = 400 m/s。"},{"id":"c07q048","type":"calc","difficulty":4,"tags":["弦上横波波速","张力","脉冲传播"],"stem":"一根水平弦线长 L = 1.50 m，线密度 μ = 5.00×10⁻³ kg/m，一端固定，另一端跨过滑轮悬挂质量 m = 2.00 kg 的物体，g = 9.80 m/s²。求：(1) 弦上横波波速；(2) 一个脉冲从固定端传到滑轮端再返回所需时间；(3) 若悬挂质量变为 8.00 kg，往返时间变为多少。","answer":"(1) 62.6 m/s；(2) 4.79×10⁻² s；(3) 2.40×10⁻² s","explain":"张力 T = mg = 2.00×9.80 = 19.6 N，v = √(T/μ) = √(19.6/5.00×10⁻³) = 62.6 m/s。\n往返路程 2L = 3.00 m，t = 2L/v = 3.00/62.6 = 4.79×10⁻² s。\n质量变为 4 倍，张力变为 4 倍，v 变为 2 倍，故时间减半：t′ = 2.40×10⁻² s。"},{"id":"c07q049","type":"calc","difficulty":5,"tags":["声速与温度","波长"],"stem":"空气中声速 v = 331√(T/273) m/s。求：(1) 27.0 °C 时的声速；(2) 该温度下 500 Hz 声波的波长；(3) 温度升到 127 °C 而频率不变时，波长变为多少。","answer":"(1) 347 m/s；(2) 0.694 m；(3) 0.801 m","explain":"T₁ = 300 K：v₁ = 331√(300/273) = 347 m/s。\nλ₁ = v₁/ν = 347/500 = 0.694 m。\nT₂ = 400 K：v₂ = 331√(400/273) = 401 m/s，λ₂ = v₂/ν = 401/500 = 0.801 m。\n注意：温度变化时频率由波源决定不变，波长按 √T 增大。"},{"id":"c07q050","type":"calc","difficulty":5,"tags":["驻波能量","能量积分","动能与势能"],"stem":"一驻波方程为 y = 0.0200 sin(2.50πx) cos(100πt)（SI 单位），弦线线密度 μ = 1.00×10⁻² kg/m。求：(1) 波长与相邻波节间距；(2) 相邻两波节之间这段弦的最大动能和最大弹性势能；(3) 该段弦的总能量是否随时间变化，并求其值。","answer":"(1) 0.800 m，0.400 m；(2) 3.95×10⁻² J，3.95×10⁻² J；(3) 不随时间变化，3.95×10⁻² J","explain":"k = 2.50π rad/m，λ = 2π/k = 0.800 m；相邻波节间距 λ/2 = 0.400 m。\n动能 K = ∫½μ(∂y/∂t)²dx = ½μA²ω²sin²(ωt)∫₀^(λ/2)sin²(kx)dx = μA²ω²λ/8·sin²(ωt)，最大值 K_max = μA²ω²λ/8 = 1.00×10⁻²×(0.0200)²×(100π)²×0.800/8 = 3.95×10⁻² J。\n弹性势能 U = ∫½T(∂y/∂x)²dx = μA²ω²λ/8·cos²(ωt)，最大值同为 3.95×10⁻² J。\nK + U = μA²ω²λ/8 恒定，故总能量不随时间变化，值为 3.95×10⁻² J。"}]},{"chapter":8,"chapterName":"气体动理论","questions":[{"id":"c08q001","type":"choice","difficulty":3,"tags":["状态方程","混合气体","分压"],"stem":"容积 3.00 L 的容器内装有压强 1.20×10⁵ Pa 的氦气，另一容积 2.00 L 的容器内装有压强 4.00×10⁴ Pa 的氩气。两容器用体积可忽略的细管连通，连通前后温度相同且不变，氦、氩均视为理想气体。混合后气体的总压强为","options":["8.80×10⁴ Pa","1.60×10⁵ Pa","8.00×10⁴ Pa","7.20×10⁴ Pa"],"answer":"A","explain":"温度不变时两组分的摩尔数都不变，由 pV = nRT 分别算出两容器中气体的 nRT：氦 1.20×10⁵×3.00×10⁻³ = 360 J，氩 4.00×10⁴×2.00×10⁻³ = 80.0 J。\n混合后总体积 5.00×10⁻³ m³，总压强 p = (n₁+n₂)RT/V = (360+80.0)/5.00×10⁻³ = 8.80×10⁴ Pa。\n易错点：不同容积、不同压强下气体不能直接把压强相加（1.60×10⁵ Pa），也不能取算术平均（8.00×10⁴ Pa），必须按 pV 求和再除以总体积；按体积权重取反会得 7.20×10⁴ Pa。"},{"id":"c08q002","type":"choice","difficulty":3,"tags":["内能","自由度","混合气体"],"stem":"2.00 mol 氦气与 3.00 mol 氧气混合，混合气体温度为 300 K。氦气视为单原子分子，氧气视为刚性双原子分子，则混合气体的内能为（R = 8.31 J/(mol·K)）","options":["2.62×10⁴ J","3.12×10⁴ J","3.37×10⁴ J","1.87×10⁴ J"],"answer":"A","explain":"内能是广延量，按摩尔数加权：U = (i₁/2)n₁RT + (i₂/2)n₂RT，氦 i = 3、氧气 i = 5。\n氦：1.5×2.00×8.31×300 = 7.48×10³ J；氧：2.5×3.00×8.31×300 = 1.87×10⁴ J。\nU = 7.48×10³ + 1.87×10⁴ = 2.62×10⁴ J。\n易错点：全部按 i = 5 算得 3.12×10⁴ J；把氧的振动自由度也计入（i = 7）得 3.37×10⁴ J；只算氧气得 1.87×10⁴ J。"},{"id":"c08q003","type":"choice","difficulty":3,"tags":["方均根速率","温度关系","摩尔质量"],"stem":"氢气（M = 2.02 g/mol）与氧气（M = 32.0 g/mol）均视为刚性分子。相同温度下氢气与氧气的方均根速率之比为____；若要使氧气分子的方均根速率等于氢气在 300 K 时的方均根速率，氧气的温度应为____。","options":["3.98；4.75×10³ K","3.98；7.56×10¹ K","15.8；4.75×10³ K","0.251；1.19×10² K"],"answer":"A","explain":"v_rms = √(3RT/M)，同温下 v_rms ∝ 1/√M，比值 = √(32.0/2.02) = √15.8 = 3.98。\n令 √(3RT/0.0320) = √(3R×300/0.00202)，得 T = 300×(0.0320/0.00202) = 4.75×10³ K。\n易错点：忘记开方得 15.8；温度取反比得 75.6 K；把氢气与氧气弄反得 0.251 与 1.19×10² K。\n注意：4.75×10³ K 下氢气早已离解，此问只作速率关系的数值练习。"},{"id":"c08q004","type":"choice","difficulty":3,"tags":["平均自由程","温度与压强关系"],"stem":"某气体在 300 K、1.00×10⁵ Pa 时分子的平均自由程为 7.00×10⁻⁸ m。设分子有效直径不随温度变化，当温度升到 600 K、压强降到 1.00×10³ Pa 时，分子的平均自由程为","options":["1.40×10⁻⁵ m","7.00×10⁻⁶ m","1.40×10⁻⁷ m","1.40×10⁻⁹ m"],"answer":"A","explain":"λ = 1/(√2πd²n)，而 n = p/(kT)，故 λ = kT/(√2πd²p) ∝ T/p。\n温度加倍、压强降为 1/100，λ 变为 7.00×10⁻⁸×(600/300)×(10⁵/10³) = 7.00×10⁻⁸×200 = 1.40×10⁻⁵ m。\n易错点：只算温度变化得 1.40×10⁻⁷ m；只算压强变化得 7.00×10⁻⁶ m；把 λ ∝ p/T 写反得 1.40×10⁻⁹ m。"},{"id":"c08q005","type":"calc","difficulty":3,"tags":["平均自由程","碰撞频率","平均速率"],"stem":"氮气（N₂，M = 28.0 g/mol）在温度 273 K、压强 1.01×10⁵ Pa 下，分子有效直径 d = 3.60×10⁻¹⁰ m。求：(1) 分子数密度 n；(2) 平均自由程 λ；(3) 平均速率 v̄；(4) 每个分子的平均碰撞频率 Z。（k = 1.38×10⁻²³ J/K，R = 8.31 J/(mol·K)）","answer":"(1) 2.68×10²⁵ m⁻³；(2) 6.48×10⁻⁸ m；(3) 454 m/s；(4) 7.01×10⁹ s⁻¹","explain":"(1) n = p/(kT) = 1.01×10⁵/(1.38×10⁻²³×273) = 2.68×10²⁵ m⁻³。\n(2) λ = 1/(√2πd²n) = 1/(1.414×3.142×1.296×10⁻¹⁹×2.68×10²⁵) = 6.48×10⁻⁸ m。\n(3) v̄ = √(8RT/(πM)) = √(8×8.31×273/(3.142×0.0280)) = 454 m/s。\n(4) Z = v̄/λ = 454/6.48×10⁻⁸ = 7.01×10⁹ s⁻¹，即每个分子每秒碰撞约 7×10⁹ 次。\n数量级感：λ 约为分子直径的 180 倍，气体仍属稀薄。"},{"id":"c08q006","type":"calc","difficulty":3,"tags":["平均自由度","内能","分压"],"stem":"一容器内装有 2.00 g 氦气（M = 4.00 g/mol，i = 3）和 8.00 g 氧气（M = 32.0 g/mol，i = 5），温度 300 K。求：(1) 两种气体的摩尔数；(2) 混合气体的平均自由度；(3) 混合气体的内能；(4) 氧气分压与总压之比。","answer":"(1) 0.500 mol 与 0.250 mol；(2) 3.67；(3) 3.43×10³ J；(4) 0.333","explain":"(1) n_He = 2.00/4.00 = 0.500 mol，n_O₂ = 8.00/32.0 = 0.250 mol。\n(2) 平均自由度按摩尔数加权：i = (0.500×3 + 0.250×5)/0.750 = 2.75/0.750 = 3.67。\n(3) U = (i/2)nRT = (3.67/2)×0.750×8.31×300 = 3.43×10³ J（也可分别算 1.87×10³ J 与 1.56×10³ J 再相加）。\n(4) 同温同体积下分压与摩尔数成正比，p_O₂/p = 0.250/0.750 = 0.333。\n易错点：平均自由度不能取 (3+5)/2 = 4.00，必须按摩尔数加权。"},{"id":"c08q007","type":"choice","difficulty":4,"tags":["分压","平均摩尔质量","质量分数"],"stem":"空气可看作氧气（M = 32.0 g/mol）与氮气（M = 28.0 g/mol）的混合物，其中氧气的质量分数为 23.0%，其余为氮气。当总压为 1.00×10⁵ Pa 时，氧气的分压和空气的平均摩尔质量分别为","options":["2.07×10⁴ Pa，28.8 g/mol","2.30×10⁴ Pa，28.8 g/mol","7.93×10⁴ Pa，28.8 g/mol","2.07×10⁴ Pa，30.0 g/mol"],"answer":"A","explain":"取 100 g 空气：n_O₂ = 23.0/32.0 = 0.719 mol，n_N₂ = 77.0/28.0 = 2.75 mol，总摩尔数 3.47 mol。\n氧气摩尔分数 x = 0.719/3.47 = 0.207，分压 p_O₂ = xp = 2.07×10⁴ Pa。\n平均摩尔质量 = 总质量/总摩尔数 = 100/3.47 = 28.8 g/mol。\n易错点：把质量分数 23.0% 直接当摩尔分数得 2.30×10⁴ Pa；用氮的质量分数算出氮分压 7.93×10⁴ Pa；平均摩尔质量取 32.0 与 28.0 的算术平均 30.0 g/mol。"},{"id":"c08q008","type":"choice","difficulty":4,"tags":["麦克斯韦分布","分布曲线","最概然速率"],"stem":"同种气体在两个温度 T₁ 与 T₂（T₂ = 2T₁）下的麦克斯韦速率分布曲线相比：最概然速率变为原来的____倍，分布曲线的峰值 f(v_p) 变为原来的____倍，曲线下的总面积____。","options":["1.41；0.707；不变","2.00；0.500；不变","1.41；1.41；变为 2 倍","1.41；0.500；不变"],"answer":"A","explain":"v_p = √(2RT/M) ∝ √T，故新、旧最概然速率之比为 √2 = 1.41，峰值位置右移。\n由 f(v_p) = 4/(√π e v_p) ∝ 1/√T，峰值降为 1/√2 = 0.707。\n分布函数已归一化，曲线下总面积恒为 1，与温度无关：曲线只变宽、变矮，面积不变。\n易错点：认为 v_p ∝ T 得 2.00；把峰值当成 ∝ 1/T 得 0.500；把「曲线变宽」误当成总面积变大。"},{"id":"c08q009","type":"choice","difficulty":4,"tags":["平均自由程","等温与等容过程"],"stem":"一定量理想气体先经等温过程把体积压缩到原来的 1/4，再经等容过程把温度升高到原来的 2 倍。设分子有效直径不变，最终分子的平均自由程是初始值的","options":["1/4","1/2","1/8","1"],"answer":"A","explain":"λ = 1/(√2πd²n)，只由分子数密度 n 与有效直径 d 决定，与温度无关。\n等温压缩到 1/4 体积：n 变为 4 倍，λ 变为 1/4。\n再等容升温到 2 倍温度：n 不变，λ 不变，仍为初始值的 1/4。\n易错点：以为升温使 λ 变大得 1/2 或 1；把等容过程误当等压过程（n 再减半）得 1/8。"},{"id":"c08q010","type":"choice","difficulty":4,"tags":["输运过程","黏性系数","扩散系数"],"stem":"一定量气体温度保持不变，压强减为原来的 1/2。设分子有效直径不变，它的黏性系数 η、热导率 κ、扩散系数 D 分别","options":["η 不变、κ 不变、D 变为 2 倍","η、κ、D 都变为 2 倍","η、κ、D 都变为 1/2","η 变为 1/2、κ 不变、D 不变"],"answer":"A","explain":"η = ⅓ρv̄λ，κ = ⅓ρc_Vv̄λ，D = ⅓v̄λ。\n等温下 v̄ 不变，而 ρ ∝ p、λ ∝ 1/p，故 ρλ 与 p 无关：η、κ 都不随压强变化。\nD 只含 v̄λ ∝ T/p，压强减半使 D 加倍。\n物理意义：压强降低时分子变稀但自由程变长，两者恰好抵消，动量与能量的输运能力不变；只有靠分子位移的扩散变快。"},{"id":"c08q011","type":"choice","difficulty":4,"tags":["范德瓦尔斯方程","真实气体","压强修正"],"stem":"1.00 mol 二氧化碳在 T = 300 K、V = 1.00×10⁻³ m³ 时，范德瓦尔斯常量 a = 0.364 Pa·m⁶·mol⁻²、b = 4.27×10⁻⁵ m³·mol⁻¹。由范德瓦尔斯方程算出的压强为（R = 8.31 J/(mol·K)）","options":["2.24×10⁶ Pa","2.49×10⁶ Pa","2.60×10⁶ Pa","2.97×10⁶ Pa"],"answer":"A","explain":"范德瓦尔斯方程 (p + a/V²)(V − b) = RT，即 p = RT/(V − b) − a/V²。\n体积修正：RT/(V − b) = 2.493×10³/(9.573×10⁻⁴) = 2.60×10⁶ Pa，比理想值 2.49×10⁶ Pa 大，因为分子自身体积使可活动空间变小。\n引力修正：a/V² = 0.364/(1.00×10⁻³)² = 3.64×10⁵ Pa，使压强减小。\np = 2.60×10⁶ − 3.64×10⁵ = 2.24×10⁶ Pa。\n易错点：只用理想气体方程得 2.49×10⁶ Pa；只做体积修正得 2.60×10⁶ Pa；把引力项符号取反得 2.97×10⁶ Pa。"},{"id":"c08q012","type":"choice","difficulty":4,"tags":["同温同压","内能","质量比"],"stem":"两个容积相同的容器，一个装氦气（M = 4.00 g/mol，i = 3），一个装氧气（M = 32.0 g/mol，i = 5），两者温度与压强都相同。两容器中气体的质量之比 m_He : m_O₂ 与内能之比 U_He : U_O₂ 分别为","options":["1 : 8.00 和 3 : 5.00","8.00 : 1 和 5 : 3.00","1 : 8.00 和 1 : 1","1 : 8.00 和 5 : 3.00"],"answer":"A","explain":"同 p、V、T 时 n = pV/(RT) 相同，即两容器分子数相同。\n质量 m = nM，故 m_He : m_O₂ = 4.00 : 32.0 = 1 : 8.00。\n内能 U = (i/2)nRT，同温同 n 时 U ∝ i，故 U_He : U_O₂ = 3 : 5.00 = 0.600。\n易错点：以为温度相同内能就相同（1 : 1）；质量比与自由度比同时取反（8.00 : 1 和 5 : 3.00）；内能比单独取反得 5 : 3.00。"},{"id":"c08q013","type":"choice","difficulty":4,"tags":["等压过程","内能增量","自由度"],"stem":"1.00 mol 某非线性多原子分子理想气体（i = 6）在等压过程中吸收 1.00×10³ J 的热量。该气体内能的增量为","options":["750 J","600 J","1.00×10³ J","250 J"],"answer":"A","explain":"等压过程 Q = nC_pΔT，ΔU = nC_VΔT，故 ΔU/Q = C_V/C_p = i/(i+2)。\ni = 6 时 ΔU/Q = 6/8 = 0.750，ΔU = 0.750×1.00×10³ = 750 J。\n其余 250 J 用于对外做功 W = pΔV = nRΔT。\n易错点：按 i = 3 的 3/5 得 600 J；认为等压吸热全部转为内能得 1.00×10³ J；把对外做功 250 J 当内能增量。"},{"id":"c08q014","type":"choice","difficulty":4,"tags":["平均平动动能","方均根速率","温度微观意义"],"stem":"氦气（M = 4.00 g/mol）在 400 K 时，分子的平均平动动能与方均根速率分别为（k = 1.38×10⁻²³ J/K，R = 8.31 J/(mol·K)）","options":["8.28×10⁻²¹ J，1.58×10³ m/s","1.38×10⁻²⁰ J，1.58×10³ m/s","8.28×10⁻²¹ J，1.12×10³ m/s","5.52×10⁻²¹ J，1.58×10³ m/s"],"answer":"A","explain":"平均平动动能只由温度决定：ε̄ = (3/2)kT = 1.5×1.38×10⁻²³×400 = 8.28×10⁻²¹ J，与气体种类无关。\n方均根速率 v_rms = √(3RT/M) = √(3×8.31×400/4.00×10⁻³) = √2.49×10⁶ = 1.58×10³ m/s。\n易错点：用 (5/2)kT 得 1.38×10⁻²⁰ J（那是双原子分子的总平均动能）；用 kT 得 5.52×10⁻²¹ J；把 v_p = √(2RT/M) = 1.12×10³ m/s 当方均根速率。"},{"id":"c08q015","type":"choice","difficulty":4,"tags":["压强微观本质","能量密度","数密度"],"stem":"某真空室中气体的压强为 1.33×10⁻³ Pa，温度为 300 K。室内单位体积内所有分子平均平动动能的总和（平动动能密度）为","options":["2.00×10⁻³ J/m³","1.33×10⁻³ J/m³","4.00×10⁻³ J/m³","6.21×10⁻²¹ J/m³"],"answer":"A","explain":"由 p = (2/3)nε̄ 得 nε̄ = (3/2)p，与温度、气体种类无关。\n平动动能密度 = 1.5×1.33×10⁻³ = 2.00×10⁻³ J/m³。\n也可先算 n = p/(kT) = 3.21×10¹⁷ m⁻³，再乘 ε̄ = 6.21×10⁻²¹ J，结果相同。\n易错点：把单个分子的 ε̄ = 6.21×10⁻²¹ J 当成能量密度；漏掉 3/2 得 1.33×10⁻³ J/m³；把系数写成 3 得 4.00×10⁻³ J/m³。"},{"id":"c08q016","type":"choice","difficulty":4,"tags":["最概然速率","平均速率","摩尔质量"],"stem":"某理想气体在 300 K 时分子的最概然速率为 4.00×10² m/s。该气体的摩尔质量为____，分子的平均速率为____。（R = 8.31 J/(mol·K)）","options":["31.2 g/mol，451 m/s","31.2 g/mol，490 m/s","62.3 g/mol，451 m/s","15.6 g/mol，451 m/s"],"answer":"A","explain":"由 v_p = √(2RT/M) 得 M = 2RT/v_p² = 2×8.31×300/(4.00×10²)² = 4.99×10³/1.60×10⁵ = 3.12×10⁻² kg/mol = 31.2 g/mol。\n平均速率 v̄ = √(8RT/(πM)) = 2v_p/√π = 1.128×4.00×10² = 451 m/s。\n易错点：误用 v_rms 的系数 √3 得 490 m/s；漏掉因子 2 得 62.3 g/mol；多除 2 得 15.6 g/mol。"},{"id":"c08q017","type":"choice","difficulty":4,"tags":["等容过程","平均自由程","碰撞频率"],"stem":"一定量气体保持体积不变，温度由 300 K 升到 600 K。设分子有效直径不变，则分子的平均自由程 λ 与平均碰撞频率 Z 分别变为原来的","options":["1 倍，1.41 倍","2 倍，2.00 倍","1 倍，2.00 倍","1/2 倍，1.41 倍"],"answer":"A","explain":"等容升温时分子数密度 n 不变，λ = 1/(√2πd²n) 只由 n 与 d 决定，故 λ 不变。\nZ = √2πd²nv̄，其中 v̄ ∝ √T；温度加倍使 v̄ 变为 √2 = 1.41 倍，Z 也变为 1.41 倍。\n物理图像：分子跑得更快而自由程不变，所以单位时间碰撞次数按 √T 增加。\n易错点：以为 λ ∝ T 得 2 倍；以为 Z ∝ T 得 2.00 倍；以为 λ 变小得 1/2 倍。"},{"id":"c08q018","type":"choice","difficulty":4,"tags":["归一化","统计平均","分布函数"],"stem":"设某气体分子的速率分布函数为 f(v) = Cv²（0 ≤ v ≤ v₀），f(v) = 0（v > v₀）。则常数 C 与平均速率 v̄ 分别为","options":["3/v₀³，0.750v₀","3/v₀³，0.775v₀","1/v₀³，0.750v₀","3/v₀⁴，0.750v₀"],"answer":"A","explain":"归一化条件：∫₀^v₀ Cv²dv = Cv₀³/3 = 1，得 C = 3/v₀³。\n平均速率：v̄ = ∫₀^v₀ v·Cv²dv = Cv₀⁴/4 = (3/v₀³)(v₀⁴/4) = 0.750v₀。\n方均根速率：v_rms = √(Cv₀⁵/5) = √(3/5)v₀ = 0.775v₀，比 v̄ 大。\n易错点：把方均根 0.775v₀ 当平均速率；漏掉 v² 的积分因子得 C = 1/v₀³；把 C 的量纲次数算成 v₀⁻⁴。"},{"id":"c08q019","type":"choice","difficulty":4,"tags":["平均自由度","内能","多原子分子"],"stem":"3.00 mol 氦气与 2.00 mol 二氧化碳（非线性多原子分子，i = 6）混合，混合气体温度为 350 K。混合气体的平均自由度与总内能分别为（R = 8.31 J/(mol·K)）","options":["4.20，3.05×10⁴ J","4.50，3.27×10⁴ J","4.20，2.62×10⁴ J","3.67，3.05×10⁴ J"],"answer":"A","explain":"平均自由度按摩尔数加权：i = (3.00×3 + 2.00×6)/5.00 = 21.0/5.00 = 4.20。\nU = (i/2)nRT = (4.20/2)×5.00×8.31×350 = 3.05×10⁴ J。\n也可分别计算：氦 1.31×10⁴ J、二氧化碳 1.75×10⁴ J，相加得 3.05×10⁴ J。\n易错点：取 (3+6)/2 = 4.50 得 3.27×10⁴ J（忘了按摩尔数加权）；温度误代 300 K 得 2.62×10⁴ J。"},{"id":"c08q020","type":"choice","difficulty":4,"tags":["摩尔热容","自由度","等压过程"],"stem":"某理想气体在等压过程中吸收的热量有 71.4% 用于增加内能。该气体分子的自由度 i 与定容摩尔热容 C_V 分别为","options":["5，20.8 J/(mol·K)","3，12.5 J/(mol·K)","6，24.9 J/(mol·K)","5，29.1 J/(mol·K)"],"answer":"A","explain":"等压过程 ΔU/Q = nC_VΔT/(nC_pΔT) = C_V/C_p = i/(i+2)。\n由 i/(i+2) = 0.714 解得 i = 5（刚性双原子分子）。\nC_V = (i/2)R = 2.5×8.31 = 20.8 J/(mol·K)。\n易错点：按 i = 3 得 3/5 = 0.600；按 i = 6 得 6/8 = 0.750；把 C_p = 29.1 J/(mol·K) 当成 C_V。"},{"id":"c08q021","type":"calc","difficulty":4,"tags":["状态方程","数密度","平均平动动能"],"stem":"空气可视为摩尔质量 M = 28.9 g/mol 的理想气体。在温度 273 K、压强 1.013×10⁵ Pa 下求：(1) 空气的密度 ρ；(2) 分子数密度 n；(3) 每个分子的平均质量 m；(4) 分子的平均平动动能。（k = 1.38×10⁻²³ J/K，R = 8.31 J/(mol·K)，N_A = 6.02×10²³ mol⁻¹）","answer":"(1) 1.29 kg/m³；(2) 2.69×10²⁵ m⁻³；(3) 4.80×10⁻²⁶ kg；(4) 5.65×10⁻²¹ J","explain":"(1) 由 p = ρRT/M 得 ρ = pM/(RT) = 1.013×10⁵×0.0289/(8.31×273) = 1.29 kg/m³。\n(2) n = p/(kT) = 1.013×10⁵/(1.38×10⁻²³×273) = 2.69×10²⁵ m⁻³，也可用 n = ρ/m 校核。\n(3) m = M/N_A = 0.0289/6.02×10²³ = 4.80×10⁻²⁶ kg。\n(4) ε̄ = (3/2)kT = 1.5×1.38×10⁻²³×273 = 5.65×10⁻²¹ J，只由温度决定，与气体种类无关。\n易错点：把密度公式写成 ρ = pM/RT 时忘乘 M 的数量级；用 ε̄ = (5/2)kT 把空气当双原子。"},{"id":"c08q022","type":"calc","difficulty":4,"tags":["状态方程","数密度","器壁碰撞数率"],"stem":"容积 25.0 L 的容器内装有 1.00 mol 氧气，温度 300 K。求：(1) 氧气的压强；(2) 分子数密度；(3) 分子的平均平动动能；(4) 单位时间内与单位面积器壁碰撞的分子数（碰撞数率 Z_A = ¼nv̄）。（k = 1.38×10⁻²³ J/K，R = 8.31 J/(mol·K)）","answer":"(1) 9.97×10⁴ Pa；(2) 2.41×10²⁵ m⁻³；(3) 6.21×10⁻²¹ J；(4) 2.68×10²⁷ m⁻²·s⁻¹","explain":"(1) p = nRT/V = 1.00×8.31×300/0.0250 = 9.97×10⁴ Pa。\n(2) n = p/(kT) = 9.97×10⁴/(1.38×10⁻²³×300) = 2.41×10²⁵ m⁻³。\n(3) ε̄ = (3/2)kT = 6.21×10⁻²¹ J。\n(4) v̄ = √(8RT/(πM)) = √(8×8.31×300/(3.142×0.0320)) = 445 m/s，Z_A = ¼×2.41×10²⁵×445 = 2.68×10²⁷ m⁻²·s⁻¹。\n说明：Z_A 只由 n 与 v̄ 决定，而 p = (1/3)nmv̄²，两者可互推；分子越大、越慢，碰撞数率越低。"},{"id":"c08q023","type":"calc","difficulty":4,"tags":["黏性系数","平均自由程","分子有效直径"],"stem":"某双原子气体（M = 28.0 g/mol）在 300 K 时密度为 1.14 kg/m³，测得其黏性系数 η = 1.20×10⁻⁵ Pa·s。取 η = ⅓ρv̄λ。求：(1) 分子的平均速率 v̄；(2) 平均自由程 λ；(3) 分子数密度 n；(4) 由 λ 反推分子有效直径 d。（k = 1.38×10⁻²³ J/K，N_A = 6.02×10²³ mol⁻¹）","answer":"(1) 476 m/s；(2) 6.63×10⁻⁸ m；(3) 2.45×10²⁵ m⁻³；(4) 3.72×10⁻¹⁰ m","explain":"(1) v̄ = √(8RT/(πM)) = √(8×8.31×300/(3.142×0.0280)) = 476 m/s。\n(2) 由 η = ⅓ρv̄λ 得 λ = 3η/(ρv̄) = 3×1.20×10⁻⁵/(1.14×476) = 6.63×10⁻⁸ m。\n(3) n = ρ/m = 1.14/(0.0280/6.02×10²³) = 2.45×10²⁵ m⁻³（等价于 p/(kT)）。\n(4) 由 λ = 1/(√2πd²n) 得 d = √(1/(√2πλn)) = √(1/(1.414×3.142×6.63×10⁻⁸×2.45×10²⁵)) = 3.72×10⁻¹⁰ m。\n这条思路的意义：测宏观的 η 就能反推微观的 d，是分子动理论最早的定量检验之一。"},{"id":"c08q024","type":"calc","difficulty":4,"tags":["逃逸速度","方均根速率","大气保留"],"stem":"月球质量 7.35×10²² kg，半径 1.74×10⁶ m，表面温度取 300 K，引力常量 G = 6.67×10⁻¹¹ N·m²/kg²。求：(1) 月球表面的逃逸速度；(2) 氢分子（M = 2.02 g/mol）与氧分子（M = 32.0 g/mol）在此温度下的方均根速率；(3) 分别求二者方均根速率与逃逸速度之比，并据此说明月球为什么留不住大气。","answer":"(1) 2.37×10³ m/s；(2) 1.92×10³ m/s 与 483 m/s；(3) 0.810 与 0.204；比值已接近 1，速率分布尾部大量分子超过逃逸速度，气体逐渐逃逸","explain":"(1) v_esc = √(2GM/R) = √(2×6.67×10⁻¹¹×7.35×10²²/1.74×10⁶) = 2.37×10³ m/s。\n(2) v_rms(H₂) = √(3RT/M) = √(3×8.31×300/0.00202) = 1.92×10³ m/s；v_rms(O₂) = √(3×8.31×300/0.0320) = 483 m/s。\n(3) 比值分别为 1.92×10³/2.37×10³ = 0.810 与 483/2.37×10³ = 0.204。\n麦克斯韦分布的高速率尾部总有一定比例分子超过逃逸速度：氢的比值已达 0.81，逃逸极快；氧的比值虽小，但月球引力弱、又无火山等活动补充，长期也会损失。月球质量小、逃逸速度低是留不住大气的根本原因。"},{"id":"c08q025","type":"calc","difficulty":4,"tags":["平均自由程","连续介质","高空大气"],"stem":"距地面约 100 km 处，大气压强约 1.00×10⁻³ Pa，温度约 250 K，分子有效直径取 3.60×10⁻¹⁰ m，摩尔质量 28.0 g/mol。求：(1) 分子数密度；(2) 平均自由程；(3) 平均碰撞频率；(4) 若飞行器特征尺寸为 0.100 m，说明连续介质假设是否还成立。","answer":"(1) 2.90×10¹⁷ m⁻³；(2) 5.99 m；(3) 72.6 s⁻¹；(4) λ 远大于 0.100 m，连续介质假设失效，须按自由分子流处理","explain":"(1) n = p/(kT) = 1.00×10⁻³/(1.38×10⁻²³×250) = 2.90×10¹⁷ m⁻³。\n(2) λ = 1/(√2πd²n) = 1/(1.414×3.142×1.296×10⁻¹⁹×2.90×10¹⁷) = 5.99 m。\n(3) v̄ = √(8RT/(πM)) = 435 m/s，Z = v̄/λ = 435/5.99 = 72.6 s⁻¹（标准状态下约 7×10⁹ s⁻¹）。\n(4) λ = 5.99 m ≫ 0.100 m，克努森数远大于 1：分子主要与器壁碰撞而不是彼此碰撞，黏性、热导率这类依赖分子间碰撞的概念不再适用。\n易错点：忘记 λ 与 n 成反比，把标准状态下的 10⁻⁸ m 量级直接搬来。"},{"id":"c08q026","type":"choice","difficulty":5,"tags":["麦克斯韦分布","分布积分","统计比例"],"stem":"麦克斯韦速率分布可写成 f(v) = (4/√π)(v²/v_p³)e^(−(v/v_p)²)，其中 v_p 为最概然速率。已知 ∫₀¹ x²e^(−x²)dx = 0.1895。速率大于最概然速率的分子数占总分子数的比例为","options":["57.2%","42.8%","18.9%","21.4%"],"answer":"A","explain":"作代换 x = v/v_p，则 f(v)dv = (4/√π)x²e^(−x²)dx。\n速率小于 v_p 的比例 = (4/√π)∫₀¹x²e^(−x²)dx = 2.257×0.1895 = 0.428。\n大于 v_p 的比例 = 1 − 0.428 = 0.572 = 57.2%。\n易错点：把 0.1895 直接当比例（18.9%）；忘记乘 4/√π 得 21.4%；把小于与大于弄反得 42.8%。\n说明：分布不对称，v_p 左侧陡、右侧拖长尾，故多数分子的速率大于 v_p。"},{"id":"c08q027","type":"choice","difficulty":5,"tags":["麦克斯韦分布","高速尾部","积分近似"],"stem":"麦克斯韦速率分布中，已知 ∫₀² x²e^(−x²)dx = 0.4227、∫₀^∞ x²e^(−x²)dx = 0.4431（x = v/v_p）。速率大于 2v_p 的分子数占比为","options":["4.61%","42.3%","95.4%","1.83%"],"answer":"A","explain":"速率小于 2v_p 的比例 = (4/√π)×0.4227 = 2.257×0.4227 = 0.954。\n大于 2v_p 的比例 = 1 − 0.954 = 0.0461 = 4.61%。\n即约二十分之一的分子速率超过 2v_p，这正是蒸发、化学反应、大气逃逸等高速率过程能够发生的统计基础。\n易错点：把 0.4227 当比例（42.3%）；把 0.954 直接当答案（95.4%）；用 e^(−4) = 1.83% 冒充比例。"},{"id":"c08q028","type":"choice","difficulty":5,"tags":["分布函数近似","速率区间","分子数占比"],"stem":"氮气（M = 28.0 g/mol）在 300 K 时最概然速率 v_p = 4.22×10² m/s，f(v_p) = 4/(√π e v_p) = 1.97×10⁻³ s/m。把 v_p 附近 20 m/s 宽的区间内 f(v) 视为常量，速率在 v_p ± 10.0 m/s 内的分子数占比约为","options":["3.9%","9.5%","2.0%","7.9%"],"answer":"A","explain":"区间总宽度 Δv = 20.0 m/s，f 在极大值附近变化缓慢，比例 ≈ f(v_p)Δv = 1.97×10⁻³×20.0 = 3.94×10⁻²。\n由于 v_p 处为极大值，f 在区间两侧略低，真实比例略小于 3.9%，量级与三位有效数字内保持一致。\n易错点：只算一侧得 2.0%；把 ±10 m/s 当成总宽 40 m/s 得 7.9%；直接用 Δv/v_p = 0.047 当比例得 9.5%（漏掉归一化因子）。"},{"id":"c08q029","type":"choice","difficulty":5,"tags":["范德瓦尔斯气体","自由膨胀","内能依赖体积"],"stem":"1.00 mol 二氧化碳视为范德瓦尔斯气体（a = 0.364 Pa·m⁶·mol⁻²，定容摩尔热容 C_V = 3R），初始温度 300 K、体积 1.00×10⁻³ m³，向真空自由膨胀到 5.00×10⁻³ m³。设 a 与 C_V 为常量，膨胀后温度约为","options":["288 K","300 K","312 K","335 K"],"answer":"A","explain":"范德瓦尔斯气体内能 U = C_VT − a/V（1 mol），不再只由温度决定。\n向真空自由膨胀不做功、不吸热，ΔU = 0，故 C_V(T₂ − T₁) = a(1/V₂ − 1/V₁)。\nT₂ − T₁ = (0.364/24.93)(200 − 1000) = −11.7 K，得 T₂ = 288 K。\n物理意义：膨胀时分子间引力做负功，动能转化为势能，温度下降；若当作理想气体则温度不变（300 K）。\n易错点：符号取反得 312 K；把 C_V 换成 R 且符号取反得 335 K。"},{"id":"c08q030","type":"choice","difficulty":5,"tags":["输运过程","扩散系数","热导率"],"stem":"一定量气体温度升高到原来的 2 倍，同时压强减为原来的 1/2。设分子有效直径不变，其扩散系数 D 与热导率 κ 分别变为原来的（提示：D = ⅓v̄λ，κ = ⅓ρc_Vv̄λ）","options":["5.66 倍，1.41 倍","2.83 倍，1.41 倍","5.66 倍，5.66 倍","1.41 倍，不变"],"answer":"A","explain":"v̄ ∝ √T，λ = kT/(√2πd²p) ∝ T/p，故 v̄λ ∝ T^(3/2)/p。\nD = ⅓v̄λ ∝ T^(3/2)/p，代入 T 变 2 倍、p 变 1/2：D 变为 2^(3/2)×2 = 2.83×2 = 5.66 倍。\nκ = ⅓ρc_Vv̄λ，其中 ρ ∝ p/T、c_V 与 T 无关，故 κ ∝ (p/T)(T^(3/2)/p) = √T，变为 1.41 倍。\n易错点：漏掉 ρ ∝ p/T 得 κ 也变 5.66 倍；只算 v̄ 得 1.41 倍；把 ρ 当成不变使 D 只变 2.83 倍。"},{"id":"c08q031","type":"choice","difficulty":5,"tags":["平均自由程","分子间距","数量级估算"],"stem":"标准状态下某气体分子的平均自由程为 6.48×10⁻⁸ m，分子数密度为 2.68×10²⁵ m⁻³。取分子间平均距离为 n^(−1/3)，则平均距离与 λ 和该平均距离之比分别约为","options":["3.34×10⁻⁹ m，19.4","3.34×10⁻⁹ m，0.0515","3.34×10⁻¹⁰ m，194","6.48×10⁻⁸ m，1.00"],"answer":"A","explain":"平均距离 s ≈ n^(−1/3) = (2.68×10²⁵)^(−1/3) = (3.73×10⁻²⁶)^(1/3) = 3.34×10⁻⁹ m。\nλ/s = 6.48×10⁻⁸/3.34×10⁻⁹ = 19.4，即分子平均要穿过约 19 个分子间距才碰撞一次。\ns 约为分子直径（3.6×10⁻¹⁰ m）的 9 倍，说明气体仍相当稀薄，λ ≫ d 是理想气体模型成立的前提。\n易错点：取倒数得 0.0515；立方根错一个量级得 194；直接把 λ 当作间距。"},{"id":"c08q032","type":"choice","difficulty":5,"tags":["内能","平均平动动能","温度微观本质"],"stem":"1.00 mol 氦气与 1.00 mol 二氧化碳（i = 6）分别从 300 K 等容加热到 400 K。两者吸收的热量之比 Q_He : Q_CO₂ 与分子平均平动动能的增量之比 Δε̄_He : Δε̄_CO₂ 分别为","options":["1 : 2.00，1 : 1","1 : 1，1 : 1","1 : 2.00，1 : 2.00","2.00 : 1，1 : 1"],"answer":"A","explain":"等容吸热 Q = nC_VΔT = (i/2)nRΔT，故 Q ∝ i：Q 之比 = 3 : 6 = 1 : 2.00。\n平均平动动能 ε̄ = (3/2)kT 只由温度决定，两者温度变化相同，故 Δε̄ 相同，比为 1 : 1。\n要点：温度只对应平动动能，而内能还包括转动、振动能量，所以「内能—温度」关系依赖自由度。\n易错点：认为两种气体吸热相同；把平动动能也按自由度分配得 1 : 2.00；比值取反得 2.00 : 1。"},{"id":"c08q033","type":"choice","difficulty":5,"tags":["比热容比","混合气体","自由度"],"stem":"3.00 mol 氦气与 2.00 mol 二氧化碳（i = 6）混合，混合气体的比热容比 γ = C_p/C_V 为","options":["1.48","1.40","1.67","1.33"],"answer":"A","explain":"混合气体 γ = (i+2)/i，其中 i = (3.00×3 + 2.00×6)/5.00 = 4.20。\nγ = 6.20/4.20 = 1.48。\n也可用总量核对：C_V = (21.0/2)R = 10.5R，C_p = C_V + 5.00R = 15.5R，γ = 15.5/10.5 = 1.48。\n易错点：按双原子取 1.40；按单原子取 1.67；按纯二氧化碳取 1.33。\n注：γ 由平均自由度决定，不能简单对两种气体的 γ 取平均。"},{"id":"c08q034","type":"choice","difficulty":5,"tags":["统计平均","速率比值","积分计算"],"stem":"对麦克斯韦速率分布，已知 ∫₀^∞ x³e^(−x²)dx = 1/2、∫₀^∞ x⁴e^(−x²)dx = 3√π/8（x = v/v_p）。平均速率与方均根速率之比 v̄/v_rms 为","options":["0.921","0.816","0.866","1.13"],"answer":"A","explain":"令 x = v/v_p，则 f(v)dv = (4/√π)x²e^(−x²)dx。\nv̄ = v_p(4/√π)∫₀^∞x³e^(−x²)dx = v_p(4/√π)(1/2) = 2v_p/√π。\nv_rms² = v_p²(4/√π)∫₀^∞x⁴e^(−x²)dx = v_p²(4/√π)(3√π/8) = (3/2)v_p²，故 v_rms = 1.225v_p。\nv̄/v_rms = (2/√π)/√(3/2) = √(8/(3π)) = 0.921。\n易错点：0.816 = √(2/3) 是 v_p/v_rms；0.866 = √3/2；1.13 是倒数。"},{"id":"c08q035","type":"choice","difficulty":5,"tags":["逃逸速度","方均根速率","月球"],"stem":"月球质量 7.35×10²² kg、半径 1.74×10⁶ m，表面温度取 300 K，G = 6.67×10⁻¹¹ N·m²/kg²。氢分子（M = 2.02 g/mol）的方均根速率与月球表面逃逸速度之比约为","options":["0.810","1.23","0.747","0.172"],"answer":"A","explain":"v_esc = √(2GM/R) = √(2×6.67×10⁻¹¹×7.35×10²²/1.74×10⁶) = 2.37×10³ m/s。\nv_rms = √(3RT/M) = √(3×8.31×300/0.00202) = 1.92×10³ m/s。\n比值 = 1.92×10³/2.37×10³ = 0.810，已接近 1，说明大量高速分子可以逃逸。\n易错点：比值取反得 1.23；用平均速率（1.77×10³ m/s）得 0.747；误用地球逃逸速度 1.12×10⁴ m/s 得 0.172。"},{"id":"c08q036","type":"choice","difficulty":5,"tags":["范德瓦尔斯方程","体积修正","分子直径估算"],"stem":"二氧化碳的范德瓦尔斯常量 b = 4.27×10⁻⁵ m³·mol⁻¹。已知 b 等于 1 mol 分子自身体积总和的 4 倍，N_A = 6.02×10²³ mol⁻¹。估算二氧化碳分子的有效直径约为","options":["3.24×10⁻¹⁰ m","1.62×10⁻¹⁰ m","5.13×10⁻¹⁰ m","2.57×10⁻¹⁰ m"],"answer":"A","explain":"1 mol 分子自身体积总和 V′ = b/4 = 1.07×10⁻⁵ m³。\n每个分子体积 v₀ = V′/N_A = 1.07×10⁻⁵/6.02×10²³ = 1.77×10⁻²⁹ m³。\n由 v₀ = (4/3)πr³ 得 r = (3v₀/(4π))^(1/3) = 1.62×10⁻¹⁰ m，d = 2r = 3.24×10⁻¹⁰ m。\n所得数量级与分子动理论中 d ~ 10⁻¹⁰ m 一致，说明体积修正项确实反映分子自身的有限体积。\n易错点：把 r 当直径得 1.62×10⁻¹⁰ m；漏掉除以 4 得 5.13×10⁻¹⁰ m；既不除 4 又忘乘 2 得 2.57×10⁻¹⁰ m。"},{"id":"c08q037","type":"choice","difficulty":5,"tags":["统计平均","方均根速率","离散分布"],"stem":"某容器内 N 个分子的速率分布为：0~200 m/s 占 10%，200~400 m/s 占 30%，400~600 m/s 占 40%，600~800 m/s 占 20%（用各区间中点代表该区间速率）。分子的平均速率与方均根速率分别为","options":["440 m/s，475 m/s","500 m/s，475 m/s","440 m/s，500 m/s","375 m/s，475 m/s"],"answer":"A","explain":"取区间中点 100、300、500、700 m/s：v̄ = 0.10×100 + 0.30×300 + 0.40×500 + 0.20×700 = 440 m/s。\nv_rms² = 0.10×100² + 0.30×300² + 0.40×500² + 0.20×700² = 1.00×10³ + 2.70×10⁴ + 1.00×10⁵ + 9.80×10⁴ = 2.26×10⁵ m²/s²。\nv_rms = 475 m/s > v̄ = 440 m/s，符合 v_rms ≥ v̄ 的一般关系（等价于速率存在离散度）。\n易错点：用占比最大的区间中点 500 m/s 当平均速率；把 500 m/s 当方均根速率；漏掉 600~800 m/s 区间得 375 m/s。"},{"id":"c08q038","type":"choice","difficulty":5,"tags":["范德瓦尔斯气体","等温膨胀","内能"],"stem":"1.00 mol 范德瓦尔斯气体（a = 0.364 Pa·m⁶·mol⁻²）在 300 K 下由体积 1.00×10⁻³ m³ 等温膨胀到 5.00×10⁻³ m³。其内能的变化量为","options":["增加 291 J","不变","减少 291 J","增加 1.46×10³ J"],"answer":"A","explain":"范德瓦尔斯气体 U = C_VT − a/V（1 mol），内能与体积有关。\n等温下 ΔU = −a(1/V₂ − 1/V₁) = a(1/V₁ − 1/V₂) = 0.364×(1000 − 200) = 291 J。\n物理意义：体积增大时分子间平均距离增大，引力势能升高（−a/V 变得不那么负），故内能增加；增加的能量来自等温膨胀时外界对气体做的功。\n易错点：按理想气体处理得内能不变；符号取反得减少 291 J；把 1/V 之差乘 5 得 1.46×10³ J。"},{"id":"c08q039","type":"choice","difficulty":5,"tags":["麦克斯韦分布","区间比例","v_rms 与 v_p"],"stem":"某气体最概然速率为 3.00×10² m/s。已知 ∫₀¹x²e^(−x²)dx = 0.1895、∫₀^1.225x²e^(−x²)dx = 0.2704。速率介于 v_p 与 v_rms 之间的分子数占比为","options":["18.3%","8.09%","61.0%","42.8%"],"answer":"A","explain":"v_rms/v_p = √(3/2) = 1.225，故区间对应 x 由 1 到 1.225。\n比例 = (4/√π)(0.2704 − 0.1895) = 2.257×0.0809 = 0.183 = 18.3%。\n校核：小于 v_p 的比例为 2.257×0.1895 = 42.8%，小于 v_rms 的比例为 2.257×0.2704 = 61.0%，两者之差正是 18.3%。\n易错点：忘记乘 4/√π 得 8.09%；把 61.0% 或 42.8% 直接当答案。"},{"id":"c08q040","type":"choice","difficulty":5,"tags":["平均自由程","碰撞频率","等温降压"],"stem":"某气体在 300 K、1.00×10⁵ Pa 时分子平均速率为 4.76×10² m/s、平均自由程为 6.80×10⁻⁸ m。保持温度不变把压强降到 1.00×10³ Pa，分子的平均自由程与平均碰撞频率分别为","options":["6.80×10⁻⁶ m，7.0×10⁷ s⁻¹","6.80×10⁻⁸ m，7.0×10⁷ s⁻¹","6.80×10⁻⁶ m，7.0×10⁹ s⁻¹","6.80×10⁻⁴ m，7.0×10⁵ s⁻¹"],"answer":"A","explain":"等温下 λ ∝ 1/p，压强降为 1/100，λ 变为 6.80×10⁻⁸×100 = 6.80×10⁻⁶ m。\n碰撞频率 Z = v̄/λ：v̄ 不变而 λ 增大 100 倍，故 Z 变为原来的 1/100。\n原 Z = 476/6.80×10⁻⁸ = 7.0×10⁹ s⁻¹，故新 Z = 7.0×10⁷ s⁻¹。\n易错点：忘记 λ 随压强变化（6.80×10⁻⁸ m）；忘记 Z 与 λ 成反比（7.0×10⁹ s⁻¹）；把 λ 多放大 100 倍（6.80×10⁻⁴ m）。"},{"id":"c08q041","type":"choice","difficulty":5,"tags":["内能","平均平动动能","混合气体"],"stem":"2.00 mol 非刚性双原子理想气体（i = 6）与 1.00 mol 单原子理想气体混合，温度 400 K。混合气体的总内能，以及总内能与其中所有分子平均平动动能之和的比值分别为（R = 8.31 J/(mol·K)）","options":["2.49×10⁴ J，1.67","2.49×10⁴ J，2.00","1.50×10⁴ J，1.00","3.33×10⁴ J，1.67"],"answer":"A","explain":"总内能 U = (6/2)×2.00RT + (3/2)×1.00RT = 6.00RT + 1.50RT = 7.50RT = 7.50×8.31×400 = 2.49×10⁴ J。\n平动动能总和 E_t = (3/2)×3.00RT = 4.50RT = 1.50×10⁴ J，与自由度无关，只按分子总数算。\n比值 = 7.50RT/4.50RT = 1.67。\n易错点：把平动动能也按 i 加权得 2.00；只算单原子部分得 1.50×10⁴ J；把非刚性双原子按 i = 5 算得 2.08×10⁴ J。"},{"id":"c08q042","type":"choice","difficulty":5,"tags":["绝热混合","内能守恒","平衡温度"],"stem":"绝热容器被隔板分成两半，左半有 2.00 mol 氦气（i = 3）温度 300 K，右半有 3.00 mol 氧气（i = 5）温度 600 K。抽去隔板后气体混合达到平衡。平衡温度与混合气体的总内能分别为（R = 8.31 J/(mol·K)）","options":["514 K，4.49×10⁴ J","480 K，4.49×10⁴ J","514 K，3.60×10⁴ J","450 K，4.49×10⁴ J"],"answer":"A","explain":"绝热且不做功，混合过程内能守恒：U = (3/2)×2.00R×300 + (5/2)×3.00R×600 = 900R + 4500R = 5400R。\n平衡后 U = [(3/2)×2.00 + (5/2)×3.00]RT = (3.00 + 7.50)RT = 10.5RT。\n由 10.5RT = 5400R 得 T = 514 K（注意不是按摩尔数加权平均的 480 K）。\nU = 5400×8.31 = 4.49×10⁴ J，混合前后不变。\n易错点：两种气体都按 i = 3 算得 480 K；按温度算术平均得 450 K；把内能算成混合后重新加权的值。"},{"id":"c08q043","type":"calc","difficulty":5,"tags":["归一化","分布函数","三个特征速率"],"stem":"某气体分子的速率分布函数为 f(v) = Av²e^(−bv²)（v ≥ 0），其中 b = 1.50×10⁻⁶ s²·m⁻²。求：(1) 由归一化条件定出 A；(2) 最概然速率 v_p；(3) 平均速率 v̄；(4) 方均根速率 v_rms，并验证 v̄/v_rms = √(8/(3π))。（可用 ∫₀^∞x²e^(−x²)dx = √π/4、∫₀^∞x³e^(−x²)dx = 1/2、∫₀^∞x⁴e^(−x²)dx = 3√π/8）","answer":"(1) A = 4b^(3/2)/√π = 4.15×10⁻⁹ s³·m⁻³；(2) v_p = 1/√b = 8.16×10² m/s；(3) v̄ = 2/√(πb) = 9.21×10² m/s；(4) v_rms = √(3/(2b)) = 1.00×10³ m/s，v̄/v_rms = 0.921 = √(8/(3π))","explain":"(1) ∫₀^∞Av²e^(−bv²)dv = 1，令 x = √b·v 得 A b^(−3/2)·(√π/4) = 1，故 A = 4b^(3/2)/√π = 4×(1.50×10⁻⁶)^(3/2)/1.772 = 4.15×10⁻⁹。\n(2) 令 df/dv = 2Av e^(−bv²) − 2Abv³e^(−bv²) = 0，得 v_p = 1/√b = 816 m/s。\n(3) v̄ = A∫₀^∞v³e^(−bv²)dv = A/(2b²) = 2/(√π·√b) = 921 m/s。\n(4) v_rms² = A∫₀^∞v⁴e^(−bv²)dv = A·3√π/(8b^(5/2)) = 3/(2b)，故 v_rms = 1.00×10³ m/s；v̄/v_rms = √(8/(3π)) = 0.921，与麦克斯韦分布（b = M/(2RT)）完全一致。"},{"id":"c08q044","type":"calc","difficulty":5,"tags":["麦克斯韦分布","符号推导","特征速率"],"stem":"从麦克斯韦速率分布 f(v) = 4π(M/(2πRT))^(3/2)v²e^(−Mv²/(2RT)) 出发，证明：(1) 最概然速率 v_p = √(2RT/M)；(2) 平均速率 v̄ = √(8RT/(πM))；(3) 方均根速率 v_rms = √(3RT/M)；(4) 给出 v_p : v̄ : v_rms 的数值比，并说明为什么 v_rms 最大。（可用 ∫₀^∞x²e^(−x²)dx = √π/4、∫₀^∞x³e^(−x²)dx = 1/2、∫₀^∞x⁴e^(−x²)dx = 3√π/8）","answer":"v_p : v̄ : v_rms = 1 : 1.13 : 1.22，其中 v̄ = 2v_p/√π、v_rms = √(3/2)v_p，三者都只由 T 与 M 决定","explain":"(1) 令 x = v/v_p，v_p = √(2RT/M)，则 f(v)dv = (4/√π)x²e^(−x²)dx，对 x 求导取零得 x = 1，即 v = v_p。\n(2) v̄ = v_p(4/√π)∫₀^∞x³e^(−x²)dx = v_p(4/√π)(1/2) = 2v_p/√π = 1.128v_p = √(8RT/(πM))。\n(3) v_rms² = v_p²(4/√π)∫₀^∞x⁴e^(−x²)dx = v_p²(4/√π)(3√π/8) = (3/2)v_p²，故 v_rms = 1.225v_p = √(3RT/M)。\n(4) 比值 1 : 1.128 : 1.225。方均根对 v² 加权，高速分子的贡献被平方放大，故 v_rms > v̄ > v_p；三者都与 √T 成正比、与 √M 成反比。"},{"id":"c08q045","type":"calc","difficulty":5,"tags":["范德瓦尔斯方程","自由膨胀","内能"],"stem":"1.00 mol 二氧化碳的范德瓦尔斯常量 a = 0.364 Pa·m⁶·mol⁻²、b = 4.27×10⁻⁵ m³·mol⁻¹。(1) 求 300 K、体积 1.00×10⁻³ m³ 时的压强，并与理想气体压强比较，说明两个修正项各自的方向；(2) 该气体在 300 K 下等温膨胀到 5.00×10⁻³ m³，求内能变化；(3) 若改为向真空自由膨胀到同样体积，求温度变化（C_V = 3R）；(4) 说明为什么真实气体的内能不再只由温度决定。","answer":"(1) 2.24×10⁶ Pa，小于理想值 2.49×10⁶ Pa；(2) 内能增加 291 J；(3) 温度降低 11.7 K，降到 288 K；(4) U = C_VT − a/V，还与体积有关","explain":"(1) p = RT/(V−b) − a/V² = 2.493×10³/(9.573×10⁻⁴) − 0.364/(1.00×10⁻³)² = 2.60×10⁶ − 3.64×10⁵ = 2.24×10⁶ Pa。体积修正使 p 增大（分子自身占体积、可活动空间变小），引力修正使 p 减小，后者占优，故小于理想值 2.49×10⁶ Pa。\n(2) ΔU = a(1/V₁ − 1/V₂) = 0.364×(1000 − 200) = 291 J > 0：膨胀时克服分子间引力做功，势能增加。\n(3) 自由膨胀 ΔU = 0，C_VΔT = a(1/V₂ − 1/V₁)，ΔT = (0.364/24.93)(200 − 1000) = −11.7 K，T = 288 K（理想气体自由膨胀温度不变）。\n(4) 理想气体内能只有分子动能，只由 T 决定；真实气体还有分子间势能 −a/V，故 U 同时依赖 T 与 V，这正是焦耳—汤姆孙效应与真实气体液化能够发生的原因。"},{"id":"c08q046","type":"calc","difficulty":5,"tags":["输运系数","黏性系数","热导率","扩散系数"],"stem":"氮气（M = 28.0 g/mol，d = 3.60×10⁻¹⁰ m）在 273 K、1.01×10⁵ Pa 下密度 ρ = 1.25 kg/m³。取 η = ⅓ρv̄λ、κ = ⅓ρc_Vv̄λ、D = ⅓v̄λ，其中 c_V = (5/2)R/M。求：(1) λ；(2) η；(3) κ；(4) D；(5) 保持温度不变把压强加倍，η、κ、D 各如何变化？","answer":"(1) 6.48×10⁻⁸ m；(2) 1.23×10⁻⁵ Pa·s；(3) 9.10×10⁻³ W/(m·K)；(4) 9.81×10⁻⁶ m²/s；(5) η、κ 不变，D 减为一半","explain":"(1) n = p/(kT) = 2.68×10²⁵ m⁻³，v̄ = √(8RT/(πM)) = 454 m/s，λ = 1/(√2πd²n) = 6.48×10⁻⁸ m。\n(2) η = ⅓×1.25×454×6.48×10⁻⁸ = 1.23×10⁻⁵ Pa·s。\n(3) c_V = (5/2)×8.31/0.0280 = 742 J/(kg·K)，κ = ⅓×1.25×742×454×6.48×10⁻⁸ = 9.10×10⁻³ W/(m·K)。\n(4) D = ⅓×454×6.48×10⁻⁸ = 9.81×10⁻⁶ m²/s。\n(5) 等温下 ρ ∝ p、λ ∝ 1/p，ρλ 与 v̄ 都不随压强变化，故 η、κ 与压强无关；D ∝ λ ∝ 1/p，压强加倍则 D 减半。"},{"id":"c08q047","type":"calc","difficulty":5,"tags":["逃逸速度","大气保留","速率分布"],"stem":"地球高层大气温度可达 1000 K，地球逃逸速度为 1.12×10⁴ m/s。求氢气（M = 2.02 g/mol）、氦气（M = 4.00 g/mol）、氮气（M = 28.0 g/mol）在该温度下的方均根速率，并分别与逃逸速度比较；再结合速率分布说明为什么地球能保留氮气而保留不住氢气（以 3v_rms 与 v_esc 比较作为判据）。","answer":"v_rms 分别为 3.51×10³、2.50×10³、9.44×10² m/s；与 v_esc 之比为 0.314、0.223、0.0843；3v_rms 分别为 1.05×10⁴、7.49×10³、2.83×10³ m/s","explain":"v_rms = √(3RT/M)：氢 √(3×8.31×1000/0.00202) = 3.51×10³ m/s；氦 √(3×8.31×1000/0.00400) = 2.50×10³ m/s；氮 √(3×8.31×1000/0.0280) = 944 m/s。\n与 v_esc = 1.12×10⁴ m/s 之比分别为 0.314、0.223、0.0843。\n按判据 3v_rms：氢的 3v_rms = 1.05×10⁴ m/s 已接近 v_esc，麦克斯韦分布高速尾部的分子持续超过逃逸速度，故氢不断逃逸；氦的 7.49×10³ m/s 也较高，逃逸较慢但不可忽略。\n氮的 3v_rms = 2.83×10³ m/s 远小于 v_esc，超过逃逸速度的分子极少，故地球能长期保留氮气——这也解释大气中氢、氦含量极低。"},{"id":"c08q048","type":"calc","difficulty":5,"tags":["平均自由程","碰撞频率","分子间距"],"stem":"氦气（M = 4.00 g/mol，d = 2.20×10⁻¹⁰ m）在 300 K、1.00×10⁵ Pa 下。求：(1) 分子数密度；(2) 平均速率；(3) 平均自由程；(4) 平均碰撞频率与两次碰撞之间的平均时间；(5) 分子间平均距离 n^(−1/3)，并与 λ 比较。","answer":"(1) 2.42×10²⁵ m⁻³；(2) 1.26×10³ m/s；(3) 1.93×10⁻⁷ m；(4) 6.54×10⁹ s⁻¹，1.53×10⁻¹⁰ s；(5) 3.46×10⁻⁹ m，λ 约为间距的 56 倍","explain":"(1) n = p/(kT) = 1.00×10⁵/(1.38×10⁻²³×300) = 2.42×10²⁵ m⁻³。\n(2) v̄ = √(8RT/(πM)) = √(8×8.31×300/(3.142×0.00400)) = 1.26×10³ m/s。\n(3) λ = 1/(√2πd²n) = 1/(1.414×3.142×4.84×10⁻²⁰×2.42×10²⁵) = 1.93×10⁻⁷ m。\n(4) Z = v̄/λ = 6.54×10⁹ s⁻¹，τ = 1/Z = 1.53×10⁻¹⁰ s。\n(5) s = n^(−1/3) = 3.46×10⁻⁹ m，λ/s = 56。氦分子比氮分子小，同温同压下 λ 约为氮的 3 倍，故氦的输运系数更大、更易泄漏。"},{"id":"c08q049","type":"calc","difficulty":5,"tags":["泻流","平均速率","同位素分离"],"stem":"一容器内装有 1.00 mol 氦气（M = 4.00 g/mol）和 1.00 mol 氧气（M = 32.0 g/mol），温度 300 K。容器壁上开有一个小孔，孔径远小于平均自由程（泻流）。求：(1) 两种气体分子的平均速率；(2) 初始时刻单位时间从小孔逸出的氦与氧的分子数之比；(3) 逸出分子中氦所占的摩尔分数；(4) 随时间推移，容器内剩余气体中哪种组分的相对含量会升高。","answer":"(1) 1.26×10³ m/s 与 4.45×10² m/s；(2) 2.83 : 1；(3) 0.739；(4) 氧的相对含量升高","explain":"(1) v̄ = √(8RT/(πM))：氦 √(8×8.31×300/(3.142×0.00400)) = 1.26×10³ m/s；氧 √(8×8.31×300/(3.142×0.0320)) = 445 m/s。\n(2) 泻流流率 ∝ nv̄/4，两种气体 n 相同，故流率之比 = v̄_He/v̄_O₂ = √(32.0/4.00) = 2.83。\n(3) 逸出分子的摩尔分数 x_He = 2.83/(1 + 2.83) = 0.739。\n(4) 轻的氦优先逸出，容器内氦的相对含量下降、氧升高——这是气体扩散法分离同位素（如 ²³⁵UF₆ 与 ²³⁸UF₆）的物理基础。\n注：若孔径大于 λ，则为黏性流动，两组分按体积比一起流出，不再有分离效应。"},{"id":"c08q050","type":"calc","difficulty":5,"tags":["等容过程","分压","内能增量"],"stem":"容积 20.0 L 的钢瓶内装有 1.00 mol 氦气（i = 3）和 1.00 mol 氧气（i = 5），初温 300 K。把混合气体等容加热到 450 K。求：(1) 初态总压强；(2) 末态各组分分压与总压强；(3) 内能增量；(4) 末态氧分子的方均根速率；(5) 若继续等容升温，总压与内能随温度如何变化。","answer":"(1) 2.49×10⁵ Pa；(2) 各 1.87×10⁵ Pa，总 3.74×10⁵ Pa；(3) 4.99×10³ J；(4) 5.92×10² m/s；(5) 总压与内能都与 T 成正比","explain":"(1) p₁ = (n_He + n_O₂)RT₁/V = 2.00×8.31×300/0.0200 = 2.49×10⁵ Pa。\n(2) 分压 p_i = n_iRT₂/V = 1.00×8.31×450/0.0200 = 1.87×10⁵ Pa，总压 3.74×10⁵ Pa；等容下 p ∝ T，由 2.49×10⁵×450/300 也得同样结果。\n(3) ΔU = [(3/2)×1.00 + (5/2)×1.00]RΔT = 4.00×8.31×150 = 4.99×10³ J。\n(4) v_rms = √(3RT₂/M) = √(3×8.31×450/0.0320) = 5.92×10² m/s。\n(5) 等容下 p = nRT/V ∝ T，U = (i/2)nRT ∝ T，两者都随温度线性增加；比例系数分别由总摩尔数与平均自由度决定（此混合气体 i = 4.00）。\n易错点：把分压按质量分数分配；内能增量只算氧气或只算氦气。"}]},{"chapter":9,"chapterName":"热力学第一定律","questions":[{"id":"c09q001","type":"choice","difficulty":3,"tags":["等温过程","功的积分","热力学第一定律"],"stem":"2.00 mol 双原子理想气体在 300 K 下等温可逆膨胀，体积由 20.0 L 增大到 40.0 L。气体在此过程中吸收的热量为","options":["2.49 kJ","1.73 kJ","4.99 kJ","3.46 kJ"],"answer":"D","explain":"等温过程中理想气体内能不变，ΔU = 0，故 Q = W。\nW = ∫p dV = nRT ln(V₂/V₁) = 2.00×8.31×300×ln2 = 3.46×10³ J。\n所以 Q = 3.46 kJ。易错点：2.49 kJ 是把功写成 p₁ΔV = nRT(V₂−V₁)/V₁；1.73 kJ 漏乘摩尔数 2；4.99 kJ 忘记取对数。"},{"id":"c09q002","type":"choice","difficulty":3,"tags":["等压过程","摩尔热容","能量分配"],"stem":"1.00 mol 单原子理想气体在等压条件下温度升高 60.0 K。气体吸收的热量中，转化为内能的百分比为","options":["60.0%","40.0%","71.4%","100%"],"answer":"A","explain":"单原子气体 C_V = 3R/2，C_p = C_V+R = 5R/2。\n等压过程 Q = nC_pΔT，ΔU = nC_VΔT，故 ΔU/Q = C_V/C_p = 3/5 = 60.0%。\n其余 40.0% 用于对外做功 W = nRΔT。易错点：把 C_p 与 C_V 用反得 40.0%；71.4% 是 C_p/C_V 的错误组合。"},{"id":"c09q003","type":"choice","difficulty":3,"tags":["绝热过程","状态方程","泊松方程"],"stem":"1.00 mol 双原子理想气体（γ = 1.40）初温 300 K，经绝热可逆压缩后体积变为原来的 1/8。终态温度为","options":["543 K","689 K","5.51×10³ K","849 K"],"answer":"B","explain":"绝热过程满足 T V^(γ−1) = 常量，γ−1 = 0.400。\nT₂ = T₁(V₁/V₂)^(γ−1) = 300×8^0.400 = 300×2.297 = 689 K。\n易错点：5.51×10³ K 误用 T V^γ = 常量；543 K 把指数当成 2/7；849 K 把指数当成 0.5。"},{"id":"c09q004","type":"choice","difficulty":3,"tags":["绝热自由膨胀","内能","状态方程"],"stem":"1.00 mol 双原子理想气体初态温度 300 K、压强 2.00×10⁵ Pa，在绝热容器中向真空自由膨胀，体积变为原来的 3 倍。终态温度和压强分别为","options":["300 K，2.00×10⁵ Pa","156 K，3.47×10⁴ Pa","300 K，6.67×10⁴ Pa","300 K，1.11×10⁵ Pa"],"answer":"C","explain":"绝热容器 Q = 0；向真空膨胀不克服外压，W = 0，故 ΔU = 0。\n理想气体内能只由温度决定，因此 T₂ = T₁ = 300 K。\n再由 pV = 常量得 p₂ = p₁/3 = 6.67×10⁴ Pa。\n易错点：156 K 误按绝热可逆膨胀 pV^γ = 常量计算；1.11×10⁵ Pa 把体积比取反。"},{"id":"c09q005","type":"choice","difficulty":3,"tags":["p-V 图","净功","循环方向"],"stem":"一定量理想气体经循环 A→B→C→D→A，四个状态的坐标分别为 A(1.20×10⁵ Pa，2.20 L)、B(3.40×10⁵ Pa，2.20 L)、C(3.40×10⁵ Pa，4.80 L)、D(1.20×10⁵ Pa，4.80 L)，循环沿顺时针方向进行。气体在一个循环中对外做的净功为","options":["−572 J","728 J","572 J","312 J"],"answer":"C","explain":"p-V 图中循环包围的矩形面积等于净功：W = Δp·ΔV = (3.40−1.20)×10⁵×(4.80−2.20)×10⁻³ = 572 J。\n顺时针循环气体对外做正功，故 W = +572 J。\n易错点：−572 J 把方向判反；728 J 用了 2.80×10⁵ 的压强差；312 J 只算了低压段。"},{"id":"c09q006","type":"choice","difficulty":3,"tags":["等容过程","等温过程","多段过程"],"stem":"1.00 mol 单原子理想气体先等容加热，温度由 300 K 升到 600 K；再等温膨胀，体积变为原来的 2 倍。全过程吸收的热量为","options":["3.74 kJ","3.46 kJ","1.07×10⁴ J","7.20 kJ"],"answer":"D","explain":"等容段不做功，Q₁ = nC_VΔT = 1.00×12.5×300 = 3.74×10³ J。\n等温段 ΔU = 0，Q₂ = W₂ = nRT ln2 = 1.00×8.31×600×0.693 = 3.46×10³ J。\nQ = Q₁+Q₂ = 7.20 kJ。易错点：3.74 kJ 只算第一段；3.46 kJ 只算第二段；1.07×10⁴ J 把两段温度都按 600 K 算。"},{"id":"c09q007","type":"choice","difficulty":4,"tags":["等温膨胀","绝热膨胀","过程比较"],"stem":"1.00 mol 双原子理想气体从 300 K、10.0 L 出发，分别经等温可逆膨胀和绝热可逆膨胀到 20.0 L。等温过程做功 W_等温 与绝热过程做功 W_绝热 之比约为","options":["1.15","1.00","0.873","1.32"],"answer":"A","explain":"等温：W_等温 = nRT ln2 = 1.00×8.31×300×0.693 = 1.73×10³ J。\n绝热：T₂ = 300×2^(−0.400) = 227 K，W_绝热 = nC_V(T₁−T₂) = 20.8×72.6 = 1.51×10³ J。\n比值 = 1728/1509 = 1.15。物理上等温过程压强下降较慢，故做功较多。\n易错点：0.873 是倒数；1.32 误用 γ 倍；1.00 忽略了两条曲线分离。"},{"id":"c09q008","type":"choice","difficulty":4,"tags":["多方过程","摩尔热容","吸放热判断"],"stem":"1.00 mol 双原子理想气体经历多方过程 pV^1.25 = C。该过程的摩尔热容 C_n 及气体被压缩（温度升高）时的吸放热情况为","options":["−12.5 J/(mol·K)，吸热","+12.5 J/(mol·K)，吸热","−12.5 J/(mol·K)，放热","−33.2 J/(mol·K)，放热"],"answer":"C","explain":"多方过程摩尔热容 C_n = C_V+R/(1−n) = 20.8+8.31/(1−1.25) = 20.8−33.2 = −12.5 J/(mol·K)。\n压缩时温度升高，ΔT > 0，而 C_n \u003c 0，故 Q = nC_nΔT \u003c 0，气体放热。\n物理图像：外界压缩做功大于内能增量，多余能量以热的形式放出。\n易错点：把 R/(1−n) 的符号写反；认为温度升高就一定吸热。"},{"id":"c09q009","type":"choice","difficulty":4,"tags":["混合气体","内能守恒","平衡温度"],"stem":"绝热刚性容器中用隔板隔开两部分气体：一侧是 0.0200 mol 氦气（300 K），另一侧是 0.0300 mol 氮气（400 K）。抽去隔板后达到平衡，平衡温度为（氦按单原子、氮按双原子处理）","options":["371 K","350 K","364 K","380 K"],"answer":"A","explain":"绝热刚性容器总内能守恒：n₁C_V1(T−T₁)+n₂C_V2(T−T₂) = 0。\n0.0200×12.5(T−300)+0.0300×20.8(T−400) = 0，即 0.250T−74.8+0.624T−249 = 0。\n解得 T = 324/0.874 = 371 K。\n易错点：350 K 是按物质的量直接平均；380 K 是按等压热容加权；364 K 漏掉氦的单原子自由度。"},{"id":"c09q010","type":"choice","difficulty":4,"tags":["气缸活塞","摩擦力","功的计算"],"stem":"竖直气缸内气体推动活塞缓慢上升 0.200 m。活塞质量 20.0 kg、横截面积 1.00×10⁻² m²，活塞与缸壁间的摩擦力为 40.0 N，大气压 1.00×10⁵ Pa，g 取 9.80 m/s²。此过程中气体对外做的功为","options":["239 J","200 J","287 J","247 J"],"answer":"D","explain":"活塞缓慢上升时受力平衡：pA = p₀A+mg+f。\np = p₀+mg/A+f/A = 1.00×10⁵+196/0.0100+40.0/0.0100 = 1.236×10⁵ Pa。\nW = pΔV = 1.236×10⁵×(0.200×0.0100) = 247 J。\n易错点：239 J 漏掉摩擦力；200 J 只算大气压；287 J 把摩擦力方向当成向上。"},{"id":"c09q011","type":"choice","difficulty":4,"tags":["正比过程","功的积分","热力学第一定律"],"stem":"1.00 mol 单原子理想气体经历 p = αV 的过程，由 V₁ = 2.00 L、p₁ = 1.00×10⁵ Pa 膨胀到 V₂ = 4.00 L。气体吸收的热量为","options":["900 J","300 J","1.20 kJ","1.50 kJ"],"answer":"C","explain":"由 p₁ = αV₁ 得 α = 5.00×10⁷ Pa/m³，故 p₂ = 2.00×10⁵ Pa。\nW = ∫αV dV = ½α(V₂²−V₁²) = ½×5.00×10⁷×(16.0−4.00)×10⁻⁶ = 300 J（也等于梯形面积）。\nΔU = (3/2)(p₂V₂−p₁V₁) = 1.5×(800−200) = 900 J。\nQ = ΔU+W = 1.20 kJ。易错点：900 J 只算内能；300 J 只算功；1.50 kJ 把 W 当成 600 J。"},{"id":"c09q012","type":"choice","difficulty":4,"tags":["绝热过程","等容过程","热量叠加"],"stem":"2.00 mol 单原子理想气体先在绝热条件下由 300 K、20.0 L 压缩到 10.0 L，再在等容条件下加热到 600 K。全过程吸收的热量为","options":["7.50 kJ","5.15 kJ","3.10 kJ","1.55 kJ"],"answer":"C","explain":"绝热压缩段：T₂ = T₁(V₁/V₂)^(γ−1) = 300×2^0.667 = 476 K，该段 Q = 0。\n等容加热段：Q = nC_V(600−476) = 2.00×12.5×124 = 3.10×10³ J。\n全过程 Q = 0+3.10 kJ = 3.10 kJ。\n易错点：7.50 kJ 忽略绝热段已升温；5.15 kJ 等容段误用 C_p；1.55 kJ 只算 1 mol。"},{"id":"c09q013","type":"choice","difficulty":4,"tags":["循环效率","p-V 图","各段热量"],"stem":"1.00 mol 单原子理想气体经循环 A→B→C→A：A(1.24×10⁵ Pa，2.30 L)、B(3.68×10⁵ Pa，2.30 L)、C(3.68×10⁵ Pa，6.10 L)，A→B 等容、B→C 等压、C→A 为直线。该循环的效率约为","options":["13.3%","10.7%","16.0%","8.21%"],"answer":"B","explain":"A→B：W = 0，Q₁ = (3/2)(p_B−p_A)V_A = 1.5×2.44×10⁵×2.30×10⁻³ = 842 J。\nB→C：W = p_BΔV = 3.68×10⁵×3.80×10⁻³ = 1.40×10³ J，Q₂ = (5/2)p_BΔV = 3.50×10³ J。\nC→A：直线下面积 W₃ = −½(3.68+1.24)×10⁵×3.80×10⁻³ = −935 J，ΔU₃ = −2.94×10³ J，Q₃ = −3.87×10³ J（放热）。\n净功 W = 1.398−0.935 = 464 J，吸热 Q_吸 = 842+3496 = 4.34×10³ J，η = 464/4338 = 10.7%。"},{"id":"c09q014","type":"choice","difficulty":4,"tags":["温度依赖热容","积分法","平均热容"],"stem":"1.00 mol 某理想气体的定容摩尔热容随温度变化，C_V = 20.0+0.0100T（SI 单位）。在等容条件下由 300 K 加热到 400 K，吸收的热量为","options":["2.00 kJ","2.50 kJ","2.75 kJ","2.35 kJ"],"answer":"D","explain":"等容过程 Q = ∫nC_V dT = ∫(20.0+0.0100T)dT（从 300 K 到 400 K）。\nQ = 20.0×100+½×0.0100×(400²−300²) = 2000+350 = 2.35×10³ J。\n平均热容 = Q/ΔT = 23.5 J/(mol·K)，介于 C_V(300)=23.0 与 C_V(400)=24.0 之间。\n易错点：2.00 kJ 漏掉温度项积分；2.50 kJ 用 400 K 的热容乘 100 K；2.75 kJ 用 450 K 的热容。"},{"id":"c09q015","type":"choice","difficulty":4,"tags":["热力学第一定律","循环过程","内能状态函数"],"stem":"一定量理想气体从状态 A 到状态 B 吸收热量 500 J，对外做功 200 J；再沿另一路径 B→C→A 返回 A，整个循环气体对外做净功 120 J。在返回路径 B→C→A 中，气体交换的热量为","options":["吸收 380 J","放出 420 J","放出 300 J","放出 380 J"],"answer":"D","explain":"A→B：ΔU_AB = Q−W = 500−200 = 300 J。\n循环一周 ΔU = 0，故 ΔU_BCA = −300 J。\n返回路径 W_BCA = W_总−W_AB = 120−200 = −80 J。\nQ_BCA = ΔU_BCA+W_BCA = −300−80 = −380 J，即放出 380 J。\n易错点：380 J 吸收是符号错；420 J 把 W_BCA 取成 +80 J；300 J 漏掉功。"},{"id":"c09q016","type":"choice","difficulty":4,"tags":["热力学第一定律","等温过程","等容过程","分段"],"stem":"1.00 mol 双原子理想气体从 p₁ = 2.00×10⁵ Pa、V₁ = 10.0 L 出发，先等温膨胀到 V₂ = 20.0 L，再等容降温到初始温度的 1/2。全过程气体吸收的热量为（R = 8.31 J/(mol·K)，ln2 = 0.693）","options":["A  −1.11×10³ J","B  1.39×10³ J","C  −2.50×10³ J","D  2.50×10³ J"],"answer":"A","explain":"初温 T₁ = p₁V₁/(nR) = 2.00×10⁵×0.0100/8.31 = 241 K。等温段 T 不变，ΔU = 0，Q₁ = W = nRT₁ln(V₂/V₁) = 8.31×241×0.693 = 1.39×10³ J。等
