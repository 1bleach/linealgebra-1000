n(2kx) = sin(π) = 0，故积分值 = L/8，P = (2/L)(L/8) = 0.250。\n这正好是第一激发态在该区间「平均」只有一半概率密度的体现：前 1/4 区间恰好含一个完整波瓣的一半。\n易错点：节点只数 x = 0 与 L（那是边界）；把 A 写成 √(1/L)；概率直接答 0.5。"},{"id":"c20q047","type":"calc","difficulty":5,"tags":["能量-时间不确定关系","能级宽度","谱线宽度"],"stem":"某原子激发态寿命 τ = 1.0×10⁻⁸ s，向基态跃迁发出 500 nm 的谱线。(1) 求该能级的宽度 ΔE（eV）；(2) 求谱线的频率展宽与波长展宽；(3) 若同一元素还有一条与之相距 0.010 nm 的谱线，能否分辨？","options":[],"answer":"(1) 3.3×10⁻⁸ eV；(2) 8.0×10⁶ Hz，6.6×10⁻⁶ nm；(3) 能分辨","explain":"(1) ΔE ≥ ħ/(2τ) = 1.055×10⁻³⁴/(2×1.0×10⁻⁸) = 5.28×10⁻²⁷ J = 3.3×10⁻⁸ eV。\n(2) Δν = ΔE/h = 5.28×10⁻²⁷/6.63×10⁻³⁴ = 8.0×10⁶ Hz；由 Δλ/λ = Δν/ν，ν = c/λ = 6.00×10¹⁴ Hz，得 Δλ = 500×8.0×10⁶/6.00×10¹⁴ = 6.6×10⁻⁶ nm。\n(3) 线宽 6.6×10⁻⁶ nm 远小于 0.010 nm 的间距（相差约 1500 倍），两条线可以分辨；只有寿命短到 10⁻¹² s 量级，展宽才会与 0.01 nm 相比。\n易错点：漏掉 ħ/2 的 1/2 得 6.6×10⁻⁸ eV；用 Δλ = λΔν（漏除 ν）导致量级错。"},{"id":"c20q048","type":"calc","difficulty":5,"tags":["隧道效应","透射系数","势垒宽度"],"stem":"电子以能量 E 入射到高 U、宽 a 的方势垒，U − E = 2.0 eV。(1) 写出透射系数的量级表达式并说明各量含义；(2) 取 a = 0.20 nm，求 2κa 与透射系数；(3) 若势垒宽度减半，透射系数变为原来的几倍？","options":[],"answer":"(1) T ≈ exp[−2a√(2m(U−E))/ħ]；(2) 2κa = 2.90，T ≈ 5.5×10⁻²；(3) 约 4.3 倍","explain":"(1) 势垒内波函数按 e^(−κx) 衰减，κ = √(2m(U − E))/ħ，穿过宽度 a 后振幅衰减 e^(−κa)，概率（透射系数）∝ e^(−2κa)。\n(2) κ = √(2×9.11×10⁻³¹×2.0×1.60×10⁻¹⁹)/1.055×10⁻³⁴ = √(5.83×10⁻⁴⁹)/1.055×10⁻³⁴ = 7.24×10⁹ m⁻¹；2κa = 2×7.24×10⁹×2.0×10⁻¹⁰ = 2.90，T ≈ e^(−2.90) = 5.5×10⁻²。\n(3) a 减半则指数减半：T′ ∝ e^(−1.45)，T′/T = e^(1.45) = 4.3 倍。\n结论：T 对 a 和 (U − E) 都呈指数敏感，宽度每增加约 0.1 nm、或势垒每升高 1 eV，T 就下降一个量级左右，这正是隧道效应只在纳米尺度显著的原因。\n易错点：指数上漏掉因子 2；把 κ 中的 m 用 2m 的平方根写错；用线性比例估算倍数。"},{"id":"c20q049","type":"calc","difficulty":5,"tags":["光电效应","普朗克常量测定","线性拟合"],"stem":"用同一光电管测得三组数据：λ = 400 nm 时截止电压 0.850 V；λ = 350 nm 时 1.29 V；λ = 300 nm 时 1.88 V。(1) 说明 U 与 ν 的关系并求出斜率；(2) 由斜率求普朗克常量；(3) 求该阴极材料的逸出功。","options":[],"answer":"(1) U = (h/e)ν − W/e，斜率 4.11×10⁻¹⁵ V·s；(2) h ≈ 6.58×10⁻³⁴ J·s；(3) W = 2.25 eV","explain":"(1) 由 eU = hν − W 得 U = (h/e)ν − W/e，U–ν 图为直线，斜率 k = h/e，截距为 −W/e。\nν 分别为 7.50×10¹⁴、8.57×10¹⁴、1.00×10¹⁵ Hz；用 400 nm 与 300 nm 两点：k = (1.88 − 0.850)/(1.00×10¹⁵ − 7.50×10¹⁴) = 1.03/2.50×10¹⁴ = 4.12×10⁻¹⁵ V·s。\n(2) h = ke = 4.12×10⁻¹⁵×1.60×10⁻¹⁹ = 6.59×10⁻³⁴ J·s，与公认值 6.63×10⁻³⁴ 相差 0.6%，说明数据自洽。\n(3) 取 400 nm：W = hc/λ − eU = 3.10 − 0.850 = 2.25 eV。\n易错点：用 U–λ 作图（不是直线）；求斜率时漏掉 e 直接报 4.12×10⁻¹⁵ 为 h；把截距当逸出功而不乘 e。"},{"id":"c20q050","type":"calc","difficulty":5,"tags":["康普顿散射","120° 散射","动量守恒与反冲角"],"stem":"波长 0.0200 nm 的 X 射线被静止自由电子散射，散射角 120°。求：(1) 散射光波长；(2) 散射光子能量与电子动能；(3) 反冲电子运动方向与入射方向的夹角。","options":[],"answer":"(1) 0.0236 nm；(2) 52.4 keV 和 9.6 keV；(3) 27.2°","explain":"(1) Δλ = 2.43×10⁻¹²×(1 − cos120°) = 2.43×10⁻¹²×1.5 = 3.65×10⁻¹² m = 0.00365 nm，λ′ = 0.0200 + 0.00365 = 0.0236 nm。(2) E = 1.24×10³/0.0200 = 62.0 keV，E′ = 1.24×10³/0.02365 = 52.4 keV，Eₖ = 62.0 − 52.4 = 9.6 keV。(3) p₀ = h/λ₀ = 3.32×10⁻²³、p′ = h/λ′ = 2.80×10⁻²³ kg·m/s。由动量守恒 p₀ = p′ + pₑ，散射光子方向与入射方向成 120°，故电子动量 x 分量 pₓ = p₀ − p′cos120° = 3.32 − 2.80×(−0.5) = 4.72×10⁻²³，y 分量 p_y = −p′sin120° = −2.43×10⁻²³ kg·m/s。tanφ = 2.43/4.72 = 0.515，φ = 27.2°（偏向入射方向一侧）。校验：pₑ = 5.31×10⁻²³ kg·m/s，pₑ²/(2mₑ) = 9.6 keV，与能量差一致。易错点：把 1 − cos120° 算成 0.5（应为 1.5）；反冲角直接用 180° − 120° = 60°；电子动量按标量相减。"}]}];</script>
<script>
/* 大学物理 1000 题 · 离线刷题器 */
(function () {
  "use strict";

  const S_KEY = "uniphy_v1";
  const ALL = [];
  (window.BANK || []).forEach(b => (b.questions || []).forEach(q => {
    ALL.push(Object.assign({}, q, { ch: b.chapter, chName: b.chapterName }));
  }));

  let S = { pick: {}, done: {}, ok: {}, star: {}, lastId: null };
  try { Object.assign(S, JSON.parse(localStorage.getItem(S_KEY) || "{}")); } catch (e) {}
  function save() { try { localStorage.setItem(S_KEY, JSON.stringify(S)); } catch (e) {} }

  const view = { ch: 0, diff: 0, type: "", mode: "all", kw: "" };
  let pool = [], idx = 0;
  let exam = null; // {list, picks, start, timer}

  const $ = id => document.getElementById(id);
  const card = $("card");

  const esc = s => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  function buildPool(keep) {
    let arr = ALL.filter(q =>
      (!view.ch || q.ch === view.ch) &&
      (!view.diff || q.difficulty === +view.diff) &&
      (!view.type || q.type === view.type));
    if (view.kw) {
      const k = view.kw.toLowerCase();
      arr = arr.filter(q => (q.stem + " " + q.explain + " " + (q.tags || []).join(" ")).toLowerCase().includes(k));
    }
    if (view.mode === "wrong") arr = arr.filter(q => S.done[q.id] && !S.ok[q.id]);
    if (view.mode === "star") arr = arr.filter(q => S.star[q.id]);
    if (view.mode === "todo") arr = arr.filter(q => !S.done[q.id]);
    if (view.mode === "random") arr = shuffle(arr.slice());
    const df = $("diffFirst");
    if (df && df.checked && view.mode !== "random") {
      arr = arr.slice().sort((a, b) => b.difficulty - a.difficulty);
    }
    const prev = keep && pool[idx] ? pool[idx].id : null;
    pool = arr;
    idx = prev ? Math.max(0, pool.findIndex(q => q.id === prev)) : 0;
    if (idx < 0) idx = 0;
  }

  /* ---------------- 侧栏 ---------------- */
  function renderChapters() {
    const el = $("chapters");
    el.innerHTML = `<button class="chap ${view.ch === 0 ? "active" : ""}" data-ch="0">
      <span class="no">Σ</span><span class="nm">全部章节</span><span class="cnt">${ALL.length}</span></button>` +
      (window.BANK || []).map(b => {
        const done = b.questions.filter(q => S.done[q.id]).length;
        return `<button class="chap ${view.ch === b.chapter ? "active" : ""}" data-ch="${b.chapter}">
          <span class="no">${String(b.chapter).padStart(2, "0")}</span>
          <span class="nm" title="${esc(b.chapterName)}">${esc(b.chapterName)}</span>
          <span class="cnt">${done}/${b.questions.length}</span></button>`;
      }).join("");
    el.querySelectorAll(".chap").forEach(btn => btn.onclick = () => {
      view.ch = +btn.dataset.ch;
      document.body.classList.remove("nav-open");
      refresh(true);
    });
  }

  function renderStatsBar() {
    const done = ALL.filter(q => S.done[q.id]).length;
    const ok = ALL.filter(q => S.ok[q.id]).length;
    const wrong = ALL.filter(q => S.done[q.id] && !S.ok[q.id]).length;
    const star = ALL.filter(q => S.star[q.id]).length;
    $("progText").textContent = done + " / " + ALL.length;
    $("progBar").style.width = (ALL.length ? done / ALL.length * 100 : 0) + "%";
    $("statDone").textContent = done;
    $("statRight").textContent = ok;
    $("statWrong").textContent = wrong;
    $("statStar").textContent = star;
  }

  /* ---------------- 题目卡片 ---------------- */
  function cur() { return pool[idx] || null; }

  function pathText() {
    if (exam) return `模拟考试 · 第 ${idx + 1}/${exam.list.length} 题`;
    const q = cur();
    return q ? `<b>${esc(q.chName)}</b> · 第 ${idx + 1} / ${pool.length} 题` : "没有符合条件的题目";
  }

  function answerBox(q, show) {
    const isChoice = q.type === "choice";
    const ans = isChoice ? q.answer : q.answer;
    return `<div class="answer ${show ? "show" : ""}">
      <h4>${isChoice ? "正确答案" : "参考答案"}</h4>
      <div class="ans-line">${isChoice ? "【" + esc(ans) + "】" : esc(ans)}</div>
      <div class="explain">${esc(q.explain)}</div>
      ${!isChoice ? `<div class="self-check">
        <button class="btn small" data-self="1">我算对了</button>
        <button class="btn small" data-self="0">算错了，看下一题</button>
      </div>` : ""}
    </div>`;
  }

  function renderCard() {
    const q = cur();
    if (!q) {
      card.innerHTML = `<div class="empty">没有符合条件的题目<br><br>试试换个章节、难度或模式</div>`;
      $("pathText").innerHTML = pathText();
      return;
    }
    const picked = exam ? (exam.picks[q.id] || "") : (S.pick[q.id] || "");
    const answered = exam ? !!picked : !!S.done[q.id];
    const showAns = exam ? false : answered;
    const diffTxt = { 3: "难度 3 · 基础", 4: "难度 4 · 进阶", 5: "难度 5 · 综合" }[q.difficulty] || ("难度 " + q.difficulty);

    let html = `<div class="meta">
      <span class="pill">${esc(q.chName)}</span>
      <span class="pill diff${q.difficulty}">${diffTxt}</span>
      <span class="pill type">${q.type === "choice" ? "选择题" : "计算题"}</span>
      ${(q.tags || []).map(t => `<span class="pill tag">${esc(t)}</span>`).join("")}
      <span class="qno">${q.id.toUpperCase()}</span>
    </div>
    <div class="stem">${esc(q.stem)}</div>`;

    if (q.type === "choice") {
      html += `<div class="options">` + (q.options || []).map((o, i) => {
        const key = "ABCD"[i];
        let cls = "opt";
        if (answered && !exam) {
          if (key === q.answer) cls += " right";
          else if (key === picked) cls += " wrong";
          cls += " disabled";
        } else if (exam && picked === key) {
          cls += " right";
        }
        return `<button class="${cls}" data-opt="${key}"><span class="k">${key}</span><span>${esc(o)}</span></button>`;
      }).join("") + `</div>`;
      html += answerBox(q, answered);
    } else {
      html += `<div class="actions">
        <button class="btn primary" id="showAnsBtn" ${answered ? "disabled" : ""}>${answered ? "已查看答案" : "显示答案与解析"}</button>
      </div>` + answerBox(q, answered);
    }

    html += `<div class="footer-nav">
      <button class="btn" id="prevBtn">上一题</button>
      <button class="btn" id="starBtn">${S.star[q.id] ? "★ 已收藏" : "☆ 收藏"}</button>
      <button class="btn primary" id="nextBtn2">下一题</button>
    </div>`;

    card.innerHTML = html;
    $("pathText").innerHTML = pathText();

    card.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => {
      if (exam) { exam.picks[q.id] = b.dataset.opt; save(); renderCard(); }
      else pickChoice(q, b.dataset.opt);
    });
    const sab = $("showAnsBtn");
    if (sab) sab.onclick = () => { if (!exam) { S.done[q.id] = true; save(); renderCard(); } };
    card.querySelectorAll("[data-self]").forEach(b => b.onclick = () => {
      const good = b.dataset.self === "1";
      S.done[q.id] = true;
      if (good) S.ok[q.id] = true; else delete S.ok[q.id];
      save(); renderCard(); renderStatsBar(); renderChapters();
    });
    $("prevBtn").onclick = () => go(-1);
    $("nextBtn2").onclick = () => go(1);
    $("starBtn").onclick = () => { S.star[q.id] = !S.star[q.id]; save(); renderCard(); renderStatsBar(); };
  }

  function pickChoice(q, key) {
    if (S.done[q.id]) return;
    S.pick[q.id] = key;
    S.done[q.id] = true;
    if (key === q.answer) S.ok[q.id] = true; else delete S.ok[q.id];
    save();
    renderCard(); renderStatsBar(); renderChapters();
  }

  function go(d) {
    if (!pool.length) return;
    if (exam) {
      idx = Math.min(exam.list.length - 1, Math.max(0, idx + d));
      renderCard(); return;
    }
    idx = (idx + d + pool.length) % pool.length;
    if ((view.mode === "wrong" || view.mode === "todo") && S.done[pool[idx].id]) {
      const q = cur();
      if (view.mode === "wrong" && S.ok[q.id]) { buildPool(true); }
    }
    renderCard();
  }

  function refresh(rebuild) {
    if (rebuild) buildPool(true);
    if (exam) { renderExamCard(); return; }
    $("statsView").classList.remove("show");
    $("quizView").style.display = "";
    renderCard(); renderChapters(); renderStatsBar();
  }

  /* ---------------- 统计 ---------------- */
  function renderStats() {
    const done = ALL.filter(q => S.done[q.id]).length;
    const ok = ALL.filter(q => S.ok[q.id]).length;
    const rate = done ? Math.round(ok / done * 100) : 0;
    $("sumDone").textContent = done;
    $("sumRate").textContent = rate + "%";
    $("sumWrong").textContent = ALL.filter(q => S.done[q.id] && !S.ok[q.id]).length;
    $("sumStar").textContent = ALL.filter(q => S.star[q.id]).length;
    $("statsBody").innerHTML = (window.BANK || []).map(b => {
      const d = b.questions.filter(q => S.done[q.id]).length;
      const o = b.questions.filter(q => S.ok[q.id]).length;
      const pct = Math.round(d / b.questions.length * 100);
      return `<tr>
        <td>${String(b.chapter).padStart(2, "0")} · ${esc(b.chapterName)}</td>
        <td class="num">${d}/${b.questions.length}</td>
        <td><div class="mini-bar"><i style="width:${pct}%"></i></div></td>
        <td class="num">${pct}%</td>
        <td class="num">${d ? Math.round(o / d * 100) + "%" : "—"}</td>
      </tr>`;
    }).join("");
  }

  /* ---------------- 模拟考试 ---------------- */
  function startExam() {
    if (exam && !confirm("正在考试中，重新开始将放弃当前试卷？")) return;
    const pool0 = ALL.filter(q => q.type === "choice");
    const list = shuffle(pool0.slice()).slice(0, 30);
    exam = { list, picks: {}, start: Date.now(), timer: null };
    idx = 0;
    document.body.classList.remove("nav-open");
    $("statsView").classList.remove("show");
    $("quizView").style.display = "";
    exam.timer = setInterval(() => {
      const el = document.getElementById("examClock");
      if (el) el.textContent = fmtLeft();
      if (examLeft() <= 0) { clearInterval(exam.timer); exam.timer = null; finishExam(); }
    }, 1000);
    renderExamCard();
  }

  function examLeft() {
    if (!exam) return 0;
    return Math.max(0, 45 * 60 - Math.floor((Date.now() - exam.start) / 1000));
  }

  function renderExamCard() {
    if (!exam) return;
    const q = exam.list[idx];
    $("pathText").innerHTML = `<b>模拟考试</b> · 第 ${idx + 1}/${exam.list.length} 题 · 剩余 <span id="examClock">${fmtLeft()}</span>`;
    const picked = exam.picks[q.id];
    card.innerHTML = `<div class="meta">
      <span class="pill">${esc(q.chName)}</span>
      <span class="pill diff${q.difficulty}">难度 ${q.difficulty}</span>
      <span class="pill type">选择题</span>
      <span class="qno">${q.id.toUpperCase()}</span>
    </div>
    <div class="stem">${esc(q.stem)}</div>
    <div class="options">` + q.options.map((o, i) => {
      const key = "ABCD"[i];
      return `<button class="opt ${picked === key ? "right" : ""}" data-opt="${key}"><span class="k">${key}</span><span>${esc(o)}</span></button>`;
    }).join("") + `</div>
    <div class="footer-nav">
      <button class="btn" id="prevBtn">上一题</button>
      <button class="btn primary" id="submitExam">交卷（${Object.keys(exam.picks).length}/${exam.list.length}）</button>
      <button class="btn primary" id="nextBtn2">下一题</button>
    </div>`;
    card.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => {
      exam.picks[q.id] = b.dataset.opt;
      renderExamCard();
    });
    $("prevBtn").onclick = () => { if (idx > 0) { idx--; renderExamCard(); } };
    $("nextBtn2").onclick = () => { if (idx < exam.list.length - 1) { idx++; renderExamCard(); } };
    $("submitExam").onclick = () => { if (confirm("确定交卷？还剩 " + Object.keys(exam.picks).length + " 题已答。")) finishExam(); };
  }

  function fmtLeft() {
    const s = examLeft();
    return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }

  function finishExam() {
    if (exam && exam.timer) { clearInterval(exam.timer); exam.timer = null; }
    const list = exam.list, picks = exam.picks;
    let right = 0;
    list.forEach(q => {
      const p = picks[q.id];
      S.done[q.id] = true;
      if (p) S.pick[q.id] = p;
      if (p === q.answer) { S.ok[q.id] = true; right++; } else delete S.ok[q.id];
    });
    save();
    const used = Math.floor((Date.now() - exam.start) / 1000);
    const wrongList = list.filter(q => picks[q.id] !== q.answer);
    card.innerHTML = `<div class="empty" style="padding:30px 0">
      <div style="font-size:46px;font-weight:700;color:var(--accent)">${right} / ${list.length}</div>
      <div style="margin-top:6px">得分 ${Math.round(right / list.length * 100)} 分 · 用时 ${Math.floor(used / 60)} 分 ${used % 60} 秒</div>
      <div style="margin-top:10px;color:var(--muted)">答对 ${right} 题 · 答错 ${Object.keys(picks).length - right} 题 · 未答 ${list.length - Object.keys(picks).length} 题</div>
      <div class="actions" style="justify-content:center;margin-top:22px">
        <button class="btn primary" id="backPractice">返回练习</button>
        <button class="btn" id="reviewWrong">回看错题（${wrongList.length}）</button>
      </div>
      ${wrongList.length ? `<div style="margin-top:26px;text-align:left;max-width:720px;margin-left:auto;margin-right:auto">
        ${wrongList.map(q => `<div style="border-top:1px solid var(--line);padding:10px 0">
          <div style="color:var(--muted);font-size:12px">${esc(q.chName)} · ${q.id.toUpperCase()}</div>
          <div>${esc(q.stem)}</div>
          <div style="margin-top:4px">你的答案 <b style="color:var(--bad)">${picks[q.id] || "未答"}</b>，正确 <b style="color:var(--ok)">${q.answer}</b></div>
        </div>`).join("")}
      </div>` : ""}
    </div>`;
    $("pathText").innerHTML = "<b>模拟考试</b> · 已交卷";
    $("backPractice").onclick = () => { exam = null; view.mode = "all"; syncModeButtons(); refresh(true); };
    $("reviewWrong").onclick = () => {
      exam = null; view.mode = "wrong"; syncModeButtons(); refresh(true);
    };
    renderStatsBar(); renderChapters();
  }

  /* ---------------- 侧栏交互 ---------------- */
  function syncModeButtons() {
    document.querySelectorAll(".mode").forEach(b => b.classList.toggle("active", b.dataset.mode === view.mode));
  }

  document.querySelectorAll(".mode").forEach(btn => btn.onclick = () => {
    const m = btn.dataset.mode;
    if (m === "exam") { startExam(); return; }
    exam = null;
    view.mode = m;
    syncModeButtons();
    refresh(true);
  });

  $("diffFilter").onchange = e => { view.diff = +e.target.value; refresh(true); };
  $("typeFilter").onchange = e => { view.type = e.target.value; refresh(true); };
  const dfEl = $("diffFirst");
  if (dfEl) dfEl.onchange = () => refresh(true);
  let kwTimer = null;
  $("searchBox").oninput = e => {
    clearTimeout(kwTimer);
    kwTimer = setTimeout(() => { view.kw = e.target.value.trim(); refresh(true); }, 220);
  };
  $("menuBtn").onclick = () => document.body.classList.toggle("nav-open");
  // 手机上：点遮罩、选章节/模式、进统计页都自动收起抽屉
  function closeNav() { document.body.classList.remove("nav-open"); }
  document.addEventListener("click", e => {
    if (!document.body.classList.contains("nav-open")) return;
    const sb = $("sidebar");
    if (sb && sb.contains(e.target)) return;
    if (e.target.closest && e.target.closest("#menuBtn")) return;
    closeNav();
  });
  ["chapters", "modes"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("click", () => setTimeout(closeNav, 60));
  });
  const sbEl = $("sidebar");
  if (sbEl) sbEl.addEventListener("change", e => {
    if (e.target && e.target.tagName === "SELECT") setTimeout(closeNav, 60);
  });
  $("backBtn").onclick = () => go(-1);
  $("nextBtn").onclick = () => go(1);
  $("statsBtn").onclick = () => {
    exam = null;
    closeNav();
    $("quizView").style.display = "none";
    $("statsView").classList.add("show");
    renderStats();
  };
  $("resetBtn").onclick = () => {
    if (!confirm("清空所有做题记录、错题和收藏？")) return;
    S = { pick: {}, done: {}, ok: {}, star: {}, lastId: null };
    save(); refresh(true); renderStatsBar();
  };

  document.addEventListener("keydown", e => {
    if (e.target.matches("input,select,textarea")) return;
    if (exam) {
      if (/^[1-4]$/.test(e.key)) {
        const q = exam.list[idx]; if (q) exam.picks[q.id] = "ABCD"[+e.key - 1];
        renderExamCard();
      }
      if (e.key === "ArrowLeft" && idx > 0) { idx--; renderExamCard(); }
      if (e.key === "ArrowRight" && idx < exam.list.length - 1) { idx++; renderExamCard(); }
      return;
    }
    const q = cur(); if (!q) return;
    if (/^[1-4]$/.test(e.key) && q.type === "choice" && !S.done[q.id]) pickChoice(q, "ABCD"[+e.key - 1]);
    if (e.key === "ArrowLeft") go(-1);
    if (e.key === "ArrowRight") go(1);
    if (e.key === "s" || e.key === "S") { S.star[q.id] = !S.star[q.id]; save(); renderCard(); renderStatsBar(); }
    if ((e.key === "a" || e.key === "A") && q.type === "calc" && !S.done[q.id]) { S.done[q.id] = true; save(); renderCard(); }
    if (e.key === "Escape") document.body.classList.remove("nav-open");
  });

  /* ---------------- 启动 ---------------- */
  if (!ALL.length) {
    card.innerHTML = `<div class="empty">题库为空：请用 build.py 重新生成 bank.js</div>`;
    return;
  }
  renderChapters();
  buildPool(false);
  renderCard();
  renderStatsBar();
})();

</script>
</body>
</html>
