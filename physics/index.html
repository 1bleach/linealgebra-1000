3) 若把缝宽增大到 0.360 mm（仍在空气中），线宽变为多少。","answer":"(1) 0.240 mm；(2) 4.51 mm；(3) 4.00 mm","explain":"(1) 由 Δx = 2λf/a 得 a = 2λf/Δx = 2×600×10⁻⁹×1.20/6.00×10⁻³ = 2.40×10⁻⁴ m = 0.240 mm。\n(2) 水中波长 λ' = λ/n = 600/1.33 = 451 nm，Δx' = 2λ'f/a = 2×451×10⁻⁹×1.20/2.40×10⁻⁴ = 4.51×10⁻³ m = 4.51 mm。\n(3) a = 0.360 mm 时 Δx = 2×600×10⁻⁹×1.20/3.60×10⁻⁴ = 4.00 mm。\n易错点：衍射公式里的波长要取介质中的波长 λ/n；线宽与缝宽成反比、与焦距成正比。"},{"id":"c17q049","type":"calc","difficulty":5,"tags":["双缝衍射综合","缺级与包络"],"stem":"双缝间距 d = 0.300 mm、缝宽 a = 0.100 mm，λ = 600 nm 的平行光垂直入射，透镜焦距 f = 1.00 m。求：(1) 缺失的干涉级次；(2) 单缝中央包络内的明纹数；(3) 第一级明纹到中央的距离；(4) 第一级明纹中心处的相对强度。","answer":"(1) 3、6、9…级；(2) 5 条；(3) 2.00 mm；(4) I/I₀ = 0.684","explain":"(1) 缺级 k = (d/a)k' = 3k'，即 3、6、9…级缺失。\n(2) 包络内 |k| \u003c d/a = 3，可取 k = 0、±1、±2，共 5 条（k = ±3 落在单缝第一暗纹处）。\n(3) x = λf/d = 600×10⁻⁹×1.00/3.00×10⁻⁴ = 2.00×10⁻³ m = 2.00 mm。\n(4) 第一级处 u = πa/d = π/3，I/I₀ = (sin(π/3)/(π/3))² = (0.866/1.047)² = 0.684。\n易错点：包络内条纹数按 2(d/a)−1 计算并扣除缺级；强度比要用 u = πka/d，不能直接用 1。"},{"id":"c17q050","type":"calc","difficulty":5,"tags":["分辨极限","望远镜口径设计"],"stem":"某望远镜要求对 λ = 550 nm 的光的分辨角不超过 1.0×10⁻⁶ rad。求：(1) 物镜口径的最小值（用符号表达判据再代值）；(2) 若实际口径取 2.00 m，其分辨角为多少；(3) 用该 2.00 m 望远镜观察月球表面（月地距离 3.84×10⁸ m），能分辨的最小距离。","answer":"(1) D ≥ 1.22λ/θ_min = 0.671 m；(2) 3.36×10⁻⁷ rad；(3) 129 m","explain":"(1) 瑞利判据 θ_min = 1.22λ/D，要求 θ_min ≤ 1.0×10⁻⁶ rad，故 D ≥ 1.22λ/θ_min = 1.22×550×10⁻⁹/1.0×10⁻⁶ = 0.671 m。\n(2) D = 2.00 m 时 θ_min = 1.22×550×10⁻⁹/2.00 = 3.36×10⁻⁷ rad。\n(3) s = Lθ_min = 3.84×10⁸×3.36×10⁻⁷ = 129 m。\n提高分辨本领只有两条路：增大口径、缩短波长；单纯提高放大率不能突破衍射极限。\n易错点：漏掉 1.22；把“分辨角上限”代错方向；误以为放大率越高分辨越好。"}]},{"chapter":18,"chapterName":"光的偏振","questions":[{"id":"c18q001","type":"choice","difficulty":3,"tags":["马吕斯定律","自然光的起偏","极值判断"],"stem":"自然光以强度 I₀ 垂直入射到偏振片 P₁，透射后再通过偏振片 P₂。初始时 P₂ 的透光轴与 P₁ 成 60.0°，随后把 P₂ 转到与 P₁ 成 30.0°。两种情况下 P₂ 的透射光强之比 I₃₀/I₆₀ 为","options":["3.00","0.333","1.73","1.50"],"answer":"A","explain":"自然光过 P₁ 后变成线偏振光，强度 I₁ = I₀/2，这是起偏时的一半损失。\n由马吕斯定律 I = I₁cos²θ，I₃₀ = (I₀/2)cos²30.0° = 0.375I₀，I₆₀ = (I₀/2)cos²60.0° = 0.125I₀。\n比值 I₃₀/I₆₀ = 0.750/0.250 = 3.00。\n易错点：把自然光直接代入 cos²θ（少乘 1/2 会得 9.00）；或只用 cosθ 的比值而忘记平方（得 1.73）。"},{"id":"c18q002","type":"choice","difficulty":3,"tags":["三偏振片串联","马吕斯定律","非零透射"],"stem":"自然光强度 I₀ 垂直入射到偏振片 P₁，其后依次放置 P₂、P₃。P₂ 的透光轴与 P₁ 成 30.0°，P₃ 的透光轴与 P₁ 成 90.0°。出射光强为","options":["0","I₀/8","3I₀/32","3I₀/16"],"answer":"C","explain":"过 P₁ 后 I₁ = I₀/2，振动方向沿 P₁。\n过 P₂：I₂ = I₁cos²30.0° = (I₀/2)(0.750) = 3I₀/8。\nP₃ 与 P₂ 的夹角为 60.0°，I₃ = I₂cos²60.0° = (3I₀/8)(0.250) = 3I₀/32 ≈ 0.0938I₀。\n关键判断：P₁ 与 P₃ 虽正交，但插入 P₂ 后出射不为零；选 0 是漏掉了「中间片把振动方向逐步转过去」这一过程。"},{"id":"c18q003","type":"choice","difficulty":3,"tags":["布儒斯特角","全反射临界角","反射光与折射光垂直"],"stem":"玻璃的折射率为 1.52，光从玻璃射向空气。以布儒斯特角入射时，反射光与折射光的夹角以及折射角分别为","options":["90.0°，33.3°","90.0°，56.7°","56.7°，33.3°","41.1°，48.9°"],"answer":"B","explain":"布儒斯特角满足 tan i₀ = n₂/n₁ = 1/1.52，得 i₀ = 33.3°。\n布儒斯特定律同时给出 i₀ + r = 90.0°，故折射角 r = 56.7°，反射光与折射光互相垂直。\n还需判断折射是否存在：临界角 C = arcsin(1/1.52) = 41.1°，i₀ = 33.3° \u003c C，所以确有折射光。\n易错点：把折射率比颠倒得 56.3°；把临界角 41.1° 误当布儒斯特角。"},{"id":"c18q004","type":"choice","difficulty":3,"tags":["偏振度","部分偏振光","马吕斯定律"],"stem":"部分偏振光垂直入射到检偏器，检偏器旋转一周测得最大透射光强 7.00 W/m²、最小 1.00 W/m²。该光的偏振度以及检偏器透光轴与最大透射方向成 45.0° 时的透射光强分别为","options":["0.857，3.50 W/m²","0.750，3.50 W/m²","0.500，4.00 W/m²","0.750，4.00 W/m²"],"answer":"D","explain":"部分偏振光可看作自然光与线偏振光的叠加：I(θ) = I_u/2 + I_pcos²θ。\nI_min = I_u/2 = 1.00 W/m²，I_max = I_u/2 + I_p = 7.00 W/m²，得 I_p = 6.00 W/m²。\n偏振度 P = (I_max − I_min)/(I_max + I_min) = 6.00/8.00 = 0.750。\n45.0° 时 I = 1.00 + 6.00×0.500 = 4.00 W/m²。易错点：P 写成 I_p/I_max = 6/7；45° 时把自然光分量也乘 cos²。"},{"id":"c18q005","type":"choice","difficulty":3,"tags":["四分之一波片","相位差","最小厚度"],"stem":"石英的寻常光与非常光折射率之差 |n_o − n_e| = 0.00900，对波长 589 nm 的光，把石英片作成四分之一波片所需的最小厚度为","options":["16.4 μm","32.7 μm","65.4 μm","8.18 μm"],"answer":"A","explain":"波片的相位差为 Δφ = 2π|n_o − n_e|d/λ。\n四分之一波片要求 |Δφ| = π/2，即 |n_o − n_e|d = λ/4。\n解得 d = λ/(4|Δn|) = 589×10⁻⁹/(4×0.00900) = 1.64×10⁻⁵ m = 16.4 μm。\n易错点：漏掉因子 4 得 65.4 μm；把 λ/4 误当 λ/2 得 32.7 μm；把 0.00900 当作 0.0180 得 8.18 μm。"},{"id":"c18q006","type":"choice","difficulty":3,"tags":["半波片","振动面旋转","马吕斯定律"],"stem":"线偏振光强度 I₀ 垂直入射到半波片，其振动方向与波片快轴成 30.0°。出射光再通过透光轴沿水平方向的检偏器，快轴为竖直方向。透射光强为","options":["0.750I₀","0.500I₀","0.250I₀","0.125I₀"],"answer":"C","explain":"半波片使线偏振方向相对快轴作镜像：入射方向与快轴成 +30.0°，出射方向与快轴成 −30.0°。\n快轴竖直，故出射振动方向与竖直方向成 30.0°，与水平方向成 60.0°。\n由马吕斯定律 I = I₀cos²60.0° = 0.250I₀。\n易错点：以为半波片不改变振动方向（得 0.750I₀）；以为振动面旋转 90°（得 0）。"},{"id":"c18q007","type":"choice","difficulty":4,"tags":["布儒斯特角","折射率测量","临界角"],"stem":"自然光从空气射到某透明介质表面，反射光在入射角 58.0° 时完全偏振。该介质的折射率以及光从该介质射向空气时的临界角分别为","options":["1.60，51.3°","1.60，38.7°","1.70，36.0°","0.625，38.7°"],"answer":"B","explain":"反射光完全偏振时入射角为布儒斯特角，tan i₀ = n₂/n₁ = n，故 n = tan58.0° = 1.600。\n光从介质射向空气，临界角满足 sin C = 1/n = 0.6250，得 C = 38.7°。\n注意 C 与 i₀ 互余：i₀ + C = 90.0°，这是本题的快速校验。\n易错点：把 tan i₀ 当作折射率的倒数（0.625）；把 90° − C = 51.3° 当成临界角。"},{"id":"c18q008","type":"choice","difficulty":4,"tags":["菲涅耳公式","反射光偏振度","自然光反射"],"stem":"自然光以 45.0° 入射到折射率 1.50 的玻璃表面。反射光中垂直于入射面的分量与平行于入射面的分量强度不等，其偏振度 (I_s − I_p)/(I_s + I_p) 约为","options":["0.535","1.00","0.0920","0.832"],"answer":"D","explain":"由折射定律 sin r = sin45.0°/1.50 = 0.4714，得 r = 28.1°，cos r = 0.8819。\n菲涅耳振幅系数：r_s = (cos i − ncos r)/(cos i + ncos r) = −0.3033，R_s = 0.0920；\nr_p = (ncos i − cos r)/(ncos i + cos r) = 0.0920，R_p = 0.00847。\n自然光两分量各占一半，故 P = (R_s − R_p)/(R_s + R_p) = 0.0835/0.1005 = 0.832。\n易错点：用振幅比而不平方（0.535）；以为只有布儒斯特角才偏振而取 1.00；把 R_s 本身当偏振度（0.0920）。"},{"id":"c18q009","type":"choice","difficulty":4,"tags":["波片相位差","光程差","双折射率"],"stem":"石英晶片厚度 0.0250 mm，|n_o − n_e| = 0.00900，对波长 589 nm 的光，o 光与 e 光通过晶片后的相位差为","options":["2.40 rad","1.20 rad","4.80 rad","0.382 rad"],"answer":"A","explain":"两光的光程差 Δ = |n_o − n_e|d = 0.00900×2.50×10⁻⁵ = 2.25×10⁻⁷ m。\n以波长归一：Δ/λ = 2.25×10⁻⁷/5.89×10⁻⁷ = 0.3820。\n相位差 Δφ = 2πΔ/λ = 2π×0.3820 = 2.40 rad，约 0.764π。\n易错点：只算出 0.382 就作答（忘记乘 2π）；把厚度当 0.25 mm 后再把结果除以 2 得 4.80 rad。"},{"id":"c18q010","type":"choice","difficulty":4,"tags":["圆偏振光","四分之一波片","马吕斯定律"],"stem":"圆偏振光强度 I₀ 垂直入射到四分之一波片，出射光变为线偏振光。使出射光再通过检偏器，当检偏器从透射最大位置转过 60.0° 时，透射光强为","options":["0.750I₀","0.500I₀","0.250I₀","0.0625I₀"],"answer":"C","explain":"圆偏振光经 λ/4 片后变为线偏振光，波片不吸收，光强仍为 I₀。\n线偏振光通过检偏器服从马吕斯定律：I = I₀cos²60.0° = 0.250I₀。\n判断关键：圆偏振的两个正交分量振幅相等、相位差 π/2，λ/4 片再引入 π/2 后相位差变为 0 或 π，故合成为线偏振。\n易错点：以为圆偏振过 λ/4 后强度减半（0.125I₀）；把 60° 代入 sin² 得 0.750I₀。"},{"id":"c18q011","type":"choice","difficulty":4,"tags":["瑞利散射","波长四次方","天空蓝色"],"stem":"大气分子对日光的瑞利散射强度与波长四次方成反比。波长 450 nm 的蓝光与 650 nm 的红光，被同一天区空气分子散射的强度之比 I_蓝/I_红 约为","options":["2.09","4.35","1.44","8.70"],"answer":"B","explain":"瑞利散射 I ∝ λ⁻⁴，故 I_蓝/I_红 = (λ_红/λ_蓝)⁴。\n代入：I_蓝/I_红 = (650/450)⁴ = (1.444)⁴ = 4.35。\n这解释了天空呈蓝色：短波蓝光被散射到各个方向，进入人眼的比例远大于红光。\n易错点：用平方得 2.09；用一次方得 1.44；把比值颠倒或额外乘 2 得 8.70。"},{"id":"c18q012","type":"choice","difficulty":4,"tags":["瑞利散射","大气光学厚度","日落红色"],"stem":"设大气对 450 nm 蓝光的散射系数是 650 nm 红光的 4.35 倍，天顶方向大气的光学厚度对蓝光为 0.200。日落时阳光穿过大气的路径是天顶方向的 10.0 倍，忽略其他吸收，日落时透射的红光与蓝光强度之比约为","options":["1.19","0.214","10.0","4.67"],"answer":"D","explain":"光学厚度与路径成正比：蓝光 τ_B = 0.200×10.0 = 2.00，红光 τ_R = 2.00/4.35 = 0.460。\n透射率 T = e^(−τ)：T_B = e^(−2.00) = 0.135，T_R = e^(−0.460) = 0.632。\n故 I_R/I_B = T_R/T_B = 0.632/0.135 = 4.67。\n易错点：把散射系数比 4.35 直接当透射比；忘记路径放大 10 倍；把指数衰减当线性衰减。"},{"id":"c18q013","type":"choice","difficulty":4,"tags":["液晶显示","正交偏振片","对比度"],"stem":"液晶显示器中，非偏振背光强度 I₀ 先通过偏振片 P₁，再通过透光轴与 P₁ 正交的 P₂。液晶盒位于两片之间，加电压时使线偏振方向旋转 90.0°，液晶盒透射率为 0.900；不加电压时不旋转。加电压（亮态）时屏幕透射光强及与暗态（P₂ 对入射到它的光漏光 1.0%）的对比度分别为","options":["0.450I₀，100","0.900I₀，100","0.450I₀，50.0","0.225I₀，100"],"answer":"A","explain":"背光过 P₁ 后为 I₀/2 的线偏振光。\n亮态：液晶盒把振动方向转 90.0°，透射 0.900，得 0.450I₀，正好沿 P₂ 透光轴全部通过。\n暗态：液晶不旋转，P₂ 只漏 1.0%，即 0.010×0.450I₀ = 0.00450I₀。\n对比度 = 0.450/0.00450 = 100。易错点：把背光 I₀ 直接乘液晶透射率（0.900I₀）；漏掉第一片偏振片的 1/2 损失。"},{"id":"c18q014","type":"choice","difficulty":4,"tags":["旋光性","比旋光率","溶液浓度"],"stem":"蔗糖溶液的比旋光率为 [α] = 66.5°·mL/(dm·g)。将浓度 0.200 g/mL 的溶液装入 2.00 dm 长的旋光管，线偏振光通过后振动面转过的角度为","options":["13.3°","53.2°","26.6°","66.5°"],"answer":"C","explain":"旋光角 φ = [α]cl，其中 c 为质量浓度，l 为光在溶液中的路程。\n代入 φ = 66.5×0.200×2.00 = 26.6°。\n单位核对：66.5°·mL/(dm·g) × (g/mL) × dm = °，量纲一致。\n易错点：忘记乘管长（13.3°）；把浓度 0.200 g/mL 当成 0.400 g/mL（53.2°）；直接把 [α] 当结果（66.5°）。"},{"id":"c18q015","type":"choice","difficulty":4,"tags":["二向色性","偏振片原理","偏振度"],"stem":"某二向色性偏振片对平行于其透光轴的线偏振光透射率为 0.800，对垂直于透光轴的线偏振光透射率为 0.0100。自然光垂直入射时，透射光强与偏振度分别为","options":["0.405I₀，0.800","0.405I₀，0.975","0.800I₀，0.975","0.400I₀，1.00"],"answer":"B","explain":"自然光可分解为两个等强度、互不相干的正交分量，各为 I₀/2。\n透射光强 I = (I₀/2)(0.800 + 0.0100) = 0.405I₀。\n两分量透射后分别为 0.400I₀ 与 0.00500I₀，故 P = (0.400 − 0.00500)/0.405 = 0.975。\n易错点：把透射率之差 0.790 当偏振度；以为实际偏振片也能达到 P = 1（0.400I₀，1.00）。"},{"id":"c18q016","type":"choice","difficulty":4,"tags":["旋转检偏器","马吕斯定律","光强变化频率"],"stem":"自然光强度 I₀ 通过偏振片后，再通过一个绕光轴以角速度 ω 匀速旋转的检偏器。透射光强随时间变化，其平均值和变化的角频率分别为","options":["I₀/2，2ω","I₀/4，ω","I₀/2，ω","I₀/4，2ω"],"answer":"D","explain":"过第一片后 I₁ = I₀/2。设检偏器转角 θ = ωt，则 I = I₁cos²ωt。\n用半角公式：I = (I₀/4)(1 + cos2ωt)。\n故平均值为 I₀/4，光强变化的角频率为 2ω，不是 ω。\n易错点：把平均值当 I₀/2；把 cos² 的频率误认为 ω；忽略第一片起偏的 1/2 损失。"},{"id":"c18q017","type":"choice","difficulty":4,"tags":["方解石双折射","四分之一波片","厚度计算"],"stem":"方解石对 589 nm 光的双折射率 |n_o − n_e| = 0.172。用它制作四分之一波片，所需最小厚度约为","options":["0.856 μm","1.71 μm","0.428 μm","3.42 μm"],"answer":"A","explain":"四分之一波片的光程差要求 |Δn|d = λ/4。\n代入 d = 589×10⁻⁹/(4×0.172) = 8.56×10⁻⁷ m = 0.856 μm。\n方解石双折射率很大，所以只需不到 1 μm 的厚度，实际波片常用云母或石英。\n易错点：漏因子 4 得 3.42 μm；按半波片算得 1.71 μm；把 λ/4 再除以 2 得 0.428 μm。"},{"id":"c18q018","type":"choice","difficulty":4,"tags":["布儒斯特角","菲涅耳反射","偏振分量投影"],"stem":"线偏振光强度 I₁ 以 45.0° 的方位角（振动方向与入射面的夹角）射到折射率 1.50 的玻璃表面，入射角恰为布儒斯特角。反射光强度为","options":["0.148I₁","0.500I₁","0.0740I₁","0.0370I₁"],"answer":"C","explain":"布儒斯特角下平行于入射面的 p 分量反射率为零，只有垂直入射面的 s 分量被反射。\n入射 s 分量 I_s = I₁cos²45.0° = 0.500I₁。\n对 n = 1.50 的布儒斯特角，菲涅耳公式给出 R_s = 0.148，故反射光 I = 0.148×0.500I₁ = 0.0740I₁。\n易错点：忘记把入射光投影到 s 方向（0.148I₁）；以为 p 分量也反射一半（0.500I₁）；把 R_s 再乘 1/2 得 0.0370I₁。"},{"id":"c18q019","type":"choice","difficulty":4,"tags":["散射偏振","偏振度","90°散射"],"stem":"太阳光被大气散射，在与太阳方向成 90.0° 的方向观察天空，散射光的偏振度为 0.900，总强度为 I。若用透光轴竖直（垂直于散射光的偏振方向）的偏振片观察，透射光强为","options":["0.100I","0.0500I","0.500I","0.900I"],"answer":"B","explain":"90° 散射光的电矢量垂直于由太阳、散射点和观察者构成的平面；对水平视线，该偏振方向为水平。\n竖直偏振片取的是最小值方向。由 P = (I_max − I_min)/(I_max + I_min) 且 I_max + I_min = I，得 I_min = (1 − P)I/2 = 0.0500I。\n这正是「天空偏振」可用来导航、拍照时加偏振镜压暗天空的物理依据。\n易错点：把偏振度当成最小强度比例（0.100I）；忘记非偏振背景要除以 2。"},{"id":"c18q020","type":"choice","difficulty":4,"tags":["圆偏振光产生","四分之一波片","正交检偏"],"stem":"自然光强度 I₀ 通过偏振片 P 后，再通过快轴与 P 的透光轴成 45.0° 的四分之一波片，最后通过与 P 正交的检偏器。透射光强为","options":["I₀/2","I₀/8","0","I₀/4"],"answer":"D","explain":"过 P 后为线偏振光，强度 I₀/2。\n线偏振光与 λ/4 片快轴成 45.0°，两正交分量振幅相等，波片引入 π/2 相位差，出射为圆偏振光，强度仍为 I₀/2。\n圆偏振光通过任何检偏器都只透过一半，故 I = (I₀/2)/2 = I₀/4。\n易错点：以为圆偏振光被正交检偏器完全挡住（0）；漏掉第一片偏振片的 1/2 损失（I₀/2）。"},{"id":"c18q021","type":"choice","difficulty":5,"tags":["三偏振片","极值","马吕斯定律"],"stem":"自然光强度 I₀ 垂直入射到 P₁，P₃ 与 P₁ 正交，在两者之间插入 P₂，P₂ 可绕光轴转动。出射光强的最大值及对应 P₂ 与 P₁ 的夹角为","options":["I₀/8，45.0°","I₀/4，45.0°","I₀/8，30.0°","0，任意角"],"answer":"A","explain":"设 P₂ 与 P₁ 的夹角为 θ，则 P₃ 与 P₂ 的夹角为 90.0° − θ。\nI = (I₀/2)cos²θcos²(90.0° − θ) = (I₀/2)cos²θsin²θ = (I₀/8)sin²2θ。\n当 2θ = 90.0°，即 θ = 45.0° 时 sin²2θ = 1，I_max = I₀/8。\n易错点：认为正交片之间插任何片都为零；漏掉第一片的 1/2 得 I₀/4；把极值点误判在 30°。"},{"id":"c18q022","type":"choice","difficulty":5,"tags":["椭圆偏振","四分之一波片","检偏器极值"],"stem":"线偏振光强度 I₀ 垂直入射到四分之一波片，振动方向与快轴成 30.0°。出射光通过旋转检偏器，测得的最大与最小透射光强之比为","options":["1.00","1.73","3.00","9.00"],"answer":"C","explain":"入射光在快轴、慢轴上的分量强度分别为 I_f = I₀cos²30.0° = 0.750I₀，I_s = I₀sin²30.0° = 0.250I₀。\nλ/4 片使两分量相位差为 π/2，合成光的椭圆主轴沿快轴和慢轴；相位差 π/2 时干涉交叉项为零，检偏器沿主轴时取极值。\n故 I_max = 0.750I₀，I_min = 0.250I₀，比值 3.00。\n易错点：以为出射是圆偏振（比值 1.00）；用振幅比 √3；把强度比再平方得 9.00。"},{"id":"c18q023","type":"choice","difficulty":5,"tags":["四分之一波片","正交偏振片","圆偏振"],"stem":"自然光强度 I₀ 通过偏振片 P₁ 后，再通过一块可绕光轴转动的四分之一波片，最后通过与 P₁ 正交的 P₂。当波片快轴与 P₁ 的透光轴成 45.0° 时，P₂ 的透射光强为","options":["I₀/2","I₀/4","I₀/8","0"],"answer":"B","explain":"过 P₁ 后为线偏振光，强度 I₀/2。\n快轴与振动方向成 45.0° 时，λ/4 片把线偏振光变成圆偏振光，强度仍为 I₀/2。\n圆偏振光通过 P₂ 透射一半，故 I = I₀/4。\n也可用正交偏振片间晶片的公式 I = (I₀/2)sin²2α·sin²(Δφ/2)，α = 45.0°、Δφ = π/2 时同样得 I₀/4。\n易错点：以为正交片全挡（0）；漏掉第一片的 1/2 得 I₀/2。"},{"id":"c18q024","type":"choice","difficulty":5,"tags":["偏振片堆","布儒斯特角","透射光偏振度"],"stem":"玻璃片堆由 5 片平行玻璃片（n = 1.50）组成，自然光以布儒斯特角入射，忽略吸收和多次反射。透射光的偏振度约为","options":["0.148","0.260","0.500","0.380"],"answer":"D","explain":"每片玻璃在布儒斯特角下只反射 s 分量，p 分量全部透射。\n单片 s 分量反射率 R_s = 0.148，透射率 1 − 0.148 = 0.852；5 片后 s 分量变为 0.852⁵ = 0.449，p 分量仍为 1。\n入射自然光两分量相等，故 P = (1 − 0.449)/(1 + 0.449) = 0.380。\n易错点：只算一片（0.148）；把 5 片损失线性相加得 0.260；忘记 p 分量无损失。"},{"id":"c18q025","type":"choice","difficulty":5,"tags":["布儒斯特角","折射光偏振度","菲涅耳公式"],"stem":"自然光以布儒斯特角入射到 n = 1.50 的玻璃表面，反射光完全偏振。折射光的偏振度约为","options":["0.0800","0.148","0.500","0.852"],"answer":"A","explain":"布儒斯特角 i₀ = 56.3°，折射角 r = 33.7°。\np 分量反射率为零，全部透射，T_p = 1；s 分量反射率 R_s = 0.148，透射率 T_s = 0.852。\n自然光两分量入射强度相等，故折射光 P = (T_p − T_s)/(T_p + T_s) = 0.148/1.852 = 0.0800。\n易错点：把 R_s 当折射光偏振度；以为折射光也完全偏振；把 T_s 当偏振度（0.852）。"},{"id":"c18q026","type":"choice","difficulty":5,"tags":["尼科耳棱镜","o光e光","全反射临界角"],"stem":"尼科耳棱镜用 Canada 树胶（n = 1.550）胶合两块方解石（n_o = 1.658，n_e = 1.486）。o 光在方解石-树胶界面上发生全反射的临界角约为；e 光是否也发生全反射","options":["69.2°，是","20.8°，否","69.2°，否","43.1°，是"],"answer":"C","explain":"o 光从方解石射向树胶，是由光密介质到光疏介质，临界角 sin C = n_胶/n_o = 1.550/1.658 = 0.9349，C = 69.2°。\ne 光在方解石中的折射率 n_e = 1.486，小于树胶的 1.550，是由光疏到光密，任何角度都不会全反射。\n因此 o 光被全反射到侧壁吸收，e 光透射出射，得到线偏振光。\n易错点：用 n_e 算 o 光的临界角（20.8° 是 arcsin(1.486/1.658) 的余角关系混淆）；以为两种光都全反射。"},{"id":"c18q027","type":"choice","difficulty":5,"tags":["偏振光干涉","正交偏振片","白光缺失波长"],"stem":"方解石晶片厚度 0.0500 mm，|n_o − n_e| = 0.00900，置于两块正交偏振片之间，晶片光轴与第一片透光轴成 45.0°。白光垂直入射，透射光中缺失（相消）的可见光波长约为","options":["589 nm","450 nm","650 nm","400 nm"],"answer":"B","explain":"正交偏振片间晶片的透射强度 I ∝ sin²(Δφ/2)，其中 Δφ = 2π|Δn|d/λ。\n相消条件为 Δφ = 2πm，即 |Δn|d = mλ，所以 λ = |Δn|d/m = 0.00900×5.00×10⁻⁵/m = 450 nm/m。\nm = 1 得 450 nm（蓝光），m = 2 得 225 nm（紫外，不可见）。\n易错点：把相消条件写成 Δφ = (2m+1)π 得 900 nm；忘记 m 只能取正整数；把厚度 0.0500 mm 当 0.00500 mm。"},{"id":"c18q028","type":"choice","difficulty":5,"tags":["液晶显示","对比度","偏振光调制"],"stem":"某液晶盒在亮态时使线偏振方向旋转 90.0°，透射率 0.950；暗态时不旋转，透射率仍为 0.950。两偏振片正交，第一片后的光强为 I₁，第二片对暗态漏光为入射到它的光强的 0.500%。亮态与暗态的透射光强之比（对比度）为","options":["95.0","380","47.5","200"],"answer":"D","explain":"亮态：振动方向被转 90.0°，恰好沿第二片透光轴，透射 I_亮 = 0.950I₁。\n暗态：不旋转，第二片只漏 0.500%，I_暗 = 0.950I₁×0.00500 = 0.00475I₁。\n对比度 = I_亮/I_暗 = 0.950/0.00475 = 200。\n注意液晶盒透射率在分子分母中约去，不影响对比度。易错点：把 0.950 也算进对比度；用 1 − 0.005 当暗态比例。"},{"id":"c18q029","type":"choice","difficulty":5,"tags":["半波片旋转","光强调制频率","马吕斯定律"],"stem":"自然光通过偏振片后，再通过一块绕光轴以角速度 ω 匀速旋转的半波片，最后通过固定检偏器。透射光强变化的角频率为","options":["4ω","2ω","ω","0"],"answer":"A","explain":"半波片使线偏振方向相对快轴作镜像：快轴转过 α 时，出射偏振方向转过 2α（不是 α）。\n快轴以 ω 转动，故出射偏振方向以 2ω 转动。检偏器固定，I ∝ cos²(2ωt − φ) = ½[1 + cos(4ωt − 2φ)]。\n所以光强变化的角频率是 4ω。\n易错点：把偏振方向的转速 2ω 当成光强频率；以为半波片不改变光强故频率为 0。"},{"id":"c18q030","type":"choice","difficulty":5,"tags":["波片色散","相位差","半波片"],"stem":"一块晶片对 589 nm 的光恰好是半波片。对 442 nm 的光，该晶片产生的相位差为","options":["2.09 rad","3.14 rad","4.19 rad","2.36 rad"],"answer":"C","explain":"对 589 nm 为半波片，说明 |Δn|d = 589/2 = 294.5 nm。\n对 442 nm：Δφ = 2π|Δn|d/λ = 2π×294.5/442 = 4.19 rad，约 1.33π。\n由于 4.19 rad \u003c 2π，不必再减 2π；它已不是半波片，相位差也不再是 π。\n易错点：以为同一晶片对任何波长都是半波片（3.14 rad）；把波长比取倒数；把 4.19 除以 2 得 2.09 rad。"},{"id":"c18q031","type":"choice","difficulty":5,"tags":["圆偏振光","自然光","偏振光检验"],"stem":"一束光由自然光与圆偏振光混合而成，总强度为 I。让这束光通过旋转的检偏器，透射光强恒为 0.500I；在检偏器前插入四分之一波片后，测得最大透射光强 0.700I、最小 0.300I。圆偏振光占总强度的比例为","options":["0.300","0.400","0.600","0.700"],"answer":"B","explain":"设自然光强 I_n、圆偏振光强 I_c，I_n + I_c = I。\n插入 λ/4 片后圆偏振光变为线偏振光，自然光不变，故 I_min = I_n/2 = 0.300I，得 I_n = 0.600I。\nI_max = I_n/2 + I_c = 0.700I，得 I_c = 0.400I，比例 0.400。\n易错点：把 I_min 当自然光强（0.300）；把 I_n 当答案（0.600）；把 I_max 当圆偏振光比例（0.700）。"},{"id":"c18q032","type":"choice","difficulty":5,"tags":["多层介质","布儒斯特角","两面平行玻璃板"],"stem":"自然光以布儒斯特角射到一块两面平行的玻璃板（n = 1.50）上，忽略吸收。从第二面射出的光中，平行于入射面的分量强度为 I_p，垂直于入射面的为 I_s，其偏振度 (I_p − I_s)/(I_p + I_s) 约为","options":["0.0800","0.275","0.500","0.159"],"answer":"D","explain":"第一面满足布儒斯特条件：p 分量全透，s 分量透射 0.852。\n光在板内与法线成 33.7°，射到第二面；而玻璃→空气的布儒斯特角为 arctan(1/1.50) = 33.7°，故第二面也恰好满足布儒斯特条件，s 分量再乘 0.852。\n总透射 T_p = 1，T_s = 0.852² = 0.726，P = (1 − 0.726)/(1 + 0.726) = 0.159。\n易错点：只算第一面得 0.0800；漏掉第二面的反射；以为出射光仍完全偏振。"},{"id":"c18q033","type":"choice","difficulty":5,"tags":["消光比","马吕斯定律","偏振片组"],"stem":"自然光通过两片偏振片，第一片固定，第二片可绕光轴转动。当两片透光轴夹角为 89.0° 时透射光强为 I_min，夹角为 0° 时为 I_max。该偏振片组的消光比 I_max/I_min 约为","options":["3.28×10³","1.64×10³","6.56×10³","1.00×10⁴"],"answer":"A","explain":"第一片后 I₁ = I₀/2。夹角 0° 时 I_max = I₁；夹角 89.0° 时 I_min = I₁cos²89.0°。\ncos89.0° = 0.01745，cos²89.0° = 3.046×10⁻⁴。\n消光比 = 1/cos²89.0° = 1/(3.046×10⁻⁴) = 3.28×10³。\n易错点：用 cos89° 不平方（57.3）；把第一片的 1/2 也算进比值（6.56×10³）；把小角度近似成 89° ≈ π/2 而认为严格为零。"},{"id":"c18q034","type":"choice","difficulty":5,"tags":["布儒斯特角","水-玻璃界面","折射角"],"stem":"水的折射率为 1.33，玻璃为 1.50。光从水射向玻璃，反射光完全偏振时的入射角和折射角分别为","options":["41.6°，48.4°","53.1°，36.9°","48.4°，41.6°","36.9°，53.1°"],"answer":"C","explain":"布儒斯特角满足 tan i₀ = n₂/n₁ = 1.50/1.33 = 1.128，得 i₀ = 48.4°。\n布儒斯特定律给出 i₀ + r = 90.0°，故折射角 r = 41.6°。\n注意此时光由光疏介质射向光密介质，不存在全反射问题，折射光一定存在。\n易错点：把折射率比颠倒得 41.6°；套用空气-水的 53.1°；把反射角与折射角混为一谈。"},{"id":"c18q035","type":"choice","difficulty":5,"tags":["半波片","正交偏振片","偏振光干涉"],"stem":"自然光强度 I₀ 通过偏振片后，再通过快轴与偏振片透光轴成 20.0° 的半波片，最后通过与第一片正交的检偏器。透射光强为","options":["0.117I₀","0.207I₀","0.413I₀","0.587I₀"],"answer":"B","explain":"过第一片后 I₁ = I₀/2。\n半波片使振动方向相对快轴镜像，出射振动方向相对入射方向转过 2×20.0° = 40.0°。\n正交偏振片间半波片的透射公式为 I = I₁sin²2α = (I₀/2)sin²40.0° = (I₀/2)(0.4132) = 0.207I₀。\n易错点：忘记第一片的 1/2（0.413I₀）；把角度只转 20°（0.117I₀）；用 cos² 得 0.587I₀。"},{"id":"c18q036","type":"calc","difficulty":4,"tags":["马吕斯定律","两偏振片","光强变化规律"],"stem":"自然光强度 I₀ 垂直入射到偏振片 P₁，透射光再通过偏振片 P₂，两片透光轴的夹角为 θ。(1) 求 P₂ 的透射光强 I(θ)；(2) 求 θ = 60.0° 时的 I；(3) 说明 θ 从 0° 连续转到 90° 的过程中透射光强的变化规律；(4) 求 I = I₀/8 时的 θ（取 0° \u003c θ \u003c 90°）。","options":[],"answer":"(1) I(θ) = (I₀/2)cos²θ；(2) I = I₀/8 = 0.125I₀；(3) 由 I₀/2 单调减小到 0，θ = 45.0° 时为 I₀/4；(4) θ = 60.0°","explain":"自然光通过第一片偏振片后成为线偏振光，强度减半：I₁ = I₀/2。\n线偏振光通过第二片时服从马吕斯定律：I(θ) = I₁cos²θ = (I₀/2)cos²θ。\nθ = 60.0° 时 cos²60.0° = 0.250，故 I = (I₀/2)(0.250) = I₀/8。\n在 0° 到 90° 内 cos²θ 单调减小，所以光强由 I₀/2 单调降到 0，中途 θ = 45.0° 处为 I₀/4。\n令 (I₀/2)cos²θ = I₀/8，得 cos²θ = 1/4，即 cosθ = 1/2，θ = 60.0°。\n易错点：把自然光直接代入 cos²θ（会得 I₀/4 而不是 I₀/8）；把 cos² 的变化误当线性变化。"},{"id":"c18q037","type":"calc","difficulty":5,"tags":["三偏振片","极值","三角恒等变换"],"stem":"自然光强度 I₀ 依次通过三个偏振片 P₁、P₂、P₃。P₁ 与 P₃ 的透光轴正交，P₂ 与 P₁ 的夹角为 θ。(1) 导出出射光强 I(θ)；(2) 求 I 的最大值及对应的 θ；(3) 若 I = I₀/32，求 θ（取 0° \u003c θ \u003c 90°）。","options":[],"answer":"(1) I(θ) = (I₀/8)sin²2θ；(2) I_max = I₀/8，θ = 45.0°；(3) θ = 15.0° 或 75.0°","explain":"过 P₁ 后 I₁ = I₀/2，振动方向沿 P₁。P₂ 与 P₁ 夹角 θ，过 P₂ 后 I₂ = I₁cos²θ。\nP₃ 与 P₂ 的夹角为 90.0° − θ，故 I = I₂cos²(90.0° − θ) = (I₀/2)cos²θsin²θ。\n用 sin2θ = 2sinθcosθ 得 I(θ) = (I₀/8)sin²2θ。\nsin²2θ 的最大值为 1，在 2θ = 90.0° 即 θ = 45.0° 处取得，I_max = I₀/8。\n令 (I₀/8)sin²2θ = I₀/32，得 sin²2θ = 1/4，sin2θ = 1/2，故 2θ = 30.0° 或 150.0°，即 θ = 15.0° 或 75.0°。\n关键：正交片间插入第三片后光强一般不为零，且存在最佳取向。"},{"id":"c18q038","type":"calc","difficulty":4,"tags":["布儒斯特角","反射光偏振","折射光偏振"],"stem":"自然光从空气以布儒斯特角入射到水面（n = 1.33）。(1) 求入射角和折射角；(2) 求反射光与折射光的夹角；(3) 说明反射光和折射光各自的偏振状态。","options":[],"answer":"(1) i₀ = 53.1°，r = 36.9°；(2) 夹角为 90.0°；(3) 反射光为垂直于入射面的线偏振光，折射光为部分偏振光且平行于入射面的分量占优","explain":"布儒斯特角满足 tan i₀ = n₂/n₁ = 1.33，故 i₀ = 53.1°。\n由布儒斯特定律 i₀ + r = 90.0°，得折射角 r = 36.9°。\n反射光线与折射光线分别在法线两侧，与法线夹角之和为 90.0°，故两者互相垂直。\n反射光中平行于入射面的 p 分量反射率为零，只剩垂直入射面的 s 分量，所以是线偏振光。\n折射光包含全部 p 分量和大部分 s 分量，是部分偏振光，p 分量占优（对 n = 1.33 其偏振度约为 0.040）。\n易错点：把 i₀ 与 r 相加当成 180°；认为折射光也是完全偏振光。"},{"id":"c18q039","type":"calc","difficulty":4,"tags":["布儒斯特角","折射率","临界角"],"stem":"自然光以 58.0° 入射到某介质表面，反射光为完全偏振光。(1) 求该介质的折射率；(2) 求折射角；(3) 求光从该介质射向空气时的临界角；(4) 若入射角改为 45.0°，反射光是否仍完全偏振，说明理由。","options":[],"answer":"(1) n = 1.60；(2) r = 32.0°；(3) C = 38.7°；(4) 不是，只有布儒斯特角入射时反射光才完全偏振","explain":"反射光完全偏振时入射角即布儒斯特角：tan i₀ = n₂/n₁ = n，故 n = tan58.0° = 1.600。\n由 i₀ + r = 90.0°，得 r = 32.0°。\n临界角满足 sin C = 1/n = 0.6250，故 C = 38.7°。\n45.0° 不等于布儒斯特角 58.0°，此时 p 分量反射率不为零，反射光中 s、p 两种分量并存，只是 s 分量较强，因而是部分偏振光。\n易错点：把 tan i₀ 当 sin i₀；把临界角算成 arcsin(1.60)（无意义）；认为任何角度反射光都完全偏振。"},{"id":"c18q040","type":"calc","difficulty":5,"tags":["多层介质","布儒斯特角","平行板折射"],"stem":"自然光以 56.3° 入射到一块两面平行的玻璃板（n = 1.50）的上表面，该角恰为空气-玻璃的布儒斯特角。玻璃板下表面与水面（n = 1.33）接触。(1) 求玻璃中的折射角；(2) 求光在玻璃-水界面上的入射角；(3) 判断该界面是否满足布儒斯特条件，并求玻璃-水界面的布儒斯特角；(4) 说明从下表面反射的光的偏振状态。","options":[],"answer":"(1) r = 33.7°；(2) 界面入射角为 33.7°；(3) 不满足，玻璃-水界面的布儒斯特角为 41.6°；(4) 下表面反射光为部分偏振光，s 分量占优，不是完全偏振光","explain":"上表面：sin r = sin56.3°/1.50 = 0.5547，得 r = 33.7°。\n两面平行，板内光线方向不变，故在玻璃-水界面上的入射角仍为 33.7°。\n玻璃-水界面的布儒斯特角满足 tan i₀′ = n_水/n_玻璃 = 1.33/1.50 = 0.8867，得 i₀′ = 41.6°。\n33.7° ≠ 41.6°，故下表面不满足布儒斯特条件，p 分量也有反射，反射光为部分偏振光（s 分量较强）。\n对比：同一束光在上表面反射是完全偏振的，到第二面就不再完全偏振，说明布儒斯特条件只对特定界面成立。\n易错点：以为一块平行板两个表面都同时满足布儒斯特条件；把折射率比颠倒得 48.4°。"},{"id":"c18q041","type":"calc","difficulty":5,"tags":["波片","相位差","级次"],"stem":"石英的 |n_o − n_e| = 0.00910，对波长 589.3 nm 的光。(1) 求四分之一波片和半波片的最小厚度；(2) 厚度 0.100 mm 的晶片产生的相位差（用 rad 表示，并化成 0 到 2π 的主值及对应的角度）；(3) 该晶片相当于多少级波片（即光程差是波长的多少倍）。","options":[],"answer":"(1) d_λ/4 = 16.2 μm，d_λ/2 = 32.4 μm；(2) Δφ = 9.70 rad = 556°，主值 196°（3.42 rad）；(3) 光程差为 1.544λ，不是整数级波片","explain":"四分之一波片要求 |Δn|d = λ/4，故 d = 589.3×10⁻⁹/(4×0.00910) = 1.62×10⁻⁵ m = 16.2 μm；半波片厚度加倍，为 32.4 μm。\n厚度 0.100 mm 时，光程差 Δ = 0.00910×1.00×10⁻⁴ = 9.10×10⁻⁷ m。\nΔ/λ = 9.10×10⁻⁷/5.893×10⁻⁷ = 1.544，故 Δφ = 2π×1.544 = 9.70 rad，即 556°。\n减去 360° 得主值 196°（3.42 rad），所以它对 589.3 nm 既不是 λ/4 片也不是 λ/2 片。\n易错点：相位差忘记取主值；把 0.100 mm 当 0.0100 mm（得 1.94 rad）；把「级」误认为相位差除以 π。"},{"id":"c18q042","type":"calc","difficulty":5,"tags":["偏振光干涉","双折射晶片","正交偏振片"],"stem":"自然光强度 I₀ 通过偏振片 P₁ 后，再通过厚度 d、双折射率 |n_o − n_e| = Δn 的晶片，最后通过透光轴与 P₁ 正交的 P₂。晶片快轴与 P₁ 透光轴的夹角为 α。(1) 导出透射光强 I 的表达式；(2) 取 α = 45.0°、相位差 Δφ = π/2，求 I；(3) 取 α = 45.0°，求使 I 第一次达到最大的厚度 d（用 λ、Δn 表示）；(4) 说明 α = 0° 或 90° 时为什么看不到干涉色。","options":[],"answer":"(1) I = (I₀/2)sin²2α·sin²(Δφ/2)；(2) I = I₀/4；(3) d = λ/(2Δn)；(4) α = 0° 或 90° 时 sin²2α = 0，两正交分量不耦合，P₂ 始终消光，无干涉色","explain":"过 P₁ 后 I₁ = I₀/2，线偏振光沿 P₁ 振动。\n进入晶片后分解为沿快轴、慢轴的两个分量，振幅分别为 A cosα 与 A sinα，经过晶片后相位差为 Δφ = 2πΔn d/λ。\n两分量在 P₂ 方向上的投影同向叠加，干涉项正比于 sin2α，最终 I = I₁sin²2α·sin²(Δφ/2) = (I₀/2)sin²2α·sin²(Δφ/2)。\nα = 45.0°、Δφ = π/2 时，I = (I₀/2)(1)(1/2) = I₀/4。\n第一次最大要求 sin²(Δφ/2) = 1，即 Δφ = π，故 Δn d = λ/2，d = λ/(2Δn)。\nα = 0° 或 90° 时晶片主轴与偏振方向重合，光通过晶片后偏振方向不变，被正交的 P₂ 完全挡住，故无干涉色。"},{"id":"c18q043","type":"calc","difficulty":5,"tags":["菲涅耳公式","反射光偏振度","入射角关系"],"stem":"自然光以 60.0° 入射到 n = 1.50 的玻璃表面。(1) 求折射角；(2) 用菲涅耳公式求 s 分量和 p 分量的反射率 R_s、R_p；(3) 求反射光的偏振度；(4) 与 45.0° 入射（P = 0.832）及布儒斯特角入射比较，说明反射光偏振度随入射角的变化趋势。","options":[],"answer":"(1) r = 35.3°；(2) R_s = 0.177，R_p = 1.80×10⁻³；(3) P = 0.980；(4) 从 0° 增大时 P 先增大，在布儒斯特角 56.3° 达到 1，之后又减小","explain":"由 sin r = sin60.0°/1.50 = 0.5774，得 r = 35.3°，cos r = 0.8165。\n菲涅耳系数：r_s = (cos i − ncos r)/(cos i + ncos r) = (0.500 − 1.225)/(0.500 + 1.225) = −0.420，R_s = 0.177。\nr_p = (ncos i − cos r)/(ncos i + cos r) = (0.750 − 0.8165)/(0.750 + 0.8165) = −0.0425，R_p = 1.80×10⁻³。\n自然光两分量各占一半，故 P = (R_s − R_p)/(R_s + R_p) = 0.1748/0.1784 = 0.980。\n趋势：正入射时 P = 0；随入射角增大 P 增大，在布儒斯特角 56.3° 时 R_p = 0、P = 1；超过布儒斯特角后 R_p 重新增大，P 又减小。\n易错点：用振幅系数代替反射率；把 60.0° 的结果当成布儒斯特角（P 应严格为 1）。"},{"id":"c18q044","type":"calc","difficulty":4,"tags":["部分偏振光","偏振度","分量分解"],"stem":"部分偏振光垂直入射到检偏器，旋转检偏器测得最大透射光强 9.00 W/m²，最小 1.00 W/m²。(1) 求偏振度；(2) 求其中自然光分量和线偏振分量的强度；(3) 求检偏器透光轴与最大透射方向成 30.0° 和 45.0° 时的透射光强。","options":[],"answer":"(1) P = 0.800；(2) 自然光分量 2.00 W/m²，线偏振分量 8.00 W/m²；(3) 30.0° 时 7.00 W/m²，45.0° 时 5.00 W/m²","explain":"部分偏振光分解为自然光 I_n 与线偏振光 I_p：I(θ) = I_n/2 + I_pcos²θ。\nI_min = I_n/2 = 1.00 W/m²，得 I_n = 2.00 W/m²；I_max = 1.00 + I_p = 9.00 W/m²，得 I_p = 8.00 W/m²。\n偏振度 P = I_p/(I_n + I_p) = 8.00/10.0 = 0.800（也等于 (I_max − I_min)/(I_max + I_min)）。\n30.0° 时 I = 1.00 + 8.00×0.750 = 7.00 W/m²；45.0° 时 I = 1.00 + 8.00×0.500 = 5.00 W/m²。\n易错点：把 I_min 当自然光总强度（应为其一半）；P 用 I_p/I_max = 8/9；45° 时把自然光分量也乘 cos²。"},{"id":"c18q045","type":"calc","difficulty":5,"tags":["偏振光合成","椭圆偏振","相位差"],"stem":"两束同频率、同振幅 E₀ 的线偏振光沿 z 轴传播，振动方向分别沿 x、y 轴，相位差为 δ：E_x = E₀cos(ωt)，E_y = E₀cos(ωt + δ)。(1) 分别说明 δ = 0 和 δ = π 时的偏振态及振动方向；(2) 说明 δ = π/2 时的偏振态，并说明如何由 δ 的符号判断旋向；(3) 写出 δ = π/4 时的轨迹方程，并指出椭圆主轴的方向。","options":[],"answer":"(1) δ = 0 时为线偏振，沿 y = x（与 x 轴成 45°）；δ = π 时为线偏振，沿 y = −x（与 x 轴成 −45°）；(2) δ = π/2 时为圆偏振，δ 由 +π/2 变为 −π/2 时旋向反转；(3) E_x² + E_y² − √2E_xE_y = E₀²/2，椭圆长轴沿 y = x 方向","explain":"δ = 0 时 E_y = E_x，电矢量始终沿 y = x，端点作直线运动，是线偏振光。\nδ = π 时 E_y = −E_x，电矢量沿 y = −x，仍是线偏振光，但振动方向转了 90°。\nδ = π/2 时 E_x = E₀cosωt，E_y = −E₀sinωt，满足 E_x² + E_y² = E₀²，端点作圆周运动，是圆偏振光；δ 取 +π/2 或 −π/2 对应两种相反的旋转方向。\nδ = π/4 时令 X = E_x/E₀、Y = E_y/E₀，由 Y = (X − sinωt)/√2 消去 sinωt，利用 X² + sin²ωt = 1，得 X² + Y² − √2XY = 1/2，即 E_x² + E_y² − √2E_xE_y = E₀²/2。\n这是主轴沿 y = x 的椭圆：长半轴 E₀cos22.5° = 0.924E₀，短半轴 E₀sin22.5° = 0.383E₀。\n易错点：把 δ = π/2 当成线偏振；把椭圆方程写成标准形式 x²/a² + y²/b² = 1（未转动主轴）。"},{"id":"c18q046","type":"calc","difficulty":4,"tags":["旋光性","比旋光率","浓度测量"],"stem":"某旋光性溶液对钠黄光的比旋光率为 [α] = 66.5°·mL/(dm·g)。(1) 浓度 0.150 g/mL、管长 1.50 dm 时，振动面转过多少度；(2) 若测得旋转角 20.0°、管长 2.00 dm，求溶液浓度；(3) 若把溶液换成等长的纯水（无旋光性），偏振方向如何变化。","options":[],"answer":"(1) φ = 15.0°；(2) c = 0.150 g/mL；(3) 偏振方向不旋转，转角为 0°","explain":"旋光角公式为 φ = [α]cl，c 为质量浓度，l 为光在溶液中的路程。\n(1) φ = 66.5×0.150×1.50 = 15.0°。\n(2) 由 c = φ/([α]l) = 20.0/(66.5×2.00) = 0.150 g/mL。\n(3) 纯水不是旋光物质，[α] = 0，线偏振光通过后振动方向不变。\n易错点：把管长单位取 cm 而未换算；把浓度单位当成 g/L；认为旋光角与浓度无关。"},{"id":"c18q047","type":"calc","difficulty":5,"tags":["瑞利散射","大气吸收","日落"],"stem":"大气对波长 λ 的光的散射系数与 λ⁻⁴ 成正比，对 450 nm 蓝光的散射系数为 k_B = 2.50×10⁻⁵ m⁻¹。(1) 求 650 nm 红光的散射系数；(2) 设天顶方向大气厚度为 8.00 km，求蓝光、红光的天顶透射率；(3) 日落时阳光路径为天顶的 12.0 倍，求日落时红光与蓝光的透射强度之比；(4) 解释日落呈红色的原因。","options":[],"answer":"(1) k_R = 5.74×10⁻⁶ m⁻¹；(2) T_B = 0.819，T_R = 0.955；(3) I_R/I_B = 6.35；(4) 蓝光散射强，长路径中被大量散射出视线，透射光中红光占优","explain":"由 k ∝ λ⁻⁴，k_R = k_B(450/650)⁴ = 2.50×10⁻⁵/4.353 = 5.74×10⁻⁶ m⁻¹。\n天顶：τ_B = k_BL = 2.50×10⁻⁵×8.00×10³ = 0.200，T_B = e^(−0.200) = 0.819；\nτ_R = 5.74×10⁻⁶×8.00×10³ = 0.0459，T_R = e^(−0.0459) = 0.955。\n日落：路径放大 12.0 倍，τ_B = 2.40，τ_R = 0.551，故 T_B = e^(−2.40) = 0.0907，T_R = e^(−0.551) = 0.576。\n比值 I_R/I_B = 0.576/0.0907 = 6.35，红光相对蓝光明显增强，所以落日偏红。\n易错点：把 k ∝ λ⁻⁴ 写成 λ⁴；忘记路径放大；把透射率当 1 − τ 线性计算。"},{"id":"c18q048","type":"calc","difficulty":5,"tags":["尼科耳棱镜","双折射","临界角"],"stem":"尼科耳棱镜由方解石（n_o = 1.658，n_e = 1.486）和 Canada 树胶（n = 1.550）组成。(1) 求 o 光在方解石-树胶界面上发生全反射的临界角 C（写出表达式并给出数值）；(2) 判断 e 光能否在该界面发生全反射并说明理由；(3) 若棱镜切割使光在胶合层上的入射角约为 70.0°，出射光是什么偏振态；(4) 说明尼科耳棱镜为什么能得到线偏振光。","options":[],"answer":"(1) C = arcsin(n_胶/n_o) = arcsin(1.550/1.658) = 69.2°；(2) e 光不能，因为 n_e = 1.486 \u003c n_胶 = 1.550，光由光疏射向光密；(3) 出射光为线偏振光，振动方向在主截面内；(4) o 光被全反射到侧壁吸收，e 光透射","explain":"o 光从方解石射向树胶，属于光密到光疏，临界角满足 sin C = n_胶/n_o = 1.550/1.658 = 0.9349，C = 69.2°。\ne 光在方解石中的折射率 n_e = 1.486，小于树胶的 1.550，是从光疏介质射向光密介质，折射角总小于入射角，不可能发生全反射。\n入射角 70.0° > 69.2°，o 光发生全反射，被棱镜侧面的吸收层吸收；e 光透射。\n透射的 e 光振动方向在主截面内，故出射为线偏振光。\n易错点：用 n_e 计算 o 光的临界角；误认为两种光都全反射；把「主截面」与「主平面」混淆（后者由光轴和光线共同决定）。"},{"id":"c18q049","type":"calc","difficulty":5,"tags":["液晶显示","偏振调制","对比度"],"stem":"液晶显示器的一个像素：非偏振背光强度 I₀，依次通过偏振片 P₁、液晶盒、偏振片 P₂，P₁ 与 P₂ 正交。液晶盒加电压时使线偏振方向旋转 90.0°，透射率 0.950；不加电压时不旋转，透射率仍为 0.950。P₂ 对与其正交的线偏振光漏光率为 0.500%。(1) 求亮态透射光强；(2) 求暗态透射光强；(3) 求对比度；(4) 若把 P₂ 旋转 90° 使其与 P₁ 平行，亮态和暗态如何变化。","options":[],"answer":"(1) 亮态 I = 0.475I₀；(2) 暗态 I = 2.38×10⁻³I₀；(3) 对比度 = 200；(4) 亮暗反转：不加电压时为亮态，加电压时为暗态","explain":"背光过 P₁ 后 I₁ = I₀/2。\n亮态：液晶盒把振动方向转 90.0°，透过 0.950，得 I = 0.475I₀，沿 P₂ 透光轴全部通过。\n暗态：液晶不旋转，P₂ 只漏 0.500%，I = 0.475I₀×0.00500 = 2.38×10⁻³I₀。\n对比度 = 0.475/2.38×10⁻³ = 200。\n若 P₂ 与 P₁ 平行：不加电压时振动方向不变，直接通过，为亮态；加电压后转过 90.0°，被 P₂ 挡住，为暗态，亮暗正好反转。\n易错点：把背光 I₀ 直接乘 0.950；漏掉第一片偏振片的 1/2；把液晶盒透射率也算进对比度（会被约去）。"},{"id":"c18q050","type":"calc","difficulty":5,"tags":["偏振光检验","圆偏振光","部分偏振光"],"stem":"四束强度均为 I₀ 的光，用旋转检偏器观察：甲透射光强不随角度变化；乙每转 90° 出现一次消光；丙最大 0.750I₀、最小 0.250I₀；丁最大 0.900I₀、最小 0.100I₀。在检偏器前插入一块快轴与检偏器最大透射方向成 45.0° 的四分之一波片后：甲仍不随角度变化，乙仍每 90° 消光一次，丙变为每 90° 消光一次，丁仍无消光且极大仍为 0.900I₀。(1) 分别判断四束光的偏振态；(2) 求丁的偏振度；(3) 说明为什么单靠旋转检偏器不能区分自然光与圆偏振光。","options":[],"answer":"(1) 甲为自然光，乙为线偏振光，丙为椭圆偏振光（两正交分量相位差 π/2），丁为部分偏振光（自然光与线偏振光的混合）；(2) P_丁 = 0.800；(3) 自然光和圆偏振光通过旋转检偏器时透射光强都不变，必须借助 λ/4 片：圆偏振光经 λ/4 片变线偏振后会出现消光，自然光仍不变","explain":"甲、乙的判断直接来自检偏器旋转：光强不变说明非偏振或圆偏振；每 90° 消光说明是线偏振光。\n丙的 I_max + I_min = I₀，说明它是完全偏振的椭圆偏振光（部分偏振光的总强度也等于 I_max + I_min，但需结合插入波片后的行为）。插入 λ/4 片后丙能消光，说明它的两正交分量相位差为 π/2，波片再补 π/2 后合成为线偏振。\n丁的 I_max + I_min = I₀，但插入 λ/4 片后仍无消光，说明它含非偏振成分，是部分偏振光；P = (0.900 − 0.100)/(0.900 + 0.100) = 0.800。\n自然光与圆偏振光在旋转检偏器下都表现为光强不变：自然光是非相干的两正交分量，圆偏振光的两分量振幅相等且相位差 π/2。\n区分方法：插入 λ/4 片后，圆偏振光变为线偏振光，旋转检偏器会出现消光；自然光仍不随角度变化。\n易错点：把「光强不变」直接判为自然光；把丙误判为部分偏振光；忘记丁的 I_max + I_min 也等于总强度。"}]},{"chapter":19,"chapterName":"狭义相对论","questions":[{"id":"c19q001","type":"choice","difficulty":3,"tags":["时间膨胀","固有时","μ子寿命"],"stem":"μ子的固有寿命为 2.20 μs。实验室中测得某 μ子从产生到衰变经历的时间为 11.0 μs。该 μ子相对实验室的速率及实验室中测得的飞行距离约为","options":["0.200c，6.60×10² m","0.980c，3.23×10³ m","0.980c，6.60×10² m","0.960c，3.17×10³ m"],"answer":"B","explain":"γ = t/t₀ = 11.0/2.20 = 5.00，β = √(1 − 1/γ²) = √0.960 = 0.980。飞行距离 d = βct = 0.980×3.00×10⁸×11.0×10⁻⁶ = 3.23×10³ m。易错点：0.200c 把 1/γ 当 β；6.60×10² m 用固有寿命算距离，漏掉时间膨胀；0.960c 把 γ 与 β 的换算弄反。"},{"id":"c19q002","type":"choice","difficulty":3,"tags":["长度收缩","固有长度"],"stem":"火箭以 0.800c 相对地面匀速飞行，地面观测者测得火箭长度为 120 m。火箭的固有长度为","options":["72.0 m","120 m","200 m","333 m"],"answer":"C","explain":"γ = 1/√(1 − 0.800²) = 1.667，由 L = L₀/γ 得 L₀ = Lγ = 120×1.667 = 200 m。易错点：72.0 m 又除了一次 γ（双重收缩）；120 m 把地面测长当固有长度；333 m 乘了 γ²。"},{"id":"c19q003","type":"choice","difficulty":3,"tags":["速度合成","相对论速度"],"stem":"两艘飞船在同一直线上相向飞行，地面观测者测得两者的速率均为 0.600c。一船观测另一船的速率为","options":["1.20c","0.882c","0.600c","0.800c"],"answer":"B","explain":"取一船为 S′ 系，另一船速度为 u′ = 0.600c，S′ 相对地面 v = 0.600c，u = (u′ + v)/(1 + u′v/c²) = 1.20c/(1 + 0.360) = 0.882c。易错点：1.20c 是伽利略叠加；0.800c 把分母写成 1.5；0.600c 漏掉速度合成。"},{"id":"c19q004","type":"choice","difficulty":3,"tags":["光速不变","相对速度","距离增长率"],"stem":"飞船以 0.600c 沿 x 轴飞行，船头向前发出一束激光。地面观测者测得该激光相对飞船的速率，以及激光与飞船之间距离的增长率分别为","options":["c，0.400c","c，c","1.60c，0.400c","0.400c，0.400c"],"answer":"A","explain":"光速不变原理：任何惯性系中真空中光速均为 c，故激光相对飞船的速率仍是 c。距离增长率等于 c − v = 0.400c，它描述同一参考系中两个位置之差的变化率，不是相对速度。易错点：1.60c 用伽利略叠加；0.400c 把距离增长率误当光速。"},{"id":"c19q005","type":"choice","difficulty":3,"tags":["质能方程","质量亏损","能量换算"],"stem":"1.00 kg 物质若全部转化为能量，供 1.00×10⁵ 户家庭使用，每户每年耗电 3.00×10³ kW·h。这些能量可使用约","options":["8.33×10⁶ 年","8.33×10⁴ 年","83.3 年","3.00×10⁸ 年"],"answer":"C","explain":"E = mc² = 1.00×9.00×10¹⁶ = 9.00×10¹⁶ J。每户每年耗能 3.00×10³×3.60×10⁶ = 1.08×10¹⁰ J。总户年数 9.00×10¹⁶/1.08×10¹⁰ = 8.33×10⁶，再除以 1.00×10⁵ 户得 83.3 年。易错点：8.33×10⁶ 忘了除以户数；3.00×10⁸ 把 kW·h 直接当 J，漏乘 3.60×10⁶。"},{"id":"c19q006","type":"choice","difficulty":3,"tags":["固有时","时间膨胀","星际航行"],"stem":"宇航员乘飞船以 0.800c 飞往 4.00 光年外的恒星，距离由地球系测得。飞船上的钟走过的时间为","options":["5.00 年","3.00 年","2.40 年","6.67 年"],"answer":"B","explain":"地球系中飞行时间 t = 4.00/0.800 = 5.00 年；飞船固有时 τ = t/γ = 5.00/1.667 = 3.00 年。也可在飞船系中用收缩后距离 4.00/γ = 2.40 ly 除以 0.800c，同样得 3.00 年。易错点：2.40 年是距离不是时间；6.67 年把 γ 乘上去；5.00 年忽略钟慢。"},{"id":"c19q007","type":"choice","difficulty":5,"tags":["洛伦兹变换","时空坐标","同时性"],"stem":"惯性系 S′ 以 0.600c 沿 x 轴正方向相对 S 运动，t = t′ = 0 时两系原点重合。S 系中事件 P 的坐标为 x = 1.50×10⁸ m、t = 1.00 s。S′ 系中 P 的时空坐标为","options":["x′ = −3.75×10⁷ m，t′ = 0.875 s","x′ = 2.63×10⁸ m，t′ = 1.25 s","x′ = −3.75×10⁷ m，t′ = 1.25 s","x′ = 1.88×10⁸ m，t′ = 0.500 s"],"answer":"A","explain":"γ = 1.25，v = 1.80×10⁸ m/s。x′ = γ(x − vt) = 1.25(1.50×10⁸ − 1.80×10⁸) = −3.75×10⁷ m；t′ = γ(t − vx/c²) = 1.25(1.00 − 0.600) = 0.875 s。易错点：2.63×10⁸ m 把减号写成加号；1.25 s 漏掉 t′ 中的 vx/c² 项；1.88×10⁸ m 用 1/γ 代替 γ。"},{"id":"c19q008","type":"choice","difficulty":5,"tags":["同时性的相对性","洛伦兹变换","时序"],"stem":"在 S 系中 A、B 两事件同时发生，两事件的空间间隔为 6.00×10⁸ m，B 的 x 坐标较大。S′ 系以 0.800c 沿 x 轴正方向相对 S 运动。在 S′ 系中","options":["两事件仍同时发生","A 比 B 早 2.67 s","B 比 A 早 2.67 s","B 比 A 早 1.60 s"],"answer":"C","explain":"Δt = 0，Δt′ = γ(Δt − vΔx/c²) = −γvΔx/c² = −1.667×0.800×6.00×10⁸/(3.00×10⁸)² = −2.67 s。负号表示 x 较大的 B 事件在 S′ 中先发生。易错点：1.60 s 漏乘 γ；选「仍同时」是没有考虑同时性相对性；A 比 B 早是把负号理解反了。"},{"id":"c19q009","type":"choice","difficulty":5,"tags":["因果律","类空间隔","时序颠倒"],"stem":"S 系中事件 A 先于 B 发生，Δt = t_B − t_A = 1.00 μs，Δx = x_B − x_A = 600 m。若要使 B 在某惯性系中先于 A 发生，该系相对 S 的速率必须满足","options":["v > 0.500c","v > 0.200c","v > 0.800c","不存在这样的惯性系"],"answer":"A","explain":"Δt′ = γ(Δt − vΔx/c²)，令 Δt′ \u003c 0 得 v > c²Δt/Δx = 9.00×10¹⁶×1.00×10⁻⁶/600 = 1.50×10⁸ m/s = 0.500c。又 cΔt = 300 m \u003c Δx = 600 m，两事件为类空间隔，本来就不可能有因果联系，时序可以颠倒。易错点：0.200c 把 Δx/(cΔt) 的倒数算错；选「不存在」是把类空当成了类时。"},{"id":"c19q010","type":"choice","difficulty":4,"tags":["速度合成","同向运动"],"stem":"飞船以 0.800c 相对地球飞行，飞船向前发射一枚探测器，探测器相对飞船的速率为 0.600c。地面测得探测器的速率为","options":["1.40c","0.946c","0.800c","0.988c"],"answer":"B","explain":"u = (u′ + v)/(1 + u′v/c²) = (0.600 + 0.800)/(1 + 0.480) = 1.40/1.480 = 0.946c。易错点：1.40c 是伽利略叠加；0.800c 漏加探测器速度；0.988c 分母少算了一项。"},{"id":"c19q011","type":"choice","difficulty":5,"tags":["横向速度合成","速度变换","运动方向"],"stem":"S′ 系以 0.800c 沿 x 轴相对 S 运动。在 S′ 系中一粒子沿 y′ 轴以 0.600c 运动。S 系中该粒子的速率及运动方向与 x 轴的夹角为","options":["0.600c，90.0°","1.00c，36.9°","0.877c，24.2°","0.800c，0°"],"answer":"C","explain":"u_x = v = 0.800c；u_y = u′_y/γ = 0.600c/1.667 = 0.360c；u = √(0.800² + 0.360²)c = 0.877c；tanθ = 0.360/0.800 = 0.450，θ = 24.2°。易错点：1.00c 是伽利略叠加；90° 忘记纵向速度不变；0° 把粒子误当随参考系一起运动。"},{"id":"c19q012","type":"choice","difficulty":5,"tags":["相对论动量","质速关系","动能"],"stem":"质子静能为 938 MeV，动能为 1.50 GeV。其动量约为","options":["1.50 GeV/c","1.17 GeV/c","2.25 GeV/c","2.44 GeV/c"],"answer":"C","explain":"总能量 E = 938 + 1500 = 2438 MeV，γ = 2.599，β = √(1 − 1/γ²) = 0.923。p = γmβc = 2.599×0.938×0.923 = 2.25 GeV/c。易错点：1.17 GeV/c 用 E = K 代入 √(E² − m²c⁴)；2.44 GeV/c 漏乘 β；1.50 GeV/c 直接把动能当动量。"},{"id":"c19q013","type":"choice","difficulty":4,"tags":["能量动量关系","E² = (pc)² + (m₀c²)²","速率"],"stem":"电子总能量为 2.00 MeV，静能 0.511 MeV。其动量（以 MeV/c 为单位）和速率分别为","options":["1.49，0.967c","1.93，0.733c","1.93，0.967c","2.00，1.00c"],"answer":"C","explain":"pc = √(E² − m²c⁴) = √(2.00² − 0.511²) = 1.93 MeV，故 p = 1.93 MeV/c；β = pc/E = 1.93/2.00 = 0.967。易错点：1.49 是动能；0.733 用 K/E 当 β；1.00c 把电子当光子。"},{"id":"c19q014","type":"choice","difficulty":5,"tags":["电场加速","相对论动能","速率上限"],"stem":"电子从静止经 2.00 MV 的电势差加速。忽略辐射损失，其速率和动量约为","options":["0.979c，2.46 MeV/c","0.998c，2.51 MeV/c","0.979c，2.00 MeV/c","0.941c，2.46 MeV/c"],"answer":"A","explain":"动能 K = eV = 2.00 MeV，总能量 E = 2.00 + 0.511 = 2.511 MeV，γ = 4.914，β = √(1 − 1/γ²) = 0.979。pc = √(E² − m²c⁴) = √(2.511² − 0.511²) = 2.46 MeV。易错点：0.998c 是 10 MV 的结果；2.00 MeV/c 漏掉静能；0.941c 是 1 MV 的结果。"},{"id":"c19q015","type":"choice","difficulty":4,"tags":["质量亏损","结合能","核物理"],"stem":"氘核由质子和中子结合而成。已知质子质量 1.007276 u、中子质量 1.008665 u、氘核质量 2.013553 u，1 u 对应 931.5 MeV。氘核的结合能为","options":["1.11 MeV","2.22 MeV","4.45 MeV","0.00239 MeV"],"answer":"B","explain":"Δm = (1.007276 + 1.008665) − 2.013553 = 0.002388 u；E_b = 0.002388×931.5 = 2.22 MeV。易错点：1.11 MeV 只算了一个核子的质量差；4.45 MeV 把 Δm 乘了 2；0.00239 MeV 忘记乘 931.5。"},{"id":"c19q016","type":"choice","difficulty":4,"tags":["相对论多普勒效应","红移","退行速度"],"stem":"某星系光谱中 Hα 线的静止波长为 656.3 nm，地面观测到的波长为 689.1 nm。该星系的退行速率约为","options":["1.50×10⁷ m/s","4.88×10⁷ m/s","1.46×10⁸ m/s","1.46×10⁷ m/s"],"answer":"D","explain":"λ/λ₀ = 1.050 = √((1 + β)/(1 − β))，解得 β = (1.050² − 1)/(1.050² + 1) = 0.0487，v = 0.0487×3.00×10⁸ = 1.46×10⁷ m/s。易错点：1.50×10⁷ m/s 直接令 β = Δλ/λ = 0.050；4.88×10⁷ m/s 解方程时把分子分母弄反；1.46×10⁸ m/s 小数点错一位。"},{"id":"c19q017","type":"choice","difficulty":4,"tags":["不变间隔","类时间隔","固有时"],"stem":"S 系中两事件的时间间隔 Δt = 2.00 μs，空间间隔 Δx = 300 m。两事件之间的固有时为","options":["2.00 μs","1.00 μs","1.73 μs","不存在固有时"],"answer":"C","explain":"cΔt = 600 m > Δx = 300 m，属类时间隔。Δs² = c²Δt² − Δx² = 600² − 300² = 2.70×10⁵ m²，Δτ = √(Δs²)/c = 1.73×10⁻⁶ s。易错点：2.00 μs 是坐标时；1.00 μs 把 Δx/c 当固有时；只有类空间隔才不存在固有时。"},{"id":"c19q018","type":"choice","difficulty":5,"tags":["回旋半径","洛伦兹力","γ修正"],"stem":"动能为 2.00 MeV 的电子垂直进入磁感应强度 0.500 T 的均匀磁场。其回旋半径约为（e = 1.60×10⁻¹⁹ C，m_e c² = 0.511 MeV）","options":["0.950 cm","1.64 cm","1.33 cm","3.28 cm"],"answer":"B","explain":"E = 2.511 MeV，pc = √(E² − m²c⁴) = 2.46 MeV，p = 2.46×10⁶×1.60×10⁻¹⁹/(3.00×10⁸) = 1.31×10⁻²¹ kg·m/s；r = p/(eB) = 1.31×10⁻²¹/(1.60×10⁻¹⁹×0.500) = 1.64×10⁻² m。易错点：0.950 cm 用经典 p = √(2mK)；1.33 cm 用 K/c 当动量；3.28 cm 把半径多乘了 2。"},{"id":"c19q019","type":"choice","difficulty":5,"tags":["阈值能量","不变量s","反质子产生"],"stem":"质子（静能 938 MeV）轰击静止质子，发生反应 p + p → p + p + p + p̄。实验室系中入射质子的动能阈值约为","options":["1.88 GeV","3.75 GeV","5.63 GeV","7.50 GeV"],"answer":"C","explain":"末态静质量共 4m。阈值时质心系总能量 √s = 4mc²。由 s = 2m²c⁴ + 2mc²E 得 16m²c⁴ = 2m²c⁴ + 2mc²E，E = 7mc²，T = E − mc² = 6mc² = 6×0.938 = 5.63 GeV。易错点：1.88 GeV 是 2mc²（对撞机每束量级）；3.75 GeV 是 4mc²；7.50 GeV 是 8mc²。"},{"id":"c19q020","type":"choice","difficulty":5,"tags":["相对论弹性碰撞","质心系","出射夹角"],"stem":"两个静止质量均为 m 的粒子发生弹性碰撞：入射粒子动能为 mc²，靶粒子静止，碰后两粒子在质心系中沿垂直于质心运动方向对称出射。实验室系中两出射粒子运动方向之间的夹角为","options":["90.0°","60.0°","78.5°","45.0°"],"answer":"C","explain":"总能量 3mc²，入射动量 pc = √(E² − m²c⁴) = √3mc²，质心速度 β = pc/E = 0.577c，γ_cm = 1.225。质心系中每个粒子 E* = 1.225mc²、p*c = 0.707mc²；垂直出射时实验室 p_x = γβE*/c = 0.866mc，p_y = 0.707mc，tanθ = 0.816，θ = 39.2°，两方向夹角 78.5°。易错点：90° 是非相对论结论；60° 和 45° 没有做质心系变换。"},{"id":"c19q021","type":"choice","difficulty":4,"tags":["相对论动能","经典极限","误差估计"],"stem":"电子以 0.800c 运动。用经典公式 ½mv² 算出的动能比相对论动能低约","options":["108%","25.0%","4.00%","52.0%"],"answer":"D","explain":"γ = 1.667，K_rel = (γ − 1)mc² = 0.667×0.511 = 0.341 MeV；K_cl = ½m(0.800c)² = 0.320×0.511 = 0.164 MeV。相对偏低 (0.341 − 0.164)/0.341 = 52.0%。易错点：108% 是相对论值比经典值高多少；25% 和 4% 是无依据的凑数。"},{"id":"c19q022","type":"choice","difficulty":4,"tags":["动能定理","相对论动能","加速功"],"stem":"电子从 0.600c 被加速到 0.800c，外力做的功为（电子静能 0.511 MeV）","options":["0.073 MeV","0.341 MeV","0.213 MeV","0.128 MeV"],"answer":"C","explain":"K₀.₆ = (1.250 − 1)×0.511 = 0.128 MeV，K₀.₈ = (1.667 − 1)×0.511 = 0.341 MeV，W = ΔK = 0.213 MeV。易错点：0.073 MeV 用经典动能差 ½m(0.800² − 0.600²)c²；0.341 MeV 是末动能；0.128 MeV 是初动能。"},{"id":"c19q023","type":"choice","difficulty":5,"tags":["长度收缩","方向判定","角度变化"],"stem":"一根固有长度 2.00 m 的细杆，静止时与 x 轴成 30.0°。杆随参考系以 0.800c 沿 x 轴运动。地面测得杆的长度及它与 x 轴的夹角为","options":["1.20 m，30.0°","1.73 m，30.0°","1.44 m，43.9°","1.44 m，30.0°"],"answer":"C","explain":"杆系中 Lₓ₀ = 2.00cos30.0° = 1.73 m，L_y₀ = 2.00sin30.0° = 1.00 m。沿运动方向收缩：Lₓ = 1.73/1.667 = 1.04 m，垂直方向不变 L_y = 1.00 m。L = √(1.04² + 1.00²) = 1.44 m，tanθ = 1.00/1.04 = 0.962，θ = 43.9°。易错点：1.20 m 把两个方向都收缩；1.73 m 只取 x 分量；角度不变是漏判垂直分量不变。"},{"id":"c19q024","type":"choice","difficulty":4,"tags":["光行差","速度变换","光子"],"stem":"飞船以 0.600c 沿 x 轴飞行，在飞船参考系中沿垂直于运动方向的 y′ 轴发射一束激光。地面系中激光传播方向与 x 轴的夹角为","options":["90.0°","36.9°","53.1°","45.0°"],"answer":"C","explain":"飞船系中 u′_x = 0、u′_y = c。速度变换得 u_x = v = 0.600c，u_y = c/γ = 0.800c，合速率仍为 c。tanθ = 0.800/0.600 = 1.333，θ = 53.1°。易错点：90° 忘记光行差；36.9° 是余角；45° 无依据。"},{"id":"c19q025","type":"choice","difficulty":4,"tags":["完全非弹性碰撞","质能守恒","复合粒子"],"stem":"两个静止质量均为 m 的粒子以 0.600c 的速率沿相反方向运动并发生完全非弹性碰撞。碰后复合粒子的静止质量为","options":["1.60m","2.00m","2.50m","3.20m"],"answer":"C","explain":"总能量 E = 2γmc² = 2×1.250mc² = 2.50mc²，总动量零。复合粒子静止，其静能等于总能量，故 M = 2.50m。易错点：2.00m 漏掉动能对应的质量；1.60m 用 1/γ 乘；3.20m 把 γ 平方。"},{"id":"c19q026","type":"choice","difficulty":5,"tags":["同时性的相对性","钟同步","洛伦兹变换"],"stem":"一列固有长度 300 m 的列车以 0.600c 通过站台。车头和车尾各有一只钟，在列车参考系中已对准。地面观测者同时读取两只钟的示数，则","options":["两钟示数相同","车尾钟比车头钟快 0.600 μs","车头钟比车尾钟快 0.600 μs","车尾钟比车头钟快 0.750 μs"],"answer":"B","explain":"地面系中两钟间距 L = L₀/γ = 240 m。由 t′ = γ(t − vx/c²)，同一 t 下 Δt′ = −γvΔx/c² = −γvL/c² = −vL₀/c² = −0.600 μs，负号表示车头钟读数较小，即车尾钟快 0.600 μs。易错点：0.750 μs 多乘了 γ；方向反了是选项 C；示数相同是忽略同时性相对性。"},{"id":"c19q027","type":"choice","difficulty":5,"tags":["二体衰变","能量动量守恒","π介子"],"stem":"静止的 π⁺ 介子（静能 139.6 MeV）衰变为 μ⁺（静能 105.7 MeV）和一个中微子（视为无质量）。μ⁺ 的动能和动量分别为","options":["33.9 MeV，29.8 MeV/c","29.8 MeV，139.6 MeV/c","4.12 MeV，105.7 MeV/c","4.12 MeV，29.8 MeV/c"],"answer":"D","explain":"二体衰变中 E_μ = (m_π² + m_μ²)c²/(2m_π) = (139.6² + 105.7²)/(2×139.6) = 109.8 MeV；K = 109.8 − 105.7 = 4.12 MeV。p_μc = √(E_μ² − m_μ²c⁴) = √(109.8² − 105.7²) = 29.8 MeV。易错点：33.9 MeV 用 m_π − m_μ 当动能；105.7 MeV/c 把静能当动量。"},{"id":"c19q028","type":"choice","difficulty":5,"tags":["相对论圆周运动","回旋频率","极端相对论"],"stem":"LHC 中质子被加速到 7.00 TeV（静能 938 MeV），沿周长 26.7 km 的圆环运行。质子回旋频率约为","options":["11.2 MHz","89.0 kHz","3.75 MHz","11.2 kHz"],"answer":"D","explain":"γ = 7000/0.938 + 1 = 7.46×10³，β = √(1 − 1/γ²) ≈ 1 − 9.0×10⁻⁹，速率与 c 只差约 2.7 m/s，可近似取 v ≈ c。f = v/(2πR) = 3.00×10⁸/2.67×10⁴ = 1.12×10⁴ Hz = 11.2 kHz。易错点：11.2 MHz 把 km 当 m；89.0 kHz 用 8c；3.75 MHz 无依据。"},{"id":"c19q029","type":"choice","difficulty":5,"tags":["长度收缩","同时性","梯子佯谬"],"stem":"一根固有长度 10.0 m 的梯子以 0.600c 沿隧道方向运动，隧道固有长度 8.00 m。在梯子参考系中隧道长度，以及在隧道参考系中梯子长度分别为","options":["8.00 m，8.00 m","10.0 m，8.00 m","6.40 m，10.0 m","6.40 m，8.00 m"],"answer":"D","explain":"γ = 1.25。梯子系看隧道：8.00/1.25 = 6.40 m；隧道系看梯子：10.0/1.25 = 8.00 m。两参考系各自判断不同，根源是同时性的相对性。易错点：8.00 m，8.00 m 把两个长度都当固有长度；10.0 m，8.00 m 只让隧道收缩。"},{"id":"c19q030","type":"choice","difficulty":5,"tags":["光子碰撞","对产生","阈值"],"stem":"一个能量 2.00 eV 的光子与一个迎面而来的高能光子对撞，发生 γ + γ → e⁺ + e⁻。高能光子的阈值能量约为（m_e c² = 0.511 MeV）","options":["65.5 GeV","262 GeV","1.31 TeV","131 GeV"],"answer":"D","explain":"对撞时 s = 4E₁E₂。阈值 s = (2m_e c²)² = 4m_e²c⁴，故 E₂ = m_e²c⁴/E₁ = (0.511×10⁶ eV)²/(2.00 eV) = 1.31×10¹¹ eV = 131 GeV。易错点：65.5 GeV 漏因子 2；262 GeV 多乘 2；1.31 TeV 小数点错一位。"},{"id":"c19q031","type":"choice","difficulty":5,"tags":["能量动量变换","洛伦兹不变量","四维动量"],"stem":"在 S 系中某粒子总能量 5.00 GeV、动量 4.00 GeV/c。S′ 系以 0.600c 沿粒子运动方向相对 S 运动。S′ 系中该粒子的能量和动量分别为","options":["1.75 GeV，1.25 GeV/c","3.25 GeV，2.75 GeV/c","6.25 GeV，4.00 GeV/c","3.25 GeV，1.25 GeV/c"],"answer":"D","explain":"γ = 1.25。E′ = γ(E − vp) = 1.25(5.00 − 0.600×4.00) = 3.25 GeV；p′c = γ(pc − βE) = 1.25(4.00 − 3.00) = 1.25 GeV。校验 E′² − p′²c² = 9.00 = 5.00² − 4.00²，不变量不变。易错点：1.75 GeV 用加号；2.75 GeV/c 动量也用加号；6.25 GeV 未做变换。"},{"id":"c19q032","type":"choice","difficulty":4,"tags":["相对论动量","质速关系","质子"],"stem":"质子动能为 1.00 GeV，静能 938 MeV。其速率和动量约为","options":["0.966c，1.69 GeV/c","0.732c，1.69 GeV/c","0.874c，1.69 GeV/c","0.874c，0.938 GeV/c"],"answer":"C","explain":"γ = 1 + K/mc² = 2.066，β = √(1 − 1/γ²) = 0.874，p = γmβc = 2.066×0.938×0.874 = 1.69 GeV/c。易错点：0.966c 用 β = √(1 − 1/γ) 算错；0.732c 用 K/E 当 β；0.938 GeV/c 漏乘 γβ。"},{"id":"c19q033","type":"choice","difficulty":4,"tags":["时间膨胀","钟慢","速率测量"],"stem":"某飞船上的钟比地面上的钟慢 1.00%。飞船相对地面的速率约为","options":["0.0100c","0.141c","0.995c","0.100c"],"answer":"B","explain":"钟慢 1.00% 即 t = 1.010t₀，γ = 1.010，β = √(1 − 1/γ²) = √(1 − 0.9803) = 0.141。易错点：0.0100c 把时间变慢率直接当 β；0.995c 用 1 − 0.010 当 β；0.100c 无依据。"},{"id":"c19q034","type":"choice","difficulty":4,"tags":["长度收缩","μ子","同时性"],"stem":"μ子以 0.995c 相对地面飞行。地面测得从 μ子产生处到地面的距离为 10.0 km，则在 μ子参考系中这段距离为","options":["10.0 km","100 km","0.999 km","0.500 km"],"answer":"C","explain":"γ = 1/√(1 − 0.995²) = 10.01，运动方向上的长度收缩 L = L₀/γ = 10.0/10.01 = 0.999 km。易错点：10.0 km 是地面系固有长度；100 km 乘了 γ；0.500 km 用 γ = 20 算错。"},{"id":"c19q035","type":"choice","difficulty":4,"tags":["质能方程","太阳辐射","质量损失"],"stem":"太阳的辐射功率为 3.85×10²⁶ W。太阳因辐射而损失质量的速率约为","options":["1.28×10⁹ kg/s","4.28×10¹⁷ kg/s","1.16×10¹⁵ kg/s","4.28×10⁹ kg/s"],"answer":"D","explain":"由 P = (dm/dt)c² 得 dm/dt = 3.85×10²⁶/(9.00×10¹⁶) = 4.28×10⁹ kg/s。易错点：1.28×10⁹ kg/s 除以 3c²；4.28×10¹⁷ kg/s 除以 c 而不是 c²；1.16×10¹⁵ kg/s 除以 c³。"},{"id":"c19q036","type":"calc","difficulty":5,"tags":["洛伦兹变换","同时性的相对性","时序颠倒"],"stem":"在惯性系 S 中，事件 A 的坐标为 x_A = 0、t_A = 0，事件 B 的坐标为 x_B = 1.20×10⁸ m、t_B = 0.200 s。惯性系 S′ 以 v = 0.600c 沿 x 轴正方向相对 S 运动，t = t′ = 0 时两系原点重合。(1) 求 S′ 系中两事件的坐标差 Δx′ 和 Δt′；(2) 判断 S′ 系中哪个事件先发生；(3) 求能使两事件同时发生的参考系速率，并判断该速率是否小于 c。","answer":"(1) Δx′ = 1.05×10⁸ m，Δt′ = −5.00×10⁻² s；(2) B 先发生；(3) v = 0.500c，小于 c，可以实现","explain":"γ = 1/√(1 − 0.600²) = 1.25。Δx′ = γ(Δx − vΔt) = 1.25(1.20×10⁸ − 0.600×3.00×10⁸×0.200) = 1.25×8.40×10⁷ = 1.05×10⁸ m。Δt′ = γ(Δt − vΔx/c²) = 1.25(0.200 − 0.600×1.20×10⁸/3.00×10⁸) = 1.25×(−0.0400) = −5.00×10⁻² s，负号表示 B 先发生。令 Δt′ = 0 得 v = c²Δt/Δx = 9.00×10¹⁶×0.200/(1.20×10⁸) = 0.500c \u003c c。因 cΔt = 6.00×10⁷ m \u003c Δx = 1.20×10⁸ m，两事件为类空间隔，本来就没有因果联系，时序可以颠倒。"},{"id":"c19q037","type":"calc","difficulty":4,"tags":["时间膨胀","长度收缩","μ子寿命"],"stem":"μ子的固有寿命为 2.20 μs，以 0.995c 从 8.00 km 高空产生并向地面运动。(1) 求实验室系中 μ子的寿命和衰变前飞行距离；(2) 判断它能否到达地面；(3) 在 μ子参考系中求地面到产生点的距离和可用时间，验证结论是否一致。","answer":"(1) 22.0 μs，6.57 km；(2) 不能到达地面；(3) μ子系中距离 0.799 km，可用时间 2.68 μs，仍大于 2.20 μs，结论一致","explain":"γ = 1/√(1 − 0.995²) = 10.01。实验室系寿命 t = γτ₀ = 10.01×2.20 = 22.0 μs；飞行距离 d = βct = 0.995×3.00×10⁸×22.0×10⁻⁶ = 6.57×10³ m \u003c 8.00 km，故不能到达。μ子系中地面距离收缩为 L = 8.00/10.01 = 0.799 km，以 0.995c 通过需 t′ = 0.799×10³/(0.995×3.00×10⁸) = 2.68×10⁻⁶ s > 2.20 μs，同样不能到达。两种参考系判断一致，说明时间膨胀与长度收缩是同一物理事实的两种描述。"},{"id":"c19q038","type":"calc","difficulty":5,"tags":["双生子佯谬","固有时","非惯性系"],"stem":"飞船以 0.800c 飞往 8.00 光年外的恒星，到达后立即以相同速率返回，地球系中恒星静止。(1) 求地球系中的往返时间；(2) 求飞船上的固有时；(3) 返回时飞船乘员比地球上的双胞胎少多少岁；(4) 为什么不能把飞船看作静止、认为地球钟走得慢而得出相反结论。","answer":"(1) 20.0 年；(2) 12.0 年；(3) 8.00 年；(4) 飞船掉头时存在加速度，是非惯性系，不能与地球系对称比较","explain":"γ = 1/√(1 − 0.800²) = 1.667。单程地球系时间 8.00/0.800 = 10.0 年，往返 20.0 年；飞船固有时为 20.0/1.667 = 12.0 年。两人相差 20.0 − 12.0 = 8.00 年，飞船乘员更年轻。飞船掉头时必须减速、反向加速，这一段是非惯性运动；狭义相对论的时间膨胀公式只适用于惯性系之间的对称比较。掉头期间飞船参考系的「同时面」发生转动，地球时间被扫过一大段，正是这 8.00 年差值的来源，所以不能简单地把飞船当静止系。"},{"id":"c19q039","type":"calc","difficulty":4,"tags":["速度合成","洛伦兹变换","光速不变"],"stem":"从洛伦兹变换 dx = γ(dx′ + vdt′)、dt = γ(dt′ + vdx′/c²) 出发，(1) 导出同一直线上的相对论速度合成公式；(2) 求 u′ = 0.600c、v = 0.600c 时的 u；(3) 验证 u′ = c 时仍有 u = c。","answer":"(1) u = (u′ + v)/(1 + u′v/c²)；(2) u = 0.882c；(3) 代入 u′ = c 得 u = (c + v)/(1 + v/c) = c","explain":"两式相除：u = dx/dt = [γ(dx′ + vdt′)]/[γ(dt′ + vdx′/c²)] = (dx′/dt′ + v)/(1 + (v/c²)(dx′/dt′))。令 u′ = dx′/dt′ 即得 u = (u′ + v)/(1 + u′v/c²)。代入 u′ = v = 0.600c：u = 1.20c/(1 + 0.360) = 0.882c。代入 u′ = c：u = (c + v)/(1 + v/c) = c，光速在任何惯性系中都是 c，与光源运动无关。"},{"id":"c19q040","type":"calc","difficulty":5,"tags":["横向速度合成","速度变换","符号推导"],"stem":"在 S′ 系中一粒子沿 y′ 轴以速率 u′ 运动（u′_x = 0），S′ 系以速度 v 沿 x 轴相对 S 运动。(1) 导出 S 系中 u_x、u_y 的表达式；(2) 证明合速率 u 总小于 c；(3) 取 v = 0.600c、u′ = 0.800c，求 u 及运动方向与 x 轴的夹角。","answer":"(1) u_x = v，u_y = u′√(1 − v²/c²)；(2) u² = v² + u′²(1 − v²/c²) \u003c c²；(3) u = 0.877c，与 x 轴夹角 46.8°","explain":"由 dx = γ(dx′ + vdt′)、dy = dy′、dt = γ(dt′ + vdx′/c²)，并令 dx′ = 0，得 u_x = γvdt′/(γdt′) = v，u_y = u′dt′/(γdt′) = u′/γ = u′√(1 − v²/c²)。于是 u² = v² + u′²(1 − v²/c²)。因 u′ \u003c c，故 u′²(1 − v²/c²) \u003c c²(1 − v²/c²) = c² − v²，从而 u² \u003c c²。取 v = 0.600c、u′ = 0.800c：γ = 1.25，u_x = 0.600c，u_y = 0.640c，u = √(0.360 + 0.410)c = 0.877c；tanθ = 0.640/0.600 = 1.067，θ = 46.8°。"},{"id":"c19q041","type":"calc","difficulty":4,"tags":["总能量","相对论动量","动能"],"stem":"某电子的总能量为 3.00 MeV（静能 0.511 MeV）。(1) 求 γ 和 β；(2) 求动量（以 MeV/c 为单位）；(3) 求动能。","answer":"(1) γ = 5.87，β = 0.985；(2) p = 2.96 MeV/c；(3) K = 2.49 MeV","explain":"γ = E/(m_e c²) = 3.00/0.511 = 5.87；β = √(1 − 1/γ²) = √(1 − 0.0290) = 0.985。pc = √(E² − m²c⁴) = √(9.00 − 0.261) = 2.96 MeV，故 p = 2.96 MeV/c。动能 K = E − m_e c² = 3.00 − 0.511 = 2.49 MeV。也可用 K = (γ − 1)m_e c² 校验。"},{"id":"c19q042","type":"calc","difficulty":5,"tags":["电场加速","相对论动能","符号推导"],"stem":"电子由静止经电势差 V 加速。(1) 导出 β 与 V 的关系式；(2) 计算 V = 1.00 MV 和 V = 10.0 MV 时的 β；(3) 用经典动能公式估算同样电压下的速率，说明为什么 V 很大时经典公式失效。","answer":"(1) β = √(1 − 1/(1 + eV/(m_e c²))²)；(2) 0.941 和 0.999；(3) 经典公式给出 1.98c 和 6.26c，超过光速，故失效","explain":"电场做功等于动能：eV = (γ − 1)m_e c²，故 γ = 1 + eV/(m_e c²)，再由 β = √(1 − 1/γ²) 得 β = √(1 − 1/(1 + eV/(m_e c²))²)。V = 1.00 MV 时 γ = 2.957，β = 0.941；V = 10.0 MV 时 γ = 20.57，β = 0.9988 ≈ 0.999。经典公式 ½mv² = eV 给出 v = √(2eV/m_e)，1 MV 时为 1.98c、10 MV 时为 6.26c，均超过光速，说明高速时必须用相对论动能。"},{"id":"c19q043","type":"calc","difficulty":4,"tags":["相对论","速度合成","光速不变"],"stem":"一艘宇宙飞船以 v = 0.800c 的速率相对地球飞行，飞船向前发射一枚导弹，导弹相对飞船的速率为 0.600c。(1) 求导弹相对地球的速率；(2) 若改为向后发射，求导弹相对地球的速率与方向；(3) 为什么不能把两个速率直接相加？","answer":"(1) 0.946c；(2) 0.385c，方向仍沿飞船前进方向；(3) 伽利略速度合成只在低速时近似成立，真空中光速对任何惯性系都是 c，必须用相对论速度变换式 u = (u′ + v)/(1 + u′v/c²)。","explain":"用一维相对论速度变换 u = (u′ + v)/(1 + u′v/c²)，取 v = 0.800c。向前发射 u′ = +0.600c：u = (0.600 + 0.800)/(1 + 0.600×0.800) = 1.400/1.480 = 0.946c。向后发射 u′ = −0.600c：u = (−0.600 + 0.800)/(1 − 0.480) = 0.200/0.520 = 0.385c，结果仍为正，说明导弹相对地球还是朝前飞（飞船太快，把向后发射的导弹也「带」成了向前）。若按伽利略叠加会得到 1.400c > c，违反光速不变原理，所以必须用相对论变换。"},{"id":"c19q044","type":"calc","difficulty":5,"tags":["质量亏损","结合能","比结合能"],"stem":"已知质子质量 1.007276 u、中子质量 1.008665 u、氦核 ⁴He 的质量为 4.001506 u，1 u 对应 931.5 MeV。(1) 求 ⁴He 的质量亏损；(2) 求结合能；(3) 求比结合能。","answer":"(1) 0.030377 u；(2) 28.3 MeV；(3) 7.07 MeV/核子","explain":"⁴He 含 2 个质子和 2 个中子，核子质量总和为 2×1.007276 + 2×1.008665 = 4.031882 u。质量亏损 Δm = 4.031882 − 4.001506 = 0.030377 u。结合能 E_b = 0.030377×931.5 = 28.3 MeV。比结合能 = 28.3/4 = 7.07 MeV/核子。注意这里用的是原子核质量，若用原子质量需扣除电子结合能。"},{"id":"c19q045","type":"calc","difficulty":4,"tags":["相对论多普勒效应","红移","退行速度"],"stem":"飞船以速率 v 远离地球，船上激光器发出波长 500.0 nm 的光，地面接收到的波长为 650.0 nm。(1) 求波长比；(2) 求 v；(3) 若飞船靠近地球，接收波长应比 500.0 nm 长还是短。","answer":"(1) 1.30；(2) 7.70×10⁷ m/s（约 0.257c）；(3) 短，发生蓝移","explain":"远离时 λ/λ₀ = √((1 + β)/(1 − β)) = 650.0/500.0 = 1.30。平方得 (1 + β)/(1 − β) = 1.69，解得 β = (1.69 − 1)/(1.69 + 1) = 0.2565，v = 0.2565×3.00×10⁸ = 7.70×10⁷ m/s。若光源靠近，接收频率升高、波长变短，即蓝移。"},{"id":"c19q046","type":"calc","difficulty":5,"tags":["回旋半径","γ修正","磁场"],"stem":"电子动能为 5.00 MeV，垂直进入磁感应强度 B = 0.200 T 的均匀磁场。(1) 求 γ 和动量；(2) 求回旋半径；(3) 求回旋周期；(4) 用经典动量求半径并比较。","answer":"(1) γ = 10.8，p = 5.49 MeV/c；(2) r = 9.15 cm；(3) T = 1.93 ns；(4) 经典半径 3.77 cm，只有相对论值的 0.412 倍","explain":"γ = 1 + K/(m_e c²) = 1 + 5.00/0.511 = 10.78。总能量 E = 5.511 MeV，pc = √(E² − m²c⁴) = √(30.37 − 0.261) = 5.49 MeV，故 p = 5.49 MeV/c = 2.93×10⁻²¹ kg·m/s。r = p/(eB) = 2.93×10⁻²¹/(1.60×10⁻¹⁹×0.200) = 9.15×10⁻² m。周期 T = 2πγm/(eB) = 2π×10.78×9.11×10⁻³¹/(1.60×10⁻¹⁹×0.200) = 1.93×10⁻⁹ s。经典动量 p_cl c = √(2m_e c²K) = √(2×0.511×5.00) = 2.26 MeV，半径 3.77 cm，比真实值小得多，说明高速时不能忽略 γ。"},{"id":"c19q047","type":"calc","difficulty":5,"tags":["阈值能量","不变量s","对撞机"],"stem":"质子（静能 m_p c² = 938 MeV）与静止质子碰撞，产生反质子：p + p → p + p + p + p̄。(1) 用不变量 s 导出实验室系中入射质子的阈值动能 T_th = 6m_p c²；(2) 计算数值；(3) 若用两束质子迎头对撞，每束质子的阈值动能是多少。","answer":"(1) T_th = 6m_p c²；(2) 5.63 GeV；(3) 938 MeV","explain":"实验室系中靶质子静止，s = (p₁ + p₂)²c² = 2m²c⁴ + 2mc²E，其中 E 为入射质子的总能量。反应末态最少有 4 个静质量为 m 的粒子，阈值时它们在质心系中全部静止，√s = 4mc²，即 s = 16m²c⁴。于是 16m²c⁴ = 2m²c⁴ + 2mc²E，得 E = 7mc²，T = E − mc² = 6mc² = 5.63 GeV。对撞机中两束质子迎头相撞，质心系总能量 √s = 2E_beam，阈值 2E_beam = 4mc²，E_beam = 2mc²，每束动能 T = mc² = 938 MeV，比固定靶方案小得多。"},{"id":"c19q048","type":"calc","difficulty":5,"tags":["相对论弹性碰撞","质心系","能量动量守恒"],"stem":"两个静止质量均为 m 的粒子发生弹性碰撞，入射粒子动能为 mc²，靶粒子静止。碰后在质心系中两粒子沿垂直于质心运动方向对称出射。(1) 求质心系相对实验室系的速率 β_cm；(2) 求实验室系中每个出射粒子的能量；(3) 求两出射粒子方向间的夹角。","answer":"(1) β_cm = 0.577c；(2) 每个出射粒子能量 1.50mc²；(3) 夹角 78.5°","explain":"入射粒子总能量 2mc²，靶粒子 mc²，总能量 3mc²；入射动量 pc = √(4m²c⁴ − m²c⁴) = √3mc²。质心速度 β_cm = pc/E_total = √3/3 = 0.577c，γ_cm = 1.225。质心系中总能量 √s = 3mc²/γ_cm = 2.449mc²，每个粒子 E* = 1.225mc²，p*c = √(E*² − m²c⁴) = 0.707mc²。垂直出射时，实验室系 p_x = γ_cmβ_cmE*/c = 0.866mc，p_y = 0.707mc，tanθ = 0.816，θ = 39.2°，两方向夹角 2θ = 78.5°。每个出射粒子的能量 E = γ_cmE* = 1.50mc²。"},{"id":"c19q049","type":"calc","difficulty":4,"tags":["不变间隔","类时与类空","因果律"],"stem":"在 S 系中事件 A 的坐标为 (0, 0)，事件 B 的坐标为 (1.20×10⁸ m, 0.500 s)。(1) 求两事件的不变间隔 Δs²，判断是类时还是类空；(2) 求两事件之间的固有时；(3) 是否存在参考系使两事件同时发生？若把 B 的时间改为 0.100 s，结论如何，需多大速率？","answer":"(1) 8.10×10¹⁵ m²，类时；(2) 0.300 s；(3) 不存在；改为 0.100 s 后为类空，v = 0.250c 时两事件同时，v > 0.250c 时 B 先于 A","explain":"Δs² = c²Δt² − Δx² = (3.00×10⁸×0.500)² − (1.20×10⁸)² = 2.25×10¹⁶ − 1.44×10¹⁶ = 8.10×10¹⁵ m² > 0，为类时间隔。固有时 Δτ = √(Δs²)/c = √(8.10×10¹⁵)/3.00×10⁸ = 9.00×10⁷/3.00×10⁸ = 0.300 s。类时间隔的时序在任何惯性系中都相同，不能同时。若 Δt = 0.100 s，则 Δs² = 9.00×10¹⁴ − 1.44×10¹⁶ \u003c 0，为类空间隔；令 Δt′ = γ(Δt − vΔx/c²) = 0，得 v = c²Δt/Δx = 9.00×10¹⁶×0.100/(1.20×10⁸) = 0.250c，恰在此速率下两事件同时；v > 0.250c 时 Δt′ \u003c 0，B 反而先于 A。"},{"id":"c19q050","type":"calc","difficulty":5,"tags":["能量动量变换","洛伦兹不变量","静质量"],"stem":"某粒子在惯性系 S 中能量为 E、动量为 p。S′ 系以速度 v 沿粒子运动方向相对 S 运动，能量和动量的变换为 E′ = γ(E − vp)、p′ = γ(p − vE/c²)。(1) 证明 E² − p²c² 在洛伦兹变换下不变；(2) 由此说明静质量 m₀ = √(E² − p²c²)/c² 是与参考系无关的量；(3) 对光子验证 E = pc 在任意惯性系成立。","answer":"(1) E′² − p′²c² = E² − p²c²；(2) 不变量除以 c⁴ 即 m₀²，故 m₀ 不变；(3) 光子 m₀ = 0，故 E = pc 在任意惯性系成立","explain":"E′² − p′²c² = γ²[(E − vp)² − (pc − vE/c)²] = γ²[E²(1 − v²/c²) − p²c²(1 − v²/c²)] = E² − p²c²，其中用了 γ²(1 − v²/c²) = 1。因此 E² − p²c² 是洛伦兹不变量，除以 c⁴ 得 m₀² = (E² − p²c²)/c⁴，不随参考系改变。对光子 m₀ = 0，代入得 E² = p²c²，即 E = pc；这一关系在任意惯性系中都成立，与光子频率如何变化无关。"}]},{"chapter":20,"chapterName":"量子物理基础","questions":[{"id":"c20q001","type":"choice","difficulty":3,"tags":["维恩位移定律","斯特凡-玻尔兹曼定律","太阳表面温度"],"stem":"测得太阳光谱辐射的峰值波长约为 500 nm，把太阳近似为黑体。太阳表面温度及表面单位面积的辐射功率约为（维恩常量 b = 2.898×10⁻³ m·K，σ = 5.67×10⁻⁸ W/(m²·K⁴)）","options":["5.80×10³ K，6.40×10⁷ W/m²","5.80×10³ K，1.13×10¹⁵ W/m²","2.90×10³ K，6.40×10⁷ W/m²","2.90×10³ K，1.13×10¹⁵ W/m²"],"answer":"A","explain":"由 λ_mT = b 得 T = 2.898×10⁻³/5.00×10⁻⁷ = 5.80×10³ K，这里 λ_m 必须用米，用 500 直接去除会差 10⁹ 倍。\n单位面积辐射功率即辐射出射度 M = σT⁴ = 5.67×10⁻⁸×(5.80×10³)⁴ = 6.40×10⁷ W/m²。\n易错点：①漏掉 σ 只算 T⁴ 得 1.13×10¹⁵；②误把 b 记成 1.449×10⁻³ m·K，温度减半；③M 是单位面积功率，太阳总功率还要乘 4πR²。"},{"id":"c20q002","type":"choice","difficulty":3,"tags":["光电效应","爱因斯坦方程","遏制频率"],"stem":"用波长 400 nm 的单色光照射某金属阴极，测得截止电压为 0.850 V。该金属的逸出功和遏制频率（红限频率）约为（h = 6.63×10⁻³⁴ J·s，hc = 1.24×10³ eV·nm）","options":["3.95 eV，9.53×10¹⁴ Hz","2.25 eV，5.43×10¹⁴ Hz","0.850 eV，2.05×10¹⁴ Hz","2.25 eV，3.41×10¹⁵ Hz"],"answer":"B","explain":"入射光子能量 E = hc/λ = 1.24×10³/400 = 3.10 eV。\n由 eU = E − W 得 W = 3.10 − 0.850 = 2.25 eV，这一步必须把截止电压换算成 eV 再与光子能量相减，不能直接用伏特数值。\n遏制频率由 hν₀ = W：ν₀ = 2.25×1.60×10⁻¹⁹/6.63×10⁻³⁴ = 5.43×10¹⁴ Hz。\n易错点：把 E 与 eU 相加得 3.95 eV；拿 0.850 eV 当逸出功；用 ħ 代替 h 得 3.41×10¹⁵ Hz。"},{"id":"c20q003","type":"choice","difficulty":3,"tags":["德布罗意波","加速电压","非相对论判据"],"stem":"电子经 200 V 的电压加速后，其德布罗意波长和动量约为（mₑ = 9.11×10⁻³¹ kg，e = 1.60×10⁻¹⁹ C，h = 6.63×10⁻³⁴ J·s）","options":["0.123 nm，7.63×10⁻²⁴ kg·m/s","0.0614 nm，5.40×10⁻²⁴ kg·m/s","0.0434 nm，7.63×10⁻²⁴ kg·m/s","0.0868 nm，7.63×10⁻²⁴ kg·m/s"],"answer":"D","explain":"先判断是否相对论：200 V 对应的动能 200 eV 远小于 mₑc² = 511 keV，可用非相对论式。\n由 eU = p²/(2mₑ) 得 p = √(2mₑeU) = √(2×9.11×10⁻³¹×1.60×10⁻¹⁹×200) = 7.63×10⁻²⁴ kg·m/s。\nλ = h/p = 6.63×10⁻³⁴/7.63×10⁻²⁴ = 8.68×10⁻¹¹ m = 0.0868 nm。\n易错点：0.123 nm 是 100 V 的结果；把 eU 写成 2eU 会得到 0.0434 nm；5.40×10⁻²⁴ 来自 100 V。"},{"id":"c20q004","type":"choice","difficulty":3,"tags":["康普顿散射","波长偏移","电子反冲能"],"stem":"波长 0.100 nm 的 X 射线与自由电子发生康普顿散射，散射角为 90°。散射光的波长偏移及电子获得的动能约为（h/(m₀c) = 2.43×10⁻¹² m，hc = 1.24×10³ eV·nm）","options":["0.00486 nm，0.588 keV","0.00243 nm，12.1 keV","0.00243 nm，0.294 keV","0.00122 nm，0.147 keV"],"answer":"C","explain":"Δλ = (h/m₀c)(1 − cos90°) = 2.43×10⁻¹² m = 0.00243 nm，与入射波长无关，只由散射角决定。\n散射波长 λ′ = 0.100 + 0.00243 = 0.10243 nm，对应光子能量 E′ = 1.24×10³/0.10243 = 12.1 keV。\n电子动能即光子损失的能量：Eₖ = 12.4 − 12.1 = 0.294 keV。\n易错点：把 1 − cosθ 写成 2(1 − cosθ) 得 0.00486 nm；用原波长算能量得 12.4 keV（即把全部能量给电子）。"},{"id":"c20q005","type":"choice","difficulty":3,"tags":["玻尔氢原子","能级跃迁","巴耳末系"],"stem":"氢原子中电子由 n = 3 能级跃迁到 n = 2 能级，发射光子的波长及所属线系为（E₁ = −13.6 eV，hc = 1.24×10³ eV·nm）","options":["656 nm，巴耳末系","656 nm，莱曼系","486 nm，巴耳末系","122 nm，莱曼系"],"answer":"A","explain":"Eₙ = −13.6/n² eV，故 E₃ = −1.51 eV，E₂ = −3.40 eV，能级差 ΔE = 3.40 − 1.51 = 1.89 eV。\nλ = hc/ΔE = 1.24×10³/1.89 = 656 nm。\n终态 n = 2 的跃迁统称巴耳末系（n = 3→2 即 Hα），它是可见光区最强的一条；终态为 n = 1 才是莱曼系。\n易错点：把 ΔE 算成 13.6(1/3² − 1/2²) 的负值取绝对值时弄反，或用 13.6/2² − 13.6/3² 的顺序导致符号错。"},{"id":"c20q006","type":"choice","difficulty":3,"tags":["一维无限深势阱","能级公式","跃迁光子"],"stem":"电子被限制在宽 0.100 nm 的一维无限深势阱中。其基态能量及从 n = 2 跃迁到 n = 1 所发光的波长约为（h = 6.63×10⁻³⁴ J·s，mₑ = 9.11×10⁻³¹ kg，hc = 1.24×10³ eV·nm）","options":["9.42 eV，11.0 nm","37.7 eV，5.49 nm","37.7 eV，11.0 nm","151 eV，6.20 nm"],"answer":"C","explain":"Eₙ = n²h²/(8mₑL²)，先算 E₁ = (6.63×10⁻³⁴)²/(8×9.11×10⁻³¹×1.00×10⁻²⁰) = 6.03×10⁻¹⁸ J = 37.7 eV。\nE₂ = 4E₁ = 151 eV，故 ΔE = 3E₁ = 113 eV。\nλ = hc/ΔE = 1.24×10³/113 = 11.0 nm。\n易错点：9.42 eV 是 L = 0.200 nm 的基态能；5.49 nm 对应 ΔE = 2E₁（漏掉 n² 的差）；151 eV 误当基态。"},{"id":"c20q007","type":"choice","difficulty":4,"tags":["黑体辐射","反推温度","维恩位移"],"stem":"某黑体表面单位面积的辐射功率为 5.67×10⁶ W/m²。它的表面温度及辐射峰值波长约为（σ = 5.67×10⁻⁸ W/(m²·K⁴)，b = 2.898×10⁻³ m·K）","options":["3.16×10³ K，916 nm","3.16×10³ K，458 nm","1.68×10³ K，1.72×10³ nm","3.16×10³ K，2.90×10⁻³ nm"],"answer":"A","explain":"由 M = σT⁴ 得 T⁴ = 5.67×10⁶/5.67×10⁻⁸ = 1.00×10¹⁴，故 T = (10¹⁴)^(1/4) = 3.16×10³ K。\nλ_m = b/T = 2.898×10⁻³/3.16×10³ = 9.16×10⁻⁷ m = 916 nm，落在近红外，这正是白炽灯大部分能量以热辐射形式浪费的原因。\n易错点：把 T⁴ 直接开平方得 1.00×10⁷ K；漏开四次方得 1.68×10³ K；b 的单位是 m·K，写成 nm 会差 10⁹ 倍。"},{"id":"c20q008","type":"choice","difficulty":4,"tags":["宇宙微波背景","维恩位移","光子能量"],"stem":"宇宙微波背景辐射的温度为 2.725 K，可视为黑体。其辐射峰值波长及峰值处每个光子的能量约为（b = 2.898×10⁻³ m·K，hc = 1.24×10³ eV·nm）","options":["1.06 mm，1.17×10⁻³ eV","1.06 mm，1.17×10⁻⁶ eV","0.531 mm，1.17×10⁻³ eV","2.12 mm，2.34×10⁻³ eV"],"answer":"A","explain":"λ_m = b/T = 2.898×10⁻³/2.725 = 1.06×10⁻³ m = 1.06 mm，属于微波波段，这就是「微波背景」名称的由来。\n光子能量 E = hc/λ_m = 1.24×10³ eV·nm/1.06×10⁶ nm = 1.17×10⁻³ eV。\n易错点：把 b 的 10⁻³ 漏掉、或把 mm 换算成 m 时少乘 10³，会使能量差若干量级；0.531 mm 是把 1 − cos 型系数误用到维恩定律。"},{"id":"c20q009","type":"choice","difficulty":4,"tags":["光电效应","由截止电压求普朗克常量","联立方程"],"stem":"用 400 nm 和 300 nm 的单色光分别照射同一金属阴极，测得截止电压为 0.850 V 和 1.88 V。由此得到的普朗克常量和该金属的逸出功约为（e = 1.60×10⁻¹⁹ C，c = 3.00×10⁸ m/s，1 eV = 1.60×10⁻¹⁹ J）","options":["6.59×10⁻³⁴ J·s，2.25 eV","3.30×10⁻³⁴ J·s，2.25 eV","6.59×10⁻³⁴ J·s，1.03 eV","1.32×10⁻³³ J·s，2.25 eV"],"answer":"A","explain":"由 eU = hc/λ − W 写出两式相减：e(U₂ − U₁) = hc(1/λ₂ − 1/λ₁)。\nΔν = c(1/300 − 1/400)×10⁹ = 3.00×10⁸×8.33×10⁵ = 2.50×10¹⁴ Hz，ΔU = 1.03 V。\nh = eΔU/Δν = 1.60×10⁻¹⁹×1.03/2.50×10¹⁴ = 6.59×10⁻³⁴ J·s。\n代回 400 nm：W = 3.10 − 0.850 = 2.25 eV。易错点：相减时漏掉 e，得 3.30×10⁻³⁴；把 ΔU 当逸出功得 1.03 eV。"},{"id":"c20q010","type":"choice","difficulty":4,"tags":["康普顿散射","散射角 60°","能量守恒"],"stem":"波长 0.0500 nm 的 X 射线被自由电子散射，散射角为 60°。散射光波长及电子获得的动能约为（h/(m₀c) = 2.43×10⁻¹² m，hc = 1.24×10³ eV·nm）","options":["0.0512 nm，0.59 keV","0.0512 nm，1.2 keV","0.0524 nm，0.59 keV","0.0512 nm，0.30 keV"],"answer":"A","explain":"Δλ = 2.43×10⁻¹²×(1 − cos60°) = 2.43×10⁻¹²×0.500 = 1.22×10⁻¹² m = 0.00122 nm。\nλ′ = 0.0500 + 0.00122 = 0.05122 nm；E = 1.24×10³/0.0500 = 24.8 keV，E′ = 1.24×10³/0.05122 = 24.2 keV。\n电子动能 = 24.8 − 24.2 = 0.59 keV。\n易错点：1 − cos60° 误算成 1（得 0.0524 nm）；把 Δλ 当 λ′；用 90° 的系数 2 得 1.2 keV。"},{"id":"c20q011","type":"choice","difficulty":4,"tags":["德布罗意波","电子与质子对比","宏观物体波长"],"stem":"已知 100 V 加速的电子德布罗意波长为 0.123 nm。在同样 100 V 下加速的质子，以及以 1.00 m/s 运动的 1.00 g 小球，其德布罗意波长分别约为（mₚ = 1.67×10⁻²⁷ kg，h = 6.63×10⁻³⁴ J·s）","options":["2.86×10⁻³ nm 和 6.63×10⁻³¹ m","2.86×10⁻³ nm 和 6.63×10⁻³⁴ m","5.27 nm 和 6.63×10⁻³¹ m","2.86×10⁻³ nm 和 6.63×10⁻³² m"],"answer":"A","explain":"同电压下 p = √(2meU) 相同，故 λ ∝ 1/√m：λₚ = λₑ√(mₑ/mₚ) = 0.123×√(9.11×10⁻³¹/1.67×10⁻²⁷) = 0.123/42.8 = 2.86×10⁻³ nm。\n小球：p = mv = 1.00×10⁻³×1.00 = 1.00×10⁻³ kg·m/s，λ = 6.63×10⁻³⁴/1.00×10⁻³ = 6.63×10⁻³¹ m。\n该波长比原子核（10⁻¹⁵ m）还小 16 个量级，任何孔径都无法显示其衍射，所以宏观物体观察不到波动性。\n易错点：比值取倒数得 5.27 nm；把 1.00 g 记成 10⁻² kg 或忘记换算，波长差 10 倍以上。"},{"id":"c20q012","type":"choice","difficulty":4,"tags":["不确定关系","核内电子","量级估算"],"stem":"若电子被限制在直径 1.0×10⁻¹⁴ m 的原子核内，由不确定关系估计其动量不确定度及相应的动能下限约为（ħ = 1.055×10⁻³⁴ J·s，mₑ = 9.11×10⁻³¹ kg，1 eV = 1.60×10⁻¹⁹ J）","options":["5.28×10⁻²¹ kg·m/s，95 MeV","2.64×10⁻²¹ kg·m/s，24 MeV","5.28×10⁻²¹ kg·m/s，48 MeV","1.06×10⁻²⁰ kg·m/s，380 MeV"],"answer":"A","explain":"取 Δx = 1.0×10⁻¹⁴ m，由 ΔxΔp ≥ ħ/2 得 Δp ≥ 1.055×10⁻³⁴/(2×1.0×10⁻¹⁴) = 5.28×10⁻²¹ kg·m/s。\n取 p ≈ Δp，E ≈ p²/(2mₑ) = (5.28×10⁻²¹)²/(2×9.11×10⁻³¹) = 1.53×10⁻¹¹ J = 95 MeV。\nβ 衰变放出的电子动能只有 1 MeV 量级，远小于 95 MeV，故电子不可能单独被束缚在核内——这正是历史上否定「核由质子加电子组成」的关键论据。\n易错点：用 ħ/Δx 代替 ħ/2Δx 得 1.06×10⁻²⁰ 与 380 MeV；把 p²/2m 写成 p²/m 得 190 MeV 量级。"},{"id":"c20q013","type":"choice","difficulty":4,"tags":["能量-时间不确定关系","能级宽度","谱线宽度"],"stem":"某原子激发态的平均寿命为 1.0×10⁻⁸ s，该态向基态跃迁发出 500 nm 的谱线。能级宽度及该谱线的波长展宽约为（ħ = 1.055×10⁻³⁴ J·s，hc = 1.24×10³ eV·nm）","options":["3.3×10⁻⁸ eV，6.6×10⁻⁶ nm","3.3×10⁻⁸ eV，3.3×10⁻⁶ nm","6.6×10⁻⁸ eV，6.6×10⁻⁶ nm","3.3×10⁻⁸ eV，1.3×10⁻⁵ nm"],"answer":"A","explain":"由 ΔE·τ ≥ ħ/2 得 ΔE = 1.055×10⁻³⁴/(2×1.0×10⁻⁸) = 5.28×10⁻²⁷ J = 3.3×10⁻⁸ eV。\n由 Δλ/λ = ΔE/E，而 E = 1.24×10³/500 = 2.48 eV，故 Δλ = 500×3.3×10⁻⁸/2.48 = 6.6×10⁻⁶ nm。\n寿命越短能级越宽，谱线越「胖」；寿命趋于无穷时才是理想单色线。\n易错点：漏掉 ħ/2 中的 1/2 得 6.6×10⁻⁸ eV；Δλ 与 ΔE 应成正比，若误用 Δλ = λΔE 会漏掉 E 的除法。"},{"id":"c20q014","type":"choice","difficulty":4,"tags":["类氢离子 He⁺","电离能","莱曼系"],"stem":"He⁺ 是只有一个电子的类氢离子。其基态电离能以及电子从 n = 2 跃迁到 n = 1 所发光的波长约为（E₁(H) = −13.6 eV，hc = 1.24×10³ eV·nm）","options":["54.4 eV，30.4 nm","13.6 eV，30.4 nm","54.4 eV，121.6 nm","54.4 eV，60.8 nm"],"answer":"A","explain":"类氢离子能级 Eₙ = −13.6Z²/n² eV，He⁺ 的 Z = 2，故 E₁ = −54.4 eV，电离能 54.4 eV。\nE₂ = −13.6 eV，ΔE = 54.4 − 13.6 = 40.8 eV（也可写成 54.4×3/4）。\nλ = 1.24×10³/40.8 = 30.4 nm，比氢的莱曼 α 短 4 倍。\n易错点：忘记 Z² = 4 得 13.6 eV；把 He⁺ 的 2→1 与氢的 2→1 混淆得 121.6 nm；60.8 nm 是漏掉 3/4 因子。"},{"id":"c20q015","type":"choice","difficulty":4,"tags":["无限深势阱","波函数节点","跃迁波长"],"stem":"宽 0.200 nm 的一维无限深势阱中，电子处于 n = 3 态。该态波函数节点的位置，以及 n = 3 到 n = 1 跃迁发出的光子波长约为（E₁(0.100 nm) = 37.7 eV，hc = 1.24×10³ eV·nm）","options":["0.0667 nm 和 0.133 nm，16.4 nm","0.0500 nm 和 0.150 nm，16.4 nm","0.0667 nm 和 0.133 nm，5.49 nm","仅 0.100 nm 一处，16.4 nm"],"answer":"A","explain":"ψₙ ∝ sin(nπx/L)，节点满足 nπx/L = kπ（k = 1,…,n−1），n = 3 时 x = L/3、2L/3，即 0.0667 nm 与 0.133 nm。\n宽度加倍时能级反比于 L²：E₁(0.200 nm) = 37.7/4 = 9.42 eV，E₃ = 9E₁ = 84.8 eV。\nΔE = 84.8 − 9.42 = 75.4 eV，λ = 1.24×10³/75.4 = 16.4 nm。\n易错点：节点数记为 n 得 3 个；忘记 L² 缩放直接沿用 37.7 eV 得 5.49 nm。"},{"id":"c20q016","type":"choice","difficulty":4,"tags":["光电效应","光强与饱和电流","量子效率"],"stem":"波长 400 nm、功率 1.00 mW 的单色光垂直照射某光电阴极，若量子效率（每个入射光子产生并逸出的光电子数）为 20%，则饱和光电流约为多少？当光强加倍而频率不变时饱和电流又为多少？","options":["64.5 μA，129 μA","64.5 μA，64.5 μA","322 μA，645 μA","12.9 μA，25.8 μA"],"answer":"A","explain":"每个光子能量 E = hc/λ = 1.24×10³/400 = 3.10 eV = 4.96×10⁻¹⁹ J。\n每秒入射光子数 N = P/E = 1.00×10⁻³/4.96×10⁻¹⁹ = 2.02×10¹⁵ s⁻¹。\n每秒逸出电子数 = 0.20N = 4.03×10¹⁴ s⁻¹，饱和电流 I = ne = 4.03×10¹⁴×1.60×10⁻¹⁹ = 6.45×10⁻⁵ A = 64.5 μA。\n光强加倍只增加光子数、不改变单光子能量，故饱和电流加倍为 129 μA，截止电压不变。\n易错点：漏乘量子效率得 322 μA；把 20% 当成 100% 或除以 5 后再除一次。"},{"id":"c20q017","type":"choice","difficulty":4,"tags":["康普顿散射","180° 散射","最大波长偏移"],"stem":"波长 0.0100 nm 的 γ 光子与自由电子发生 180° 背散射。散射光波长及电子获得的最大动能约为（h/(m₀c) = 2.43×10⁻¹² m，hc = 1.24×10³ eV·nm）","options":["0.0149 nm，40.6 keV","0.0124 nm，40.6 keV","0.0149 nm，83.4 keV","0.00486 nm，124 keV"],"answer":"A","explain":"θ = 180° 时波长偏移最大：Δλ = 2h/(m₀c) = 4.86×10⁻¹² m = 0.00486 nm。\nλ′ = 0.0100 + 0.00486 = 0.01486 nm；E = 1.24×10³/0.0100 = 124 keV，E′ = 1.24×10³/0.01486 = 83.4 keV。\n电子动能 Eₖ = 124 − 83.4 = 40.6 keV，这也是康普顿散射中电子能获得的最大动能。\n易错点：用 1 − cos180° = 0 得 Δλ = 0；把 E′ 当电子动能；用 90° 的系数得 0.0124 nm。"},{"id":"c20q018","type":"choice","difficulty":4,"tags":["玻尔模型","莱曼 α 线","电离判据"],"stem":"氢原子光谱中有一条 121.6 nm 的谱线。该谱线对应的能级差，以及它能否使处于基态的氢原子电离，正确的是（hc = 1.24×10³ eV·nm，E₁ = −13.6 eV）","options":["10.2 eV，不能","10.2 eV，能","3.40 eV，不能","1.89 eV，能"],"answer":"A","explain":"ΔE = hc/λ = 1.24×10³/121.6 = 10.2 eV，等于 13.6(1/1² − 1/2²)，即 n = 2→1 的莱曼 α 线。\n使基态氢电离至少需要 13.6 eV，10.2 eV \u003c 13.6 eV，故该光子不能被基态氢吸收去电离，只能被处于 n = 2 的原子吸收。\n易错点：看到「能量大于某能级差」就判断能电离；把 3.40 eV（n = 2 的电离能）当成谱线能量；1.89 eV 是 Hα 的能级差。"},{"id":"c20q019","type":"choice","difficulty":4,"tags":["斯特恩-盖拉赫实验","自旋磁矩","塞曼能级分裂"],"stem":"银原子束通过非均匀磁场后分裂为两束，说明电子具有自旋。银原子基态磁矩沿磁场方向的分量只能取 ±μ_B（μ_B = 5.79×10⁻⁵ eV/T）。在 B = 1.00 T 的磁场中，两个自旋态的能量差及对应光子的频率约为（h = 6.63×10⁻³⁴ J·s）","options":["1.16×10⁻⁴ eV，28.0 GHz","5.79×10⁻⁵ eV，14.0 GHz","1.16×10⁻⁴ eV，14.0 GHz","2.32×10⁻⁴ eV，56.0 GHz"],"answer":"A","explain":"自旋磁矩在磁场中的能量 U = −μ_zB，两个取向 μ_z = ±μ_B，故 ΔE = 2μ_BB = 2×5.79×10⁻⁵×1.00 = 1.16×10⁻⁴ eV。\n对应频率 ν = ΔE/h = 1.16×10⁻⁴×1.60×10⁻¹⁹/6.63×10⁻³⁴ = 2.80×10¹⁰ Hz = 28.0 GHz（微波波段）。\n分裂成两束而不是三束，正是自旋量子数为 1/2（2s + 1 = 2）的实验证据；若只有轨道角动量，束数应为奇数。\n易错点：漏掉因子 2 得 14.0 GHz；把 ΔE 与 hν 之间漏乘 e（用 eV 直接除 h）会差 10¹⁹ 倍。"},{"id":"c20q020","type":"choice","difficulty":4,"tags":["德布罗意波","电子显微镜","相对论修正"],"stem":"电子显微镜中电子被 100 kV 加速。考虑相对论效应，该电子的德布罗意波长约为（mₑc² = 511 keV，hc = 1.24×10³ eV·nm，非相对论公式给出 3.88×10⁻³ nm）","options":["3.70×10⁻³ nm","3.88×10⁻³ nm","1.23×10⁻³ nm","1.23×10⁻¹ nm"],"answer":"A","explain":"100 keV 已可与 511 keV 相比，必须用相对论能量动量关系：p²c² = K² + 2Kmₑc²。\nK = 100 keV 时 p c = √(100² + 2×100×511) = √112200 = 335 keV。\nλ = hc/(pc) = 1.24×10³/3.35×10⁵ = 3.70×10⁻³ nm = 3.70 pm。\n非相对论值 3.88 pm 偏大 4.6%；相对论修正后波长更短，分辨本领更高，这正是高压电镜的优势。\n易错点：直接用 1.226/√V 而漏掉修正；把 100 kV 当 1 MV 得 1.23 pm。"},{"id":"c20q021","type":"choice","difficulty":5,"tags":["黑体辐射","太阳光度","太阳常数"],"stem":"把太阳视为半径 R = 6.96×10⁸ m、表面温度 5800 K 的黑体，日地距离 r = 1.50×10¹¹ m。太阳的总辐射功率及地球轨道处的太阳常数（垂直于阳光的单位面积功率）约为（σ = 5.67×10⁻⁸ W/(m²·K⁴)）","options":["3.9×10²⁶ W，1.4×10³ W/m²","3.9×10²⁶ W，5.5×10³ W/m²","6.2×10⁷ W，1.4×10³ W/m²","3.9×10²⁶ W，4.4×10² W/m²"],"answer":"A","explain":"表面辐射出射度 M = σT⁴ = 5.67×10⁻⁸×(5.80×10³)⁴ = 6.4×10⁷ W/m²。\n总功率 L = 4πR²M = 4π×(6.96×10⁸)²×6.4×10⁷ = 3.9×10²⁶ W。\n太阳常数 S = L/(4πr²) = 3.9×10²⁶/(4π×(1.50×10¹¹)²) = 1.4×10³ W/m²。\n关键在于区分两个面积：发光用太阳表面积 4πR²，接收用半径 r 的球面 4πr²；两者之比 (R/r)² ≈ 2.2×10⁻⁵ 正是 6.4×10⁷ 与 1.4×10³ 的比。\n易错点：只用 πR² 得功率偏小 4 倍；把 M 当总功率得 6.2×10⁷ W。"},{"id":"c20q022","type":"choice","difficulty":5,"tags":["光电效应","光电子德布罗意波","跨知识点"],"stem":"用 200 nm 的紫外光照射逸出功为 4.20 eV 的金属。逸出光电子的最大初动能所对应的德布罗意波长及截止电压约为（hc = 1.24×10³ eV·nm，mₑ = 9.11×10⁻³¹ kg，h = 6.63×10⁻³⁴ J·s）","options":["0.867 nm，2.00 V","0.615 nm，2.00 V","0.867 nm，6.20 V","1.23 nm，2.00 V"],"answer":"A","explain":"光子能量 E = 1.24×10³/200 = 6.20 eV，故 Eₖ = 6.20 − 4.20 = 2.00 eV，截止电压 U = 2.00 V。\n由 Eₖ = p²/2mₑ 得 p = √(2×9.11×10⁻³¹×2.00×1.60×10⁻¹⁹) = 7.64×10⁻²⁵ kg·m/s。\nλ = h/p = 6.63×10⁻³⁴/7.64×10⁻²⁵ = 8.67×10⁻¹⁰ m = 0.867 nm，与 X 射线同量级，可用晶体衍射验证。\n易错点：用 6.20 eV 算波长得 0.615 nm（忘记减去逸出功）；把截止电压写成 6.20 V；1.23 nm 对应 1.00 eV。"},{"id":"c20q023","type":"choice","difficulty":5,"tags":["康普顿散射","动量守恒","反冲角"],"stem":"波长 0.0500 nm 的 X 射线被静止自由电子散射，散射角 90°。反冲电子与入射方向之间的夹角及电子动能约为（h/(m₀c) = 2.43×10⁻¹² m，hc = 1.24×10³ eV·nm）","options":["43.6°，1.15 keV","46.4°，1.15 keV","43.6°，0.575 keV","21.8°，1.15 keV"],"answer":"A","explain":"Δλ = 0.00243 nm，λ′ = 0.05243 nm；p = h/λ 得 p₀ = 1.33×10⁻²³、p′ = 1.26×10⁻²³ kg·m/s。\nθ = 90° 时入射光子沿 x、散射光子沿 y，电子动量分量为 (p₀, −p′)，故 tanφ = p′/p₀ = λ₀/λ′ = 0.0500/0.05243 = 0.954，φ = 43.6°。\n电子动量大小 pₑ = √(p₀² + p′²) = 1.83×10⁻²³ kg·m/s，Eₖ = pₑ²/(2mₑ) = 1.15 keV，与光子能量差 24.8 − 23.7 = 1.1 keV 一致。\n易错点：把 φ 当成散射角本身；用 sin/cos 弄反分量；漏掉 90° 时两动量垂直这一几何关系。"},{"id":"c20q024","type":"choice","difficulty":5,"tags":["玻尔模型","德布罗意驻波条件","轨道量子化"],"stem":"氢原子基态轨道半径 r₁ = 5.29×10⁻¹¹ m，基态电子速率 v₁ = 2.19×10⁶ m/s。n = 2 轨道上电子的德布罗意波长与轨道周长的关系为（h = 6.63×10⁻³⁴ J·s，mₑ = 9.11×10⁻³¹ kg）","options":["6.65×10⁻¹⁰ m，2πr₂ = 2λ","3.32×10⁻¹⁰ m，2πr₂ = λ","6.65×10⁻¹⁰ m，2πr₂ = λ","1.33×10⁻⁹ m，2πr₂ = 3λ"],"answer":"A","explain":"玻尔模型中 rₙ ∝ n²、vₙ ∝ 1/n，故 r₂ = 4r₁ = 2.12×10⁻¹⁰ m，v₂ = v₁/2 = 1.10×10⁶ m/s。\nλ₂ = h/(mₑv₂) = 6.63×10⁻³⁴/(9.11×10⁻³¹×1.10×10⁶) = 6.65×10⁻¹⁰ m。\n2πr₂ = 2π×2.12×10⁻¹⁰ = 1.33×10⁻⁹ m = 2λ₂，即轨道周长恰为波长的整数倍——这就是德布罗意驻波条件 2πr = nλ 的体现。\n易错点：用 r₁ 算 λ 得 3.32×10⁻¹⁰ m；把「周长等于波长」的 n = 1 条件错用到 n = 2。"},{"id":"c20q025","type":"choice","difficulty":5,"tags":["类氢离子","能级缩放","波长巧合"],"stem":"He⁺ 中电子从 n = 4 跃迁到 n = 2。该谱线波长与氢原子哪条谱线相同？","options":["121.6 nm，与氢原子 2→1 的莱曼 α 线相同","30.4 nm，与氢原子 2→1 相同","60.8 nm，与氢原子 3→2 相同","243 nm，与氢原子 2→1 相同"],"answer":"A","explain":"He⁺ 的能级为 Eₙ = −54.4/n² eV，ΔE = 54.4(1/4 − 1/16) = 54.4×0.1875 = 10.2 eV。\n氢原子 2→1 的能级差为 13.6(1 − 1/4) = 10.2 eV，两者恰好相等，故波长同为 121.6 nm。\n原因是 Z²[1/2² − 1/4²] = 4×3/16 = 3/4 = [1/1² − 1/2²]，这是 4→2 与 2→1 之间的巧合，不是普遍规律。\n易错点：只记得「He⁺ 波长比氢短 4 倍」，于是错答 30.4 nm；或把 4→2 当成 2→1 处理。"},{"id":"c20q026","type":"choice","difficulty":5,"tags":["不确定关系","单缝衍射","横向动量"],"stem":"波长 0.0500 nm 的电子束垂直入射到宽 1.00 μm 的单缝上，屏幕上出现衍射图样。第一极小的衍射角，以及该方向上电子横向动量的不确定度约为（h = 6.63×10⁻³⁴ J·s）","options":["5.00×10⁻⁵ rad，6.63×10⁻²⁸ kg·m/s","5.00×10⁻⁵ rad，1.33×10⁻²⁷ kg·m/s","2.50×10⁻⁵ rad，3.32×10⁻²⁸ kg·m/s","5.00×10⁻⁵ rad，5.28×10⁻²⁹ kg·m/s"],"answer":"A","explain":"单缝第一极小满足 sinθ = λ/a = 5.00×10⁻¹¹/1.00×10⁻⁶ = 5.00×10⁻⁵，θ 很小故 θ ≈ 5.00×10⁻⁵ rad。\n电子动量 p = h/λ = 6.63×10⁻³⁴/5.00×10⁻¹¹ = 1.33×10⁻²³ kg·m/s。\n衍射使电子获得横向动量，量级 Δp_y ≈ pθ = 1.33×10⁻²³×5.00×10⁻⁵ = 6.63×10⁻²⁸ kg·m/s。\n验证：Δp_yΔy ≈ 6.63×10⁻²⁸×1.00×10⁻⁶ = 6.6×10⁻³⁴ ≈ h > ħ/2，不确定关系满足；若把缝宽当 Δy，ħ/(2Δy) = 5.3×10⁻²⁹，衍射给出的横向动量比它大 12 倍，说明「缝宽」只是 Δy 的上限。\n易错点：漏乘 p 只报角度；把 Δp = pθ/2；用 ħ/2a 直接当答案。"},{"id":"c20q027","type":"choice","difficulty":5,"tags":["隧道效应","扫描隧道显微镜","透射系数"],"stem":"扫描隧道显微镜的针尖与样品间势垒高度（功函数）约为 4.0 eV。当间距由 0.20 nm 减小到 0.10 nm 时，电子隧道电流约增大为原来的多少倍（取 T ∝ exp(−2κa)，κ = √(2mφ)/ħ）？","options":["7.8 倍","3.9 倍","61 倍","2.0 倍"],"answer":"A","explain":"κ = √(2×9.11×10⁻³¹×4.0×1.60×10⁻¹⁹)/1.055×10⁻³⁴ = √(1.166×10⁻⁴⁸)/1.055×10⁻³⁴ = 1.02×10¹⁰ m⁻¹。\n2κa 在 a = 0.20 nm 时为 2×1.02×10¹⁰×2.0×10⁻¹⁰ = 4.09，T ∝ e⁻⁴·⁰⁹；a = 0.10 nm 时为 2.05，T ∝ e⁻²·⁰⁵。\n电流比 = e^(4.09−2.05) = e^2.04 = 7.7，约 7.8 倍——间距变化 0.1 nm（约一个原子直径）电流就变近 8 倍，这就是 STM 能分辨单个原子的原因。\n易错点：只算 e^κa 得 3.9；把 κ 中的 m 用质子质量；漏掉指数上的因子 2。"},{"id":"c20q028","type":"choice","difficulty":5,"tags":["黑体辐射","双星系统","光度比"],"stem":"两颗恒星均可视为黑体：A 的表面温度是 B 的 3 倍，半径是 B 的 2 倍。它们辐射峰值波长之比 λ_A/λ_B 与总辐射功率之比 L_A/L_B 为","options":["1/3，324","1/3，81","3，324","1/3，144"],"answer":"A","explain":"由 λ_mT = b 得 λ ∝ 1/T，故 λ_A/λ_B = T_B/T_A = 1/3。\n由 L = 4πR²σT⁴ 得 L_A/L_B = (R_A/R_B)²(T_A/T_B)⁴ = 2²×3⁴ = 4×81 = 324。\n温度只由峰值波长决定，与半径无关；而光度同时含 R² 与 T⁴，两个因子必须都算。\n易错点：只算 T⁴ 得 81（漏 R²）；把波长比写成 3；用 T²R² 得 144。"},{"id":"c20q029","type":"choice","difficulty":5,"tags":["光电效应","反向电压","最大初速"],"stem":"用 250 nm 的光照射逸出功 2.00 eV 的阴极，测得饱和光电流。若在阳极与阴极间加 1.00 V 的反向电压（遏止电压方向），能到达阳极的电子最大动能及最大速率约为（hc = 1.24×10³ eV·nm，mₑ = 9.11×10⁻³¹ kg）","options":["1.96 eV，8.3×10⁵ m/s","2.96 eV，1.0×10⁶ m/s","1.96 eV，5.9×10⁵ m/s","3.96 eV，1.2×10⁶ m/s"],"answer":"A","explain":"光子能量 E = 1.24×10³/250 = 4.96 eV，最大初动能 Eₖ = 4.96 − 2.00 = 2.96 eV（截止电压 2.96 V）。\n加 1.00 V 反向电压后，电子到达阳极前损失 1.00 eV，剩余 Eₖ′ = 1.96 eV。\n由 Eₖ′ = ½mₑv² 得 v = √(2×1.96×1.60×10⁻¹⁹/9.11×10⁻³¹) = √(6.88×10¹¹) = 8.3×10⁵ m/s。\n注意反向电压小于截止电压，仍有电子到达阳极，只是速率分布整体下移，光电流减小而不为零。\n易错点：忘记减去反向电压做的功得 2.96 eV；把 1.96 eV 误当 0.98 eV；把反向电压与截止电压相加得 3.96 eV。"},{"id":"c20q030","type":"choice","difficulty":5,"tags":["康普顿散射","最大能量转移","临界条件"],"stem":"入射光子波长恰等于康普顿波长 λ_C = h/(m₀c) = 0.00243 nm。散射角为 180° 时，散射光波长及电子获得的动能约为（hc = 1.24×10³ eV·nm）","options":["0.00729 nm，340 keV","0.00486 nm，170 keV","0.00729 nm，510 keV","0.00486 nm，255 keV"],"answer":"A","explain":"λ₀ = λ_C 时，Δλ_max = 2λ_C，故 λ′ = λ_C + 2λ_C = 3λ_C = 0.00729 nm。\nE = hc/λ₀ = 1.24×10³/0.00243 = 510 keV，E′ = hc/λ′ = 1.24×10³/0.00729 = 170 keV。\n电子动能 = 510 − 170 = 340 keV，占入射能量的 2/3，这是康普顿散射单次能转移的上限。\n易错点：把 λ′ 写成 2λ_C（漏掉原波长）；把散射光子能量当电子动能；用 90° 的 Δλ = λ_C 得 0.00486 nm。"},{"id":"c20q031","type":"choice","difficulty":5,"tags":["玻尔模型","谱线系","跃迁组合"],"stem":"大量氢原子被激发到 n = 4 能级后自发辐射。可能发出的谱线条数，以及其中最长和最短的波长约为（E₁ = −13.6 eV，hc = 1.24×10³ eV·nm）","options":["6 条，1876 nm 和 97.3 nm","6 条，97.3 nm 和 1876 nm","3 条，1876 nm 和 97.3 nm","4 条，656 nm 和 91.2 nm"],"answer":"A","explain":"n = 4 向下跃迁的组合数为 C(4,2) = 6 条：4→3、4→2、4→1、3→2、3→1、2→1。\n最长波长对应最小能级差 4→3：ΔE = 13.6(1/9 − 1/16) = 0.661 eV，λ = 1.24×10³/0.661 = 1876 nm（帕邢系，红外）。\n最短波长对应最大能级差 4→1：ΔE = 13.6(1 − 1/16) = 12.75 eV，λ = 1.24×10³/12.75 = 97.3 nm（莱曼系）。\n易错点：只数到 n = 1 的 3 条；把最长最短弄反；用 91.2 nm（系限，n = ∞→1）。"},{"id":"c20q032","type":"choice","difficulty":5,"tags":["德布罗意波","布拉格衍射","戴维孙-革末实验"],"stem":"戴维孙-革末实验中，54 V 加速的电子束垂直入射到镍单晶表面，晶面间距 d = 0.215 nm。第一级衍射极大对应的掠射角 θ（满足 2d sinθ = λ）约为（h = 6.63×10⁻³⁴ J·s，mₑ = 9.11×10⁻³¹ kg，e = 1.60×10⁻¹⁹ C）","options":["22.8°","11.4°","45.6°","50.9°"],"answer":"A","explain":"λ = h/√(2mₑeU) = 6.63×10⁻³⁴/√(2×9.11×10⁻³¹×1.60×10⁻¹⁹×54) = 6.63×10⁻³⁴/4.00×10⁻²⁴ = 1.67×10⁻¹⁰ m。\n由 2d sinθ = λ 得 sinθ = 1.67×10⁻¹⁰/(2×2.15×10⁻¹⁰) = 0.388，θ = 22.8°。\n实验测得的衍射角与该值吻合，是电子具有波动性的直接证据；把电压换成 54 V 的平方根关系也说明 λ ∝ 1/√U。\n易错点：用 d sinθ = λ 得 50.9°；把 sinθ 当 θ 得 0.388 rad = 22.2°（近似但非本题所问）；漏掉因子 2 得 45.6°。"},{"id":"c20q033","type":"choice","difficulty":5,"tags":["不确定关系","零点能","库仑势求极值"],"stem":"用不确定关系估算氢原子基态：取电子位置不确定度 r、动量 p ≈ ħ/r，总能量 E(r) = ħ²/(2mₑr²) − e²/(4πε₀r)。使 E 取极小值的半径及对应的基态能量约为","options":["5.29×10⁻¹¹ m，−13.6 eV","5.29×10⁻¹¹ m，−27.2 eV","2.65×10⁻¹¹ m，−13.6 eV","1.06×10⁻¹⁰ m，−3.40 eV"],"answer":"A","explain":"对 r 求导：dE/dr = −ħ²/(mₑr³) + e²/(4πε₀r²) = 0，得 r₀ = 4πε₀ħ²/(mₑe²) = 5.29×10⁻¹¹ m，正是玻尔半径 a₀。\n代回：动能项 = ħ²/(2mₑr₀²) = 13.6 eV，势能项 = −e²/(4πε₀r₀) = −27.2 eV，故 E = −13.6 eV。\n这解释了为什么原子不会「塌缩」：电子再靠近，动能项 ħ²/2mₑr² 增长比库仑吸引更快，能量反而升高，零点能提供了支撑。\n易错点：把势能写成 −13.6 eV 得 −27.2 eV；把 r 取成 a₀ 的一半；用 E = −3.40 eV（n = 2）。"},{"id":"c20q034","type":"choice","difficulty":5,"tags":["波函数归一化","概率密度","势阱基态"],"stem":"一维无限深势阱（0 \u003c x \u003c L）中粒子的基态波函数为 ψ = A sin(πx/L)。归一化常量 A 及粒子出现在 0 \u003c x \u003c L/3 内的概率约为","options":["√(2/L)，0.196","√(1/L)，0.196","√(2/L)，0.333","2/L，0.196"],"answer":"A","explain":"归一化：∫₀^L A²sin²(πx/L)dx = A²·L/2 = 1，故 A = √(2/L)。\n概率 P = ∫₀^(L/3)(2/L)sin²(πx/L)dx = (1/π)[πx/L − ½sin(2πx/L)]₀^(L/3)。\n代入 x = L/3：P = 1/3 − (1/2π)sin(2π/3) = 0.3333 − 0.1378 = 0.196。\n概率密度在阱中央最大、两端为零，故前 1/3 区间的概率明显小于 1/3。\n易错点：用 A = √(1/L)（把 sin² 的平均值当成 1）；直接答 1/3（认为均匀分布）；A = 2/L 漏根号。"},{"id":"c20q035","type":"choice","difficulty":5,"tags":["波函数归一化","高斯波包","概率计算"],"stem":"谐振子基态波函数为 ψ = A e^(−x²/(2a²))（a 为常数）。归一化常量 A 及粒子出现在 |x| \u003c a 内的概率约为","options":["1/(π^(1/4)√a)，0.843","1/(π^(1/2)a)，0.843","1/(π^(1/4)√a)，0.683","1/(π^(1/4)√a)，0.954"],"answer":"A","explain":"∫e^(−x²/a²)dx = a√π，故 A²a√π = 1，A = 1/(π^(1/4)√a) = (πa²)^(−1/4)。\n概率 P = A²∫₋ₐ^a e^(−x²/a²)dx，令 u = x/a 化为 (1/√π)∫₋₁¹e^(−u²)du = erf(1)。\nerf(1) = 0.843，即约 84% 的概率落在 |x| \u003c a 内；|x| \u003c 2a 时约 95.4%。\n注意这里的 a 不是标准差：概率密度 ∝ e^(−x²/a²) 的标准差为 a/√2，故 0.683 是 |x| \u003c a/√2 的概率。\n易错点：把 a 当 σ 答 0.683；把 A 写成 1/(π^(1/2)a)；漏开四次方。"},{"id":"c20q036","type":"calc","difficulty":4,"tags":["黑体辐射","发射率","维恩位移"],"stem":"白炽灯钨丝可视为温度 2800 K 的灰体，发射率 ε = 0.35，灯丝表面积 1.00 cm²。求：(1) 辐射峰值波长；(2) 灯丝总辐射功率；(3) 若温度升高到 3000 K，辐射功率变为多少（发射率不变）？","options":[],"answer":"(1) 1.04 μm；(2) 1.2×10² W；(3) 1.6×10² W","explain":"(1) λ_m = b/T = 2.898×10⁻³/2800 = 1.04×10⁻⁶ m = 1.04 μm，位于红外，肉眼看不见，这是白炽灯效率低的根本原因。\n(2) 灰体辐射功率 P = εσT⁴S，T⁴ = 6.15×10¹³ K⁴，σT⁴ = 3.49×10⁶ W/m²，P = 0.35×3.49×10⁶×1.00×10⁻⁴ = 1.2×10² W。\n(3) 功率 ∝ T⁴：P′ = 122×(3000/2800)⁴ = 122×1.32 = 1.6×10² W。\n易错点：忘记乘发射率 ε；把 1.00 cm² 当成 1.00 m²；把峰值波长用 nm 表示时漏换单位。"},{"id":"c20q037","type":"calc","difficulty":4,"tags":["光电效应","截止电压","遏制频率"],"stem":"用波长 300 nm 的紫外光照射逸出功为 2.20 eV 的金属。求：(1) 光电子的最大初动能与截止电压；(2) 最大初速率；(3) 该金属的遏制频率与红限波长。","options":[],"answer":"(1) 1.93 eV，1.93 V；(2) 8.24×10⁵ m/s；(3) 5.31×10¹⁴ Hz，565 nm","explain":"(1) E = hc/λ = 1.24×10³/300 = 4.13 eV，Eₖ = 4.13 − 2.20 = 1.93 eV，故截止电压 U = Eₖ/e = 1.93 V。\n(2) 由 Eₖ = ½mₑv²：v = √(2×1.93×1.60×10⁻¹⁹/9.11×10⁻³¹) = √(6.78×10¹¹) = 8.24×10⁵ m/s，远小于 c，非相对论处理自洽。\n(3) hν₀ = W：ν₀ = 2.20×1.60×10⁻¹⁹/6.63×10⁻³⁴ = 5.31×10¹⁴ Hz，λ₀ = c/ν₀ = 3.00×10⁸/5.31×10¹⁴ = 5.65×10⁻⁷ m = 565 nm。\n易错点：把截止电压与光子能量混为一谈；用 ½mv² 时忘记把 eV 换成 J。"},{"id":"c20q038","type":"calc","difficulty":4,"tags":["康普顿散射","动量守恒","电子反冲"],"stem":"波长 0.0700 nm 的 X 射线被静止自由电子散射，散射角 90°。求：(1) 散射光波长；(2) 散射光子能量与电子动能；(3) 反冲电子的动量大小。","options":[],"answer":"(1) 0.0724 nm；(2) 17.1 keV 和 0.59 keV；(3) 1.32×10⁻²³ kg·m/s","explain":"(1) Δλ = (h/m₀c)(1 − cos90°) = 2.43×10⁻¹² m = 0.00243 nm，λ′ = 0.0700 + 0.00243 = 0.0724 nm。\n(2) E = 1.24×10³/0.0700 = 17.7 keV，E′ = 1.24×10³/0.07243 = 17.1 keV，电子动能 Eₖ = 17.7 − 17.1 = 0.59 keV。\n(3) 90° 散射时电子动量与光子动量构成直角三角形：pₑ = √(p₀² + p′²)，p₀ = h/λ₀ = 9.47×10⁻²⁴、p′ = h/λ′ = 9.16×10⁻²⁴ kg·m/s，得 pₑ = 1.32×10⁻²³ kg·m/s。\n校验：pₑ²/(2mₑ) = 9.5×10⁻¹⁷ J = 0.59 keV，与能量差一致。\n易错点：把 Δλ 加到 λ′ 上后又加一次；认为电子动量等于光子动量之差（标量相减）。"},{"id":"c20q039","type":"calc","difficulty":4,"tags":["不确定关系","单缝衍射","德布罗意波"],"stem":"波长 0.100 nm 的电子束垂直入射到宽 0.500 μm 的单缝，缝后 1.00 m 处放屏。求：(1) 中央明纹第一极小的位置到中心的距离；(2) 电子横向动量不确定度（取 Δp_y ≈ pθ）；(3) 若把缝宽当作位置不确定度 Δy，判断 ΔyΔp_y 是否满足不确定关系。","options":[],"answer":"(1) 0.200 mm；(2) 1.33×10⁻²⁷ kg·m/s；(3) ΔyΔp_y ≈ 6.6×10⁻³⁴ J·s ≈ h > ħ/2，满足","explain":"(1) 第一极小 sinθ = λ/a = 1.00×10⁻¹⁰/5.00×10⁻⁷ = 2.00×10⁻⁴，θ 很小，屏上距离 y = Dθ = 1.00×2.00×10⁻⁴ = 2.00×10⁻⁴ m = 0.200 mm。\n(2) p = h/λ = 6.63×10⁻³⁴/1.00×10⁻¹⁰ = 6.63×10⁻²⁴ kg·m/s，Δp_y ≈ pθ = 6.63×10⁻²⁴×2.00×10⁻⁴ = 1.33×10⁻²⁷ kg·m/s。\n(3) ΔyΔp_y = 5.00×10⁻⁷×1.33×10⁻²⁷ = 6.6×10⁻³⁴ J·s，恰为 h，大于 ħ/2 = 5.3×10⁻³⁵ J·s，故不违背不确定关系。\n说明：衍射角给的是横向动量的「典型值」，而 ħ/2 是理论下限，两者相差一个量级属于估算的正常范围。\n易错点：把缝宽与屏距混用；用 Δp = pλ/a² 之类的错误量纲；把 h 与 ħ 混用。"},{"id":"c20q040","type":"calc","difficulty":4,"tags":["玻尔模型","轨道半径与速率","电离能"],"stem":"氢原子中电子处于 n = 2 的轨道。已知 r₁ = 5.29×10⁻¹¹ m，v₁ = 2.19×10⁶ m/s，E₁ = −13.6 eV。求：(1) r₂ 与 v₂；(2) 该态的电子动能与电势能；(3) 使该态氢原子电离所需光子的最大波长。","options":[],"answer":"(1) 2.12×10⁻¹⁰ m，1.10×10⁶ m/s；(2) 3.40 eV 和 −6.80 eV；(3) 365 nm","explain":"(1) 玻尔模型中 rₙ = n²r₁、vₙ = v₁/n：r₂ = 4×5.29×10⁻¹¹ = 2.12×10⁻¹⁰ m，v₂ = 1.10×10⁶ m/s。\n(2) Eₖ = ½mₑv₂² = ½×9.11×10⁻³¹×(1.10×10⁶)² = 5.5×10⁻¹⁹ J = 3.40 eV；由 E₂ = Eₖ + Eₚ = −3.40 eV 得 Eₚ = −6.80 eV（且 Eₚ = −2Eₖ）。\n(3) 电离需 3.40 eV，λ_max = hc/ΔE = 1.24×10³/3.40 = 365 nm，即巴耳末系的系限波长。\n易错点：把 Eₚ 写成 −3.40 eV；用电离能 13.6 eV 算得 91.2 nm（那是从基态电离）。"},{"id":"c20q041","type":"calc","difficulty":5,"tags":["不确定关系","零点能","符号推导与极值"],"stem":"用不确定关系估算氢原子基态。设电子到核的距离约为 r，动量大小约为 ħ/r，总能量为 E(r) = ħ²/(2mₑr²) − e²/(4πε₀r)。(1) 求使 E 最小的 r₀（用符号表示）；(2) 求基态能量 E_min 的符号表达式与数值；(3) 说明为什么原子不会因库仑吸引而塌缩。","options":[],"answer":"(1) r₀ = 4πε₀ħ²/(mₑe²) = 5.29×10⁻¹¹ m；(2) E_min = −mₑe⁴/[2(4πε₀)²ħ²] = −13.6 eV；(3) 见解析","explain":"(1) dE/dr = −ħ²/(mₑr³) + e²/(4πε₀r²) = 0，两边乘 r³ 得 r₀ = 4πε₀ħ²/(mₑe²)，数值 5.29×10⁻¹¹ m，与玻尔半径一致。\n(2) 代回：动能 ħ²/(2mₑr₀²) = mₑe⁴/[2(4πε₀)²ħ²] = 13.6 eV，势能 −e²/(4πε₀r₀) = −27.2 eV，故 E_min = −13.6 eV。\n(3) r → 0 时动能项 ∝ r⁻² 比势能项 ∝ r⁻¹ 增长更快，E(r) → +∞，能量在 r₀ 处有极小值而不是单调下降，所以电子不会塌缩到核上；这部分不可消除的最小动能就是零点能。\n易错点：求导时把 ħ²/(2mₑr²) 的系数 2 漏掉，得 r₀ 相差 2 倍；把 E_min 写成 −27.2 eV（只算势能）。"},{"id":"c20q042","type":"calc","difficulty":5,"tags":["无限深势阱","驻波条件推导","能级公式"],"stem":"(1) 用德布罗意驻波条件推导一维无限深势阱（宽 L）的能级公式 Eₙ = n²h²/(8mL²)；(2) 求宽 0.100 nm 的阱中电子的 E₁、E₂；(3) 求 n = 2 到 n = 1 跃迁所发光的波长；(4) 说明为什么 n = 0 不被允许。","options":[],"answer":"(1) 见推导；(2) E₁ = 37.7 eV，E₂ = 151 eV；(3) 11.0 nm；(4) n = 0 给 ψ ≡ 0，无粒子","explain":"(1) 阱壁处波函数必须为零，故阱内形成驻波：n(λ/2) = L，即 λ = 2L/n（n = 1,2,3…）。\n由 p = h/λ 得 p = nh/(2L)，E = p²/(2m) = n²h²/(8mL²)，能级与 n² 成正比、与 L² 成反比。\n(2) E₁ = (6.63×10⁻³⁴)²/(8×9.11×10⁻³¹×1.00×10⁻²⁰) = 6.03×10⁻¹⁸ J = 37.7 eV，E₂ = 4E₁ = 151 eV。\n(3) ΔE = 3E₁ = 113 eV，λ = 1.24×10³/113 = 11.0 nm。\n(4) n = 0 时 λ → ∞、p = 0，但 ψ = A sin(0) ≡ 0 无法归一化，物理上对应「阱中没有粒子」；因此最低能量 E₁ ≠ 0，这就是零点能。\n易错点：把驻波条件写成 nλ = L 得 E 差 4 倍；用 h 与 ħ 混算。"},{"id":"c20q043","type":"calc","difficulty":5,"tags":["康普顿散射","最大偏移证明","相对论反冲电子"],"stem":"(1) 由康普顿公式说明波长偏移的最大值及对应散射角；(2) 入射光子波长 0.00243 nm，求 180° 散射时散射光波长、光子能量损失与电子动能；(3) 求该反冲电子的速率（用 c 表示）。","options":[],"answer":"(1) Δλ_max = 2h/(m₀c) = 4.86×10⁻¹² m，θ = 180°；(2) 0.00729 nm，340 keV；(3) 0.800c","explain":"(1) Δλ = (h/m₀c)(1 − cosθ)，1 − cosθ 在 θ = 180° 取最大值 2，故 Δλ_max = 2h/(m₀c) = 2×2.43×10⁻¹² = 4.86×10⁻¹² m。\n(2) λ′ = 0.00243 + 0.00486 = 0.00729 nm；E = 510 keV，E′ = 1.24×10³/0.00729 = 170 keV，电子动能 Eₖ = 340 keV。\n(3) 相对论下 γ = 1 + Eₖ/(mₑc²) = 1 + 340/511 = 1.665，β = √(1 − 1/γ²) = √(1 − 0.361) = 0.800，即 v = 0.800c。\n注意此处电子速率已达 0.8c，用 ½mv² 会得到 1.1c 的错误结果，必须用相对论关系。\n易错点：把 Δλ_max 写成 h/(m₀c)；用非相对论动能公式求速率。"},{"id":"c20q044","type":"calc","difficulty":5,"tags":["玻尔模型","谱线系","跃迁组合"],"stem":"氢原子中大量电子被激发到 n = 4 能级。求：(1) 可能发出的谱线条数；(2) 最长波长与最短波长及其所属线系；(3) 其中属于巴耳末系的谱线条数与最短波长。","options":[],"answer":"(1) 6 条；(2) 1876 nm（帕邢系）与 97.3 nm（莱曼系）；(3) 2 条，最短 486 nm","explain":"(1) 从 n = 4 向下的跃迁组合数为 C(4,2) = 6：4→3、4→2、4→1、3→2、3→1、2→1。\n(2) 波长最长对应最小能级差 4→3：ΔE = 13.6(1/9 − 1/16) = 0.661 eV，λ = 1876 nm，属帕邢系；\n最短对应最大能级差 4→1：ΔE = 13.6(1 − 1/16) = 12.75 eV，λ = 97.3 nm，属莱曼系。\n(3) 终态 n = 2 的有 4→2（λ = 486 nm）与 3→2（656 nm）两条，最短为 486 nm。\n易错点：只数直接到基态的跃迁；把 4→3 的 1876 nm 与 4→2 的 486 nm 弄混；用系限 365 nm。"},{"id":"c20q045","type":"calc","difficulty":5,"tags":["类氢原子","约化质量修正","μ 子氢"],"stem":"把一个 μ 子（质量 m_μ = 207mₑ）俘获到质子周围形成「μ 子氢」。取质子质量 M = 1836mₑ。(1) 求系统的约化质量（用 mₑ 表示）；(2) 求基态能量与基态轨道半径；(3) 求 2→1 跃迁光子波长。","options":[],"answer":"(1) μ = 186mₑ；(2) E₁ = −2.53 keV，r₁ = 2.84×10⁻¹³ m；(3) 0.653 nm","explain":"(1) μ = m_μM/(m_μ + M) = 207×1836/(207 + 1836) mₑ = 380052/2043 mₑ = 186mₑ。\n(2) 类氢能级正比于约化质量：E₁ = −13.6×(186/1) eV = −2.53×10³ eV = −2.53 keV；半径反比于约化质量：r₁ = 5.29×10⁻¹¹×(1/186) = 2.84×10⁻¹³ m。\n(3) ΔE = 0.75×2.53 keV = 1.90 keV，λ = hc/ΔE = 1.24×10³/1.90×10³ = 0.653 nm。\nμ 子轨道比电子轨道小 186 倍，几乎贴着核，因此 μ 子氢常用于检验核半径与 QED 修正。\n易错点：直接用 207mₑ 而忽略约化质量；把 r 与 E 的缩放方向弄反（能级变大、半径变小）。"},{"id":"c20q046","type":"calc","difficulty":5,"tags":["波函数归一化","概率密度","势阱第一激发态"],"stem":"一维无限深势阱（0 \u003c x \u003c L）中粒子处于 n = 2 态，波函数 ψ = A sin(2πx/L)。(1) 求归一化常量 A；(2) 求概率密度最大的位置与节点位置；(3) 求粒子出现在 0 \u003c x \u003c L/4 内的概率。","options":[],"answer":"(1) A = √(2/L)；(2) 最大在 L/4 与 3L/4，节点在 L/2；(3) 0.250","explain":"(1) ∫₀^L A²sin²(2πx/L)dx = A²·L/2 = 1，故 A = √(2/L)。\n(2) |ψ|² = (2/L)sin²(2πx/L)，在 sin² = 1 处最大，即 2πx/L = π/2、3π/2，x = L/4、3L/4；节点满足 2πx/L = kπ，阱内只有 x = L/2。\n(3) P = (2/L)∫₀^(L/4)sin²(2πx/L)dx，用 ∫sin²(kx)dx = x/2 − sin(2kx)/(4k)，k = 2π/L：\n在 x = L/4 处 si
