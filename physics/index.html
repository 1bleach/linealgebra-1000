×10⁻⁵ J","4.50×10⁻⁴ J","1.12×10⁻⁴ J"],"answer":"D","explain":"球外 E = kQ/r²，能量密度 u = ½ε₀E²，积分 W = ∫(R→∞) ½ε₀(kQ/r²)² 4πr² dr = kQ²/(2R)。\n代入：W = 8.99×10⁹×(5.00×10⁻⁸)²/(2×0.100) = 1.12×10⁻⁴ J。\n等价于 W = Q²/(8πε₀R) = ½QV，其中 V = kQ/R = 4.50×10³ V。\n易错点：漏掉 ½ 得 2.25×10⁻⁴ J；多乘 ½ 得 5.62×10⁻⁵ J。"},{"id":"c12q015","type":"calc","difficulty":4,"tags":["电容器网络","节点接地","电荷分配"],"stem":"电容器 C₁ = 2.00 μF、C₂ = 3.00 μF、C₃ = 6.00 μF 连接如下：C₁ 一端接 100 V 电源正极，另一端接节点 M；C₂ 与 C₃ 均接在 M 与地之间。求：(1) 各电容器上的电荷；(2) M 点电势；(3) 若把 M 点直接接地，C₁、C₂ 上的电荷各为多少，并说明电源提供的电荷如何变化。","options":[],"answer":"(1) Q₁ = 1.64×10⁻⁴ C，Q₂ = 5.45×10⁻⁵ C，Q₃ = 1.09×10⁻⁴ C；(2) 18.2 V；(3) Q₁ = 2.00×10⁻⁴ C，Q₂ = 0","explain":"(1) C₂∥C₃：C₂₃ = 9.00 μF，再与 C₁ 串联，C = 2.00×9.00/11.0 = 1.64 μF。\n总电荷 Q = CU = 1.64×10⁻⁶×100 = 1.64×10⁻⁴ C，即 Q₁ = 1.64×10⁻⁴ C；并联部分电压 U_M = Q/C₂₃ = 18.2 V。\nQ₂ = C₂U_M = 5.45×10⁻⁵ C，Q₃ = C₃U_M = 1.09×10⁻⁴ C。\n(3) M 接地后 U_M = 0，C₂、C₃ 上电压为零、电荷为零；C₁ 直接承受 100 V，Q₁ = C₁U = 2.00×10⁻⁴ C。\n判断关键：接地节点把电路钳在零电势，原本由串联分压决定的节点电压被强制改变。"},{"id":"c12q016","type":"choice","difficulty":4,"tags":["分层介质","D连续","场强分布"],"stem":"平行板电容器两极板间由两层厚度均为 1.00 mm 的介质叠放充满，εr1 = 2.00、εr2 = 4.00，极板间总电压为 300 V。两层介质中的场强 E₁、E₂ 分别为","options":["200 kV/m，100 kV/m","100 kV/m，200 kV/m","150 kV/m，150 kV/m","240 kV/m，60.0 kV/m"],"answer":"A","explain":"两层介质中无自由电荷，D 的法向分量连续：D = ε₀εr1E₁ = ε₀εr2E₂，故 E₁/E₂ = εr2/εr1 = 2。\n电压约束：E₁d + E₂d = U，即 2E₂ + E₂ = 300/(1.00×10⁻³) = 3.00×10⁵ V/m。\n解得 E₂ = 1.00×10⁵ V/m，E₁ = 2.00×10⁵ V/m。\n易错点：认为两层的 E 相等（各 150 kV/m）；或把 E 与 εr 成正比（240/60）。"},{"id":"c12q017","type":"choice","difficulty":4,"tags":["球壳连接","能量损失"],"stem":"两个同心薄导体球壳，内球壳半径 a = 0.100 m，外球壳半径 b = 0.200 m。内球壳带电 Q，外球壳不带电。用导线把两球壳连接后，系统静电能损失的比例为","options":["25.0%","50.0%","75.0%","0"],"answer":"B","explain":"连接前：内球壳电荷 Q，外球壳内表面 −Q、外表面 +Q。\n两壳之间能量 = Q²/(8πε₀)(1/a − 1/b)，壳外能量 = Q²/(8πε₀b)，合计 W₀ = Q²/(8πε₀a)。\n连接后电荷全部分布到外球壳外表面（b 处），W = Q²/(8πε₀b)。\n损失比例 = 1 − a/b = 1 − 0.100/0.200 = 50.0%；损失的能量转化为导线中的焦耳热与辐射。\n易错点：只算壳间能量而漏掉壳外能量，会得出 75% 的错误结果。"},{"id":"c12q018","type":"calc","difficulty":4,"tags":["串联耐压","电压分配"],"stem":"C₁ = 2.00 μF、耐压 200 V 与 C₂ = 8.00 μF、耐压 100 V 的电容器串联。求：(1) 该串联组合允许加的最大总电压；(2) 达到最大总电压时各电容器上的电压，并指出哪只电容器先达到耐压极限。","options":[],"answer":"(1) 250 V；(2) U₁ = 200 V，U₂ = 50.0 V，C₁ 先达到耐压极限","explain":"串联时电荷相同，电压与电容成反比：U₁/U₂ = C₂/C₁ = 4。\n若 C₁ 先到 200 V，则 U₂ = 50.0 V \u003c 100 V，安全，总电压 250 V。\n若 C₂ 先到 100 V，则 U₁ = 400 V > 200 V，C₁ 早已击穿，不允许。\n故最大总电压由分压较大的 C₁ 决定：U_max = 200 + 50.0 = 250 V。\n易错点：把两只电容的耐压直接相加得 300 V。"},{"id":"c12q019","type":"choice","difficulty":4,"tags":["恒压插入","能量平衡","外力功"],"stem":"平行板电容器 C₀ = 100 pF，接在 500 V 电源上保持连接。将 εr = 3.00 的介质板充满极板间。此过程中外力对介质板做的功为","options":["+2.50×10⁻⁵ J","−1.25×10⁻⁵ J","−2.50×10⁻⁵ J","+7.50×10⁻⁵ J"],"answer":"C","explain":"插入后 C = εrC₀ = 3.00×10⁻¹⁰ F，ΔQ = (εr−1)C₀U = 1.00×10⁻⁷ C。\n电源做功 W源 = UΔQ = 5.00×10⁻⁵ J；电场能量增量 ΔW = ½(εr−1)C₀U² = 2.50×10⁻⁵ J。\n能量守恒 W外 + W源 = ΔW，故 W外 = 2.50×10⁻⁵ − 5.00×10⁻⁵ = −2.50×10⁻⁵ J，即静电力把介质吸入、外力需反向拉住。\n易错点：只算 ΔW 得 +2.50×10⁻⁵ J；忘记电源做功，误以为外力做正功。"},{"id":"c12q020","type":"choice","difficulty":4,"tags":["尖端放电","导体球连接","击穿"],"stem":"两个半径分别为 1.00 mm 和 4.00 mm 的导体球用细导线连接，带电总量为 Q。空气击穿场强为 3.00×10⁶ V/m，则小球队表面刚要发生击穿时的 Q 约为（k = 8.99×10⁹ N·m²/C²）","options":["6.67 nC","0.334 nC","2.08 nC","1.67 nC"],"answer":"D","explain":"连接后等势，q ∝ R：q₁ = Q R₁/(R₁+R₂)，q₂ = Q R₂/(R₁+R₂)。\n小球表面场强 E₁ = kq₁/R₁² = kQ/[R₁(R₁+R₂)]，大球 E₂ = kQ/[R₂(R₁+R₂)]，E₁/E₂ = R₂/R₁ = 4。\n小球先击穿：令 E₁ = 3.00×10⁶ V/m，得 Q = E₁R₁(R₁+R₂)/k = 3.00×10⁶×1.00×10⁻³×5.00×10⁻³/8.99×10⁹ = 1.67×10⁻⁹ C。\n易错点：以为大球先击穿得 6.67 nC；只用 R₁² 估算得 0.334 nC。"},{"id":"c12q021","type":"calc","difficulty":4,"tags":["能量密度","平行板"],"stem":"平行板电容器 C = 50.0 pF，极板间电压 U = 400 V，板间距 d = 0.200 mm，极板间为空气。求：(1) 极板间的场强 E；(2) 电场能量密度 u；(3) 电容器储存的总能量，并用 u 与极板间体积相乘加以验证。","options":[],"answer":"(1) 2.00×10⁶ V/m；(2) 17.7 J/m³；(3) 4.00×10⁻⁶ J，与 uSd 一致","explain":"E = U/d = 400/0.200×10⁻³ = 2.00×10⁶ V/m。\nu = ½ε₀E² = ½×8.85×10⁻¹²×(2.00×10⁶)² = 17.7 J/m³。\n总能量 W = ½CU² = ½×5.00×10⁻¹¹×400² = 4.00×10⁻⁶ J。\n验证：极板面积 S = Cd/ε₀ = 5.00×10⁻¹¹×2.00×10⁻⁴/8.85×10⁻¹² = 1.13×10⁻³ m²，uSd = 17.7×1.13×10⁻³×2.00×10⁻⁴ = 4.00×10⁻⁶ J。\n易错点：u 中漏掉 ½ 得 35.4 J/m³；把 u 当成总能量。"},{"id":"c12q022","type":"calc","difficulty":4,"tags":["恒压","介质拉出","能量平衡"],"stem":"平行板电容器极板面积 0.0200 m²，板间距 2.00 mm，极板间充满 εr = 4.00 的介质板，接在 1.00 kV 电源上保持连接。现将介质板缓慢完全拉出。求：(1) 电容器储能的变化量；(2) 电源做的功；(3) 外力做的功，并说明能量流向。","options":[],"answer":"(1) 减少 1.33×10⁻⁴ J；(2) 电源做功 −2.66×10⁻⁴ J（吸收能量）；(3) 外力做正功 1.33×10⁻⁴ J","explain":"C₀ = ε₀S/d = 8.85×10⁻¹¹ F，C = εrC₀ = 3.54×10⁻¹⁰ F；U 不变，Q 从 3.54×10⁻⁷ C 减到 8.85×10⁻⁸ C。\nΔW = ½(C₀ − C)U² = ½×(8.85×10⁻¹¹ − 3.54×10⁻¹⁰)×1.00×10⁶ = −1.33×10⁻⁴ J。\n电源做功 W源 = UΔQ = 1.00×10³×(8.85×10⁻⁸ − 3.54×10⁻⁷) = −2.66×10⁻⁴ J。\n能量守恒 W外 + W源 = ΔW，W外 = −1.33×10⁻⁴ + 2.66×10⁻⁴ = 1.33×10⁻⁴ J。\n拉出时静电力把介质往里吸，外力必须克服静电力做正功；同时电容器把 1.33×10⁻⁴ J 能量送回电源，电源共吸收 2.66×10⁻⁴ J。\n易错点：误认为恒压下 ΔW 就是外力功；漏掉电源这个能量通道。"},{"id":"c12q023","type":"choice","difficulty":4,"tags":["导体板插入","等效电容"],"stem":"空气平行板电容器极板面积 0.0100 m²，板间距 5.00 mm。将一块厚 2.00 mm、面积与极板相同的金属板平行插入极板间（不与极板接触）。此时电容约为（ε₀ = 8.85×10⁻¹² F/m）","options":["29.5 pF","17.7 pF","44.3 pF","59.0 pF"],"answer":"A","explain":"金属板内部场强为零，相当于把原来的空气间隙挖去厚度 t，剩余两段空气间隙串联。\n等效间距 d − t = 3.00 mm，C = ε₀S/(d−t) = 8.85×10⁻¹²×0.0100/3.00×10⁻³ = 2.95×10⁻¹¹ F。\n插入位置不影响结果（两段间隙之和固定为 d−t）。\n易错点：用原间距算得 17.7 pF；把金属板当成介质却把厚度加进去得 44.3 pF。"},{"id":"c12q024","type":"choice","difficulty":4,"tags":["球形电容器","内球接地","感应电荷"],"stem":"球形电容器内球半径 5.00 cm，外球壳内半径 10.0 cm。外球壳带电荷 +2.00×10⁻⁸ C，内球接地。内球上的感应电荷为","options":["−2.00×10⁻⁸ C","−1.00×10⁻⁸ C","+1.00×10⁻⁸ C","−5.00×10⁻⁹ C"],"answer":"B","explain":"内球接地，电势为零：V = kq′/R₁ + kQ/R₂ = 0。\n解得 q′ = −Q R₁/R₂ = −2.00×10⁻⁸×0.0500/0.100 = −1.00×10⁻⁸ C。\n物理图像：内球从大地吸收负电荷，使自身电势被拉到零；外球壳上的电荷并非全部被抵消。\n易错点：以为内球感应出 −Q = −2.00×10⁻⁸ C；或按面积比分得 −5.00×10⁻⁹ C。"},{"id":"c12q025","type":"calc","difficulty":4,"tags":["导体板","介质板","束缚电荷"],"stem":"平行板电容器极板面积 0.0200 m²，板间距 6.00 mm，极板间为空气。求：(1) 原电容 C₀；(2) 平行插入一块厚 2.00 mm 的金属板（不与极板接触）后的电容 C₁；(3) 取出金属板，换入一块厚 2.00 mm、εr = 5.00 的介质板后的电容 C₂；(4) 在 (3) 的电容器上加 1.00 kV 电压，求介质板两面上的束缚电荷面密度大小。","options":[],"answer":"(1) 29.5 pF；(2) 44.3 pF；(3) 40.2 pF；(4) 1.61×10⁻⁶ C/m²","explain":"C₀ = ε₀S/d = 8.85×10⁻¹²×0.0200/6.00×10⁻³ = 2.95×10⁻¹¹ F。\n金属板：C₁ = ε₀S/(d−t) = 8.85×10⁻¹²×0.0200/4.00×10⁻³ = 4.43×10⁻¹¹ F。\n介质板：等效间距 d−t+t/εr = 4.00 + 0.400 = 4.40 mm，C₂ = 8.85×10⁻¹²×0.0200/4.40×10⁻³ = 4.02×10⁻¹¹ F。\n(4) 自由电荷面密度 σ = C₂U/S = 4.02×10⁻¹¹×1.00×10³/0.0200 = 2.01×10⁻⁶ C/m²；σ′ = σ(1 − 1/εr) = 1.61×10⁻⁶ C/m²。\n易错点：介质板按金属板算得 44.3 pF；束缚电荷漏掉 (1 − 1/εr) 因子。"},{"id":"c12q026","type":"calc","difficulty":5,"tags":["空腔导体","接地","静电屏蔽"],"stem":"一个不带电的厚导体球壳，内半径 a = 6.00 cm，外半径 b = 10.0 cm。腔内距球心 2.00 cm 处放一点电荷 q = +3.00×10⁻⁸ C。求：(1) 球壳内外表面各带多少电荷；(2) 球壳外距球心 0.150 m 处的场强；(3) 若把球壳接地，外表面电荷变为多少、壳外场强变为多少，腔内电场是否改变；(4) 未接地时球壳的电势（取无穷远为零）。","options":[],"answer":"(1) 内表面 −3.00×10⁻⁸ C，外表面 +3.00×10⁻⁸ C；(2) 1.20×10⁴ V/m，沿径向向外；(3) 外表面 −3.00×10⁻⁸ C，壳外场强为零，腔内电场不变；(4) 2.70×10³ V","explain":"(1) 高斯面取在导体内部，E = 0，故内表面电荷 = −q = −3.00×10⁻⁸ C；导体原不带电，外表面 = +3.00×10⁻⁸ C。\n(2) 壳外场只由外表面电荷决定：E = kq/r² = 8.99×10⁹×3.00×10⁻⁸/0.150² = 1.20×10⁴ V/m。\n(3) 接地后壳电势为零，壳外总电荷必须为零，故外表面为 −q；壳外 E = 0，但腔内电荷与内表面电荷分布不受影响，腔内场不变。\n(4) V壳 = kq/b = 8.99×10⁹×3.00×10⁻⁸/0.100 = 2.70×10³ V；腔内电荷偏离球心只改变内表面分布，不改变壳电势。\n易错点：接地后只让内表面带 −q，忘了外表面也要变为 −q 才能让壳外无场。"},{"id":"c12q027","type":"calc","difficulty":5,"tags":["部分填充","并排与叠放","符号推导"],"stem":"平行板电容器极板面积 S = 0.0200 m²，板间距 d = 2.00 mm，极板间为空气，C₀ = ε₀S/d。用一块厚度为 d、面积 S/2、εr = 4.00 的介质板填充极板间：(a) 并排方式，介质占一半面积、贯穿整个间距；(b) 叠放方式，介质占整个面积、厚度为 d/2。电容器先充电到 1.00 kV 再断开电源，然后分别按两种方式插入介质板。求：(1) 用 C₀ 和 εr 表示 C_a、C_b，并证明 C_a/C_b = (1+εr)²/(4εr)；(2) 两种方式下插入后的电压和储能；(3) 哪种方式储能更低，说明原因。","options":[],"answer":"(1) C_a = C₀(1+εr)/2，C_b = 2εrC₀/(1+εr)，比值 (1+εr)²/(4εr) = 1.56；(2) U_a = 400 V、W_a = 1.77×10⁻⁵ J；U_b = 625 V、W_b = 2.77×10⁻⁵ J；(3) 并排方式储能更低","explain":"(1) 并排为两电容并联：C_a = ε₀(S/2)/d + εrε₀(S/2)/d = C₀(1+εr)/2。\n叠放为两电容串联：C_b = ε₀S/[d/2 + d/(2εr)] = 2εrC₀/(1+εr)。\n两者之比 C_a/C_b = (1+εr)²/(4εr)，εr = 4 时为 25/16 = 1.56。\n(2) Q = C₀U₀ = 8.85×10⁻¹¹×1.00×10³ = 8.85×10⁻⁸ C，Q 不变：U_a = Q/C_a = 400 V，U_b = Q/C_b = 625 V。\nW = Q²/(2C)：W_a = 1.77×10⁻⁵ J，W_b = 2.77×10⁻⁵ J。\n(3) 恒电荷下 W ∝ 1/C，并排方式电容更大，故储能更低；两种方式中介质都被吸入，并排方式电场做的功更多。"},{"id":"c12q028","type":"calc","difficulty":5,"tags":["恒压与恒电荷","外力功","符号推导"],"stem":"平行板电容器电容为 C₀，极板间为空气，充电到电压 U₀ 后：(I) 保持与电源连接，将 εr 的介质板充满极板间；(II) 先断开电源，再插入同样的介质板。求两种情况下：(1) 电容器储能的变化量；(2) 电源做的功（情况 II 无电源）；(3) 外力对介质板做的功。用 C₀、U₀、εr 表示，并讨论 εr > 1 时外力功的符号与能量流向。","options":[],"answer":"(1) I：½(εr−1)C₀U₀²；II：−½(εr−1)C₀U₀²/εr；(2) I：W源 = (εr−1)C₀U₀²，II：0；(3) I：−½(εr−1)C₀U₀²，II：−½(εr−1)C₀U₀²/εr；两种情况外力都做负功","explain":"I（恒压）：C = εrC₀，ΔQ = (εr−1)C₀U₀，W源 = U₀ΔQ = (εr−1)C₀U₀²。\nΔW = ½(C−C₀)U₀² = ½(εr−1)C₀U₀²。由 W外 + W源 = ΔW 得 W外 = −½(εr−1)C₀U₀²。\nII（恒电荷）：Q = C₀U₀，U = U₀/εr，ΔW = ½Q²(1/C − 1/C₀) = −½(εr−1)C₀U₀²/εr；无电源，W外 = ΔW。\n两种情况 W外 \u003c 0：静电力沿介质进入方向，介质被自动吸入，外力必须反向拉住才能缓慢插入。\n恒压时电源提供 (εr−1)C₀U₀² 的能量，一半储存于电场，另一半由外力回收；恒电荷时能量全部来自电场自身减少。\n易错点：把恒压时 ΔW 直接当作外力功；忽略电源做功，符号与倍数都会错。"},{"id":"c12q029","type":"calc","difficulty":5,"tags":["球形电容器","两层介质","符号推导"],"stem":"球形电容器内球半径 R₁ = 2.00 cm，介质分界面半径 R₂ = 4.00 cm，外球壳内半径 R₃ = 8.00 cm。内层介质 εr1 = 3.00，外层介质 εr2 = 5.00。内球带电荷 Q = +1.00×10⁻⁸ C，外球壳接地。求：(1) 两介质层中的场强表达式；(2) 电容 C 的表达式与数值；(3) 系统静电能；(4) 最大场强出现在何处及其数值。","options":[],"answer":"(1) E₁ = Q/(4πε₀εr1 r²)（R₁\u003cr\u003cR₂），E₂ = Q/(4πε₀εr2 r²)（R₂\u003cr\u003cR₃）；(2) C = 4πε₀/[(1/εr1)(1/R₁−1/R₂)+(1/εr2)(1/R₂−1/R₃)] = 10.3 pF；(3) 4.87×10⁻⁶ J；(4) 内球表面，7.49×10⁴ V/m","explain":"(1) 球对称，D = Q/(4πr²) 在各层连续；E = D/(ε₀εr)，故两层的 E 分别含 εr1、εr2。\n(2) U = ∫E dr = (Q/4πε₀)[(1/εr1)(1/R₁−1/R₂)+(1/εr2)(1/R₂−1/R₃)]，C = Q/U。\n代入：(1/3)(50.0−25.0)+(1/5)(25.0−12.5) = 8.33+2.50 = 10.8 m⁻¹，C = 1.11×10⁻¹⁰/10.8 = 1.03×10⁻¹¹ F。\n(3) W = Q²/(2C) = (1.00×10⁻⁸)²/(2×1.03×10⁻¹¹) = 4.87×10⁻⁶ J。\n(4) E 在内球表面最大：E = kQ/(εr1R₁²) = 8.99×10⁹×1.00×10⁻⁸/(3.00×4.00×10⁻⁴) = 7.49×10⁴ V/m。"},{"id":"c12q030","type":"calc","difficulty":5,"tags":["柱形电容器","两层介质","击穿"],"stem":"同轴圆柱形电容器内导体半径 a = 1.00 cm，介质分界面半径 c = 3.00 cm，外导体内半径 b = 6.00 cm。内层 εr1 = 2.00、击穿场强 1.50×10⁷ V/m，外层 εr2 = 4.00、击穿场强 2.00×10⁷ V/m。求：(1) 单位长度电容；(2) 哪一层先击穿；(3) 最大工作电压。","options":[],"answer":"(1) 7.70×10⁻¹¹ F/m；(2) 内层先击穿；(3) 2.17×10⁵ V","explain":"单位长度：1/C′ = ln(c/a)/(2πε₀εr1) + ln(b/c)/(2πε₀εr2)，C′ = 2πε₀/[ln3/2 + ln2/4] = 5.56×10⁻¹¹/0.7226 = 7.70×10⁻¹¹ F/m。\n界面处 D 连续：εr1E₁(c) = εr2E₂(c)，且各层场强在内半径处最大。\nE₁max/E₂max = (εr2c)/(εr1a) = (4.00×3.00)/(2.00×1.00) = 6；两层击穿场强之比为 1.50/2.00 = 0.75，故内层先达到极限。\n内层击穿时 E₁max = 1.50×10⁷ V/m，D = ε₀εr1E₁max = 2.66×10⁻⁶ C/m²。\nU = (D/ε₀)[ln3/2 + ln2/4] = 3.00×10⁵×0.7226 = 2.17×10⁵ V。\n易错点：只按击穿场强大小判断外层更耐压；忘记场强在内半径处最大。"},{"id":"c12q031","type":"calc","difficulty":5,"tags":["导体球","能量密度积分","符号推导"],"stem":"半径 R 的孤立导体球带电 Q。求：(1) 用能量密度积分证明其静电能 W = Q²/(8πε₀R)；(2) 取 R = 0.150 m、Q = 4.00×10⁻⁸ C 计算 W；(3) 若保持电荷不变把半径增大一倍、或保持半径不变把电荷增大一倍，W 分别变为原来的几倍。","options":[],"answer":"(1) W = ∫(R→∞) ½ε₀E²·4πr² dr = Q²/(8πε₀R)；(2) 4.80×10⁻⁵ J；(3) 半径加倍时 W 减半；电荷加倍时 W 变为 4 倍","explain":"(1) 球外 E = Q/(4πε₀r²)，u = ½ε₀E² = Q²/(32π²ε₀r⁴)。\nW = ∫(R→∞) u·4πr² dr = (Q²/8πε₀)∫(R→∞) dr/r² = Q²/(8πε₀R)。\n(2) W = (4.00×10⁻⁸)²/(8π×8.85×10⁻¹²×0.150) = 4.80×10⁻⁵ J。\n(3) W ∝ Q²/R：R→2R 时 W→W/2；Q→2Q 时 W→4W。\n易错点：积分时漏掉 4πr² 或把 u 写成 ε₀E²；把 W 当成 Q²/(4πε₀R)。"},{"id":"c12q032","type":"calc","difficulty":5,"tags":["静电力","介质板","牛顿定律"],"stem":"平行板电容器极板长 L = 0.200 m、宽 w = 0.200 m（面积 0.0400 m²），板间距 d = 1.00 mm，接在 800 V 电源上保持连接。一块 εr = 4.00、厚度等于 d、质量 m = 2.00 g 的介质板从极板一端无摩擦地插入（插入方向沿极板长度）。求：(1) 介质板受到的静电力；(2) 从静止释放后插入过程的加速度；(3) 完全插入所需时间与末速度。忽略边缘效应。","options":[],"answer":"(1) 1.70×10⁻³ N，方向指向极板内；(2) 0.850 m/s²；(3) 0.686 s，0.583 m/s","explain":"插入深度 x 时 C(x) = C₀ + (εr−1)ε₀wx/d，其中 C₀ = ε₀Lw/d。\ndC/dx = (εr−1)ε₀w/d = 3.00×8.85×10⁻¹²×0.200/1.00×10⁻³ = 5.31×10⁻⁹ F/m。\n恒压下 F = ½U²dC/dx = ½×800²×5.31×10⁻⁹ = 1.70×10⁻³ N，方向使介质进入极板间。\na = F/m = 1.70×10⁻³/2.00×10⁻³ = 0.850 m/s²，为恒力，故匀加速。\nt = √(2L/a) = √(0.400/0.850) = 0.686 s，v = √(2aL) = 0.583 m/s。\n注意：恒压时静电力大小与插入深度无关（dC/dx 为常数），这与恒电荷情形不同。"},{"id":"c12q033","type":"calc","difficulty":5,"tags":["电容式液位计","圆柱电容","分压"],"stem":"电容式液位计由同轴圆柱电极构成：内电极半径 5.00 mm，外电极内半径 20.0 mm，电极总长 L = 1.20 m。液体 εr = 2.50，液面高度 h（0 ≤ h ≤ L）。求：(1) 电容 C 随 h 变化的表达式；(2) h = 0.800 m 时的电容；(3) 灵敏度 dC/dh；(4) 若该电容与 C₀ = 1.00 nF 的固定电容串联接在 10.0 V 电源上，h = 0.800 m 时固定电容两端的电压。","options":[],"answer":"(1) C = 2πε₀[εr h + (L−h)]/ln(b/a)；(2) 9.63×10⁻¹¹ F；(3) 6.02×10⁻¹¹ F/m；(4) 0.878 V","explain":"(1) 液体与空气两段沿轴向并联：C = 2πε₀εr h/ln(b/a) + 2πε₀(L−h)/ln(b/a) = 2πε₀[εr h + L − h]/ln(b/a)。\n(2) ln(b/a) = ln4 = 1.386，C_air = 2π×8.85×10⁻¹²×1.20/1.386 = 4.81×10⁻¹¹ F；h = 0.800 m 时括号内 = 2.50×0.800 + 0.400 = 2.40，C = 4.81×10⁻¹¹×2.40/1.20 = 9.63×10⁻¹¹ F。\n(3) dC/dh = 2πε₀(εr−1)/ln(b/a) = 4.81×10⁻¹¹×1.50/1.20 = 6.02×10⁻¹¹ F/m。\n(4) 串联电荷相同：U_C0 = U·C/(C+C₀) = 10.0×9.63×10⁻¹¹/(1.096×10⁻⁹) = 0.878 V。\n易错点：把液面高度按体积比例折算；分压时把「电容分压」当成电阻分压。"},{"id":"c12q034","type":"choice","difficulty":5,"tags":["介质界面","自由电荷","D连续"],"stem":"两种介质叠放于平行板电容器中，界面垂直于极板法线。介质 1 中电位移 D₁ = 1.00×10⁻⁶ C/m²，方向由介质 1 指向介质 2；界面处另有自由面电荷 σ_f = +2.00×10⁻⁷ C/m²。εr1 = 2.00，εr2 = 4.00，则介质 2 中 D₂ 及 E₂/E₁ 为","options":["1.20×10⁻⁶ C/m²，1.20","8.00×10⁻⁷ C/m²，0.400","1.20×10⁻⁶ C/m²，0.600","1.20×10⁻⁶ C/m²，2.40"],"answer":"C","explain":"界面无自由电荷时 D 法向连续；有自由面电荷时，由高斯定理 (D₂ − D₁)·n = σ_f。\nD₂ = D₁ + σ_f = 1.00×10⁻⁶ + 2.00×10⁻⁷ = 1.20×10⁻⁶ C/m²。\nE₁ = D₁/(ε₀εr1) = 5.65×10⁴ V/m，E₂ = D₂/(ε₀εr2) = 3.39×10⁴ V/m，E₂/E₁ = 0.600。\n注意：E 的法向分量不连续，正是因为界面有自由电荷与束缚电荷。\n易错点：把 D 的法向连续性无条件使用，得 D₂ = D₁；把 E 与 D 的比值方向搞反得 2.40。"},{"id":"c12q035","type":"choice","difficulty":5,"tags":["柱形电容器","极值","击穿"],"stem":"同轴圆柱形电容器外导体内半径固定为 b = 5.00 cm，介质 εr = 2.00，击穿场强 2.00×10⁷ V/m。要使其耐受电压最大，内导体半径应取多少？最大工作电压为多少？","options":["1.00 cm，322 kV","2.50 cm，347 kV","5.00 cm，0","1.84 cm，368 kV"],"answer":"D","explain":"最大场强在内导体表面：E_max = U/[a ln(b/a)]，故 U = E_b a ln(b/a)。\n令 dU/da = E_b[ln(b/a) − 1] = 0，得 a = b/e = 5.00/2.718 = 1.84 cm。\nU_max = E_b b/e = 2.00×10⁷×0.0500/2.718 = 3.68×10⁵ V。\n对比 a = 1.00 cm：U = 2.00×10⁷×0.0100×ln5 = 3.22×10⁵ V，确实更小。\n易错点：以为内半径越小越耐压；实际上 a→0 时 a ln(b/a)→0。"},{"id":"c12q036","type":"choice","difficulty":5,"tags":["串联","插入介质","电荷重新分配"],"stem":"C₁ = 2.00 μF 与 C₂ = 3.00 μF 串联后接在 100 V 电源上。保持电源连接，将 εr = 4.00 的介质充满 C₂。C₁ 上电荷的增量和 C₂ 两端电压分别为","options":["5.14×10⁻⁵ C，14.3 V","5.14×10⁻⁵ C，40.0 V","−5.14×10⁻⁵ C，14.3 V","1.71×10⁻⁴ C，14.3 V"],"answer":"A","explain":"初始 C = 1.20 μF，Q = 1.20×10⁻⁴ C，U₂ = Q/C₂ = 40.0 V。\n插入后 C₂′ = 12.0 μF，C′ = 2.00×12.0/14.0 = 1.71 μF，Q′ = 1.71×10⁻⁴ C。\nΔQ₁ = Q′ − Q = 5.14×10⁻⁵ C；U₂′ = Q′/C₂′ = 1.71×10⁻⁴/12.0×10⁻⁶ = 14.3 V。\n判断：电源保持连接，总电压不变；C₂ 增大后分压减小，总电容增大，电荷增多。"},{"id":"c12q037","type":"choice","difficulty":5,"tags":["串联耐压","分层介质","击穿"],"stem":"两只相同的平行板电容器串联接在电压可调的电源上：一只极板间为空气（d = 1.00 mm，击穿场强 3.00×10⁶ V/m），另一只充满 εr = 4.00 的介质（d = 1.00 mm，击穿场强 2.00×10⁷ V/m）。逐渐升高电压，组合的最大工作电压为","options":["3.00 kV","3.75 kV","15.0 kV","4.80 kV"],"answer":"B","explain":"串联电荷相同，电压与电容成反比：U_air/U介质 = C介质/C_air = 4，故 U_air = 4U介质。\n空气先击穿：U_air = 3.00×10⁶×1.00×10⁻³ = 3.00 kV，此时 U介质 = 0.750 kV。\n检查介质：E = 0.750 kV/1.00 mm = 7.50×10⁵ V/m，远小于 2.00×10⁷ V/m，安全。\n最大总电压 = 3.00 + 0.750 = 3.75 kV。\n易错点：把空气的击穿电压当成总电压（3.00 kV）；或把介质击穿电压 20 kV 直接相加。"},{"id":"c12q038","type":"choice","difficulty":5,"tags":["充电过程","电源做功","焦耳热"],"stem":"电容 C = 2.00 μF 的电容器经电阻连接到 100 V 的理想电源，从零开始充电到 100 V。电源做的功、电容器储存的能量和电阻上产生的热量分别为","options":["20.0 mJ，20.0 mJ，0","10.0 mJ，10.0 mJ，0","20.0 mJ，10.0 mJ，10.0 mJ","20.0 mJ，10.0 mJ，20.0 mJ"],"answer":"C","explain":"最终电荷 Q = CU = 2.00×10⁻⁴ C，电源做功 W源 = QU = 2.00×10⁻² J。\n电容器储能 W_C = ½CU² = ½QU = 1.00×10⁻² J。\n由能量守恒，其余 1.00×10⁻² J 在充电过程中转化为电阻上的焦耳热（与电阻大小无关）。\n易错点：认为电源做功全部储存为电场能；或认为热量与电阻成正比（总量与 R 无关，只与 C、U 有关）。"},{"id":"c12q039","type":"choice","difficulty":5,"tags":["部分填充","二维分解","电容"],"stem":"平行板电容器极板面积 0.0200 m²，板间距 2.00 mm，极板间为空气。将一块 εr = 3.00 的介质板放入极板间：介质板面积占极板面积的一半，厚度占板间距的一半，且紧贴一个角放置（其余空间为空气）。此时电容约为（ε₀ = 8.85×10⁻¹² F/m）","options":["88.5 pF","133 pF","99.6 pF","111 pF"],"answer":"D","explain":"把极板分成两个并联区域：一半面积有介质（该区域内又分介质层与空气层串联），另一半面积全为空气。\n空气半区：C₁ = ε₀(S/2)/d = 8.85×10⁻¹²×0.0100/2.00×10⁻³ = 4.43×10⁻¹¹ F。\n介质半区：C₂ = ε₀(S/2)/(d/2 + d/(2εr)) = 8.85×10⁻¹³/(1.333×10⁻³) = 6.64×10⁻¹¹ F。\n总电容 C = C₁ + C₂ = 1.11×10⁻¹⁰ F = 111 pF（C₀ = 88.5 pF，约为 1.25C₀）。\n易错点：只按面积或只按厚度一个维度折算；把介质半区当成纯介质得 133 pF。"},{"id":"c12q040","type":"choice","difficulty":5,"tags":["电桥平衡","介质测量"],"stem":"四个电容器接成电桥：C₁ = 5.00 pF 与 C₂ = 40.0 pF 串联组成上支路，C₃ = 20.0 pF 与 C₄ 串联组成下支路，两供电端接交流电源，两中点接检流计。C₄ 是一只极板面积 0.0100 m²、间距 1.00 mm 的平行板电容器，极板间为空气时可调。要使电桥平衡，需在 C₄ 极板间充满 εr 为多少的介质？","options":["1.81","0.553","3.62","2.00"],"answer":"A","explain":"电桥平衡时两中点电势相等：C₁/(C₁+C₂) = C₃/(C₃+C₄)，等价于 C₁C₄ = C₂C₃。\n故 C₄ = C₂C₃/C₁ = 40.0×20.0/5.00 = 160 pF。\nC₄ 的空气电容 C_air = ε₀S/d = 8.85×10⁻¹²×0.0100/1.00×10⁻³ = 88.5 pF。\n充满介质后 C₄ = εrC_air，故 εr = 160/88.5 = 1.81。\n易错点：把平衡条件写成 C₁C₂ = C₃C₄ 得 0.553；把电容比与电阻比混用得 3.62。"},{"id":"c12q041","type":"choice","difficulty":5,"tags":["静电力","介质板","恒压"],"stem":"平行板电容器极板面积 0.0400 m²，极板长 0.200 m，板间距 1.00 mm，接在 800 V 电源上。一块 εr = 4.00、厚度等于板间距的介质板正从一端插入极板间（插入深度 x 小于板长）。介质板所受静电力的大小和方向为","options":["3.40×10⁻³ N，指向极板内部","1.70×10⁻³ N，指向极板内部","1.70×10⁻³ N，指向极板外部","8.50×10⁻⁴ N，指向极板内部"],"answer":"B","explain":"插入深度 x 时 C(x) = ε₀w[L + (εr−1)x]/d，dC/dx = (εr−1)ε₀w/d。\n恒压下 F = ½U²dC/dx = ½×800²×3.00×8.85×10⁻¹²×0.200/1.00×10⁻³。\n= ½×6.40×10⁵×5.31×10⁻⁹ = 1.70×10⁻³ N。\n方向：静电力总是使电容增大，故把介质板向极板内部吸入。\n易错点：漏掉 ½ 得 3.40×10⁻³ N；把电容增大误判为排斥。"},{"id":"c12q042","type":"choice","difficulty":5,"tags":["电荷共享","能量损失比例"],"stem":"C₁ = 6.00 μF 的电容器充电到 200 V 后与电源断开，再与不带电的 C₂ = 3.00 μF 电容器并联。稳定后两端的共同电压和系统损失的能量占初始能量的比例为","options":["133 V，66.7%","200 V，0","133 V，33.3%","100 V，50.0%"],"answer":"C","explain":"电荷守恒：Q = C₁U₀ = 1.20×10⁻³ C，U = Q/(C₁+C₂) = 133 V。\n初能 W₀ = ½C₁U₀² = 0.120 J，末能 W = ½(C₁+C₂)U² = 0.0800 J。\n损失 = 0.0400 J，占 1/3 = 33.3%，损失比例 = C₂/(C₁+C₂)。\n损失的能量转化为导线与开关上的焦耳热，与具体电阻无关。"},{"id":"c12q043","type":"choice","difficulty":5,"tags":["分层介质","能量密度","总能量"],"stem":"平行板电容器极板面积 0.0200 m²，板间距 2.00 mm，两极板间由两层厚度各 1.00 mm 的介质充满，εr1 = 2.00、εr2 = 4.00，极板间电压为 300 V。两层介质中的能量密度 u₁、u₂ 和电容器总储能为","options":["0.177 J/m³，0.354 J/m³，1.06×10⁻⁵ J","0.354 J/m³，0.708 J/m³，2.12×10⁻⁵ J","0.708 J/m³，0.354 J/m³，1.06×10⁻⁵ J","0.354 J/m³，0.177 J/m³，1.06×10⁻⁵ J"],"answer":"D","explain":"D 连续：εr1E₁ = εr2E₂，故 E₁ = 2E₂；又 (E₁+E₂)×1.00×10⁻³ = 300。\n解得 E₂ = 1.00×10⁵ V/m，E₁ = 2.00×10⁵ V/m。\nu₁ = ½ε₀εr1E₁² = ½×8.85×10⁻¹²×2.00×(2.00×10⁵)² = 0.354 J/m³。\nu₂ = ½×8.85×10⁻¹²×4.00×(1.00×10⁵)² = 0.177 J/m³。\nC = ε₀S/(d/2/εr1 + d/2/εr2) = 8.85×10⁻¹²×0.0200/(5.00×10⁻⁴ + 2.50×10⁻⁴) = 2.36×10⁻¹⁰ F，W = ½CU² = 1.06×10⁻⁵ J。\n易错点：认为 εr 大的层能量密度也大（实际该层 E 小，u 反而小）。"},{"id":"c12q044","type":"choice","difficulty":5,"tags":["球形电容器","接地","电势叠加"],"stem":"球形电容器内球半径 5.00 cm、外球壳内半径 10.0 cm，其间为空气。外球壳带电荷 +2.00×10⁻⁸ C，内球接地。内球上的电荷和外球壳的电势分别为（k = 8.99×10⁹ N·m²/C²）","options":["−1.00×10⁻⁸ C，899 V","−2.00×10⁻⁸ C，0","−1.00×10⁻⁸ C，1.80×10³ V","+1.00×10⁻⁸ C，899 V"],"answer":"A","explain":"内球接地，V内 = 0：kq′/R₁ + kQ/R₂ = 0，得 q′ = −Q R₁/R₂ = −1.00×10⁻⁸ C。\n外球壳电势由自身电荷与内球电荷共同决定：V = kQ/R₂ + kq′/R₂ = k(Q+q′)/R₂。\n= 8.99×10⁹×(2.00×10⁻⁸ − 1.00×10⁻⁸)/0.100 = 899 V。\n易错点：以为外球壳电荷不受影响、电势为 kQ/R₂ = 1.80×10³ V；或以为内球接地后外球壳电势为零。"},{"id":"c12q045","type":"choice","difficulty":5,"tags":["极板引力","恒压拉开","外力功"],"stem":"平行板电容器 C₀ = 100 pF，板间距 d = 1.00 mm，接在 500 V 电源上保持连接。将两极板间距缓慢拉开到 2.00 mm。此过程中外力做的功为（ε₀ = 8.85×10⁻¹² F/m）","options":["1.25×10⁻⁵ J","6.25×10⁻⁶ J","3.13×10⁻⁶ J","2.50×10⁻⁵ J"],"answer":"B","explain":"C 从 C₀ 变为 C₀/2；电压不变，Q 从 5.00×10⁻⁸ C 减为 2.50×10⁻⁸ C。\nΔW = ½(C₀/2)U² − ½C₀U² = −¼C₀U² = −6.25×10⁻⁶ J。\n电源做功 W源 = UΔQ = 500×(2.50×10⁻⁸ − 5.00×10⁻⁸) = −1.25×10⁻⁵ J（电源吸收能量）。\nW外 + W源 = ΔW，得 W外 = −6.25×10⁻⁶ + 1.25×10⁻⁵ = 6.25×10⁻⁶ J。\n易错点：用恒电荷下的 Fd 计算；漏掉电源这个能量通道得 −6.25×10⁻⁶ J。"},{"id":"c12q046","type":"choice","difficulty":5,"tags":["静电屏蔽","多层球壳","场强"],"stem":"三个同心导体球壳半径分别为 4.00 cm、8.00 cm、12.0 cm。内球壳带电荷 +3.00×10⁻⁸ C，中间球壳不带电，外球壳接地。距球心 10.0 cm 处和 15.0 cm 处的场强分别为","options":["1.20×10⁴ V/m，0","2.70×10⁴ V/m，1.20×10⁴ V/m","2.70×10⁴ V/m，0","0，0"],"answer":"C","explain":"内球壳 +Q 使中间球壳内表面感应 −Q、外表面 +Q（中间球壳净电荷为零）。\n外球壳接地：其内表面感应 −Q 以抵消腔内总电荷，外表面电荷为零（否则壳外有场、壳电势不为零）。\n8.00 cm \u003c r \u003c 12.0 cm 区域的场由中间球壳外表面 +Q 产生：E = kQ/r² = 8.99×10⁹×3.00×10⁻⁸/0.100² = 2.70×10⁴ V/m。\nr > 12.0 cm：外球壳接地且外表面无电荷，E = 0。\n判断关键：接地导体壳把内外场隔开，壳外场由壳外表面电荷单独决定。"},{"id":"c12q047","type":"choice","difficulty":5,"tags":["介质板","体电荷","高斯定理"],"stem":"一块厚度 t = 4.00 mm 的无限大均匀介质板，εr = 2.50，内部均匀分布自由电荷体密度 ρ = 2.00×10⁻⁶ C/m³。板外为真空。介质板表面处和板外的场强分别为","options":["452 V/m，181 V/m","181 V/m，0","90.4 V/m，452 V/m","181 V/m，452 V/m"],"answer":"D","explain":"由平面对称性，D 垂直于板面，在板中心面为零。取柱形高斯面，底面积 A、一底在中心面、一底在距中心面 x 处：D·A = ρAx，D = ρx。\n板面 x = t/2：D = ρt/2 = 2.00×10⁻⁶×4.00×10⁻³/2 = 4.00×10⁻⁹ C/m²，E内 = D/(ε₀εr) = 181 V/m。\n板外 D 仍为 ρt/2（总电荷面密度 ρt 的一半），E外 = D/ε₀ = 452 V/m。\n易错点：认为板外场强也除以 εr；或忘记 D 在中心面为零而把 E 当成均匀。"},{"id":"c12q048","type":"choice","difficulty":5,"tags":["电容传感器","灵敏度","非线性"],"stem":"平行板电容式传感器极板面积 0.0100 m²，初始间距 1.00 mm，极板间为空气。动片沿法向移动。在初始位置处，电容对间距的灵敏度 dC/dd 以及间距减小 10.0 μm 时电容的相对变化约为","options":["−8.85×10⁻⁸ F/m，+1.01%","−8.85×10⁻⁸ F/m，−1.01%","−8.85×10⁻¹¹ F/m，+1.01%","−1.77×10⁻⁷ F/m，+1.01%"],"answer":"A","explain":"C = ε₀S/d，C₀ = 8.85×10⁻¹²×0.0100/1.00×10⁻³ = 8.85×10⁻¹¹ F。\ndC/dd = −ε₀S/d² = −C₀/d = −8.85×10⁻⁸ F/m。\nΔd = −10.0 μm 时，线性近似 ΔC/C₀ = −Δd/d = +1.00%；严格式 ΔC/C₀ = 1/(0.990) − 1 = +1.01%，二者相差约 1%。\n易错点：把灵敏度当成 ε₀S/d（少除一个 d）；忽略符号，误以为间距减小电容减小。"},{"id":"c12q049","type":"choice","difficulty":5,"tags":["开关","电荷重新分配","混联"],"stem":"C₁ = 2.00 μF 与 C₂ = 4.00 μF 串联接在 120 V 电源上，稳定后用开关把 C₃ = 6.00 μF（原不带电）并在 C₂ 两端。重新稳定后，C₃ 上的电荷和 C₁ 两端的电压分别为","options":["1.60×10⁻⁴ C，80.0 V","1.20×10⁻⁴ C，100 V","1.20×10⁻⁴ C，20.0 V","8.00×10⁻⁵ C，100 V"],"answer":"B","explain":"初始：C = 2.00×4.00/6.00 = 1.33 μF，Q = 1.60×10⁻⁴ C，U₂ = Q/C₂ = 40.0 V。\n并上 C₃ 后，C₂∥C₃ = 10.0 μF，与 C₁ 串联：C′ = 2.00×10.0/12.0 = 1.67 μF。\n总电荷 Q′ = C′U = 2.00×10⁻⁴ C，故 U₁ = Q′/C₁ = 100 V。\n并联组电压 U₂′ = 120 − 100 = 20.0 V，Q₃ = C₃U₂′ = 1.20×10⁻⁴ C。\n判断：开关闭合瞬间电荷重新分配，但总电压仍为 120 V，串联总电荷由新电容决定。"},{"id":"c12q050","type":"choice","difficulty":5,"tags":["接地导体壳","电荷守恒","综合"],"stem":"一个内外半径分别为 5.00 cm 和 10.0 cm 的不带电导体球壳，腔内中心放一点电荷 q = +2.00×10⁻⁸ C。先将球壳接地，稳定后断开接地线，再把点电荷移到很远的地方（不接触球壳）。最终球壳的电势为（k = 8.99×10⁹ N·m²/C²）","options":["+1.80×10³ V","−1.80×10³ V","−3.60×10³ V","0"],"answer":"C","explain":"接地时：内表面 −q，壳电势为零要求壳外总电荷为零，故外表面也为 −q，球壳净电荷 −2q = −4.00×10⁻⁸ C。\n断开接地线后，球壳与外界绝缘，净电荷 −4.00×10⁻⁸ C 守恒。\n移走腔内点电荷后，球壳内表面电荷消失，净电荷全部落到外表面。\nV = k(−4.00×10⁻⁸)/0.100 = −3.60×10³ V。\n易错点：以为接地只让内表面带 −q、外表面为零；或忘记断开后净电荷守恒。"}]},{"chapter":13,"chapterName":"稳恒磁场","questions":[{"id":"c13q001","type":"choice","difficulty":3,"tags":["毕奥-萨伐尔定律","有限长直导线","磁场方向"],"stem":"长 0.140 m 的直导线沿 x 轴放置，两端分别位于 x = −0.0700 m 和 x = +0.0700 m，导线中通有沿 +x 方向、大小为 10.0 A 的电流。在点 P(0, 0.0500 m)（P 位于 +y 轴上，与导线共面）处，磁感应强度的大小和方向为（μ₀ = 4π×10⁻⁷ T·m/A）","options":["4.00×10⁻⁵ T，沿 +z 方向","1.63×10⁻⁵ T，沿 +z 方向","3.26×10⁻⁵ T，沿 +z 方向","3.26×10⁻⁵ T，沿 −z 方向"],"answer":"C","explain":"由毕奥-萨伐尔定律对有限长直导线积分得 B = μ₀I(sinα₁ + sinα₂)/(4πd)，α 为导线两端到 P 的连线与垂线（垂足在原点）的夹角。\nsinα = 0.0700/√(0.0700² + 0.0500²) = 0.8137，故 sinα₁ + sinα₂ = 1.627。\nB = (4π×10⁻⁷×10.0)/(4π×0.0500)×1.627 = 2.00×10⁻⁵×1.627 = 3.26×10⁻⁵ T。\n方向：dl 沿 +x，由电流元指向 P 的矢径有 +y 分量，dl × r 沿 +z（右手螺旋，垂直纸面向外）。\n易错点：4.00×10⁻⁵ T 把导线当无限长（μ₀I/2πd）；1.63×10⁻⁵ T 只算了一侧，漏掉两端都贡献；3.26×10⁻⁵ T 配 −z 是叉乘次序颠倒。"},{"id":"c13q002","type":"choice","difficulty":3,"tags":["圆电流轴线磁场","毕奥-萨伐尔定律","近似条件"],"stem":"单匝圆线圈半径 R = 6.00 cm，通有 5.00 A 的电流，线圈平面与纸面重合。轴线上距圆心 8.00 cm 处的磁感应强度为（μ₀ = 4π×10⁻⁷ T·m/A）","options":["1.13×10⁻⁵ T","5.24×10⁻⁵ T","2.21×10⁻⁵ T","1.13×10⁻⁶ T"],"answer":"A","explain":"轴线上 B = μ₀IR²/(2(R² + x²)^(3/2))。R² + x² = 3.60×10⁻³ + 6.40×10⁻³ = 1.00×10⁻² m²，其 3/2 次方为 1.00×10⁻³ m³。\nB = (4π×10⁻⁷×5.00×3.60×10⁻³)/(2×1.00×10⁻³) = 2.26×10⁻⁸/2.00×10⁻³ = 1.13×10⁻⁵ T，方向沿轴线，取向由右手螺旋定则确定。\n易错点：5.24×10⁻⁵ T 用了圆心公式 μ₀I/(2R)；2.21×10⁻⁵ T 用远场偶极近似 μ₀IR²/(2x³)（x 与 R 同量级时失效）；1.13×10⁻⁶ T 把分母的 3/2 次方写成 1 次方。"},{"id":"c13q003","type":"choice","difficulty":4,"tags":["直导线与半圆组合","叠加原理","径向导线无贡献"],"stem":"一根导线位于纸面内：先沿 x 轴从 −∞ 延伸到 (−R, 0)，再沿上半平面内半径为 R 的半圆弧从 (−R, 0) 经过 (0, R) 到 (R, 0)，最后沿 x 轴从 (R, 0) 延伸到 +∞，电流 I 沿上述方向（+x → 半圆弧 → +x）流过。若 R = 5.00 cm、I = 6.00 A，则圆心 O 处的磁感应强度为","options":["6.17×10⁻⁵ T，垂直纸面向里","7.54×10⁻⁵ T，垂直纸面向里","3.77×10⁻⁵ T，垂直纸面向外","3.77×10⁻⁵ T，垂直纸面向里"],"answer":"D","explain":"两段半无限长直导线都沿 x 轴，O 点落在它们各自的延长线上，dl 与 r 共线，dl × r = 0，对 O 点的磁场贡献为零——这是本题的关键判断。\n只有半圆弧有贡献：B = (μ₀I/4πR)×π = μ₀I/(4R) = (4π×10⁻⁷×6.00)/(4×0.0500) = 3.77×10⁻⁵ T。\n方向：电流由 (−R, 0) 经上方绕到 (R, 0)，在纸面内看是顺时针，右手螺旋得 B 垂直纸面向里。\n易错点：6.17×10⁻⁵ T 是把两段直导线也按 μ₀I/(2πR) 加上去（实际为零）；7.54×10⁻⁵ T 把半圆当整圆；向外是电流绕行方向判反。"},{"id":"c13q004","type":"choice","difficulty":4,"tags":["长直导线的磁场","磁场叠加","右手螺旋定则"],"stem":"两根长直导线都垂直于纸面放置，相距 0.150 m。左侧导线中电流 6.00 A 流出纸面，右侧导线中电流 9.00 A 流入纸面。在两导线连线上、距左侧导线 0.0600 m 的 P 点处，磁感应强度为","options":["2.00×10⁻⁵ T","4.00×10⁻⁵ T，方向垂直于两导线连线","0","2.83×10⁻⁵ T"],"answer":"B","explain":"B₁ = μ₀I₁/(2πr₁) = (4π×10⁻⁷×6.00)/(2π×0.0600) = 2.00×10⁻⁵ T；B₂ = (4π×10⁻⁷×9.00)/(2π×0.0900) = 2.00×10⁻⁵ T（r₂ = 0.150 − 0.0600 = 0.0900 m）。\n用右手螺旋判断方向：流出纸面的电流在其右侧产生竖直向上的场，流入纸面的电流在其左侧也产生竖直向上的场，两者同向，直接相加：B = 4.00×10⁻⁵ T，方向垂直于两导线连线、在纸面内。\n易错点：0 是按「反向电流磁场必抵消」的错误结论（两场方向恰好相同）；2.83×10⁻⁵ T 把两个场当正交矢量做平方和开方；2.00×10⁻⁵ T 只算了一根导线。"},{"id":"c13q005","type":"choice","difficulty":4,"tags":["圆弧电流的磁场","张角比例","毕奥-萨伐尔定律"],"stem":"半径 R = 8.00 cm 的圆弧导线（张角 270°）通有 4.00 A 的电流，则圆心处的磁感应强度大小为（μ₀ = 4π×10⁻⁷ T·m/A）","options":["2.36×10⁻⁵ T","3.14×10⁻⁵ T","1.57×10⁻⁵ T","7.85×10⁻⁶ T"],"answer":"A","explain":"圆弧在圆心处的场 B = μ₀Iθ/(4πR)，θ 为弧的张角（弧度）。θ = 3π/2 时 B = 3μ₀I/(8R)。\n整圆（θ = 2π）的场为 μ₀I/(2R) = (4π×10⁻⁷×4.00)/(2×0.0800) = 3.14×10⁻⁵ T，而 270°/360° = 0.750，故 B = 3.14×10⁻⁵×0.750 = 2.36×10⁻⁵ T。\n方向垂直于纸面，指向由电流绕行方向按右手螺旋确定。\n易错点：3.14×10⁻⁵ T 忘了乘 3/4；1.57×10⁻⁵ T 套了半圆公式 μ₀I/(4R)；7.85×10⁻⁶ T 把 270° 当成 90°。"},{"id":"c13q006","type":"choice","difficulty":3,"tags":["安培环路定理","圆柱导体内部磁场","分段判断"],"stem":"半径 R = 2.00 mm 的长直圆柱导体中通有 10.0 A 的电流，电流在横截面上均匀分布。在距轴线 r = 1.20 mm 处，磁感应强度为","options":["1.00×10⁻³ T","1.67×10⁻³ T","6.00×10⁻⁴ T","3.00×10⁻⁴ T"],"answer":"C","explain":"先判断所在区域：r \u003c R，属导体内部。取半径 r 的同心圆为安培环路：B·2πr = μ₀I_内，而 I_内 = I r²/R²。\nB = μ₀Ir/(2πR²) = (4π×10⁻⁷×10.0×1.20×10⁻³)/(2π×4.00×10⁻⁶) = 6.00×10⁻⁴ T。\n注意导体内 B ∝ r，表面处最大 μ₀I/(2πR) = 1.00×10⁻³ T。\n易错点：1.67×10⁻³ T 用外部公式 μ₀I/(2πr)（把全部电流算进环路）；1.00×10⁻³ T 直接取表面值；3.00×10⁻⁴ T 分母漏掉因子 2。"},{"id":"c13q007","type":"choice","difficulty":4,"tags":["无限大电流片","叠加原理","面电流密度"],"stem":"两张平行无限大平面相距 d，面上分别通有面电流密度 K = 25.0 A/m 和 −K（方向相反）。两平面之间的磁感应强度、两平面之外（远离两片处）的磁感应强度分别为（μ₀ = 4π×10⁻⁷ T·m/A）","options":["0，μ₀K","μ₀K，0","μ₀K/2，μ₀K/2","μ₀K，μ₀K"],"answer":"B","explain":"单片无限大电流面产生均匀磁场 B = μ₀K/2 = 1.57×10⁻⁵ T，面两侧方向相反（由矩形安培环路 2BL = μ₀KL 得到）。\n两片之间：两场方向相同，叠加为 2×μ₀K/2 = μ₀K = 4π×10⁻⁷×25.0 = 3.14×10⁻⁵ T。\n两片之外：两场方向相反，相消为 0。\n若两片电流同向，结论恰好互换（片间 0、片外 μ₀K）。易错点：把片间场相减得 0；忘记单片带 1/2 因子；以为面外场更强。"},{"id":"c13q008","type":"choice","difficulty":4,"tags":["螺绕环","安培环路定理","1/r 分布"],"stem":"螺绕环共 N = 500 匝，通有 I = 2.00 A 的电流，环的内半径 a = 5.00 cm、外半径 b = 7.00 cm。环内靠近内半径处与靠近外半径处的磁感应强度之比，以及环外（r > b）的磁感应强度为","options":["1.00 倍（环内均匀），环外为零","0.714 倍，环外为零","1.96 倍，环外不为零","1.40 倍，环外为零"],"answer":"D","explain":"取环内半径 r 的同心圆为环路：B·2πr = μ₀NI，故 B(r) = μ₀NI/(2πr)，与 r 成反比而非均匀。\nB(a)/B(b) = b/a = 7.00/5.00 = 1.40。\n数值：B(a) = (4π×10⁻⁷×500×2.00)/(2π×0.0500) = 4.00×10⁻³ T，B(b) = 2.86×10⁻³ T。\n环外任一同心圆内穿进与穿出的电流相等，净电流为零，故 B = 0。\n易错点：把环内场当均匀（比值 1）；比值取反得 0.714；按 r² 反比得 1.96。"},{"id":"c13q009","type":"choice","difficulty":3,"tags":["安培力","等效长度","弯曲导线"],"stem":"半径为 R = 0.100 m 的半圆形导线只有圆弧部分，两端点在 x 轴上的 (−R, 0) 与 (R, 0)，电流由 (−R, 0) 沿上半圆弧流向 (R, 0)，大小为 5.00 A。导线整体置于 0.200 T、垂直纸面向里的均匀磁场中。圆弧所受安培力为","options":["0.200 N，沿 +y 方向","0.314 N，沿 +y 方向","0，因上下对称相互抵消","0.100 N，沿 +y 方向"],"answer":"A","explain":"等效长度法：弯曲导线在均匀磁场中的合力等于从起点到终点的矢量（有效长度）所受的力，|L_eff| = 2R 且垂直于 B。\nF = I|L_eff|B = 5.00×0.200×0.200 = 0.200 N。\n方向：F = I L_eff × B，L_eff 沿 +x、B 沿 −z，x × (−z) = +y；逐段验证时顶部电流元受力也沿 +y，处处同向。\n易错点：0.314 N 把弧长 πR 当有效长度；0 误以为弧形对称就抵消（各处力的方向相同，不抵消）；0.100 N 用半径 R 当有效长度。"},{"id":"c13q010","type":"choice","difficulty":4,"tags":["两平行导线间的作用力","单位长度安培力","相互吸引"],"stem":"两根平行的无限长直导线相距 3.00 cm，分别通有 8.00 A 和 15.0 A 的同向电流。两导线间单位长度上的安培力大小及性质为","options":["8.00×10⁻⁴ N/m，相互排斥","1.60×10⁻³ N/m，相互排斥","8.00×10⁻⁴ N/m，相互吸引","4.00×10⁻⁴ N/m，相互吸引"],"answer":"C","explain":"一根导线在另一根处产生 B = μ₀I₁/(2πd)，另一根单位长度受力 F/L = I₂B = μ₀I₁I₂/(2πd)。\nF/L = (4π×10⁻⁷×8.00×15.0)/(2π×0.0300) = 1.51×10⁻⁴/0.0300 = 8.00×10⁻⁴ N/m。\n同向电流相互吸引（可用右手螺旋定场方向再用左手定则逐根判断，结论不能只靠记忆）。\n易错点：判成排斥是把「同向电流相吸」记反；4.00×10⁻⁴ N/m 分母漏 2；1.60×10⁻³ N/m 多乘了 2。"},{"id":"c13q011","type":"choice","difficulty":5,"tags":["非均匀磁场中的安培力","矩形线圈与长直导线","净力计算"],"stem":"无限长直导线中通有 20.0 A 的电流（沿 +y 方向）。与它共面的矩形线圈边长分别为 0.100 m（平行于导线）与 0.0600 m（垂直于导线），通有 5.00 A 的电流；靠近导线的一边距导线 0.0200 m，且该边电流方向与直导线相同。线圈所受的合力为","options":["1.25×10⁻⁴ N，指向直导线","7.50×10⁻⁵ N，指向直导线","0","1.00×10⁻⁴ N，背离直导线"],"answer":"B","explain":"直导线在距其 r 处产生 B = μ₀I/(2πr)，随 r 减小而增大，故近边受力大于远边，两者不能抵消。\n近边（r = 0.0200 m，电流同向，受吸引即指向导线）：F₁ = μ₀I₁I₂L/(2πr₁) = (4π×10⁻⁷×20.0×5.00×0.100)/(2π×0.0200) = 1.00×10⁻⁴ N。\n远边（r = 0.0800 m，电流反向，受排斥即背离导线）：F₂ = 1.00×10⁻⁴×(0.0200/0.0800) = 2.50×10⁻⁵ N。\n合力 = 1.00×10⁻⁴ − 2.50×10⁻⁵ = 7.50×10⁻⁵ N，指向直导线；两条垂直于导线的边受力等大反向，互相抵消。\n易错点：1.25×10⁻⁴ N 把两边力相加（方向判错）；0 误以为整个线圈在均匀场中；1.00×10⁻⁴ N 只算近边。"},{"id":"c13q012","type":"choice","difficulty":4,"tags":["磁矩","磁力矩","平面与磁场的夹角"],"stem":"边长 5.00 cm 的正方形线圈共 200 匝，通有 0.100 A 的电流。线圈平面与 0.300 T 的均匀磁场成 30° 角。线圈所受磁力矩的大小为","options":["1.50×10⁻² N·m","7.50×10⁻³ N·m","0","1.30×10⁻² N·m"],"answer":"D","explain":"磁矩 m = NIS = 200×0.100×(0.0500)² = 0.0500 A·m²，方向沿线圈法线。\n平面与 B 成 30°，即法线与 B 成 60°，故 τ = mB sin60° = 0.0500×0.300×0.866 = 1.30×10⁻² N·m。\n易错点：1.50×10⁻² N·m 直接用 mB（把法线角当 90°）；7.50×10⁻³ N·m 用 sin30°（把平面角当法线角）；0 是误以为平面与 B 成 30° 就无力矩（零力矩出现在法线与 B 平行或反平行时）。"},{"id":"c13q013","type":"choice","difficulty":5,"tags":["磁势能","转动做功","m = NIS"],"stem":"面积 0.0200 m² 的单匝线圈通有 4.00 A 的电流，置于 0.250 T 的均匀磁场中，线圈磁矩与 B 的夹角由 0° 缓缓转到 60°。此过程中外力需要做的功为","options":["1.00×10⁻² J","1.73×10⁻² J","5.00×10⁻³ J","2.00×10⁻² J"],"answer":"A","explain":"m = IS = 4.00×0.0200 = 0.0800 A·m²，mB = 0.0800×0.250 = 0.0200 J。\n磁势能 U = −mB cosθ：U(0°) = −0.0200 J，U(60°) = −0.0200×0.500 = −0.0100 J。\n缓慢转动时外力做功等于势能增量：W_ext = U(60°) − U(0°) = mB(1 − cos60°) = 0.0200×0.500 = 1.00×10⁻² J，同时磁力矩做负功（阻碍 θ 增大）。\n易错点：1.73×10⁻² J 用 mB sin60°（把力矩公式当成功）；5.00×10⁻³ J 用 mB cos60°；2.00×10⁻² J 漏掉 cosθ 的变化（相当于从 0° 转到 180°）。"},{"id":"c13q014","type":"choice","difficulty":5,"tags":["安培力做功","动能定理","恒定电流"],"stem":"两根平行光滑导轨水平放置，间距 0.200 m，处于 0.500 T 的竖直均匀磁场中。一根质量 0.0200 kg 的金属棒垂直跨在导轨上，通有 10.0 A 的恒定电流，由静止开始运动。棒移动 0.300 m 时的速率为","options":["3.87 m/s","7.75 m/s","5.48 m/s","2.74 m/s"],"answer":"C","explain":"安培力 F = BIL = 0.500×10.0×0.200 = 1.00 N，是恒力，做功 W = Fd = 1.00×0.300 = 0.300 J。\n由动能定理 ½mv² = W：v = √(2×0.300/0.0200) = √30.0 = 5.48 m/s。\n这里电流由外部电源维持恒定，安培力做的功全部转化为棒的动能；若回路无电源且含电阻，则电流随动生电动势变化，需要另作分析（第 14 章）。\n易错点：3.87 m/s 把 W 取一半；7.75 m/s 把 W 加倍；2.74 m/s 动能定理漏掉因子 2。"},{"id":"c13q015","type":"choice","difficulty":4,"tags":["螺旋运动","螺距","回旋周期"],"stem":"质子（m = 1.67×10⁻²⁷ kg，q = 1.60×10⁻¹⁹ C）以 2.00×10⁶ m/s 的速率射入 0.500 T 的均匀磁场，速度方向与 B 成 30° 角。质子螺旋运动的螺距为","options":["0.131 m","0.227 m","0.262 m","0.0209 m"],"answer":"B","explain":"分解速度：v∥ = v cos30° = 1.73×10⁶ m/s，v⊥ = v sin30° = 1.00×10⁶ m/s。\n回旋周期 T = 2πm/(qB) = (2π×1.67×10⁻²⁷)/(1.60×10⁻¹⁹×0.500) = 1.31×10⁻⁷ s，与速率无关。\n螺距 p = v∥T = 1.73×10⁶×1.31×10⁻⁷ = 0.227 m。\n易错点：0.131 m 把 v sin30° 当成平行分量；0.262 m 用总速率乘周期；0.0209 m 求的是回旋半径 r = mv⊥/(qB)。"},{"id":"c13q016","type":"choice","difficulty":3,"tags":["回旋周期","比荷","半径与速率"],"stem":"质子和 α 粒子（质量为质子的 4 倍、电荷为质子的 2 倍）在同一均匀磁场中垂直磁场方向运动，α 粒子的速率是质子的一半。它们的回旋周期之比 T_p : T_α 和轨道半径之比 r_p : r_α 分别为","options":["1:2，1:1","1:1，1:2","1:2，1:2","2:1，1:1"],"answer":"A","explain":"T = 2πm/(qB)，只由比荷与 B 决定，与速率无关：T_α/T_p = (m_α/m_p)(q_p/q_α) = 4×(1/2) = 2，即 T_p : T_α = 1:2。\nr = mv/(qB)：r_α/r_p = (4)(1/2)(1/2) = 1，其中因子依次为质量比、速率比、电荷比的反比，即 r_p : r_α = 1:1。\n要点：周期只随比荷变，速率只改变半径——这正是回旋加速器能用固定频率供电的原因。\n易错点：周期比写成 1:1 是误认为周期与速率有关；半径比写错多半漏掉质量与电荷的双重影响。"},{"id":"c13q017","type":"choice","difficulty":4,"tags":["速度选择器","正交电磁场","偏转方向判断"],"stem":"速度选择器中均匀电场 E = 2.50×10⁵ V/m 与均匀磁场 B = 0.500 T 相互垂直。电子（m = 9.11×10⁻³¹ kg，e = 1.60×10⁻¹⁹ C）以 4.00×10⁵ m/s 的速率沿同时垂直于 E 和 B 的方向射入。它刚进入时的加速度大小和偏转方向为","options":["8.79×10¹⁵ m/s²，偏向电场力一侧","8.79×10¹⁵ m/s²，偏向磁场力一侧","7.91×10¹⁶ m/s²，偏向电场力一侧","0，仍沿直线通过"],"answer":"A","explain":"能直线通过的速率满足 qE = qvB，即 v₀ = E/B = 5.00×10⁵ m/s。本题 v = 4.00×10⁵ m/s \u003c v₀，故电场力占优，偏转方向沿电场力的方向。\n合力 F = |qE − qvB| = 1.60×10⁻¹⁹×(2.50×10⁵ − 4.00×10⁵×0.500) = 1.60×10⁻¹⁹×5.00×10⁴ = 8.01×10⁻¹⁵ N。\na = F/m = 8.01×10⁻¹⁵/9.11×10⁻³¹ = 8.79×10¹⁵ m/s²，方向为电场力的方向（电子所受电场力与 E 反向）。\n易错点：偏向磁场力一侧是把 v \u003c v₀ 的判断搞反；7.91×10¹⁶ m/s² 把两力相加（它们是反向的，应相减）；0 误认为选择器对所有速率都成立。"},{"id":"c13q018","type":"choice","difficulty":5,"tags":["质谱仪","加速与偏转联立","落点间距"],"stem":"质谱仪中，离子经 U = 1000 V 的电压加速后垂直进入 B = 0.500 T 的均匀磁场，沿半圆轨道打在记录板上。两种单电荷离子（电荷量 e = 1.60×10⁻¹⁹ C）的质量分别为 20 u 和 22 u（u = 1.66×10⁻²⁷ kg），它们落点之间的距离为","options":["8.1 mm","2.0 mm","4.0 mm","16 mm"],"answer":"C","explain":"加速：qU = ½mv²，得 v = √(2qU/m)；磁场中 r = mv/(qB) = √(2mU/q)/B，落点距入口 x = 2r。\nm = 20u = 3.32×10⁻²⁶ kg：2mU/q = 4.15×10⁻⁴，r₁ = √(4.15×10⁻⁴)/0.500 = 0.0407 m。\nm = 22u = 3.65×10⁻²⁶ kg：2mU/q = 4.56×10⁻⁴，r₂ = 0.0427 m。\nΔx = 2(r₂ − r₁) = 2×0.0020 = 4.0 mm（x ∝ √m，不是 ∝ m）。\n易错点：8.1 mm 把一条轨道的直径当间距；2.0 mm 漏掉因子 2；16 mm 又乘了一次 2。"},{"id":"c13q019","type":"choice","difficulty":4,"tags":["霍尔电压","载流子浓度","厚度方向"],"stem":"一块铜箔厚 d = 0.100 mm、宽 5.00 mm，通有 20.0 A 的电流，置于 1.50 T 的磁场中，磁场垂直于铜箔表面。铜的自由电子密度 n = 8.47×10²⁸ m⁻³，e = 1.60×10⁻¹⁹ C。铜箔两侧的霍尔电压为","options":["221 μV","22.1 μV","0.442 μV","11.1 μV"],"answer":"B","explain":"霍尔电压 U_H = IB/(nqd)，其中 d 是沿 B 方向的厚度，与宽度无关。\nU_H = (20.0×1.50)/(8.47×10²⁸×1.60×10⁻¹⁹×1.00×10⁻⁴) = 30.0/(1.355×10⁶) = 2.21×10⁻⁵ V = 22.1 μV。\n易错点：221 μV 把 d 少算一个数量级；0.442 μV 用宽度 5.00 mm 代替厚度；11.1 μV 用 q = 2e。"},{"id":"c13q020","type":"choice","difficulty":5,"tags":["霍尔效应极性","载流子类型","霍尔系数"],"stem":"霍尔元件中电流沿 +x 方向，磁场沿 +z 方向，测得元件 +y 一侧的电势高于 −y 一侧。已知 I = 2.00 mA、B = 0.400 T、沿 B 方向的厚度 d = 0.500 mm，e = 1.60×10⁻¹⁹ C，则载流子的类型和浓度分别为","options":["负电荷（电子），2.00×10²⁴ m⁻³","正电荷（空穴），2.00×10²⁴ m⁻³","负电荷（电子），1.25×10²⁴ m⁻³","正电荷（空穴），3.20×10²⁴ m⁻³"],"answer":"A","explain":"若载流子带正电，它沿 +x 漂移，v × B = x × z = −y，受力指向 −y，正电荷堆积在 −y 侧，使 +y 侧电势偏低，与测量相反。\n实测 +y 侧电势高，说明堆积在 −y 侧的是负电荷：载流子为电子（v 沿 −x，v × B 沿 +y，电子受 −y 方向的力）。\n浓度由 U_H = IB/(nqd) 反解：n = (2.00×10⁻³×0.400)/(1.60×10⁻¹⁹×5.00×10⁻⁶×5.00×10⁻⁴) = 8.00×10⁻⁴/4.00×10⁻²⁸ = 2.00×10²⁴ m⁻³。\n易错点：类型判反（漏掉「电子漂移方向与电流方向相反」这一步）；浓度数值错多半是 U_H 或 d 的单位换算。"},{"id":"c13q021","type":"choice","difficulty":3,"tags":["运动电荷的磁场","sinθ 因子","磁场方向判定"],"stem":"质子（q = 1.60×10⁻¹⁹ C）以 2.00×10⁶ m/s 的速率沿 +x 方向运动。在与质子相距 5.00 nm 的 P 点，质子速度方向与由质子指向 P 的方向成 60° 角。P 点处质子产生的磁感应强度为（μ₀/4π = 1.00×10⁻⁷ T·m/A）","options":["1.11×10⁻³ T，方向垂直于速度与该点连线所决定的平面","1.28×10⁻³ T，方向垂直于速度与该点连线所决定的平面","6.40×10⁻⁴ T，方向垂直于速度与该点连线所决定的平面","1.11×10⁻³ T，方向沿速度与该点的连线"],"answer":"A","explain":"运动电荷的磁场 B = μ₀qv sinθ/(4πr²)，θ 为 v 与 r 的夹角。\nB = 1.00×10⁻⁷×(1.60×10⁻¹⁹×2.00×10⁶×0.866)/(5.00×10⁻⁹)² = 1.00×10⁻⁷×2.77×10⁻¹³/2.50×10⁻¹⁷ = 1.11×10⁻³ T。\n方向：B 同时垂直于 v 和 r，即垂直于 v 与该点连线所决定的平面，具体指向由 v × r 的右手螺旋定则给出。\n易错点：1.28×10⁻³ T 漏掉 sin60°（θ = 90° 的结果）；6.40×10⁻⁴ T 用 sin30°；方向沿连线是把磁场方向与电场方向混淆（B 必须垂直于 v）。"},{"id":"c13q022","type":"choice","difficulty":5,"tags":["磁场边界","圆周运动几何","圆心角与弦"],"stem":"均匀磁场 B = 0.200 T 垂直纸面向里，只存在于 y > 0 的半空间，边界为 x 轴。质子（m = 1.67×10⁻²⁷ kg，q = 1.60×10⁻¹⁹ C）以 1.00×10⁶ m/s 的速率从原点射入磁场，速度与边界（x 轴）成 30° 角。质子在磁场中运动的时间和出射点与入射点之间的距离为","options":["1.64×10⁻⁷ s，5.22×10⁻² m","1.09×10⁻⁷ s，5.22×10⁻² m","5.47×10⁻⁸ s，5.22×10⁻² m","5.47×10⁻⁸ s，1.04×10⁻¹ m"],"answer":"C","explain":"r = mv/(qB) = (1.67×10⁻²⁷×1.00×10⁶)/(1.60×10⁻¹⁹×0.200) = 5.22×10⁻² m；T = 2πm/(qB) = 3.28×10⁻⁷ s。\n粒子从边界射入又从边界射出，两点连线（弦）沿 x 轴，速度与弦成 30°，由圆周角定理得圆心角 = 2×30° = 60°。\n时间 t = (60°/360°)T = T/6 = 5.47×10⁻⁸ s；弦长 = 2r sin30° = r = 5.22×10⁻² m。\n易错点：1.64×10⁻⁷ s 用半圆 T/2；1.09×10⁻⁷ s 把圆心角当 120°；1.04×10⁻¹ m 用直径 2r 当弦长。"},{"id":"c13q023","type":"choice","difficulty":5,"tags":["正方形线框","多段叠加","有限长直导线"],"stem":"边长 8.00 cm 的正方形导线框（单匝）通有 3.00 A 的电流。线框中心处的磁感应强度为（μ₀ = 4π×10⁻⁷ T·m/A）","options":["3.00×10⁻⁵ T","4.24×10⁻⁵ T","1.06×10⁻⁵ T","2.21×10⁻⁵ T"],"answer":"B","explain":"每条边到中心的垂直距离 a = 4.00 cm，两端到中心的连线与垂线各成 45°。\n一条边的贡献 B₁ = μ₀I(sin45° + sin45°)/(4πa) = (4π×10⁻⁷×3.00)/(4π×0.0400)×1.414 = 7.50×10⁻⁶×1.414 = 1.06×10⁻⁵ T。\n四条边产生的场方向相同，B = 4B₁ = 4.24×10⁻⁵ T。\n易错点：3.00×10⁻⁵ T 漏掉角度因子（把每边当半无限长）；1.06×10⁻⁵ T 只算一条边；2.21×10⁻⁵ T 是把边长 8.00 cm 当作 a 的结果。"},{"id":"c13q024","type":"choice","difficulty":5,"tags":["亥姆霍兹线圈","轴线磁场叠加","均匀性"],"stem":"两个相同的圆线圈半径均为 R = 10.0 cm、各 100 匝，通有同向电流 2.00 A，两线圈共轴且相距 R。它们中点处的磁感应强度为（μ₀ = 4π×10⁻⁷ T·m/A）","options":["8.99×10⁻⁴ T","2.51×10⁻³ T","1.26×10⁻³ T","1.80×10⁻³ T"],"answer":"D","explain":"单线圈轴线上距圆心 R/2 处：B = μ₀NIR²/(2(R² + R²/4)^(3/2))，而 (1.25)^(3/2) = 1.398。\nB₁ = μ₀NI/(2×1.398R) = (4π×10⁻⁷×100×2.00)/(2×1.398×0.100) = 8.99×10⁻⁴ T。\n中点处两线圈的场同向（共轴、电流同向），B = 2B₁ = 1.80×10⁻³ T。\n亥姆霍兹线圈的特点是中心附近场最均匀（二阶导数为零），本题只要求叠加。\n易错点：8.99×10⁻⁴ T 只算一个线圈；2.51×10⁻³ T 用单线圈中心式 μ₀NI/(2R) 再乘 2（忽略相距 R 的衰减）；1.26×10⁻³ T 是单线圈中心的场。"},{"id":"c13q025","type":"choice","difficulty":4,"tags":["安培力平衡","电流天平","方向判断"],"stem":"一根长 0.150 m 的水平直导线质量 12.0 g，置于 0.400 T 的水平均匀磁场中，磁场与导线垂直。要使导线所受安培力恰好平衡其重力，导线中需通入的电流为（g = 9.80 m/s²）","options":["1.96 A","0.196 A","3.92 A","0.980 A"],"answer":"A","explain":"平衡条件为 BIL = mg（安培力竖直向上时）。\nI = mg/(BL) = (0.0120×9.80)/(0.400×0.150) = 0.1176/0.0600 = 1.96 A。\n方向要求：由左手定则，电流的取向必须使安培力向上；若电流反向，安培力向下，合力变为 2mg。\n易错点：0.196 A 直接把质量 0.0120 当重力（漏乘 g）；3.92 A 用 2L；0.980 A 是长度取 0.300 m 的结果。"},{"id":"c13q026","type":"choice","difficulty":5,"tags":["非均匀电流密度","安培环路定理","积分求电流"],"stem":"半径 R = 2.00 cm 的长直圆柱导体中通有总电流 10.0 A，电流密度沿径向分布为 J = J₀(1 − r²/R²)。距轴线 r = R/2 处的磁感应强度为","options":["5.00×10⁻⁵ T","2.00×10⁻⁴ T","8.75×10⁻⁵ T","1.75×10⁻⁴ T"],"answer":"C","explain":"先由总电流定 J₀：I = ∫₀^R J₀(1 − r²/R²)2πr dr = 2πJ₀(R²/2 − R²/4) = πJ₀R²/2。\nr = R/2 内的电流：I_内 = 2πJ₀(R²/8 − R²/64) = 7πJ₀R²/32 = (7/16)I = 4.375 A。\n安培环路 B·2π(R/2) = μ₀I_内，得 B = μ₀I_内/(πR) = (4π×10⁻⁷×4.375)/(π×0.0200) = 8.75×10⁻⁵ T。\n作为对照：若按均匀分布，I_内 = I/4、B = 5.00×10⁻⁵ T，这正是干扰项的来源。\n易错点：5.00×10⁻⁵ T 忽略分布按均匀算；2.00×10⁻⁴ T 把全部电流放进环路；1.75×10⁻⁴ T 是积分时多乘 2 的结果。"},{"id":"c13q027","type":"choice","difficulty":4,"tags":["同轴电缆","外导体内部","净电流扣除"],"stem":"同轴电缆内导体半径 a = 1.00 cm，外导体是内半径 b = 2.00 cm、外半径 c = 3.00 cm 的圆筒。内导体中电流 I = 5.00 A 流出纸面，外导体中同样的电流均匀分布并流回。在 r = 2.50 cm 处，磁感应强度为","options":["4.00×10⁻⁵ T","2.20×10⁻⁵ T","1.00×10⁻⁵ T","2.75×10⁻⁵ T"],"answer":"B","explain":"r = 2.50 cm 位于外导体内部，环路包围的净电流为 I − I(r² − b²)/(c² − b²)，其中 (r² − b²)/(c² − b²) = (6.25 − 4.00)/(9.00 − 4.00) = 0.450，故 I_净 = 5.00×0.550 = 2.75 A。\nB = μ₀I_净/(2πr) = (4π×10⁻⁷×2.75)/(2π×0.0250) = 2.20×10⁻⁵ T，方向沿同心圆，取向由内导体电流按右手螺旋确定。\n易错点：4.00×10⁻⁵ T 忘记扣除外导体中已经流回的电流；2.75×10⁻⁵ T 用内半径 b 作分母；1.00×10⁻⁵ T 误以为外导体把场完全屏蔽。"},{"id":"c13q028","type":"choice","difficulty":4,"tags":["洛伦兹力作向心力","动量与半径","相对论动量"],"stem":"一个电子在 0.0500 T 的均匀磁场中做圆周运动，其动量大小为 1.20×10⁻²¹ kg·m/s。轨道半径为（e = 1.60×10⁻¹⁹ C）","options":["0.300 m","0.0750 m","7.50×10⁻³ m","0.150 m"],"answer":"D","explain":"洛伦兹力提供向心力：evB = mv²/r，即 r = mv/(eB) = p/(eB)。该式对相对论情形同样成立（把 p 换成相对论动量）。\nr = 1.20×10⁻²¹/(1.60×10⁻¹⁹×0.0500) = 1.20×10⁻²¹/8.00×10⁻²¹ = 0.150 m。\n易错点：0.300 m 用 2p；0.0750 m 分母多乘 2；7.50×10⁻³ m 把 B 当成 1.00 T（数量级错误）。"},{"id":"c13q029","type":"choice","difficulty":4,"tags":["磁力矩做功","势能变化","符号判断"],"stem":"面积 0.0100 m² 的单匝线圈通有 2.00 A 的电流，磁矩与 0.500 T 的均匀磁场成 90° 角。现将线圈缓缓转到磁矩与 B 平行的位置。此过程中外力做的功和磁力矩做的功分别为","options":["−1.00×10⁻² J，+1.00×10⁻² J","+1.00×10⁻² J，−1.00×10⁻² J","−2.00×10⁻² J，+2.00×10⁻² J","0，0"],"answer":"A","explain":"m = IS = 2.00×0.0100 = 0.0200 A·m²，mB = 0.0100 J。\nU = −mB cosθ：U(90°) = 0，U(0°) = −0.0100 J，势能降低。\n缓慢转动时 W_ext = ΔU = −1.00×10⁻² J：磁力矩在做正功把线圈拉向平衡位置，外力只需「按住」不让它加速，因此外力做负功。\n磁力矩做功 W_磁 = −ΔU = +1.00×10⁻² J。\n易错点：符号整体反号（把外力功当成势能增量的大小）；2.00×10⁻² J 把 90° 当 180°；0 是误以为磁力矩不做功（磁场对运动电荷不做功，但对载流线圈可以做功）。"},{"id":"c13q030","type":"choice","difficulty":5,"tags":["磁矩与转动惯量","能量转化","角速度"],"stem":"一个可绕固定轴转动的线圈，磁矩大小 m = 0.0500 A·m²，转动惯量 J = 2.00×10⁻⁴ kg·m²，置于 0.400 T 的均匀磁场中。线圈从磁矩与 B 垂直的位置由静止释放（无摩擦），转到磁矩与 B 平行时的角速度为","options":["10.0 rad/s","28.3 rad/s","14.1 rad/s","0"],"answer":"C","explain":"只有磁力矩做功，机械能守恒：½Jω² = −ΔU = mB(cos0° − cos90°) = mB。\nω = √(2mB/J) = √(2×0.0500×0.400/2.00×10⁻⁴) = √200 = 14.1 rad/s。\n要点：磁力矩做正功使磁势能转化为转动动能，这与「洛伦兹力不做功」并不矛盾——宏观上安培力对线圈做功，能量来自维持电流的电源。\n易错点：10.0 rad/s 漏掉动能定理的 1/2；28.3 rad/s 把 mB 当成 2 倍；0 是认为磁力矩总垂直于运动方向、不做功。"},{"id":"c13q031","type":"choice","difficulty":5,"tags":["非均匀磁场中的受力","磁偶极子","梯度力"],"stem":"一个小线圈的磁矩大小为 0.0500 A·m²，置于沿 x 方向、大小随位置变化的磁场中，B(x) = 0.200 + 3.00x（T，x 以 m 为单位），线圈磁矩始终与 B 同向。在 x = 0.100 m 处，线圈所受磁场力为","options":["0.150 N，沿 +x","0.150 N，沿 −x","1.50 N，沿 +x","0.0250 N，沿 +x"],"answer":"A","explain":"磁偶极子在非均匀场中受力 F = m·dB/dx（磁矩与 B 同向时沿场强增大的方向）。\n此处 dB/dx = 3.00 T/m，故 F = 0.0500×3.00 = 0.150 N，方向沿 +x。\n注意与均匀场的区别：均匀场中合力为零、只有力矩；有梯度时才会出现净力，这正是吸引铁磁材料与磁悬浮的基本机制。\n易错点：0.0250 N 用 mB(x) = 0.0500×0.500 而不是 m·dB/dx；1.50 N 数量级错；沿 −x 是把「被拉向强场区」记反。"},{"id":"c13q032","type":"choice","difficulty":5,"tags":["同心圆弧回路","径向导线无贡献","电流反向相减"],"stem":"由两段同心圆弧和两段沿半径方向的直导线组成闭合回路：内弧半径 R₁ = 5.00 cm、外弧半径 R₂ = 10.0 cm，两段弧的张角都是 90°，两段直导线沿半径方向连接两弧对应的端点，回路中通有 4.00 A 的电流。圆心处的磁感应强度为","options":["1.88×10⁻⁵ T","1.26×10⁻⁵ T","2.51×10⁻⁵ T","6.28×10⁻⁶ T"],"answer":"D","explain":"两段沿半径的直导线，其延长线都通过圆心，dl × r = 0，对圆心磁场无贡献。\n90° 圆弧的场 B = (μ₀I/4πR)×(π/2) = μ₀I/(8R)。\n闭合回路中电流在两段弧上的绕行方向相反，两场反向：B = (μ₀I/8)(1/R₁ − 1/R₂) = (4π×10⁻⁷×4.00/8)×(20.0 − 10.0) = 6.28×10⁻⁷×10.0 = 6.28×10⁻⁶ T。\n易错点：1.88×10⁻⁵ T 把两弧的场相加；1.26×10⁻⁵ T 只算内弧；2.51×10⁻⁵ T 把 90° 弧当成整圆。"},{"id":"c13q033","type":"choice","difficulty":5,"tags":["螺旋运动","螺距与周长","速度分解"],"stem":"电子（m = 9.11×10⁻³¹ kg，e = 1.60×10⁻¹⁹ C）以 2.00×10⁶ m/s 的速率射入 0.400 T 的均匀磁场，做螺旋运动，其螺距恰好等于圆周轨道的周长。速度与 B 的夹角以及螺距分别为","options":["45.0°，1.26×10⁻⁴ m","45.0°，2.51×10⁻⁴ m","60.0°，2.18×10⁻⁴ m","63.4°，2.01×10⁻⁵ m"],"answer":"A","explain":"螺距 p = v∥T，而轨道周长 2πr = 2π·mv⊥/(eB) = v⊥T。\n由 p = 2πr 得 v∥ = v⊥，即 tanθ = v⊥/v∥ = 1，θ = 45°。\nv⊥ = v sin45° = 1.41×10⁶ m/s，r = mv⊥/(eB) = (9.11×10⁻³¹×1.41×10⁶)/(1.60×10⁻¹⁹×0.400) = 2.01×10⁻⁵ m。\np = 2πr = 1.26×10⁻⁴ m。\n易错点：2.51×10⁻⁴ m 把 p 算成 2×2πr；60° 与 45° 混淆是把 tanθ 与 sinθ 用混；63.4° 对应 tanθ = 2（把 v/v⊥ 当成了 tanθ）。"},{"id":"c13q034","type":"choice","difficulty":4,"tags":["垂直电流的叠加","右手螺旋定则","方向相消"],"stem":"两根互相垂直的无限长直导线在原点交叉（不接触）：一根沿 x 轴、电流 10.0 A 沿 +x 方向；另一根沿 y 轴、电流 10.0 A 沿 +y 方向。在点 P(0.0400 m, 0.100 m, 0) 处，磁感应强度为","options":["7.00×10⁻⁵ T，沿 +z 方向","3.00×10⁻⁵ T，沿 +z 方向","3.00×10⁻⁵ T，沿 −z 方向","0（两场互相抵消）"],"answer":"C","explain":"沿 x 轴的导线：P 到它的距离为 0.100 m，B₁ = μ₀I/(2π×0.100) = 2.00×10⁻⁵ T；方向由右手螺旋得 +z（电流 +x、P 在 +y 侧，x × y = z）。\n沿 y 轴的导线：P 到它的距离为 0.0400 m，B₂ = μ₀I/(2π×0.0400) = 5.00×10⁻⁵ T；方向为 −z（电流 +y、P 在 +x 侧，y × x = −z）。\n叠加：B = 2.00×10⁻⁵ − 5.00×10⁻⁵ = −3.00×10⁻⁵ T，即大小 3.00×10⁻⁵ T、方向沿 −z。\n易错点：7.00×10⁻⁵ T 把两场相加（方向判错）；沿 +z 是符号错；0 是误以为垂直电流的场必然抵消。"},{"id":"c13q035","type":"choice","difficulty":5,"tags":["动量矢量变化","洛伦兹力不做功","圆周运动"],"stem":"一个电子在均匀磁场中做匀速圆周运动，动量大小为 1.20×10⁻²¹ kg·m/s。它从 A 点运动到 B 点，速度方向改变了 60°。在这段过程中，电子动量变化的大小和动能的变化分别为","options":["2.40×10⁻²¹ kg·m/s，动能不变","1.20×10⁻²¹ kg·m/s，动能不变","1.20×10⁻²¹ kg·m/s，动能减少","0，动能不变"],"answer":"B","explain":"速度大小不变、方向转过 60°，动量矢量的变化 |Δp| = 2p sin(θ/2) = 2×1.20×10⁻²¹×sin30° = 1.20×10⁻²¹ kg·m/s。\n洛伦兹力始终垂直于 v，不做功，所以速率与动能都不变；但动量是矢量，方向改变即动量改变。\n易错点：2.40×10⁻²¹ kg·m/s 用 2p；0 是误以为「力不做功 ⇒ 动量不变」；动能减少是把向心力误解为耗散力。"},{"id":"c13q036","type":"calc","difficulty":4,"tags":["有限长直导线","毕奥-萨伐尔积分","半无限长对比"],"stem":"一根长 L = 0.200 m 的直导线沿 x 轴放置，一端在原点、另一端在 x = 0.200 m 处，通有沿 +x 方向、大小为 6.00 A 的电流。求：(1) 在点 P(0, 0.0500 m)（位于导线端点正上方，与导线共面）处磁感应强度的大小和方向；(2) 若把导线沿 −x 方向无限延长（成为半无限长直导线），P 点的磁感应强度变为多少；(3) 说明为什么这个结果恰好是无限长直导线值的一半。","answer":"(1) 1.16×10⁻⁵ T，方向垂直纸面向外（沿 +z）；(2) 1.20×10⁻⁵ T；(3) 见推导","explain":"有限长直导线的结果为 B = μ₀I(sinα₁ + sinα₂)/(4πd)，α 为两端到 P 的连线与垂线（垂足在原点）的夹角。\nP 在端点正上方，α₁ = 0；sinα₂ = L/√(L² + d²) = 0.200/0.206 = 0.970。\nB = (4π×10⁻⁷×6.00)/(4π×0.0500)×0.970 = 1.20×10⁻⁵×0.970 = 1.16×10⁻⁵ T；方向：dl 沿 +x，矢径有 +y 分量，dl × r 沿 +z，即垂直纸面向外。\n(2) 半无限长时只剩 α₂ = 90° 的贡献，sinα₂ = 1，B = μ₀I/(4πd) = 1.20×10⁻⁵ T。\n(3) 无限长导线相当于两个半无限长导线叠加（各贡献 μ₀I/4πd），故半无限长的场恰为 μ₀I/(2πd) = 2.40×10⁻⁵ T 的一半。"},{"id":"c13q037","type":"calc","difficulty":4,"tags":["圆线圈轴线磁场","符号推导","远场近似"],"stem":"半径 R、单匝、通有电流 I 的圆线圈，取轴线为 x 轴、圆心为原点。求：(1) 轴线上任意点磁感应强度 B(x) 的表达式（由毕奥-萨伐尔定律积分得到）；(2) B(x) 等于圆心处 B₀ 一半时的 x（用 R 表示）；(3) 当 R = 6.00 cm 时该位置的坐标值；(4) 说明 x ≫ R 时的近似形式及其物理意义。","answer":"(1) B(x) = μ₀IR²/(2(R² + x²)^(3/2))，方向沿轴线，由右手螺旋定则确定；(2) x = ±R√(2^(2/3) − 1) ≈ ±0.766R；(3) ±0.0460 m；(4) B ≈ μ₀IR²/(2x³)，即磁偶极子场","explain":"(1) 每个电流元到轴线上点的距离 r = √(R² + x²)，dl 与 r 垂直，dB 只有轴向分量 dB·(R/r)：B = ∫μ₀I dl R/(4πr³) = μ₀IR²/(2(R² + x²)^(3/2))。\n(2) 圆心处 B₀ = μ₀I/(2R)。令 (R² + x²)^(3/2) = 2R³，即 R² + x² = 2^(2/3)R²，得 x² = (2^(2/3) − 1)R² = 0.5874R²。\n(3) x = 0.766×0.0600 = 0.0460 m（两侧对称，取 ±）。\n(4) x ≫ R 时 (R² + x²)^(3/2) ≈ x³，B ≈ μ₀IR²/(2x³) = μ₀m/(2πx³)，与电偶极子场的形式对应；但 x 与 R 同量级时该近似误差很大（本题 x/R = 1.33 时近似给出 2.21×10⁻⁵ T，偏大一倍以上）。"},{"id":"c13q038","type":"calc","difficulty":5,"tags":["直导线与半圆组合","叠加证明","张角比例"],"stem":"一根导线位于纸面内：沿 x 轴从 −∞ 到 (−R, 0)（电流沿 +x），再沿上半平面内半径 R 的半圆弧从 (−R, 0) 经 (0, R) 到 (R, 0)，最后沿 x 轴从 (R, 0) 到 +∞（电流仍沿 +x）。求：(1) 证明两段半无限长直导线对圆心 O 的磁场贡献为零；(2) 圆心处 B 的表达式与方向；(3) R = 5.00 cm、I = 6.00 A 时的数值；(4) 若把半圆换成张角 90° 的圆弧（半径、电流不变，仍以同样方式接入），圆心处 B 变为多少。","answer":"(1) 见证明；(2) B = μ₀I/(4R)，垂直纸面向里；(3) 3.77×10⁻⁵ T；(4) 变为 μ₀I/(8R) = 1.88×10⁻⁵ T，即原来的 1/2","explain":"(1) 半无限长直导线沿 x 轴，其延长线通过 O，任取电流元都有 dl ∥ r，故 dl × r = 0、dB = 0，两段的贡献都为零。\n(2) 圆弧上任一点 dl ⊥ r 且各元 dB 同向，B = ∫μ₀I dl/(4πR²) = μ₀I(πR)/(4πR²) = μ₀I/(4R)。\n方向：电流自 (−R, 0) 经上方到 (R, 0)，在纸面内看是顺时针，右手螺旋得 B 垂直纸面向里。\n(3) B = (4π×10⁻⁷×6.00)/(4×0.0500) = 3.77×10⁻⁵ T。\n(4) 张角为 π/2 时 B = μ₀Iθ/(4πR) = μ₀I/(8R) = 1.88×10⁻⁵ T，恰为半圆的一半（圆心场与张角成正比）。"},{"id":"c13q039","type":"calc","difficulty":5,"tags":["同轴电缆","安培环路定理","分段表达式"],"stem":"同轴电缆内导体是半径 a = 1.00 cm 的实心圆柱，外导体是内半径 b = 2.00 cm、外半径 c = 3.00 cm 的圆筒，两者之间绝缘。内导体中电流 I = 5.00 A 沿纸面向外流出，外导体中同样的电流均匀分布并流回。导体中电流均视为均匀分布。求：(1) 四个区域 r \u003c a、a \u003c r \u003c b、b \u003c r \u003c c、r > c 中 B(r) 的表达式；(2) 分别计算 r = 0.500 cm、1.50 cm、2.50 cm、4.00 cm 处的数值。","answer":"(1) r \u003c a：B = μ₀Ir/(2πa²)；a \u003c r \u003c b：B = μ₀I/(2πr)；b \u003c r \u003c c：B = μ₀I(c² − r²)/(2πr(c² − b²))；r > c：B = 0；方向均为同心圆方向（右手螺旋）。(2) 5.00×10⁻⁵ T、6.67×10⁻⁵ T、2.20×10⁻⁵ T、0","explain":"统一取半径 r 的同心圆为安培环路，B·2πr = μ₀I_净，逐段算净电流。\n(1) r \u003c a：I_净 = I r²/a²，B = μ₀Ir/(2πa²)（∝ r）；a \u003c r \u003c b：I_净 = I，B = μ₀I/(2πr)（∝ 1/r）；b \u003c r \u003c c：I_净 = I − I(r² − b²)/(c² − b²) = I(c² − r²)/(c² − b²)；r > c：I_净 = 0，B = 0。\n(2) r = 0.005 m：B = 4π×10⁻⁷×5.00×0.005/(2π×1.00×10⁻⁴) = 5.00×10⁻⁵ T；r = 0.015 m：B = 4π×10⁻⁷×5.00/(2π×0.015) = 6.67×10⁻⁵ T；r = 0.025 m：净电流 2.75 A，B = 2.20×10⁻⁵ T；r = 0.04 m：0。\n校验连续性：r = b 处两式都给 μ₀I/(2πb) = 5.00×10⁻⁵ T；r = c 处外导体内部式给 0，与外部一致（如 r = 2.50 cm 处 B = 2.20×10⁻⁵ T，而 r = 1.50 cm 处 6.67×10⁻⁵ T，中间先升后降）。\n易错点：把 r \u003c a 区域当作无场；忘记外导体电流是流回的（应从中扣除）。"},{"id":"c13q040","type":"calc","difficulty":5,"tags":["非均匀电流密度","积分求包围电流","符号表达式"],"stem":"半径 R = 3.00 cm 的长直圆柱导体中，电流密度沿径向线性增大：J = J₀r/R，其中 J₀ = 4.00×10⁵ A/m²。求：(1) 总电流 I；(2) 导体内 r \u003c R 处 B(r) 的表达式；(3) r = R/2 处的数值；(4) 验证 r = R 处的表达式与导体外公式一致。","answer":"(1) I = 2πJ₀R²/3 = 754 A；(2) B(r) = μ₀J₀r²/(3R)（r ≤ R）；(3) 1.26×10⁻³ T；(4) 一致，B(R) = μ₀J₀R/3 = μ₀I/(2πR)","explain":"(1) I = ∫₀^R J₀(r/R)·2πr dr = (2πJ₀/R)(R³/3) = 2πJ₀R²/3 = 2π×4.00×10⁵×(0.0300)²/3 = 754 A。\n(2) r 内的电流 I_内 = (2πJ₀/R)(r³/3)，安培环路 B·2πr = μ₀I_内，得 B = μ₀J₀r²/(3R)。\n(3) r = R/2：B = μ₀J₀R/12 = (4π×10⁻⁷×4.00×10⁵×0.0300)/12 = 1.26×10⁻³ T。\n(4) r = R：B = μ₀J₀R/3 = 5.03×10⁻³ T；而 μ₀I/(2πR) = (4π×10⁻⁷×754)/(2π×0.0300) = 5.03×10⁻³ T，两者一致，说明内、外表达式在表面衔接。\n要点：导体内 B 不再与 r 成正比（这里 ∝ r²），不能套用均匀电流的 μ₀Ir/(2πR²)。"},{"id":"c13q041","type":"calc","difficulty":4,"tags":["无限大电流片","安培环路定理","区域讨论"],"stem":"两张平行无限大平面相距 d = 5.00 cm，分别通有面电流密度 K₁ = 30.0 A/m 与 K₂ = 30.0 A/m，两者方向相反（都平行于平面且彼此平行）。求：(1) 两平面之间 B 的表达式与数值；(2) 两平面之外（两侧）B 的表达式与数值；(3) 若把第二片的电流方向改为与第一片相同，三个区域的 B 各为多少。","answer":"(1) 之间 B = μ₀K = 3.77×10⁻⁵ T；(2) 之外 B = 0；(3) 同向时之间 B = 0，两侧 B = μ₀K = 3.77×10⁻⁵ T（两侧方向相反）","explain":"单片无限大电流面产生均匀场 B = μ₀K/2 = 1.88×10⁻⁵ T，面两侧方向相反（取矩形安培环路得 2BL = μ₀KL，与距离无关）。\n(1) 两片电流反向：两者之间两场同向，叠加为 2×μ₀K/2 = μ₀K = 4π×10⁻⁷×30.0 = 3.77×10⁻⁵ T。\n(2) 两片之外两场反向相消，B = 0。\n(3) 若两片同向：之间相消（0），之外叠加（μ₀K，两侧方向相反）。\n要点：无限大电流面的场与距离无关，因此「片间/片外」只由电流方向决定；这个结论是理想螺线管、变压器铁芯近似的出发点。"},{"id":"c13q042","type":"calc","difficulty":5,"tags":["螺绕环","磁通量积分","1/r 分布"],"stem":"螺绕环共 N = 800 匝，通有 I = 1.50 A 的电流，环的内半径 a = 4.00 cm、外半径 b = 6.00 cm，环的截面是高 h = 2.00 cm 的矩形。求：(1) 环内 B(r) 的表达式；(2) 内、外半径处的 B；(3) 穿过环截面的磁通量 Φ；(4) 说明为什么不能取 B 的算术平均值再乘截面积。","answer":"(1) B(r) = μ₀NI/(2πr)；(2) 6.00×10⁻³ T 与 4.00×10⁻³ T；(3) Φ = μ₀NIh ln(b/a)/(2π) = 1.95×10⁻⁶ Wb；(4) 见说明","explain":"(1) 取环内半径 r 的同心圆为环路，B·2πr = μ₀NI，得 B = μ₀NI/(2πr)，方向沿圆周。\n(2) μ₀NI = 4π×10⁻⁷×800×1.50 = 1.51×10⁻³；B(a) = 1.51×10⁻³/(2π×0.0400) = 6.00×10⁻³ T，B(b) = 4.00×10⁻³ T。\n(3) Φ = ∫B h dr = μ₀NIh ln(b/a)/(2π) = (1.51×10⁻³×0.0200/6.283)×0.405 = 1.95×10⁻⁶ Wb。\n(4) B ∝ 1/r 不是常数。真实的截面平均值为 Φ/(h(b − a)) = 1.95×10⁻⁶/4.00×10⁻⁴ = 4.88×10⁻³ T，而算术平均 (6.00 + 4.00)/2 = 5.00×10⁻³ T 偏大；1/r 是凸函数，必须做对数积分而不能取算术平均。\n易错点：直接当直螺线管用 μ₀nI（n = N/2πr̄），误差约 3%。"},{"id":"c13q043","type":"calc","difficulty":5,"tags":["半圆回路","等效长度","磁力矩"],"stem":"由半径 R = 8.00 cm 的半圆弧和其直径上的直导线组成闭合回路，通有 I = 3.00 A 的电流，置于 0.500 T、垂直纸面向外的均匀磁场中。半圆弧朝 +y 方向凸出，电流从 +x 端的 A 点沿圆弧经弧顶流向 −x 端的 B 点，再沿直径由 B 流回 A。求：(1) 圆弧段所受安培力的大小和方向；(2) 直导线段所受安培力和整个回路的合力；(3) 若把磁场改为 0.500 T、沿纸面内 +y 方向，回路所受磁力矩的大小与转轴方向。","answer":"(1) F = 2IRB = 0.240 N，方向沿 +y（垂直于直径、指向弧的凸侧）；(2) 直导线受力 0.240 N、方向沿 −y，回路合力为零；(3) τ = IπR²B/2 = 1.51×10⁻² N·m，转轴沿 x 轴（直径）","explain":"(1) 圆弧的等效长度为直径 2R，F = I·2R·B = 3.00×2×0.0800×0.500 = 0.240 N；方向由 F = I L_eff × B 判定，L_eff 沿直径，与 B 叉乘后垂直于直径、指向弧的凸侧。\n(2) 直导线长 2R，电流方向与圆弧两端之间的等效电流相反，受力同为 0.240 N 但方向相反，故回路合力为零——闭合回路在均匀磁场中合力恒为零。\n(3) 回路磁矩 m = I(πR²/2) = 3.00×π×0.00640/2 = 3.02×10⁻² A·m²，方向垂直纸面；B 改为沿 +y 后 m 与 B 垂直，τ = mB sin90° = 3.02×10⁻²×0.500 = 1.51×10⁻² N·m，转轴垂直于 m 和 B，即沿直径（x 轴）。\n要点：弯曲导线的等效长度只由两端点决定，与形状无关；但力矩必须用回路面积（磁矩）算，不能只用力。"},{"id":"c13q044","type":"calc","difficulty":4,"tags":["霍尔效应","漂移速度","霍尔系数"],"stem":"一块厚度 d、宽度 w 的矩形金属薄片，电流 I 沿长度方向流过，磁场 B 垂直于薄片表面。设载流子电荷量为 q、浓度为 n。求：(1) 证明霍尔电压 U_H = IB/(nqd)，并说明为什么与宽度 w 无关；(2) 用漂移速度表示 U_H；(3) 某样品测得 U_H = 4.20 μV（I = 1.50 A、B = 0.600 T、d = 0.200 mm、w = 4.00 mm），求载流子浓度、漂移速度和霍尔系数。","answer":"(1) 见证明；(2) U_H = v_dBw；(3) n = 6.69×10²⁷ m⁻³，v_d = 1.75×10⁻³ m/s，R_H = 9.35×10⁻¹⁰ m³/C","explain":"(1) 平衡时横向电场力与洛伦兹力相等：qE_H = qv_dB，故 E_H = v_dB；横向电压 U_H = E_H·w = v_dBw。又 I = nqv_d(wd)，得 v_d = I/(nqwd)（w 同时出现在电流与电压式中）。\n代入得 U_H = IB/(nqd)：宽度 w 在分子分母中抵消，只与厚度 d 有关。\n(2) U_H = v_dBw。\n(3) n = IB/(qU_Hd) = (1.50×0.600)/(1.60×10⁻¹⁹×4.20×10⁻⁶×2.00×10⁻⁴) = 0.900/1.344×10⁻²⁸ = 6.69×10²⁷ m⁻³。\nv_d = U_H/(Bw) = 4.20×10⁻⁶/(0.600×4.00×10⁻³) = 1.75×10⁻³ m/s；R_H = 1/(nq) = 1/(6.69×10²⁷×1.60×10⁻¹⁹) = 9.35×10⁻¹⁰ m³/C。\n要点：U_H 与厚度成反比，所以霍尔片总是做得很薄；U_H 的极性可用于判断载流子类型，这是霍尔效应最重要的应用。"},{"id":"c13q045","type":"calc","difficulty":5,"tags":["两平行导线","安培力","磁场零点"],"stem":"两根平行的无限长直导线相距 d = 0.100 m，通有同向电流 I₁ = 4.00 A 和 I₂ = 9.00 A（方向都沿 +z）。求：(1) 两导线间单位长度上的安培力大小与性质；(2) 在两导线所在平面内磁感应强度为零的点的位置；(3) 若把 I₂ 反向而大小不变，零点又在哪里。","answer":"(1) F/L = μ₀I₁I₂/(2πd) = 7.20×10⁻⁵ N/m，相互吸引；(2) 两导线之间、距 4.00 A 导线 3.08×10⁻² m 处；(3) 移至 4.00 A 导线外侧、距它 8.00×10⁻² m 处","explain":"(1) 每根导线在另一根处的场为 μ₀I/(2πd)，故单位长度受力 F/L = μ₀I₁I₂/(2πd) = (4π×10⁻⁷×4.00×9.00)/(2π×0.100) = 7.20×10⁻⁵ N/m；同向电流相互吸引。\n(2) 同向电流在两导线之间的场方向相反，可能相消。设零点距 I₁ 为 x（0 \u003c x \u003c d）：μ₀I₁/(2πx) = μ₀I₂/(2π(d − x))，得 x = I₁d/(I₁ + I₂) = 4.00×0.100/13.0 = 3.08×10⁻² m。\n(3) I₂ 反向时，两场在导线之间同向，不能相消；零点移到 I₁ 的外侧（远离 I₂ 的一侧）：I₁/x = I₂/(x + d)，即 4.00(x + 0.100) = 9.00x，解得 x = 0.0800 m。\n要点：零点必定在「磁场方向相反」的区域，位置由距离反比关系决定；电流反向后位置从片内跳到片外。"},{"id":"c13q046","type":"calc","difficulty":5,"tags":["螺旋运动","螺距","周期与速率无关"],"stem":"质子（m = 1.67×10⁻²⁷ kg，q = 1.60×10⁻¹⁹ C）以 v = 1.50×10⁶ m/s 射入 B = 0.300 T 的均匀磁场，速度与 B 成 40.0° 角。求：(1) 回旋半径 r；(2) 回旋周期 T；(3) 螺距 p；(4) 若速率加倍而方向不变，r、T、p 各如何变化，并说明 T 与速率无关的物理原因。","answer":"(1) r = 3.36×10⁻² m；(2) T = 2.19×10⁻⁷ s；(3) p = 0.251 m；(4) r 与 p 加倍、T 不变；因为 T = 2πm/(qB) 只由比荷与 B 决定","explain":"分解速度：v⊥ = v sin40° = 9.64×10⁵ m/s，v∥ = v cos40° = 1.15×10⁶ m/s。\n(1) r = mv⊥/(qB) = (1.67×10⁻²⁷×9.64×10⁵)/(1.60×10⁻¹⁹×0.300) = 3.36×10⁻² m；轨道平面垂直于 B。\n(2) T = 2πm/(qB) = (2π×1.67×10⁻²⁷)/(4.80×10⁻²⁰) = 2.19×10⁻⁷ s。\n(3) 平行方向匀速：p = v∥T = 1.15×10⁶×2.19×10⁻⁷ = 0.251 m。\n(4) v 加倍时 v⊥、v∥ 都加倍，故 r ∝ v⊥ 加倍、p ∝ v∥T 加倍；而 T 中不含 v，保持不变——速率大的粒子轨道半径大、周长也按同样比例变大，绕一圈的时间恰好相同。\n易错点：把 40° 当成 v∥ 与 B 的夹角（sin/cos 互换），会使 r 与 p 的量级互换。"},{"id":"c13q047","type":"calc","difficulty":5,"tags":["质谱仪","符号推导","√m 关系"],"stem":"质谱仪中，电荷量为 q、质量为 m 的离子从静止经电压 U 加速后，垂直进入磁感应强度为 B 的均匀磁场，沿半圆轨道打在距入口 x 处的记录板上。求：(1) 证明 x = (2/B)√(2mU/q)；(2) 讨论 x 与 m 的关系（是否与 m 成正比），并给出质量分辨 Δm/m 与 Δx/x 的关系；(3) 质量数为 12 和 14 的单电荷离子（u = 1.66×10⁻²⁷ kg，e = 1.60×10⁻¹⁹ C）在 U = 3000 V、B = 0.600 T 时落点间距。","answer":"(1) 见证明；(2) x ∝ √m，Δm/m = 2Δx/x；(3) Δx = 7.3×10⁻³ m","explain":"(1) 加速过程 qU = ½mv²，得 v = √(2qU/m)；磁场中 r = mv/(qB) = √(2mU/q)/B；落点距入口 x = 2r = (2/B)√(2mU/q)。\n(2) x ∝ √m 而非正比于 m；由 x² ∝ m 微分得 Δm/m = 2Δx/x，即同样的质量差在轻元素处对应更大的落点间距。\n(3) m₁ = 12u = 1.99×10⁻²⁶ kg：2m₁U/q = 7.47×10⁻⁴，x₁ = 2×0.0273/0.600 = 9.11×10⁻² m；m₂ = 14u = 2.32×10⁻²⁶ kg：2m₂U/q = 8.72×10⁻⁴，x₂ = 9.84×10⁻² m。\nΔx = x₂ − x₁ = 7.3×10⁻³ m（约 7.3 mm）。\n要点：把 12u 与 14u 的质量差 16.7% 映射成只有 8% 的落点差，正是 √m 关系的体现。"},{"id":"c13q048","type":"calc","difficulty":5,"tags":["磁矩","磁势能","转动做功"],"stem":"边长 6.00 cm 的正方形线圈共 100 匝，通有 2.00 A 的电流，置于 0.800 T 的均匀磁场中。求：(1) 磁矩大小；(2) 最大磁力矩；(3) 磁势能 U(θ) 的表达式，以及 θ = 0°、90°、180° 时的值（θ 为磁矩与 B 的夹角）；(4) 把线圈从 θ = 0° 缓缓转到 180° 外力所做的功，并说明磁力矩在全过程中的做功符号。","answer":"(1) m = 0.720 A·m²；(2) τ_max = 0.576 N·m；(3) U = −mB cosθ，依次为 −0.576 J、0、+0.576 J；(4) W_ext = 2mB = 1.15 J，磁力矩全程做负功（−1.15 J）","explain":"(1) m = NIS = 100×2.00×(0.0600)² = 0.720 A·m²，方向沿线圈法线。\n(2) τ = mB sinθ，θ = 90° 时最大：τ_max = 0.720×0.800 = 0.576 N·m。\n(3) U = −m·B = −mB cosθ：θ = 0° 时 U = −0.576 J（稳定平衡），90° 时 0，180° 时 +0.576 J（不稳定平衡）。\n(4) W_ext = U(180°) − U(0°) = 2mB = 1.15 J；磁力矩 W_磁 = −ΔU = −1.15 J，因为在整个 0° → 180° 过程中力矩始终把线圈往 θ = 0° 拉回，与转动方向相反。若转满一圈（0° → 360°），两个半圈的功相消，净功为零。\n易错点：把「转一圈净功为零」直接套到半圈上；漏掉 N 匝；把 θ 当成线圈平面与 B 的夹角。"},{"id":"c13q049","type":"calc","difficulty":5,"tags":["安培力做功","动能定理","恒定电流导轨"],"stem":"两根平行光滑导轨水平放置、相距 L = 0.250 m，处于竖直向上、0.400 T 的均匀磁场中。一根质量 m = 0.0300 kg 的金属棒垂直跨在导轨上，由静止释放，回路中通有由外部电源维持的恒定电流 I = 8.00 A。求：(1) 棒的加速度；(2) 棒移动 d = 0.400 m 过程中安培力做的功和棒的末速率；(3) 所需时间；(4) 若磁场方向与导轨平面成 60° 角（仍有竖直分量），末速率变为多少。","answer":"(1) a = BIL/m = 26.7 m/s²；(2) W = 0.320 J，v = 4.62 m/s；(3) t = 0.173 s；(4) v = 4.30 m/s","explain":"(1) F = BIL = 0.400×8.00×0.250 = 0.800 N，a = F/m = 26.7 m/s²（恒定，故为匀加速）。\n(2) W = Fd = 0.800×0.400 = 0.320 J；由 ½mv² = W 得 v = √(2×0.320/0.0300) = √21.33 = 4.62 m/s。\n(3) 匀加速：t = √(2d/a) = √(2×0.400/26.7) = 0.173 s，可由 v = at 校验（26.7×0.173 = 4.62 m/s）。\n(4) 磁场与导轨平面成 60° 时，只有垂直于棒的水平分量有效：F = BIL sin60° = 0.693 N，W = 0.277 J，v = √(2×0.277/0.0300) = 4.30 m/s（v ∝ √sin60°）。\n要点：这里电流由电源维持恒定，安培力做正功的能量来自电源；若回路断开或含电阻，须计入动生电动势（第 14 章）。"},{"id":"c13q050","type":"calc","difficulty":5,"tags":["磁场边界","圆周几何","极限讨论"],"stem":"均匀磁场 B = 0.150 T 垂直纸面向里，只存在于 y > 0 的半空间，边界为 x 轴。质子（m = 1.67×10⁻²⁷ kg，q = 1.60×10⁻¹⁹ C）以 v = 2.00×10⁶ m/s 从原点射入，速度与边界成 α = 45° 角。求：(1) 回旋半径与周期；(2) 出射点与入射点之间的距离（用 α 表示并给数值）；(3) 在磁场中运动的时间（用 α 表示并给数值）；(4) 讨论 α → 0 与 α → 90° 两种极限。","answer":"(1) r = 0.139 m，T = 4.37×10⁻⁷ s；(2) 弦长 = 2r sinα = 0.197 m；(3) t = αT/π = 1.09×10⁻⁷ s；(4) α → 0 时弦长与时间都趋于零；α → 90° 时弦长 → 2r、时间 → T/2","explain":"(1) r = mv/(qB) = (1.67×10⁻²⁷×2.00×10⁶)/(1.60×10⁻¹⁹×0.150) = 0.139 m；T = 2πm/(qB) = 4.37×10⁻⁷ s。\n(2) 入射点与出射点都在边界上，两点连线（弦）沿 x 轴，速度与弦成 α；由圆周角定理，对应的圆心角为 2α，故弦长 = 2r sinα = 2×0.139×0.707 = 0.197 m。\n(3) 时间 t = (2α/2π)T = αT/π，代入 α = π/4 得 t = T/4 = 1.09×10⁻⁷ s。\n(4) α → 0 时粒子几乎沿边界掠过，弦长与时间都趋于 0；α = 90° 时垂直射入，走半个圆后返回边界，弦长 = 2r = 0.278 m、t = T/2。\n易错点：把圆心角写成 2(90° − α)；时间直接取 T/2；用直径 2r 代替弦长 2r sinα。"}]},{"chapter":14,"chapterName":"电磁感应与暂态","questions":[{"id":"c14q001","type":"choice","difficulty":3,"tags":["动生电动势","转杆","电势高低"],"stem":"长 L = 0.600 m 的金属细杆 OA 绕过 O 端且垂直于杆的轴，在磁感应强度 B = 0.500 T 的均匀磁场中以角速度 ω = 40.0 rad/s 匀速转动，磁场方向垂直于转动平面。A 端与 O 端之间的电势差 U_A − U_O 为","options":["3.60 V，O 端电势高","3.60 V，A 端电势高","1.80 V，A 端电势高","7.20 V，O 端电势高"],"answer":"B","explain":"取距 O 为 r、长为 dr 的微元，速度 v = ωr，方向垂直于杆，dε = Bv dr = Bωr dr。\n从 O 到 A 积分（r 从 0 到 L）：ε = ½BωL² = ½×0.500×40.0×0.600² = 3.60 V。\n由 v × B 的方向可知正电荷被推向 A 端，故 A 端电势高，U_A − U_O = +3.60 V。\n易错点：7.20 V 是漏掉 ½（把整根杆按端点速度 ωL 计算）；1.80 V 是只积到杆中点。"},{"id":"c14q002","type":"choice","difficulty":3,"tags":["RL 暂态","电流增长","时间常数"],"stem":"自感 L = 0.300 H、电阻 R = 6.00 Ω 的线圈与电动势 ε = 12.0 V 的理想电源串联，t = 0 时接通。t = 0.0500 s 时线圈中的电流 i 和电感两端的电压 u_L 分别为","options":["1.26 A，7.59 V","2.00 A，0 V","0.632 A，4.41 V","1.26 A，4.41 V"],"answer":"D","explain":"τ = L/R = 0.300/6.00 = 0.0500 s，i = (ε/R)(1 − e^(−t/τ)) = 2.00(1 − e⁻¹) = 1.26 A。\nu_L = L di/dt = ε e^(−t/τ) = 12.0×0.3679 = 4.41 V。\n此时电阻上的电压 iR = 7.59 V，两者之和恰为 12.0 V。\n易错点：7.59 V 是电阻电压而不是电感电压；0.632 A 是把 i 与 e⁻¹ 相乘而不是 1 − e⁻¹。"},{"id":"c14q003","type":"choice","difficulty":3,"tags":["自感电动势","磁场能","电流变化率"],"stem":"一自感 L = 0.400 H 的线圈中电流按 i = 3.00 − 2.00t（SI 单位）变化。t = 1.00 s 时，线圈的自感电动势大小和磁场能分别为","options":["0.800 V，0.200 J","0.800 V，0.400 J","1.60 V，0.200 J","0.400 V，0.200 J"],"answer":"A","explain":"di/dt = −2.00 A/s，|ε_L| = L|di/dt| = 0.400×2.00 = 0.800 V，方向与电流方向相同（电流减小，自感电动势维持电流）。\nt = 1.00 s 时 i = 1.00 A，W = ½Li² = ½×0.400×1.00² = 0.200 J。\n易错点：0.400 J 是漏掉能量中的 ½；1.60 V 是把 |di/dt| 误当成 4.00 A/s；0.400 V 是把 L 当成 0.200 H。"},{"id":"c14q004","type":"choice","difficulty":3,"tags":["感应电荷量","磁通量变化","法拉第定律"],"stem":"100 匝线圈的面积为 2.00×10⁻² m²，电阻为 5.00 Ω，置于与线圈平面垂直的均匀磁场中。若磁感应强度在 0.200 s 内由 0.400 T 均匀减小到 0，则通过导线横截面的电荷量为","options":["0.800 C","0.0320 C","0.160 C","0.00160 C"],"answer":"C","explain":"感应电动势 ε = NΔΦ/Δt，电流 i = ε/R，电荷量 q = ∫i dt = NΔΦ/R，与变化快慢无关。\nΔΦ = 0.400×2.00×10⁻² = 8.00×10⁻³ Wb。\nq = 100×8.00×10⁻³/5.00 = 0.160 C。\n易错点：0.800 C 漏除电阻；0.0320 C 把匝数当成 20；0.00160 C 漏乘匝数。"},{"id":"c14q005","type":"choice","difficulty":3,"tags":["楞次定律","感应电流方向","安培力"],"stem":"水平放置的铜环正上方有一条形磁铁，N 极朝下，沿环的轴线加速下落。从上往下看，磁铁接近环的过程中环内感应电流方向和环对磁铁的作用力为","options":["顺时针，环对磁铁的作用力向上","逆时针，环对磁铁的作用力向上","逆时针，环对磁铁的作用力向下","顺时针，环对磁铁的作用力向下"],"answer":"B","explain":"N 极朝下，穿过环的磁通方向向下，并随磁铁接近而增大。\n由楞次定律，感应电流的磁场向上，俯视看电流为逆时针方向。\n感应电流又阻碍相对运动，环对磁铁的作用力向上，磁铁的加速度小于 g。\n易错点：只判断电流方向而忘记「阻碍相对运动」也可判断受力；顺时针对应把感应磁场方向判反。"},{"id":"c14q006","type":"choice","difficulty":3,"tags":["螺线管自感","磁场能","安培环路定理"],"stem":"长直螺线管长 l = 0.500 m，截面积 S = 2.00×10⁻⁴ m²，每米绕 2000 匝，管内为空气。当通有 3.00 A 电流时，它的自感和管内磁场能分别为","options":["0.503 mH，2.26 mJ","0.503 mH，1.13 mJ","1.01 mH，2.26 mJ","0.251 mH，4.52 mJ"],"answer":"A","explain":"管内 B = μ₀nI，磁链 NΦ = (nl)(μ₀nI)(S)，故 L = μ₀n²Sl。\nL = 4π×10⁻⁷×2000²×2.00×10⁻⁴×0.500 = 5.03×10⁻⁴ H = 0.503 mH。\nW = ½LI² = ½×5.03×10⁻⁴×3.00² = 2.26×10⁻³ J。\n易错点：1.13 mJ 漏掉能量中的 ½；1.01 mH 把 n 当成总匝数又乘了 l；4.52 mJ 把 L 算成一半却把能量翻倍。"},{"id":"c14q007","type":"choice","difficulty":4,"tags":["转杆电动势","分段积分","电势差"],"stem":"长 L = 0.800 m 的金属杆，绕过其上距 A 端 L/4 的 O 点且垂直于杆的轴，在垂直于转动平面的均匀磁场 B = 0.600 T 中以 ω = 25.0 rad/s 匀速转动。杆两端 A、B 间的电势差 |U_A − U_B| 为","options":["4.80 V","3.00 V","1.20 V","2.40 V"],"answer":"D","explain":"把杆看成 OA（长 L/4 = 0.200 m）和 OB（长 3L/4 = 0.600 m）两段，两段切割磁感线产生的电动势方向相反。\nε = ½Bω[(3L/4)² − (L/4)²] = ½×0.600×25.0×(0.600² − 0.200²) = 7.50×0.320 = 2.40 V。\n也可分别算 ½Bω×0.600² = 2.70 V 与 ½Bω×0.200² = 0.300 V，再相减得 2.40 V。\n易错点：4.80 V 是把整根杆当成绕一端转动；3.00 V 是把两段电动势相加；1.20 V 是误用 L/2 作臂长。"},{"id":"c14q008","type":"choice","difficulty":5,"tags":["导轨滑杆","安培力","指数衰减","积分求距离"],"stem":"水平光滑导轨间距 L = 0.400 m，处于竖直向下的均匀磁场 B = 0.500 T 中，导轨左端接 R = 0.200 Ω 的电阻，金属杆质量 m = 0.100 kg、电阻不计。t = 0 时给杆水平向右的初速度 v₀ = 5.00 m/s，此后杆只受安培力。杆的加速度初始大小和最终滑行的总距离分别为","options":["10.0 m/s²，1.25 m","5.00 m/s²，2.50 m","10.0 m/s²，2.50 m","20.0 m/s²，5.00 m"],"answer":"C","explain":"ε = BLv，I = BLv/R，安培力 F = BIL = B²L²v/R，方向与速度相反。\n初始 a₀ = B²L²v₀/(mR) = 0.500²×0.400²×5.00/(0.100×0.200) = 10.0 m/s²。\n由 m dv/dt = −B²L²v/R 得 v = v₀e^(−t/τ)，τ = mR/(B²L²) = 0.0200/0.0400 = 0.500 s。\n总距离 s = ∫v dt = v₀τ = 2.50 m（速度按指数衰减，理论上永不严格为零）。\n易错点：1.25 m 是只积到速度减半；20.0 m/s² 是把安培力算成 2BIL。"},{"id":"c14q009","type":"choice","difficulty":4,"tags":["自感电动势","正弦电流","相位关系"],"stem":"自感 L = 0.250 H 的线圈中通有电流 i = 2.00 sin(400t)（SI 单位）。自感电动势的最大值，以及电流第一次达到最大值的时刻 t = π/800 s 时自感电动势的大小分别为","options":["200 V，200 V","200 V，0","100 V，0","200 V，100 V"],"answer":"B","explain":"ε_L = −L di/dt = −LωI₀cosωt，最大值为 LωI₀ = 0.250×400×2.00 = 200 V。\nt = π/800 s 时 ωt = π/2，电流达到最大值，di/dt = 0，故自感电动势为零，此时磁场能最大。\n易错点：100 V 是把 I₀ 取成 1.00 A；200 V，200 V 是认为电流最大时自感电动势也最大；200 V，100 V 是把瞬时电流值当成了电动势。"},{"id":"c14q010","type":"choice","difficulty":4,"tags":["旋转线圈","瞬时电动势","峰值"],"stem":"面积 S = 0.0200 m²、N = 100 匝的矩形线圈，在 B = 0.500 T 的匀强磁场中绕与磁场垂直的轴匀速转动，转速为 3000 r/min。当线圈平面与磁场方向成 30.0° 角时，线圈中感应电动势的大小为","options":["272 V","157 V","314 V","236 V"],"answer":"A","explain":"ω = 2π×3000/60 = 314 rad/s，峰值 ε_max = NBAω = 100×0.500×0.0200×314 = 314 V。\n线圈平面与 B 成 30.0° 时，法线与 B 成 60.0°，ε = ε_max sin60.0° = 314×0.866 = 272 V。\n易错点：157 V 用 sin30.0°（把线面夹角当成了法线夹角）；314 V 是峰值；236 V 是把 30.0° 用了两次。"},{"id":"c14q011","type":"choice","difficulty":5,"tags":["感生电场","涡旋电场","分段讨论"],"stem":"半径 R = 0.100 m 的圆柱形区域内存在垂直纸面向里的均匀磁场，磁感应强度以 dB/dt = 2.00 T/s 均匀增加。距轴线 r₁ = 0.0500 m 和 r₂ = 0.150 m 处的感生电场大小分别为","options":["0.100 V/m，0.0667 V/m","0.0500 V/m，0.150 V/m","0.0250 V/m，0.0667 V/m","0.0500 V/m，0.0667 V/m"],"answer":"D","explain":"取以轴线为圆心、半径 r 的圆为回路。r \u003c R 时 Φ = πr²B，2πrE = πr² dB/dt，故 E = (r/2)dB/dt。\nr₁ = 0.0500 m 在区内：E₁ = 0.0500×2.00/2 = 0.0500 V/m。\nr₂ = 0.150 m 在区外：Φ = πR²B，E₂ = R²/(2r₂) dB/dt = 0.100²/(2×0.150)×2.00 = 0.0667 V/m。\n方向由楞次定律判断：B 向里增加，感生电场沿顺时针方向。\n易错点：区外仍用 πr² 会得到 0.150 V/m；把 r/2 写成 r 会得到 0.100 V/m。"},{"id":"c14q012","type":"choice","difficulty":5,"tags":["同轴电缆","自感","磁通积分"],"stem":"同轴电缆内导体半径为 a = 1.00 mm，外导体内半径为 b = 5.00 mm，两导体之间为空气，电流 I 从内导体流去、由外导体流回。该电缆每米长度的自感为","options":["0.644 μH/m","0.161 μH/m","0.322 μH/m","0.805 μH/m"],"answer":"C","explain":"两导体间 B = μ₀I/(2πr)。取长 l、半径 r、厚 dr 的圆柱薄层，磁通 dΦ = (μ₀I/(2πr))·l dr。\n单位长度磁通 Φ/l = (μ₀I/2π)ln(b/a)，故 L/l = Φ/(Il) = (μ₀/2π)ln(b/a)。\n= 2.00×10⁻⁷×ln5.00 = 3.22×10⁻⁷ H/m = 0.322 μH/m。\n易错点：0.644 是把 ln5 当成 2ln5；0.161 是漏掉 2π 中的一个 2；0.805 是直接用 b/a 代替 ln(b/a)。"},{"id":"c14q013","type":"choice","difficulty":4,"tags":["互感","耦合系数","互感电动势"],"stem":"两线圈的自感分别为 L₁ = 2.00 mH、L₂ = 8.00 mH，耦合系数 k = 0.500。当线圈 1 中的电流以 50.0 A/s 均匀增加时，线圈 2 中互感电动势的大小为","options":["0.200 V","0.100 V","0.0500 V","0.250 V"],"answer":"B","explain":"M = k√(L₁L₂) = 0.500×√(2.00×8.00)×10⁻³ = 0.500×4.00×10⁻³ = 2.00×10⁻³ H。\n|ε₂| = M|dI₁/dt| = 2.00×10⁻³×50.0 = 0.100 V。\n易错点：0.200 V 漏掉耦合系数 k；0.0500 V 把 M 算成 1.00 mH；0.250 V 用 L₁ + L₂ 代替 √(L₁L₂)。"},{"id":"c14q014","type":"choice","difficulty":4,"tags":["顺串反串","等效电感","互感"],"stem":"两线圈的自感分别为 L₁ = 0.200 H、L₂ = 0.300 H，耦合系数 k = 0.600。把它们顺串时等效电感 L_顺 与反串时等效电感 L_反 之差为","options":["0.588 H","0.294 H","0.147 H","0.794 H"],"answer":"A","explain":"M = k√(L₁L₂) = 0.600×√(0.200×0.300) = 0.600×0.245 = 0.147 H。\n顺串 L_顺 = L₁ + L₂ + 2M，反串 L_反 = L₁ + L₂ − 2M，故差值 = 4M = 0.588 H。\n易错点：0.294 H 只算 2M；0.147 H 只算 M；0.794 H 是顺串等效电感本身，不是差值。"},{"id":"c14q015","type":"choice","difficulty":4,"tags":["RL 放电","续流","时间常数"],"stem":"自感 L = 0.500 H、电阻 R_L = 10.0 Ω 的线圈中通有 3.00 A 的稳态电流。t = 0 时断开电源，同时接入 R = 40.0 Ω 的续流电阻，使线圈与两电阻形成闭合回路。电流降到 0.300 A 所需时间为","options":["11.5 ms","34.5 ms","50.0 ms","23.0 ms"],"answer":"D","explain":"断开后回路总电阻 R_total = 10.0 + 40.0 = 50.0 Ω，τ = L/R_total = 0.500/50.0 = 10.0 ms。\ni = I₀e^(−t/τ)，由 0.300 = 3.00e^(−t/τ) 得 t = τln10 = 10.0×2.303 = 23.0 ms。\n易错点：11.5 ms 用 ln√10（把电流比当成 1/√10）；50.0 ms 忘记把线圈电阻计入总电阻（误用 τ = 0.500/10.0）。"},{"id":"c14q016","type":"choice","difficulty":4,"tags":["磁场能量密度","磁场总能量","真空磁导率"],"stem":"一均匀磁场 B = 1.20 T 存在于体积 V = 2.00×10⁻³ m³ 的空间中，真空磁导率 μ₀ = 4π×10⁻⁷ T·m/A。该磁场的总能量为","options":["5.73×10⁵ J","2.29×10³ J","1.15×10³ J","5.73×10² J"],"answer":"C","explain":"磁场能量密度 u = B²/(2μ₀) = 1.20²/(2×4π×10⁻⁷) = 5.73×10⁵ J/m³。\n总能量 W = uV = 5.73×10⁵×2.00×10⁻³ = 1.15×10³ J。\n易错点：5.73×10⁵ J 只算了能量密度没乘体积；2.29×10³ J 漏掉分母中的 2；5.73×10² J 把体积缩小了 2 倍。"},{"id":"c14q017","type":"choice","difficulty":5,"tags":["电子感应加速器","同步条件","感生电场"],"stem":"电子感应加速器中，电子轨道半径 R = 0.200 m，轨道处的磁感应强度 B_R = 0.0400 T。若电子恰好被约束在该圆轨道上并持续加速，则轨道所围面积内的平均磁感应强度 B̄ 和电子的动量 p 分别为（e = 1.60×10⁻¹⁹ C）","options":["0.0400 T，1.28×10⁻²¹ kg·m/s","0.0800 T，1.28×10⁻²¹ kg·m/s","0.0800 T，2.56×10⁻²¹ kg·m/s","0.0200 T，6.40×10⁻²² kg·m/s"],"answer":"B","explain":"同步条件由两个要求联立：感生电场提供切向加速，磁场提供径向约束。\n由 2πRE = πR² dB̄/dt 得 E = (R/2)dB̄/dt；又 p = eB_RR，dp/dt = eE。\n比较得 dB_R/dt = ½dB̄/dt，从零开始增长时 B_R = ½B̄，故 B̄ = 2B_R = 0.0800 T。\np = eB_RR = 1.60×10⁻¹⁹×0.0400×0.200 = 1.28×10⁻²¹ kg·m/s。\n易错点：B_R = B̄ 使 B̄ 偏小一半；p 中多乘 2 会得到 2.56×10⁻²¹ kg·m/s。"},{"id":"c14q018","type":"choice","difficulty":4,"tags":["电子感应加速器","每圈能量","感生电动势"],"stem":"电子感应加速器的轨道半径 R = 0.500 m，轨道面积内平均磁感应强度以 dB̄/dt = 20.0 T/s 均匀增加。电子每绕行一圈获得的动能约为（e = 1.60×10⁻¹⁹ C）","options":["2.51×10⁻¹⁸ J","1.26×10⁻¹⁸ J","5.03×10⁻¹⁸ J","7.85×10⁻¹⁸ J"],"answer":"A","explain":"每圈感生电动势 ε = πR² dB̄/dt = π×0.500²×20.0 = 15.7 V。\n电子每圈获得动能 ΔK = eε = 1.60×10⁻¹⁹×15.7 = 2.51×10⁻¹⁸ J（约 15.7 eV）。\n易错点：1.26×10⁻¹⁸ J 把面积算成 πR²/2；5.03×10⁻¹⁸ J 把 ε 算成 2πR²dB/dt；7.85×10⁻¹⁸ J 用 2πR 代替 πR²。"},{"id":"c14q019","type":"choice","difficulty":4,"tags":["线框出磁场","安培力","感应电流"],"stem":"边长 a = 0.200 m 的正方形线框，电阻 R = 0.100 Ω，以 v = 1.50 m/s 匀速向右被拉出宽匀强磁场区域，B = 0.500 T，方向垂直纸面向里。线框离开磁场的过程中，感应电流的大小和维持匀速所需外力分别为","options":["1.50 A，0.300 N","0.750 A，0.0750 N","3.00 A，0.150 N","1.50 A，0.150 N"],"answer":"D","explain":"只有一条边在磁场内切割磁感线，ε = Bav = 0.500×0.200×1.50 = 0.150 V，I = ε/R = 1.50 A。\n安培力 F_A = BIa = 0.500×1.50×0.200 = 0.150 N，方向向左；匀速拉出需外力大小相等。\n易错点：0.300 N 把两边都算受力；0.750 A 用 a/2 作切割长度；3.00 A 把 ε 算成 2Bav。"},{"id":"c14q020","type":"choice","difficulty":5,"tags":["非均匀磁场","动生电动势","磁通变化"],"stem":"边长 a = 0.100 m 的正方形线框在 xOy 平面内，一边与 y 轴平行，以 v = 2.00 m/s 沿 x 轴正方向匀速运动。空间中存在垂直纸面向里的磁场，其大小随 x 线性增加：B = 0.500x（SI 单位，0 ≤ x ≤ 1.00 m）。当线框完全进入磁场区域后，线框中感应电动势的大小为","options":["0.00500 V","0.0200 V","0.0100 V","0 V"],"answer":"C","explain":"线框两竖直边处的磁感应强度分别为 B(x) 与 B(x+a)，磁通 Φ = a∫B dx，故 ε = |dΦ/dt| = av[B(x+a) − B(x)]。\nB 随 x 线性增加，B(x+a) − B(x) = 0.500a = 0.0500 T。\nε = 0.100×2.00×0.0500 = 0.0100 V。\n易错点：0 V 是误认为「完全进入后磁通不变」——磁场不均匀时磁通仍随位置改变；0.00500 V 只算了一条边的电动势。"},{"id":"c14q021","type":"choice","difficulty":5,"tags":["正弦磁场","感生电场","振幅与相位"],"stem":"半径 R = 0.0500 m 的圆柱形区域内有轴向均匀磁场，B = B₀ sin ωt，B₀ = 0.0200 T，ω = 314 rad/s。距轴线 r = 3R 处的感生电场振幅为","options":["1.57×10⁻¹ V/m","5.23×10⁻² V/m","1.05×10⁻¹ V/m","2.62×10⁻² V/m"],"answer":"B","explain":"r > R 时，2πrE = πR² dB/dt，故 E = R²ωB₀cosωt/(2r)。\n振幅 E_max = R²ωB₀/(2×3R) = RωB₀/6 = 0.0500×314×0.0200/6 = 5.23×10⁻² V/m。\n相位：E 与 dB/dt 同相，B 达到最大值时 E = 0。\n易错点：1.57×10⁻¹ V/m 是 r = R 处的振幅；1.05×10⁻¹ V/m 漏掉分母中的 2；2.62×10⁻² V/m 把 r 当成 6R。"},{"id":"c14q022","type":"choice","difficulty":5,"tags":["螺线管","感生电动势","有效磁通"],"stem":"长直螺线管每米绕 5000 匝，半径 r = 0.0200 m，管内为空气。螺线管中的电流以 20.0 A/s 均匀增加。在螺线管外、与螺线管同轴放置一个半径 R = 0.0500 m 的单匝圆环，环中感应电动势为","options":["1.58×10⁻⁴ V","3.95×10⁻⁴ V","6.32×10⁻⁵ V","9.87×10⁻⁴ V"],"answer":"A","explain":"螺线管内 B = μ₀nI，dB/dt = μ₀n dI/dt = 4π×10⁻⁷×5000×20.0 = 1.26×10⁻¹ T/s。\n穿过圆环的磁通只存在于螺线管截面内：Φ = Bπr²，故 ε = πr² dB/dt = π×0.0200²×0.1257 = 1.58×10⁻⁴ V。\n易错点：3.95×10⁻⁴ V 用圆环面积 πR²（管外无磁场）；6.32×10⁻⁵ V 用直径算管面积；9.87×10⁻⁴ V 把 n 当成总匝数。"},{"id":"c14q023","type":"choice","difficulty":5,"tags":["互感","同心圆环","磁场叠加"],"stem":"半径 R = 0.200 m 的大圆环与半径 r = 0.0500 m 的小圆环同轴共面，小环面积远小于大环。两环间的互感为（μ₀ = 4π×10⁻⁷ T·m/A）","options":["4.93×10⁻⁸ H","1.23×10⁻⁸ H","9.87×10⁻⁸ H","2.47×10⁻⁸ H"],"answer":"D","explain":"大环电流 I 在圆心产生的磁场 B = μ₀I/(2R)，小环磁通 Φ₂₁ = Bπr² = μ₀Iπr²/(2R)。\nM = Φ₂₁/I = μ₀πr²/(2R) = 4π×10⁻⁷×π×0.0500²/(2×0.200) = 2.47×10⁻⁸ H。\n易错点：4.93×10⁻⁸ H 漏掉分母中的 2；1.23×10⁻⁸ H 把 r 当成直径；9.87×10⁻⁸ H 用大环面积代替小环面积。"},{"id":"c14q024","type":"choice","difficulty":5,"tags":["环形螺线管","自感","非均匀磁场积分"],"stem":"环形螺线管截面为矩形，内半径 a = 0.0500 m，外半径 b = 0.100 m，高度 h = 0.0200 m，共 N = 1000 匝，介质为空气。其自感为","options":["1.39 mH","4.00 mH","2.77 mH","5.55 mH"],"answer":"C","explain":"环内 B = μ₀NI/(2πr)，穿过一匝的磁通 Φ = ∫B h dr（r 从 a 到 b）= μ₀NIh ln(b/a)/(2π)。\nL = NΦ/I = μ₀N²h ln(b/a)/(2π) = 4π×10⁻⁷×10⁶×0.0200×ln2/(2π) = 2.77×10⁻³ H。\n易错点：1.39 mH 漏掉 2π 中的 2；4.00 mH 用算术平均半径代替 ln(b/a)；5.55 mH 把 ln(b/a) 当成 2ln(b/a)。"},{"id":"c14q025","type":"choice","difficulty":5,"tags":["RL 断电","自感电动势","电压尖峰"],"stem":"电动势 ε = 24.0 V 的电源、R₁ = 12.0 Ω 的电阻与 L = 0.600 H 的理想电感串联，达到稳态后，用开关把电源断开，同时把 R₂ = 48.0 Ω 的电阻与电感并联形成续流回路。开关断开瞬间电感两端电压的大小为","options":["24.0 V","96.0 V","48.0 V","120 V"],"answer":"B","explain":"断开前稳态电流 I = ε/R₁ = 2.00 A；电感中的电流不能突变，断开瞬间仍为 2.00 A。\n该电流只能经 R₂ 续流，故电感两端电压 u_L = IR₂ = 2.00×48.0 = 96.0 V。\n易错点：24.0 V 是电源电压；48.0 V 把电流当成 1.00 A；120 V 把 R₁ 也算进续流回路（2.00×60.0）。"},{"id":"c14q026","type":"choice","difficulty":5,"tags":["RL 暂态","能量分配","电源做功"],"stem":"电感 L 与电阻 R 串联后接在恒定电压 ε 上，t = 0 时接通。当电流达到稳定值的一半时，电源提供的能量中转化为磁场能的比例约为","options":["64.7%","50.0%","25.0%","35.3%"],"answer":"A","explain":"i = I∞(1 − e^(−x))，x = t/τ。电流为 I∞/2 时 e^(−x) = ½，x = ln2。\n电源做功 W = ε∫i dt = I∞²Rτ[x − (1 − e^(−x))] = 0.1931I∞²Rτ。\n磁场能 W_L = ½L(I∞/2)² = 0.125I∞²Rτ，占 0.125/0.1931 = 64.7%。\n焦耳热占 35.3%，说明暂态过程中电源的能量并非一半对一半分配。\n易错点：50% 是想当然；25% 只算 (1/2)² 而没除以电源总功。"},{"id":"c14q027","type":"choice","difficulty":5,"tags":["导轨电容器","安培力","匀加速运动"],"stem":"水平光滑导轨间距 L = 0.500 m，处于竖直向下的均匀磁场 B = 0.400 T 中，金属杆质量 m = 0.200 kg、电阻不计，导轨左端接电容 C = 2.00×10⁻³ F。t = 0 起用水平恒力 F = 0.500 N 向右拉杆。杆的加速度和电容储能与杆动能之比分别为","options":["2.50 m/s²，2.00×10⁻⁴","0.500 m/s²，4.00×10⁻⁴","2.48 m/s²，8.00×10⁻⁴","2.50 m/s²，4.00×10⁻⁴"],"answer":"D","explain":"杆速 v 时 ε = BLv，电容电压 U = ε，q = CBLv，电流 i = dq/dt = CBLa。\n安培力 F_A = BiL = B²L²Ca，由牛顿第二定律 F − B²L²Ca = ma，得 a = F/(m + B²L²C)。\nB²L²C = 0.400²×0.500²×2.00×10⁻³ = 8.00×10⁻⁵ kg，远小于 m，a ≈ 0.500/0.200 = 2.50 m/s²。\n能量比 W_C/W_K = ½C(BLv)²/(½mv²) = B²L²C/m = 4.00×10⁻⁴。\n易错点：0.500 m/s² 忽略安培力；2.48 m/s² 把 B²L²C 算成 2×10⁻³；2.00×10⁻⁴ 漏掉 C 中的一个 2。"},{"id":"c14q028","type":"choice","difficulty":5,"tags":["长直导线","非均匀磁场","感应电动势"],"stem":"长直导线中通有 I = 50.0 A 的恒定电流。在导线所在平面内放一矩形线框，其长边与导线平行，平行边长 a = 0.200 m，垂直边长 b = 0.100 m，靠近导线的一边到导线距离 r = 0.100 m。线框以 v = 1.00 m/s 沿垂直于导线的方向匀速远离。此时线框中感应电动势的大小为","options":["2.00×10⁻⁵ V","5.00×10⁻⁶ V","1.00×10⁻⁵ V","1.00×10⁻⁴ V"],"answer":"C","explain":"距导线 x 处 B = μ₀I/(2πx)，穿过线框的磁通 Φ = (μ₀Ia/2π)ln[(r+b)/r]。\n对时间求导，dΦ/dt = −(μ₀Iavb)/(2πr(r+b))。\n大小 = 2×10⁻⁷×50.0×0.200×1.00×0.100/(0.100×0.200) = 1.00×10⁻⁵ V。\n易错点：2.00×10⁻⁵ V 把磁场在整段 b 上都按 r 处取值；5.00×10⁻⁶ V 漏掉 b；1.00×10⁻⁴ V 把 ln 的差当成 b/r 后又放大了 10 倍。"},{"id":"c14q029","type":"choice","difficulty":4,"tags":["RC 放电","时间常数","能量分配"],"stem":"电容 C = 20.0 μF 充电到 U₀ = 100 V 后，通过 R = 5.00 kΩ 的电阻放电。电容器的电场能降到初始值的 10% 所需时间，以及这段时间内电阻产生的热量分别为","options":["0.230 s，0.0900 J","0.115 s，0.0900 J","0.115 s，0.0100 J","0.0500 s，0.100 J"],"answer":"B","explain":"τ = RC = 5.00×10³×20.0×10⁻⁶ = 0.100 s，U = U₀e^(−t/τ)，能量与 U² 成正比。\n由 e^(−2t/τ) = 0.10 得 t = (τ/2)ln10 = 0.115 s。\n初始能量 W₀ = ½CU₀² = ½×20.0×10⁻⁶×100² = 0.100 J；降到 10% 时放出热量 Q = 0.90W₀ = 0.0900 J。\n易错点：0.230 s 忘记能量与 U² 成正比（用 e^(−t/τ) = 0.1）；0.0100 J 把剩余能量当成放出的热量。"},{"id":"c14q030","type":"choice","difficulty":5,"tags":["线框出磁场","外力做功","焦耳热"],"stem":"边长 a = 0.100 m、电阻 R = 0.0500 Ω 的正方形线框，在 B = 0.400 T 的匀强磁场中以 v = 2.00 m/s 匀速被拉出磁场区域，磁场方向垂直于线框平面。线框完全离开磁场的过程中，外力做的功和线框中产生的焦耳热分别为","options":["6.40×10⁻³ J，6.40×10⁻³ J","6.40×10⁻³ J，3.20×10⁻³ J","3.20×10⁻³ J，3.20×10⁻³ J","1.28×10⁻² J，1.28×10⁻² J"],"answer":"A","explain":"拉出过程中 ε = Bav = 0.400×0.100×2.00 = 0.0800 V，I = ε/R = 1.60 A。\n安培力 F_A = BIa = 0.400×1.60×0.100 = 0.0640 N，外力等大反向；线框移动距离 a，W = Fa = 6.40×10⁻³ J。\n焦耳热 Q = I²Rt，t = a/v = 0.0500 s，Q = 1.60²×0.0500×0.0500 = 6.40×10⁻³ J，与外力功相等。\n易错点：3.20×10⁻³ J 只用半个边长；1.28×10⁻² J 把安培力算成 2BIa。"},{"id":"c14q031","type":"choice","difficulty":4,"tags":["RC 充电","时间常数","与 RL 比较"],"stem":"电动势 ε = 10.0 V 的电源、R = 1.00 kΩ 的电阻与 C = 10.0 μF 的电容串联，t = 0 时接通。电容电压达到 6.00 V 所需时间，以及若改用自感 L 与同一电阻串联使时间常数相同，L 应为","options":["5.11 ms，10.0 H","9.16 ms，1.00 H","23.0 ms，10.0 H","9.16 ms，10.0 H"],"answer":"D","explain":"τ = RC = 1.00×10³×10.0×10⁻⁶ = 10.0 ms，u_C = ε(1 − e^(−t/τ))。\n6.00 = 10.0(1 − e^(−t/τ))，e^(−t/τ) = 0.400，t = τln2.50 = 9.16 ms。\nRL 电路时间常数 τ = L/R，令 L/R = RC 得 L = R²C = (1.00×10³)²×10.0×10⁻⁶ = 10.0 H。\n易错点：5.11 ms 用 ln2；1.00 H 把 L = RC 直接相乘（漏掉一个 R）；23.0 ms 用 ln10（误按降到 10% 算）。"},{"id":"c14q032","type":"choice","difficulty":4,"tags":["电感短路","RL 放电","放热"],"stem":"自感 L = 0.800 H、电阻 R = 2.00 Ω 的线圈中通有 5.00 A 的稳态电流，t = 0 时把线圈两端短接。电流降到 1.00 A 所需时间，以及这段时间内线圈放出的热量分别为","options":["0.644 s，4.80 J","0.322 s，9.60 J","0.644 s，9.60 J","1.12 s，16.0 J"],"answer":"C","explain":"短接后 τ = L/R = 0.800/2.00 = 0.400 s，i = I₀e^(−t/τ)。\n1.00 = 5.00e^(−t/τ)，t = τln5 = 0.400×1.609 = 0.644 s。\n放出热量等于磁场能减少量：Q = ½L(I₀² − I²) = ½×0.800×(25.0 − 1.00) = 9.60 J。\n易错点：4.80 J 只算到电流减半；0.322 s 用 ln√5；16.0 J 把初态能量全部当成放出热量。"},{"id":"c14q033","type":"choice","difficulty":5,"tags":["双杆导轨","动量守恒","焦耳热"],"stem":"两根相同的金属杆质量均为 m = 0.100 kg、电阻均为 R = 0.100 Ω，垂直搁在间距 L = 0.500 m 的水平光滑平行导轨上，导轨电阻不计，整个装置处于竖直向下的均匀磁场 B = 0.500 T 中。t = 0 时给杆 1 初速度 v₀ = 4.00 m/s，杆 2 静止。两杆最终达到共同速度，则共同速度和全过程产生的总焦耳热分别为","options":["2.00 m/s，0.800 J","2.00 m/s，0.400 J","4.00 m/s，0","1.00 m/s，0.600 J"],"answer":"B","explain":"两杆所受安培力等大反向，系统水平方向动量守恒：mv₀ = 2mv，v = 2.00 m/s。\n总焦耳热等于动能损失：Q = ½mv₀² − 2×½mv² = ½×0.100×16.0 − 0.100×4.00 = 0.400 J。\n也可用相对运动算：Q = ½μv_rel²，μ = m/2 为约化质量。\n易错点：0.800 J 忘记两杆都有动能；1.00 m/s 误按质量比 1:3；0 J 认为无摩擦就没有能量损失。"},{"id":"c14q034","type":"choice","difficulty":4,"tags":["自感电动势","平均电动势","磁场能"],"stem":"自感 L = 0.250 H 的线圈中电流在 0.0500 s 内由 4.00 A 均匀减小到 0。这段时间内自感电动势的平均大小和磁场能减少量分别为","options":["20.0 V，2.00 J","20.0 V，4.00 J","5.00 V，2.00 J","80.0 V，2.00 J"],"answer":"A","explain":"平均自感电动势大小 |ε| = L|Δi|/Δt = 0.250×4.00/0.0500 = 20.0 V。\n磁场能减少量 ΔW = ½L(I₀² − 0) = ½×0.250×16.0 = 2.00 J。\n这部分能量通过自感电动势做功转化为焦耳热（若回路闭合）。\n易错点：4.00 J 漏掉 ½；5.00 V 用 Δt = 0.200 s；80.0 V 把 L 当成 1.00 H。"},{"id":"c14q035","type":"choice","difficulty":5,"tags":["耦合线圈","磁场能量","互感"],"stem":"两线圈的自感分别为 L₁ = 0.200 H、L₂ = 0.300 H，互感 M = 0.100 H，其中电流分别为 I₁ = 2.00 A、I₂ = 3.00 A。两电流产生的磁场互相加强时总磁场能 W_a 与互相削弱时总磁场能 W_o 之差为","options":["0.600 J","2.40 J","0.300 J","1.20 J"],"answer":"D","explain":"耦合线圈总磁场能 W = ½L₁I₁² + ½L₂I₂² ± MI₁I₂。\n½L₁I₁² = 0.400 J，½L₂I₂² = 1.350 J，MI₁I₂ = 0.100×2.00×3.00 = 0.600 J。\nW_a = 2.35 J，W_o = 1.15 J，差值 = 2MI₁I₂ = 1.20 J。\n易错点：0.600 J 只算一项 MI₁I₂；2.40 J 把差值当成 4MI₁I₂；0.300 J 把 M 当成 0.050 H。"},{"id":"c14q036","type":"calc","difficulty":4,"tags":["转杆电动势","微元法","符号推导"],"stem":"长 L = 0.800 m 的金属杆 OA 绕过 O 端且垂直于杆的轴，在垂直于转动平面的均匀磁场 B = 0.500 T 中以角速度 ω = 20.0 rad/s 匀速转动。(1) 用微元法推导动生电动势 ε = ½BωL²；(2) 求 ε 的数值；(3) 若 U_O = 0，求 U_A，并说明哪端电势高。","answer":"(1) ε = ∫Bωr dr（积分限 0 到 L）= ½BωL²；(2) 3.20 V；(3) U_A = +3.20 V，A 端电势高","explain":"在距 O 为 r 处取长 dr 的微元，其速度 v = ωr，方向垂直于杆，v 与 B 垂直。\ndε = Bv dr = Bωr dr，各微元电动势方向相同（由 v × B 决定，指向 A 端）。\nε = ∫Bωr dr（r 从 0 到 L）= ½BωL² = ½×0.500×20.0×0.800² = 3.20 V。\n正电荷被推向 A 端，故 A 端电势高，U_A − U_O = 3.20 V，U_A = +3.20 V。\n易错点：若把整根杆按端点速度 v = ωL 计算，会得到 ε = BωL² = 6.40 V，正好大一倍。"},{"id":"c14q037","type":"calc","difficulty":5,"tags":["导轨滑杆","微分方程","指数衰减","能量守恒"],"stem":"水平光滑导轨间距 L = 0.500 m，处于竖直向下的均匀磁场 B = 0.800 T 中，导轨左端接 R = 0.400 Ω 的电阻。质量 m = 0.200 kg、电阻不计的金属杆以初速度 v₀ = 4.00 m/s 沿导轨滑行，只受安培力。(1) 求 v(t)；(2) 速度减为 2.00 m/s 所需时间；(3) 杆滑行的总距离；(4) 全过程电阻产生的热量。","answer":"(1) v = 4.00e^(−2.00t) m/s；(2) 0.347 s；(3) 2.00 m；(4) 1.60 J","explain":"杆切割磁感线，回路面积变化率 dS/dt = Lv 随速度减小而减小，故电动势不是恒定的 B L v，必须解微分方程。\n电动势大小为 B L v，I = B L v/R，安培力 F = B I L = B²L²v/R，方向与 v 相反。\n由 m dv/dt = −B²L²v/R 得 dv/v = −(B²L²/(mR))dt，积分得 v = v₀e^(−t/τ)，τ = mR/(B²L²) = 0.200×0.400/(0.800²×0.500²) = 0.500 s。\n速度减半：2.00 = 4.00e^(−t/0.500)，t = 0.500ln2 = 0.347 s。\n总距离 s = ∫v dt = v₀τ = 2.00 m；总热量 Q = ½mv₀² = 1.60 J（动能全部转化为焦耳热）。\n易错点：把安培力当恒力会用匀减速公式得到错误距离；总热量不等于 m v₀²。"},{"id":"c14q038","type":"calc","difficulty":5,"tags":["旋转线圈","正弦交流","平均电动势","感应电荷量"],"stem":"N = 200 匝、面积 S = 1.50×10⁻² m² 的矩形线圈，在 B = 0.600 T 的匀强磁场中绕与磁场垂直的轴以 ω = 100π rad/s 匀速转动，t = 0 时线圈平面与磁场平行，回路总电阻 R = 10.0 Ω。(1) 写出感应电动势 ε(t)；(2) 求峰值；(3) 求从 t = 0 到 t = T/4 的平均电动势；(4) 求从 t = 0 到 t = T/4 内通过回路的电荷量。","answer":"(1) ε = −565cos(314t) V（大小 565|cos314t|）；(2) 565 V；(3) 360 V；(4) 0.180 C","explain":"t = 0 时线圈平面与 B 平行，磁通 Φ = NBS sinωt，故 ε = −dΦ/dt = −NBSω cosωt。\n峰值 ε_max = NBSω = 200×0.600×1.50×10⁻²×314 = 565 V。\nT/4 内磁通由 0 增至 NBS，平均电动势 = NBS/(T/4) = 4NBS/T = 2NBSω/π = 360 V。\n电荷量 q = NΔΦ/R = NBS/R = 200×0.600×1.50×10⁻²/10.0 = 0.180 C。\n易错点：平均电动势不是峰值的一半（那是正弦绝对值平均的另一结论）；q 与转动快慢无关。"},{"id":"c14q039","type":"calc","difficulty":5,"tags":["感生电场","涡旋电场","分段讨论","电场做功"],"stem":"半径 R = 0.100 m 的圆柱形区域内存在轴向均匀磁场，方向垂直纸面向里，B(t) = B₀ + kt，B₀ = 0.200 T，k = 1.50 T/s。(1) 求 r \u003c R 和 r > R 处感生电场 E(r) 的表达式，并说明方向；(2) 求 r = 0.0500 m 和 r = 0.300 m 处 E 的大小；(3) 一电子在 r = 0.0500 m 处沿感生电场方向绕行一周，感生电场对它做的功。","answer":"(1) r \u003c R：E = kr/2，逆时针；r > R：E = kR²/(2r)，逆时针；(2) 3.75×10⁻² V/m，2.50×10⁻² V/m；(3) −1.89×10⁻²¹ J","explain":"(1) 取逆时针为回路正方向，回路法线沿 +z（垂直纸面向外）。磁场向里（−z 方向）且 B = B₀ + kt 随时间增大，通过回路的磁通 Φ = −Bπr²，dΦ/dt = −kπr²。由 ∮E·dl = −dΦ/dt 得 E·2πr = +kπr²，故 E = kr/2，结果为正说明沿逆时针方向（感应磁场向外，与向里增大的原磁场对抗）。r > R 时 E·2πr = kπR²，E = kR²/(2r)，同样逆时针。(2) r = 0.0500 m（r \u003c R）：E = 1.50×0.0500/2 = 3.75×10⁻² V/m；r = 0.300 m（r > R）：E = 1.50×0.100²/(2×0.300) = 2.50×10⁻² V/m。(3) 电子沿感生电场方向绕行一周，电场力与位移反向（电子带负电），做功 W = −eE·2πr = −1.60×10⁻¹⁹×3.75×10⁻²×2π×0.0500 = −1.89×10⁻²¹ J。易错点：方向判反（用「逆时针还是顺时针」去记而不是用楞次定律推）；把 r > R 也写成 kr/2。"},{"id":"c14q040","type":"calc","difficulty":5,"tags":["正弦磁场","感生电场","分段讨论","相位"],"stem":"半径 R = 0.0500 m 的圆柱形区域内有轴向均匀磁场，B = B₀ sinωt，B₀ = 0.0400 T，频率 f = 1000 Hz。(1) 求 r \u003c R 和 r > R 处感生电场 E(r,t) 的表达式；(2) 求 r = 0.150 m 处 E 的振幅；(3) 求 B 第一次达到正向最大时 E 的大小。","answer":"(1) r \u003c R：E = ½rωB₀cosωt；r > R：E = R²ωB₀cosωt/(2r)；(2) 2.09 V/m；(3) 0","explain":"ω = 2πf = 6.28×10³ rad/s；由 2πrE = −d(πr²B)/dt 得 r \u003c R 时 E = ½rωB₀cosωt。\nr > R 时磁通只算区域截面：2πrE = πR²ωB₀cosωt，E = R²ωB₀cosωt/(2r)。\n振幅 E_max(0.150) = R²ωB₀/(2×0.150) = 0.0500²×6.28×10³×0.0400/0.300 = 2.09 V/m。\nB 达到最大值时 dB/dt = 0，故 E = 0；E 的相位比 B 超前 90°。\n易错点：区外用 r² 会得到 6.28 V/m；把 cos 写成 sin 会误判 B 最大时 E 最大。"},{"id":"c14q041","type":"calc","difficulty":4,"tags":["螺线管自感","磁场能","电源做功"],"stem":"长 l = 0.400 m、截面积 S = 5.00×10⁻⁴ m²、总匝数 N = 800 匝的长直螺线管，管内为空气。(1) 推导自感 L = μ₀n²V 并求数值；(2) 通有 2.50 A 电流时管内磁场能；(3) 电流从 0 增至 2.50 A 的过程中，电源除提供焦耳热外还需多做多少功。","answer":"(1) L = 1.01×10⁻³ H；(2) 3.14×10⁻³ J；(3) 3.14×10⁻³ J","explain":"n = N/l = 2000 m⁻¹，管内 B = μ₀nI，磁通 Φ = BS = μ₀nIS，磁链 NΦ = μ₀n²lSI。\nL = NΦ/I = μ₀n²V，V = Sl = 2.00×10⁻⁴ m³，L = 4π×10⁻⁷×4.00×10⁶×2.00×10⁻⁴ = 1.01×10⁻³ H。\nW = ½LI² = ½×1.01×10⁻³×2.50² = 3.14×10⁻³ J。\n电源额外做的功等于建立磁场储存的能量，即 3.14×10⁻³ J（焦耳热另计）。\n易错点：把 n 当成总匝数 N 会差 l² 倍；额外功不是 ½LI² 的 2 倍。"},{"id":"c14q042","type":"calc","difficulty":5,"tags":["同轴电缆","磁场能量法","自感推导"],"stem":"同轴电缆内导体半径为 a，外导体内半径为 b，两导体间充满磁导率为 μ₀ 的介质，电流 I 沿内导体流去、沿外导体流回。(1) 用磁场能量法推导单位长度自感 L/l = (μ₀/2π)ln(b/a)；(2) 取 a = 1.00 mm、b = 4.00 mm，求每米自感；(3) 通有 10.0 A 电流时每米电缆中储存的磁场能。","answer":"(1) L/l = (μ₀/2π)ln(b/a)；(2) 2.77×10⁻⁷ H/m；(3) 1.39×10⁻⁵ J/m","explain":"两导体间 B = μ₀I/(2πr)，能量密度 u = B²/(2μ₀) = μ₀I²/(8π²r²)。\n单位长度能量 W/l = ∫u·2πr dr（r 从 a 到 b）= (μ₀I²/4π)ln(b/a)。\n与 W/l = ½(L/l)I² 比较得 L/l = (μ₀/2π)ln(b/a)。\n数值：L/l = 2.00×10⁻⁷×ln4.00 = 2.77×10⁻⁷ H/m；W/l = ½×2.77×10⁻⁷×10.0² = 1.39×10⁻⁵ J/m。\n易错点：能量积分漏掉 2πr 会得到含 1/a 的错误结果；把 ln(b/a) 写成 (b−a)/a 数值偏差很大。"},{"id":"c14q043","type":"calc","difficulty":4,"tags":["互感","同轴螺线管","耦合系数"],"stem":"长 l = 0.500 m 的螺线管 A 每米绕 n₁ = 2000 匝，截面积 S = 2.00×10⁻⁴ m²。在它外面同轴绕一个总匝数 N₂ = 500 匝的线圈 B，两者长度相同，B 的截面积近似等于 S。(1) 推导并计算互感 M；(2) 若 A 中电流以 30.0 A/s 增加，求 B 中的互感电动势；(3) 已知 A 的自感 L_A = 5.03×10⁻⁴ H，B 的自感 L_B = 1.26×10⁻⁴ H，求耦合系数 k。","answer":"(1) M = 2.51×10⁻⁴ H；(2) 7.54×10⁻³ V；(3) k = 1.00","explain":"A 中电流 I₁ 产生 B₁ = μ₀n₁I₁，穿过 B 每一匝的磁通 Φ₂₁ = B₁S = μ₀n₁I₁S。B 的磁链为 N₂Φ₂₁，故 M = N₂Φ₂₁/I₁ = μ₀n₁N₂S = 4π×10⁻⁷×2000×500×2.00×10⁻⁴ = 2.51×10⁻⁴ H。ε₂ = M dI₁/dt = 2.51×10⁻⁴×30.0 = 7.54×10⁻³ V。k = M/√(L_A L_B) = 2.51×10⁻⁴/√(5.03×10⁻⁴×1.26×10⁻⁴) = 2.51×10⁻⁴/2.52×10⁻⁴ = 1.00，说明无漏磁。易错点：漏掉 N₂ 会得到 5.03×10⁻⁷ H；把 n₁ 当成总匝数会差 l 倍。"},{"id":"c14q044","type":"calc","difficulty":4,"tags":["RL 充电","时间常数","能量守恒"],"stem":"电动势 ε = 18.0 V 的电源、R = 3.00 Ω 的电阻与 L = 1.20 H 的理想电感串联，t = 0 时接通。(1) 求 i(t) 和时间常数 τ；(2) 求电流达到 5.00 A 所需时间；(3) 求此时电感中的磁场能和电源已提供的总能量。","answer":"(1) i = 6.00(1 − e^(−t/0.400)) A，τ = 0.400 s；(2) 0.717 s；(3) 15.0 J，41.4 J","explain":"稳态电流 I∞ = ε/R = 6.00 A，τ = L/R = 1.20/3.00 = 0.400 s，i = 6.00(1 − e^(−t/0.400))。\n5.00 = 6.00(1 − e^(−t/τ))，e^(−t/τ) = 1/6，t = 0.400ln6 = 0.717 s。\nW_L = ½LI² = ½×1.20×5.00² = 15.0 J。\n电源总功 W = ε∫i dt = εI∞[t − τ(1 − e^(−t/τ))] = 18.0×6.00×(0.717 − 0.400×5/6) = 41.4 J。\n易错点：41.4 J 中只有 15.0 J 储存在磁场中，其余 26.4 J 为焦耳热。"},{"id":"c14q045","type":"calc","difficulty":5,"tags":["RL 放电","续流回路","能量分配"],"stem":"自感 L = 2.00 H、电阻 R_L = 5.00 Ω 的线圈接在 ε = 20.0 V 的电源上达到稳态。t = 0 时断开电源，同时接入 R = 15.0 Ω 的续流电阻，使线圈与两电阻形成闭合回路。(1) 求断开前的稳态电流和断开后的 i(t)；(2) 求电流降到 0.400 A 所需时间；(3) 求续流电阻上产生的总热量。","answer":"(1) I₀ = 4.00 A，i = 4.00e^(−10.0t) A；(2) 0.230 s；(3) 12.0 J","explain":"稳态电流 I₀ = ε/R_L = 20.0/5.00 = 4.00 A。\n断开后总电阻 R_total = 5.00 + 15.0 = 20.0 Ω，τ = L/R_total = 2.00/20.0 = 0.100 s，i = 4.00e^(−10.0t)。\n0.400 = 4.00e^
