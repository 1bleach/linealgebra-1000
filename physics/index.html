(−t/0.100)，t = 0.100ln10 = 0.230 s。\n总磁场能 W = ½LI₀² = 16.0 J，按电阻比例分配，续流电阻占 15/20，Q = 12.0 J。\n易错点：只把 L 与 15 Ω 组合会得到 τ = 0.133 s；续流电阻热量不是全部 16.0 J（线圈自身电阻也发热）。"},{"id":"c14q046","type":"calc","difficulty":4,"tags":["RC 暂态","时间常数","与 RL 比较"],"stem":"电动势 ε = 12.0 V 的电源、R = 2.00 kΩ 的电阻与 C = 5.00 μF 的电容串联，t = 0 时接通。(1) 求 τ、q(t) 和 i(t)；(2) 求 t = τ 时电容器的电荷量、电流和电场能；(3) 若用自感 L 与同一电阻串联使时间常数相同，求 L，并比较此时 RL 电路的稳态电流与 RC 电路的初始电流。","answer":"(1) τ = 10.0 ms，q = 60.0(1 − e^(−t/τ)) μC，i = 6.00e^(−t/τ) mA；(2) 37.9 μC，2.21 mA，1.44×10⁻⁴ J；(3) L = 20.0 H，两者均为 6.00 mA","explain":"τ = RC = 2.00×10³×5.00×10⁻⁶ = 10.0 ms；q∞ = Cε = 60.0 μC，i₀ = ε/R = 6.00 mA。\nq(t) = 60.0(1 − e^(−t/τ)) μC，i(t) = 6.00e^(−t/τ) mA。\nt = τ 时 q = 60.0(1 − e⁻¹) = 37.9 μC，i = 6.00e⁻¹ = 2.21 mA，u_C = q/C = 7.58 V，W = ½Cu_C² = 1.44×10⁻⁴ J。\nRL 的 τ = L/R，令 L/R = RC 得 L = R²C = (2.00×10³)²×5.00×10⁻⁶ = 20.0 H；RL 稳态电流 ε/R = 6.00 mA，恰等于 RC 的初始电流。\n易错点：L = RC = 10.0 H 漏掉一个 R；t = τ 时 q 不是 60.0 μC（那要 t → ∞）。"},{"id":"c14q047","type":"calc","difficulty":5,"tags":["RL 暂态","磁场能","电源做功","能量分配"],"stem":"自感 L = 0.500 H、电阻 R = 2.00 Ω 的线圈接在 ε = 10.0 V 的电源上，t = 0 时接通。(1) 求稳态电流和稳态时线圈中的磁场能；(2) 求电流达到稳态值一半时，电源已提供的能量、磁场能和焦耳热；(3) 说明从 0 到稳态的过程中，电源除焦耳热外额外做的功是多少。","answer":"(1) 5.00 A，6.25 J；(2) 2.41 J，1.56 J，0.851 J；(3) 6.25 J","explain":"I∞ = ε/R = 5.00 A，W_L = ½LI∞² = ½×0.500×25.0 = 6.25 J，τ = L/R = 0.250 s。\n电流为 I∞/2 时 e^(−x) = ½，x = ln2；Q = ∫i dt = I∞τ[x − (1 − e^(−x))] = 5.00×0.250×0.1931 = 0.241 C。\n电源做功 W = εQ = 10.0×0.241 = 2.41 J；W_L = ½L(2.50)² = 1.56 J；焦耳热 = 2.41 − 1.56 = 0.85 J。\n全过程电源额外做功（总功减去焦耳热）等于最终磁场能 6.25 J，即 ∫εi dt − ∫i²R dt = ½LI∞²。\n易错点：把电源总功全当成磁场能；认为电流一半时磁场能也一半（实际是 1/4）。"},{"id":"c14q048","type":"calc","difficulty":5,"tags":["电子感应加速器","同步条件","感生电场","能量增益"],"stem":"电子感应加速器的轨道半径 R = 0.100 m，轨道面积内平均磁感应强度在 1.00 ms 内由 0 均匀增至 4.00×10⁻³ T，轨道处的磁场满足同步条件。取 e = 1.60×10⁻¹⁹ C，m = 9.11×10⁻³¹ kg。(1) 推导同步条件；(2) 求轨道处感生电场大小；(3) 求电子每圈获得的动能；(4) 求 1.00 ms 内电子绕行的圈数（按非相对论估算）。","answer":"(1) B_R = ½B̄；(2) 0.200 V/m；(3) 2.01×10⁻²⁰ J；(4) 约 2.79×10⁴ 圈","explain":"由 2πRE = πR²dB̄/dt 得 E = (R/2)dB̄/dt；电子动量 p = eB_RR，dp/dt = eE，比较得 dB_R/dt = ½dB̄/dt，即 B_R = ½B̄。\ndB̄/dt = 4.00×10⁻³/1.00×10⁻³ = 4.00 T/s，E = 0.100×4.00/2 = 0.200 V/m。\n每圈动能增量 ΔK = eE·2πR = 1.60×10⁻¹⁹×0.200×0.628 = 2.01×10⁻²⁰ J。\n最终 B_R = 2.00×10⁻³ T，p = eB_RR = 3.20×10⁻²³ kg·m/s，K = p²/(2m) = 5.62×10⁻¹⁶ J，圈数 N = K/ΔK ≈ 2.79×10⁴。\n易错点：用 B_R = B̄ 会使最终动量加倍、圈数变 4 倍；每圈能量用 πR² 而不是 2πR 会少乘 R。"},{"id":"c14q049","type":"calc","difficulty":5,"tags":["导轨电容器","安培力","匀加速运动","能量比"],"stem":"水平光滑导轨间距 L = 0.500 m，处于竖直向下的均匀磁场 B = 0.400 T 中，金属杆质量 m = 0.200 kg、电阻不计，导轨左端接电容 C = 2.00×10⁻³ F。t = 0 起用水平恒力 F = 0.500 N 向右拉杆。(1) 证明杆做匀加速运动并求加速度；(2) 求 v(t)；(3) 求电容储能与杆动能之比。","answer":"(1) a = F/(m + B²L²C) = 2.50 m/s²；(2) v = 2.50t m/s；(3) B²L²C/m = 4.00×10⁻⁴","explain":"杆速 v 时 ε = BLv，电容电压 U = ε，q = CBLv，电流 i = dq/dt = CBLa。\n安培力 F_A = BiL = B²L²Ca，方向与 F 相反；由牛顿第二定律 F − B²L²Ca = ma。\n故 a = F/(m + B²L²C)，与 v 无关，杆做匀加速运动；B²L²C = 0.400²×0.500²×2.00×10⁻³ = 8.00×10⁻⁵ kg，a = 0.500/0.20008 = 2.50 m/s²。\nv = at = 2.50t m/s；W_C = ½C(BLv)²，W_K = ½mv²，比值 = B²L²C/m = 4.00×10⁻⁴。\n易错点：认为安培力随 v 增大而增大、加速度会减小——电容电路中电流由加速度决定，不由速度决定。"},{"id":"c14q050","type":"calc","difficulty":4,"tags":["顺串反串","互感","时间常数"],"stem":"两线圈的自感分别为 L₁ = 0.400 H、L₂ = 0.100 H，耦合系数 k = 0.500，电阻均可忽略。(1) 求互感 M；(2) 求顺串和反串时的等效电感；(3) 把它们分别与同一电阻 R 串联接同一电源，哪种接法电流增长更快？求两种接法时间常数之比。","answer":"(1) M = 0.100 H；(2) L_顺 = 0.700 H，L_反 = 0.300 H；(3) 反串更快，τ_顺/τ_反 = 7/3 ≈ 2.33","explain":"M = k√(L₁L₂) = 0.500×√(0.400×0.100) = 0.500×0.200 = 0.100 H。\n顺串磁通互相加强：L_顺 = L₁ + L₂ + 2M = 0.400 + 0.100 + 0.200 = 0.700 H。\n反串磁通互相削弱：L_反 = L₁ + L₂ − 2M = 0.400 + 0.100 − 0.200 = 0.300 H。\n时间常数 τ = L/R，反串 L 小、τ 小，电流增长更快；τ_顺/τ_反 = 0.700/0.300 = 2.33。\n易错点：反串时若仍用 +2M 会得到 0.700 H；互感 M 不能超过 √(L₁L₂)，本题 k = 0.5 满足。"}]},{"chapter":15,"chapterName":"麦克斯韦方程与电磁波","questions":[{"id":"c15q001","type":"choice","difficulty":3,"tags":["位移电流","电容器充电","电场变化率"],"stem":"圆形平行板电容器极板半径 R = 5.00 cm，以恒定电流 I = 2.40 A 充电，忽略边缘效应。极板间电场均匀，则板间电场的变化率 dE/dt 为","options":["1.38×10¹⁴ V/(m·s)","1.72×10¹³ V/(m·s)","3.45×10¹³ V/(m·s)","8.63×10¹² V/(m·s)"],"answer":"C","explain":"位移电流等于传导电流 I_d = I = 2.40 A；位移电流密度 j_d = I/(πR²) = 2.40/(π×0.0500²) = 306 A/m²；由 j_d = ε₀dE/dt 得 dE/dt = 306/8.85×10⁻¹² = 3.45×10¹³ V/(m·s)。易错点：把直径 2R 当半径代入面积（结果偏小 4 倍），或漏掉 j_d 与 ε₀ 的关系。"},{"id":"c15q002","type":"choice","difficulty":3,"tags":["安培-麦克斯韦定律","位移电流","分段磁场"],"stem":"圆形平行板电容器极板半径 R = 6.00 cm，以恒定电流 I = 3.00 A 充电，忽略边缘效应。距轴线 r = 3.00 cm 处的磁感应强度大小为","options":["2.50×10⁻⁶ T","5.00×10⁻⁶ T","1.00×10⁻⁵ T","2.00×10⁻⁵ T"],"answer":"B","explain":"因 r \u003c R，取半径 r 的圆为回路，穿过它的位移电流为 I_d(r) = I r²/R²；由 ∮B·dl = μ₀I_d 得 B·2πr = μ₀I r²/R²，故 B = μ₀Ir/(2πR²) = (4π×10⁻⁷×3.00×0.0300)/(2π×0.0600²) = 5.00×10⁻⁶ T。易错点：直接用 r > R 的公式 μ₀I/(2πr) 得 2.00×10⁻⁵ T，或把 r 与 R 代反。"},{"id":"c15q003","type":"choice","difficulty":3,"tags":["平均能流密度","电场振幅","坡印廷矢量"],"stem":"真空中一平面电磁波的平均能流密度为 2.00×10³ W/m²，其电场振幅 E₀ 为","options":["8.68×10² V/m","2.45×10³ V/m","1.23×10² V/m","1.23×10³ V/m"],"answer":"D","explain":"平均能流密度 ⟨S⟩ = ½ε₀cE₀²，故 E₀ = √(2⟨S⟩/(ε₀c)) = √(2×2.00×10³/(8.85×10⁻¹²×3.00×10⁸)) = √(1.51×10⁶) = 1.23×10³ V/m。易错点：漏掉时间平均因子 ½（得 8.68×10²），或把 ½ 重复取两次（得 2.45×10³）。"},{"id":"c15q004","type":"choice","difficulty":3,"tags":["电磁波谱","波长排序","数量级"],"stem":"下列电磁波按波长由长到短排列，顺序正确的是：① 频率 1.00×10¹⁸ Hz 的 X 射线；② 波长 500 nm 的可见光；③ 频率 1.00×10⁹ Hz 的微波；④ 波长 300 m 的无线电波","options":["④③②①","④③①②","③④②①","①②③④"],"answer":"A","explain":"由 λ = c/f 得 ① λ = 0.300 nm，③ λ = 0.300 m，④ λ = 300 m，② 为 500 nm；故由长到短为 ④③②①。易错点：频率越高波长越短，把 ① 排在最前；把 nm 与 m 混用（② 与 ③ 颠倒）。"},{"id":"c15q005","type":"choice","difficulty":3,"tags":["辐射压","太阳常数","光压力"],"stem":"太阳光垂直照射到完全吸收的黑体表面，太阳常数为 1.38×10³ W/m²。该表面受到的辐射压及 2.00 m² 面积上受到的光压力分别为","options":["4.60×10⁻⁶ Pa，4.60×10⁻⁶ N","1.53×10⁻¹⁴ Pa，3.07×10⁻¹⁴ N","4.60×10⁻⁶ Pa，9.20×10⁻⁶ N","9.20×10⁻⁶ Pa，1.84×10⁻⁵ N"],"answer":"C","explain":"完全吸收时 p = S/c = 1.38×10³/(3.00×10⁸) = 4.60×10⁻⁶ Pa；光压力 F = pA = 4.60×10⁻⁶×2.00 = 9.20×10⁻⁶ N。易错点：按全反射算成 2S/c（压力翻倍），或把 S/c² 当成压强（量级差 10⁸ 倍）。"},{"id":"c15q006","type":"choice","difficulty":3,"tags":["偶极辐射","辐射功率","频率依赖"],"stem":"两个电偶极子：甲的电偶极矩振幅为 p₀、振动频率为 2ν；乙的为 2p₀、频率为 ν。它们辐射的电磁波总功率之比 P甲/P乙 为","options":["2","4","16","8"],"answer":"B","explain":"偶极辐射功率 P ∝ p₀²ω⁴。甲：P甲 ∝ p₀²(2ω)⁴ = 16p₀²ω⁴；乙：P乙 ∝ (2p₀)²ω⁴ = 4p₀²ω⁴；故比值为 4。易错点：只比较频率得 16；误用 P ∝ p₀ω⁴ 得 8；误以为 P ∝ ω² 得 2。"},{"id":"c15q007","type":"choice","difficulty":4,"tags":["平面电磁波","E与B关系","传播方向"],"stem":"真空中一平面电磁波沿 x 轴负方向传播，电场沿 y 轴，E = 150 sin(kx + ωt) V/m。其磁感应强度的表达式为","options":["沿 +z 方向，B = 5.00×10⁻⁷ sin(kx + ωt) T","沿 −y 方向，B = 5.00×10⁻⁷ sin(kx + ωt) T","沿 +z 方向，B = 5.00×10⁻⁷ cos(kx + ωt) T","沿 −z 方向，B = 5.00×10⁻⁷ sin(kx + ωt) T"],"answer":"D","explain":"振幅 B₀ = E₀/c = 150/(3.00×10⁸) = 5.00×10⁻⁷ T。传播方向为 E×B：E 沿 +y，要求 E×B 沿 −x，故 B 沿 −z（y×(−z) = −x）。E 与 B 同相，相位仍为 kx + ωt，所以 B 沿 −z、大小 5.00×10⁻⁷ sin(kx + ωt) T。易错点：只换大小不判方向（取 +z），或把 B 画成与 E 平行。"},{"id":"c15q008","type":"choice","difficulty":4,"tags":["麦克斯韦方程组","真空波速","ω=ck"],"stem":"下列沿 x 轴传播的电场表达式（E₀ 为常量，x 以 m、t 以 s 计）中，能在真空中作为电磁波存在的是","options":["E = E₀ cos(4.00x − 1.20×10⁹t)，沿 y 轴","E = E₀ cos(4.00x − 3.00×10⁸t)，沿 y 轴","E = E₀ cos(4.00x − 4.80×10⁹t)，沿 y 轴","E = E₀ cos(1.20×10⁹x − 4.00t)，沿 y 轴"],"answer":"A","explain":"真空电磁波要求 ω/k = c = 3.00×10⁸ m/s。逐项求 ω/k：A 为 1.20×10⁹/4.00 = 3.00×10⁸，满足；B 为 7.50×10⁷；C 为 1.20×10⁹；D 为 3.33×10⁻⁹。只有 A 满足。易错点：把 c 当成 ω 直接比对（选 B），或把 k 与 ω 的位置写反（选 D）。"},{"id":"c15q009","type":"choice","difficulty":4,"tags":["位移电流密度","时变电场"],"stem":"真空中某区域电场方向不变、大小按 E = 50.0 sin(1.00×10⁷t) V/m 变化。该区域位移电流密度的最大值为","options":["5.65×10¹⁹ A/m²","8.85×10⁻³ A/m²","4.43×10⁻³ A/m²","4.43×10⁻¹⁰ A/m²"],"answer":"C","explain":"位移电流密度 j_d = ε₀∂E/∂t = ε₀×50.0×1.00×10⁷cos(1.00×10⁷t)，最大值 j_d,max = 8.85×10⁻¹²×5.00×10⁸ = 4.43×10⁻³ A/m²。易错点：漏掉对 t 求导（只算 ε₀E₀ = 4.43×10⁻¹⁰），或把 ε₀ 放到分母（得 5.65×10¹⁹）。"},{"id":"c15q010","type":"choice","difficulty":4,"tags":["位移电流","交流电路","电容器"],"stem":"平行板电容器电容 C = 80.0 pF，接在电压 u = 50.0 sin(2π×1.00×10⁶t) V 的交流电源上。极板间位移电流的最大值为","options":["4.00×10⁻³ A","2.51×10⁻² A","1.78×10⁻² A","2.51×10⁻⁵ A"],"answer":"B","explain":"位移电流 I_d = CdU/dt，最大值 I_d,max = CωU₀ = 80.0×10⁻¹²×2π×1.00×10⁶×50.0 = 2.51×10⁻² A。易错点：用有效值 50.0/√2 得 1.78×10⁻² A；把 pF 当 nF 得 2.51×10⁻⁵ A；漏掉 2π 得 4.00×10⁻³ A。"},{"id":"c15q011","type":"choice","difficulty":4,"tags":["能量密度","平均能流密度","坡印廷矢量"],"stem":"真空中一平面电磁波的电场振幅为 600 V/m。其平均能量密度和平均能流密度分别为","options":["3.19×10⁻⁶ J/m³，957 W/m²","7.96×10⁻⁷ J/m³，239 W/m²","1.59×10⁻⁶ J/m³，1.59×10⁻⁶ W/m²","1.59×10⁻⁶ J/m³，478 W/m²"],"answer":"D","explain":"电场与磁场平均能量密度相等，⟨u⟩ = ½ε₀E₀² = 0.5×8.85×10⁻¹²×600² = 1.59×10⁻⁶ J/m³；⟨S⟩ = c⟨u⟩ = 3.00×10⁸×1.59×10⁻⁶ = 478 W/m²。易错点：用峰值 u = ε₀E₀²（得 3.19×10⁻⁶、957），或只算电场一半（得 7.96×10⁻⁷、239）。"},{"id":"c15q012","type":"choice","difficulty":4,"tags":["电磁驻波","波节波腹","法拉第定律"],"stem":"两块平行理想导体板之间形成电磁驻波，电场 E = 2E₀ sin(kx)cos(ωt)，波长 4.00 m。相邻电场波节的间距、以及磁场波腹与电场波节的位置关系为","options":["2.00 m，重合","4.00 m，重合","2.00 m，与电场波腹重合","1.00 m，重合"],"answer":"A","explain":"电场波节满足 kx = nπ，即 x = nλ/2，相邻间距 λ/2 = 2.00 m。由法拉第定律，B ∝ ∂E/∂x ∝ cos(kx)，在电场波节（sin(kx) = 0、cos(kx) = ±1）处磁场取最大值，故磁场波腹与电场波节重合。易错点：把波节间距当成 λ（4.00 m），或误以为 E、B 的波腹重合。"},{"id":"c15q013","type":"choice","difficulty":4,"tags":["辐射压","全反射","激光"],"stem":"功率 2.00 W 的激光束垂直照射到全反射镜上，光斑半径为 0.500 mm。镜面受到的光压力大小为","options":["2.67×10⁻⁸ N","1.70×10⁻² N","1.33×10⁻⁸ N","6.67×10⁻⁹ N"],"answer":"C","explain":"全反射时动量改变为 2p，光压力 F = 2P/c = 2×2.00/(3.00×10⁸) = 1.33×10⁻⁸ N，与光斑面积无关。易错点：按完全吸收算（6.67×10⁻⁹ N）；多乘因子 2（2.67×10⁻⁸ N）；把光压 S/c 当成力（1.70×10⁻² N）。"},{"id":"c15q014","type":"choice","difficulty":4,"tags":["介质中光速","折射率","波长"],"stem":"某非磁性介质 ε_r = 4.00、μ_r = 1.00。频率 5.00×10¹⁴ Hz 的光在其中传播，其速度和波长分别为","options":["7.50×10⁷ m/s，150 nm","1.50×10⁸ m/s，300 nm","1.50×10⁸ m/s，600 nm","2.00×10⁸ m/s，400 nm"],"answer":"B","explain":"n = √(ε_rμ_r) = 2.00，v = c/n = 1.50×10⁸ m/s；频率不变，λ = v/f = 1.50×10⁸/(5.00×10¹⁴) = 3.00×10⁻⁷ m = 300 nm。易错点：把真空波长 600 nm 直接搬来；误用 n = ε_r = 4（得 7.50×10⁷ m/s、150 nm）；把 n 取成 1.5（得 2.00×10⁸ m/s、400 nm）。"},{"id":"c15q015","type":"choice","difficulty":4,"tags":["辐射压","太阳帆","光压力"],"stem":"航天器质量 1.00×10³ kg，装有面积 1.00×10⁴ m² 的全反射太阳帆，正对太阳，太阳常数 1.38×10³ W/m²。帆受到的推力和航天器获得的加速度分别为","options":["4.60×10⁻² N，4.60×10⁻⁵ m/s²","9.20×10⁻² N，9.20×10⁻² m/s²","9.20×10⁻² N，4.60×10⁻⁵ m/s²","9.20×10⁻² N，9.20×10⁻⁵ m/s²"],"answer":"D","explain":"全反射光帆 F = 2SA/c = 2×1.38×10³×1.00×10⁴/(3.00×10⁸) = 9.20×10⁻² N；a = F/m = 9.20×10⁻²/(1.00×10³) = 9.20×10⁻⁵ m/s²。易错点：按吸收算得一半推力；忘记除以质量；把加速度再除以 2（最后一项）。"},{"id":"c15q016","type":"choice","difficulty":4,"tags":["光子能量","电磁波谱","X射线"],"stem":"X 射线的波长为 0.100 nm，可见光的波长为 500 nm。两者单个光子的能量之比、以及 X 射线光子的能量（以 eV 计）分别为","options":["5.00×10³，1.24×10⁴ eV","5.00×10³，12.4 eV","50.0，1.24×10⁴ eV","5.00×10³，1.24×10³ eV"],"answer":"A","explain":"光子能量 E = hc/λ，hc = 1.24×10³ eV·nm。E_X = 1.24×10³/0.100 = 1.24×10⁴ eV；E_vis = 1.24×10³/500 = 2.48 eV；比值 = 500/0.100 = 5.00×10³。易错点：把 nm 当 m 得 12.4 eV；比值忘乘 10 得 50；把 keV 与 eV 混用得 1.24×10³ eV。"},{"id":"c15q017","type":"choice","difficulty":4,"tags":["光子能量","电磁波谱","波段判断"],"stem":"频率为 1.00×10¹⁸ Hz 的电磁波，其光子能量（以 keV 计）和所属波段为","options":["6.63 keV，X 射线","0.414 keV，紫外线","4.14 keV，X 射线","4.14 keV，γ 射线"],"answer":"C","explain":"E = hν = 6.63×10⁻³⁴×1.00×10¹⁸ = 6.63×10⁻¹⁶ J = 4.14×10³ eV = 4.14 keV。该能量对应波长 λ = c/ν = 0.300 nm，属 X 射线波段；γ 射线通常指核跃迁产生、能量在 100 keV 以上。易错点：用 h 而不除以 e 得 6.63 keV；把 10³ 漏掉得 0.414 keV。"},{"id":"c15q018","type":"choice","difficulty":4,"tags":["坡印廷矢量","能流密度","方向判断"],"stem":"真空中某时刻电场 E = 200 V/m、沿 y 轴，磁感应强度 B = 6.67×10⁻⁷ T、沿 z 轴。该时刻能流密度的大小和方向为","options":["8.45×10¹⁰ W/m²，沿 +x 轴","106 W/m²，沿 +x 轴","106 W/m²，沿 −x 轴","1.33×10⁻⁴ W/m²，沿 +x 轴"],"answer":"B","explain":"S = (1/μ₀)E×B，大小 S = EB/μ₀ = 200×6.67×10⁻⁷/(4π×10⁻⁷) = 106 W/m²；方向由 E×B 决定，y×z = x，故沿 +x 轴。易错点：漏除 μ₀（得 1.33×10⁻⁴）；把 μ₀ 除两次（得 8.45×10¹⁰）；方向取反。"},{"id":"c15q019","type":"choice","difficulty":4,"tags":["磁感应强度振幅","平均能流密度","能量密度"],"stem":"真空中一平面电磁波的磁感应强度振幅为 2.00×10⁻⁶ T，其平均能流密度和电场振幅分别为","options":["954 W/m²，600 V/m","477 W/m²，300 V/m","239 W/m²，600 V/m","477 W/m²，600 V/m"],"answer":"D","explain":"E₀ = cB₀ = 3.00×10⁸×2.00×10⁻⁶ = 600 V/m；⟨S⟩ = cB₀²/(2μ₀) = 3.00×10⁸×4.00×10⁻¹²/(2×4π×10⁻⁷) = 477 W/m²。易错点：漏掉时间平均的 ½（得 954）；把振幅当平均值、取 E₀ = cB₀/2（得 300）；多除一个 2（得 239）。"},{"id":"c15q020","type":"choice","difficulty":5,"tags":["位移电流","分段磁场","安培-麦克斯韦定律"],"stem":"圆形平行板电容器半径为 R，以恒定电流 I 充电。板间同一平面上 r₁ = R/2 处与 r₂ = 2R 处的磁感应强度大小之比 B₁/B₂ 为","options":["1","2","1/2","1/4"],"answer":"A","explain":"r₁ \u003c R 用 B = μ₀Ir/(2πR²)，得 B₁ = μ₀I/(4πR)；r₂ > R 用 B = μ₀I/(2πr)，得 B₂ = μ₀I/(4πR)；故 B₁/B₂ = 1。易错点：两处都套同一个公式；认为板外磁场为零。关键是先判断 r 与 R 的大小关系再选公式，两段在 r = R 处恰好连续。"},{"id":"c15q021","type":"choice","difficulty":5,"tags":["球面波","能流密度","电场振幅"],"stem":"某电台以 50.0 kW 的功率各向同性辐射。距电台 10.0 km 处，平均能流密度和电场振幅分别为","options":["5.00×10⁻⁴ W/m²，0.173 V/m","3.98×10⁻⁵ W/m²，5.47 V/m","3.98×10⁻⁵ W/m²，0.173 V/m","3.98×10⁻⁵ W/m²，0.122 V/m"],"answer":"C","explain":"球面波 ⟨S⟩ = P/(4πr²) = 5.00×10⁴/(4π×1.00×10⁸) = 3.98×10⁻⁵ W/m²；E₀ = √(2⟨S⟩/(ε₀c)) = √(2×3.98×10⁻⁵/(8.85×10⁻¹²×3.00×10⁸)) = 0.173 V/m。易错点：漏掉 4π（得 5.00×10⁻⁴）；漏掉根号内的 2（得 0.122）；把 50.0 kW 当 50.0 MW（得 5.47）。"},{"id":"c15q022","type":"choice","difficulty":5,"tags":["辐射压","反射率","动量流"],"stem":"强度为 1.20×10³ W/m² 的平行光束垂直照射到反射率为 0.600 的表面上，其余部分被吸收。该表面受到的光压力为","options":["2.40×10⁻⁶ Pa","6.40×10⁻⁶ Pa","4.00×10⁻⁶ Pa","8.00×10⁻⁶ Pa"],"answer":"B","explain":"反射部分动量改变 2p，吸收部分改变 p，故 p_rad = (1+R)S/c = 1.60×1.20×10³/(3.00×10⁸) = 6.40×10⁻⁶ Pa。易错点：只算吸收（4.00×10⁻⁶）；按全反射算（8.00×10⁻⁶）；只算反射贡献 R S/c（2.40×10⁻⁶）。"},{"id":"c15q023","type":"choice","difficulty":5,"tags":["光动量","冲量","激光脉冲"],"stem":"一束能量为 1.50 kJ 的激光脉冲在真空中传播。该脉冲的动量、以及它被黑色吸收面完全吸收时给予该面的冲量分别为","options":["5.00×10⁻⁶ kg·m/s，1.00×10⁻⁵ N·s","4.50×10¹¹ kg·m/s，4.50×10¹¹ N·s","1.67×10⁻⁶ kg·m/s，1.67×10⁻⁶ N·s","5.00×10⁻⁶ kg·m/s，5.00×10⁻⁶ N·s"],"answer":"D","explain":"光子总动量 p = U/c = 1.50×10³/(3.00×10⁸) = 5.00×10⁻⁶ kg·m/s；完全吸收时冲量等于入射动量 5.00×10⁻⁶ N·s。易错点：按全反射算冲量（1.00×10⁻⁵）；把 U 乘 c（4.50×10¹¹）；用 U/c² 当动量（1.67×10⁻⁶）。"},{"id":"c15q024","type":"choice","difficulty":5,"tags":["平面电磁波","法拉第定律","E与B相位"],"stem":"真空中一平面电磁波沿 +z 轴传播，电场沿 +x 轴，E = E₀ cos(kz − ωt)。下列磁感应强度表达式中，同时满足法拉第定律和安培-麦克斯韦定律的是","options":["沿 +y 轴，B = (E₀/c)cos(kz − ωt)","沿 +y 轴，B = (E₀/c)sin(kz − ωt)","沿 −y 轴，B = −(E₀/c)cos(kz − ωt)","沿 +x 轴，B = (E₀/c)cos(kz − ωt)"],"answer":"A","explain":"由法拉第定律 ∂B_y/∂t = −∂E_x/∂z，积分后 B 与 E 同相且 B₀ = E₀/c；传播方向为 E×B，x×y = z，故 B 沿 +y。B 必须与 E 同相（sin 与 cos 相差 90°，不满足法拉第定律），且不能与 E 平行（横波条件）。易错点：取 −y（方向反）；改用 sin（相位错）；B 与 E 同向。"},{"id":"c15q025","type":"choice","difficulty":5,"tags":["感生电场","法拉第定律","分段判断"],"stem":"半径 R = 10.0 cm 的圆柱形区域内存在均匀磁场，方向沿轴线，大小按 B = 0.200t T 线性增大。距轴线 r = 5.00 cm 处与 r = 20.0 cm 处的感生电场大小之比及方向为","options":["2:1，均沿切向","1:4，均沿径向","1:1，均沿以轴线为圆心的圆周切向","1:2，均沿切向"],"answer":"C","explain":"取半径 r 的圆：r \u003c R 时 E·2πr = πr²dB/dt，得 E = (r/2)dB/dt = 0.0500×0.200/2 = 5.00×10⁻³ V/m；r > R 时 E·2πr = πR²dB/dt，得 E = R²/(2r)·dB/dt = 0.0100/(0.400)×0.200 = 5.00×10⁻³ V/m。两处相等，比值 1:1，方向由楞次定律为圆周切向。易错点：以为外部按 1/r 减小而选 2:1 或 1:2；把感生电场当成径向。"},{"id":"c15q026","type":"choice","difficulty":5,"tags":["光子能量","光子动量","电磁波谱"],"stem":"波长为 10.0 nm 的紫外光，其频率、单个光子能量和光子动量分别为","options":["3.00×10¹⁶ Hz，124 eV，6.63×10⁻²⁴ kg·m/s","3.00×10¹⁶ Hz，124 eV，6.63×10⁻²⁶ kg·m/s","3.00×10¹⁶ Hz，12.4 eV，6.63×10⁻²⁶ kg·m/s","3.00×10¹⁴ Hz，124 eV，6.63×10⁻²⁶ kg·m/s"],"answer":"B","explain":"f = c/λ = 3.00×10⁸/(10.0×10⁻⁹) = 3.00×10¹⁶ Hz；E = hc/λ = 1.24×10³ eV·nm/10.0 nm = 124 eV；p = h/λ = 6.63×10⁻³⁴/(10.0×10⁻⁹) = 6.63×10⁻²⁶ kg·m/s。易错点：把 nm 当 m（能量 12.4 eV）；频率少算 100 倍；动量用 E/c（得 6.63×10⁻²⁴）。"},{"id":"c15q027","type":"choice","difficulty":5,"tags":["介质中能流","折射率","能量密度"],"stem":"同一电场振幅 E₀ 的平面电磁波，分别在真空和 ε_r = 4.00、μ_r = 1.00 的介质中传播。介质中与真空中的平均能流密度之比为","options":["4.00","0.500","1.41","2.00"],"answer":"D","explain":"介质中 ⟨S⟩ = ½εvE₀²，ε = ε_rε₀、v = c/n、n = √(ε_rμ_r) = 2.00，故 ⟨S⟩_med/⟨S⟩_vac = n/μ_r = 2.00。也可直接算：εv/(ε₀c) = ε_r/n = 2.00。易错点：用 ε_r 直接当比值（4.00）；以为介质中能流更小（0.500）；把 n 当 √2（1.41）。"},{"id":"c15q028","type":"choice","difficulty":5,"tags":["介质中电磁波","折射率","能流密度"],"stem":"某介质 ε_r = 9.00、μ_r = 4.00，其中平面电磁波的电场振幅为 300 V/m。该波的磁感应强度振幅和平均能流密度分别为","options":["6.00×10⁻⁶ T，179 W/m²","1.00×10⁻⁶ T，179 W/m²","6.00×10⁻⁶ T，717 W/m²","2.40×10⁻⁵ T，179 W/m²"],"answer":"A","explain":"n = √(ε_rμ_r) = 6.00，v = c/n = 5.00×10⁷ m/s，B₀ = E₀/v = 6.00×10⁻⁶ T；⟨S⟩ = ½E₀²√(ε/μ) = ½ε₀cE₀²·n/μ_r = 0.5×8.85×10⁻¹²×3.00×10⁸×300²×1.50 = 179 W/m²。易错点：用 B₀ = E₀/c（1.00×10⁻⁶）；忽略 μ_r 得 717 W/m²；把 μ_r 也乘进 B₀ = nμ_rE₀/c（2.40×10⁻⁵ T）。"},{"id":"c15q029","type":"choice","difficulty":5,"tags":["介质中电磁波","磁感应强度","能流密度"],"stem":"折射率 n = 1.50 的非磁性介质中，平面电磁波的电场振幅为 400 V/m。其磁感应强度振幅和平均能流密度分别为","options":["2.00×10⁻⁶ T，212 W/m²","2.67×10⁻⁶ T，319 W/m²","2.00×10⁻⁶ T，319 W/m²","1.33×10⁻⁶ T，319 W/m²"],"answer":"C","explain":"非磁性介质 n = √ε_r，v = c/n = 2.00×10⁸ m/s，B₀ = E₀/v = 2.00×10⁻⁶ T；⟨S⟩ = ½ε₀cE₀²·n = 0.5×8.85×10⁻¹²×3.00×10⁸×400²×1.50 = 319 W/m²。易错点：用 B₀ = E₀/c（1.33×10⁻⁶）；漏掉 n 的增强（212）；用 B₀ = 2E₀/c（把 n 当 2，得 2.67×10⁻⁶）。"},{"id":"c15q030","type":"choice","difficulty":5,"tags":["坡印廷矢量","电阻器","能量流"],"stem":"长 10.0 cm、半径 2.00 mm 的圆柱形电阻丝通有 2.00 A 电流，两端电压为 3.00 V。电阻丝侧面上的能流密度大小及能流方向为","options":["9.55×10³ W/m²，由侧面流入","4.77×10³ W/m²，由侧面流入导线内部","4.77×10³ W/m²，由导线内部流向侧面","2.39×10³ W/m²，由侧面流入"],"answer":"B","explain":"导线表面电场 E = U/L = 30.0 V/m，表面磁场 B = μ₀I/(2πa) = 2.00×10⁻⁴ T；S = EB/μ₀ = 4.77×10³ W/m²。E 沿电流方向、B 沿圆周切向，E×B 指向轴线，能量从侧面流入导线，总功率 S·2πaL = 4.77×10³×1.26×10⁻³ = 6.00 W = UI。易错点：方向由 E×B 判反；忘记 2πa 中的 2；用直径代替半径。"},{"id":"c15q031","type":"choice","difficulty":5,"tags":["偶极辐射","天线","方向性"],"stem":"长 1.50 m 的半波振子天线，其谐振频率、以及垂直于天线方向与偏离天线轴线 30° 方向的辐射强度之比分别为","options":["2.00×10⁸ Hz，4","1.00×10⁸ Hz，2","5.00×10⁷ Hz，4","1.00×10⁸ Hz，4"],"answer":"D","explain":"半波振子长度 L = λ/2，故 λ = 2L = 3.00 m，f = c/λ = 1.00×10⁸ Hz；偶极辐射强度 I(θ) ∝ sin²θ（θ 为与天线轴线的夹角），θ = 90° 时 sin²θ = 1，θ = 30° 时 sin²θ = 0.250，比值 4。易错点：把 L 当整波长（2.00×10⁸ Hz）；用 sinθ 而不是 sin²θ（比值 2）；把 L 当 λ/4（5.00×10⁷ Hz）。"},{"id":"c15q032","type":"choice","difficulty":5,"tags":["光子数","辐射压","激光"],"stem":"功率 1.00 mW、波长 650 nm 的激光束垂直照射到完全吸收面上，光斑面积为 3.00 mm²。每秒到达的光子数及光压分别为","options":["3.27×10¹⁵ s⁻¹，1.11×10⁻⁶ Pa","3.27×10¹⁵ s⁻¹，2.22×10⁻⁶ Pa","1.53×10¹⁵ s⁻¹，1.11×10⁻⁶ Pa","3.27×10¹⁸ s⁻¹，1.11×10⁻³ Pa"],"answer":"A","explain":"单光子能量 E = hc/λ = 1.24×10³ eV·nm/650 nm = 1.91 eV = 3.05×10⁻¹⁹ J，光子数率 N = P/E = 3.27×10¹⁵ s⁻¹；光强 S = P/A = 1.00×10⁻³/(3.00×10⁻⁶) = 333 W/m²，光压 p = S/c = 1.11×10⁻⁶ Pa。易错点：按全反射算压力（2.22×10⁻⁶）；光子能量多算一倍（1.53×10¹⁵）；面积用 mm² 当 m²（3.27×10¹⁸、1.11×10⁻³）。"},{"id":"c15q033","type":"choice","difficulty":5,"tags":["LC振荡","位移电流","频率"],"stem":"LC 振荡电路中 L = 2.00 mH、C = 50.0 pF，电容器的最大电压为 100 V。电容器中位移电流的最大值及振荡频率分别为","options":["3.16×10⁻² A，5.03×10⁵ Hz","1.58×10⁻² A，3.16×10⁶ Hz","1.58×10⁻² A，5.03×10⁵ Hz","1.58×10⁻² A，1.01×10⁶ Hz"],"answer":"C","explain":"ω = 1/√(LC) = 1/√(2.00×10⁻³×50.0×10⁻¹²) = 3.16×10⁶ rad/s，f = ω/(2π) = 5.03×10⁵ Hz；Q_max = CU_max = 5.00×10⁻⁹ C，I_max = ωQ_max = 1.58×10⁻² A。电容器中位移电流等于回路传导电流，故最大值也是 1.58×10⁻² A。易错点：把 ω 当频率（3.16×10⁶ Hz）；用 ω/π 得 1.01×10⁶ Hz；把 L、C 代反得 3.16×10⁻² A。"},{"id":"c15q034","type":"choice","difficulty":5,"tags":["电磁驻波","法拉第定律","相位关系"],"stem":"真空中电磁驻波的电场为 E = E₀ sin(kx)cos(ωt)，沿 y 轴方向。由法拉第定律求得的磁感应强度为","options":["沿 z 轴，B_z = −(E₀/c)cos(kx)cos(ωt)","沿 z 轴，B_z = −(E₀/c)cos(kx)sin(ωt)","沿 z 轴，B_z = (E₀/c)cos(kx)sin(ωt)","沿 z 轴，B_z = −(E₀/c)sin(kx)cos(ωt)"],"answer":"B","explain":"∂B_z/∂t = −∂E_y/∂x = −kE₀cos(kx)cos(ωt)，对 t 积分得 B_z = −(kE₀/ω)cos(kx)sin(ωt) = −(E₀/c)cos(kx)sin(ωt)。E 沿 y、B 沿 z，E×B 沿 x，符合驻波中两场相位差 90° 的特征。易错点：符号取反；把 cos(kx) 写成 sin(kx)（B 的波腹应在 E 的波节处）；漏掉对 t 的积分而保留 cos(ωt)。"},{"id":"c15q035","type":"choice","difficulty":5,"tags":["辐射压","引力平衡","临界半径"],"stem":"真空中太阳光强度为 1.38×10³ W/m²，照射到密度 3.00×10³ kg/m³、半径 0.200 μm 的完全吸收球形尘埃颗粒上。太阳在 1 AU 处的引力加速度取 5.93×10⁻³ m/s²，颗粒所受辐射压力与太阳引力之比为","options":["0.485","1.94","2.91×10⁸","0.970"],"answer":"D","explain":"F_rad = Sπa²/c，F_grav = (4/3)πa³ρg，比值 = 3S/(4aρgc) = 3×1.38×10³/(4×2.00×10⁻⁷×3.00×10³×5.93×10⁻³×3.00×10⁸) = 0.970。易错点：用直径 2a 代替 a（0.485）；把 a 取成 0.100 μm（1.94）；漏掉 c（2.91×10⁸）。"},{"id":"c15q036","type":"calc","difficulty":4,"tags":["位移电流","交流电容器","安培-麦克斯韦定律"],"stem":"平行板电容器电容 C = 120 pF，极板半径 R = 4.00 cm，接在 u = 60.0 sin(2π×5.00×10⁵t) V 的交流电源上（t 以 s 计）。求：(1) 极板间位移电流的最大值和有效值；(2) 极板边缘 r = R 处磁感应强度的最大值。","answer":"(1) 2.26×10⁻² A，1.60×10⁻² A；(2) 1.13×10⁻⁷ T","explain":"I_d = CdU/dt，最大值 I_max = CωU₀ = 120×10⁻¹²×2π×5.00×10⁵×60.0 = 2.26×10⁻² A；有效值 I_rms = I_max/√2 = 1.60×10⁻² A。板间 B 由安培-麦克斯韦定律：B·2πR = μ₀I_d，故 B_max = μ₀I_max/(2πR) = (4π×10⁻⁷×2.26×10⁻²)/(2π×0.0400) = 1.13×10⁻⁷ T。易错点：用电压有效值算电流；把 R 当直径代入 2πR。"},{"id":"c15q037","type":"calc","difficulty":4,"tags":["平面电磁波","坡印廷矢量","辐射压"],"stem":"真空中一平面电磁波的电场为 E = 400 cos(2.09x − 6.28×10⁸t) V/m，方向沿 y 轴（x 以 m、t 以 s 计）。求：(1) 波长、频率和传播方向；(2) 磁感应强度的振幅和方向；(3) 平均能流密度；(4) 垂直照射到完全吸收面时的光压。","answer":"(1) λ = 3.00 m，f = 1.00×10⁸ Hz，沿 +x 轴；(2) B₀ = 1.33×10⁻⁶ T，沿 +z 轴；(3) 212 W/m²；(4) 7.08×10⁻⁷ Pa","explain":"由相位 kx − ωt 知波沿 +x 传播；k = 2.09 rad/m 得 λ = 2π/k = 3.00 m，ω = 6.28×10⁸ rad/s 得 f = ω/(2π) = 1.00×10⁸ Hz。B₀ = E₀/c = 400/(3.00×10⁸) = 1.33×10⁻⁶ T，方向由 E×B 沿 +x 定为 +z。⟨S⟩ = ½ε₀cE₀² = 0.5×8.85×10⁻¹²×3.00×10⁸×400² = 212 W/m²；完全吸收时 p = ⟨S⟩/c = 7.08×10⁻⁷ Pa。易错点：用峰值 E₀B₀/μ₀ 当平均能流；B 方向判成 −z。"},{"id":"c15q038","type":"calc","difficulty":4,"tags":["太阳帆","辐射压","动量定理"],"stem":"质量 800 kg 的航天器装有面积 5.00×10³ m² 的全反射太阳帆，正对太阳，太阳常数 1.38×10³ W/m²。忽略其他作用力，求：(1) 帆受到的推力；(2) 航天器的加速度；(3) 从静止开始 10.0 天后速度的增加量。","answer":"(1) F = 2SA/c = 4.60×10⁻² N；(2) a = F/m = 5.75×10⁻⁵ m/s²；(3) Δv = at = 49.7 m/s","explain":"全反射时 F = 2SA/c = 2×1.38×10³×5.00×10³/(3.00×10⁸) = 4.60×10⁻² N；a = F/m = 4.60×10⁻²/800 = 5.75×10⁻⁵ m/s²。10.0 天 = 8.64×10⁵ s，Δv = at = 5.75×10⁻⁵×8.64×10⁵ = 49.7 m/s。易错点：按吸收算得一半推力；把 10 天换算成 8.64×10⁴ s（少一位）得 4.97 m/s。"},{"id":"c15q039","type":"calc","difficulty":4,"tags":["光子能量","光子数","辐射压"],"stem":"波长 400 nm、功率 2.00 mW 的单色平行光束垂直照射到完全吸收面上，光束截面积为 2.00 mm²。求：(1) 单个光子的能量（J 和 eV）；(2) 每秒入射的光子数；(3) 光束的光压和光压力。","answer":"(1) 4.97×10⁻¹⁹ J，3.10 eV；(2) 4.02×10¹⁵ s⁻¹；(3) 3.33×10⁻⁶ Pa，6.67×10⁻¹² N","explain":"E = hc/λ = 6.63×10⁻³⁴×3.00×10⁸/(400×10⁻⁹) = 4.97×10⁻¹⁹ J = 3.10 eV。每秒光子数 N = P/E = 2.00×10⁻³/(4.97×10⁻¹⁹) = 4.02×10¹⁵ s⁻¹。光强 S = P/A = 2.00×10⁻³/(2.00×10⁻⁶) = 1.00×10³ W/m²，光压 p = S/c = 3.33×10⁻⁶ Pa，光压力 F = pA = 3.33×10⁻⁶×2.00×10⁻⁶ = 6.67×10⁻¹² N（也可直接用 F = P/c）。易错点：面积把 mm² 当 m² 用；完全反射时冲量翻倍（此题是完全吸收，不翻倍）。"},{"id":"c15q040","type":"calc","difficulty":4,"tags":["介质中电磁波","折射率","能流密度"],"stem":"某非磁性介质 ε_r = 2.56、μ_r = 1.00，真空中波长 750 nm 的光以电场振幅 240 V/m 在其中传播。求：(1) 折射率和光速；(2) 介质中的波长和频率；(3) 磁感应强度振幅；(4) 平均能流密度。","answer":"(1) n = √(ε_rμ_r) = 1.60，v = c/n = 1.88×10⁸ m/s；(2) λ = λ₀/n = 469 nm，f = 4.00×10¹⁴ Hz；(3) B₀ = E₀/v = 1.28×10⁻⁶ T；(4) ⟨S⟩ = ½ε₀cE₀²·n = 122 W/m²","explain":"n = √(ε_rμ_r) = 1.60，v = c/n = 1.88×10⁸ m/s。频率不变：f = c/λ₀ = 3.00×10⁸/(750×10⁻⁹) = 4.00×10¹⁴ Hz；λ = λ₀/n = 469 nm。B₀ = E₀/v = 240/(1.88×10⁸) = 1.28×10⁻⁶ T。⟨S⟩ = ½ε₀cE₀²·n = 0.5×8.85×10⁻¹²×3.00×10⁸×240²×1.60 = 122 W/m²。易错点：频率随波速改变；漏掉 n 得 76.4 W/m²。"},{"id":"c15q041","type":"calc","difficulty":4,"tags":["位移电流","时变电场","安培-麦克斯韦定律"],"stem":"半径 R = 5.00 cm 的圆柱形区域内存在均匀电场，方向沿轴线，大小按 E = 80.0 sin(2π×1.00×10⁶t) V/m 变化。求：(1) 位移电流密度的最大值；(2) 区域边缘 r = R 处磁感应强度的最大值；(3) r = 8.00 cm 处磁感应强度的最大值。","answer":"(1) 4.45×10⁻³ A/m²；(2) 1.40×10⁻¹⁰ T；(3) 8.72×10⁻¹¹ T","explain":"j_d,max = ε₀ωE₀ = 8.85×10⁻¹²×2π×1.00×10⁶×80.0 = 4.45×10⁻³ A/m²。取半径 r 的圆，r \u003c R 时 B·2πr = μ₀ε₀πr²dE/dt，得 B = (r/(2c²))dE/dt；r = R 时 B_max = (R/(2c²))ωE₀ = 0.0500/(2×9.00×10¹⁶)×5.03×10⁸ = 1.40×10⁻¹⁰ T。r > R 时 B = (R²/(2rc²))dE/dt，r = 8.00 cm 得 8.72×10⁻¹¹ T。易错点：忘记 1/c²；r > R 仍用线性公式（得 2.24×10⁻¹⁰ T）。"},{"id":"c15q042","type":"calc","difficulty":5,"tags":["位移电流","分段磁场","坡印廷定理"],"stem":"半径 R = 8.00 cm 的圆形平行板电容器，板间距 d = 3.00 mm，以恒定电流 I = 4.00 A 充电，忽略边缘效应。求：(1) 板间 r \u003c R 和 r > R 处磁感应强度 B(r) 的表达式；(2) r = R/2 与 r = 2R 处的 B 值；(3) 证明从圆柱侧面流入板间的能流功率等于 UI。","answer":"(1) r \u003c R：B = μ₀Ir/(2πR²)；r > R：B = μ₀I/(2πr)；(2) 均为 5.00×10⁻⁶ T；(3) 见推导，P = UI","explain":"板间 E = Q/(ε₀πR²)，位移电流密度 j_d = ε₀dE/dt = I/(πR²)。取半径 r 的圆：r \u003c R 时穿过圆的位移电流为 I r²/R²，得 B·2πr = μ₀Ir²/R²，B = μ₀Ir/(2πR²)；r > R 时包围全部位移电流，B = μ₀I/(2πr)。代入得 B(R/2) = μ₀I/(4πR) = 5.00×10⁻⁶ T，B(2R) = μ₀I/(4πR) = 5.00×10⁻⁶ T。侧面 r = R 处 S = EB/μ₀ = EI/(2πR)，穿过面积 2πRd 的功率 P = S·2πRd = EId = UI。易错点：r > R 仍用线性式；把位移电流写成 I r/R。"},{"id":"c15q043","type":"calc","difficulty":5,"tags":["麦克斯韦方程组","平面电磁波","能流密度"],"stem":"真空中一平面电磁波的电场为 E = E₀ sin(kx − ωt)，沿 y 轴方向。求：(1) 由法拉第定律求 B(x, t)；(2) 再由安培-麦克斯韦定律证明必须有 ω = ck；(3) 求平均能流密度的表达式。","answer":"(1) B = (E₀/c)sin(kx − ωt)，沿 z 轴；(2) 见推导；(3) ⟨S⟩ = ½ε₀cE₀²","explain":"由 ∇×E = −∂B/∂t，得 ∂B_z/∂t = −∂E_y/∂x = −kE₀cos(kx − ωt)，积分得 B_z = (kE₀/ω)sin(kx − ωt) = (E₀/c)sin(kx − ωt)。再由 ∇×B = μ₀ε₀∂E/∂t：−∂B_z/∂x = (k²E₀/ω)cos(kx − ωt)，μ₀ε₀∂E_y/∂t = −μ₀ε₀ωE₀cos(kx − ωt)；两式相等给出 k²/ω = μ₀ε₀ω，即 ω² = k²/(μ₀ε₀) = c²k²。⟨S⟩ = ½ε₀cE₀²。易错点：积分时漏掉 1/ω；把 ∂B/∂t 与 ∂B/∂x 弄混。"},{"id":"c15q044","type":"calc","difficulty":5,"tags":["电磁驻波","法拉第定律","能量密度"],"stem":"两块相距 L = 15.0 cm 的平行理想导体板之间形成电磁驻波，电场平行于板面（沿 y 轴），E = E₀ sin(kx)cos(ωt)，两板处均为电场波节。求：(1) 最低振荡频率；(2) 磁感应强度 B(x, t)；(3) 相邻电场波节的间距；(4) 若 E₀ = 200 V/m，电场能量密度的最大值及出现位置（以一块板为 x = 0）。","answer":"(1) 1.00×10⁹ Hz；(2) B_z = −(E₀/c)cos(kx)sin(ωt)；(3) 0.150 m；(4) 1.77×10⁻⁷ J/m³，在 x = 7.50 cm 处","explain":"两板为波节要求 L = nλ/2，最低模 n = 1，λ = 2L = 0.300 m，f = c/λ = 1.00×10⁹ Hz。由法拉第定律 ∂B_z/∂t = −∂E_y/∂x = −kE₀cos(kx)cos(ωt)，积分得 B_z = −(E₀/c)cos(kx)sin(ωt)。波节间距 λ/2 = 0.150 m。电场能量密度 u_E = ½ε₀E²，最大值 u_E,max = ½ε₀E₀² = 0.5×8.85×10⁻¹²×200² = 1.77×10⁻⁷ J/m³，位于两板中间的波腹 x = L/2 = 7.50 cm。易错点：把 L 当整波长（5.00×10⁸ Hz）；B 与 E 同相；在波节处找能量最大。"},{"id":"c15q045","type":"calc","difficulty":5,"tags":["辐射压","引力平衡","临界半径"],"stem":"太阳光强度 S = 1.38×10³ W/m²，垂直照射到密度 ρ = 3.00×10³ kg/m³ 的完全吸收球形尘埃颗粒上。颗粒半径 a 远大于波长时可视为几何截面（截面积为 πa²），太阳在 1 AU 处的引力加速度 g = 5.93×10⁻³ m/s²。求：(1) 辐射压力与太阳引力之比（用 a、S、ρ、g 表示）；(2) 使两者相等的临界半径 a_c；(3) a = 0.100 μm 时的比值。","answer":"(1) 3S/(4aρgc)；(2) 1.94×10⁻⁷ m；(3) 1.94","explain":"F_rad = Sπa²/c，F_grav = (4/3)πa³ρg，故 F_rad/F_grav = 3S/(4aρgc)。令比值为 1 得 a_c = 3S/(4ρgc) = 3×1.38×10³/(4×3.00×10³×5.93×10⁻³×3.00×10⁸) = 1.94×10⁻⁷ m。a = 1.00×10⁻⁷ m 时比值 = a_c/a = 1.94。说明：比值与 a 成反比，颗粒越小辐射压相对越重要；小于约 0.2 μm 的尘埃会被太阳光吹走，这正是彗尾尘埃远离太阳的原因。易错点：用直径 2a 代入；漏掉 4/3 的球体积因子。"},{"id":"c15q046","type":"calc","difficulty":5,"tags":["介质中电磁波","折射率","能流密度"],"stem":"某介质 ε_r = 6.25、μ_r = 1.00，其中平面电磁波的电场振幅为 250 V/m，频率为 5.00×10¹⁴ Hz。求：(1) 折射率和波速；(2) 磁感应强度振幅；(3) 介质中的波长；(4) 平均能流密度。","answer":"(1) n = 2.50，v = 1.20×10⁸ m/s；(2) 2.08×10⁻⁶ T；(3) 240 nm；(4) 207 W/m²","explain":"n = √(ε_rμ_r) = 2.50，v = c/n = 1.20×10⁸ m/s；B₀ = E₀/v = 250/(1.20×10⁸) = 2.08×10⁻⁶ T；λ = v/f = 1.20×10⁸/(5.00×10¹⁴) = 2.40×10⁻⁷ m = 240 nm。⟨S⟩ = ½ε₀cE₀²·n = 0.5×8.85×10⁻¹²×3.00×10⁸×250²×2.50 = 207 W/m²。易错点：用 B₀ = E₀/c（8.33×10⁻⁷ T）；漏掉 n 得 82.9 W/m²。"},{"id":"c15q047","type":"calc","difficulty":5,"tags":["偶极辐射","球面波","辐射压"],"stem":"某天线以 20.0 kW 的功率、100 MHz 的频率各向同性辐射。求：(1) 波长和半波振子天线的长度；(2) 距天线 5.00 km 处的平均能流密度和电场振幅；(3) 该处一个面积 0.500 m² 的全反射面受到的光压力。","answer":"(1) 3.00 m，1.50 m；(2) 6.37×10⁻⁵ W/m²，0.219 V/m；(3) 2.12×10⁻¹³ N","explain":"λ = c/f = 3.00 m，半波振子长 L = λ/2 = 1.50 m。球面波 ⟨S⟩ = P/(4πr²) = 2.00×10⁴/(4π×2.50×10⁷) = 6.37×10⁻⁵ W/m²；E₀ = √(2⟨S⟩/(ε₀c)) = 0.219 V/m。全反射面受力 F = 2⟨S⟩A/c = 2×6.37×10⁻⁵×0.500/(3.00×10⁸) = 2.12×10⁻¹³ N。易错点：漏掉 4π；用峰值场强算平均能流；按吸收算力（减半）。"},{"id":"c15q048","type":"calc","difficulty":5,"tags":["LC振荡","位移电流","能量转换"],"stem":"LC 振荡电路中 L = 4.00 mH、C = 40.0 pF，t = 0 时电容器电压为最大值 U₀ = 120 V，电流为零。求：(1) 振荡角频率和频率；(2) 电荷与电流随时间的变化式；(3) 电容器中位移电流的最大值；(4) 电场能量与磁场能量第一次相等的时刻。","answer":"(1) 2.50×10⁶ rad/s，3.98×10⁵ Hz；(2) q = 4.80×10⁻⁹cos(2.50×10⁶t) C，i = 1.20×10⁻²sin(2.50×10⁶t) A；(3) 1.20×10⁻² A；(4) 3.14×10⁻⁷ s","explain":"ω = 1/√(LC) = 1/√(4.00×10⁻³×40.0×10⁻¹²) = 2.50×10⁶ rad/s，f = ω/(2π) = 3.98×10⁵ Hz。Q₀ = CU₀ = 4.80×10⁻⁹ C，q = Q₀cosωt，i = −dq/dt = ωQ₀sinωt = 1.20×10⁻²sinωt。电容器中位移电流等于回路电流，最大值 1.20×10⁻² A。能量相等要求 ½q²/C = ½Li²，即 q = Q₀/√2，cosωt = 0.707，第一次 t = π/(4ω) = 3.14×10⁻⁷ s。易错点：把 ω 当频率；以为位移电流与传导电流反相。"},{"id":"c15q049","type":"calc","difficulty":5,"tags":["光动量","辐射压","动量守恒"],"stem":"能量 2.00 J、持续时间 5.00 ns 的激光脉冲垂直照射到质量 10.0 mg 的全反射小镜上，镜可自由移动。求：(1) 脉冲的动量；(2) 镜面获得的冲量；(3) 镜获得的速度；(4) 若镜面完全吸收，速度变为多少。","answer":"(1) 6.67×10⁻⁹ kg·m/s；(2) 1.33×10⁻⁸ N·s；(3) 1.33×10⁻³ m/s；(4) 6.67×10⁻⁴ m/s","explain":"p = U/c = 2.00/(3.00×10⁸) = 6.67×10⁻⁹ kg·m/s。全反射时光子动量反向，镜获得冲量 I = 2p = 1.33×10⁻⁸ N·s，速度 v = I/m = 1.33×10⁻⁸/(1.00×10⁻⁵) = 1.33×10⁻³ m/s。完全吸收时冲量为 p，速度减半，为 6.67×10⁻⁴ m/s。忽略脉冲期间镜的位移。易错点：全反射忘乘 2；把质量 10.0 mg 当 10.0 g；用 U/c² 当动量。"},{"id":"c15q050","type":"calc","difficulty":5,"tags":["平面电磁波","坡印廷矢量","光子数"],"stem":"真空中一平面电磁波的电场为 E = 600 cos(1.00×10⁷x − 3.00×10¹⁵t) V/m，沿 y 轴方向（x 以 m、t 以 s 计）。求：(1) 波长、频率和传播方向；(2) 磁感应强度表达式；(3) 平均能量密度和平均能流密度；(4) 完全吸收面和全反射面受到的光压；(5) 单位面积每秒通过的光子数。","answer":"(1) λ = 6.28×10⁻⁷ m，f = 4.77×10¹⁴ Hz，沿 +x；(2) B_z = 2.00×10⁻⁶cos(1.00×10⁷x − 3.00×10¹⁵t) T；(3) 1.59×10⁻⁶ J/m³，478 W/m²；(4) 1.59×10⁻⁶ Pa，3.19×10⁻⁶ Pa；(5) 1.51×10²¹ m⁻²·s⁻¹","explain":"k = 1.00×10⁷ rad/m，λ = 2π/k = 6.28×10⁻⁷ m；ω = 3.00×10¹⁵ rad/s，f = ω/(2π) = 4.77×10¹⁴ Hz；相位 kx − ωt 表明沿 +x 传播。B₀ = E₀/c = 2.00×10⁻⁶ T，E×B 沿 +x 要求 B 沿 +z。⟨u⟩ = ½ε₀E₀² = 1.59×10⁻⁶ J/m³，⟨S⟩ = c⟨u⟩ = 478 W/m²。光压：吸收 p = ⟨S⟩/c = 1.59×10⁻⁶ Pa，全反射 2⟨S⟩/c = 3.19×10⁻⁶ Pa。光子能量 hf = 3.16×10⁻¹⁹ J，光子数率密度 = ⟨S⟩/(hf) = 1.51×10²¹ m⁻²·s⁻¹。易错点：λ = 2π/k 写成 1/k；全反射光压忘乘 2；光子数率用峰值能流。"}]},{"chapter":16,"chapterName":"光的干涉","questions":[{"id":"c16q001","type":"choice","difficulty":3,"tags":["杨氏双缝","介质中波长","条纹间距"],"stem":"用波长 λ = 546 nm 的光垂直照射间距 d = 0.180 mm 的双缝，屏到双缝的距离 D = 1.50 m。若将整个装置浸入折射率 n = 1.33 的水中，屏上第 5 级明纹到中央明纹的距离为","options":["17.1 mm","22.8 mm","12.9 mm","13.7 mm"],"explain":"空气中条纹间距 Δx = Dλ/d = 1.50×546×10⁻⁹/(0.180×10⁻³) = 4.55 mm。\n进入水中光的波长变为 λ/n，故 Δx′ = D(λ/n)/d = Δx/n = 4.55/1.33 = 3.42 mm。\n第 5 级明纹 y₅ = 5Δx′ = 17.1 mm。\n易错点：忘记把波长换成 λ/n 会得 22.8 mm；把缝距也除以 n（相当于除以 n²）会得 12.9 mm；第 5 级只乘 4 会得 13.7 mm。","answer":"A"},{"id":"c16q002","type":"choice","difficulty":3,"tags":["薄膜干涉","半波损失","增反条件"],"stem":"一层折射率 n = 1.40 的透明薄膜置于空气中，用波长 λ = 560 nm 的光垂直照射。若反射光因干涉而增强，薄膜的最小厚度为","options":["200 nm","143 nm","71.4 nm","100 nm"],"explain":"上表面空气→膜（n 增大）反射有半波损失，下表面膜→空气（n 减小）无半波损失，故反射光总附加 λ/2。\n相长条件 2ne + λ/2 = kλ，取 k = 1 得最小厚度 e = λ/(4n) = 560/(4×1.40) = 100 nm。\n若漏掉半波损失，会按 2ne = λ/2 解出 200 nm；把 n² 放进分母、分子仍取 λ 得 143 nm；分子分母都处理得 71.4 nm。","answer":"D"},{"id":"c16q003","type":"choice","difficulty":3,"tags":["劈尖干涉","条纹间距","楔角"],"stem":"空气劈尖的棱边处为暗纹，沿长度方向 10.0 mm 内共数得 30 个暗纹间隔，所用光波长 λ = 589.3 nm。该劈尖的楔角为","options":["4.42×10⁻⁴ rad","7.50×10⁻⁴ rad","8.84×10⁻⁴ rad","17.7×10⁻⁴ rad"],"explain":"相邻暗纹间距 l = L/N = 10.0 mm/30 = 0.333 mm。\n暗纹条件 2e = kλ，而 e = θx，故相邻暗纹对应 θl = λ/2，即 θ = λ/(2l)。\nθ = 589.3×10⁻⁹/(2×3.33×10⁻⁴) = 8.84×10⁻⁴ rad。\n易错点：漏掉因子 2 得 1.77×10⁻³ rad；把 30 个间隔误当 15 个会得 4.42×10⁻⁴ rad；把波长误取 500 nm 得 7.50×10⁻⁴ rad。","answer":"C"},{"id":"c16q004","type":"choice","difficulty":3,"tags":["迈克尔逊干涉仪","动镜移动","波长测量"],"stem":"在迈克尔逊干涉仪中，移动可动反射镜 M₁，使视场中移过 500 条干涉条纹，测出 M₁ 移动了 0.150 mm。所用光的波长为","options":["1000 nm","600 nm","300 nm","1200 nm"],"explain":"动镜移动 d 时，光在干涉仪中往返，光程改变 2d；光程每改变一个 λ 移过一条条纹，故 N = 2d/λ。\nλ = 2d/N = 2×0.150×10⁻³/500 = 6.00×10⁻⁷ m = 600 nm。\n易错点：漏掉往返因子 2 得 300 nm；把 N 与 2N 记反会得 1200 nm；误把移动量读成 0.250 mm 得 1000 nm。","answer":"B"},{"id":"c16q005","type":"choice","difficulty":3,"tags":["牛顿环","暗环半径","波长测量"],"stem":"牛顿环实验中，平凸透镜的曲率半径 R = 2.00 m，测得第 5 级暗环半径为 2.00 mm。所用单色光的波长为","options":["400 nm","200 nm","800 nm","333 nm"],"explain":"暗环条件 2e + λ/2 = (2k+1)λ/2，即 2e = kλ；又由几何关系 e = r²/(2R)，得 r_k² = kλR。\nλ = r_k²/(kR) = (2.00×10⁻³)²/(5×2.00) = 4.00×10⁻⁷ m = 400 nm。\n易错点：误用明环公式 r_k² = (2k−1)λR/2 会得 200 nm；把 R 乘到分子会得 800 nm；把级次取 k+1 会得 333 nm。","answer":"A"},{"id":"c16q006","type":"choice","difficulty":3,"tags":["单缝衍射","双缝干涉","中央明纹宽度"],"stem":"双缝干涉装置中两缝间距 d = 0.250 mm，每条缝宽 a = 0.100 mm，屏距 D = 1.00 m，用波长 λ = 500 nm 的光照射。若用纸片挡住其中一条缝，屏上中央明纹的宽度为","options":["5.00 mm","20.0 mm","2.00 mm","10.0 mm"],"explain":"挡住一条缝后不再有双缝干涉，只剩单缝夫琅禾费衍射。\n单缝衍射中央明纹的半角宽为 θ = λ/a，屏上宽度为 2Dλ/a。\n宽度 = 2×1.00×500×10⁻⁹/(0.100×10⁻³) = 1.00×10⁻² m = 10.0 mm。\n易错点：仍按双缝间距算会得 2.00 mm；只取半宽得 5.00 mm；把 a 再除以 2 得 20.0 mm。","answer":"D"},{"id":"c16q007","type":"choice","difficulty":4,"tags":["杨氏双缝","薄片插入","条纹移动"],"stem":"杨氏双缝的缝距 d = 0.300 mm，屏距 D = 1.00 m，用波长 λ = 600 nm 的光照射。在上方那条缝后插入厚度 e = 6.00 μm、折射率 n = 1.50 的薄片后，屏上零级明纹将","options":["向上移动 20.0 mm","向上移动 30.0 mm","向上移动 10.0 mm","向下移动 10.0 mm"],"explain":"薄片使上方缝的光程增加 (n−1)e = 0.500×6.00×10⁻⁶ = 3.00×10⁻⁶ m = 5λ。\n零级明纹移到几何路程差恰为 (n−1)e 的位置，移动条纹数 N = (n−1)e/λ = 5。\n移动距离 Δy = N·Dλ/d = 5×2.00 mm = 10.0 mm。\n方向：光程被加长的一侧几何路程必须变短，故零级向插片一侧（上方）移动。漏掉 n−1 会得 20.0 mm，用 ne/λ 会得 30.0 mm。","answer":"C"},{"id":"c16q008","type":"choice","difficulty":4,"tags":["杨氏双缝","白光干涉","级次重合"],"stem":"用含 400 nm 与 600 nm 两种成分的光垂直照射双缝，缝距 d = 0.500 mm，屏距 D = 1.00 m。两种成分的明纹第一次重合处距中央明纹的距离为","options":["0.800 mm","2.40 mm","1.20 mm","4.80 mm"],"explain":"重合条件 k₁λ₁ = k₂λ₂，即 400k₁ = 600k₂，化为 2k₁ = 3k₂，最小整数解为 k₁ = 3、k₂ = 2。\n位置 y = k₁λ₁D/d = 3×400×10⁻⁹×1.00/(0.500×10⁻³) = 2.40×10⁻³ m = 2.40 mm。\n下一次重合对应 k₁ = 6、k₂ = 4，位置 4.80 mm。\n易错点：把级次比取反（k₁ = 2）会得 1.20 mm；直接取 k = 1 会得 0.800 mm。","answer":"B"},{"id":"c16q009","type":"choice","difficulty":4,"tags":["增透膜","半波损失","最小厚度"],"stem":"在折射率 n_g = 1.50 的玻璃表面镀一层折射率 n = 1.38 的氟化镁增透膜，用波长 λ = 550 nm 的光垂直照射。要使反射光干涉相消，膜的最小厚度为","options":["99.6 nm","199 nm","49.8 nm","144 nm"],"explain":"空气→MgF₂（n 增大）与 MgF₂→玻璃（n 增大）两次反射都有半波损失，两者相互抵消，反射光的光程差为 2ne。\n相消条件 2ne = (2k+1)λ/2，取 k = 0 得最小厚度 e = λ/(4n) = 550/(4×1.38) = 99.6 nm。\n若仍按“一次半波损失”加上 λ/2，会错误地解出 199 nm；把相消条件多除以 2 得 49.8 nm；用 n² 得 145 nm。","answer":"A"},{"id":"c16q010","type":"choice","difficulty":4,"tags":["劈尖干涉","加压","楔角变化"],"stem":"空气劈尖原来在 1.00 cm 内可数得 20.0 个条纹间隔，轻压上方的玻璃板后在 1.00 cm 内可数得 16.0 个条纹间隔，所用光波长 λ = 589.3 nm。楔角减小了","options":["2.36×10⁻⁴ rad","0.589×10⁻⁴ rad","1.27×10⁻⁴ rad","1.18×10⁻⁴ rad"],"explain":"单位长度条纹间隔数 N 与楔角的关系为 N = 2θ/λ（空气中）。\nθ₁ = λN₁/2 = 589.3×10⁻⁹×2000/2 = 5.89×10⁻⁴ rad，θ₂ = 589.3×10⁻⁹×1600/2 = 4.71×10⁻⁴ rad。\nΔθ = 1.18×10⁻⁴ rad。加压使 θ 变小、条纹间距变大，条纹向厚端（开口端）移动。\n易错点：漏掉因子 2 得 2.36×10⁻⁴ rad；误用 He-Ne 的 632.8 nm 得 1.27×10⁻⁴ rad；把“条纹数变少”误当 θ 变大就会选错方向。","answer":"D"},{"id":"c16q011","type":"choice","difficulty":4,"tags":["牛顿环","液体折射率","暗环半径"],"stem":"同一牛顿环装置，在透镜与平板之间为空气时测得某级暗环半径为 3.00 mm；充满某种透明液体后，同一级暗环半径变为 2.60 mm。该液体的折射率为","options":["0.751","1.07","1.33","1.15"],"explain":"暗环半径满足 r² = kλR/n，同一级 k 下 r ∝ 1/√n。\nn = (r_air/r_liq)² = (3.00/2.60)² = 1.33。\n易错点：直接把半径比 3.00/2.60 = 1.15 当折射率（忘记半径与 1/√n 成正比）；把比值平方后取倒数得 0.751；对半径比只开一次方得 1.07。","answer":"C"},{"id":"c16q012","type":"choice","difficulty":4,"tags":["迈克尔逊干涉仪","插入薄片","条纹计数"],"stem":"迈克尔逊干涉仪的一臂中插入厚度 t = 0.100 mm、折射率 n = 1.52 的平行玻璃片，所用光波长 λ = 632.8 nm。视场中移过的条纹数约为","options":["480 条","164 条","82 条","329 条"],"explain":"光在干涉仪中往返两次穿过薄片，插入后光程增加 2(n−1)t，故 N = 2(n−1)t/λ。\nN = 2×0.520×0.100×10⁻³/(632.8×10⁻⁹) = 164.3，取 164 条。\n易错点：漏掉往返因子 2 得 82 条；用 n 代替 n−1 得 480 条；按 2N 计得 329 条；把薄片厚度当作 200 μm 得 328 条。","answer":"B"},{"id":"c16q013","type":"choice","difficulty":4,"tags":["杨氏双缝","光程差","介质薄片"],"stem":"杨氏双缝的两条缝后分别插入薄片：缝 1 后为厚度 3.00 μm、折射率 1.60 的薄片，缝 2 后为厚度 2.00 μm、折射率 1.40 的薄片。用波长 λ = 500 nm 的光照射，屏上零级明纹移动的条纹数和方向为","options":["2 条，向缝 1 一侧","2 条，向缝 2 一侧","4 条，向缝 1 一侧","5.20 条，向缝 1 一侧"],"explain":"两片薄片带来的附加光程分别为 (1.60−1)×3.00 = 1.80 μm 与 (1.40−1)×2.00 = 0.80 μm，净差 1.00 μm（缝 1 更大）。\nΔ = 1.00 μm = 2λ（λ = 500 nm），故零级明纹移动 2.00 条。\n光程增加较多的是缝 1，零级向缝 1 一侧移动（该侧几何路程需变短）。\n易错点：忘记减 1（净差 2.00 μm）会得 4.00 条；把两片作用相加（2.60 μm）会得 5.20 条。","answer":"A"},{"id":"c16q014","type":"choice","difficulty":4,"tags":["等厚干涉","等倾干涉","条纹判别"],"stem":"用波长 λ = 600 nm 的光观察薄膜干涉：(1) 平行光垂直照射楔形空气膜，相邻明纹对应的空气层厚度差为多少；(2) 用扩展光源照射厚度均匀的平行空气膜，在透镜焦面上得到同心圆环，圆环从中心向外是变密还是变疏","options":["300 nm，变疏","600 nm，变密","150 nm，变密","300 nm，变密"],"explain":"等厚干涉：暗纹条件 2e = kλ，相邻明纹的厚度差 Δe = λ/2 = 300 nm，条纹是等间距直条纹。\n等倾干涉：2e cos i = kλ，入射角 i 增大时 cos i 减小，相邻级次对应的角度间隔变小，圆环由中心向外变密。\n判别依据：直条纹对应厚度变化（等厚），同心圆环对应入射角变化（等倾）。\n易错点：把 Δe 写成 λ 会得 600 nm；把厚度差取 λ/4 会得 150 nm；认为圆环向外变疏是把“半径变大”与“间隔变大”混为一谈。","answer":"D"},{"id":"c16q015","type":"choice","difficulty":4,"tags":["杨氏双缝","级次重合","位置计算"],"stem":"用含 600 nm 与 450 nm 两种波长的光照射双缝，缝距 d = 0.400 mm，屏距 D = 1.00 m。已知 600 nm 的第 3 级明纹与 450 nm 的第 4 级明纹重合，重合处距中央明纹的距离为","options":["3.38 mm","2.25 mm","4.50 mm","6.00 mm"],"explain":"两明纹重合的条件是 3×600 = 4×450 = 1800 nm，即光程差相同。\ny = kλD/d = 1800×10⁻⁹×1.00/(0.400×10⁻³) = 4.50×10⁻³ m = 4.50 mm。\n易错点：只按 600 nm 的第 4 级算会得 6.00 mm；只按 450 nm 的第 3 级算会得 3.38 mm；取一半得 2.25 mm。","answer":"C"},{"id":"c16q016","type":"choice","difficulty":4,"tags":["牛顿环","两透镜","等效曲率半径"],"stem":"将一个曲率半径 R₁ = 1.00 m 的平凸透镜放在另一个曲率半径 R₂ = 2.00 m 的平凸透镜凸面上，两凸面间形成空气薄膜。用波长 λ = 589.3 nm 的光垂直照射，反射光中第 10 级暗环的半径为","options":["4.20 mm","1.98 mm","2.43 mm","3.43 mm"],"explain":"两球面间空气膜厚度 e = r²/2×(1/R₁ + 1/R₂)，等效曲率半径满足 1/R = 1/R₁ + 1/R₂。\nR = 1.00×2.00/(1.00+2.00) = 0.667 m，暗环 r_k = √(kλR)。\nr₁₀ = √(10×589.3×10⁻⁹×0.667) = 1.98×10⁻³ m = 1.98 mm。\n易错点：只取 R₁ 得 2.43 mm，只取 R₂ 得 3.43 mm；把等效 R 取成 R₁+R₂ 会得 4.20 mm。","answer":"B"},{"id":"c16q017","type":"choice","difficulty":4,"tags":["增反膜","半波损失","最小厚度"],"stem":"在折射率 1.50 的玻璃表面镀一层折射率 n = 2.35 的硫化锌增反膜，用波长 λ = 600 nm 的光垂直照射。要使反射光干涉增强，膜的最小厚度为","options":["63.8 nm","128 nm","31.9 nm","100 nm"],"explain":"空气→ZnS（n 增大）反射有半波损失，ZnS→玻璃（2.35→1.50，n 减小）无半波损失，故反射光附加 λ/2。\n增反条件 2ne + λ/2 = kλ，取 k = 1 得 e = λ/(4n) = 600/(4×2.35) = 63.8 nm。\n易错点：认为两次反射都有半波损失而相互抵消，会按 2ne = λ/2 解出 127.7 nm；用玻璃折射率算得 100 nm；把 2ne = λ/4 解出 31.9 nm。","answer":"A"},{"id":"c16q018","type":"choice","difficulty":4,"tags":["迈克尔逊干涉仪","薄片测折射率","光程"],"stem":"在迈克尔逊干涉仪的一臂中插入厚度 t = 20.0 μm 的透明薄片，视场中移过 40 条条纹，所用光波长 λ = 500 nm。该薄片的折射率为","options":["2.00","3.00","1.10","1.50"],"explain":"光往返两次穿过薄片，光程增加 2(n−1)t，对应 N 条条纹：N = 2(n−1)t/λ。\nn = 1 + Nλ/(2t) = 1 + 40×500×10⁻⁹/(2×20.0×10⁻⁶) = 1.50。\n易错点：不除以 2 直接加 1 得 2.00；把 Nλ/t 再加倍得 3.00；把厚度取 100 μm 得 1.10。","answer":"D"},{"id":"c16q019","type":"choice","difficulty":4,"tags":["劈尖干涉","夹丝直径","条纹间隔"],"stem":"用波长 λ = 589.3 nm 的光垂直照射空气劈尖，劈尖开口端夹有直径 D = 15.0 μm 的细丝。从棱边到细丝处共数得的暗纹间隔数为","options":["102","52","51","25"],"explain":"暗纹条件 2e = kλ，细丝处空气层厚度 e = D，故从棱边到细丝的暗纹间隔数 N = 2D/λ。\nN = 2×15.0×10⁻⁶/(589.3×10⁻⁹) = 50.9，取 51 个间隔。\n若问“暗纹条数”，还要加上棱边那一条，共 52 条。\n易错点：漏掉因子 2 得 25；把间隔数当条数再加 1 会与 52 混淆。","answer":"C"},{"id":"c16q020","type":"choice","difficulty":4,"tags":["杨氏双缝","条纹间距","缝距测量"],"stem":"用波长 λ = 632.8 nm 的光照射双缝，屏距 D = 2.00 m。测得第 1 级明纹与第 21 级明纹之间的距离为 24.0 mm，两缝间距为","options":["0.844 mm","1.05 mm","1.11 mm","0.527 mm"],"explain":"第 1 级到第 21 级之间有 20 个条纹间距，故 Δx = 24.0 mm/20 = 1.20 mm。\n由 Δx = Dλ/d 得 d = Dλ/Δx = 2.00×632.8×10⁻⁹/(1.20×10⁻³) = 1.05×10⁻³ m = 1.05 mm。\n易错点：把 21 级当 21 个间距会得 1.11 mm；漏掉屏距 D 会得 0.527 mm；把间隔数错数为 16 得 0.844 mm。","answer":"B"},{"id":"c16q021","type":"choice","difficulty":4,"tags":["薄膜干涉","斜入射","光程差"],"stem":"折射率 n = 1.50 的透明薄膜置于空气中，光以入射角 i = 30° 照射薄膜，波长 λ = 600 nm。若反射光干涉相消，薄膜的最小厚度为","options":["106 nm","100 nm","113 nm","122 nm"],"explain":"斜入射时薄膜上下表面反射光的光程差为 δ = 2e√(n² − sin²i) + λ/2。\n相消条件 δ = (2k+1)λ/2，取最小值得 2e√(n² − sin²i) = λ/2。\n√(1.50² − sin²30°) = √(2.25 − 0.25) = 1.414，e = 600/(4×1.414) = 106 nm。\n易错点：直接用垂直入射公式得 100 nm；把 sin²i 写成 sin i 得 113 nm；把入射角取 60° 得 122 nm。","answer":"A"},{"id":"c16q022","type":"choice","difficulty":4,"tags":["等倾干涉","中心级次","半波损失"],"stem":"折射率 n = 1.50、厚度 e = 1.20 μm 的平行薄膜置于空气中，用波长 λ = 600 nm 的扩展光源垂直照射，在反射光中观察等倾圆环。圆环中心处是暗斑还是亮斑，对应的干涉级次 δ/λ 为","options":["亮斑，6.5","暗斑，6.0","亮斑，7.0","暗斑，6.5"],"explain":"垂直入射时 δ = 2ne + λ/2 = 2×1.50×1.20×10⁻⁶ + 0.300×10⁻⁶ = 3.90×10⁻⁶ m。\nδ/λ = 3.90×10⁻⁶/(600×10⁻⁹) = 6.5，即 δ = 13λ/2，满足暗纹条件，中心为暗斑，级次 6.5。\n若漏掉半波损失会得 6.0λ（亮斑）；把级次四舍五入并按亮纹处理会答“亮斑，7.0”。","answer":"D"},{"id":"c16q023","type":"choice","difficulty":4,"tags":["相干长度","谱线宽度","光程差"],"stem":"某光源发出中心波长 λ = 600 nm、谱线宽度 Δλ = 0.020 nm 的光。用该光源做干涉实验时，两束光的光程差最大不能超过","options":["36.0 mm","1.80 mm","18.0 mm","9.00 mm"],"explain":"相干长度 L = λ²/Δλ = (600×10⁻⁹)²/(0.020×10⁻⁹) = 1.80×10⁻² m = 18.0 mm。\n光程差超过 L 时两束光不再相干，条纹消失。\n易错点：用 λ/Δλ 会得 3.00×10⁻⁵ m；把 Δλ 取成 0.010 nm 会得 36.0 mm；把公式记成 L = λ²/(2Δλ) 得 9.00 mm；Δλ 取 0.20 nm 得 1.80 mm。","answer":"C"},{"id":"c16q024","type":"choice","difficulty":4,"tags":["牛顿环","曲率半径","半径差"],"stem":"牛顿环实验中，测得第 5 级暗环半径为 2.00 mm，第 15 级暗环半径为 4.40 mm，所用光波长 λ = 589.3 nm。平凸透镜的曲率半径为","options":["2.19 m","2.61 m","1.36 m","1.74 m"],"explain":"暗环满足 r_k² = kλR，两式相减得 r₁₅² − r₅² = (15−5)λR，未知的接触点误差被消去。\nR = (r₁₅² − r₅²)/(10λ) = (4.40² − 2.00²)×10⁻⁶/(10×589.3×10⁻⁹)。\n= 15.36×10⁻⁶/(5.893×10⁻⁶) = 2.61 m。\n易错点：只用 r₅²/(5λ) 得 1.36 m，无法消除接触点形变误差；把级次差取 15 得 1.74 m；只用 r₁₅²/(15λ) 得 2.19 m。","answer":"B"},{"id":"c16q025","type":"choice","difficulty":4,"tags":["双缝干涉","单缝衍射","缺级"],"stem":"双缝间距 d = 0.300 mm，每条缝宽 a = 0.100 mm，屏距 D = 1.00 m，用波长 λ = 600 nm 的光垂直照射。关于第 3 级干涉明纹，下列说法正确的是","options":["位于 6.00 mm 处，因缺级而不可见","位于 6.00 mm 处，可以正常看到","位于 2.00 mm 处，因缺级而不可见","位于 12.0 mm 处，因缺级而不可见"],"explain":"缺级条件：d sinθ = kλ 与 a sinθ = mλ 同时成立，得 k = (d/a)m = 3m，故第 3、6、9…级缺失。\n第 3 级位置 y₃ = 3Dλ/d = 3×1.00×600×10⁻⁹/(0.300×10⁻³) = 6.00 mm。\n该处正是单缝衍射的第一级暗纹，干涉明纹被衍射包络压到零，故不可见。\n易错点：把缺级条件写成 k = a/d 会误判为第 1 级缺失；第 1 级在 2.00 mm 处、第 3 级在 6.00 mm 处，别把级次与位置错配。","answer":"A"},{"id":"c16q026","type":"choice","difficulty":5,"tags":["白光干涉","级次重合","双缝"],"stem":"用包含 400 nm 到 700 nm 连续波长的白光垂直照射缝距 d = 5.00 μm 的双缝。在屏上首先发生重合的两种成分及其级次是","options":["400 nm 的第 5 级与 500 nm 的第 4 级","400 nm 的第 4 级与 700 nm 的第 7 级","400 nm 的第 3 级与 600 nm 的第 2 级","400 nm 的第 7 级与 700 nm 的第 4 级"],"explain":"重合条件 k₁λ₁ = k₂λ₂。400 与 700 的最小公倍数为 2800 nm：400×7 = 700×4 = 2800 nm。\n故 400 nm 的第 7 级与 700 nm 的第 4 级首先重合，位置 y = 2800×10⁻⁹×D/d。\n再下一个重合是 5600 nm（400 nm 第 14 级与 700 nm 第 8 级）。\n注意：不是级次相同才重合；短波长的较高级次才能追上长波长的较低级次。d = 5.00 μm 时第 7 级确实存在（400 nm 的最高级次为 12）。","answer":"D"},{"id":"c16q027","type":"choice","difficulty":5,"tags":["薄膜干涉","白光","反射增强"],"stem":"一层折射率 n = 1.33、厚度 e = 400 nm 的肥皂膜置于空气中，白光垂直照射。在反射光中，可见光范围内因干涉而增强的波长主要为","options":["532 nm 和 426 nm","2128 nm 和 426 nm","709 nm 和 426 nm","709 nm 和 532 nm"],"explain":"反射增强条件 2ne + λ/2 = kλ，即 λ = 4ne/(2k−1)。\n4ne = 4×1.33×400 = 2128 nm；k = 1,2,3,4 依次给出 2128、709、426、304 nm。\n可见光范围内增强的是 709 nm（红）与 426 nm（紫），两者混合使膜呈紫红色。\n易错点：用 2ne = kλ（漏掉半波损失）会得到 1064、532、355 nm，误选 532 nm；k = 1 的 2128 nm 在红外，不算可见光。","answer":"C"},{"id":"c16q028","type":"choice","difficulty":5,"tags":["增透膜","折射率匹配","膜厚设计"],"stem":"要在折射率 n_g = 1.50 的玻璃上镀单层增透膜，使波长 λ = 550 nm 的光反射完全相消。理想膜材料的折射率和采用氟化镁（n = 1.38）时的最小膜厚分别为","options":["1.38，99.6 nm","1.22，99.6 nm","1.50，91.7 nm","1.22，199 nm"],"explain":"单层增透膜要求上下表面反射光相消。因空气→膜、膜→玻璃都是 n 增大，两次反射都有半波损失、相互抵消，故 2n_f e = λ/2。\n同时两束反射光振幅要相等才能完全消反射，这要求 n_f = √n_g = √1.50 = 1.22。\n用 MgF₂ 时 e = λ/(4n_f) = 550/(4×1.38) = 99.6 nm；因 1.38 偏离 1.22，只能部分增透。\n易错点：把理想折射率写成 n_g 本身；把膜厚写成 λ/(2n) 得 199 nm；用玻璃折射率算膜厚得 91.7 nm；把实际膜材料当成理想材料会误答 n = 1.38。","answer":"B"},{"id":"c16q029","type":"choice","difficulty":5,"tags":["牛顿环","间隙变化","条纹移动"],"stem":"牛顿环装置中，平凸透镜与平板玻璃之间为空气，用波长 λ = 500 nm 的光垂直照射。若将透镜沿竖直方向缓慢抬高 0.500 μm，则中心处明暗变化的次数和圆环移动的方向为","options":["2 次，向中心收缩","2 次，向外扩张","1 次，向中心收缩","4 次，向中心收缩"],"explain":"抬高透镜使空气层厚度增加 Δe = 0.500 μm，反射光光程差改变 2Δe = 1.00 μm。\n1.00 μm/500 nm = 2，故中心处明暗变化 2 次。\n间隙变大后，同一级条纹对应的空气层厚度出现在更小的半径处，圆环向中心收缩。\n易错点：只算 Δe/λ = 1 次（漏掉往返因子 2）；把 Δe 当成 2Δe 再乘 2 得 4.00 次；把“收缩”误判为“扩张”。","answer":"A"},{"id":"c16q030","type":"choice","difficulty":5,"tags":["迈克尔逊干涉仪","气体折射率","光程"],"stem":"迈克尔逊干涉仪一臂中放置长 L = 50.0 mm 的玻璃气室，先将气室抽成真空，再缓慢充入某种气体，视场中移过 60 条条纹，所用光波长 λ = 600 nm。该气体的折射率为","options":["1.00072","1.00018","1.00004","1.00036"],"explain":"光在气室中往返两次，充气后光程增加 2(n−1)L，对应 N 条条纹：N = 2(n−1)L/λ。\nn − 1 = Nλ/(2L) = 60×600×10⁻⁹/(2×50.0×10⁻³) = 3.60×10⁻⁴，故 n = 1.00036。\n易错点：漏掉往返因子 2 得 1.00072；把气室长度当成 100 mm 会得 1.00018；取 500 mm 得 1.00004。","answer":"D"},{"id":"c16q031","type":"choice","difficulty":5,"tags":["双缝干涉","单缝衍射","包络"],"stem":"双缝的缝距 d = 0.400 mm，每条缝宽 a = 0.0800 mm，屏距 D = 1.00 m，用波长 λ = 600 nm 的光垂直照射。单缝衍射中央包络内可见的干涉明纹总数为","options":["7 条","5 条","9 条","11 条"],"explain":"干涉条纹间距 Δx = Dλ/d = 1.00×600×10⁻⁹/(0.400×10⁻³) = 1.50 mm。\n单缝中央明纹宽度 2Dλ/a = 2×600×10⁻⁹/(0.0800×10⁻³) = 15.0 mm，即包络边界在 ±7.50 mm。\n缺级级次 k = (d/a)m = 5m，第 5 级正好落在包络边界上并缺失。\n包络内可见 k = 0、±1、±2、±3、±4，共 9 条明纹。\n把边界处缺失的 ±5 级也算进去得 11 条；只数到 ±2 得 5 条；把 ±3 误当可见得 7 条。","answer":"C"},{"id":"c16q032","type":"choice","difficulty":5,"tags":["相干长度","谱线宽度","干涉条件"],"stem":"用中心波长 λ = 500 nm 的光做干涉实验，测得相干长度为 2.00 mm。该光源谱线的宽度 Δλ 约为","options":["0.500 nm","0.125 nm","0.250 nm","0.0625 nm"],"explain":"相干长度 L = λ²/Δλ，故 Δλ = λ²/L = (500×10⁻⁹)²/(2.00×10⁻³) = 1.25×10⁻¹⁰ m = 0.125 nm。\n谱线越窄，相干长度越长；若 Δλ 增大到 0.250 nm，相干长度只剩 1.00 mm。\n易错点：用 L = λ/Δλ 会得 2.50×10⁻⁴ m（量纲不对）；把公式记成 L = λ²/(2Δλ) 得 0.250 nm；记成 L = 2λ²/Δλ 得 0.0625 nm；把 L 取 0.500 mm 得 0.500 nm。","answer":"B"},{"id":"c16q033","type":"choice","difficulty":5,"tags":["薄膜干涉","连续谱","相邻极大"],"stem":"折射率 n = 1.50、厚度 e = 1.00 μm 的平行薄膜置于空气中，用波长可连续变化的光源垂直照射。在反射光谱中，位于 600 nm 两侧且与它相邻的两个干涉极大对应的波长约为","options":["667 nm 和 545 nm","600 nm 和 500 nm","750 nm 和 600 nm","667 nm 和 500 nm"],"explain":"反射极大条件 2ne + λ/2 = kλ，即 λ = 2ne/(k − 1/2)，其中 2ne = 3.00 μm。\nk = 5 给 λ = 3.00/4.5 = 667 nm，k = 6 给 λ = 3.00/5.5 = 545 nm。\n在 600 nm 处 2ne = 5λ，δ = 5.5λ 恰为暗纹，所以两个极大分居 600 nm 两侧。\n易错点：漏掉半波损失会误以为 600 nm 本身是极大；把 2ne = 3.00 μm 直接除以 4 得 750 nm。","answer":"A"},{"id":"c16q034","type":"choice","difficulty":5,"tags":["劈尖干涉","液体折射率","条纹数"],"stem":"空气劈尖在长度 L = 20.0 mm 内可数得 40.0 个条纹间隔，充入某种透明液体后同样长度内可数得 53.0 个条纹间隔，所用光波长 λ = 589.3 nm。该液体的折射率和劈尖楔角分别为","options":["1.32，2.95×10⁻⁴ rad","0.755，5.89×10⁻⁴ rad","1.32，4.45×10⁻⁴ rad","1.32，5.89×10⁻⁴ rad"],"explain":"空气中 N₁ = 2θ/λ，液体中 N₂ = 2nθ/λ，两式相除得 n = N₂/N₁ = 53.0/40.0 = 1.32。\n由 N₁ = 2θ/λ 得 θ = λN₁/(2L) = 589.3×10⁻⁹×40.0/(2×20.0×10⁻³) = 5.89×10⁻⁴ rad。\n注意条纹数按“间隔数”计；把 n 放进分母得 4.45×10⁻⁴ rad；比值取反得 0.755。","answer":"D"},{"id":"c16q035","type":"choice","difficulty":5,"tags":["牛顿环","双波长","公共暗环"],"stem":"同一牛顿环装置（平凸透镜曲率半径 R = 1.00 m）先后用 λ₁ = 500 nm 和 λ₂ = 600 nm 的光照射。某一暗环在两种光下半径恰好相同，该公共暗环在两种光下分别是第几级，半径为多少","options":["λ₁ 的第 6 级与 λ₂ 的第 5 级，3.46 mm","λ₁ 的第 10 级与 λ₂ 的第 12 级，1.73 mm","λ₁ 的第 6 级与 λ₂ 的第 5 级，1.73 mm","λ₁ 的第 5 级与 λ₂ 的第 6 级，1.73 mm"],"explain":"同一暗环半径 r 满足 r² = k₁λ₁R = k₂λ₂R，故 k₁/k₂ = λ₂/λ₁ = 600/500 = 6/5。\n最小整数解为 k₁ = 6（500 nm）、k₂ = 5（600 nm）。\nr = √(k₁λ₁R) = √(6×500×10⁻⁹×1.00) = 1.73×10⁻³ m = 1.73 mm。\n易错点：把级次比取反会答 5 与 6；用 2r 得 3.46 mm；10 与 12 级在 500/600 nm 下并不重合（5000 ≠ 7200）。","answer":"C"},{"id":"c16q036","type":"calc","difficulty":5,"tags":["杨氏双缝","条纹间距","插片移动"],"stem":"杨氏双缝实验中，两缝间距 d = 0.200 mm，屏距 D = 1.20 m，用波长 λ = 546.1 nm 的光垂直照射。求：(1) 相邻明纹的间距 Δx 与第 4 级明纹到中央明纹的距离 y₄；(2) 若在其中一条缝后紧贴一块厚度 e = 4.00 μm、折射率 n = 1.50 的薄片，条纹整体移动多少距离，向哪个方向移动？(3) 此时第 4 级明纹移到原第几级明纹的位置附近？","answer":"Δx = 3.28 mm，y₄ = 13.1 mm；条纹向插片一侧移动 12.0 mm（约 3.66 个条纹间距）；第 4 级明纹移到原第 7.66 级附近","explain":"(1) Δx = Dλ/d = 1.20×546.1×10⁻⁹/(0.200×10⁻³) = 3.28×10⁻³ m；y₄ = 4Δx = 13.1 mm。\n(2) 插片使该缝的光程增加 (n−1)e = 0.500×4.00×10⁻⁶ = 2.00×10⁻⁶ m。\n相当于光程差整体平移，条纹移动的间距数 N = (n−1)e/λ = 2.00×10⁻⁶/(546.1×10⁻⁹) = 3.66。\n移动距离 Δy = NΔx = 3.66×3.28 = 12.0 mm。插片使该缝“落后”，要补上光程，条纹向插片一侧移动。\n(3) 原第 k 级的位置现在是第 k + 3.66 级，故第 4 级移到原第 7.66 级附近。\n易错点：把 (n−1)e 写成 ne 会把移动量放大约 3 倍；方向判断反了会答“向未插片一侧”。"},{"id":"c16q037","type":"calc","difficulty":5,"tags":["杨氏双缝","介质中波长","白光重合"],"stem":"双缝间距 d = 0.500 mm，屏距 D = 2.00 m。用单色光照射时，屏上第 1 级明纹与第 11 级明纹相距 22.0 mm。求：(1) 该单色光的波长；(2) 若整个装置浸入折射率 n = 1.333 的水中，上述两级明纹的距离变为多少；(3) 若改用 400 nm 到 700 nm 的白光，屏上首先重合的两种成分的级次及重合位置。","answer":"λ = 550 nm；水中距离 16.5 mm；400 nm 的第 3 级与 600 nm 的第 2 级首先重合，位置距中央 4.80 mm","explain":"(1) 1 级到 11 级含 10 个间距，Δx = 22.0/10 = 2.20 mm，λ = dΔx/D = 0.500×10⁻³×2.20×10⁻³/2.00 = 550 nm。(2) 水中波长变为 λ/n，Δx 也变为 Δx/n = 1.65 mm；10 个间距为 16.5 mm。(3) 不同波长同级不同位置，重合条件是 k₁λ₁ = k₂λ₂ = K，位置 y = KD/d，所以「首先重合」就是找最小的 K。要让两个波长都落在 400–700 nm，需 K/2 ≥ 400 nm，即 K ≥ 800 nm 才可能有两个不同级次同时成立；逐段检查：K = 1000 nm 只有 k = 2、λ = 500 nm 一个解（k = 1 时 λ = 1000 nm 已超出），K = 1200 nm 时 k = 3、λ = 400 nm 与 k = 2、λ = 600 nm 同时成立，是最小公倍数解。故 y = 1200×10⁻⁹×2.00/(0.500×10⁻³) = 4.80 mm。400 nm 第 7 级与 700 nm 第 4 级（K = 2800 nm）确实也重合，但位置 11.2 mm 在更远处，不是「首先」。易错点：只看两个边缘波长求公倍数，会把远端重合当成首次重合。"},{"id":"c16q038","type":"calc","difficulty":5,"tags":["薄膜干涉","半波损失","斜入射"],"stem":"一层折射率 n = 1.33 的肥皂膜置于空气中，用波长 λ = 600 nm 的光照射，观察反射光的干涉。求：(1) 垂直入射时使反射光增强的最小膜厚；(2) 入射角 i = 60° 时使反射光增强的最小膜厚；(3) 说明半波损失由什么决定，斜入射时是否需要改变判断。","answer":"e₁ = 113 nm；e₂ = 149 nm；半波损失只由界面两侧折射率的大小关系决定，与入射角和膜厚无关，斜入射时判断不变","explain":"(1) 空气→膜折射率增大，有半波损失；膜→空气折射率减小，无半波损失，故 δ = 2ne + λ/2。\n增强条件 δ = kλ，最小厚度 2ne = λ/2，e = λ/(4n) = 600/(4×1.33) = 113 nm。\n(2) 斜入射时 δ = 2e√(n² − sin²i) + λ/2，令其等于 λ 得 e = λ/(4√(n² − sin²i))。\n√(1.33² − sin²60°) = √(1.7689 − 0.7500) = 1.009，e = 149 nm。\n(3) 半波损失发生在光从光疏介质射向光密介质的反射面上，只取决于界面两侧 n 的大小；掠射或斜射只改变几何光程，不改变这一判断。\n易错点：漏掉半波损失会把结果算大一倍（得 226 nm）；把 sin²i 写成 sin i 会得 138 nm。"},{"id":"c16q039","type":"calc","difficulty":5,"tags":["增透膜","增反膜","折射率匹配"],"stem":"在折射率 n_g = 1.50 的玻璃表面镀膜，用波长 λ = 550 nm 的光垂直照射。求：(1) 用折射率 n = 1.38 的氟化镁做增透膜时的最小厚度；(2) 单层膜要完全消除反射，膜材料的折射率应为多少，为什么 1.38 只能部分增透；(3) 若改用折射率 2.35 的硫化锌做增反膜，最小厚度为多少。","answer":"e_MgF₂ = 99.6 nm；理想 n = √n_g = 1.22；ZnS 增反膜 e = 58.5 nm","explain":"(1) 空气→膜、膜→玻璃折射率都增大，两次反射都有半波损失，相互抵消，δ = 2n_f e。\n增透要求 2n_f e = λ/2，e = λ/(4n_f) = 550/(4×1.38) = 99.6 nm。\n(2) 完全消反射还要求两束反射光振幅相等，即 (n_f − 1)/(n_f + 1) = (n_g − n_f)/(n_g + n_f)，解得 n_f = √n_g = 1.22。\n1.38 与 1.22 相差较大，两束反射光振幅不等，只能部分抵消，剩余反射率不为零。\n(3) 增反要求反射光同相叠加：空气→ZnS 有半波损失，ZnS→玻璃（2.35→1.50）无半波损失，δ = 2n_e + λ/2 = kλ，\n最小厚度 e = λ/(4n) = 550/(4×2.35) = 58.5 nm。\n易错点：增反膜与增透膜的最小厚度都可能是 λ/(4n)，关键看半波损失的次数是 1 次还是 2 次／0 次。"},{"id":"c16q040","type":"calc","difficulty":5,"tags":["劈尖干涉","楔角","条纹数"],"stem":"空气劈尖由两块平板玻璃构成，劈尖长度 L = 40.0 mm，开口端夹有直径 D = 20.0 μm 的细丝，用波长 λ = 589.3 nm 的光垂直照射。求：(1) 劈尖的楔角 θ 与条纹间距 l；(2) 从棱边到细丝处共可数到多少个条纹间隔、多少条暗纹；(3) 若在劈尖内充入折射率 n = 1.33 的液体，条纹间隔数变为多少；(4) 若在细丝处把上玻璃板下压 2.00 μm，条纹如何移动、移过多少条。","answer":"θ = 5.00×10⁻⁴ rad，l = 0.589 mm；67.88 个间隔（取 67 个，共 68 条暗纹）；充液后约 90 个间隔；下压后向厚端移过约 6.79 条","explain":"(1) θ ≈ D/L = 20.0×10⁻⁶/(40.0×10⁻³) = 5.00×10⁻⁴ rad；l = λ/(2θ) = 589.3×10⁻⁹/(2×5.00×10⁻⁴) = 0.589 mm。\n(2) 暗纹条件 2e = kλ，细丝处 e = D，故间隔数 N = 2D/λ = 2×20.0×10⁻⁶/(589.3×10⁻⁹) = 67.88，取 67 个间隔；连同棱边那条暗纹共 68 条。\n(3) 液体中波长变为 λ/n，同样厚度差对应的间隔数变为 nN = 90.28，约 90 个间隔。\n(4) 下压使各点空气层变薄，同一级条纹向空气层更厚处（开口端）移动；移过的条数 N = 2Δe/λ = 2×2.00×10⁻⁶/(589.3×10⁻⁹) = 6.79。\n易错点：把“间隔数”直接当“暗纹条数”，少算棱边那一条；下压方向判断反了会答“向棱边移动”。"},{"id":"c16q041","type":"calc","difficulty":5,"tags":["牛顿环","暗环半径","介质"],"stem":"平凸透镜的曲率半径 R = 2.00 m，放在平板玻璃上，用波长 λ = 589.3 nm 的光垂直照射，观察反射光形成的牛顿环。求：(1) 第 10 级暗环的半径；(2) 第 10 级明环的半径；(3) 在透镜与平板之间充入折射率 n = 1.33 的液体后，第 10 级暗环半径变为多少；(4) 若换用 λ′ = 500 nm 的光，第 10 级暗环半径又为多少。","answer":"r₁₀暗 = 3.43 mm；r₁₀明 = 3.35 mm；充液后 2.98 mm；λ′ = 500 nm 时 3.16 mm","explain":"(1) 暗环条件 2e + λ/2 = (2k+1)λ/2，即 2e = kλ；由几何关系 e = r²/(2R)，得 r_k = √(kλR)。\nr₁₀ = √(10×589.3×10⁻⁹×2.00) = 3.43 mm。\n(2) 明环条件 2e = (2k−1)λ/2，r = √((k−0.5)λR)，k = 10 时 r = 3.35 mm，比同级暗环略小。\n(3) 液体中波长变为 λ/n，r ∝ √(λ/n)，r₁₀′ = r₁₀/√n = 2.98 mm，圆环变密。\n(4) r ∝ √λ，r = r₁₀×√(500/589.3) = 3.16 mm。\n易错点：把明环公式写成 r = √(kλR) 会与暗环混淆；充液后误以为半径变大。"},{"id":"c16q042","type":"calc","difficulty":5,"tags":["牛顿环","公式推导","曲率半径测量"],"stem":"牛顿环实验中用读数显微镜测暗环直径。求：(1) 由平凸透镜曲率半径 R、光波长 λ 推导第 k 级暗环半径 r_k 的表达式（设接触点无附加间隙）；(2) 若接触点处存在微小附加间隙或形变，说明为什么用两个不同级次的直径差可以消除这一影响，并导出 R 的表达式；(3) 测得第 5 级暗环直径 D₅ = 4.00 mm、第 15 级暗环直径 D₁₅ = 6.93 mm，λ = 589.3 nm，求 R。","answer":"r_k = √(kλR)；R = (D_n² − D_m²)/(4(n−m)λ)；代入得 R = 1.36 m","explain":"(1) 暗环处空气层厚度 e 满足 2e = kλ；由 e ≈ r²/(2R)（r ≪ R）得 r_k² = kλR，即 r_k = √(kλR)。\n(2) 若接触点有附加间隙 e₀，则暗环条件变为 2(e + e₀) = kλ，r_k² = kλR − 2e₀R。\n对两个级次 n、m 相减：r_n² − r_m² = (n−m)λR，e₀ 被消去，故\nR = (r_n² − r_m²)/((n−m)λ) = (D_n² − D_m²)/(4(n−m)λ)。\n(3) R = (6.93² − 4.00²)×10⁻⁶/(4×10×589.3×10⁻⁹) = 32.02×10⁻⁶/(2.357×10⁻⁵) = 1.36 m。\n易错点：用直径差而不是平方差，会得 R = (D₁₅ − D₅)/(4×10×λ) = 124 m，比正确值大约 90 倍。"},{"id":"c16q043","type":"calc","difficulty":5,"tags":["迈克尔逊干涉仪","波长测量","折射率测量"],"stem":"迈克尔逊干涉仪用波长未知的单色光照明。求：(1) 移动可动反射镜 0.250 mm 时视场中移过 850 条条纹，求光波长；(2) 在一臂中插入厚度 t = 50.0 μm 的透明薄片，条纹移过 60 条，求薄片折射率；(3) 在一臂中放入长 L = 100 mm 的真空气室，充入气体后条纹移过 45 条，求气体的折射率。","answer":"λ = 588 nm；n = 1.353；n_气 − 1 = 0.000132，即 n_气 = 1.00013","explain":"(1) 动镜移动 Δd 使光程差改变 2Δd，每改变一个 λ 移过一条：N = 2Δd/λ。\nλ = 2Δd/N = 2×0.250×10⁻³/850 = 588 nm。\n(2) 薄片使一臂光程增加 (n−1)t，且光往返两次：N = 2(n−1)t/λ。\nn − 1 = Nλ/(2t) = 60×588×10⁻⁹/(2×50.0×10⁻⁶) = 0.353，n = 1.353。\n(3) 气室中光往返：N = 2(n−1)L/λ，n − 1 = 45×588×10⁻⁹/(2×0.100) = 0.000132。\n易错点：三问都容易漏掉往返因子 2，结果全部偏大一倍；把气室长度 100 mm 当成 200 mm 会使 n−1 偏小一半。"},{"id":"c16q044","type":"calc","difficulty":5,"tags":["相干长度","谱线宽度","迈克尔逊干涉仪"],"stem":"用中心波长 λ = 600 nm 的钠光灯做迈克尔逊干涉实验。求：(1) 谱线宽度 Δλ = 0.0100 nm 时的相干长度；(2) 两臂光程差为 30.0 mm 时能否看到干涉条纹；(3) 若谱线宽度变为 0.0500 nm，上述光程差下还能否看到条纹。","answer":"L₁ = 36.0 mm，能看到条纹；Δλ = 0.0500 nm 时 L₂ = 7.20 mm，看不到条纹","explain":"(1) 相干长度 L = λ²/Δλ = (600×10⁻⁹)²/(0.0100×10⁻⁹) = 36.0 mm。\n(2) 两臂光程差 30.0 mm 小于 L₁ = 36.0 mm，两束光仍部分相干，能看到条纹（对比度下降）。\n(3) Δλ 增大到 0.0500 nm 时 L₂ = λ²/Δλ = 7.20 mm，小于 30.0 mm，两束光不再相干，条纹消失。\n这说明谱线越宽、单色性越差，能允许的最大光程差越小；迈克尔逊干涉仪测长时臂差不能超过相干长度。\n易错点：用 L = λ/Δλ（得 6.00×10⁻⁵ m）会把相干长度算小三个量级。"},{"id":"c16q045","type":"calc","difficulty":5,"tags":["双缝干涉","单缝衍射","缺级"],"stem":"双缝的缝距 d = 0.300 mm，每条缝宽 a = 0.100 mm，屏距 D = 1.00 m，用波长 λ = 600 nm 的光垂直照射。求：(1) 干涉条纹的间距；(2) 单缝衍射中央明纹的宽度；(3) 哪些级次的干涉明纹缺失；(4) 单缝衍射中央包络内实际可见的干涉明纹共有几条。","answer":"Δx = 2.00 mm；中央明纹宽 12.0 mm；缺级 k = 3、6、9…；包络内可见 5 条","explain":"(1) Δx = Dλ/d = 1.00×600×10⁻⁹/(0.300×10⁻³) = 2.00 mm。\n(2) 单缝中央明纹宽度 = 2Dλ/a = 2×600×10⁻⁹/(0.100×10⁻³) = 12.0 mm，即从 −6.00 mm 到 +6.00 mm。\n(3) 缺级条件 d sinθ = kλ 与 a sinθ = mλ 同时成立，k = (d/a)m = 3m，故 k = 3、6、9…缺失。\n(4) 包络边界在 ±6.00 mm，对应干涉级次 ±3；第 3 级恰好缺失，包络内只有 k = 0、±1、±2 共 5 条明纹。\n易错点：把包络宽度当成 ±12.0 mm，会多数出 ±5 级；忽略缺级会把第 3 级也算进去得 7 条。"},{"id":"c16q046","type":"calc","difficulty":5,"tags":["薄膜干涉","白光光谱","等倾圆环"],"stem":"折射率 n = 1.50、厚度 e = 1.00 μm 的平行薄膜置于空气中。求：(1) 白光垂直照射时，反射光中在可见光范围（400–760 nm）内被增强的波长；(2) 波长 600 nm 的光垂直入射时，反射光是增强还是减弱；(3) 用 600 nm 的扩展光源照射，反射光形成等倾圆环，求从中心向外的第一个亮环对应的入射角。","answer":"增强波长 667 nm、545 nm、462 nm、400 nm；600 nm 处反射减弱；第一亮环 i ≈ 25.8°","explain":"(1) 反射增强条件 2ne + λ/2 = kλ，即 λ = 2ne/(k − 1/2)，其中 2ne = 2×1.50×1.00 μm = 3.00 μm。k = 5、6、7、8 依次给出 667、545、462、400 nm，都在 400–760 nm 内（400 nm 恰在端点，算在内）；k = 4 给 857 nm，已出范围。(2) 600 nm 处 2ne = 5λ，δ = 5λ + λ/2 = 5.5λ，是半波长的奇数倍，反射相消。(3) 中心（i = 0）为暗，级次 5.5；向外 i 增大、cos i 减小，光程差减小，第一个亮环对应 δ = 5λ：2ne cos i + λ/2 = 5λ，cos i = 4.5λ/(2ne) = 2.70/3.00 = 0.900，i = 25.8°。易错点：把中心当成亮环，会从 δ = 5.5λ 起步去找，算出不存在的角度。"},{"id":"c16q047","type":"calc","difficulty":5,"tags":["杨氏双缝","插片","折射率"],"stem":"双缝间距 d = 0.250 mm，屏距 D = 1.50 m，用波长 λ = 550 nm 的光垂直照射。在一条缝后插入厚度 e = 8.00 μm 的透明薄片，发现屏上条纹整体移动了 28.8 mm。求：(1) 用 (n−1)eD/d 表示移动量并反求薄片折射率；(2) 移动量相当于多少个条纹间距；(3) 条纹移动的方向与插片位置的关系。","answer":"Δy = (n−1)eD/d，n = 1 + Δy·d/(eD) = 1.60；约 8.73 条；向插片一侧移动","explain":"(1) 插片使该缝光程增加 (n−1)e，相当于原中央明纹处光程差不再为零，条纹平移 Δy = (n−1)eD/d。\n反解 n = 1 + Δy·d/(eD) = 1 + 28.8×10⁻³×0.250×10⁻³/(8.00×10⁻⁶×1.50) = 1.60。\n(2) 一个间距 Δx = Dλ/d = 1.50×550×10⁻⁹/(0.250×10⁻³) = 3.30 mm，N = Δy/Δx = 8.73 条。\n(3) 插片使该缝的光“落后”，要重建零光程差，观察点必须向插片一侧偏移，故条纹向插片一侧移动；插在另一缝则反向。\n易错点：把移动量当成 Δy = neD/d，会把 n 算成 0.600；方向说反是最常见的失分点。"},{"id":"c16q048","type":"calc","difficulty":5,"tags":["劈尖干涉","条纹密度","折射率"],"stem":"用波长 λ = 589.3 nm 的光垂直照射空气劈尖，每厘米长度内数得 25.0 条暗纹。求：(1) 劈尖的楔角；(2) 若在劈尖内充入透明液体，同样每厘米内数得 33.0 条暗纹，求液体折射率；(3) 说明为什么充液后条纹变密。","answer":"θ = Nλ/2 = 7.37×10⁻⁴ rad；n = N₂/N₁ = 1.32；充液后波长变短、条纹变密","explain":"(1) 单位长度条纹数 N = 1/l = 2θ/λ，故 θ = Nλ/2 = 25.0×10²×589.3×10⁻⁹/2 = 7.37×10⁻⁴ rad。\n(2) 液体中 N′ = 2nθ/λ，与空气情形相除得 n = N′/N = 33.0/25.0 = 1.32。\n(3) 液体中光波长变为 λ/n，同样厚度变化对应的光程差变化变大，满足暗纹条件的厚度间隔变小，条纹间距 l = λ/(2nθ) 变小。\n易错点：把“条/厘米”当成总条数；用 N = θ/λ 漏掉因子 2，θ 会小一半。"},{"id":"c16q049","type":"calc","difficulty":5,"tags":["牛顿环","等效曲率半径","折射率"],"stem":"两块平凸透镜的凸面相对接触，曲率半径分别为 R₁ = 1.00 m 和 R₂ = 1.50 m，用波长 λ = 589.3 nm 的光垂直照射。求：(1) 推导两凸面间空气薄层的等效曲率半径，并求第 5 级暗环半径；(2) 在两透镜间充入液体后，第 5 级暗环半径变为 1.15 mm，求液体折射率；(3) 与单块 R = 1.00 m 的平凸透镜放在平板玻璃上时第 5 级暗环半径比较，说明哪个环更密。","answer":"1/R = 1/R₁ + 1/R₂，R = 0.600 m，r₅ = 1.33 mm；n = (r₅/r₅′)² = 1.34；单透镜 r₅ = 1.72 mm，两透镜时环更密","explain":"(1) 设接触点为原点，两球面在半径 r 处的间隙 e = r²/(2R₁) + r²/(2R₂) = r²(1/R₁ + 1/R₂)/2，\n故等效曲率半径满足 1/R = 1/R₁ + 1/R₂，R = R₁R₂/(R₁+R₂) = 0.600 m。\n暗环 r_k = √(kλR)，r₅ = √(5×589.3×10⁻⁹×0.600) = 1.33 mm。\n(2) 液体中 r ∝ 1/√n，n = (r₅/r₅′)² = (1.33/1.15)² = 1.34。\n(3) 单块 R₁ = 1.00 m 时 r₅ = √(5λR₁) = 1.72 mm，比两透镜时的 1.33 mm 大；\n等效曲率半径越小，同一级环的半径越小、环越密，两透镜接触时条纹更密。\n易错点：把等效 R 写成 R₁ + R₂ = 2.50 m，环半径会算大约 2 倍；充液后误以为环变稀。"},{"id":"c16q050","type":"calc","difficulty":5,"tags":["杨氏双缝","介质","白光"],"stem":"双缝间距 d = 0.400 mm，屏距 D = 1.00 m，用波长 λ = 600 nm 的光垂直照射。求：(1) 条纹间距与第 5 级明纹的位置；(2) 若在双缝与屏之间充满透明液体，第 5 级明纹移到 5.64 mm 处，求液体折射率；(3) 若改用 480 nm 与 600 nm 两种波长同时照射，它们的明纹第一次重合的位置。","answer":"Δx = 1.50 mm，y₅ = 7.50 mm；n = 1.33；480 nm 第 5 级与 600 nm 第 4 级在 6.00 mm 处重合","explain":"(1) Δx = Dλ/d = 1.00×600×10⁻⁹/(0.400×10⁻³) = 1.50 mm；y₅ = 5Δx = 7.50 mm。\n(2) 液体中波长变为 λ/n，各级位置按 1/n 缩小：y₅′ = y₅/n，故 n = y₅/y₅′ = 7.50/5.64 = 1.33。\n(3) 重合条件 k₁λ₁ = k₂λ₂，480×5 = 600×4 = 2400 nm，位置 y = 2400×10⁻⁹×D/d = 6.00 mm。\n此时 480 nm 的第 5 级与 600 nm 的第 4 级重合，更高级次还会周期性地再重合。\n易错点：直接用 y = kλD/d 而不检查 k 是否为整数；把介质中的 D 也除以 n。"}]},{"chapter":17,"chapterName":"光的衍射","questions":[{"id":"c17q001","type":"choice","difficulty":3,"tags":["单缝夫琅禾费衍射","中央明纹角宽度"],"stem":"单缝宽 a = 0.150 mm，用波长 λ = 633 nm 的平行光垂直照射，缝后放焦距 f = 0.800 m 的凸透镜，在透镜焦面上观察夫琅禾费衍射图样。中央明纹的角宽度和焦面上的线宽度分别约为","options":["8.44×10⁻³ rad，6.75 mm","4.22×10⁻³ rad，3.38 mm","8.44×10⁻³ rad，3.38 mm","1.69×10⁻² rad，13.5 mm"],"answer":"A","explain":"中央明纹的角宽度是两个第一级暗纹之间的角距离：Δθ = 2λ/a = 2×633×10⁻⁹/1.50×10⁻⁴ = 8.44×10⁻³ rad。\n线宽度 Δx = fΔθ = 0.800×8.44×10⁻³ = 6.75×10⁻³ m = 6.75 mm。\n易错点：λ/a 只是半角宽度（中心到第一暗纹），漏掉因子 2 得 4.22×10⁻³ rad 和 3.38 mm；角宽度与线宽度之间还要乘焦距。"},{"id":"c17q002","type":"choice","difficulty":3,"tags":["缝宽对条纹的影响","中央明纹线宽度"],"stem":"单缝宽 a₁ = 0.250 mm、透镜焦距 f₁ = 0.600 m 时，λ = 550 nm 的平行光在焦面上形成中央明纹线宽 2.64 mm。若把缝宽改为 a₂ = 0.100 mm、焦距改为 f₂ = 1.00 m，其他条件不变，中央明纹线宽变为","options":["6.60 mm","4.40 mm","11.0 mm","5.50 mm"],"answer":"C","explain":"线宽度公式 Δx = 2λf/a，同时与 f 成正比、与 a 成反比。\n代入新值：Δx = 2×550×10⁻⁹×1.00/1.00×10⁻⁴ = 1.10×10⁻² m = 11.0 mm。\n6.60 mm 是只改缝宽、仍用 f₁ 的结果；4.40 mm 是只改焦距、仍用 a₁ 的结果；5.50 mm 是漏掉因子 2（用 λf/a）的结果。\n易错点：缝变窄条纹变宽、变暗（中央光强约按 a² 减弱），两个量要一起代。"},{"id":"c17q003","type":"choice","difficulty":4,"tags":["单缝暗纹条件","缝宽测量"],"stem":"单缝衍射实验中，λ = 600 nm 的平行光垂直入射，缝后透镜焦距 f = 1.20 m。测得焦面上第三级暗纹距中央明纹中心 3.60 mm。该缝宽和中央明纹线宽度分别为","options":["0.200 mm，7.20 mm","0.600 mm，1.20 mm","0.600 mm，2.40 mm","0.400 mm，3.60 mm"],"answer":"C","explain":"第三级暗纹满足 a sinθ = 3λ，小角下 sinθ ≈ x/f = 3.60×10⁻³/1.20 = 3.00×10⁻³。\n故 a = 3λ/sinθ = 3×600×10⁻⁹/3.00×10⁻³ = 6.00×10⁻⁴ m = 0.600 mm。\n中央明纹线宽 Δx = 2λf/a = 2×600×10⁻⁹×1.20/6.00×10⁻⁴ = 2.40×10⁻³ m = 2.40 mm。\n易错点：把 3.60 mm 当成第一级暗纹位置会得 a = 0.200 mm（7.20 mm）；把实测位置当线宽反推会得 0.400 mm。"},{"id":"c17q004","type":"choice","difficulty":4,"tags":["单缝明纹条件","明纹与暗纹位置"],"stem":"单缝宽 a = 0.100 mm，λ = 500 nm 的平行光垂直入射，透镜焦距 f = 2.00 m。焦面上第二级明纹与第三级暗纹之间的距离为","options":["10.0 mm","5.00 mm","15.0 mm","35.0 mm"],"answer":"B","explain":"明纹条件 a sinθ = (2k+1)λ/2，k = 2 时 sinθ = 5λ/(2a) = 1.25×10⁻²，x = f tanθ ≈ 2.00×1.25×10⁻² = 25.0 mm。\n暗纹条件 a sinθ = kλ，k = 3 时 sinθ = 3λ/a = 1.50×10⁻²，x = 30.0 mm。\n两者相距 30.0 − 25.0 = 5.00 mm。\n易错点：暗纹误用 (2k+1)λ/2 得 35.0 mm；明纹误用 (2k−1)λ/2 得 15.0 mm，都会把间距算错。"},{"id":"c17q005","type":"choice","difficulty":5,"tags":["白光单缝衍射","暗纹缺色"],"stem":"用白光（波长 400–700 nm）垂直照射宽 a = 0.100 mm 的单缝，透镜焦距 f = 1.00 m，在焦面上观察衍射图样。距中央明纹中心 5.00 mm 处呈现的颜色是","options":["绿色，该处只剩绿光","白色，各色光强度相同","紫红色，该处缺少 500 nm 附近的绿光","红色，因为红光衍射角最大"],"answer":"C","explain":"该方向的衍射角满足 sinθ ≈ x/f = 5.00×10⁻³。\n第一级暗纹条件 a sinθ = λ 给出 λ = a sinθ = 1.00×10⁻⁴×5.00×10⁻³ = 5.00×10⁻⁷ m = 500 nm，即绿光在该方向恰好缺失。\n其余红光、蓝紫光仍以不同强度到达，红蓝混合呈紫红色；红光波长最长、偏折角最大，所以彩色条纹总是红在外、紫在内。\n易错点：中央明纹才是白色，两侧彩色是按波长展开的，缺色的方向要由 a sinθ = kλ 反算波长。"},{"id":"c17q006","type":"choice","difficulty":5,"tags":["缺级条件","双缝衍射包络"],"stem":"双缝间距 d = 0.500 mm、缝宽 a = 0.100 mm，λ = 600 nm 的平行光垂直入射，透镜焦距 f = 1.00 m。关于缺级，下列说法正确的是","options":["缺 4、8、12 级，第一缺级距中央 4.80 mm","缺 2、4、6 级，第一缺级距中央 2.40 mm","不存在缺级，单缝包络只改变强度、不改变明纹位置","缺 5、10、15 级，第一缺级距中央 6.00 mm"],"answer":"D","explain":"缺级要求双缝干涉极大与单缝衍射极小同时满足：d sinθ = kλ 且 a sinθ = k'λ，两式相除得 k = (d/a)k' = 5k'。\n故缺 5、10、15…级；第一缺级 k = 5，sinθ = 5λ/d = 6.00×10⁻³，x = f tanθ ≈ 6.00 mm。\n易错点：d/a 取反会得 4、8、12 级；把 a 当缝间距会得 2.40 mm；缺级处包络因子恰为零，条纹是整个消失而不是仅仅变暗。"},{"id":"c17q007","type":"choice","difficulty":5,"tags":["缺级位置","单缝第一暗纹重合"],"stem":"双缝间距 d = 0.320 mm、缝宽 a = 0.0800 mm，λ = 480 nm 的平行光垂直入射，透镜焦距 f = 1.50 m。第一缺级（最先消失的干涉明纹）距中央明纹中心的距离为","options":["2.25 mm","9.00 mm","4.50 mm","36.0 mm"],"answer":"B","explain":"d/a = 4，缺级为 k = 4k'，第一缺级 k = 4，由 d sinθ = 4λ 得 sinθ = 4×480×10⁻⁹/3.20×10⁻⁴ = 6.00×10⁻³。\n所以 x = f tanθ ≈ 1.50×6.00×10⁻³ = 9.00×10⁻³ m = 9.00 mm。\n这个位置也正是单缝第一暗纹 a sinθ = λ 处（因 d/a = 4 时 λ/a = 4λ/d），两套条件在此重合。\n易错点：2.25 mm 是用 λ/d（漏掉缺级级次 4）；36.0 mm 是用 4λ/a 并把 a、d 弄反。"},{"id":"c17q008","type":"choice","difficulty":3,"tags":["圆孔衍射","爱里斑"],"stem":"用 λ = 550 nm 的单色光照射直径 D = 2.00 mm 的圆孔，孔后透镜焦距 f = 1.00 m。爱里斑的半角宽度和焦面上的半径分别为","options":["2.75×10⁻⁴ rad，0.275 mm","6.71×10⁻⁴ rad，0.671 mm","3.36×10⁻⁴ rad，0.671 mm","3.36×10⁻⁴ rad，0.336 mm"],"answer":"D","explain":"爱里斑半角宽度 θ = 1.22λ/D = 1.22×550×10⁻⁹/2.00×10⁻³ = 3.36×10⁻⁴ rad。\n焦面上半径 r = fθ = 1.00×3.36×10⁻⁴ = 3.36×10⁻⁴ m = 0.336 mm。\n易错点：漏掉 1.22 得 2.75×10⁻⁴ rad；把 2.44λ/D（直径对应的角）当半角得 6.71×10⁻⁴ rad；把半径算成直径得 0.671 mm。"},{"id":"c17q009","type":"choice","difficulty":4,"tags":["瑞利判据","望远镜分辨本领"],"stem":"直径 D = 0.100 m 的望远镜物镜观察 λ = 550 nm 的双星，若双星到地球的距离均为 10.0 km，按瑞利判据可分辨的最小间距为","options":["6.71 cm","5.50 cm","13.4 cm","3.36 cm"],"answer":"A","explain":"最小分辨角 θ_min = 1.22λ/D = 1.22×550×10⁻⁹/0.100 = 6.71×10⁻⁶ rad。\n在距离 L = 10.0 km 处对应的最小间距 s = Lθ_min = 1.00×10⁴×6.71×10⁻⁶ = 6.71×10⁻² m = 6.71 cm。\n易错点：漏 1.22 得 5.50 cm；把半角当直径、再乘 2 得 13.4 cm；把 θ_min 再除以 2 得 3.36 cm。"},{"id":"c17q010","type":"choice","difficulty":3,"tags":["人眼分辨极限","瑞利判据"],"stem":"人眼瞳孔直径约为 3.00 mm，对 λ = 550 nm 的光，在明视距离 25.0 cm 处能分辨的两点间最小距离约为","options":["0.112 mm","0.0280 mm","0.0559 mm","0.0458 mm"],"answer":"C","explain":"人眼的最小分辨角 θ_min = 1.22λ/D = 1.22×550×10⁻⁹/3.00×10⁻³ = 2.24×10⁻⁴ rad（约 46″）。\n明视距离 L = 0.250 m 处的最小分辨距离 s = Lθ_min = 0.250×2.24×10⁻⁴ = 5.59×10⁻⁵ m = 0.0559 mm。\n易错点：漏 1.22 得 0.0458 mm；把直径当半角得 0.112 mm；再除以 2 得 0.0280 mm。这也说明人眼在 25 cm 处只能看清约 0.06 mm 的细节。"},{"id":"c17q011","type":"choice","difficulty":4,"tags":["提高分辨本领","望远镜口径"],"stem":"要求在 λ = 600 nm 处望远镜的分辨角不超过 2.0×10⁻⁶ rad，其物镜口径至少应为","options":["0.300 m","0.366 m","0.732 m","0.183 m"],"answer":"B","explain":"由 θ_min = 1.22λ/D ≤ 2.0×10⁻⁶ rad 解出口径下限 D ≥ 1.22λ/θ_min。\nD ≥ 1.22×600×10⁻⁹/2.0×10⁻⁶ = 0.366 m。\n提高分辨本领的两条途径都体现在这个式子里：增大 D（口径）或减小 λ（改用短波）。\n易错点：漏 1.22 得 0.300 m；误用 2.44λ/D 得 0.732 m；把不等号方向弄反去乘 2 得 0.183 m。"},{"id":"c17q012","type":"choice","difficulty":4,"tags":["显微镜分辨极限","数值孔径"],"stem":"显微镜使用 λ = 500 nm 的光，物镜的数值孔径 NA = n sin u = 1.40。该显微镜的最小分辨距离为","options":["0.218 μm","0.179 μm","0.436 μm","0.109 μm"],"answer":"A","explain":"显微镜的最小分辨距离 d = 0.61λ/(n sin u) = 0.61λ/NA。\n代入：d = 0.61×500×10⁻⁹/1.40 = 2.18×10⁻⁷ m = 0.218 μm。\n易错点：把 0.61 写成 0.5 得 0.179 μm；误用圆孔的 1.22 系数得 0.436 μm；再除以 2 得 0.109 μm。"},{"id":"c17q013","type":"choice","difficulty":5,"tags":["油浸物镜","分辨本领提高"],"stem":"某显微镜在空气中（n = 1.00）的最小分辨距离为 d₀。若换用 n = 1.50 的油浸物镜，孔径角 u 不变，则最小分辨距离变为","options":["1.50d₀","0.816d₀","0.667d₀","2.25d₀"],"answer":"C","explain":"最小分辨距离 d = 0.61λ₀/(n sin u)，其中 λ₀ 为真空波长，进入介质后波长变为 λ₀/n。\n孔径角不变时 d ∝ 1/n，故 d = d₀/1.50 = 0.667d₀，分辨本领提高 1.50 倍。\n易错点：误认为 d ∝ n 得 1.50d₀；误按 √n 得 0.816d₀；误按 n² 得 2.25d₀。油浸的作用就是提高 n、缩短介质中的波长。"},{"id":"c17q014","type":"choice","difficulty":3,"tags":["光栅方程","光栅常数与刻线密度"],"stem":"用 λ = 600 nm 的平行光垂直照射光栅，测得第一级明纹的衍射角为 17.5°（sin17.5° = 0.301）。该光栅的光栅常数和每毫米刻线数分别为","options":["1.00 μm，1000 条/mm","2.00 μm，500 条/mm","2.00 μm，2000 条/mm","0.600 μm，1667 条/mm"],"answer":"B","explain":"光栅方程 d sinθ = kλ，k = 1：d = λ/sinθ = 600×10⁻⁹/0.301 = 1.99×10⁻⁶ m ≈ 2.00 μm。\n每毫米刻线数 n = 1/d = 1/(2.00×10⁻³ mm) = 500 条/mm。\n易错点：用 λ/(2 sinθ) 得 1.00 μm；把 1/d 中的 d 换成 μm 又乘 1000 得 2000 条/mm；直接把波长当光栅常数得 0.600 μm。"},{"id":"c17q015","type":"choice","difficulty":4,"tags":["光栅总缝数","条纹半角宽度"],"stem":"一块光栅每毫米有 500 条刻线，总宽 20.0 mm，用 λ = 600 nm 的平行光垂直照射。该光栅的总缝数和第二级明纹的半角宽度分别为","options":["1.00×10⁴，3.75×10⁻⁵ rad","1.00×10⁴，3.00×10⁻⁵ rad","1.00×10⁴，7.50×10⁻⁵ rad","2.00×10⁴，1.88×10⁻⁵ rad"],"answer":"A","explain":"d = 1/(500 mm⁻¹) = 2.00 μm，总缝数 N = 500×20.0 = 1.00×10⁴。\n第二级 sinθ = 2λ/d = 0.600，cosθ = 0.800，半角宽度 Δθ = λ/(Nd cosθ)。\n代入：Δθ = 600×10⁻⁹/(1.00×10⁴×2.00×10⁻⁶×0.800) = 3.75×10⁻⁵ rad。\n易错点：漏 cosθ 得 3.00×10⁻⁵ rad；把半角宽度当全宽乘 2 得 7.50×10⁻⁵ rad；把总宽当 40 mm 得 N = 2.00×10⁴。"},{"id":"c17q016","type":"choice","difficulty":5,"tags":["光栅最大级次","掠射限制"],"stem":"光栅常数 d = 2.00 μm，用 λ = 600 nm 的平行光垂直照射，在屏上能观察到的最高级次为","options":["4 级","2 级","3 级","级次没有上限，只要屏足够大"],"answer":"C","explain":"光栅方程 d sinθ = kλ 要求 |sinθ| ≤ 1，故 k ≤ d/λ = 2.00×10⁻⁶/600×10⁻⁹ = 3.33。\n级次取整数，最高 3 级，对应 sinθ = 3×600×10⁻⁹/2.00×10⁻⁶ = 0.900（θ = 64.2°）。\n第 4 级要求 sinθ = 1.20 > 1，物理上不存在。\n易错点：把 3.33 四舍五入成 4；只数到 sinθ ≤ 0.9 却漏掉第三级；把 d/λ 当成没有上限。"},{"id":"c17q017","type":"choice","difficulty":5,"tags":["缺级现象","d/a 比"],"stem":"双缝的缝间距与缝宽之比 d/a = 3.00，单色平行光垂直入射。屏上干涉明纹中缺失的级次为","options":["2、4、6 级","1、2、3 级","3、6、9 级","3、5、7 级"],"answer":"C","explain":"缺级条件：d sinθ = kλ（干涉极大）与 a sinθ = k'λ（单缝极小）同时成立，相除得 k = (d/a)k'。\n代入 d/a = 3 得 k = 3k'，即第 3、6、9…级缺失。\n易错点：把 d/a 取倒数会得 2、4、6 级（那对应 d/a = 2）；以为前三级全缺；把缺级误当成奇次缺。"},{"id":"c17q018","type":"choice","difficulty":4,"tags":["缺级反推缝宽","缺级级次判断"],"stem":"用 λ = 600 nm 的光垂直照射某双缝，发现干涉明纹的第 4 级缺失，而第 5 级存在。若两缝中心间距 d = 3.00 μm，则缝宽 a 为","options":["1.50 μm","0.750 μm","0.600 μm","3.00 μm"],"answer":"B","explain":"缺级满足 k = (d/a)k'，k' 取 1 时最小的缺级级次就是 d/a。\n第 4 级缺而第 5 级存在，说明 d/a = 4（若 d/a = 5 则第 5 级缺；若 d/a = 2 则第 2 级先缺）。\n故 a = d/4 = 3.00/4 = 0.750 μm。\n易错点：按 2 级缺得 1.50 μm；误把“第 5 级存在”当缺级条件得 0.600 μm；以为 a = d 得 3.00 μm。"},{"id":"c17q019","type":"choice","difficulty":4,"tags":["光栅分辨本领","R = kN"],"stem":"光栅总缝数 N = 5000，用第二级光谱观察钠双线 589.0 nm 与 589.6 nm。该光栅能否分辨这两条谱线","options":["能，R = 5.0×10³，所需分辨本领仅 9.8×10²","不能，R = 1.0×10⁴，所需分辨本领为 9.8×10⁵","能，R = 1.0×10⁴，所需分辨本领仅 9.8×10²","不能，R = 1.0×10⁴，所需分辨本领为 5.9×10⁴"],"answer":"C","explain":"光栅分辨本领 R = kN = 2×5000 = 1.0×10⁴。\n分辨钠双线所需 R = λ/Δλ = 589.3/0.6 = 9.8×10²。\nR 比所需值大一个量级，能清晰分辨。\n易错点：把 N 直接当 R 得 5.0×10³（漏 k）；把 Δλ 的单位弄错（0.6 nm 当成 0.006 nm）得 9.8×10⁵ 或 5.9×10⁴。"},{"id":"c17q020","type":"choice","difficulty":5,"tags":["分辨本领应用","光栅设计"],"stem":"要求在 λ = 600 nm 附近分辨波长相差 0.10 nm 的两条谱线，使用第二级光谱，光栅的总缝数至少为","options":["6000","1500","600","3000"],"answer":"D","explain":"分辨本领 R = λ/Δλ = 600/0.10 = 6.0×10³。\n又 R = kN，故 N = R/k = 6.0×10³/2 = 3.0×10³ 条。\n易错点：忘记除以级次得 6000；误按 4 级算得 1500；把 Δλ 当成 1.0 nm 得 600。"},{"id":"c17q021","type":"choice","difficulty":5,"tags":["白光光栅光谱","级次重叠判据"],"stem":"白光（400–700 nm）垂直照射光栅常数 d = 3.00 μm 的光栅。从哪一级开始，相邻两级光谱发生重叠","options":["第一级与第二级","第二级与第三级","第三级与第四级","任何相邻两级都不重叠"],"answer":"B","explain":"第 k 级光谱的角范围由 kλ_min 到 kλ_max，与第 k+1 级重叠的条件是 (k+1)λ_min \u003c kλ_max。\nk = 1：2×400 = 800 nm > 1×700 = 700 nm，第一、二级不重叠。\nk = 2：3×400 = 1200 nm \u003c 2×700 = 1400 nm，第二、三级重叠（第二级中 λ ≥ 600 nm 的部分与第三级短波端重合）。\n易错点：只比较角宽度而不比较 kλ；或误以为级次越高越不重叠。"},{"id":"c17q022","type":"choice","difficulty":5,"tags":["斜入射光栅","光栅方程的符号"],"stem":"光栅常数 d = 2.00 μm，λ = 500 nm 的平行光以与光栅法线成 i = 30.0° 的方向斜入射。取入射光与衍射光在法线同侧时 θ 为正，光栅方程写作 d(sinθ − sin i) = kλ，则 k = 1 的衍射角为","options":["48.6°","14.5°","30.0°","38.7°"],"answer":"A","explain":"由 d(sinθ − sin i) = kλ 得 sinθ = sin i + kλ/d。\n代入 sin30.0° = 0.500、λ/d = 500×10⁻⁹/2.00×10⁻⁶ = 0.250：sinθ = 0.500 + 0.250 = 0.750，θ = 48.6°。\n易错点：漏掉 sin i 得 14.5°（那是垂直入射时的第一级）；把 k = 0 的零级（θ = 30.0°）当第一级；把 λ/d 误算成 λ/(2d) 得 38.7°。"},{"id":"c17q023","type":"choice","difficulty":4,"tags":["布拉格衍射","晶面间距"],"stem":"X 射线波长 λ = 0.154 nm，在一组晶面上发生一级布拉格衍射，掠射角 θ = 21.0°（sin21.0° = 0.358）。该组晶面的晶面间距为","options":["0.430 nm","0.107 nm","0.215 nm","0.154 nm"],"answer":"C","explain":"布拉格公式 2d sinθ = kλ，k = 1：d = λ/(2 sinθ)。\n代入：d = 0.154/(2×0.358) = 0.215 nm。\n易错点：漏掉因子 2 得 0.430 nm；把 2 放到分子得 0.107 nm；直接把波长当晶面间距得 0.154 nm。注意 θ 是掠射角（与晶面夹角）。"},{"id":"c17q024","type":"choice","difficulty":5,"tags":["布拉格衍射级次","掠射限制"],"stem":"晶面间距 d = 0.282 nm 的晶体，用 λ = 0.154 nm 的 X 射线照射。最多能观察到几级布拉格衍射，第三级对应的掠射角约为","options":["3 级，55.0°","4 级，55.0°","3 级，24.2°","2 级，45.8°"],"answer":"A","explain":"由 2d sinθ = kλ 得 sinθ = kλ/(2d) = 0.273k，要求 sinθ ≤ 1，故 k ≤ 3.66，最多 3 级。\n第三级：sinθ = 3×0.154/(2×0.282) = 0.819，θ = 55.0°。\n易错点：把上限 3.66 进位成 4 级；漏掉因子 2 得 24.2°；用 2 级算又沿用 55.0° 造成自相矛盾。"},{"id":"c17q025","type":"choice","difficulty":4,"tags":["菲涅耳半波带","圆孔衍射中心明暗"],"stem":"λ = 500 nm 的平面波垂直入射到半径 ρ = 1.00 mm 的圆孔，观察点位于孔后 r₀ = 1.00 m 处。按半波带法，该圆孔在观察点处露出的半波带数和中心明暗为","options":["3 个，中心亮","1 个，中心亮","2 个，中心亮","2 个，中心暗"],"answer":"D","explain":"平面波入射时第 k 个半波带的半径满足 ρ² = kλr₀，故 k = ρ²/(λr₀)。\n代入：k = (1.00×10⁻³)²/(500×10⁻⁹×1.00) = 2.00，恰含 2 个半波带。\n相邻半波带到观察点的光程差为 λ/2、相位差 π，偶数个两两相消，中心为暗斑。\n易错点：以为半波带越多越亮；把偶数个当成同相叠加；把 ρ² = kλr₀ 记成 ρ = kλr₀ 得错误的 k。"},{"id":"c17q026","type":"choice","difficulty":3,"tags":["菲涅耳半波带","孔半径与半波带数"],"stem":"λ = 632.8 nm 的平面波垂直入射到圆孔，观察屏距孔 0.500 m。要使屏中心第一次由亮变暗，圆孔半径应为","options":["0.563 mm","0.795 mm","1.12 mm","0.398 mm"],"answer":"B","explain":"半波带半径 ρ = √(kλr₀)，中心明暗由露出的半波带数 k 的奇偶决定，第一次变暗需 k = 2（k = 1 时中心最亮）。\nρ = √(2×632.8×10⁻⁹×0.500) = √(6.328×10⁻⁷) = 7.95×10⁻⁴ m = 0.795 mm。\n易错点：按 k = 1 得 0.563 mm（那是最亮）；按 k = 4 得 1.12 mm（第二次变暗）；把根号里的 2 漏掉得 0.398 mm。"},{"id":"c17q027","type":"choice","difficulty":5,"tags":["望远镜有效放大率","出瞳与分辨"],"stem":"望远镜物镜口径 D = 50.0 mm，观察 λ = 550 nm 的星，配 20× 目镜，人眼瞳孔直径 3.00 mm。出瞳直径和维持物镜分辨本领所需的最小放大率分别为","options":["2.50 mm，16.7×","2.50 mm，1.67×","0.400 mm，16.7×","2.50 mm，167×"],"answer":"A","explain":"出瞳直径 = D/Γ = 50.0/20 = 2.50 mm，小于人眼瞳孔 3.00 mm，光束能全部进入眼睛。\n物镜分辨角 θ₁ = 1.22λ/D，人眼分辨角 θ₂ = 1.22λ/d_eye，要充分利用物镜分辨本领需 Γ ≥ θ₂/θ₁ = D/d_eye = 50.0/3.00 = 16.7。\n20× > 16.7×，放大率够用；再增大放大率只会放大衍射模糊，不会增加细节。\n易错点：把 Γ 取倒数得 1.67×；出瞳按 D·Γ 算得 0.400 mm；以为放大率越大分辨越好得 167×。"},{"id":"c17q028","type":"choice","difficulty":5,"tags":["单缝包络对干涉强度的调制","强度公式"],"stem":"双缝间距 d = 0.200 mm、缝宽 a = 0.0500 mm，λ = 600 nm 垂直入射。第二级干涉明纹中心处的强度与中央明纹中心处强度之比为","options":["0.811","0.405","0.047","0.164"],"answer":"B","explain":"双缝强度 I = I₀(sin u/u)²cos²(δ/2)，干涉极大处 cos² = 1，u = πa sinθ/λ。\n第二级满足 d sinθ = 2λ，故 u = πa(2λ/d)/λ = 2πa/d = π/2（因 d/a = 4）。\nI/I₀ = (sin(π/2)/(π/2))² = (2/π)² = 0.405。\n易错点：只算振幅比 2/π 得 0.811；把第一级次极大的 4.72% 搬来；把比值再平方一次得 0.164。"},{"id":"c17q029","type":"choice","difficulty":5,"tags":["单缝强度分布","次极大"],"stem":"单缝夫琅禾费衍射图样中，中央明纹两侧第一个次极大的强度与中央明纹强度之比约为","options":["4.50%","2.25%","4.72%","100%"],"answer":"C","explain":"单缝强度 I = I₀(sin u/u)²，u = πa sinθ/λ。次极大由 dI/du = 0 给出，即 tan u = u，第一个非零解 u = 1.43π。\nI/I₀ = (sin1.43π/1.43π)² = (0.976/4.49)² = 4.72%。\n第二个次极大约 1.6%，越往外越弱。\n易错点：把 u 取 3π/2 得 4.50%；忘记平方得 21.7%（再错算成 2.25%）；以为次极大与中央等强。"},{"id":"c17q030","type":"choice","difficulty":4,"tags":["双缝包络内条纹数","缝宽与间距比"],"stem":"双缝干涉实验中 λ = 500 nm，两缝中心间距 d = 0.100 mm，单缝衍射包络的中央明纹内共出现 7 条干涉明纹（d/a 取整数比）。缝宽 a 为","options":["0.0200 mm","0.0500 mm","0.0125 mm","0.0250 mm"],"answer":"D","explain":"单缝中央包络对应 |sinθ| \u003c λ/a，其内干涉级次满足 |k| \u003c d/a。d/a 为整数时，包络内条纹数为 2(d/a) − 1。\n由 2(d/a) − 1 = 7 得 d/a = 4，故 a = d/4 = 0.100/4 = 0.0250 mm。\n易错点：把公式记成 2(d/a) + 1 得 d/a = 3 → 0.0333 mm（未在选项）；按 d/a = 5 得 0.0200 mm；按 d/a = 2 得 0.0500 mm；按 d/a = 8 得 0.0125 mm。"},{"id":"c17q031","type":"choice","difficulty":4,"tags":["缺级条纹计数","中央包络"],"stem":"双缝的缝间距与缝宽之比 d/a = 5.00，单色平行光垂直入射。单缝衍射中央包络内可见的干涉明纹数目为","options":["11 条","9 条","5 条","10 条"],"answer":"B","explain":"中央包络范围为 |sinθ| \u003c λ/a，其中干涉级次 |k| \u003c d/a = 5。\n可取 k = 0、±1、±2、±3、±4，共 9 条；k = ±5 恰在单缝第一暗纹处，属于缺级、不可见。\n易错点：把缺级也算进去得 11 条；只数单侧得 5 条；忘记扣除缺级得 10 条。"},{"id":"c17q032","type":"choice","difficulty":5,"tags":["斜入射最大级次","sinθ ≤ 1 判断"],"stem":"光栅常数 d = 2.00 μm，λ = 550 nm 的平行光以 i = 30.0° 斜入射，光栅方程 d(sinθ − sin i) = kλ。在入射光同侧（θ 与 i 同号）能观察到的最高级次为","options":["1 级","2 级","3 级","5 级"],"answer":"A","explain":"同侧要求 sinθ = sin i + kλ/d ≤ 1，故 k ≤ (1 − sin i)d/λ。\n代入：k ≤ (1 − 0.500)×2.00×10⁻⁶/550×10⁻⁹ = 1.82，最高 1 级（sinθ = 0.775，θ = 50.8°）。\n易错点：把 1.82 进位成 2 级；漏掉 sin i 按垂直入射算得 d/λ = 3.64 → 3 级；用 1 + sin i 算得 5.45 → 5 级（那是异侧的上限）。"},{"id":"c17q033","type":"choice","difficulty":4,"tags":["光栅分辨本领","钠双线"],"stem":"光栅宽 25.0 mm，每毫米 400 条刻线，用第二级光谱观察钠双线 589.0 nm 与 589.6 nm。能否分辨这两条谱线","options":["能，R = 2.0×10⁴，所需仅 9.8×10²","能，R = 1.0×10⁴，所需仅 9.8×10²","不能，R = 2.0×10⁴，所需 5.9×10⁴","不能，R = 8.0×10³，所需 9.8×10²"],"answer":"A","explain":"总缝数 N = 400×25.0 = 1.00×10⁴，第二级的分辨本领 R = kN = 2.0×10⁴。\n分辨钠双线所需 R = λ/Δλ = 589.3/0.6 = 9.8×10²，远小于 2.0×10⁴，能分辨。\n易错点：把 N 当 R 得 1.0×10⁴（结论仍对但数值错）；把 Δλ 当 0.01 nm 得 5.9×10⁴；N 算成 4000 得 8.0×10³。"},{"id":"c17q034","type":"choice","difficulty":5,"tags":["大衍射角","小角近似失效"],"stem":"单缝宽 a = 1.20 μm，用 λ = 600 nm 的平行光垂直照射。第一级暗纹的衍射角和中央明纹的角宽度分别为","options":["28.6°，57.3°","30.0°，60.0°","30.0°，30.0°","14.5°，29.0°"],"answer":"B","explain":"第一级暗纹 a sinθ = λ，sinθ = 600×10⁻⁹/1.20×10⁻⁶ = 0.500，故 θ = 30.0°。\n中央明纹角宽度为两侧第一暗纹之间，Δθ = 2θ = 60.0°。\n此处 sinθ = 0.5 已不小，不能用 sinθ ≈ θ：若强行用小角近似会得 θ ≈ 0.500 rad = 28.6°、Δθ = 57.3°，误差明显。\n易错点：习惯性套小角近似；把半角当角宽度得 30.0°；把 λ/a 当 sin(2θ) 得 14.5°。"},{"id":"c17q035","type":"choice","difficulty":5,"tags":["白光光栅光谱","级次重叠"],"stem":"白光（400–700 nm）垂直照射光栅常数 d = 2.00 μm 的光栅。第二级光谱中 λ = 600 nm 的谱线与第三级光谱中 λ = 400 nm 的谱线","options":["重合于 θ = 36.9° 处","重合于 θ = 17.5° 处","不重合，第二级的衍射角更大","不重合，第三级的衍射角更大"],"answer":"A","explain":"光栅方程 d sinθ = kλ，谱线位置只由乘积 kλ 决定。\n计算：2×600 = 1200 nm，3×400 = 1200 nm，两者 kλ 相等，故出现在同一方向：sinθ = 1200×10⁻⁹/2.00×10⁻⁶ = 0.600，θ = 36.9°。\n一般地，第 k 级与第 k+1 级从 kλ_max > (k+1)λ_min 起开始重叠。\n易错点：按级次高低直接判断角大小；把 600/2000 = 0.300 当作角度算得 17.5°；忘记 kλ 才是决定量。"},{"id":"c17q036","type":"calc","difficulty":4,"tags":["单缝多问","明纹暗纹位置"],"stem":"单缝宽 a = 0.100 mm，用 λ = 600 nm 的平行光垂直照射，缝后透镜焦距 f = 2.00 m。求：(1) 中央明纹的角宽度和焦面上的线宽度；(2) 第二级明纹到中央的距离；(3) 第三级暗纹到中央的距离；(4) 若把缝宽增大到 0.200 mm，第二级明纹到中央的距离变为多少。","answer":"(1) 1.20×10⁻² rad，24.0 mm；(2) 30.0 mm；(3) 36.0 mm；(4) 15.0 mm","explain":"(1) 中央明纹角宽度 Δθ = 2λ/a = 2×600×10⁻⁹/1.00×10⁻⁴ = 1.20×10⁻² rad，线宽度 Δx = fΔθ = 2.00×1.20×10⁻² = 2.40×10⁻² m = 24.0 mm。\n(2) 第 k 级明纹满足 a sinθ = (2k+1)λ/2，k = 2 时 sinθ = 5λ/(2a) = 1.50×10⁻²，x = f tanθ ≈ 30.0 mm。\n(3) 第三级暗纹 a sinθ = 3λ，sinθ = 1.80×10⁻²，x = 36.0 mm。\n(4) 各级位置都与 a 成反比，缝宽加倍后第二级明纹移到 15.0 mm，条纹变密、变暗。\n易错点：明纹用 (2k+1)λ/2 而暗纹用 kλ；位置换算时要用 tanθ（小角下才近似等于 sinθ）。"},{"id":"c17q037","type":"calc","difficulty":5,"tags":["双缝干涉与单缝衍射组合","缺级与强度"],"stem":"双缝间距 d = 0.400 mm、缝宽 a = 0.100 mm，λ = 500 nm 的平行光垂直入射，屏上观察干涉与衍射的组合图样，透镜焦距 f = 1.00 m。求：(1) 哪些级次的干涉明纹缺失；(2) 单缝衍射中央包络内能看到几条干涉明纹；(3) 第二级干涉明纹中心处的强度与中央明纹中心强度之比；(4) 第二级明纹到中央的距离。","answer":"(1) k = 4k'，缺 4、8、12…级；(2) 7 条；(3) I/I₀ = (2/π)² = 0.405；(4) 2.50 mm","explain":"(1) 缺级条件 d sinθ = kλ 与 a sinθ = k'λ 同时成立，得 k = (d/a)k' = 4k'，故 4、8、12…级缺失。\n(2) 中央包络内 |k| \u003c d/a = 4，可取 k = 0、±1、±2、±3，共 7 条（k = ±4 在包络零点上）。\n(3) 第二级处 u = πa sinθ/λ = πka/d = π/2，干涉极大 cos² = 1，I/I₀ = (sin u/u)² = (2/π)² = 0.405。\n(4) x = 2λf/d = 2×500×10⁻⁹×1.00/4.00×10⁻⁴ = 2.50×10⁻³ m = 2.50 mm。\n易错点：包络内条纹数是 2(d/a)−1；强度比必须同时算单缝因子与干涉因子，缺级处包络因子为零。"},{"id":"c17q038","type":"calc","difficulty":4,"tags":["圆孔衍射","爱里斑与分辨"],"stem":"直径 D = 5.00 mm 的圆孔后放焦距 f = 1.50 m 的透镜，用 λ = 550 nm 的平行光垂直照射。求：(1) 爱里斑的半角宽度；(2) 焦面上爱里斑的半径；(3) 在 1.00 km 处按瑞利判据能分辨的两点最小间距。","answer":"(1) 1.34×10⁻⁴ rad；(2) 0.201 mm；(3) 0.134 m","explain":"(1) 爱里斑半角 θ = 1.22λ/D = 1.22×550×10⁻⁹/5.00×10⁻³ = 1.34×10⁻⁴ rad。\n(2) 焦面上半径 r = fθ = 1.50×1.34×10⁻⁴ = 2.01×10⁻⁴ m = 0.201 mm（爱里斑直径 0.402 mm）。\n(3) 1.00 km 处两点的最小间距 s = Lθ = 1.00×10³×1.34×10⁻⁴ = 0.134 m。\n易错点：θ 是中心到第一暗环的半角，直径对应 2.44λ/D；分辨判据用半角而不是半径。"},{"id":"c17q039","type":"calc","difficulty":5,"tags":["显微镜分辨极限","分辨本领提高"],"stem":"某显微镜物镜的数值孔径 NA = n sin u = 1.25，使用 λ = 550 nm 的光。求：(1) 最小分辨距离；(2) 若改用 NA = 1.40 的物镜并把波长换成 400 nm，最小分辨距离变为多少；(3) 分辨本领提高了几倍。","answer":"(1) 268 nm；(2) 174 nm；(3) 分辨本领提高 1.54 倍（最小分辨距离变为原来的 0.649）","explain":"(1) d = 0.61λ/NA = 0.61×550×10⁻⁹/1.25 = 2.68×10⁻⁷ m = 268 nm。\n(2) d' = 0.61×400×10⁻⁹/1.40 = 1.74×10⁻⁷ m = 174 nm。\n(3) 分辨本领之比 = d/d' = 268/174 = 1.54，其中缩短波长贡献 550/400 = 1.375 倍，增大数值孔径贡献 1.40/1.25 = 1.12 倍。\n易错点：显微镜用 0.61λ/NA，只有圆孔（望远镜）才用 1.22λ/D；提高分辨本领靠缩短波长和提高 n sin u。"},{"id":"c17q040","type":"calc","difficulty":4,"tags":["光栅常数","最大级次与半角宽度"],"stem":"一块光栅每毫米 500 条刻线、总宽 10.0 mm，用 λ = 600 nm 的平行光垂直照射。求：(1) 光栅常数和总缝数；(2) 能观察到的最高级次；(3) 第二级明纹的衍射角；(4) 第二级明纹的半角宽度。","answer":"(1) d = 2.00 μm，N = 5000；(2) 最高 3 级；(3) 36.9°；(4) 7.50×10⁻⁵ rad","explain":"(1) d = 1/(500 mm⁻¹) = 2.00×10⁻⁶ m = 2.00 μm；N = 500×10.0 = 5000 条。\n(2) 由 |sinθ| = kλ/d ≤ 1 得 k ≤ 2.00/0.600 = 3.33，最高 3 级（sinθ = 0.900）。\n(3) 第二级 sinθ = 2×600×10⁻⁹/2.00×10⁻⁶ = 0.600，θ = 36.9°。\n(4) 半角宽度 Δθ = λ/(Nd cosθ) = 600×10⁻⁹/(5000×2.00×10⁻⁶×0.800) = 7.50×10⁻⁵ rad。\n易错点：级次向下取整；半角宽度反比于总缝数 N，分母还有 cosθ。"},{"id":"c17q041","type":"calc","difficulty":5,"tags":["光栅分辨本领设计","R = kN 应用"],"stem":"要设计一块光栅，使其在 λ = 400.0 nm 附近用第二级光谱能分辨波长相差 Δλ = 0.0100 nm 的两条谱线，光栅总宽取 20.0 mm。求：(1) 所需分辨本领；(2) 所需总缝数；(3) 每毫米最少刻线数和光栅常数；(4) 该光栅第二级明纹的衍射角与半角宽度。","answer":"(1) R = λ/Δλ = 4.00×10⁴；(2) N = 2.00×10⁴ 条；(3) 至少 1.00×10³ 条/mm，d = 1.00 μm；(4) θ = 53.1°，Δθ = 3.33×10⁻⁵ rad","explain":"(1) R = λ/Δλ = 400.0/0.0100 = 4.00×10⁴。\n(2) 由 R = kN 得 N = R/k = 4.00×10⁴/2 = 2.00×10⁴ 条。\n(3) 线密度 N/L = 2.00×10⁴/20.0 = 1.00×10³ 条/mm，故 d = 1/1000 mm = 1.00 μm。\n(4) 第二级 sinθ = 2×400×10⁻⁹/1.00×10⁻⁶ = 0.800，θ = 53.1°，cosθ = 0.600；Δθ = λ/(Nd cosθ) = 400×10⁻⁹/(2.00×10⁴×1.00×10⁻⁶×0.600) = 3.33×10⁻⁵ rad。\n易错点：R = kN 里的 N 是总缝数而不是刻线密度；先定 N 再由总宽求线密度。"},{"id":"c17q042","type":"calc","difficulty":5,"tags":["斜入射光栅","级次范围"],"stem":"光栅常数 d = 2.00 μm，λ = 600 nm 的平行光以与法线成 i = 30.0° 的方向斜入射，取同侧为正，光栅方程 d(sinθ − sin i) = kλ。求：(1) 零级衍射方向；(2) k = 1 的衍射角；(3) k = −1 的衍射角；(4) 同侧和异侧各自能观察到的最高级次（要求 |sinθ| \u003c 1）。","answer":"(1) 30.0°；(2) 53.1°；(3) 11.5°；(4) 判据 k ≤ (1 − sin i)d/λ、k ≥ −(1 + sin i)d/λ，同侧最高 1 级，异侧最高 4 级（第 5 级恰为掠射）","explain":"(1) k = 0 时 sinθ = sin i，零级沿入射光方向，θ = 30.0°。\n(2) 同侧 k = 1：sinθ = 0.500 + 0.300 = 0.800，θ = 53.1°。\n(3) 异侧 k = −1：sinθ = 0.500 − 0.300 = 0.200，θ = 11.5°。\n(4) 由 sinθ = sin i + kλ/d 得：同侧 k \u003c (1 − 0.500)d/λ = 1.67，最高 1 级；异侧 k > −(1 + 0.500)d/λ = −5.0，第 5 级 sinθ = −1 为掠射，实际可观测 4 级。\n易错点：斜入射时级次范围关于零级不对称，两侧上限分别是 (1 − sin i)d/λ 和 (1 + sin i)d/λ，必须分开讨论。"},{"id":"c17q043","type":"calc","difficulty":4,"tags":["白光光栅光谱","光谱重叠"],"stem":"白光（400–700 nm）垂直照射光栅常数 d = 3.00 μm 的光栅。求：(1) 第一级光谱的角范围；(2) 第二级光谱的角范围；(3) 判断第二级与第三级是否重叠，并求开始重叠的波长关系与对应的衍射角。","answer":"(1) 7.66°–13.5°；(2) 15.5°–27.8°；(3) 重叠，判据 2λ = 3×400 nm，从第二级 600 nm 与第三级 400 nm 起，θ = 23.6°","explain":"(1) 第一级 sinθ = λ/d：400 nm 对应 0.1333（7.66°），700 nm 对应 0.2333（13.5°）。\n(2) 第二级 sinθ = 2λ/d：400 nm 对应 0.2667（15.5°），700 nm 对应 0.4667（27.8°）。\n(3) 判据 (k+1)λ_min \u003c kλ_max：k = 2 时 3×400 = 1200 nm \u003c 2×700 = 1400 nm，故第二、三级重叠；k = 1 时 800 nm > 700 nm，第一、二级不重叠。\n重叠起点为 2λ = 3×400 nm，即第二级 600 nm 与第三级 400 nm 同角：sinθ = 0.400，θ = 23.6°。\n易错点：只比较角宽度而不比较 kλ；忽略更高级次可能超出 sinθ ≤ 1。"},{"id":"c17q044","type":"calc","difficulty":4,"tags":["布拉格衍射","级次判断"],"stem":"X 射线波长 λ = 0.154 nm，照射某晶体的一组晶面，测得一级布拉格衍射的掠射角为 21.0°（sin21.0° = 0.358）。求：(1) 晶面间距；(2) 二级衍射的掠射角；(3) 这组晶面最多能观察到几级衍射。","answer":"(1) 0.215 nm；(2) 45.8°；(3) 最多 2 级","explain":"(1) 2d sinθ = kλ，k = 1：d = 0.154/(2×0.358) = 0.215 nm。\n(2) k = 2：sinθ = 2×0.154/(2×0.215) = 0.717，θ = 45.8°。\n(3) 由 sinθ ≤ 1 得 k ≤ 2d/λ = 0.430/0.154 = 2.79，最多 2 级；第 3 级要求 sinθ = 1.07，不存在。\n易错点：漏掉因子 2；把 θ 当成与法线的夹角；用 2.79 四舍五入成 3 级。"},{"id":"c17q045","type":"calc","difficulty":5,"tags":["布拉格衍射","立方晶格与晶面指数"],"stem":"某简单立方晶体的晶格常数为 a，用 λ = 0.154 nm 的 X 射线照射，在 (100) 晶面上测得一级衍射的掠射角为 15.8°（sin15.8° = 0.272）。求：(1) 晶格常数 a；(2) 若换用 λ = 0.100 nm 的 X 射线，同一组晶面的一级掠射角；(3) 仍用 λ = 0.154 nm 时，(200) 晶面的一级掠射角。","answer":"(1) a = 0.283 nm；(2) 10.2°；(3) 33.0°","explain":"(1) 简单立方 (100) 面的晶面间距等于晶格常数，由 2a sinθ = λ 得 a = 0.154/(2×0.272) = 0.283 nm。\n(2) 换 λ = 0.100 nm：sinθ = 0.100/(2×0.283) = 0.177，θ = 10.2°，波长变短衍射角变小。\n(3) (200) 面间距 d = a/2 = 0.141 nm，sinθ = 0.154/(2×0.141) = 0.545，θ = 33.0°。\n易错点：把 (200) 面间距当成 a；把掠射角当成与法线夹角；波长与衍射角的关系记反。"},{"id":"c17q046","type":"calc","difficulty":5,"tags":["菲涅耳半波带","圆孔衍射"],"stem":"λ = 500 nm 的平面波垂直入射到半径可调的圆孔，观察屏距孔 r₀ = 2.00 m。求：(1) 屏中心第一次变为暗斑时的孔半径；(2) 第二次变为暗斑时的孔半径；(3) 若孔半径为 1.00 mm，屏中心是亮还是暗，露出几个半波带。","answer":"(1) ρ = √(2λr₀) = 1.41 mm；(2) ρ = √(4λr₀) = 2.00 mm；(3) k = ρ²/(λr₀) = 1，亮","explain":"(1) 平面波入射时 ρ² = kλr₀，中心变暗需偶数个半波带，第一次取 k = 2：ρ = √(2×500×10⁻⁹×2.00) = 1.41×10⁻³ m = 1.41 mm。\n(2) 第二次取 k = 4：ρ = √(4λr₀) = 2.00 mm，可见 ρ ∝ √k，相邻暗斑半径之比为 √2。\n(3) ρ = 1.00 mm 时 k = ρ²/(λr₀) = 1.00×10⁻⁶/1.00×10⁻⁶ = 1，只露出 1 个半波带，中心为亮斑。\n易错点：把“第一次变暗”当成 k = 1；孔半径连续增大时中心明暗交替而不是单调变暗。"},{"id":"c17q047","type":"calc","difficulty":5,"tags":["单缝强度分布","超越方程"],"stem":"单缝夫琅禾费衍射的强度分布为 I = I₀(sin u/u)²，其中 u = πa sinθ/λ。求：(1) 次极大满足的方程；(2) 第一个次极大对应的 u 和 sinθ 的表达式；(3) 该次极大与中央明纹的强度比；(4) 当 a = 0.100 mm、λ = 500 nm 时，第一个次极大的衍射角。","answer":"(1) tan u = u；(2) u = 1.43π，sinθ = 1.43λ/a；(3) 4.72%；(4) 0.410°","explain":"(1) 令 dI/du = 0：d/du[(sin u/u)²] = 2(sin u/u)(u cos u − sin u)/u² = 0，除 u = 0 与 sin u = 0（极小）外，得 tan u = u。\n(2) 该超越方程第一个非零解 u = 1.43π ≈ 4.49，由 u = πa sinθ/λ 得 sinθ = 1.43λ/a。\n(3) I/I₀ = (sin1.43π/1.43π)² = (0.976/4.49)² = 4.72%。\n(4) sinθ = 1.43×500×10⁻⁹/1.00×10⁻⁴ = 7.15×10⁻³，θ = 0.410°。\n易错点：把次极大位置取在 sin u = 0 处（那是暗纹）或 u = 3π/2（tan u 发散处）。"},{"id":"c17q048","type":"calc","difficulty":4,"tags":["单缝衍射测量","介质中波长"],"stem":"单缝衍射实验中，透镜焦距 f = 1.20 m，用 λ = 600 nm 的平行光垂直照射，测得焦面上中央明纹线宽为 6.00 mm。求：(1) 缝宽；(2) 若在缝与透镜之间充满 n = 1.33 的水，中央明纹线宽变为多少；(
